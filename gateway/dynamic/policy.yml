# Gateway policy — the part that is NOT a label on a container.
#
# A service must not be able to relax the rule that constrains it. Labels are
# owned by whoever writes the service's compose block; this file is owned by the
# platform and reviewed as policy. That distinction is the reason /internal
# lives here and not in a `traefik.http.routers.*` label on pay.

http:
  middlewares:
    # ---------------------------------------------------- /internal refusal --
    # THE INVARIANT, MOVED.
    #
    # This USED TO SAY that the refusal was "a path rule in
    # deploy/cloudflared/config.example.yml and a CI job
    # (.github/workflows/ci.yml) that parses that YAML". Neither existed.
    # There was no cloudflared/ directory in this repository at all, and ci.yml
    # had one job in it, running scripts/surface-routes.py — so this file, and
    # README.md, and docker-compose.gateway.yml, all cited a control that
    # was never written. That is the failure surface-routes.py's check 4 exists
    # for ("A ROUTER DESCRIBED IN PROSE IS NOT A ROUTER"), one directory over,
    # where check 4 could not see it because it only reads gateway/dynamic/*.yml.
    #
    # Both copies are real now. The edge copy is the FIRST ingress rule in every
    # cloudflared/config.*.yml, generated by cloudflared/gen.py and diffed by CI;
    # the in-host copy is cf-internal-refusal below, at priority 100000.
    # AD-17 moves TLS and routing to the gateway, so the mechanism moves — and
    # the invariant has to move with it or the check keeps passing against a
    # file nothing reads any more, which is worse than no check.
    #
    # Why it matters: Pay's /internal routes take a `userId` as a PARAMETER
    # rather than reading it from an authenticated session. Reaching one from
    # off the box is an act-as-anyone primitive. The service's own auth is a
    # second gate, not the first one; this is the first one.
    #
    # Case-insensitive and tolerant of leading-slash duplication for the same
    # reason the cloudflared rule is: `//Internal/x` and `/%2finternal` are the
    # shapes a path filter is bypassed with.
    # Traefik has no "deny" middleware, so the refusal is a ROUTER (below) at a
    # priority nothing can outrank, pointed at an unreachable service. A
    # middleware chain cannot refuse a request; a route can.

    # ------------------------------------------------------------- CORS ------
    # ONE list, not eight. The estate carries CORS_ORIGINS in every service's
    # environment and it has already drifted: :4004 was in nimbus's copy and
    # missing from everyone else's, so ForgeMint's SPA could sign in locally and
    # could not call Pay, while production worked. A second list buys nothing
    # and costs exactly that bug.
    #
    # Never a wildcard. `allowCredentials: true` with `*` is rejected by
    # browsers anyway, and an allowlist that has to be written out is an
    # allowlist somebody has to justify.
    cf-cors:
      headers:
        accessControlAllowOriginList:
          # ── THE HARD-CODED MAINNET BLOCK IS GONE, AND ITS DELETION IS A FIX ───
          #
          # Fifteen literal `https://<sub>.cloudsforge.online` origins stood here, above the
          # templated block, with a comment saying they were what the list rendered to when
          # `CF_WEB_APEX` was unset "which production does not set". Production HAS set it since
          # `compose/env/traefik.env` gained `CF_WEB_APEX=cloudsforge.online`, so on mainnet the
          # two halves had become byte-for-byte the same fifteen origins, written twice.
          #
          # THE SECOND COPY WAS NOT MERELY REDUNDANT. Both compose projects on this host read THIS
          # FILE — there is one `gateway/dynamic/`, and the testnet gateway mounts it too. So the
          # testnet gateway carried fifteen MAINNET origins in a list that sets
          # `allowCredentials: true`, which is a page on `hub.cloudsforge.online` being permitted
          # to read a credentialed response from `nimbus-testnet.cloudsforge.online`. Two
          # environments that share an apex make that reachable rather than theoretical, and it is
          # the same cross-environment leak the whole 2026-08-05 rename exists to close — sitting
          # in the file that is supposed to be the one place origins are justified.
          #
          # With it gone there is ONE list, rendered per environment from the variables that
          # environment's env file sets. `scripts/surface-routes.py` check 5 already read only the
          # templated half and is unaffected; what it now checks is the whole of the truth rather
          # than half of it.
          #
          # UNSET IS STILL A SUPPORTED MODE AND STILL MEANS "ALLOW NOTHING". With CF_WEB_SUFFIX
          # unset this renders an empty list, and estate-web.yml renders no routers at all — so
          # there is no surface for an origin to belong to. The two agree, which they did not
          # before: the old literal block granted fifteen production origins on a gateway that was
          # simultaneously serving none of them.
{{ if env "CF_WEB_SUFFIX" }}
          # ── EVERY SURFACE, ON THIS ENVIRONMENT'S OWN HOSTNAMES ─────────────
          #
          # Seventeen surfaces, on whatever hostnames this deployment serves them on. Present only
          # when `CF_WEB_SUFFIX` is set; with it unset this renders to nothing, which is the same
          # answer estate-web.yml gives to the same question — no routers, therefore no origins.
          #
          # ── WHY THE VARIABLE IS A SUFFIX AND NOT AN APEX ───────────────────
          #
          # `CF_WEB_SUFFIX` is everything after a surface's own name: `.cloudsforge.online` on
          # mainnet, `-testnet.cloudsforge.online` on testnet. So `hub` + suffix is
          # `hub.cloudsforge.online` or `hub-testnet.cloudsforge.online`, and the two environments
          # share one apex instead of nesting one inside the other.
          #
          # They nest no longer because the nested form was unreachable. Cloudflare's Universal
          # SSL is `*.cloudsforge.online` plus the apex and a wildcard matches ONE label, so
          # `hub.testnet.cloudsforge.online` failed the TLS handshake at the edge before a request
          # reached this gateway. A CORS entry for an origin a browser can never load is not a
          # security control, it is a decoration.
          #
          # `CF_SITE_HOST` is the one surface this cannot express: the marketing site's registry
          # subdomain is the empty string, and `-testnet.cloudsforge.online` is not a legal DNS
          # label. Its host is `cloudsforge.online` or `testnet.cloudsforge.online`, declared
          # rather than derived, and `scripts/estate-up.sh` refuses to start if the two disagree.
          #
          # It has to be here rather than in a second middleware: `cf-cors` is applied to every
          # router on `websecure` by the entryPoint chain
          # (compose/docker-compose.gateway.yml), so a second CORS middleware would run beside
          # this one on the same request rather than instead of it, and two middlewares each
          # setting `Access-Control-Allow-Origin` is not a configuration anyone should have to
          # reason about at 3am.
          #
          # The file provider renders this Go template BEFORE parsing the YAML, which is why a
          # conditional can sit mid-list at all — and why the indentation below is load-bearing
          # in a way a YAML-aware editor will not warn about.
          #
          # For the same reason NOTHING in this file may write a template action inside a
          # comment: the renderer does not know what a comment is, and an unclosed one takes
          # every file in this directory down with it. See the header of estate-web.yml for the
          # incident and for the canary that catches it.
          - https://{{ env "CF_SITE_HOST" }}
          - https://hub{{ env "CF_WEB_SUFFIX" }}
          - https://market{{ env "CF_WEB_SUFFIX" }}
          - https://create{{ env "CF_WEB_SUFFIX" }}
          - https://trade{{ env "CF_WEB_SUFFIX" }}
          - https://worlds{{ env "CF_WEB_SUFFIX" }}
          - https://explorer{{ env "CF_WEB_SUFFIX" }}
          - https://network{{ env "CF_WEB_SUFFIX" }}
          - https://developers{{ env "CF_WEB_SUFFIX" }}
          - https://admin{{ env "CF_WEB_SUFFIX" }}
          - https://status{{ env "CF_WEB_SUFFIX" }}
          - https://foresight{{ env "CF_WEB_SUFFIX" }}
          - https://emberkin{{ env "CF_WEB_SUFFIX" }}
          - https://aetherholm{{ env "CF_WEB_SUFFIX" }}
          - https://tessera{{ env "CF_WEB_SUFFIX" }}
          # ── the two operator consoles ──────────────────────────────────────
          #
          # `lantern.` and `beacon.` were API-only hostnames until micro-lantern-web
          # and micro-beacon-web joined this estate. They are here for the reason
          # every entry above them is here — sign-in is cross-origin from every
          # surface, `consumeAuthCallback` posts to `nimbus.<apex>/auth/handoff/redeem`
          # from whatever origin the page is on, and an origin missing from this
          # list cannot complete one. Both bundles are `adminOnly`, so a missing
          # entry does not degrade them: it leaves a sign-in panel that never
          # succeeds, which is the failure shape hardest to attribute.
          #
          # They need NOTHING for their own APIs. Both share a hostname with the
          # service they read (estate-web.yml, the `cf-web-lantern`/`cf-api-lantern`
          # and `cf-web-beacon`/`cf-api-beacon` pairs), so `resolveApiBase()`
          # returns the empty string and every one of those requests is
          # same-origin. That is not an optimisation for beacon — micro-beacon
          # sends no `access-control-*` header of its own and 404s a preflight,
          # so same-origin is the only arrangement a browser can use, and no
          # entry in this list could have substituted for it.
          #
          # They used to be deliberately absent from a second, hard-coded
          # `cloudsforge.online` block above this one — "an allowlist entry for a
          # production origin nothing serves is the `mint.cloudsforge.online`
          # defect written fresh". That block is deleted and the distinction with
          # it: there is one list now, and it names what THIS environment serves.
          - https://lantern{{ env "CF_WEB_SUFFIX" }}
          - https://beacon{{ env "CF_WEB_SUFFIX" }}
          # ── the mining pool console, and the one entry here that nothing calls yet ──
          #
          # `pool.<apex>` serves micro-pool-web. Every other origin above is here because
          # `consumeAuthCallback` POSTs to `nimbus.<apex>/auth/handoff/redeem` from the page's own
          # origin, and this one does not: `pool-web/src/components/shell.tsx` deliberately mounts
          # neither `CloudsForgeBar` nor `AccountMenu`, on the argument that the only identity a
          # miner has here is the stratum username in their own firmware — micro-pool takes no
          # bearer token on any route, so a "Sign in" button would lead nowhere. Its own API is
          # same-origin, split by path on this same hostname (`cf-web-pool`/`cf-api-pool` in
          # estate-web.yml), exactly like lantern and beacon.
          #
          # SO WHY IS IT HERE. `scripts/surface-routes.py` check 5 keys on `servesUi`, with no
          # exemption table, and that is the right predicate rather than an approximation: the four
          # drifts recorded above were all found by a human noticing a broken page, because a
          # missing origin fails closed and SILENTLY. Carving out the one surface that happens not
          # to sign in today would trade a caught defect for an uncaught one the day it does — the
          # bar's absence is a product decision that a future session may reverse in ten minutes,
          # and nothing would connect that edit to this file.
          #
          # This entry alone would NOT be enough for a sign-in. `IDENTITY_HANDOFF_ORIGINS` in
          # docker-compose.estate.yml is a second, independent allowlist that identity checks
          # against the browser's own `Origin` header, and `pool` is deliberately absent from it.
          # Whoever mounts the bar here must add it there too.
          - https://pool{{ env "CF_WEB_SUFFIX" }}
{{ end }}
{{ if env "CF_VIEW_ORIGIN_SUFFIX" }}
          # ══ THE COMBINED VIEW: THREE ORIGINS ON THE *OTHER* ENVIRONMENT ══════════════════════
          #
          # micro-org#459 retired the testnet FRONTENDS and kept the testnet ESTATE. A reader now
          # opens `hub.cloudsforge.online`, chooses Testnet in the bar, and the same bundle reads
          # `hub-testnet.cloudsforge.online` — so the request is cross-origin, it carries the
          # reader's bearer, and the origin it comes from is a hostname of the OTHER environment.
          # Nothing above names such an origin, by construction: the block above is "every surface
          # on THIS environment's own hostnames", which is exactly what it should be.
          #
          # THE OBSERVED FAILURE. `curl -X OPTIONS https://hub-testnet.cloudsforge.online/v1/portfolio
          # -H 'Origin: https://hub.cloudsforge.online'` answered `HTTP/2 200` with
          # `access-control-allow-credentials: true` and NO `access-control-allow-origin`. A browser
          # reads that as a refusal, so every testnet read from the merged frontend failed at the
          # preflight and the pages rendered "that did not load, cannot reach the server" — which
          # is the bug as the reader reported it.
          #
          # ── WHY A SEPARATE VARIABLE, AND WHY IT IS SET IN ONE ENVIRONMENT ONLY ────────────────
          #
          # THE ASYMMETRY IS THE SECURITY PROPERTY. `CF_VIEW_ORIGIN_SUFFIX` is set in
          # `compose/env/traefik.testnet.env` and NOWHERE ELSE, so the testnet estate accepts reads
          # from the mainnet frontends and the mainnet estate accepts nothing from testnet. A page
          # on a testnet hostname must never read a credentialed mainnet response — that direction
          # moves real value and has no product reason to exist, and `allowCredentials: true` is
          # what makes the distinction matter. Deriving this from `CF_WEB_SUFFIX` instead (say, "the
          # other environment's suffix") would grant BOTH directions from one edit, in a file both
          # gateways mount, which is the exact defect the deleted hard-coded block above was.
          #
          # Unset renders nothing, and unset is the safe reading: an environment nobody views from
          # somewhere else needs no entry here. `scripts/estate-up.sh` refuses to start if it is set
          # to this environment's own suffix, because a viewer suffix equal to your own is a no-op
          # that looks like a grant.
          #
          # ── IT WAS THREE. IT IS NOW EVERY FRONTEND, AND THAT CHANGE IS THE FIX ────────────────
          #
          # It used to be `hub`, `explorer` and `network` — the three bundles that then carried a
          # `lib/viewed.ts`. Everything else was expected to switch network by NAVIGATING, so its
          # reads would be same-origin on whichever hostname it landed on. That expectation was
          # already false when it was written, because micro-org#459 had retired the `-testnet` web
          # hostnames there was nowhere left to navigate TO. The owner's report:
          #
          #     "i see basically that in every page when you press testnet it take you to network
          #      page testet and if you switch product its reset to mainnet"
          #
          # Both halves are one defect. A surface that could not view got an escape route to Forge
          # Network on testnet, which answers a different question than the reader asked; and having
          # arrived on a bundle that COULD view, every onward product link went to one that could
          # not, so the choice evaporated at the next click.
          #
          # The fix is that every frontend views in place. Each of the eighteen now has a
          # `src/lib/viewed.ts` built from `createNetworkView` in `@cloudsforge/ui/network-view`,
          # and each one's `apiBase()` reads `viewedHosts()`. So each one, on the mainnet estate,
          # can now issue a credentialed read to its own `-testnet` sibling — and every one of those
          # reads needs its mainnet origin named HERE or the browser refuses the preflight.
          #
          # THE OBSERVED SHAPE OF THAT REFUSAL, before this list was widened:
          #   curl -X OPTIONS https://market-testnet.cloudsforge.online/v1/listings \
          #     -H 'Origin: https://market.cloudsforge.online' -H 'Access-Control-Request-Method: GET'
          #   → HTTP/2 200, `access-control-allow-credentials: true`, and NO
          #     `access-control-allow-origin`. Hub, being in this list, got one. That was the gap.
          #
          # ── WHAT IS STILL *NOT* HERE, AND WHY THAT IS NOT AN OVERSIGHT ────────────────────────
          #
          #   wallet, signin, faucet   registry rows with a `basePath` INSIDE hub and network. Their
          #                            bundle is hub-web / network-site, which is already named, and
          #                            an entry of their own would be a duplicate subdomain in this
          #                            list rather than a new grant.
          #   nimbus, account          identity. Pinned in `NETWORK_PINNED_SURFACES`: one identity is
          #                            the PREMISE of the combined view, so a session refresh never
          #                            crosses to the estate that did not mint it.
          #   the API surfaces         `api`, `foresight-api` and friends serve no UI, so no browser
          #                            ever sends an Origin header FROM one.
          #
          # `scripts/surface-routes.py` check 10 derives this list from the registry now rather than
          # from a hard-coded copy: every `viewsAnyNetwork` surface must appear, every name here must
          # be one, the repository named on each row must actually contain the `src/lib/viewed.ts`
          # that performs it, and this list must stay a subset of the same-environment block above.
          # The subset is the load-bearing half — it is what stops a surface entering the estate
          # through the weaker door — and it is a plain subset rather than a strict one now, because
          # every UI surface views and a strict subset would just be a headcount that always fails.
          - https://{{ env "CF_VIEW_SITE_HOST" }}
          - https://hub{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://market{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://create{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://trade{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://worlds{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://explorer{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://network{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://developers{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://admin{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://status{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://foresight{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://emberkin{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://aetherholm{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://tessera{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://lantern{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://beacon{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
          - https://pool{{ env "CF_VIEW_ORIGIN_SUFFIX" }}
{{ end }}
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders:
          - content-type
          - authorization
          - x-request-id
          - traceparent
          - tracestate
          - baggage
          # ── `idempotency-key` WAS MISSING, AND ONE BROWSER CALL IN THE ESTATE NEEDS IT ───────
          #
          # It is not on the browser's CORS-safelisted request-header list, so a cross-origin
          # request carrying it triggers a preflight, and the browser refuses the real request
          # unless the name comes back in `Access-Control-Allow-Headers`. It did not come back.
          #
          # THE CALL THAT NEEDS IT is `POST /markets/:id/deploy` on foresight, which REQUIRES an
          # `Idempotency-Key` of 8 to 200 characters and answers 400 without one
          # (`idempotencyKeyOf`, foresight/src/server.ts). The operator panel is the only
          # client that calls it from a browser, and it has always called foresight cross-origin —
          # from `foresight-admin.<apex>` before the P13 fold and from `admin.<apex>` after it. So
          # the deploy control could not have worked in a browser at any point, and the fold did
          # not cause that; it inherited it.
          #
          # WHY NOTHING CAUGHT IT. The estate's other caller of that route is
          # `scripts/foresight-market-journey.mjs`, which runs under Node — no origin, no
          # preflight, no CORS. So the journey passed against a route no browser could reach, which
          # is the shape of defect this directory keeps rediscovering: a check that exercises the
          # path by a mechanism the real client does not use.
          #
          # AND HOW IT FAILED: silently, and in the browser only. Traefik never sees the refused
          # request, foresight never sees it, nothing logs, and the operator gets a network error
          # with no status code on the screen that deploys a market contract. `policy.yml` says the
          # same thing four times about a missing ORIGIN — "fails closed and silently" — and a
          # missing HEADER fails exactly the same way for exactly the same reason.
          #
          # `scripts/surface-routes.py` check 8 now fails if this line is removed.
          - idempotency-key
        accessControlAllowCredentials: true
        accessControlMaxAge: 600
        addVaryHeader: true

    # --------------------------------------------------- correlation id ------
    # `x-request-id` is retained alongside W3C traceparent, not replaced by it.
    # Generated here when absent, echoed on every response, shown on every
    # user-facing error page, indexed in Loki, Lantern and audit_events.
    # `trace_id` is what machines join on; this is what humans quote.
    cf-request-id:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
        customResponseHeaders:
          # ── THIS LINE DOES THE OPPOSITE OF WHAT IT SAYS, AND HAS ALL ALONG ───
          #
          # It used to read "Traefik generates the id itself when tracing is on;
          # this ensures it reaches the browser so an error page can print it."
          # Neither half is true, and both were checked against the running estate
          # rather than reasoned about:
          #
          #   * AN EMPTY VALUE IN `customResponseHeaders` REMOVES THE HEADER. That
          #     is Traefik's documented semantic for the empty string, so this line
          #     deletes `X-Request-Id` from every response instead of emitting one.
          #   * Traefik does not mint an `X-Request-Id` under `--tracing`. It mints
          #     a `traceparent`. There is no id for this line to have passed on.
          #
          # Measured on the LIVE mainnet gateway, `https://hub.cloudsforge.online/`
          # with the Origin root as `--cacert`: `strict-transport-security` and
          # `x-content-type-options` are present and `x-request-id` is ABSENT. It
          # is absent on the plaintext `tunnel` path in exactly the same way, for
          # exactly this reason — so the new entrypoint does not bypass this
          # middleware, it inherits a middleware that has never done this job.
          #
          # LEFT AS IT IS, DELIBERATELY, and recorded instead of quietly patched.
          # Stock Traefik has no middleware that can GENERATE a random id, so
          # making the surrounding prose true is a real change — a plugin, or the
          # id minted by each service — and not a line edit smuggled into a
          # gateway change about a tunnel. What is fixed here is the sentence: the
          # workflow this file claims already works ("an id a user reads off an
          # error page and an operator pastes into one search box") DOES NOT, and
          # the next reader should inherit that fact rather than rediscover it.
          X-Request-Id: ""

    cf-security-headers:
      headers:
        # ── WITHOUT THIS LINE THE TUNNEL PATH LOSES HSTS, AND ONLY HSTS ────────
        #
        # Traefik's headers middleware is `unrolled/secure`, which emits
        # `Strict-Transport-Security` only when it believes the request arrived
        # over TLS. It decides that from `r.TLS`, from the URL scheme, and from
        # the headers named HERE — and nowhere else. On `websecure` the first of
        # those is true and this line changes nothing. On `tunnel` — the plaintext
        # loopback entrypoint cloudflared uses — all three were false, so the
        # header was silently dropped on THE ONLY PATH REAL USERS TRAVERSE while
        # :443 kept it.
        #
        # MEASURED, not reasoned about, on traefik:v3.2.3 over this directory:
        # every other header in this middleware (nosniff, referrer-policy,
        # X-Frame-Options, X-XSS-Protection) appeared on the plaintext path
        # already; `strict-transport-security` was the one absentee, and adding
        # this made the two responses match.
        #
        # IT IS NOT CLIENT-CONTROLLABLE, which is the only reason it is safe.
        # `cf-request-id` runs FIRST in both entrypoint chains and force-sets
        # `X-Forwarded-Proto: https` as a custom REQUEST header, overwriting
        # whatever arrived. Verified by sending `X-Forwarded-Proto: http` and
        # `: ftp` from the client: HSTS was emitted both times. And the claim it
        # asserts is true — the browser's hop really is HTTPS; the plaintext
        # segment is a loopback socket inside this one machine.
        sslProxyHeaders:
          X-Forwarded-Proto: https
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        # The gateway must not leak which service answered. "Our status page
        # told the attacker which service fell over first" applies to headers
        # as much as to the status page.
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

  routers:
    # The refusal itself. Priority is deliberately enormous so that it wins
    # against every service router regardless of rule specificity — the
    # cloudflared config relies on "the first rule wins" and this is the
    # equivalent guarantee in a system that sorts by priority instead.
    cf-internal-refusal:
      rule: "PathRegexp(`(?i)^/+internal(/|$)`)"
      priority: 100000
      # `tunnel` IS NOT OPTIONAL IN THIS LIST. It is the plaintext loopback
      # entrypoint cloudflared reaches the estate on
      # (compose/docker-compose.gateway.yml, --entrypoints.tunnel.address), which
      # makes it the only entrypoint a request from OFF THIS BOX actually arrives
      # on. A refusal that names `web` and `websecure` and not `tunnel` would
      # refuse /internal on the two paths nobody can reach and serve it on the one
      # everybody can — the exact inversion of what this router is for.
      #
      # Verified on the plaintext path rather than assumed: `/internal/credit` and
      # the `//Internal/credit` bypass shape both answer 502 there, matching :443.
      entryPoints: [web, websecure, tunnel]
      service: cf-refuse

  services:
    # Routed to a service that does not resolve, which Traefik answers as 502.
    # A 404 would be a lie (the path exists) and a 403 would confirm it exists
    # to whoever is probing. 502 is what an unreachable upstream looks like,
    # which is exactly what /internal should look like from outside the box.
    cf-refuse:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
