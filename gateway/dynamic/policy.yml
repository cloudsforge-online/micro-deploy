# Gateway policy — the part that is NOT a label on a container.
#
# A service must not be able to relax the rule that constrains it. Labels are
# owned by whoever writes the service's compose block; this file is owned by the
# platform and reviewed as policy. That distinction is the reason /internal
# lives here and not in a `traefik.http.routers.*` label on pay.

http:
  middlewares:
    # ---------------------------------------------------- /internal refusal --
    # THE INVARIANT, MOVED.
    #
    # This USED TO SAY that the refusal was "a path rule in
    # deploy/cloudflared/config.example.yml and a CI job
    # (.github/workflows/ci.yml:155) that parses that YAML". Neither existed.
    # There was no cloudflared/ directory in this repository at all, and ci.yml
    # had one job in it, running scripts/surface-routes.py — so this file, and
    # README.md:406, and docker-compose.gateway.yml:17, all cited a control that
    # was never written. That is the failure surface-routes.py's check 4 exists
    # for ("A ROUTER DESCRIBED IN PROSE IS NOT A ROUTER"), one directory over,
    # where check 4 could not see it because it only reads gateway/dynamic/*.yml.
    #
    # Both copies are real now. The edge copy is the FIRST ingress rule in every
    # cloudflared/config.*.yml, generated by cloudflared/gen.py and diffed by CI;
    # the in-host copy is cf-internal-refusal below, at priority 100000.
    # AD-17 moves TLS and routing to the gateway, so the mechanism moves — and
    # the invariant has to move with it or the check keeps passing against a
    # file nothing reads any more, which is worse than no check.
    #
    # Why it matters: Pay's /internal routes take a `userId` as a PARAMETER
    # rather than reading it from an authenticated session. Reaching one from
    # off the box is an act-as-anyone primitive. The service's own auth is a
    # second gate, not the first one; this is the first one.
    #
    # Case-insensitive and tolerant of leading-slash duplication for the same
    # reason the cloudflared rule is: `//Internal/x` and `/%2finternal` are the
    # shapes a path filter is bypassed with.
    # Traefik has no "deny" middleware, so the refusal is a ROUTER (below) at a
    # priority nothing can outrank, pointed at an unreachable service. A
    # middleware chain cannot refuse a request; a route can.

    # ------------------------------------------------------------- CORS ------
    # ONE list, not eight. The estate carries CORS_ORIGINS in every service's
    # environment and it has already drifted: :4004 was in nimbus's copy and
    # missing from everyone else's, so ForgeMint's SPA could sign in locally and
    # could not call Pay, while production worked. A second list buys nothing
    # and costs exactly that bug.
    #
    # Never a wildcard. `allowCredentials: true` with `*` is rejected by
    # browsers anyway, and an allowlist that has to be written out is an
    # allowlist somebody has to justify.
    cf-cors:
      headers:
        accessControlAllowOriginList:
          - https://cloudsforge.online
          - https://hub.cloudsforge.online
          - https://market.cloudsforge.online
          # `create`, not `mint`: `micro-mint-web` serves Forge Create, and the registry's
          # subdomain for that surface is `create` (ui/packages/ui/src/surfaces.ts, the `create`
          # row). `mint.cloudsforge.online` is a host NOTHING SERVES — the same defect, from the
          # same cause, as the `devportal`/`developers` line below: a CORS entry written from the
          # repository name rather than from the registry. It fails closed and in silence: the
          # browser refuses the response and nothing server-side records a refusal.
          - https://create.cloudsforge.online
          - https://trade.cloudsforge.online
          - https://worlds.cloudsforge.online
          - https://explorer.cloudsforge.online
          - https://admin.cloudsforge.online
          # developers, not devportal: that is the registry subdomain for this surface
          # (ui/packages/ui/src/surfaces.ts:388). The host had been written from the
          # repository name, micro-devportal-web. A CORS allowlist naming a host nobody
          # serves fails closed and silently.
          - https://developers.cloudsforge.online
          - https://status.cloudsforge.online
          # network and foresight were missing - the only two registry products absent from this
          # list, found when micro-network-site's chain panel could fetch nothing. An allowlist
          # that omits an origin fails closed and silently: the browser refuses the response and
          # nothing server-side records that anything was refused.
          - https://network.cloudsforge.online
          - https://foresight.cloudsforge.online
          # Three surfaces this estate now SERVES and this list had never named. All three are
          # bundles under docker-compose.estate.yml with a router in estate-web.yml, and every one
          # of them calls identity cross-origin on boot — `consumeAuthCallback` posts to
          # `nimbus.<apex>/auth/handoff/redeem` from whatever origin the page is on
          # (ui/packages/ui/src/index.tsx). An origin missing here cannot complete a sign-in.
          #
          # `foresight-admin.cloudsforge.online` was here and is GONE — the P13 fold made the
          # Foresight operator panel a section inside `admin.<apex>`, which is already allowlisted
          # eleven lines up. Left behind, it would be the `mint.cloudsforge.online` defect written
          # fresh: an origin allowlisted for a host nothing serves.
          - https://emberkin.cloudsforge.online
          - https://aetherholm.cloudsforge.online
          # The fourth Forge Worlds title. It needs this entry for the same reason the three
          # above do — sign-in is cross-origin from every surface — and for one more that is
          # specific to it: unlike emberkin and aetherholm, its SERVICE runs in this estate, and
          # `tessera-web` calls it. `resolveApiBase` returns the empty string when the bundle is
          # served from its own registry host, so those calls are same-origin and need no CORS
          # entry at all; the ones that DO cross are to nimbus, and they are the ones a missing
          # entry kills. An allowlist that omits an origin fails closed and silently.
          - https://tessera.cloudsforge.online
{{ if env "CF_WEB_APEX" }}
          # ── THE ESTATE APEX ────────────────────────────────────────────────
          #
          # The same sixteen surfaces, at whatever apex this deployment serves them on. Present
          # only when `CF_WEB_APEX` is set, which production does not set — with it unset this
          # block renders to nothing and the list above is byte-for-byte what it always was.
          #
          # It has to be here rather than in a second middleware: `cf-cors` is applied to every
          # router on `websecure` by the entryPoint chain
          # (compose/docker-compose.gateway.yml:90), so a second CORS middleware would run beside
          # this one on the same request rather than instead of it, and two middlewares each
          # setting `Access-Control-Allow-Origin` is not a configuration anyone should have to
          # reason about at 3am.
          #
          # The file provider renders this Go template BEFORE parsing the YAML, which is why a
          # conditional can sit mid-list at all — and why the indentation below is load-bearing
          # in a way a YAML-aware editor will not warn about.
          #
          # For the same reason NOTHING in this file may write a template action inside a
          # comment: the renderer does not know what a comment is, and an unclosed one takes
          # every file in this directory down with it. See the header of estate-web.yml for the
          # incident and for the canary that catches it.
          - https://{{ env "CF_WEB_APEX" }}
          - https://hub.{{ env "CF_WEB_APEX" }}
          - https://market.{{ env "CF_WEB_APEX" }}
          - https://create.{{ env "CF_WEB_APEX" }}
          - https://trade.{{ env "CF_WEB_APEX" }}
          - https://worlds.{{ env "CF_WEB_APEX" }}
          - https://explorer.{{ env "CF_WEB_APEX" }}
          - https://network.{{ env "CF_WEB_APEX" }}
          - https://developers.{{ env "CF_WEB_APEX" }}
          - https://admin.{{ env "CF_WEB_APEX" }}
          - https://status.{{ env "CF_WEB_APEX" }}
          - https://foresight.{{ env "CF_WEB_APEX" }}
          - https://emberkin.{{ env "CF_WEB_APEX" }}
          - https://aetherholm.{{ env "CF_WEB_APEX" }}
          - https://tessera.{{ env "CF_WEB_APEX" }}
          # ── the two operator consoles ──────────────────────────────────────
          #
          # `lantern.` and `beacon.` were API-only hostnames until micro-lantern-web
          # and micro-beacon-web joined this estate. They are here for the reason
          # every entry above them is here — sign-in is cross-origin from every
          # surface, `consumeAuthCallback` posts to `nimbus.<apex>/auth/handoff/redeem`
          # from whatever origin the page is on, and an origin missing from this
          # list cannot complete one. Both bundles are `adminOnly`, so a missing
          # entry does not degrade them: it leaves a sign-in panel that never
          # succeeds, which is the failure shape hardest to attribute.
          #
          # They need NOTHING for their own APIs. Both share a hostname with the
          # service they read (estate-web.yml, the `cf-web-lantern`/`cf-api-lantern`
          # and `cf-web-beacon`/`cf-api-beacon` pairs), so `resolveApiBase()`
          # returns the empty string and every one of those requests is
          # same-origin. That is not an optimisation for beacon — micro-beacon
          # sends no `access-control-*` header of its own and 404s a preflight,
          # so same-origin is the only arrangement a browser can use, and no
          # entry in this list could have substituted for it.
          #
          # Deliberately NOT added to the `cloudsforge.online` block above: these
          # two bundles are deployed in this estate and nowhere else yet, and an
          # allowlist entry for a production origin nothing serves is the
          # `mint.cloudsforge.online` defect two paragraphs up, written fresh.
          - https://lantern.{{ env "CF_WEB_APEX" }}
          - https://beacon.{{ env "CF_WEB_APEX" }}
{{ end }}
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders:
          - content-type
          - authorization
          - x-request-id
          - traceparent
          - tracestate
          - baggage
          # ── `idempotency-key` WAS MISSING, AND ONE BROWSER CALL IN THE ESTATE NEEDS IT ───────
          #
          # It is not on the browser's CORS-safelisted request-header list, so a cross-origin
          # request carrying it triggers a preflight, and the browser refuses the real request
          # unless the name comes back in `Access-Control-Allow-Headers`. It did not come back.
          #
          # THE CALL THAT NEEDS IT is `POST /markets/:id/deploy` on foresight, which REQUIRES an
          # `Idempotency-Key` of 8 to 200 characters and answers 400 without one
          # (`idempotencyKeyOf`, foresight/src/server.ts:1033-1040). The operator panel is the only
          # client that calls it from a browser, and it has always called foresight cross-origin —
          # from `foresight-admin.<apex>` before the P13 fold and from `admin.<apex>` after it. So
          # the deploy control could not have worked in a browser at any point, and the fold did
          # not cause that; it inherited it.
          #
          # WHY NOTHING CAUGHT IT. The estate's other caller of that route is
          # `scripts/foresight-market-journey.mjs:372`, which runs under Node — no origin, no
          # preflight, no CORS. So the journey passed against a route no browser could reach, which
          # is the shape of defect this directory keeps rediscovering: a check that exercises the
          # path by a mechanism the real client does not use.
          #
          # AND HOW IT FAILED: silently, and in the browser only. Traefik never sees the refused
          # request, foresight never sees it, nothing logs, and the operator gets a network error
          # with no status code on the screen that deploys a market contract. `policy.yml` says the
          # same thing four times about a missing ORIGIN — "fails closed and silently" — and a
          # missing HEADER fails exactly the same way for exactly the same reason.
          #
          # `scripts/surface-routes.py` check 8 now fails if this line is removed.
          - idempotency-key
        accessControlAllowCredentials: true
        accessControlMaxAge: 600
        addVaryHeader: true

    # --------------------------------------------------- correlation id ------
    # `x-request-id` is retained alongside W3C traceparent, not replaced by it.
    # Generated here when absent, echoed on every response, shown on every
    # user-facing error page, indexed in Loki, Lantern and audit_events.
    # `trace_id` is what machines join on; this is what humans quote.
    cf-request-id:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
        customResponseHeaders:
          # Traefik generates the id itself when tracing is on; this ensures it
          # reaches the browser so an error page can print it.
          X-Request-Id: ""

    cf-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        # The gateway must not leak which service answered. "Our status page
        # told the attacker which service fell over first" applies to headers
        # as much as to the status page.
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

  routers:
    # The refusal itself. Priority is deliberately enormous so that it wins
    # against every service router regardless of rule specificity — the
    # cloudflared config relies on "the first rule wins" and this is the
    # equivalent guarantee in a system that sorts by priority instead.
    cf-internal-refusal:
      rule: "PathRegexp(`(?i)^/+internal(/|$)`)"
      priority: 100000
      entryPoints: [web, websecure]
      service: cf-refuse

  services:
    # Routed to a service that does not resolve, which Traefik answers as 502.
    # A 404 would be a lie (the path exists) and a 403 would confirm it exists
    # to whoever is probing. 502 is what an unreachable upstream looks like,
    # which is exactly what /internal should look like from outside the box.
    cf-refuse:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
