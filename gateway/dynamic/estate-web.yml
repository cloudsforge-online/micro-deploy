# The surface route map — where the browser surfaces are served, and where each one's
# own API is served BEHIND THE SAME HOSTNAME.
#
# Eighteen of them now. The count is deliberately not written into the prose below any more:
# it was "fifteen" while sixteen frontends were routed, and then two operator consoles
# (`lantern.` and `beacon.`) arrived on hostnames this file had been treating as API-only.
# A number in a header is a copy of something countable, and this estate's whole record is
# that copies go stale. `scripts/surface-routes.py` counts the routers against the registry
# on every run and prints the total; that is the figure to trust.
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────────
#
# `public-api.yml` routes the third-party API on `api.<apex>`. `policy.yml` says how a request is
# treated. NEITHER SERVES A PAGE. Until the frontends joined docker-compose.estate.yml there was
# nothing to route, and docs/ecosystem/22 §8.7 recorded the consequence precisely: 318 browser
# scenarios specified, 86 of them tier T3, and not one of them able to run.
#
# ── THE ONE THING THIS FILE GETS RIGHT THAT A NAIVE VERSION WOULD NOT ──────────
#
# **A surface and its own API share an origin, and the gateway is what makes that true.**
#
# Every frontend resolves its API base by COMPARING ORIGINS (`resolveApiBase`, e.g.
# hub-web/src/lib/hosts.ts): if its registry host equals the page's origin the base is the
# EMPTY STRING and every request is relative. Served from `hub.<apex>`, hub-web asks
# `https://hub.<apex>/v1/dashboard` — not hub-api's hostname, which it does not have one of.
# micro-network-site states the obligation in as many words: "In production the origin is this
# page's, so the base is '' and the drip request is relative — which is what the registry asserts
# **and what the gateway therefore has to route**" (network-site/src/lib/hosts.ts).
#
# So each surface below gets TWO routers where its API exists in this estate: `/v1` to the
# service, everything else to the bundle. Routing only the bundle would leave every surface
# loading perfectly and answering nothing — the exact shape of failure that a `GET /` probe
# cannot see, and that doc 22 §4 built three tiers to catch.
#
# ── THE EMPTY-HOST TRAP, WHICH THIS ESTATE HAS ALREADY PAID FOR ────────────────
#
# The file provider renders Go templates BEFORE parsing YAML. `CF_API_HOST` was once undefined in
# the env file the gateway actually loads, so every router in public-api.yml rendered as
# ``Host(``) && PathPrefix(…)`` — a VALID rule that matches no request ever sent. Traefik logged
# nothing. The whole public API was dead and the only symptom was a 404 from the catch-all.
#
# This file refuses to reproduce that. Every router lives inside a conditional on CF_WEB_APEX (the
# action at the head of the document below), so an unset variable yields an empty document and NO
# ROUTERS AT ALL, rather than a full set of routers that silently match nothing.
# `scripts/estate-verify.sh` then fails on the first surface it cannot reach, which is a symptom
# pointing at its own cause.
#
# ── AND THE TRAP INSIDE THAT TRAP ──────────────────────────────────────────────
#
# **A Go template action written inside a YAML COMMENT is still an action.** The file provider
# renders the whole file as a template before anything parses YAML, and it has no idea what a
# comment is. This header used to spell the conditional out in prose-with-backticks; that opened a
# SECOND `if` which nothing closed, and Traefik answered:
#
#   ERR Error while building configuration (for the first time)
#       error="/etc/traefik/dynamic/estate-web.yml: template: :452: unexpected EOF"
#
# ── WHAT THAT ONE LINE COST, WHICH IS THE PART WORTH REMEMBERING ───────────────
#
# **The file provider is all-or-nothing.** One unparseable file in this directory publishes NO
# configuration from ANY file in it. `public-api.yml` went dark and `policy.yml` went with it — so
# the `/internal` refusal, a priority-100000 security rule, silently stopped existing and
# `GET /internal/x` answered 404 instead of 502. The error is logged ONCE, at startup, in a line
# that says nothing about the other two files.
#
# That is why estate-verify asserts `/internal` on a surface host at the very end of its run: it is
# the cheapest canary for "this directory did not load", and it costs one request.
#
# ── SET IT ─────────────────────────────────────────────────────────────────────
#
#   CF_WEB_APEX  the apex the surfaces are served under. `compose/env/traefik.env` defaults it to
#                `cloudsforge.localtest.me`, a public wildcard resolving to 127.0.0.1, so the dev
#                estate needs no /etc/hosts entry and no resolver. Production sets the real apex.
#
# `cloudsforgeHosts()` derives the apex from `window.location.hostname` by stripping a KNOWN
# subdomain (ui/packages/ui/src/surfaces.ts, KNOWN_SUBS), so `hub.cloudsforge.localtest.me`
# resolves its siblings to `nimbus.cloudsforge.localtest.me` and friends — all of which this file
# routes. It emits `https://` unconditionally, which is why the surfaces are on `websecure` and
# why the estate terminates TLS at the gateway even on loopback.
#
# ── SUBDOMAINS ARE READ, NOT CHOSEN ────────────────────────────────────────────
#
# Every host below is the `subdomain` field of that surface's row in
# `ui/packages/ui/src/surfaces.ts` — the registry whose own header records that this same list was
# maintained by hand in eight places and had already drifted. Two consequences that look like
# mistakes and are not:
#
#   * Forge Create is `create.`, though the repository is `micro-mint-web`.
#   * The developer platform is `developers.`, though the repository is `micro-devportal-web`.
#     policy.yml already carries that correction and the story of how it was found.
#
# Every host below now reads back to a registry row. `foresight-admin` used to be the one that did
# not — recorded here as a gap for micro-ui rather than invented into surfaces.ts from this
# repository, because a sixteenth hand-maintained copy is the mistake the registry exists to end.
# It was given a row, and at P13 the panel folded into `admin-web` and both went: the row, and the
# router that used to be beside `cf-web-foresight` below.

{{ if env "CF_WEB_SUFFIX" }}
http:
  middlewares:
    # Applied to every SURFACE route below — never to the API routes, which carry the service's
    # own answer semantics.
    #
    # The bundles already set these headers themselves in their own nginx.conf. Set again here
    # because a surface must not be able to relax the rule that constrains it: the same argument
    # policy.yml makes for keeping the /internal refusal out of a container label.
    cf-web-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # SAMEORIGIN rather than DENY: these surfaces carry a session that can move money, so no
        # foreign frame ancestor — but a surface framing its own page is a legitimate pattern and
        # frameDeny would break it. Matches what every frontend's nginx.conf already sends.
        customFrameOptionsValue: "SAMEORIGIN"

    # ── www.<apex> IS A HOSTNAME PEOPLE TYPE, AND IT ANSWERED NOTHING (micro-org#404) ──────────
    #
    # Eighteen of nineteen public hostnames answered 200; `www` was the missing one, and it is the
    # one a person types out of habit or a mail client linkifies. With no DNS record it was `000` —
    # the browser's own "can't find the server" page, no branding and nothing to click. Once the
    # record existed it became a 404 from HERE, because Traefik routes by Host and no router
    # claimed that name.
    #
    # A REDIRECT rather than a second router onto `cf-web-site`: serving one site on two hostnames
    # splits its search ranking between them and gives every page two addresses, which is a second
    # defect wearing the first one's clothes. 301 so it is cached, and so the apex is canonical.
    # ── THE TESTNET FRONTENDS ARE RETIRED; THEIR HOSTNAMES REDIRECT (micro-org#459 step 5) ─────
    #
    # The combined view serves both networks from ONE set of frontends on the mainnet hostnames:
    # the in-app switcher (stages 1/3) carries the data, one identity carries the login (stage 2),
    # and the `-testnet` WEB bundles retire. Their hostnames do not die — an old link, a bookmark,
    # a mail from last week all land on the mainnet sibling, same path, where the switcher can
    # show testnet data in place. THE API ROUTERS ARE UNTOUCHED: the combined view's cross-estate
    # reads are served by `/v1` on these very hostnames, which is why the retirement router below
    # carries `!PathPrefix(`/v1`)` and sits at priority 550 — above the bundles (500), below the
    # APIs (600).
    #
    # Rendered ONLY when CF_WEB_RETIRED is `true` in the GATEWAY's own environment
    # (`compose/env/traefik.testnet.env`, at the flip — not `compose/testnet.env`, which the
    # gateway never reads and which cost the flip deploy several live minutes). Mainnet says
    # `false` in `compose/env/traefik.env` and this whole block renders to nothing there. Both
    # files state an answer; neither is allowed to be silent. See the conditional itself for why
    # the test compares a value instead of testing for emptiness.
    cf-retired-sub-to-mainnet:
      redirectRegex:
        regex: '^https?://([a-z0-9-]+)-testnet\.cloudsforge\.online/(.*)'
        replacement: 'https://${1}.cloudsforge.online/${2}'
        permanent: false
    cf-retired-apex-to-mainnet:
      redirectRegex:
        regex: '^https?://testnet\.cloudsforge\.online/(.*)'
        replacement: 'https://cloudsforge.online/${1}'
        permanent: false

    cf-www-to-apex:
      redirectRegex:
        regex: '^https?://www\.(.+)'
        replacement: 'https://${1}'
        permanent: true

    # ── the subdomain a surface used to live at, folded into its path ─────────
    #
    # Wave 1 of `docs/apex-consolidation.md`: Forge Journal moved from
    # `journal.<apex>` to `<apex>/journal`, and this is what keeps the old
    # hostname answering. Used by `cf-web-journal-sub` below, where the priority
    # reasoning and the 301-vs-302 decision are written down.
    #
    # TWO CAPTURES RATHER THAN ONE, unlike `cf-www-to-apex` directly above,
    # because this rewrite has to INSERT a segment between the host and the path
    # instead of only dropping a label off the front. `(.+?)` is non-greedy so
    # it stops at the first `/` and the host lands in `${1}` — greedy would
    # swallow the path into the hostname and emit a URL with no path at all.
    # A port survives it (`journal.localtest.me:8080/x` keeps the `:8080`),
    # which is what makes a laptop behave like the estate.
    #
    # `${2}` may be EMPTY and that is the common case: a reader arriving at
    # `journal.<apex>/` produces `<apex>/journal/`, which `PathPrefix(`/journal/`)`
    # matches and the bundle serves as its index. The bare `<apex>/journal` form
    # is served by the `Path()` half of the same alternation, so both spellings
    # of the front page work and neither needs a second redirect.
    #
    # THE HOSTNAME IS NOT TEMPLATED, and the `journal\.` literal is doing a job:
    # it cannot match `journal-testnet.<apex>`, so this middleware is inert on
    # the retired estate no matter what the priorities are. Templating it with
    # `CF_WEB_SUFFIX` would need the dots escaped for a regex — the suffix is
    # `.cloudsforge.online`, where an unescaped `.` matches any character — and
    # would produce a testnet redirect that only the router ordering suppresses.
    # `cf-retired-*-to-mainnet` above hardcodes the apex for the same reason.
    cf-journal-to-apex:
      redirectRegex:
        regex: '^https?://journal\.(.+?)/(.*)'
        replacement: 'https://${1}/journal/${2}'
        permanent: true

    # The same shape for wave 2's surface. One middleware per moved hostname
    # rather than one generic rule, and that is deliberate: a single
    # `^https?://([a-z0-9-]+)\.(.+?)/(.*)` -> `https://${2}/${1}/${3}` would
    # rewrite EVERY subdomain on the estate the moment it were attached to the
    # wrong router — including `hub`, `nimbus` and `admin`, which are staying on
    # their own hostnames for reasons this plan calls non-negotiable. Twelve more
    # of these will accumulate here, and twelve verbose blocks that can only
    # damage the one hostname they name is the right trade against one clever
    # block that can damage all of them.
    cf-exchange-to-apex:
      redirectRegex:
        regex: '^https?://exchange\.(.+?)/(.*)'
        replacement: 'https://${1}/exchange/${2}'
        permanent: true

    # Wave 3a. Same shape again, and the third of the twelve this file expects.
    #
    # IT REDIRECTS THE BUNDLE AND NOT THE API, which is new here and is the whole
    # difference between this wave and the two before it. `market.<apex>/v1` is
    # still routed straight to the service by `cf-api-market-host` at 600, which
    # outranks the tombstone at 500 — so this regex never sees it. That is
    # deliberate: a 301 answers a GET well and mangles a POST, because a client
    # that follows one is entitled to drop the body and the method. The bundle
    # moved; third-party callers of the API did not have to.
    cf-market-to-apex:
      redirectRegex:
        regex: '^https?://market\.(.+?)/(.*)'
        replacement: 'https://${1}/market/${2}'
        permanent: true

    # Wave 3b. Two more of the twelve, same shape, same reasoning — and the same
    # split between the bundle and the API: `create.<apex>/v1` and
    # `trade.<apex>/v1` stay routed straight to their services by the routers at
    # 600 below, which outrank these tombstones at 500, so neither regex ever
    # sees a `/v1` call. A 301 answers a GET well and mangles a POST.
    cf-create-to-apex:
      redirectRegex:
        regex: '^https?://create\.(.+?)/(.*)'
        replacement: 'https://${1}/create/${2}'
        permanent: true

    cf-trade-to-apex:
      redirectRegex:
        regex: '^https?://trade\.(.+?)/(.*)'
        replacement: 'https://${1}/trade/${2}'
        permanent: true

    # Wave 3c's one. Same shape, and the same "the API routers outrank this"
    # argument — which matters MORE here than for the three above, because
    # agora's service answers `/livez` and `/readyz` at its root as well as
    # `/v1`, and a monitor that followed a 301 to the bundle would be handed an
    # HTML page with a 200 and would call it healthy.
    cf-agora-to-apex:
      redirectRegex:
        regex: '^https?://agora\.(.+?)/(.*)'
        replacement: 'https://${1}/agora/${2}'
        permanent: true

    # Wave 3d's. The API routers above it at 600 cover `/v1`, `/livez` and
    # `/readyz` — and on THIS hostname that matters more than anywhere else,
    # because `/v1/pool/stratum/<chain>` is a WEBSOCKET a browser miner holds
    # open for hours. A 301 in front of an upgrade request does not degrade
    # gracefully; it fails the handshake.
    cf-pool-to-apex:
      redirectRegex:
        regex: '^https?://pool\.(.+?)/(.*)'
        replacement: 'https://${1}/pool/${2}'
        permanent: true

    # Wave 3e's. `cf-api-worlds-host` at 600 is above this tombstone, so a third
    # party calling `worlds.<apex>/v1` never sees the redirect — even though THIS
    # ESTATE'S OWN BUNDLE never called it. worlds-web talks to `api.<apex>`, which
    # is what its registry row and `lib/hosts.ts` both say at length.
    cf-worlds-to-apex:
      redirectRegex:
        regex: '^https?://worlds\.(.+?)/(.*)'
        replacement: 'https://${1}/worlds/${2}'
        permanent: true

    # ── WAVE 3f's THREE, AND WHY THEY LAND TWO SEGMENTS DEEP ──────────────────
    #
    # A Forge Worlds TITLE is not a product beside the catalogue, it is a thing
    # INSIDE it — every one of the three is `inSwitcher: false` with `worlds` as
    # its switcher entry, and has been since long before this move. So the
    # replacement is `/worlds/<title>/` and not `/<title>/`: the address now says
    # what the registry always said.
    #
    # The API routers on these three hostnames sit ABOVE these tombstones
    # (700 against 500), for `cf-worlds-to-apex`'s reason and one stronger: an
    # emberkin save is a PUT, and a 301 in front of a PUT is re-issued by most
    # clients as a GET. A third party still calling `emberkin.<apex>/v1` keeps
    # being answered rather than redirected.
    cf-emberkin-to-apex:
      redirectRegex:
        regex: '^https?://emberkin\.(.+?)/(.*)'
        replacement: 'https://${1}/worlds/emberkin/${2}'
        permanent: true

    cf-aetherholm-to-apex:
      redirectRegex:
        regex: '^https?://aetherholm\.(.+?)/(.*)'
        replacement: 'https://${1}/worlds/aetherholm/${2}'
        permanent: true

    cf-tessera-to-apex:
      redirectRegex:
        regex: '^https?://tessera\.(.+?)/(.*)'
        replacement: 'https://${1}/worlds/tessera/${2}'
        permanent: true

    # Wave 3g's. `cf-api-developers` at 600 is above this tombstone, so a third party calling
    # `developers.<apex>/v1` is ANSWERED rather than bounced — and here that matters more than
    # anywhere else in this file: `micro-devplatform` mints and revokes API credentials, so the
    # requests on this hostname are POSTs and DELETEs, and a client that follows a 301 re-issues
    # most of them as a GET. A revoke that silently became a read is a credential still live.
    cf-developers-to-apex:
      redirectRegex:
        regex: '^https?://developers\.(.+?)/(.*)'
        replacement: 'https://${1}/developers/${2}'
        permanent: true

    # Wave 3h's. `cf-api-explorer` at 600 is above this tombstone, so a third party reading the
    # chain index on the old hostname is answered rather than bounced — the indexer's routes are
    # GETs, so a 301 would degrade gracefully, but there is no reason to spend a round trip on
    # every read a block explorer's API serves.
    cf-explorer-to-apex:
      redirectRegex:
        regex: '^https?://explorer\.(.+?)/(.*)'
        replacement: 'https://${1}/explorer/${2}'
        permanent: true

    # Wave 3i's — the LAST tombstone of the apex consolidation. `cf-api-foresight-resources`
    # and `cf-api-foresight-markets` sit at 600 and 700, above this, so a third party calling
    # the old hostname's API is answered rather than bounced. That matters here: staking a
    # position is a POST, and a client following a 301 re-issues most POSTs as a GET.
    cf-foresight-to-apex:
      redirectRegex:
        regex: '^https?://foresight\.(.+?)/(.*)'
        replacement: 'https://${1}/foresight/${2}'
        permanent: true

    # ── THE MOUNT THE SERVICE MUST NEVER SEE ──────────────────────────────────
    #
    # Decision 4 in `docs/apex-consolidation.md`, and the first time the estate
    # needs it for a consolidated surface. The bundle at `/market` issues
    # RELATIVE requests, so `/v1/listings` from a page at `/market/collections`
    # resolves at the APEX ROOT — micro-site's — and micro-site answers its SPA
    # shell: 200, an HTML body where JSON was expected, every panel dead and a
    # network tab that looks perfectly healthy.
    #
    # So the bundle asks for `/market/v1/listings`, the gateway routes it, and
    # this takes `/market` back off before `cf-svc-market` sees it. micro-market
    # is unchanged and never learns it moved.
    #
    # `check-api-remount.py` demands this middleware on the router by name. The
    # part it CANNOT check is whether the service composes an absolute path of
    # its own — a `Location:`, a cookie `Path`, a URL in a JSON body — because
    # stripPrefix is invisible to the service and such a path would point back at
    # the apex root while still answering 200. That was AUDITED instead, across
    # all twelve services, and the three greps are recorded in decision 4.
    # micro-market: 0 redirects, 0 cookie Paths, 0 rooted response fields.
    cf-market-strip-mount:
      stripPrefix:
        prefixes:
          - "/market"

    # Wave 3b's two. Decision 4 again, and the audit that cannot be automated —
    # `stripPrefix` is invisible to the service, so a `Location:`, a cookie
    # `Path` or a rooted URL in a JSON body would keep answering 200 while
    # handing the browser an address on the apex root — was RE-RUN for each on
    # 2026-08-20 rather than assumed from `market`:
    #
    #   micro-mint    0 redirects, 0 cookie Paths, 2 rooted-path hits
    #   micro-trade   0 redirects, 0 cookie Paths, 17 rooted-path hits
    #
    # Both hit counts were READ rather than counted, and neither is a response
    # field. micro-mint's two are OUTBOUND calls to micro-custody — `/v1/sign`
    # and `/v1/addresses` on a different service, which this mount does not
    # touch. micro-trade's seventeen are `exchangeRoute('GET', '/v1/exchange/…')`
    # route REGISTRATIONS, the same shape as `market`'s `define(…)` and, like
    # those, literals in `server.ts` rather than anything derived from the
    # request path — so the routes the service serves do not move when the
    # gateway strips a prefix in front of it.
    cf-create-strip-mount:
      stripPrefix:
        prefixes:
          - "/create"

    cf-trade-strip-mount:
      stripPrefix:
        prefixes:
          - "/trade"

    # Wave 3c's, and the un-automatable audit re-run for it on 2026-08-20 rather
    # than assumed from the three above:
    #
    #   micro-agora   0 redirects, 0 cookie Paths, 56 rooted-path hits
    #
    # All 56 READ rather than counted, and every one is a `define('GET', '/v1/…')`
    # route REGISTRATION in `server.ts` — the same shape as `market`'s and
    # `trade`'s, and, like those, a literal rather than anything derived from the
    # request path. The routes a service SERVES do not move when the gateway
    # strips a prefix in front of it. (98 hits before excluding `*.test.ts`; the
    # remaining 42 are the suite calling its own endpoints.)
    #
    # The one worth naming is what is NOT in that list. micro-agora emits no
    # `Location:` at all — every write answers the created object rather than
    # redirecting to it — which is the property that makes a mount invisible to
    # it, and the property a future endpoint could quietly break.
    cf-agora-strip-mount:
      stripPrefix:
        prefixes:
          - "/agora"

    # Wave 3d's, and the audit re-run for it on 2026-08-20:
    #
    #   micro-pool   0 redirects, 0 cookie Paths, 7 rooted-path hits in shipped code
    #
    # All 7 read. Five are `{ method: 'GET', path: '/v1/pool/…' }` route
    # REGISTRATIONS in `server.ts` — the object form of the same thing
    # `market` and `agora` write as `define(…)`, and equally a literal rather
    # than anything derived from the request path. One is a comment in
    # `tickets.ts`. The seventh is the one that matters and it is NOT a
    # response field either:
    #
    #   `wsstratum.ts` STRATUM_WS_PATH = '/v1/pool/stratum'
    #
    # appended by `websocketEndpointOf()` to `POOL_WEBSOCKET_PUBLIC_ORIGIN`,
    # which is an operator-set absolute URL on `pool.<apex>` — the hostname
    # this plan leaves un-redirected. So the published socket address does not
    # pass through this middleware and must not: it is composed from
    # configuration, which is precisely what micro-org#285 changed it to.
    cf-pool-strip-mount:
      stripPrefix:
        prefixes:
          - "/pool"

    # ── WAVE 3f's THREE, AND THE FIRST TWO-SEGMENT PREFIXES IN THIS FILE ──────
    #
    # Decision 4 again. The audit that cannot be automated — `stripPrefix` is
    # invisible to the service, so a `Location:`, a cookie `Path` or a rooted URL
    # in a JSON body would go on answering 200 while handing the browser an
    # address at the apex root — was RE-RUN for each of the three on 2026-08-20
    # rather than assumed from the five above:
    #
    #   micro-emberkin     0 redirects, 0 cookie Paths, 10 rooted-path hits
    #   micro-aetherholm   0 redirects, 0 cookie Paths, 28 rooted-path hits
    #   micro-tessera      0 redirects, 0 cookie Paths, 38 rooted-path hits
    #
    # All 76 READ rather than counted. Every hit in a `server.ts` is a route
    # REGISTRATION, the same literal shape as `market`'s `define(…)`; the routes
    # a service SERVES do not move when the gateway strips a prefix in front of
    # it. The seven that are NOT in a `server.ts` are the ones worth naming, and
    # all seven are OUTBOUND calls to a DIFFERENT service:
    #
    #   emberkin/src/worldsclient.ts    GET  /v1/titles      → micro-worlds
    #   emberkin/src/testsupport.ts     (x2) the fake of that same call
    #   tessera/src/marketclient.ts     POST /v1/listings    → micro-market
    #   tessera/src/communityclient.ts  POST /v1/communities → micro-community
    #   tessera/src/studioclient.ts     POST /v1/brand-kits  → micro-studio
    #
    # A path on somebody else's base URL, which this middleware does not touch.
    #
    # TWO SEGMENTS, and that is the whole difference from the five above. Traefik
    # strips the literal prefix, so `/worlds/emberkin/v1/saves` reaches the
    # service as `/v1/saves` — exactly what it served on its own hostname, and
    # exactly what its route table still registers.
    cf-emberkin-strip-mount:
      stripPrefix:
        prefixes:
          - "/worlds/emberkin"

    cf-aetherholm-strip-mount:
      stripPrefix:
        prefixes:
          - "/worlds/aetherholm"

    cf-tessera-strip-mount:
      stripPrefix:
        prefixes:
          - "/worlds/tessera"

    # Wave 3g's, and the un-automatable Decision 4 audit re-run for it on 2026-08-20 rather than
    # assumed from the eight above:
    #
    #   micro-devplatform   0 redirects, 0 cookie Paths, 41 rooted-path hits
    #
    # All 41 READ rather than counted, and every one is in `server.ts` — route REGISTRATIONS, the
    # same literal shape as `market`'s `define(…)`. NOTHING outside `server.ts` names a rooted
    # path at all, which makes this the cleanest of the nine: there is no outbound client in this
    # service composing a path against somebody else's base URL, so there is not even the class of
    # hit that had to be argued away for emberkin and tessera.
    #
    # The property worth naming is the one that would break it: micro-devplatform emits NO
    # `Location:` header anywhere. Every write answers the created or updated object rather than
    # redirecting to it, which is exactly what makes a mount invisible to a service — and exactly
    # what a future endpoint could quietly undo.
    cf-developers-strip-mount:
      stripPrefix:
        prefixes:
          - "/developers"

    # Wave 3h's, and the audit re-run for it on 2026-08-20 rather than assumed from the nine above:
    #
    #   micro-indexer   0 redirects, 0 cookie Paths, 1 rooted-path hit
    #
    # One hit, read: a route registration in `server.ts`. This is the cleanest result of the ten —
    # the indexer is a read-only projection of chain state, so it composes no addresses at all and
    # there is nothing here for a mount to be invisible to.
    cf-explorer-strip-mount:
      stripPrefix:
        prefixes:
          - "/explorer"

    # Wave 3i's, and the last. The audit re-run on 2026-08-20:
    #
    #   micro-foresight   0 redirects, 0 cookie Paths, all rooted paths are registrations
    #
    # This is the mount the plan worried about most, and the worry was the wrong shape. §5 feared
    # that mounting the bundle would leave six UNVERSIONED prefixes at the apex root — `/me` and
    # `/markets` on `cloudsforge.online`, answered by a prediction market. They do not stay
    # there: they move under the mount with everything else, and this middleware hands the
    # service back exactly the paths it already serves. The only real difference from the other
    # thirteen is that the API rule enumerates six prefixes instead of naming one `/v1`.
    cf-foresight-strip-mount:
      stripPrefix:
        prefixes:
          - "/foresight"

    # ── THE ONLY WAY TRAEFIK REFUSES A REQUEST WITHOUT A BACKEND ───────────────
    #
    # Traefik 3 has no "return 403" middleware. `ipAllowList` is the primitive
    # that refuses, and `127.0.0.1/32` refuses EVERYTHING that arrives here:
    # public traffic reaches this gateway through cloudflared as a pod-to-pod
    # hop, so the client address Traefik sees is cloudflared's POD IP and never
    # loopback. Nothing legitimate is lost — Prometheus scrapes services directly
    # on the cluster network (`BEACON_TARGETS` and prometheus.yml both name
    # `http://<service>:4000`), never through this gateway.
    #
    # Named for what it does rather than for who uses it, because the next
    # endpoint that must exist internally and not publicly should reuse it.
    cf-deny-public:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"

    # ── THE TWO CHAIN THROTTLES, AND WHY THEY ARE KEYED ON A HEADER ────────────
    #
    # `rpc.<apex>` and `p2p.<apex>` are the only two hostnames in this estate that
    # take work from a stranger with NO CREDENTIAL AT ALL. Every other unauthenticated
    # route here is either a static bundle or a service that checks a token inside
    # itself. An EVM JSON-RPC endpoint answers `eth_call` to anyone, and `eth_call`
    # runs a program.
    #
    # ── THE NODE'S OWN LIMITER CANNOT DO THIS JOB, AND HEARTH SAYS SO ITSELF ────
    #
    # `hearth/node/src/jsonrpc/server.js` bounds concurrent requests per
    # address, and its own comment names the exact defeat: "Keyed on
    # `socket.remoteAddress`, so behind a proxy — the public RPC ingress
    # docs/quickstart.md §9 still lists as pending — every request arrives from one
    # address and this degrades into a global cap."
    #
    # THAT DEGRADATION IS ALREADY LIVE AND IS NOT CAUSED BY THIS CHANGE. cloudflared
    # connects to the origin over loopback, so before today every tunnelled request
    # already reached hearth from 127.0.0.1 and already shared one bucket. What
    # changes is that the true client address is now available to something that can
    # act on it — which is only true once the request passes through here.
    #
    # `Cf-Connecting-Ip` RATHER THAN THE PEER ADDRESS, and that is the whole point:
    # the peer address is cloudflared's, one value for the entire internet, and a
    # limiter keyed on it throttles everyone as one client — the same collapse
    # quoted above, reproduced one layer up. Cloudflare SETS this header at its edge
    # and overwrites any client-supplied value, and the only path to this gateway is
    # the tunnel (every published port is bound to 127.0.0.1), so it is not
    # spoofable here.
    #
    # WHAT A REQUEST WITHOUT THE HEADER GETS, STATED. Anything that did not come
    # through Cloudflare — a loopback `curl`, `scripts/estate-verify.sh`, a probe on
    # the estate network — has no `Cf-Connecting-Ip`, so Traefik keys it on the empty
    # string and all such callers share ONE bucket. That is a deliberate acceptance
    # rather than an oversight: those callers are all on this box, the bucket is
    # generous, and the alternative (falling back to the peer address) would put the
    # real internet back into a single bucket to spare the loopback.
    #
    # THE NUMBERS. 30 requests/second sustained with a burst of 60 is roughly ten
    # times what a wallet polling `eth_blockNumber` needs and far below what makes a
    # single-threaded node — hearthd is one event loop, `scripts/ember-miner.sh`
    # — miss a block. It is a ceiling on abuse, not a quota anyone should meet.
    cf-rpc-throttle:
      rateLimit:
        average: 30
        period: 1s
        burst: 60
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip
    # The P2P limit counts DIALS, not messages: a WebSocket is one HTTP request and
    # then a hijacked socket this middleware never sees again, so an established peer
    # is untouched however much it gossips. 5/s with a burst of 20 bounds connection
    # churn — the thing a stranger can actually spend the node's memory with — and no
    # honest peer reconnects anywhere near that often.
    cf-p2p-dial-throttle:
      rateLimit:
        average: 5
        period: 1s
        burst: 20
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # ── THE MINING WORK API, AND WHAT ACTUALLY THREATENS IT ───────────────────
    #
    # Tighter than the RPC limit above and for a completely different reason, so
    # the number is argued rather than copied.
    #
    # `POST /mining/submit` IS NOT THE DANGEROUS ONE, which is the opposite of
    # how it reads. It mutates chain state, but a submission carries ONLY proof
    # fields — `hearth/node/src/mining.js` destructures exactly
    # `{templateId, nonce, powDigest, powSig}`, and `mining.js` rebuilds
    # the block as `{ ...t.header, nonce, powDigest, powSig }` with `txs: t.txs`
    # taken from the template THE NODE BUILT. A caller cannot smuggle in a
    # transaction, retarget, or repoint the coinbase, because none of that
    # travels in the body; `BLOCK.verifyPow` then rejects anything without real
    # work, and `chain.addBlock` revalidates all of it again. Spamming submit
    # costs the attacker a proof-of-work and buys them a 400.
    #
    # `GET /mining/template` IS. Each call makes the node assemble a candidate
    # block and store it, and the store is capped: `MAX_TEMPLATES = 256`
    # (`mining.js`, whose own comment is "Bounded so an unauthenticated caller
    # cannot grow this without limit"), with `_evict()` dropping the oldest. The
    # bound protects the node's MEMORY and does nothing for its USERS — a
    # stranger pulling templates in a loop evicts the owner's miners' work before
    # they can finish hashing it, and mining simply stops. Cheap to run, invisible
    # in any error rate, and the node stays perfectly healthy throughout.
    #
    # 2/s with a burst of 10, per client IP. A real miner pulls one template per
    # block attempt and re-pulls when the tip moves — `TTL_MS = 120_000`
    # (`mining.js`) is how long one stays valid — so single-figure requests per
    # minute is the honest shape, and 2/s is already generous by two orders of
    # magnitude. Keyed on `Cf-Connecting-Ip` for the reason the RPC block gives at
    # length: the node's own limiter sees cloudflared's address for every request
    # in the world, so this gateway is the only place the real client is visible.
    #
    # ── AND THIS IS NOT SUFFICIENT, WHICH IS SAID HERE RATHER THAN IMPLIED ────
    #
    # A per-IP limit does not stop a distributed or address-rotating caller from
    # keeping the 256-entry table churned. The correct protection for this
    # endpoint is AUTHENTICATION — the owner's miners are known machines, not the
    # public — and it is not here for one concrete reason: NO CLIENT SENDS A
    # CREDENTIAL TODAY. `hearth-mine`, the CLI light miner this route exists for,
    # builds its requests in one helper (`hearth/node/bin/hearth-mine.js`)
    # and sets only `content-type`; the browser miner does a plain
    # `fetch` with no headers at all (`hearth/web/assets/mining/miner.js`,
    #). Putting basicAuth on this router would publish a route that every
    # existing caller answers with a 401, which is worse than the griefing risk it
    # removes.
    #
    # It is the RIGHT next step and it is cheap on the CLI side — one header in
    # one helper — so it is recorded here as owed rather than dismissed. It needs
    # a change in `hearth`, which is not this repository's to write, and a
    # credential store this gateway does not have yet (Traefik's basicAuth
    # `usersFile`, mounted like `gateway/certs/` and gitignored the same way).
    cf-mining-throttle:
      rateLimit:
        average: 2
        period: 1s
        burst: 10
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # ── THE STREAM LIMIT, WHICH IS A DIFFERENT PRIMITIVE ON PURPOSE ───────────
    #
    # `GET /events` is a server-sent-event stream that is answered once and then
    # held open for as long as the miner is mining. Every other middleware in
    # this file is a `rateLimit`, and a `rateLimit` IS THE WRONG TOOL HERE:
    # it bounds requests per second, and this endpoint's cost is not a rate. One
    # subscriber is ONE request, ever, that never completes. 500 browsers opening
    # one stream each over ten minutes is 0.83 requests/second — under
    # `cf-mining-throttle`'s average of 2 without ever touching the burst — and
    # 500 sockets held on a single-threaded node.
    #
    # `inFlightReq` is the primitive that counts CONCURRENT requests, which for a
    # stream is the same thing as concurrent subscribers. 4 per client IP: a
    # browser opens one per mining tab, the fallback path already tolerates
    # losing it, and four is more tabs than anyone mines from while still being
    # 1/64th of Hearth's own `SSE_MAX_CLIENTS = 256` — so no single address can
    # spend a meaningful fraction of the node's ceiling.
    #
    # KEYED ON `Cf-Connecting-Ip` FOR THE REASON THE RPC BLOCK GIVES AT LENGTH:
    # every request in the world reaches the node from cloudflared's address, so
    # the node's own cap can only ever be a total. This gateway is the only place
    # the individual client is visible, and a total with no per-client share lets
    # one caller take all of it.
    #
    # BOTH HALVES ARE NEEDED AND NEITHER SUBSTITUTES. This one cannot know what
    # else is already attached to the node (a second gateway, the CLI miner, an
    # operator on the LAN); Hearth's cannot know who is asking. hearth's
    # `node/src/sse.js` carries the mirror of this comment.
    #
    # THE REFUSAL IS FATAL TO AN `EventSource` — Traefik answers `inFlightReq`
    # overflow with 429, and any non-200 sets `readyState` to CLOSED with no
    # browser retry. That is the intended behaviour, not a wart: network-site's
    # miner wires `onerror` to a visible notice and falls back to polling, so a
    # refused client degrades loudly instead of hanging on a stream that is never
    # written to.
    cf-sse-inflight:
      inFlightReq:
        amount: 4
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # ── VERIFICATION IS THE MOST EXPENSIVE ANONYMOUS REQUEST THIS ESTATE TAKES ─
    #
    # `POST /verify` hands a stranger's JSON to a Solidity compiler. The cost is
    # not comparable to anything else routed here: a submission naming a compiler
    # version the service has not cached makes it fetch ~9 MB from
    # `binaries.soliditylang.org`, and then compiling a large import graph is
    # seconds of single-threaded CPU on a Node process that serves every other
    # verification request from the same event loop. `cf-rpc-throttle`'s average
    # of 20/s would let one client hold the service permanently busy while
    # staying comfortably inside its limit.
    #
    # SO THE NUMBER IS PER MINUTE, NOT PER SECOND, and it is small: 6 a minute
    # with a burst of 3. A person verifying a contract does it once and gets an
    # answer or a mismatch; the retry loop that matters is "fix the settings and
    # resubmit", which is minutes of human work between attempts. Nothing
    # legitimate is shaped like a stream of verifications.
    #
    # READS ARE NOT BEHIND THIS. `GET /contracts` and `GET /compilers` answer out
    # of the on-disk store with no compilation, and the explorer's `/api` — which
    # is how a reader actually reaches a verified source — is a different router
    # with `cf-rpc-throttle` on it. Rate-limiting the read path to protect the
    # write path would make the published source hard to read in order to make it
    # cheap to publish, which is backwards.
    #
    # Keyed on `Cf-Connecting-Ip` for the reason the RPC block gives at length:
    # every request in the world reaches the origin from cloudflared's address,
    # so this gateway is the only place the individual client is visible.
    cf-verify-throttle:
      rateLimit:
        average: 6
        period: 1m
        burst: 3
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

  routers:
    # ─────────────────────────────────────────────────────── hub — AND SIGN-IN ──
    #
    # THE SURFACE THE WHOLE BROWSER CATALOGUE WAITS ON.
    #
    # `signInRedirect()` sends every signed-out visitor of every product to
    # `${accountUrl()}/login`, and `accountUrl()` resolves the `signin` registry row, which rides
    # on Hub at `/account` (ui/packages/ui/src/surfaces.ts, the `signin` entry). Nothing in any
    # environment served that address: identity renders no HTML, and there is no `account-web`
    # among the 58 repositories. doc 22 §8.1 calls it the largest blocker in the catalogue.
    #
    # hub-web's nginx.conf already enumerates `/account` as a client route, so the moment the
    # bundle ships a sign-in page this router serves it. That is the environment's half of the
    # blocker, and it is why estate-verify asserts `hub.<apex>/account/login` by name.
    cf-web-hub:
      rule: 'Host(`hub{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-hub

    # hub-api behind Hub's own hostname. hub-web asks `/v1/dashboard`, `/v1/portfolio`,
    # `/v1/activity`, `/v1/search`, `/v1/next-actions` RELATIVE to the page
    # (hub-api/src/server.ts, quoted in hub-web/src/lib/money.ts).
    cf-api-hub:
      rule: 'Host(`hub{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-hub-api

    # ─────────────────────────────────────────────────────────────── the apex ──
    # `site` has an EMPTY subdomain in the registry, so it is the bare apex rather than
    # `site.<apex>`. A router matching `Host(`.<apex>`)` would be the empty-host bug wearing a
    # different hat.
    # The `www` spelling of the apex, redirected to it. Same priority as the apex router: the two
    # rules match different hostnames and never compete. Traefik requires a service even when a
    # middleware answers first, so it names the one this redirects TO.
{{ if eq (env "CF_WEB_RETIRED") "true" }}
    # `eq (env …) "true"` RATHER THAN A BARE `if env …`, and the reason is check 6.
    # `scripts/surface-routes.py` requires every variable this directory reads to carry a NON-EMPTY
    # value in every `compose/env/traefik*.env`, because an empty value and an unset one are the
    # same thing to the file provider and that is how the whole public API once rendered as
    # ``Host(``)``. Under a bare `if`, mainnet's only way to drop these routers was to leave the
    # variable out — which is exactly what check 6 refuses, and deploy CI was red on it. Comparing
    # a value lets both environments STATE their answer: `true` on testnet, `false` on mainnet.
    # Neither file can now be silent about whether this estate is retired.
    #
    # The retirement routers (micro-org#459 step 5) — see the middlewares above for the whole
    # argument. 302 rather than 301 while the retirement beds in: a cached permanent redirect is
    # the one thing that cannot be rolled back. `!PathPrefix` keeps every `/v1` API answering,
    # which the combined view's cross-estate reads depend on. The service names a real one because
    # Traefik requires it; the middleware answers before it is consulted.
    #
    # ── THE SECOND NEGATIVE, AND WHY IT IS NOT BELT-AND-BRACES ────────────────────────────────
    #
    # WHAT IT DID. `^[a-z0-9-]+-testnet\.` matches EVERY testnet hostname, and this router's 550
    # outranks the 500 that most routers carry — so it did not retire the testnet FRONTENDS, it
    # retired the testnet ESTATE'S FRONT DOOR. Measured, not reasoned:
    #
    #     GET  https://rpc-testnet.cloudsforge.online/   → 302 https://rpc.cloudsforge.online/
    #     POST …/  {"method":"eth_chainId"}  (following) → {"result":"0x1cf3"}
    #
    # `0x1cf3` is 7411. MAINNET. Testnet is 7412. So chain 7412 had NO PUBLIC JSON-RPC AT ALL,
    # and — the part that makes this worse than an outage — a wallet, a deploy script or a dapp
    # pointed at the testnet RPC got a healthy 200 carrying MAINNET STATE. Every `curl` said
    # working. `p2p-testnet` went the same way: a 302 is not an upgrade, so peer gossip over the
    # tunnel could not open at all. Only `cf-api-mining` survived, and only because it happens to
    # sit at 600.
    #
    # WHY `!PathPrefix(`/v1`)` DID NOT ALREADY COVER IT. That negative spares the estate's HTTP
    # APIs, which are versioned and live under `/v1`. The chain endpoints are not HTTP APIs in
    # that sense: hearth's `jsonrpc/server.js` has no path dispatch whatsoever and answers JSON-RPC
    # at `/`, and the p2p WebSocket lands on `/p2p`. A path negative cannot spare a service that
    # serves the root, so the exclusion has to be by HOSTNAME.
    #
    # WHAT IT EXCLUDES, AND WHERE THE LIST COMES FROM. Exactly the registry rows with
    # `servesUi: false` — `ui/packages/ui/src/surfaces.ts`. That is the same predicate the CORS
    # allowlist (check 5) and the cross-environment origins (check 10) are already keyed on, and
    # it is the correct one here for the reason the retirement exists: this redirect says "the
    # PAGE you wanted is now served on mainnet". A hostname with no page has no such answer to
    # give, so redirecting it is always wrong, whatever it happens to serve instead.
    #
    # `surface-routes.py` check 11 asserts this alternation EQUALS that set, in both directions —
    # a new service hostname that is not here fails CI rather than silently answering as mainnet,
    # and a name here that starts serving a UI fails too. The list is not maintained by hand; it
    # is maintained by the check.
    #
    # THE FAILURE DIRECTION IS DELIBERATE. Excluding too much means a retired frontend keeps
    # serving its own testnet bundle — the pre-#459 behaviour, visibly wrong to a reader. Failing
    # to exclude means a service answers with ANOTHER NETWORK'S STATE, which is invisible. When a
    # regex here has to be wrong, it should be wrong in the direction someone notices.
    cf-retired-web-sub:
      rule: 'HostRegexp(`^[a-z0-9-]+-testnet\.cloudsforge\.online$`) && !HostRegexp(`^(?:account|api|nimbus|p2p|pay|rpc|studio|vault)-testnet\.cloudsforge\.online$`) && !PathPrefix(`/v1`)'
      priority: 550
      entryPoints: [websecure, tunnel]
      middlewares: [cf-retired-sub-to-mainnet]
      service: cf-web-site
    cf-retired-web-apex:
      rule: 'Host(`testnet.cloudsforge.online`) && !PathPrefix(`/v1`)'
      priority: 550
      entryPoints: [websecure, tunnel]
      middlewares: [cf-retired-apex-to-mainnet]
      service: cf-web-site
{{ end }}
    cf-web-www:
      rule: 'Host(`www.{{ env "CF_SITE_HOST" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-www-to-apex]
      service: cf-web-site

    cf-web-site:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-site

    # ──────────────────────────────────────────────────────────────── market ──
    # ── WAVE 3a, AND THE FIRST CONSOLIDATED SURFACE THAT BRINGS A SERVICE ─────
    #
    # `market.<apex>` served this until 2026-08-19 and now 301s to
    # `<apex>/market`. Waves 1 and 2 moved a bundle and nothing else — `journal`
    # has no API and `exchange` reads a chain cross-origin — so this is the first
    # time the estate has to move a surface's ROUTES with its bundle, which is
    # decision 4 in `docs/apex-consolidation.md` and the reason the wave order
    # puts it third rather than first.
    #
    # FOUR ROUTERS, AND EACH ONE HAS TO EXIST
    #
    #   cf-web-market       the bundle, on the apex at `/market`          600
    #   cf-api-market-apex  its API, at `/market/v1`, mount stripped      700
    #   cf-web-market-sub   the tombstone on the hostname it left         500
    #   cf-api-market-host  the API on that hostname, still direct        600
    #
    # THE RULE IS NOT `PathPrefix(`/market`)`, and that is measured rather than
    # assumed. Traefik 3.2.3's PathPrefix is a RAW STRING PREFIX — the bare form
    # also claims `/marketplace` and `/market-old`, neither of which is this
    # surface. `Path` is exact and `PathPrefix(`/market/`)` cannot match a longer
    # first segment, so the alternation is this surface's whole address space and
    # nothing else. `check-base-paths-agree.py` rejects the bare form.
    #
    # THE API IS AT 700 AND NOT 600, WHICH IS A NEW BAND FOR THIS FILE. The
    # convention was bundles 500, retirement 550, APIs 600, and a path-mounted
    # bundle moved to 600 because it has to beat both the apex's own bundle and
    # any retirement rule parked on the host. `/market/v1` CONTAINS `/market`, so
    # both routers below can match `GET /market/v1/listings` and only priority
    # decides which — at equal priority Traefik falls back to rule LENGTH, which
    # is not a decision anybody made. An API mounted under a consolidated surface
    # therefore sits one band above its own bundle, and the eleven surfaces still
    # to move will each need the same. `check-router-prefix-ordering.py` fails
    # the tie rather than letting rule length settle it.
    #
    # Gated on CF_WEB_RETIRED for the same reason `cf-web-journal` and
    # `cf-web-exchange` are: the apex mount is meaningless on testnet, where the
    # apex is itself a 302 to mainnet. `ne` and not `not` — `env` returns a
    # STRING and `"false"` is truthy to a Go template, so `not (env …)` would
    # delete the router from mainnet too.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-market:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/market`) || PathPrefix(`/market/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-market
{{ end }}

    # ── THE API IS **OUTSIDE** THE GATE, AND THAT IS THE COMBINED VIEW ────────
    #
    # It was inside it for six hours on 2026-08-19 and that was a defect, found
    # by probing testnet rather than by any check. On testnet CF_WEB_RETIRED is
    # `true`, so the whole block above disappears — and with the API router
    # inside it, `testnet.<apex>/market/v1/listings` fell through to
    # `cf-retired-web-apex` at 550 and answered **302 to mainnet**.
    #
    # A cross-origin fetch FOLLOWS that redirect. So a reader on
    # `<apex>/market` who pressed Testnet got a 200 full of MAINNET listings
    # with "Testnet" selected in the switcher — the combined view silently
    # showing the wrong estate, which is the exact class of defect micro-org#459
    # and #133 exist about, reintroduced by the consolidation.
    #
    # THE BUNDLE IS RETIRED ON TESTNET AND THE API IS NOT, which is the same
    # split the estate already runs on every `-testnet` hostname:
    # `cf-retired-web-sub` carries `!PathPrefix(`/v1`)` for precisely this
    # reason — "the web hostname is retired and 302s to its mainnet sibling;
    # `/v1` on it is exempt and still answers from the testnet service, which is
    # what makes this readable at all."
    #
    # 700 is what enforces it here rather than a `!PathPrefix`: it already had
    # to outrank the bundle at 600, and it outranks the retirement band at 550
    # for free. Adding `/market/v1` to the retirement rule's negation instead
    # would need one more clause per surface, in a rule whose failure mode is
    # silent.
    cf-api-market-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/market/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-market-strip-mount]
      service: cf-svc-market

    # ── THE HOSTNAME IT LEFT, WHICH KEEPS ANSWERING FOREVER ──────────────────
    #
    # A tombstone, at 500 so the retirement redirects at 550 still outrank it on
    # testnet — where a `-testnet` name must go to mainnet before it goes to a
    # path. On mainnet nothing outranks it and it answers the 301.
    #
    # `service:` is still `cf-web-market` even though the middleware answers
    # before the service is ever reached: Traefik requires a router to name one,
    # and naming the surface's own backend keeps the row readable as "this is
    # where the market used to be" rather than pointing at an unrelated container
    # that happens to exist.
    #
    # It never gets deleted. A 301 that has been served for two years is still
    # the only thing between an old link and a 404.
    cf-web-market-sub:
      rule: 'Host(`market{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-market-to-apex]
      service: cf-web-market

    # ── AND THE API ON THAT HOSTNAME, WHICH IS NOT REDIRECTED ────────────────
    #
    # Unchanged, and deliberately outranking the tombstone at 500 so that the
    # redirect above never sees a `/v1` call. A 301 answers a GET well and
    # mangles a POST: a client that follows one is entitled to drop the body and
    # downgrade the method, so redirecting an API is how an integration starts
    # silently losing writes. The BUNDLE moved to the apex; third-party callers
    # of `market.<apex>/v1` did not have to, and nothing here asks them to.
    cf-api-market-host:
      rule: 'Host(`market{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-market

    # ─────────────────────────────────────────────── create (micro-mint-web) ──
    # ── WAVE 3b — `create.<apex>` BECOMES `<apex>/create` ────────────────────
    #
    # Four routers, exactly the arrangement `market` proved in wave 3a: the
    # bundle at 600, its API at 700 with the mount stripped, the tombstone at
    # 500, and the API on the old hostname unchanged and NOT redirected.
    #
    # The rule is not `PathPrefix(`/create`)`: Traefik 3.2.3's PathPrefix is a
    # RAW STRING PREFIX, so the bare form would also claim `/creates` and
    # `/create-old`. `check-base-paths-agree.py` rejects it.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-create:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/create`) || PathPrefix(`/create/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-create
{{ end }}

    # OUTSIDE the gate, and micro-deploy#174 is why: with the API router inside
    # it, `testnet.<apex>/create/v1/…` fell through to `cf-retired-web-apex` at
    # 550 and answered 302 TO MAINNET — which a cross-origin fetch follows, so
    # the combined view showed the wrong estate's data with Testnet selected.
    # 700 already outranks the bundle at 600 and the retirement band at 550.
    cf-api-create-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/create/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-create-strip-mount]
      service: cf-svc-mint

    # The hostname it left, answering 301 forever. It never gets deleted: a
    # redirect served for two years is still the only thing between an old link
    # and a 404.
    cf-web-create-sub:
      rule: 'Host(`create{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-create-to-apex]
      service: cf-web-create

    # And its API, unchanged and above the tombstone so the 301 never sees a
    # `/v1` call. Third-party callers did not have to move; the bundle did.
    cf-api-create:
      rule: 'Host(`create{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-mint

    # ───────────────────────────────────────────────────────────────── trade ──
    # ── WAVE 3b — `trade.<apex>` BECOMES `<apex>/trade` ──────────────────────
    #
    # The same four, and the same reasoning as `create` directly above. The bare
    # `PathPrefix(`/trade`)` would also claim `/trademark`.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-trade:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/trade`) || PathPrefix(`/trade/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-trade
{{ end }}

    cf-api-trade-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/trade/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-trade-strip-mount]
      service: cf-svc-trade

    cf-web-trade-sub:
      rule: 'Host(`trade{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-trade-to-apex]
      service: cf-web-trade

    cf-api-trade-host:
      rule: 'Host(`trade{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-trade

    # ──────────────────────────────────────────────────────────────── worlds ──
    # ── WAVE 3e — `worlds.<apex>` BECOMES `<apex>/worlds` ─────────────────────
    #
    # THREE ROUTERS, NOT FOUR, AND THE MISSING ONE IS THE POINT. Every wave since
    # 3a has added a `cf-api-<surface>-apex` that remounts the service under the
    # mount and strips the prefix back off. This one does not, because there is
    # nothing to remount: `worlds-web`'s API base is the `api` SURFACE, not this
    # one. Its requests are absolute to `api.<apex>` and always were — see the
    # header of `worlds-web/src/lib/hosts.ts`, which argues at length that
    # `PRODUCT` and `API_SURFACE` are deliberately different keys.
    #
    # So a mounted bundle's relative `/v1` — the failure decision 4 exists for —
    # is not a thing that happens here. Adding a `/worlds/v1` router "for
    # symmetry" would publish a second address for a service nobody reaches that
    # way, and `check-api-remount.py` would then demand a stripPrefix for it.
    #
    # `Path(`/worlds`) || PathPrefix(`/worlds/`)` and not a bare
    # `PathPrefix(`/worlds`)`: Traefik 3's PathPrefix is a RAW STRING PREFIX, so
    # the bare form would also claim `/worldsomething`.
    #
    # ── AND THE THREE TITLES WILL NEST INSIDE THIS RULE'S PREFIX ──────────────
    #
    # `<apex>/worlds/emberkin` MATCHES `PathPrefix(`/worlds/`)`. When those move,
    # each title's bundle router has to outrank this one or the catalogue answers
    # for the game — a 200 carrying the wrong application. That is the whole
    # reason they are a separate wave rather than four rows in this one.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-worlds:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/worlds`) || PathPrefix(`/worlds/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-worlds
{{ end }}

    cf-web-worlds-sub:
      rule: 'Host(`worlds{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-worlds-to-apex]
      service: cf-web-worlds
    cf-api-worlds-host:
      rule: 'Host(`worlds{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-worlds

    # ──────────────────────────────────── worlds-api — REMOVED, AND IT STAYS REMOVED ──
    #
    # REMOVED: cf-api-worlds-api — worlds-api. was folded into api. and has no DNS record
    #
    # That router stood here, `Host(worlds-api{CF_WEB_SUFFIX})` -> `cf-svc-worlds`.
    # It is deleted, and this note exists so nobody restores it from the comment that used to be
    # here — that comment argued at length for the fold going `api.` -> `worlds-api.`, and THE
    # FOLD WENT THE OTHER WAY: `worlds-api` was consolidated INTO `api`. `api.` is the name a
    # third party is given, so `api.` is the name that survived; see the `api` row in
    # `ui/packages/ui/src/surfaces.ts`.
    #
    # **`worlds-api.<apex>` HAS NO DNS RECORD ON EITHER NETWORK AND IS NOT GETTING ONE.**
    # A router for a host that does not resolve is worse than no router: it makes a re-check of
    # this file conclude "worlds-api is configured, so it is fine". It was not fine, and that
    # reading is how the Forge Worlds outage survived review.
    #
    # The game API is reachable, unchanged, at two live addresses:
    #   `worlds{CF_WEB_SUFFIX}/v1` via `cf-api-worlds-host` above, and
    #   `api{CF_WEB_SUFFIX}/v1/titles|players|provisions|seasons` via `public-api.yml`.
    # `micro-worlds-web` calls the second — `API_SURFACE` is `'api'` (`worlds-web/src/lib/hosts.ts`).

    # ────────────────────────────────────────────────────────────── explorer ──
    # THE CHAIN INDEX IS ROUTED NOW, AND THE COMMENT THAT SAID IT WAS NOT IS THE DEFECT.
    #
    # What stood here until this edit described `cf-api-explorer` — "the same shape as cf-api-hub
    # above, with the host templated on explorer, PathPrefix `/v1`, priority 600, and a
    # cf-svc-indexer loadBalancer pointing at http://indexer:4000" — as a thing to add ONE DAY,
    # and read, to anyone skimming, exactly like documentation of a router that was present.
    # It was never defined. A DESCRIBED-BUT-UNDEFINED ROUTER IS WORSE THAN AN ABSENT ONE: it
    # answers the question "is the indexer routed?" with a yes, in prose, in the file that would
    # know.
    #
    # Its premise had also expired. The comment's whole argument was that `indexer` sat behind
    # `profiles: [indexer]` and was not started, so a router would answer 502 and read as "the
    # indexer fell over". THAT PROFILE IS GONE — compose/docker-compose.estate.yml records
    # its removal and the reason ("THAT WORK IS COMMITTED … AND THE IMAGE BUILDS") — and the
    # container has been up and healthy on `cloudsforge-estate_default`, which this gateway is
    # also attached to, resolving `indexer` to a live address. The precondition for the omission
    # dissolved; the paragraph explaining the omission did not.
    #
    # ── WHAT IT COST, MEASURED BEFORE THIS EDIT ─────────────────────────────────────────────
    #
    #   http://127.0.0.1:4108/chains/ember/testnet/status         -> 200  application/json
    #   http://127.0.0.1:4108/v1/chains/ember/testnet/status      -> 200  application/json
    #   https://explorer.<apex>/v1/chains/ember/testnet/status    -> 404  TEXT/HTML
    #   https://network.<apex>/v1/chains/ember/testnet/status     -> 404  from cf-svc-faucet
    #
    # `micro-network-site`'s chain panel resolves the chain index through the registry key
    # `explorer` (network-site/src/lib/hosts.ts, `CHAIN_INDEX_SURFACE`), so the request it makes
    # is the third line. The panel rendered "No figures for ember:testnet — Request failed (404)"
    # against a live chain at tip height 2594, which is the correct behaviour for this estate and
    # the wrong answer to give a visitor.
    #
    # AND CHECK THE CONTENT TYPE, NOT THE STATUS. `cf-web-explorer` below matches the host with no
    # path constraint, so before this router existed some indexer paths returned **200 carrying
    # index.html** rather than a 404 — `/chains/ember/testnet/status` did exactly that. A reader
    # verifying by status code alone concludes the route works. The prefixed form 404'd only
    # because the bundle's own static server has no `/v1` fallback; that is luck, not routing.
    #
    # `/v1` IS THE CORRECT PREFIX AND BOTH CALLERS WERE ALREADY RIGHT. indexer mounts every route
    # twice — `PREFIXES` is `['/v1', '']` (indexer/src/server.ts), looped over in `buildRoutes`
    # (indexer/src/server.ts) — so there is no path mismatch to resolve and NO REWRITE
    # MIDDLEWARE IS WARRANTED. `/v1` is the estate convention; the service's own comment at
    # indexer/src/server.ts says the bare form exists for its operator runbooks rather than
    # for new callers. Both bundles that read this surface already use the `/v1` form
    # (explorer-web/src/lib/indexer.ts, network-site/src/lib/chainstatus.ts), so this
    # router is prefixed and the bare form is deliberately NOT routed at the edge: mounting it here
    # would publish the runbook spelling as a public contract and make the estate's one convention
    # two.
    #
    # CORS needs nothing added. `network-site` reads this host CROSS-ORIGIN — the bundle is served
    # from `network.<apex>` and resolves the chain index to `explorer.<apex>` — and micro-indexer
    # sends no `access-control-*` header of its own anywhere in its source. The estate's CORS is
    # one middleware on the entrypoint chain (compose/docker-compose.gateway.yml,
    # `cf-cors@file`), so it applies to this router without being listed on it, and the network
    # surface's origin under the estate apex is already in that allowlist
    # (gateway/dynamic/policy.yml, the CF_WEB_APEX block, the `network.` line). The reads are
    # anonymous — `authoriseRead` returns null and lets the handler run when no bearer is
    # presented (indexer/src/server.ts) — so nothing here needs a credential.
    #
    # The templated hostname is spelled out in the RULE below and nowhere in this prose, and that
    # is the file's standing rule rather than a stylistic choice: a Go template action inside a
    # YAML comment is still an action to the file provider, which renders this file BEFORE
    # anything parses the YAML and has no idea what a comment is. An unclosed one takes every file
    # in this directory down with it.
    # ── WAVE 3h — `explorer.<apex>` BECOMES `<apex>/explorer` ─────────────────
    #
    # The LAST surface parked on a design question rather than on mechanics, and
    # the question had an answer the plan already knew. Its registry row said:
    # "a consolidated surface's reads are origin PLUS MOUNT, so every caller has
    # to learn the difference between WHICH ESTATE and WHERE UNDER IT."
    #
    # That is true and it is not a redesign — it is the composition wave 3c made
    # for `agora`. `viewedApiOrigin()` still answers WHICH ESTATE and returns an
    # ORIGIN; `explorer-web/src/lib/api.ts` composes `BASE` onto it at the one
    # call site that reads across estates. Keeping the two apart is the point:
    # the first draft of 3c made the origin function return origin-plus-mount,
    # which is TRUTHY, so the "am I reading the other estate?" test stopped being
    # consulted and the switcher silently went on reading mainnet.
    #
    # `Path(`/explorer`) || PathPrefix(`/explorer/`)` and not a bare prefix:
    # Traefik 3's PathPrefix is a RAW STRING PREFIX and would claim
    # `/explorer-staging`.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-explorer-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/explorer`) || PathPrefix(`/explorer/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-explorer
{{ end }}

    # Outside the `CF_WEB_RETIRED` gate — that gate is TESTNET, and an API inside
    # it answers testnet's own reads with a 301 to mainnet, which `fetch` follows
    # silently and cross-origin. That failure is sharper on THIS surface than on
    # any other: the whole point of the explorer is telling a reader which chain
    # and which network an address belongs to, and a silent cross-estate redirect
    # would show mainnet data under a testnet heading.
    cf-api-explorer-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/explorer/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-explorer-strip-mount]
      service: cf-svc-indexer

    cf-web-explorer:
      rule: 'Host(`explorer{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-explorer-to-apex]
      service: cf-web-explorer
    # Priority 600 beats `cf-web-explorer`'s 500 on the same host, which is how every
    # surface-plus-API pair in this file separates a bundle from its service. No `cf-web-headers`:
    # that middleware sets a bundle's CSP and frame policy, and this upstream answers JSON.
    cf-api-explorer:
      rule: 'Host(`explorer{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-indexer

    # ────────────────────────────────────── developers (micro-devportal-web) ──
    # ── WAVE 3g — `developers.<apex>` BECOMES `<apex>/developers` ─────────────
    #
    # The console was PARKED for two waves, and the reason is worth keeping: the
    # plan had it in wave 2 and called it "documentation". It is not — it is the
    # developer platform CONSOLE, and `cf-api-devplatform` serves 35 `/v1`
    # handlers behind it. Checking that claim against this router table is what
    # produced the corrected "count APIs by the router's UPSTREAM" test, and
    # what put `foresight` last.
    #
    # `Path(`/developers`) || PathPrefix(`/developers/`)` and NOT a bare
    # `PathPrefix(`/developers`)`: Traefik 3's PathPrefix is a RAW STRING PREFIX,
    # so the bare form would also claim `/developers-staging`.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-developers-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/developers`) || PathPrefix(`/developers/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-developers
{{ end }}

    # Outside the `CF_WEB_RETIRED` gate — that gate is TESTNET, and an API inside
    # it answers testnet's own reads with a 301 to mainnet, which `fetch` follows
    # silently and cross-origin. micro-deploy#174; enforced by
    # `check-api-remount.py`'s gate-depth tracking.
    #
    # 700 over the bundle's 600, for the reason every `cf-api-*` router in this
    # file gives: both rules match `/developers/v1/projects`, and the bundle
    # winning means every API call is answered with index.html — a 200 carrying
    # HTML where JSON was expected. On a console whose every screen mints or
    # revokes a credential, that failure is a page that looks signed-in and can
    # do nothing.
    cf-api-developers-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/developers/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-developers-strip-mount]
      service: cf-svc-devplatform

    cf-web-developers:
      rule: 'Host(`developers{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-developers-to-apex]
      service: cf-web-developers
    # LEFT UN-REDIRECTED at 600, above the tombstone. This is the hostname where
    # not redirecting the API matters most in the whole estate: these calls mint
    # and revoke API credentials, so they are POSTs and DELETEs, and a client
    # that follows a 301 re-issues most of them as a GET. A revoke that quietly
    # became a read leaves a credential live.
    cf-api-developers:
      rule: 'Host(`developers{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-devplatform

    # ───────────────────────────────────────────────────────────────── admin ──
    # The console and its API share `admin.<apex>` in production — the fact that hid a wrong
    # `devPort` in the registry for months, because production worked and `pnpm dev` did not
    # (ui/packages/ui/src/surfaces.ts, the `admin` row). Both halves are routed here.
    cf-web-admin:
      rule: 'Host(`admin{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-admin
    cf-api-admin:
      rule: 'Host(`admin{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-admin-api

    # ──────────────────── surfaces whose service WAS absent — four have arrived ──
    #
    # This section used to read "these five bundles are routed; the services behind them are NOT
    # IN THIS ESTATE", and said what to do when that changed: "The day one of these services
    # joins the estate, add its router beside its surface." **That day has come for four of the
    # five.** `aetherholm`, `emberkin`, `beacon` and `faucet` now have containers in
    # docker-compose.estate.yml, and `foresight` is the last one outstanding.
    #
    # The rule the section was built on still governs every router below and is unchanged: a
    # router pointing at a container that does not exist answers 502, which reads as "the service
    # fell over" — a wrong diagnosis, permanently. So a `/v1` router is written HERE ONLY WHEN the
    # container exists, and a surface whose backend is still absent keeps the bundle-only
    # treatment, where its API call 404s from nginx and honestly means "there is no such service".
    #
    # ── network — the bundle AND the faucet, which is a ROUTE on this host ──────
    #
    # `faucet` is not a hostname. The registry makes it a surface with
    # `subdomain: 'network'` and `basePath: '/faucet'` — "a route on the Network site rather than
    # a host of its own" — so `resolveApiBase` compares origins, finds them equal, and
    # `network-site` posts a drip to a RELATIVE `/v1/drips`. `network-site/src/lib/hosts.ts`
    # states the obligation this router discharges in as many words: "In production the origin is
    # this page's, so the base is '' and the drip request is relative — which is what the registry
    # asserts **and what the gateway therefore has to route**".
    #
    # `micro-faucet` serves `/v1/faucet`, `/v1/drips` and `/v1/drips/:id` and nothing else outside
    # the health endpoints, so `PathPrefix(/v1)` is its whole public surface. Priority 600 over
    # the bundle's 500, for the reason the tessera block gives: both rules match, and without the
    # higher number the SPA would answer the drip request with index.html — a 200 carrying HTML
    # where JSON was expected, which fails in the client as a parse error naming the wrong file.
    cf-web-network:
      rule: 'Host(`network{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-network
    # ── AND THE ROUTER EXISTS ONLY WHERE THE FAUCET CAN ──────────────────────
    #
    # This router was UNCONDITIONAL, and on the mainnet estate it answered 502:
    #
    #     https://network.cloudsforge.online/v1/faucet  ->  502   (2026-08-05)
    #     https://network.cloudsforge.online/faucet     ->  200 text/html
    #
    # There is no faucet container in the mainnet estate and there is never going
    # to be one. `faucet/src/env.ts` is `export const NETWORK = 'testnet' as
    # const`, annotated that way so `NETWORK === 'mainnet'` is a COMPILE ERROR
    # rather than a branch, and `faucet/src/index.ts` reads `eth_chainId`
    # at boot and exits on anything that is not 7412. Its own header says why: a
    # faucet is an unauthenticated withdrawal endpoint that happens to be pointed
    # at a worthless chain, and the EMBER mainnet on this host is mined, publicly
    # reachable and backs the ledger. So both faucet services carry
    # `profiles: ["ember-testnet"]` and mainnet starts neither.
    #
    # A 502 is the estate saying "there is a faucet here and it has fallen over".
    # That is a wrong diagnosis, permanently — and it is EXACTLY the failure the
    # rule at the head of this section already forbids: "a router pointing at a
    # container that does not exist answers 502… so a `/v1` router is written
    # HERE ONLY WHEN the container exists, and a surface whose backend is still
    # absent keeps the bundle-only treatment, where its API call 404s from nginx
    # and honestly means 'there is no such service'." The faucet's container
    # exists in one of the two environments, so the router does too.
    #
    # ── WHY `eq` AND NOT A BARE `if env` ON A CF_FAUCET_UPSTREAM ─────────────
    #
    # (Written without the braces on purpose. The file provider renders Go
    # template actions BEFORE it parses YAML, so `{`+`{ if … }`+`}` inside a `#`
    # comment is a REAL action — an unbalanced one here took the whole directory
    # down with `template: :1487: unexpected EOF`, and with it every router for
    # all twenty-four hostnames. `scripts/gateway-reload.sh --validate` caught it
    # in the throwaway and the live gateway was never touched. No other comment
    # in this file has ever contained one.)
    #
    # The chain upstreams at the foot of this file use the bare-`env` shape,
    # where an unset variable produces no router. That shape is unavailable here
    # and `scripts/surface-routes.py` check 6 is the reason, in its own words:
    # "An environment that genuinely should not carry that router changes the
    # ROUTER, where the reason can be written down — not this file, where its
    # absence looks like an oversight." An empty `CF_FAUCET_UPSTREAM=` in
    # `traefik.env` would be indistinguishable from somebody having deleted the
    # line. So the variable is SET IN BOTH environments, carries the estate's
    # actual chain, and the decision is taken here where this comment is.
    #
    # `CF_EMBER_NETWORK` is not a new fact either — `docker-compose.estate.yml`
    # already keys `env/chain.${CF_EMBER_NETWORK}.env` and the ledger's
    # reconciliation network on it, and `compose/testnet.env:126` sets it. The
    # gateway simply had no copy of the one variable that decides whether the
    # service behind this router exists.
    #
    # WHAT MAINNET ANSWERS INSTEAD: `cf-web-network` at priority 500 takes the
    # path, and the bundle's nginx answers `404 application/json` — measured on
    # `explorer.cloudsforge.online/v1/nope`, which has no `/v1` router and is the
    # same image. That is the honest answer and `estate-verify.sh` asserts both
    # the status and the content type, because a 404 of index.html would be the
    # right number from the wrong thing.
{{ if eq (env "CF_EMBER_NETWORK") "testnet" }}
    cf-api-network:
      rule: 'Host(`network{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-faucet
{{ end }}

    # ── status — the page whose whole job is to work when everything else does not ────
    #
    # `status-web` asks for `/api/status/public` SAME-ORIGIN, deliberately, and its own hosts.ts
    # argues the case: a relative request needs one hostname, one handshake and one certificate —
    # the ones the reader has already completed by having the page on screen — where a
    # cross-origin call to `beacon.<apex>` needs a second DNS answer, a second certificate and a
    # CORS preflight, "and every one of those is a way for the status page to fail during the
    # event it exists to describe".
    #
    # Nothing routed it. The page rendered *"Not determined — our status service answered with
    # HTTP 404"*, which is the honest thing for it to say and is why the frontend was left alone.
    #
    # `Path`, not `PathPrefix`, and exactly one of them. Beacon's other `/v1` routes are gated on
    # `BEACON_TOKEN` or an identity token and have no business on a public bundle's hostname; this
    # is the ONE projection built to be read by strangers, and `publicstatus.ts` is what makes that
    # safe — no target name, no error string, no latency and no journey step name is written into
    # the document at all.
    #
    # **THE ROUTE ALONE WOULD HAVE TURNED A 404 INTO A 401.** `beacon/src/server.ts` is
    # `if (!deps.publicStatus) await authorise(ctx, deps, READ_SCOPE)`, and `BEACON_PUBLIC_STATUS`
    # defaults FALSE (`beacon/src/env.ts`) and was set nowhere here. So the compose block sets
    # it, and the two changes are one change: a status page behind a login is not a status page.
    cf-web-status:
      rule: 'Host(`status{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-status
    cf-api-status-public:
      rule: 'Host(`status{{ env "CF_WEB_SUFFIX" }}`) && Path(`/api/status/public`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-beacon

    # ── beacon — THE HOST THAT WAS ALL API, AND NOW CARRIES A CONSOLE TOO ─────
    #
    # `beacon` is a registry SERVICE with `subdomain: 'beacon'`, so every bundle in the
    # estate composes `https://beacon.<apex>` from the registry — and for a while nothing
    # answered there at all. It is also what `status-web` reads: its own hosts.ts says the
    # status page's API base "is neither `hosts().status` — nothing serves an API there —
    # nor unconditionally `hosts().beacon`", which is only a decision it can make if the
    # second address exists.
    #
    # ── WHAT CHANGED, AND WHY THE ROUTER WAS RENAMED RATHER THAN REPOINTED ─────
    #
    # What stood here was ONE router, `cf-web-beacon`, matching the whole host and pointing
    # at `cf-svc-beacon`, with a paragraph arguing for exactly that: "no bundle is served at
    # `beacon.<apex>`, so there is no priority tie for a path prefix to break". **That
    # premise expired when `micro-beacon-web` was built.** `ui/packages/ui/src/surfaces.ts`
    # quotes the sentence above as the evidence for `servesUi: false`, and the consequence
    # it records is the defect: `beacon` is `inSwitcher: true`, so the operator switcher
    # offered every admin an entry that answered `404 application/json`.
    #
    # So the API router keeps its upstream and takes the name that describes it —
    # `cf-api-beacon`, at priority 600 — and `cf-web-beacon` is now the BUNDLE at 500, which
    # is the surface-plus-API shape every other pair in this file uses. Renaming rather than
    # adding a third router matters: `cf-web-*` pointing at a `cf-svc-*` upstream is the
    # whole-host shape that `scripts/surface-routes.py` reads to decide whether a host has an
    # API router at all, and leaving that name on the API would have made the two directions
    # of this file's own vocabulary disagree.
    #
    # ── THE PREFIX LIST IS READ OFF `beacon/src/server.ts`, NOT INHERITED ──────
    #
    # Every route micro-beacon defines, enumerated from its own `define(...)` calls:
    #
    #     /v1/gate  /v1/gate/history  /v1/gate/overrides  /v1/journeys
    #     /v1/journeys/:name/mute  /v1/probes  /v1/probes/:name  /v1/incidents
    #     /v1/incidents/:id/close  /v1/incidents/:id/updates  /v1/slos  /v1/slos/:name
    #     /v1/conformance     /api/status/public   /api/alerts/webhook
    #     /metrics   /livez   /readyz
    #
    # which is `/v1`, `/api`, `/metrics`, `/livez` and `/readyz` and nothing else. Checked
    # against the bundle's client routes in the other direction too: beacon-web's `ROUTES`
    # are `/`, `/journeys`, `/probes`, `/incidents`, `/objectives` and `/conformance`
    # (beacon-web/src/lib/routes.ts) — top-level names that look like the API's resources and
    # are NOT them, because the API's are all under `/v1`. There is no collision to break,
    # which is why this needs none of the `Accept`-header machinery foresight does.
    #
    # SAME ORIGIN IS MANDATORY HERE, NOT PREFERRED. micro-beacon sends no `access-control-*`
    # header anywhere in its source and answers 404 to a preflight, so a console on any other
    # hostname could not read it at all. That is why the bundle shares this host rather than
    # taking a `beacon-console.` of its own, and it is why beacon-web's nginx.conf answers
    # these same five prefixes with a plain-text 404 naming this file: if the priorities are
    # ever inverted, the operator gets that sentence instead of the console rendered under an
    # API address with a 404 status.
    #
    # NOT A PUBLIC READ SURFACE: every `/v1` route on beacon is gated on `BEACON_TOKEN` or
    # an identity token, checked inside the service. Routing the host does not open it —
    # and `/internal` stays refused above every router here by policy.yml's priority-100000
    # rule, which nothing in this file can outrank. `/api/status/public` is the one exception
    # and it is the service's own decision, taken with `BEACON_PUBLIC_STATUS`; see the
    # `cf-api-status-public` block above.
    cf-web-beacon:
      rule: 'Host(`beacon{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-beacon
    cf-api-beacon:
      rule: 'Host(`beacon{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/v1`) || PathPrefix(`/api`) || PathPrefix(`/metrics`) || PathPrefix(`/livez`) || PathPrefix(`/readyz`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-beacon

    # ── foresight — the fifth backend to arrive, and the only one whose API COLLIDES
    #    WITH ITS OWN BUNDLE'S CLIENT ROUTES ──────────────────────────────────
    #
    # `foresight` is now a container in docker-compose.estate.yml, so this surface gets an API
    # router beside its bundle for the emberkin/aetherholm/tessera reason. Two things make it
    # unlike all four of those, and both are read off the repositories rather than assumed.
    #
    # **1. THE UPSTREAM SERVES NO `/v1`.** `foresight/src/server.ts` defines every route at the
    # root — `/categories`, `/markets`, `/markets/:id`, `/markets/:id/stake-intent`, `/ideas`,
    # `/ideas/:id/approve` and the rest. That is the same shape identity has, and public-api.yml
    # already carries the consequence: it strips `/v1` for foresight (`cf-api-strip-version`)
    # because "11 §288 specifies the public API as URL-versioned" and the service is not. Here
    # there is no version to strip — `foresight-web` and the operator console both call the
    # unversioned paths directly — so the routers below name the RESOURCES.
    #
    # **2. `/markets` IS BOTH AN API PATH AND A CLIENT ROUTE.** `foresight-web/src/lib/routes.ts`
    # declares `{ path: 'markets', wildcard: true }` — `/markets/<uuid>` "is the address people
    # paste at each other" — and its nginx.conf serves the app shell for it. The SAME path is
    # what `foresight.ts` fetches for the market list. A plain `PathPrefix(/markets)` router
    # at priority 600 would therefore answer a person's pasted link with JSON, which is the
    # emberkin defect exactly inverted and no better.
    #
    # `/ideas`, `/categories`, `/image-config`, `/stake-assets` and `/me` have no such collision:
    # none is in `ROUTES`, so nginx already 404s them "on purpose, so that a wrong address answers
    # 404 rather than 200" — and THAT 404 is the one the operator panel used to get, because it
    # calls this host's API cross-origin and nothing here answered. Those five are routed
    # unconditionally.
    #
    # **`/me` IS THE FIFTH, AND THE CHECK FOUND IT BEFORE A USER DID.** `GET /me/stake-balances`
    # answers a signed-in reader "here is what you hold, per asset, in smallest units", and it is
    # what fills the holdings list in `foresight-web/src/components/custodialstake.tsx` — the row
    # you press to choose which coin to stake. Unrouted, the fetch is answered by the bundle,
    # `parseStakeBalances` returns null, and the panel renders a chooser with no amounts and no way
    # to press "stake all". Same silence as the two below, one release later.
    #
    # The difference this time is who noticed: `scripts/check-gateway-covers-api-paths.py`, written
    # after `/stake-assets`, failed on `/me` the first time it ran against the service's new route
    # table — before the release that carries the route reached anyone. That is the whole point of
    # reading the list from the side that cannot drift.
    #
    # `PathPrefix(/me)` rather than the exact path, deliberately. `/me/...` is the shape of "about
    # the caller", every route under it is authenticated by the service, and a second one — a
    # reader's own positions, say — should be reachable the day it is written rather than the day
    # somebody remembers this file. It cannot swallow a client route: `ROUTES` has no `me`.
    #
    # **`/stake-assets` WAS THE FOURTH ONE AND WAS MISSING, AND IT COST A WHOLE PRODUCT PATH.**
    # This is `/image-config` again — same shape, same silence, larger blast radius, and worth
    # writing down at length because the shape has now shipped twice.
    #
    # `foresight/src/server.ts` defines `GET /stake-assets`: what a bettor may bring, which is
    # the door into the CUSTODIAL stake path. `foresight-web/src/components/custodialstake.tsx`
    # fetches it on mount and — deliberately, and correctly — renders NOTHING at all if the fetch
    # fails: "a registry this app cannot read is a panel that does not appear. It is NOT a panel
    # with a guessed list of assets in it."
    #
    # With no router the fetch was answered by `cf-web-foresight` with the app shell, so it never
    # parsed, so the panel returned null on every market page on both estates, silently, since
    # the day it was written. What a signed-in reader with no browser extension saw was
    # `StakePanel`'s "Connect a wallet to go on" and no second option — the estate demanding a
    # MetaMask of a user whose money it is already holding. `29-native-assets.md` §6.5 exists to
    # close exactly that gap ("a custodial user cannot stake at all"), the service side of it was
    # built and tested, and one missing line here kept it off the screen.
    #
    # The lesson `/image-config` should have taught and did not: a JSON path served the SPA shell
    # is undetectable from the browser — 200 or 404, the body is HTML either way and the client
    # reports "could not read", never "not routed". `scripts/check-gateway-covers-api-paths.py`
    # now reads the service's own `define('METHOD', '/path')` calls and fails when a top-level
    # resource no router here matches appears, so the third instance cannot be found by a user.
    #
    # **`/image-config` WAS THE THIRD ONE AND WAS MISSING (#195).** It matched neither router, so it
    # fell through to `cf-web-foresight` and every caller was served the SPA shell with a 200 — the
    # worst answer available, because a client asking for JSON cannot tell a bundle from an outage.
    # `foresight-web/src/lib/studio.ts` fetches it with `auth: false` to learn studio's address,
    # and its header is explicit that the address must be ASKED FOR rather than guessed, naming the
    # two shipped defects that came of inventing a URL. With no route the operator's "Header image"
    # panel rendered its failure sentence instead of a file picker. Rendering was never affected:
    # `<img src>` comes from `image.bytesUrl`, which micro-foresight composes server-side from
    # `STUDIO_PUBLIC_URL` (`foresight/src/images.ts`), not from this endpoint.
    #
    # **THE CROSS-ORIGIN CALLER MOVED AT P13 AND DID NOT GO AWAY.** It was
    # `foresight-admin.<apex>`; it is now `admin.<apex>/foresight`, a section inside the operator
    # console (`admin-web/src/lib/hosts.ts`, `FORESIGHT_SURFACE = 'foresight'`). These three
    # routers are unchanged by that fold — the panel called this host from another origin before
    # and calls it from another origin still. What DID change is which origin, and therefore which
    # entry in `policy.yml`'s CORS allowlist has to be there: `https://admin.<apex>` already was.
    # The header list was the gap, and `idempotency-key` is now in it.
    #
    # `/markets` is separated by `Accept`, which is a FACT ABOUT THE TWO CALLERS and not a
    # heuristic: `foresight-web/src/lib/api.ts` and `admin-web/src/lib/api.ts` both
    # set `accept: application/json` on every request they make, and a browser NAVIGATION sends
    # `text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8` — which contains
    # `application/xml` and `application/xhtml+xml` and never `application/json`. So the deep link
    # gets the shell and the fetch gets the market. Priority 700 so it outranks both the resource
    # routers and the bundle.
    #
    # This is worth stating plainly because it is the kind of rule that looks clever and rots: if
    # foresight-web ever stops sending that header, the market list breaks and the deep link keeps
    # working — a visible failure in the surface that changed, not a silent one somewhere else.
    # The alternative was asking micro-foresight-web to move its client routes or micro-foresight
    # to version its API, and neither repository is mine tonight.
    # ══════════════════════════════════════════════════════════════════════════
    # WAVE 3i — `foresight.<apex>` BECOMES `<apex>/foresight`. THE LAST ONE.
    #
    # Fourteen of fourteen product surfaces are folders on the apex.
    #
    # ── THE API IS SIX UNVERSIONED PREFIXES, AND THEY MOVE WITH THE BUNDLE ────
    #
    # micro-foresight serves `/ideas`, `/categories`, `/image-config`,
    # `/stake-assets`, `/me/…` and `/markets` AT THE ROOT — no `/v1` anywhere.
    # A `/v1`-shaped test called this "no API", the correction produced the
    # better test (count by the router's UPSTREAM), and this surface went last.
    #
    # The mounted rule enumerates the same six one level down, and
    # `cf-foresight-strip-mount` takes `/foresight` off before the service sees
    # anything — so micro-foresight is unchanged and never learns it moved.
    #
    # ── AND `markets` IS BOTH A PAGE AND A RESOURCE ───────────────────────────
    #
    # `foresight-web` routes `/markets` and micro-foresight serves `/markets`.
    # The estate resolved that on the old hostname by matching
    # `Accept: application/json` — a browser navigating sends `text/html`, a
    # `fetch` sends JSON — and the mounted routers carry it across unchanged.
    # It is the ONE place in this file where a header, not a path, decides which
    # of two services answers, and it is why the markets router sits above the
    # resources router rather than beside it.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-foresight-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/foresight`) || PathPrefix(`/foresight/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-foresight
{{ end }}

    # Outside the `CF_WEB_RETIRED` gate — that gate is TESTNET, and an API inside
    # it answers testnet's own reads with a 301 to mainnet, which `fetch` follows
    # silently and cross-origin. micro-deploy#174.
    #
    # `PathPrefix(`/foresight/me/`)` on a SEGMENT BOUNDARY, not `/foresight/me`:
    # the bare form also claims `/foresight/metrics`, which is exactly how this
    # estate was found serving 229 lines of Prometheus output to the internet on
    # the old hostname earlier today.
    cf-api-foresight-resources-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (PathPrefix(`/foresight/ideas`) || PathPrefix(`/foresight/categories`) || PathPrefix(`/foresight/image-config`) || PathPrefix(`/foresight/stake-assets`) || PathPrefix(`/foresight/me/`))'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-foresight-strip-mount]
      service: cf-svc-foresight

    # 750, above the resources router as well as the bundle: this rule and
    # `cf-web-foresight-apex` both match `/foresight/markets`, and the `Accept`
    # header is the only thing separating the page from the JSON. A tie here
    # would serve the shell to a `fetch` — 200, HTML where JSON was expected.
    cf-api-foresight-markets-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/foresight/markets`) && HeaderRegexp(`Accept`, `application/json`)'
      priority: 750
      entryPoints: [websecure, tunnel]
      middlewares: [cf-foresight-strip-mount]
      service: cf-svc-foresight

    cf-web-foresight:
      rule: 'Host(`foresight{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-foresight-to-apex]
      service: cf-web-foresight
    # ── `PathPrefix(`/me`)` ALSO CLAIMED `/metrics`, AND IT WAS SERVING THEM ─────
    #
    # Traefik's PathPrefix is a RAW STRING PREFIX. `/metrics` begins with `/me`,
    # so this rule matched it and routed it to `cf-svc-foresight` — which serves
    # Prometheus metrics there. MEASURED 2026-08-20 against production:
    #
    #   GET https://foresight.<apex>/metrics  →  200, 229 lines
    #
    # including `foresight_service_token_usable`, `foresight_service_token_static`
    # and per-route request counts and latency histograms. Every other service in
    # this estate keeps `/metrics` off the public internet — the aetherholm block
    # above says so in as many words, "`/livez` and `/metrics` stay unrouted,
    # because liveness is for the orchestrator and `/metrics` is for Prometheus on
    # the compose network" — and `agora.<apex>/metrics` answers 301 rather than
    # 200, which is the control that proves this was not the intended shape.
    #
    # micro-foresight serves exactly ONE route under this prefix,
    # `/me/stake-balances`, so `PathPrefix(`/me/`)` loses nothing.
    #
    # And NOT `Path(`/me`)` beside it, which the first draft added defensively:
    # `check-gateway-covers-api-paths.py` rejects routing an exact path the
    # service does not define, and it is right to. A bare `/me` reaching the
    # service is a 404 from the service; reaching the bundle is the app's own
    # not-found screen under an honest 404 status, which is the better answer for
    # an address nobody serves. The day micro-foresight defines `/me`, that check
    # will demand this clause back.
    #
    # This is the SAME trap the mounted routers guard against with
    # `Path(`/x`) || PathPrefix(`/x/`)`, applied one level down. Anywhere a rule
    # names a prefix that is a prefix OF ANOTHER REAL PATH, the bare form is
    # wrong: `/me` and `/metrics` here, `/worlds` and `/worldsomething` there.
    cf-api-foresight-resources:
      rule: 'Host(`foresight{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/ideas`) || PathPrefix(`/categories`) || PathPrefix(`/image-config`) || PathPrefix(`/stake-assets`) || PathPrefix(`/me/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-foresight
    cf-api-foresight-markets:
      rule: 'Host(`foresight{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/markets`) && HeaderRegexp(`Accept`, `application/json`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      service: cf-svc-foresight

    # ── THE FORESIGHT-ADMIN BUNDLE ROUTER WAS HERE, and the P13 fold removed it ───────────
    #
    # Its name is deliberately not written out below. `scripts/surface-routes.py` check 4 fails on
    # any `cf-api-*`/`cf-web-*`/`cf-svc-*` name that appears in a COMMENT in this directory and is
    # defined nowhere in it — because "a router that exists only as prose answers 'is it routed?'
    # with a yes, in the file that would know". A tombstone naming the deleted router is exactly
    # that sentence, so this one describes it instead. The check caught this comment on its first
    # run, which is the check doing its job on the person who added the check's neighbour.
    #
    # `foresight-admin.<apex>` is served by nothing now. The Foresight operator panel is a SECTION
    # inside the operator console — `admin.<apex>/foresight` — so it is served by `cf-web-admin`
    # above, behind the same Cloudflare Access policy as the rest of that host, and it needs no
    # router of its own.
    #
    # Its API router was never here either, and that is the part worth keeping straight: the panel
    # called `foresight.<apex>` cross-origin then and it still does now from its new home. Those
    # routers — `cf-api-foresight-resources` and `cf-api-foresight-markets` — are directly above
    # and are UNCHANGED by the fold. What changed is the browser origin they answer, which is why
    # `policy.yml` gained `idempotency-key` in the same commit; see the note there.
    #
    # The deletion could not have been made here alone. `scripts/surface-routes.py` check 2 fails
    # on a router for a host no registry row declares, and check 1 fails on a registry row with no
    # router — so this line and `ui/packages/ui/src/surfaces.ts`'s `foresight-admin` row had to go
    # together, which is exactly the coupling that script exists to enforce.

    # ── emberkin and aetherholm — their backends ARRIVED, and their bundles were still
    #    talking to nginx ──────────────────────────────────────────────────────
    #
    # Both call their OWN registry host and not a sibling: `emberkin-web/src/lib/hosts.ts` is
    # `new URL(hosts().emberkin).origin` and aetherholm-web:52 the same for `aetherholm`. Since
    # both bundles are served AT those hosts, that origin is the page's own — so every request is
    # `/v1/...` on this hostname, and until now `cf-web-emberkin` was the only router matching it.
    # The bundle answered its own API calls with its own index.html.
    #
    # Written now rather than when the containers landed, because that is the drift this section
    # was created to prevent and it recurred inside one night: the compose file gained a service
    # and this file was not opened. `scripts/gateway-check.py --surfaces` now fails on it.
    # ══════════════════════════════════════════════════════════════════════════
    # WAVE 3f — THE THREE TITLES BECOME FOLDERS UNDER THE CATALOGUE
    #
    # `emberkin.<apex>` → `<apex>/worlds/emberkin`, and the same for the other
    # two. A title is a thing INSIDE Forge Worlds rather than a product beside
    # it, and the address finally says so.
    #
    # ── PRIORITY 650, WHICH IS A BAND THAT DID NOT EXIST BEFORE TONIGHT ───────
    #
    # This is the first NESTED mount in the estate, and nesting breaks the band
    # table this file has used since wave 3a. `cf-web-worlds` above is
    #
    #     Host(<apex>) && (Path(`/worlds`) || PathPrefix(`/worlds/`))   @ 600
    #
    # and `/worlds/emberkin/dex` MATCHES `PathPrefix(`/worlds/`)`. Both rules
    # are true for every address of every title. Traefik breaks the tie on
    # priority alone — it does NOT prefer the longer rule — so at equal priority
    # the catalogue would win and serve worlds-web's index.html for the whole of
    # Emberkin. The player would get a working page at the right URL showing the
    # wrong game, which is the failure mode hardest to notice from a screenshot.
    #
    # So: bundles on their own host 500, retirement redirects 550, APIs on their
    # own host 600, bundles mounted on the apex 600, NESTED BUNDLES 650, APIs
    # mounted under a bundle 700. The invariant is stated as a rule rather than
    # as three numbers: A ROUTER WHOSE PATH IS STRICTLY DEEPER THAN ANOTHER'S
    # MUST OUTRANK IT. `scripts/check-router-prefix-ordering.py` enforces it,
    # and `surfaces.test.ts` in micro-ui pins the depth relationship it needs.
    #
    # ── `Path(x) || PathPrefix(x/)` AND NOT A BARE PREFIX ─────────────────────
    #
    # Traefik 3's PathPrefix is a RAW STRING PREFIX, so `PathPrefix(`/worlds/em`)`
    # would claim `/worlds/emberkinsomething`. The two-clause form is exact.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-emberkin-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/worlds/emberkin`) || PathPrefix(`/worlds/emberkin/`))'
      priority: 650
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-emberkin
{{ end }}

    # Outside the `CF_WEB_RETIRED` gate — that gate is TESTNET, and an API inside
    # it answers testnet's own reads with a 301 to mainnet, which `fetch` follows
    # silently and cross-origin. micro-deploy#174; enforced by
    # `check-api-remount.py`'s gate-depth tracking.
    #
    # 700, above the bundle's 650 for the reason every other `cf-api-*` router
    # gives: both rules match `/worlds/emberkin/v1/saves`, and the bundle winning
    # means every API call is answered with index.html — a 200 carrying HTML
    # where JSON was expected, failing in the client as a parse error that names
    # the wrong file.
    cf-api-emberkin-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/worlds/emberkin/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-emberkin-strip-mount]
      service: cf-svc-emberkin

    cf-web-emberkin:
      rule: 'Host(`emberkin{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-emberkin-to-apex]
      service: cf-web-emberkin
    # LEFT UN-REDIRECTED, at 600 above the tombstone. A save is a PUT and a 301
    # in front of a PUT is re-issued by most clients as a GET — so a third party
    # still calling this hostname is answered rather than bounced.
    cf-api-emberkin:
      rule: 'Host(`emberkin{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-emberkin

{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-aetherholm-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/worlds/aetherholm`) || PathPrefix(`/worlds/aetherholm/`))'
      priority: 650
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-aetherholm
{{ end }}

    cf-api-aetherholm-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (PathPrefix(`/worlds/aetherholm/v1`) || Path(`/worlds/aetherholm/readyz`))'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-aetherholm-strip-mount]
      service: cf-svc-aetherholm

    cf-web-aetherholm:
      rule: 'Host(`aetherholm{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-aetherholm-to-apex]
      service: cf-web-aetherholm
    cf-api-aetherholm:
      rule: 'Host(`aetherholm{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-aetherholm
    # `/readyz` is not under `/v1`, so the prefix router above never saw it and the bundle's nginx
    # 404'd it. `aetherholm-web` reads it to render whether the game is up, so a routing gap told
    # every visitor a perfectly healthy service was degraded. `Path`, exactly one, and NOT
    # `PathPrefix`: `/livez` and `/metrics` stay unrouted, because liveness is for the orchestrator
    # and `/metrics` is for Prometheus on the compose network.
    #
    # This is the only health endpoint published anywhere in this file, and it is published because
    # a BUNDLE consumes it. It is the same shape as the status page above: a frontend asking its
    # own origin for something only its backend can answer.
    # ON THE APEX THIS IS `cf-api-aetherholm-apex`'s second clause, not a router
    # of its own — `Path(`/worlds/aetherholm/readyz`)`, written there so the
    # mount and the strip stay in one place. This one keeps the old hostname
    # answering for anything still pointed at it.
    cf-api-aetherholm-readyz:
      rule: 'Host(`aetherholm{{ env "CF_WEB_SUFFIX" }}`) && Path(`/readyz`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-aetherholm

    # ─────────────────────────────── tessera — THE FIRST TITLE WITH A SERVICE ──
    #
    # The section above exists for surfaces whose backend is not in this estate, and says what to
    # do when that changes: "The day one of these services joins the estate, add its router beside
    # its surface." This is that day. tessera-web AND tessera are both containers in
    # docker-compose.estate.yml, so this surface gets the `/v1` router the four above are
    # deliberately denied — and the reason they are denied it is the reason this one is safe to
    # write: a router pointing at a container that does not exist answers 502, which reads as "the
    # service fell over" rather than "there is no such service here". `cf-svc-tessera` points at a
    # container that does exist, so a 502 from it would be true.
    #
    # PRIORITY 600 ON THE API ROUTER, 500 ON THE SURFACE. Both rules match a request for
    # `tessera.<apex>/v1/wards`; Traefik resolves the tie by priority, and without the higher
    # number the bundle would win and every API call would be answered with index.html — a 200
    # carrying HTML where JSON was expected, which fails in the client as a parse error naming the
    # wrong file. That is the same ordering `cf-api-admin` uses above.
    #
    # WHY THE APP CAN CALL A RELATIVE PATH AT ALL: `resolveApiBase` returns the EMPTY STRING when
    # a bundle is served from its own registry host, so tessera-web's requests are same-origin
    # `/v1/...` and this router is what has to catch them. Route the bundle and not the API and the
    # surface loads beautifully and answers nothing.
    #
    # PORT 4022, not 4000. tessera is the one service in this estate that does not bind 4000, and
    # the number is argued rather than picked — 23-tessera.md §10.1, and the block beside its
    # container in docker-compose.estate.yml.
    # ── AND THE ART, WHICH IS THE ONE THING NO OTHER TITLE HAS ────────────────
    #
    # tessera-web asks its own origin for `/world-assets/…`, several hundred
    # requests per ward, deliberately same-origin so none of them costs a CORS
    # preflight. On the apex `/world-assets/` is MICRO-SITE's address, so every
    # sprite in the game would 404 with the client naming each missing file — it
    # substitutes nothing by design, so the world would render as holes.
    #
    # `assetBase()` therefore composes `/worlds/tessera/world-assets`, and it is
    # inside `PathPrefix(`/worlds/tessera/`)` below — one rule covers the bundle,
    # the art and the API, which is the point of a mount. The container's nginx
    # `alias`es the mounted path back onto the volume, so the PVC and the
    # pre-flight job that counts PNGs at `/world-assets` are both untouched.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-tessera-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/worlds/tessera`) || PathPrefix(`/worlds/tessera/`))'
      priority: 650
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-tessera
{{ end }}

    cf-api-tessera-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && PathPrefix(`/worlds/tessera/v1`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-tessera-strip-mount]
      service: cf-svc-tessera

    cf-web-tessera:
      rule: 'Host(`tessera{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-tessera-to-apex]
      service: cf-web-tessera
    cf-api-tessera:
      rule: 'Host(`tessera{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-tessera

    # ──────────────────────────────────────────────────────────────── nimbus ──
    #
    # identity, on the hostname every bundle in the estate calls it by.
    #
    # THIS IS THE OTHER HALF OF THE SIGN-IN BLOCKER. `consumeAuthCallback` posts the hand-off code
    # to `${cloudsforgeHosts().nimbus}/auth/handoff/redeem` and the token refresh goes to
    # `${nimbusUrl()}/auth/refresh` — both CROSS-ORIGIN from every surface, from `hub.<apex>`
    # included. Without this router the sign-in page loads and every call it makes 404s at the
    # gateway; with it, and with the CORS entry policy.yml now adds for this apex, the round trip
    # completes.
    #
    # The WHOLE host, not a prefix: identity serves its routes UNVERSIONED at the root
    # (identity/src/server.ts onward) and picking prefixes here would be a second, drifting
    # copy of that list. `/internal` is still refused above every router in this file by
    # policy.yml's priority-100000 rule, which nothing here can outrank.
    #
    # This note used to say "34 unversioned routes" and the figure was wrong — the count is
    # 41 today, from `grep -c "define('" src/server.ts` minus the two `/internal` routes.
    # It is stated as a command rather than as a number on purpose. A count written into a
    # comment in another repository is a claim that goes stale the next time someone adds a
    # route, silently, and identity's own README was wrong about the same number in two
    # places for the same reason. Nothing here depends on the figure: the router matches the
    # host, so it is right for 34 routes and right for 41.
    cf-web-nimbus:
      rule: 'Host(`nimbus{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      service: cf-svc-identity
    # ── `nimbus` IS A CATCH-ALL ONTO A SERVICE, SO /metrics RODE ALONG ─────────
    #
    # The router above has no path constraint — deliberately, because this
    # hostname IS micro-identity's public face and enumerating its paths would be
    # a second copy of its route table. The cost is that EVERY path reaches the
    # service, including the ones meant for the cluster.
    #
    # MEASURED 2026-08-20 against production:
    #
    #   GET https://nimbus.<apex>/metrics  →  200, 298 lines
    #
    # Prometheus output from the IDENTITY service, on the public internet. Found
    # while narrowing the same exposure on `foresight`, whose `PathPrefix(`/me`)`
    # was claiming `/metrics` by raw-string accident. Both were serving it; the
    # causes are different and so are the fixes.
    #
    # foresight needed no deny — its catch-all lands on the BUNDLE, whose nginx
    # 404s an address it does not own. This one lands on the service, so the
    # refusal has to be explicit.
    #
    # `/livez` and `/readyz` are deliberately NOT denied. They answer a bare
    # up/down with no internals, the external uptime prober reads them from
    # outside, and `micro-beacon` and the status page both depend on that.
    cf-deny-nimbus-metrics:
      rule: 'Host(`nimbus{{ env "CF_WEB_SUFFIX" }}`) && Path(`/metrics`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-deny-public]
      service: cf-svc-identity

    # ────────────────────────────────── pay and vault — the two money hosts ──
    #
    # `micro-hub-web` names the gap and could not close it from its own repository:
    #
    #   "TWO THINGS IN micro-deploy HAVE TO BE TRUE BEFORE THIS WORKS IN A BROWSER, AND ARE NOT.
    #    There is no gateway router for `pay.<apex>` or `vault.<apex>` in the working tree, and the
    #    routers that do exist for wallet are on the API host, which deliberately carries the
    #    security headers WITHOUT the app CORS allowlist."   (hub-web/src/lib/money.ts)
    #
    # Both halves check out against source. `hosts().pay` → wallet and `hosts().keyvault` →
    # custody (hub-web/src/lib/money.ts), and the registry gives `pay` the subdomain `pay`
    # and `keyvault` the subdomain **`vault`** (ui/packages/ui/src/surfaces.ts) — the one host in
    # this estate whose name does not match its registry key.
    #
    # WHY THESE TWO CANNOT GO ON THE API HOST. Withdrawal and key-export are authorised against
    # the USER'S OWN token — custody's export ceremony reads `amr` and `auth_time` off it
    # (custody/src/exports.ts, gates 4 and 6) — so the caller is a first-party browser, and a
    # first-party browser needs the app CORS allowlist. `api.<apex>` is called by third-party
    # servers and the SDK and deliberately does not carry it.
    #
    # ON THE MIDDLEWARE, PRECISELY. `cf-cors@file` is NOT listed here, and that is not an
    # oversight: it is applied to every router on this entryPoint by
    # `--entrypoints.websecure.http.middlewares` in compose/docker-compose.gateway.yml. Listing
    # it again would run the same headers middleware twice on one request. The consequence is
    # asserted rather than assumed — `scripts/estate-verify.sh` sends a real cross-origin preflight
    # from Hub's origin to both hosts and requires the allowlist echo, which is the only way to
    # know. (It also means public-api.yml's claim that the API host gets the headers
    # "without the app CORS allowlist" is not true today; the entrypoint gives it one. Recorded
    # here rather than silently corrected there, because narrowing that chain is a policy change
    # and policy.yml is the file that owns it.)
    # ── `pay.<apex>` HAS TWO BACKENDS, AND ROUTING IT TO EITHER ONE IS WRONG ────
    #
    # It was pointed wholly at wallet, and `emberkin.<apex>`'s wardrobe 404'd on `/entitlements`.
    # The obvious repair — repoint it at billing — was checked against both consumers first and is
    # ALSO wrong. Two bundles resolve this one hostname, and each is right about its own half:
    #
    #   * `hub-web/src/lib/money.ts` — `const wallet = (path) => request(hosts().pay, path)`,
    #     and every call through it is `/v1/withdrawals` or `/v1/deposits`. Sending those to
    #     billing would break withdrawal and deposit in the Hub, which is the money path.
    #   * `emberkin-web/src/lib/hosts.ts` — `billingBase() { return hosts().pay }`, for
    #     `GET /entitlements` (`emberkin-web/src/lib/billing.ts`). Wallet has no such route —
    #     it has no `/entitlements` at all — so this has been a 404 since the host was routed.
    #
    # The registry calls the surface the "Forge Pay API" and gives it no repository: it is a
    # FAMILY, not a service. `money.ts` says so, and says what to do about it: "`pay` is the
    # estate's row for the payments API family … and the gateway routes wallet's resources by path
    # prefix (public-api.yml), so one host serving both by prefix is consistent with how
    # the public surface is already laid out."
    #
    # So the host is split by RESOURCE, exactly as `api.<apex>` is, and for the same stated reason:
    # which service owns a resource is an implementation detail, and publishing it turns an
    # internal refactor into a breaking change for a browser.
    #
    # BILLING'S ROUTER IS THE NARROW ONE and wallet keeps the host. That is deliberate: wallet's
    # surface here is the whole `/v1` money API and is the one that grows, while billing's use of
    # this hostname is the four resources it actually serves — enumerated from
    # `billing/src/server.ts` (`/products` :375, `/purchases` :409, `/entitlements` :473,
    # `/subscriptions` :580) rather than guessed. `/internal/entitlements/:userId` is
    # deliberately NOT among them and could not be reached if it were: policy.yml refuses
    # `/internal` at priority 100000, above every router in this file, and its header explains
    # that Pay's internal routes take a `userId` as a parameter and are therefore an
    # act-as-anyone primitive from off the box.
    cf-web-pay:
      rule: 'Host(`pay{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      service: cf-svc-wallet
    cf-api-pay-billing:
      rule: 'Host(`pay{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/entitlements`) || PathPrefix(`/products`) || PathPrefix(`/purchases`) || PathPrefix(`/subscriptions`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-billing

    cf-web-vault:
      rule: 'Host(`vault{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      service: cf-svc-custody

    # ─────────────────────────────────────────── studio — the image bytes, and nothing else ──
    #
    # NO IMAGE COULD RENDER ANYWHERE IN THE ESTATE BEFORE THIS ROUTER. micro-studio was up and
    # healthy on both networks and had no gateway route at all, so Market's and Foresight's image
    # support — which is written and merged — was blocked on one missing pair here.
    #
    # THE WHOLE HOST, not `PathPrefix(/v1)`: nothing serves a bundle at `studio.<apex>`, so there
    # is no second router for a path to lose a priority tie against. Same shape and same reason as
    # `cf-web-nimbus` and `cf-web-vault` above.
    #
    # ── `cf-web-headers` ON AN API HOST, WHICH IS THE EXCEPTION AND NOT AN OVERSIGHT ───────────
    #
    # That middleware's own comment says "applied to every SURFACE route below — never to the API
    # routes". Studio is the one host in this file that is neither: a browser never NAVIGATES to
    # it, and a browser does RENDER what it returns, because Market and Foresight put these bytes
    # in `<img src>` cross-origin. It is an origin for UNTRUSTED USER UPLOADS.
    #
    # `X-Content-Type-Options: nosniff` is the header that matters and it does NOT depend on this
    # line — `cf-security-headers` is in the entrypoint chain for both `websecure` and `tunnel`
    # (docker-compose.gateway.yml and :266), so it is on every response this gateway makes.
    # This middleware adds `X-Frame-Options: SAMEORIGIN`, which costs nothing here: it constrains
    # `<iframe>`/`<embed>`/`<object>` and has no effect on `<img>`, so no consumer loses anything
    # and a stored upload cannot be framed onto a foreign page. Studio's own defences — magic-byte
    # validation, SVG rejected outright, EXIF stripped — are upstream of all of it; this is the
    # last line, not the only one.
    #
    # ── DNS DOES NOT EXIST FOR THIS HOSTNAME YET, AND THAT IS WRITTEN HERE ON PURPOSE ──────────
    #
    # Verified at the moment of this commit: `studio.cloudsforge.online` and
    # `studio-testnet.cloudsforge.online` have NO DNS RECORD. This file has just finished paying
    # for the other shape of that gap — `cf-api-worlds-api` routed a hostname that resolved
    # nowhere, and its presence here is what made every re-check conclude the host was fine. The
    # difference is the direction: that router outlived its hostname, this one precedes its
    # hostname, the backend is live and healthy on both networks, and the record is requested.
    # If you are reading this and the names still do not resolve, THAT is the defect — the router
    # is correct and is not the thing to delete.
    cf-web-studio:
      rule: 'Host(`studio{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-svc-studio

    # ──────────────────────────────── lantern — where the browsers report to ──
    #
    # THE ADDRESS SIXTEEN BUNDLES HAVE BEEN POSTING TO WITH NOTHING BEHIND IT.
    #
    # `src/lib/obs.ts` sends browser errors and page timings to
    # `${hosts().lantern}/ingest/client`, and `hosts().lantern` on any surface
    # served by this gateway is `https://lantern.<apex>` — the registry gives the
    # service the subdomain `lantern`. There was no router for that host and no
    # container behind it, so every post failed at DNS/connect and the page was
    # told `TypeError: Failed to fetch`, which is what it is also told for a
    # cross-origin 404. Two distinct faults, one indistinguishable symptom; that
    # is why this survived unnoticed for months.
    #
    # ── AND NOW ALSO WHERE AN OPERATOR READS WHAT THEY REPORTED ────────────────
    #
    # These lines used to route the WHOLE host to the service, "like nimbus
    # above", on the argument that "enumerating prefixes here would be a second
    # copy of that route list with its own drift". **That argument was right
    # while nothing else lived on this hostname and is wrong now.**
    # `micro-lantern-web` is the console the registry has been promising: `lantern`
    # is `inSwitcher: true`, and an operator who chose it got 404 JSON, because
    # this router matched `/` and handed it to a service that renders no HTML.
    #
    # So the API router keeps the upstream and takes the name for it —
    # `cf-api-lantern` at 600 — and `cf-web-lantern` becomes the bundle at 500.
    # The rename is not cosmetic: `scripts/surface-routes.py` reads a `cf-svc-*`
    # upstream as "this host has an API router", and a `cf-web-*` name on an API
    # would leave this file's own vocabulary disagreeing with the check that
    # reads it.
    #
    # THE PREFIXES ARE READ OFF `lantern/src/server.ts`, ROUTE BY ROUTE. Every
    # `define(...)` in that file:
    #
    #     /livez  /readyz  /metrics  POST /otlp/v1/logs
    #     POST /ingest/client  OPTIONS /ingest/client
    #     /v1/requests/:requestId  /v1/issues  /v1/events  /v1/rum
    #
    # — which is `/v1`, `/otlp`, `/ingest/`, `/metrics`, `/livez`, `/readyz`
    # and nothing else.
    #
    # THE TRAILING SLASH ON `/ingest/` IS LOAD-BEARING, AND IS THE WHOLE POINT.
    #
    # This read `PathPrefix(`/ingest`)` until 2026-08-27. That is the same rule as
    # this one while lantern is the only service on this upstream, and stops being
    # the same rule the moment it is not. `micro-analytics` serves `POST /ingest`
    # — the event-bus collector, which takes deliveries from the estate's own
    # producers and is meant to be reachable from inside the cluster and nowhere
    # else — and `docs/service-merge-plan.md` puts it behind this router. The old
    # rule would have published it to the internet on cutover day, silently,
    # because `/ingest` is a prefix of `/ingest` and nothing would have failed.
    #
    # The MAC on that route means that would have been exposure rather than
    # bypass. It is narrowed anyway: the difference between "an attacker must
    # forge a MAC" and "an attacker cannot reach the socket" is the whole reason
    # the collector was never given a hostname. Narrowed ahead of the merge, so
    # the change that makes it dangerous is not also the change that has to
    # remember this.
    #
    # NOT narrowed to `/ingest/client`, which was the first attempt and was worse.
    # `routes.ts` deliberately answers an unknown `/ingest/*` path with a JSON
    # error naming the paths it does serve, and counts it in
    # `lantern_unknown_ingest_path_total`, precisely so that a client posting to
    # the wrong path is visible instead of silent. Pinning the rule to the one
    # good path would have sent every wrong one to the bundle router below
    # instead, where nginx answers 404 with the app shell — so the diagnostic
    # would have gone quiet exactly when it had something to say, and the counter
    # would have read zero and looked like health.
    #
    # `/ingest/` keeps every `/ingest/*` path reaching that handler and excludes
    # the one path that is not under it: the bare `/ingest` analytics serves.
    #
    # `/otlp` and `/ingest/` are the two a `/v1`-only rule would have
    # dropped, and dropping them is the expensive mistake here: `/otlp/v1/logs`
    # begins with `/otlp` and NOT with `/v1`, so a prefix list copied from the
    # surface above would have sent every service's log export and every
    # browser's error report to a static file server. The bundle's nginx would
    # have answered 404 with the app shell, `obs.ts` would have reported
    # `Failed to fetch`, and the estate would have gone quietly blind — which is
    # the failure this hostname already suffered once, for months, and which the
    # block above this one was written to record.
    #
    # Checked in the other direction too. lantern-web's client routes are `/`,
    # `/events`, `/browser` and `/request` (lantern-web/src/lib/routes.ts). None
    # is a prefix of the six above and none is prefixed BY them — `/events` and
    # `/v1/events` are different addresses, which is the whole reason the API is
    # versioned — so there is no collision for a priority to resolve wrongly.
    #
    # The sink is still NOT protected by the router — it answers without a
    # credential by design, because a browser holds none. It is defended by
    # lantern's own origin allowlist (`LANTERN_RUM_ORIGINS`, set in
    # docker-compose.estate.yml) and a per-client quota. Its `/v1` read routes and
    # `/metrics` DO require a token, checked inside the service, which is what
    # makes it safe to serve an unauthenticated bundle in front of them.
    # `/internal` stays refused by policy.yml's priority-100000 rule, which
    # nothing in this file can outrank.
    cf-web-lantern:
      rule: 'Host(`lantern{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-lantern
    cf-api-lantern:
      rule: 'Host(`lantern{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/v1`) || PathPrefix(`/otlp`) || PathPrefix(`/ingest/`) || PathPrefix(`/metrics`) || PathPrefix(`/livez`) || PathPrefix(`/readyz`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-lantern

    # ── pool — the mining pool, and the ONE HOSTNAME WHOSE MOST IMPORTANT PORT
    #    THIS FILE CANNOT CARRY ─────────────────────────────────────────────────
    #
    # Same split as lantern and beacon: `micro-pool-web` resolves its API base to
    # the EMPTY STRING and issues relative `/v1/...`, so bundle and service must
    # share `pool.<apex>` or the console cannot read the pool at all. The bundle
    # takes the host at 500 and the API takes the paths at 600.
    #
    # THE PREFIXES ARE READ OFF `pool/src/server.ts`, ROUTE BY ROUTE: `/livez`,
    # `/readyz`, `/metrics`, `/v1/pool`, `/v1/pool/blocks`, `/v1/pool/workers`,
    # `/v1/pool/shares`. And checked the other way: the bundle's own routes are
    # `/`, `/workers`, `/workers/*` and `/blocks` (`pool-web/src/lib/routes.ts`).
    # `/blocks` and `/workers` look like collisions with the API's own words and
    # are not — every API path is under `/v1`, so the two vocabularies never meet.
    # That is a coincidence of naming worth writing down, because the obvious
    # "simplification" here is a `PathPrefix(`/blocks`)` that would take the
    # console's own page away from it.
    #
    # ── `/metrics` IS DELIBERATELY NOT ROUTED ─────────────────────────────────
    #
    # lantern and beacon publish theirs because each checks a token INSIDE the
    # service. This pool has no auth at all, on purpose: the only identity a miner
    # has here is the stratum username they chose, and 36 §6 makes "a miner can
    # check their own share history" a product requirement, so gating the read API
    # behind an estate login would exclude every miner who has no account — which
    # is all of them. That argument covers `/v1`; it does not cover `/metrics`,
    # which is process internals and per-worker cardinality rather than anything a
    # miner asked for. Prometheus reaches it on the container port, inside the
    # estate network, where it already reaches every other service's.
    #
    # ── AND THE PART THAT IS NOT HERE ────────────────────────────────────────
    #
    # Stratum is raw TCP, so the thing miners actually connect to does not appear
    # in this file and cannot: Traefik has no HTTP router that could carry a
    # newline-delimited JSON-RPC stream, and the Cloudflare Tunnel in front of this
    # gateway cannot forward it either. The pool container publishes that port
    # itself, bound to loopback by default.
    #
    # The consequence used to be that `pool.<apex>` described a connection nobody
    # outside this host could make. Since micro-org#285 it is smaller and more
    # honest than that: the page no longer describes the connection at all unless
    # somebody has published one. `GET /v1/pool` — served from this very hostname
    # by `cf-api-pool` below — returns the stratum endpoint only when the operator
    # has named it in `POOL_STRATUM_PUBLIC_HOST` and `POOL_<CHAIN>_STRATUM_PUBLIC_
    # PORT`, and returns null otherwise. It specifically does not derive one from
    # the request `Host`, which would produce this hostname: a name that resolves
    # to Cloudflare, on a port Cloudflare does not carry, handed to a stranger's
    # firmware as if it were a working address. So today the page says no endpoint
    # is published, which is true, instead of publishing one that is not.
    # ── WAVE 3d — `pool.<apex>` BECOMES `<apex>/pool` ─────────────────────────
    #
    # The same four routers as `agora`, including the three prefixes in both API
    # rules: micro-pool answers `/livez` and `/readyz` at its root as well as
    # `/v1`, and a health probe that fell through to the BUNDLE would be handed
    # an HTML page with a 200 and would report the service up.
    #
    # `Path(`/pool`) || PathPrefix(`/pool/`)` and not a bare
    # `PathPrefix(`/pool`)`: Traefik 3's PathPrefix is a RAW STRING PREFIX, so
    # the bare form would also claim `/poolside`.
    #
    # ── AND `/pool/deployment.json` DELIBERATELY FALLS TO THE BUNDLE ──────────
    #
    # It is the document that answers "is there a pool behind this deployment at
    # all", served by `micro-pool-web`'s own nginx, and its whole design turns on
    # NOT being under `/v1` — that prefix reaches the service whose absence it
    # exists to report, so it would be answered by the very 502 it explains. The
    # API rule below names its three prefixes EXACTLY rather than widening to
    # `/pool/`, which is what keeps that true.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-pool:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/pool`) || PathPrefix(`/pool/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-pool
{{ end }}

    # Outside the `CF_WEB_RETIRED` gate — that gate is TESTNET, and an API inside
    # it answers testnet's own reads with a 301 to mainnet, which `fetch` follows
    # silently and cross-origin. micro-deploy#174; enforced now by
    # `check-api-remount.py`'s gate-depth tracking.
    cf-api-pool-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (PathPrefix(`/pool/v1`) || Path(`/pool/livez`) || Path(`/pool/readyz`))'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-pool-strip-mount]
      service: cf-svc-pool

    cf-web-pool-sub:
      rule: 'Host(`pool{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-pool-to-apex]
      service: cf-web-pool
    # ── THIS ROUTER NOW CARRIES A WEBSOCKET AS WELL AS REST, AND NO LINE OF IT
    #    CHANGED — micro-org#289 ────────────────────────────────────────────────
    #
    # micro-pool gained a Stratum-over-WebSocket transport at
    # `/v1/pool/stratum/<chain>`, attached to its EXISTING HTTP server on the same
    # container port `cf-svc-pool` already names. `PathPrefix(`/v1`)` below
    # therefore already matched it, and adding a router for that path would be a
    # second rule competing on priority with this one for no gain. So the change
    # here is a comment, and the comment is the point: the next reader has to know
    # that a long-lived upgraded connection now depends on this block, because
    # nothing in the four lines below says so.
    #
    # ── THE UPGRADE WAS VERIFIED TO SURVIVE THE CHAIN, NOT ASSUMED TO ─────────
    #
    # Checked against `cf-api-p2p` in this file, which is this estate's existing
    # WebSocket precedent and the only other router that carries one. What that
    # block was deliberately kept clear of, this one is clear of too, and the
    # comparison was made rather than presumed on 2026-08-09:
    #
    #   * NO PER-ROUTER MIDDLEWARE AT ALL. `cf-api-p2p` carries exactly one
    #     (`cf-p2p-dial-throttle`); this router carries none. Both therefore run
    #     only the entryPoint chain — `cf-request-id`, `cf-security-headers`,
    #     `cf-cors`, from `compose/docker-compose.gateway.yml` — which is header
    #     work on the handshake and nothing that touches the socket after the 101.
    #   * NO `cf-web-headers`. That middleware sets a bundle's frame policy and
    #     belongs on `cf-web-pool` above, where it is; every `cf-api-*` router
    #     omits it, and it must stay omitted here.
    #   * NOTHING BUFFERS OR COMPRESSES. There is no `buffering` or `compress`
    #     middleware defined anywhere in `gateway/dynamic/`, and no
    #     `serversTransport` or `flushInterval` on `cf-svc-pool`, so the upgrade
    #     and the frames after it pass through untouched — including the
    #     `Upgrade`, `Connection`, `Sec-WebSocket-Key` and `Sec-WebSocket-Version`
    #     headers, none of which anything in this directory rewrites. Nothing here
    #     injects a `Sec-WebSocket-Protocol` either, which matters: the server
    #     sends none back, and a client handed one it never asked for closes the
    #     socket.
    #
    # ── NO PER-ROUTER IDLE TIMEOUT MAY BE ADDED TO THIS ROUTER ────────────────
    #
    # For the same reasons the `cf-api-p2p` block below sets out at length — Go
    # clears every read deadline on a hijacked connection, the only knobs are the
    # entrypoint's and this gateway sets none, and Cloudflare's edge close is
    # answered by application keepalive rather than by gateway configuration.
    # Read that block before touching this one. micro-pool pings every 20s and
    # closes after 70s of silence, which is inside the same edge window Hearth's
    # numbers were chosen for; a timeout added here would cut a healthy miner off
    # mid-share and would show up weeks later as "the browser miner is flaky".
    #
    # THE HANDSHAKE IS UNAUTHENTICATED AND THAT IS NOT THIS FILE'S PROBLEM TO
    # SOLVE. The gate is a single-use ticket redeemed in `mining.authorize` over
    # the socket, minted by `POST /v1/pool/ticket` against a bearer token. No
    # token appears in the URL, in a header or in a subprotocol, so there is
    # nothing here for a router rule to check and nothing for an access log to
    # leak — which is the reason the design puts the credential in a message
    # rather than in the request line.
    cf-api-pool:
      rule: 'Host(`pool{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/v1`) || PathPrefix(`/livez`) || PathPrefix(`/readyz`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-pool

    # ── exchange — ONE ROUTER, AND NO SECOND ONE ──────────────────────────────
    #
    # REMOVED: cf-api-exchange — it never existed and it must never be added; the
    #          reader's browser talks to Hearth, not to a CloudsForge service.
    #
    # That bury line is the mechanism check 3 of `scripts/surface-routes.py` gives
    # for naming a router in prose without defining it, and this block needs it
    # because the whole point of the block is the router that is NOT here. Without
    # the line the check is right to fail: a name written in a comment reads like a
    # name that exists, and the next session to grep for `cf-api-exchange` would
    # find this paragraph and conclude a definition had been lost.
    #
    # THE MISSING SECOND ROUTER IS THE INTERESTING PART OF THIS BLOCK. Every
    # surface above this one has a pair: a bundle on `/` and its service on `/v1`.
    # This hostname has no service to pair with, because THERE IS NO
    # `micro-exchange` AND THERE IS NOT GOING TO BE ONE. Forge Exchange is a set
    # of contracts on Hearth (factory, router, WEMBER — `docs/ecosystem/39`
    # phase F), and an AMM's entire state is four numbers in a pair contract.
    # Anything standing in front of them is a cache that is wrong between blocks.
    #
    # SO THE BUNDLE READS `rpc.<apex>` DIRECTLY, CROSS-ORIGIN, AND THAT IS THE ONE
    # DEPLOY FACT THIS SURFACE DEPENDS ON. It is the first page in the estate for
    # which that is true — every other frontend resolves `apiBase()` to its own
    # origin. `exchange.<apex>` → `rpc.<apex>` is a different origin, so the
    # browser sends a preflight and needs this surface's origin in `cf-cors`'s
    # `accessControlAllowOriginList` in policy.yml. That entry is WRITTEN BY HAND
    # and CHECKED against the registry's `servesUi` flag by `surface-routes.py`
    # check 5 — nothing renders it, and an earlier draft of this comment said it
    # did, which would have left the origin missing with a note explaining why it
    # could not be. The check is the reason that mistake cannot survive a commit:
    # the `servesUi: true` this router justifies makes the missing origin a CI
    # failure in micro-deploy, in both directions.
    #
    # MEASURED ON 2026-08-16, BEFORE THIS ROUTER EXISTED:
    # `OPTIONS https://rpc.cloudsforge.online/` with `Origin: https://exchange.
    # cloudsforge.online` answered 200, `access-control-allow-credentials: true`,
    # and NO `access-control-allow-origin` — which a browser reads as a refusal.
    # The identical request with a `pool.` or `foresight.` origin got one. The
    # registry flip is what closes that, and the note in `cf-api-rpc` below records
    # the consequence: this is the first page whose origin that list has to carry
    # for a reason other than completeness.
    #
    # PROXYING THE CHAIN THROUGH THIS HOSTNAME WOULD HAVE BEEN EASIER AND WRONG.
    # A `/rpc` prefix here would have avoided the preflight entirely. It would also
    # have put a CloudsForge server between a reader and the contract they were
    # invited to check — indistinguishable, from the browser, from a server that
    # answers `getReserves()` with whatever it likes. `/contracts` re-runs the
    # CREATE2 derivation in the reader's own browser precisely so that nothing on
    # this hostname has to be trusted; a proxy would make that theatre. There is
    # no `proxy_pass` in the bundle's nginx.conf either, and its CI fails on one.
    #
    # `exchange-testnet.<apex>` HAS NO ROUTER, deliberately, and it is now absent
    # from the `cf-retired-web-sub` exclusion above for that reason — it redirects
    # to mainnet like every other retired testnet frontend (micro-org#459). One
    # deployment reads either chain: `viewsAnyNetwork: true`, and the bundle
    # composes `rpc-testnet.<apex>` from `viewedNetwork()` when the reader presses
    # Testnet. Today that renders "Forge Exchange is not deployed on this network",
    # because `DEPLOYMENTS` in the bundle has one row and it is chain 7411 — which
    # is a true sentence, and better than a hostname that answers with a swap form
    # aimed at contracts that are not there.
    # ── AND IT IS A PATH ON THE APEX NOW — WAVE 2 OF THE CONSOLIDATION ───────
    #
    # `exchange.<apex>` served the desk until 2026-08-19 and now 301s to
    # `<apex>/exchange`. Wave 2, and wave 2 alone: this is the only surface
    # besides the journal with no API of its own on its hostname, so it is the
    # last one that can move without moving a service's routes with it.
    #
    # THE RULE IS NOT `PathPrefix(`/exchange`)`, and that is measured. Traefik
    # 3.2.3's PathPrefix is a RAW STRING PREFIX — the bare form also claims
    # `/exchangeable` and `/exchange-old`. `Path` is exact and
    # `PathPrefix(`/exchange/`)` cannot match a longer first segment, so the
    # alternation is the whole address space of this surface and nothing else.
    # `check-base-paths-agree.py` rejects the bare form.
    #
    # Gated on CF_WEB_RETIRED for the same reason `cf-web-journal` is: the apex
    # mount is meaningless on testnet, where the apex is itself a 302 to
    # mainnet. `ne` and not `not` — `env` returns a STRING and `"false"` is
    # truthy to a Go template, so `not (env …)` deletes the router from mainnet
    # too.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-exchange:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/exchange`) || PathPrefix(`/exchange/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-exchange
{{ end }}

    # ── THE HOSTNAME IT LEFT, WHICH KEEPS ANSWERING FOREVER ──────────────────
    #
    # A tombstone, at 500 so the retirement redirects at 550 still outrank it on
    # testnet — where a `-testnet` name must go to mainnet before it goes to a
    # path. On mainnet nothing outranks it and it answers the 301.
    #
    # `service:` is still `cf-web-exchange` even though the middleware answers
    # before the service is ever reached: Traefik requires a router to name one,
    # and naming the surface's own backend keeps the row readable as "this is
    # where the exchange used to be" rather than pointing at an unrelated
    # container that happens to exist.
    #
    # It never gets deleted. A 301 that has been served for two years is still
    # the only thing between an old link and a 404.
    cf-web-exchange-sub:
      rule: 'Host(`exchange{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-exchange-to-apex]
      service: cf-web-exchange

    # ── journal — THE ONE ROUTER WHOSE JOB INCLUDES NOT REWRITING ─────────────
    #
    # Ordinary in every visible way and load-bearing in one invisible one. The
    # bundle bakes NO hostname: every canonical, `og:url`, RSS channel link and
    # JSON-LD `@id` is written to disk as the literal `__CF_ORIGIN__` and
    # substituted per request by nginx `sub_filter` with `https://$host`
    # (`docs/ecosystem/40` §4.1). So the origin the archive claims as its own is
    # whatever Host reaches the container. `cf-web-headers` does not touch Host
    # and Traefik forwards it unchanged, which is what makes that work — and a
    # future middleware here that rewrote it would put the WRONG canonical on
    # every page of the archive with nothing user-visible to show for it. Only a
    # crawler would ever see the damage, months later, as an archive that says
    # its articles live somewhere else.
    #
    # The SCHEME half is a literal `https` rather than nginx's `$scheme`, and
    # this router is why. TLS ends at Cloudflare; cloudflared speaks plain HTTP
    # to the gateway and this entryPoint speaks plain HTTP to the container, so
    # `$scheme` is `http` for every reader who arrived over https. Nor would
    # `X-Forwarded-Proto` rescue it: this gateway sets no `forwardedHeaders`
    # trusted list, so Traefik overwrites that header with its own entrypoint's
    # scheme. A canonical naming `http://…` names a URL that 301s, and a crawler
    # treats a 301 target as a different address and drops the one it was told.
    #
    # `journal-testnet.<apex>` HAS NO ROUTER, and unlike exchange's that is not
    # even a decision about this surface: `cf-retired-web-sub` above catches
    # every `*-testnet` web hostname at priority 550 and 302s it to mainnet.
    # There is nothing for a second archive to serve anyway — an article is
    # byte-identical on both networks, so a testnet copy would be the same page
    # at a second address, which is the duplicate-content case a search engine
    # resolves by suppressing one of them and not telling anyone which. The
    # bundle's own nginx.conf still serves `Disallow: /` and 404s the feed and
    # the sitemap on any non-mainnet Host, and its CI proves it. That is the
    # container's invariant rather than dead code: it is what makes a
    # `localtest.me` build, a laptop and any future second hostname right by
    # construction rather than by remembering.
    #
    # ══════════════════════════════════════════════════════════════════════════
    # WAVE 1 OF THE APEX CONSOLIDATION: THIS SURFACE IS A PATH NOW
    # ══════════════════════════════════════════════════════════════════════════
    #
    # `docs/apex-consolidation.md`. The registry says it in one line —
    # `subdomain: ''`, `basePath: '/journal'` in `ui/.../surfaces.ts` — and this
    # is the routing half. The bundle is built with `BASE = '/journal'`, its
    # nginx serves `location = /journal` and `location /journal/`, and every
    # absolute URL it writes to disk is already `__CF_ORIGIN__/journal/…`, so
    # the `sub_filter` above composes `https://cloudsforge.online/journal/…`
    # with no second substitution and no rewrite here. Verified in the built
    # artefact before this router was written:
    #
    #     $ grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | head -1
    #     <loc>__CF_ORIGIN__/journal</loc>
    #
    # ── THE RULE IS NOT `PathPrefix(`/journal`)`, AND THAT IS MEASURED ────────
    #
    # Traefik's `PathPrefix` is a RAW STRING PREFIX with no segment boundary. It
    # is easy to assume otherwise and the assumption is wrong in the direction
    # that silently steals traffic from the apex bundle. Measured on 2026-08-19
    # against traefik:v3.2.3 — the exact image this gateway runs — with one
    # router `PathPrefix(`/journal`)` pointing at a dead backend, so 502 means
    # the router MATCHED and 404 means nothing did:
    #
    #     /journal      502     /journalism    502   ← the hazard
    #     /journal/     502     /journalism/x  502   ← the hazard
    #     /journal/a/x  502     /jour          404
    #
    # And the same probe against the alternation actually used below:
    #
    #     /journal          502     /journalism      404
    #     /journal/         502     /journalism/x    404
    #     /journal/a/x      502     /journal-testnet 404
    #     /journal/feed.xml 502
    #
    # `Path` is exact and `PathPrefix(`/journal/`)` cannot match a longer first
    # segment because the boundary is IN the literal. So a future `/journalism`
    # article on the marketing site keeps reaching `cf-web-site`, which is the
    # only outcome nobody would have noticed going wrong.
    #
    # ── PRIORITY 600, AND WHY IT IS THE API BAND RATHER THAN A NEW ONE ────────
    #
    # `cf-web-site` matches this same Host at 500 and would otherwise win every
    # path on it. The bands in this file are bundles 500, retirement 550, APIs
    # 600, and an apex-mounted bundle belongs in the 600 band for the same
    # reason an API does: it is a NARROWER rule on a host whose broad rule is
    # already claimed. A new band would say these are a different kind of thing,
    # and they are not — `cf-api-market-host` at 600 is `Host + PathPrefix` over
    # `cf-web-market` at 500, which is exactly this shape.
    #
    # ── RENDERED ONLY ON THE ESTATE THAT IS NOT RETIRED, AND THAT IS THE BUG ──
    # ── THIS GATE EXISTS TO PREVENT ──────────────────────────────────────────
    #
    # `CF_SITE_HOST` is `testnet.cloudsforge.online` on the testnet gateway, and
    # `cf-retired-web-apex` matches that host at 550. Ungated, this router at
    # 600 would OUTRANK the retirement on its own apex and serve the testnet
    # journal bundle at `testnet.cloudsforge.online/journal` — a hole in the
    # retirement, punched by a router that never mentions testnet, on the one
    # surface whose duplicate-content case is spelled out four paragraphs up.
    # The API routers outrank the retirement on purpose (`/v1` is how the
    # combined view reads the other estate); a BUNDLE outranking it is the
    # opposite of purpose. Raising the retirement above 600 is not the fix —
    # that would retire the APIs the combined view depends on.
    #
    # So the gate is the same variable, the same comparison and the same file as
    # the block that creates the redirect: an estate that is retired serves no
    # bundle of its own on its apex, by construction. `ne` rather than `not`
    # because `env` returns a STRING and every non-empty string is true to a Go
    # template — `not (env "CF_WEB_RETIRED")` would be FALSE on mainnet, where
    # the value is the four characters `false`, and this router would vanish
    # from the only estate that needs it. Check 6 of `surface-routes.py` already
    # refuses an empty value in both files, so both spellings are answered.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-journal:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/journal`) || PathPrefix(`/journal/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-journal
{{ end }}

    # ── the hostname the archive used to live at, kept as a 301 ───────────────
    #
    # `journal.<apex>` is still a real tunnel hostname (`cloudflared/
    # config.mainnet.public.yml`) and still resolves, so it must answer rather
    # than 404 — five published articles, an RSS feed subscribers already point
    # a reader at, and whatever links exist off this estate. It answers by
    # sending everyone to the path, PRESERVING THE PATH: `/feed.xml` becomes
    # `/journal/feed.xml` and a subscriber's reader follows it without being
    # told, which is the difference between a consolidation and an outage.
    #
    # 301 RATHER THAN THE RETIREMENT'S 302, and the difference is the entire
    # point of the wave. A 302 asks a crawler to keep the old address indexed; a
    # 301 transfers the accumulated signal to the new one, which is why the
    # surface is moving at all. The cost is that it is a one-way door — browsers
    # cache a 301 indefinitely and a reader who follows this once cannot be sent
    # back to the subdomain by changing this file. That is accepted here and is
    # NOT accepted in `cf-retired-*-to-mainnet` above, where the 302 is
    # deliberate because retiring a network's frontends is a decision that might
    # be revisited. Moving a publication to its permanent home is not.
    #
    # It sits at 500 rather than 600 and that is load-bearing on testnet, where
    # the hostname is `journal-testnet.<apex>` and `cf-retired-web-sub` at 550
    # gets it first. The chain there is two hops and lands in the right place:
    #
    #     journal-testnet.<apex>/x  →302→  journal.<apex>/x  →301→  <apex>/journal/x
    #
    # The middleware's regex also declines to match the `-testnet` spelling on
    # its own (`journal\.` cannot match `journal-testnet.`), so even if the
    # priorities were ever reordered it would fall through rather than compose a
    # testnet apex URL. Two independent reasons for one outcome, because the
    # failure is invisible: a redirect to a page that exists, just the wrong one.
    cf-web-journal-sub:
      rule: 'Host(`journal{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-journal-to-apex]
      service: cf-web-journal

    # ── agora — A BUNDLE AND ITS SERVICE ON ONE HOSTNAME, SPLIT BY PATH ───────
    #
    # The ordinary pair, and the arrangement `explorer.` and `pool.` above
    # already have: the bundle matches the Host at 500, the service matches Host
    # plus `/v1` at 600, and micro-agora-web therefore issues RELATIVE requests
    # and never learns its own hostname. That is not a stylistic preference on
    # this surface. `api.<apex>` carries `cf-api-headers` and deliberately NOT
    # the app CORS allowlist — it is called by servers and by the SDK, not by a
    # first-party page — so a bundle addressing the API host cross-origin would
    # be refused at the preflight on every request, and nothing in this file
    # could grant it without making the public API a browser origin.
    #
    # THE TESTNET HALF IS NOT A SECOND ROUTER AND MUST NOT BECOME ONE.
    # `agora-testnet.<apex>` is caught by `cf-retired-web-sub` at priority 550
    # and 302s to mainnet like every other retired web hostname — but `/v1` on
    # that name is NOT retired, because `cf-api-agora` below is priority 600 and
    # outranks the redirect. That asymmetry is what makes reading the other
    # square from this page work at all: the reader stays on the mainnet bundle
    # and the FETCHES go to the testnet service (`src/lib/viewed.ts`).
    #
    # WHAT A READER OF THE OTHER SQUARE SENDS, AND WHY IT NEEDS policy.yml.
    # Those cross-environment fetches carry a bearer and a cookie-less
    # credential, so `agora.<apex>` must appear in the `CF_VIEW_ORIGIN_SUFFIX`
    # half of `cf-cors` — the grant this surface's `viewsAnyNetwork: true`
    # registry row earns and that check 10 of `scripts/surface-routes.py`
    # verifies against `src/lib/viewed.ts` existing. Nothing here grants it.
    # ── WAVE 3c — `agora.<apex>` BECOMES `<apex>/agora` ───────────────────────
    #
    # The same four routers as `market`, `create` and `trade`, and ONE DIFFERENCE
    # that is the whole reason this surface got a wave of its own: agora's
    # service answers `/livez` and `/readyz` AT ITS ROOT as well as `/v1`.
    #
    # On its own hostname that was three prefixes on one name with nothing else
    # to collide with. Mounted, all three have to be named in BOTH API rules or
    # the health endpoints fall through to the bundle router — which answers them
    # with an HTML page and a 200. A monitor reading that as healthy is the
    # failure this note exists to prevent, and it is the failure that looks most
    # like success.
    #
    # `Path(`/agora`) || PathPrefix(`/agora/`)` and not a bare
    # `PathPrefix(`/agora`)`: Traefik 3's PathPrefix is a RAW STRING PREFIX, so
    # the bare form would also claim `/agoraphobia`.
{{ if ne (env "CF_WEB_RETIRED") "true" }}
    cf-web-agora:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (Path(`/agora`) || PathPrefix(`/agora/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-agora
{{ end }}

    # ── OUTSIDE THE GATE, AND #174 IS WHY ─────────────────────────────────────
    #
    # `CF_WEB_RETIRED` is TESTNET. An API router inside that gate answers
    # testnet's own reads with a 301 to mainnet — and `fetch` follows redirects
    # silently and cross-origin, so the combined view renders MAINNET DATA with
    # Testnet selected in the switcher and nothing anywhere reports an error.
    # That was live on `/market` until micro-deploy#174.
    #
    # Retirement is a statement about a BUNDLE — the human-facing pages testnet
    # no longer serves. It has never been a statement about data.
    # `check-api-remount.py` tracks gate depth and fails any API router that
    # opens inside one, so this cannot regress into a fifth surface.
    cf-api-agora-apex:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`) && (PathPrefix(`/agora/v1`) || Path(`/agora/livez`) || Path(`/agora/readyz`))'
      priority: 700
      entryPoints: [websecure, tunnel]
      middlewares: [cf-agora-strip-mount]
      service: cf-svc-agora

    cf-web-agora-sub:
      rule: 'Host(`agora{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-agora-to-apex]
      service: cf-web-agora
    # `/livez` and `/readyz` alongside `/v1` for `cf-api-pool`'s reason: they are
    # what an external prober asks, and a prober that can only reach the bundle's
    # nginx healthz proves the page is served and nothing about the square being
    # open. `/metrics` is deliberately NOT here — it is scraped in-network by
    # Prometheus over the compose network, and publishing it would put the
    # whisper counter and every route's latency on the open internet.
    cf-api-agora:
    # And its API on the old hostname, unchanged and ABOVE the tombstone so the
    # 301 never sees it. A redirect answers a GET well and mangles a POST: a
    # client that follows one may drop the body and downgrade the method, which
    # is how an integration starts silently losing writes. The BUNDLE moved;
    # callers did not have to — and that includes whatever is probing `/livez`.
      rule: 'Host(`agora{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/v1`) || PathPrefix(`/livez`) || PathPrefix(`/readyz`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-agora

    # ── rpc — THE CHAIN, AND THE LAST INGRESS RULE THAT SKIPPED THIS FILE ─────
    #
    # `rpc.<apex>` went STRAIGHT FROM THE TUNNEL TO THE NODE. Every other hostname
    # this estate publishes arrived at `https://127.0.0.1:{gateway}`; this one alone
    # was `service: http://127.0.0.1:18545` in
    # `cloudflared/config.testnet.public.yml` and the same at :128 of the mainnet
    # file. One rule, out of twenty, that skipped the layer the other nineteen use.
    #
    # WHAT THE BYPASS ACTUALLY COST, rather than merely being inconsistent:
    #
    #   * NO THROTTLE WAS POSSIBLE. See the `cf-rpc-throttle` block above: the node's
    #     own per-address limiter is keyed on the socket's remote address, which is
    #     cloudflared's for every request in the world, and nothing between the two
    #     could see the real client. The limiter is now the first thing this request
    #     meets.
    #   * NO `/internal` REFUSAL, NO REQUEST ID, NO SECURITY HEADERS, NO ACCESS LOG.
    #     Those are entrypoint middlewares and a priority-100000 router in policy.yml,
    #     and all of them are attached to THIS gateway. A request that never entered
    #     it got none of them, and no line in the estate's access log recorded that it
    #     had happened at all.
    #   * IT WAS THE ONE-OFF THAT GETS FORGOTTEN. The generator carried a `RPC_PORT`
    #     constant and an `rpc=True` flag for exactly one appended rule; that constant
    #     and that flag are deleted, and the hostname is now derived from the registry
    #     like the other twenty.
    #
    # THE WHOLE HOST, NOT A PATH, AND THIS ONE IS SETTLED BY THE UPSTREAM RATHER THAN
    # BY PREFERENCE. `hearth/node/src/jsonrpc/server.js` has NO PATH DISPATCH AT ALL:
    # `httpListener()` hands every request to one `_serve`, whatever the
    # URL. There is no second thing on that port to keep unreachable, so a path rule
    # here would buy nothing and would cost the caller hearth's own diagnosis — a GET
    # is answered `405` with `allow: POST,OPTIONS` and a JSON-RPC error body saying
    # "JSON-RPC requires POST", which is a better answer than a 404 from a
    # gateway that will not say why.
    #
    # NO `cf-web-headers`: that middleware sets a bundle's frame policy and this
    # upstream answers JSON, the same reason every `cf-api-*` router omits it.
    #
    # CORS NEEDS NOTHING ADDED, and the interaction is worth writing down because two
    # policies meet here. Hearth sends `access-control-allow-origin: *` on every
    # response (`jsonrpc/server.js`) — correct for a public chain endpoint —
    # while `cf-cors@file` runs on this entrypoint and OVERWRITES that header with the
    # caller's own origin when the caller is in the estate allowlist, leaving the `*`
    # untouched when it is not. So a first-party surface gets a credentialed
    # same-origin echo and a third-party dapp keeps the open header the chain intends.
    # Neither needed a new allowlist entry: nothing is SERVED at `rpc.<apex>`, so no
    # page ever has that origin.
    #
    # THAT WAS TRUE ABOUT `rpc.<apex>` AND IS STILL TRUE; WHAT CHANGED IS WHO CALLS
    # IT. Until `cf-web-exchange` above, every estate origin in the `cf-cors`
    # allowlist was there for completeness — no first-party page actually made a
    # cross-origin request to this endpoint, so the echo branch was never taken by
    # one. Forge Exchange's whole read path is `eth_call` from `exchange.<apex>` to
    # here, which makes it the first surface whose entry in that list is load-bearing
    # rather than tidy. Measured before it shipped: this endpoint answered an
    # `exchange.` origin with no `access-control-allow-origin` at all, which a
    # browser reads as a refusal, while `pool.` and `foresight.` origins got one.
    # The list is rendered from `servesUi`, so flipping that flag is the whole fix —
    # but it means a future `servesUi: false` on that row would silently break every
    # page on this surface, and the only symptom would be in a browser console.
    #
    # THE CONDITIONAL BELOW IS ON `CF_RPC_UPSTREAM`, for the reason the whole file is
    # wrapped in one: an unset variable must produce NO ROUTER rather than one pointed
    # at an empty URL. It is a per-environment fact — which node this estate's chain is —
    # and it is set in `compose/env/traefik.env` and `compose/env/traefik.testnet.env`.
    # `scripts/surface-routes.py` check 6 fails when a variable this directory reads is
    # absent from either file, so "unset" cannot happen quietly.
{{ if env "CF_RPC_UPSTREAM" }}
    cf-api-rpc:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-rpc-throttle]
      service: cf-svc-hearth-rpc
{{ end }}

    # ── mining — THE WORK API WAS ON A PORT NOTHING PUBLISHED ─────────────────
    #
    # `rpc.<apex>` reaches `CF_RPC_UPSTREAM`, which is the ETHEREUM JSON-RPC port
    # (`hearth/node/src/params.js`, 8545). The pool-style work API a remote
    # miner calls is on the REST port — `params.js`, 8645, "HTTP REST + legacy
    # JSON-RPC + SSE" — and NOTHING published it, at any hostname or path. Two
    # ports on one node, and the ingress had only ever been told about one.
    #
    # ── ONLY TWO PATHS, AND THE OTHER FOUR ARE REFUSED ON PURPOSE ─────────────
    #
    # `Path`, twice, not `PathPrefix(`/mining`)` and emphatically not the whole
    # host: the REST port serves six things (`evmnode.js`) and a miner
    # needs exactly two of them. Publishing a port because one path on it is
    # wanted is how the other four become public without anyone deciding they
    # should be. Each refusal below is a decision:
    #
    #   /events — Server-Sent Events. It holds the socket open and
    #                registers the response in `this.sseClients`, so every caller
    #                costs the node a live connection for as long as they care to
    #                keep it. Unauthenticated, that is connection exhaustion with
    #                no proof-of-work and no rate limit that helps — the limiter
    #                counts the DIAL, and one dial is all this costs. The same
    #                argument as the p2p WebSocket above, with none of the reasons
    #                that one is worth carrying.
    #   /mempool — enumerates every pending transaction. A public
    #                mempool is normal for a chain and this is not the surface
    #                that should serve it: the estate already publishes chain
    #                reads through `indexer` at `explorer.<apex>`, where they are
    #                shaped, indexed and cached rather than read straight off the
    #                node a miner is depending on.
    #   /info, — real chain facts, and duplicates. Same
    #   /supply      reason: `explorer.<apex>` is where this estate answers "what
    #                is the state of the chain", and a second address for the same
    #                answer is a second thing to keep true.
    #
    # Priority 600 to outrank `cf-api-rpc`'s 500 on the same hostname, exactly as
    # `cf-api-hub` outranks `cf-web-hub`. Anything else under `/mining` — a path
    # this node does not serve — falls through to the RPC router and is answered
    # by the JSON-RPC port's own 404, which is a truthful "no route here".
    #
    # ── WHY IT RIDES `rpc.` AND DID NOT GET ITS OWN HOSTNAME ──────────────────
    #
    # A `mining.<apex>` router would fail `scripts/surface-routes.py` check 2 on
    # its first run: every host a router matches must be a subdomain the REGISTRY
    # declares, and the registry is `ui/packages/ui/src/surfaces.ts` in a
    # different repository — the one `rpc` and `p2p` were added to when they were
    # declared. That row is the right long-term shape and this router should move
    # to it. It is not done here because that repository is not this one's to
    # write, and a router on an undeclared host would take the drift check red for
    # everyone rather than wait.
    #
    # Riding `rpc.` is not merely the available option, though: the REST port IS
    # the node's own RPC surface by its own parameter name (`DEFAULT_RPC_PORT`),
    # the tunnel already publishes this hostname so no ingress changes, and a
    # miner configuring one address for a chain is the smaller ask.
    #
    # ── THE CLIENT THIS EXISTS FOR, AND A STALE DOC THAT NEARLY GOT REPEATED ──
    #
    # `hearth-mine` — a LIGHT miner that "holds no chain, syncs nothing and opens
    # no ports", written for exactly this case: "for someone who wants to mine on
    # their Mac and their PC … CloudsForge is published from a home server behind
    # a Cloudflare Tunnel — a transport that a tunnel can carry. This needs none
    # of it. It is HTTPS out" (`hearth/node/bin/hearth-mine.js`). The client
    # was designed against a tunnel; this router is the tunnel-side half it has
    # been waiting for.
    #
    # AND THE KEY-TYPE DEFECT IS NOT LIVE, THOUGH THREE DOCUMENTS SAY IT IS.
    # `hearth/docs/mining.md` says "the browser miner currently cannot mine
    # a block this node will accept" — the node wanting Ed25519 while the miner
    # signs secp256k1 — and MAP.md, SECURITY.md and listing-checklist M16 repeat
    # it. That was written about the LEGACY UTXO chain (`node/src/block.js`,
    # `node/src/mining.js`), and MAP.md says so itself in a note nobody
    # carried forward: "Note which endpoint this is … on the **UTXO** REST".
    #
    # The EVM node this estate runs reconciled long ago: `node/src/chain/
    # miner.js` and `node/src/chain/header.js` both require a 65-byte
    # uncompressed secp256k1 key, which is what the miners sign. Measured through
    # this very router before this was written — `GET /mining/template` with no
    # `pub` answered 400 `{"err":"pub must be a 65-byte uncompressed secp256k1
    # key"}`, from `chain/miner.js`, on the EVM path.
    #
    # Recorded at this length because the first draft of this comment relayed the
    # stale doc as a live blocker. Four documents agreeing with each other is not
    # one of them agreeing with the running node.
{{ if env "CF_MINING_UPSTREAM" }}
    cf-api-mining:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`) && (Path(`/mining/template`) || Path(`/mining/submit`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-mining-throttle]
      service: cf-svc-hearth-mining

    # ── AND THE THIRD ENDPOINT THE MINER NEEDS: `GET /events` (micro-org#236) ──
    #
    # WHAT WAS BROKEN. The two paths above are everything the browser miner could
    # reach, and they are not everything it asks for. `network-site/src/mining/
    # miner.js` opens `new EventSource(`${rpc}/events`)` to learn the tip moved,
    # with a 45-second `setInterval` behind it as a fallback. The stream was
    # never published, so `rpc.<apex>/events` fell through to `cf-api-rpc` and was
    # answered by the JSON-RPC port — which serves POST and nothing else, so a
    # 405. Measured on mainnet before this was written, with a `Host:` header
    # against the origin rather than the public name:
    #
    #     $ curl -s -o /dev/null -w '%{http_code}\n' \
    #         -H 'Host: rpc.cloudsforge.online' http://127.0.0.1:9081/events
    #     405
    #     $ curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8645/events
    #     200      # the node itself, content-type: text/event-stream
    #
    # The node was serving it the whole time. The refusal was purely ingress.
    #
    # AND THE CONSEQUENCE WAS NOT "NO LIVE UPDATES", IT WAS WORSE. A non-200
    # KILLS an `EventSource` — `readyState` goes to CLOSED and the browser does
    # not retry — and the miner set no `onerror`, so the failure was silent. Every
    # browser miner ran on the 45-second timer alone: up to 45 seconds of hashing
    # against a template whose parent is no longer the tip, every block. hub-web
    # went further and VENDORED a copy of the miner with the `EventSource` deleted
    # outright, which is the shape a permanent 405 leaves behind.
    #
    # A SEPARATE ROUTER RATHER THAN A THIRD `Path()` ON THE ONE ABOVE, because the
    # two need DIFFERENT middlewares and a router carries one list. `/mining/*` is
    # rate-limited because its cost is per request; `/events` is in-flight-limited
    # because its cost is per held socket (see `cf-sse-inflight`). It still gets
    # `cf-mining-throttle` too — dial churn is a real cost on top of the socket,
    # and re-opening a stream in a loop should be bounded like any other request.
    #
    # Same priority, same hostname, same upstream: 8645 is the REST port that
    # serves `/mining/*` and `/events` alike, and the long note above about why
    # this is NOT `CF_RPC_UPSTREAM` applies unchanged.
    cf-api-mining-events:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`) && Path(`/events`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-mining-throttle, cf-sse-inflight]
      service: cf-svc-hearth-mining
{{ end }}

    # ── THE TWO READ SURFACES: an address index and a contract verifier ───────
    #
    # Phase B of `docs/ecosystem/39-forge-exchange.md` — "a stranger can read a
    # deployed contract's source and its calls without our help". Both services
    # are `hearth/tools/`, both are deployed by
    # `compose/docker-compose.hearth-devkit.yml`, and neither holds a key, mines,
    # signs or writes anything. They read the chain and answer questions.
    #
    # ── WHY THEY RIDE `rpc.` AND NOT `explorer.` ──────────────────────────────
    #
    # `explorer.<apex>` is the obvious home and it is not available, for a reason
    # that is specific rather than aesthetic: TESTNET WEB HOSTNAMES ARE RETIRED.
    # `CF_WEB_RETIRED` turns every `*-testnet` web surface into a redirect to the
    # combined view — measured, `explorer-testnet.cloudsforge.online/` answers
    # 302 to `https://explorer.cloudsforge.online/` and so does every path under
    # it. A router placed on the testnet explorer host would be shadowed by that
    # redirect and answer nothing, and the EMBER pool these two exist to make
    # readable is on 7412.
    #
    # `rpc.<apex>` is live in both environments, is a chain-data host rather than
    # a web surface so the retirement does not touch it, and is already declared
    # in the surface registry — so this passes `scripts/surface-routes.py` check 2
    # without a registry change in a repository that is not this one's to write.
    # `cf-api-mining` above made exactly this argument for exactly this reason,
    # and it holds here with one addition: an Etherscan-compatible client is
    # configured with ONE base URL per chain, and it already has this one.
    #
    # THE PATHS ARE NARROW AND EACH IS A DECISION. `cf-api-rpc`'s bare-host rule
    # at priority 500 catches everything else, so these take 600 and claim only:
    #
    #   /api        the Etherscan-compatible shim — `?module=account&action=txlist`
    #               and friends, plus `module=contract&action=getsourcecode`,
    #               which is the ONE request that spans both services: the index
    #               proxies it to the verifier through `HEARTH_VERIFY_URL`.
    #   /verify     POST, the submission. Behind `cf-verify-throttle`, not the RPC
    #               limiter — see the note on that middleware.
    #   /contracts  GET, what has been verified on this chain.
    #   /compilers  GET, which solc builds the verifier will accept.
    #
    # NOT published: the verifier's own `/api` (the index's is the richer one and
    # the two would collide), and the index's `/supply`, which is refused for the
    # same reason the mining block refuses the node's — this estate answers "what
    # is the state of the chain" at `explorer.<apex>`, and a second address for
    # the same answer is a second thing to keep true.
    #
    # Both conditionals are on their own upstream variable, for the reason the
    # whole file is wrapped in one: an unset variable must produce NO ROUTER
    # rather than one pointed at an empty URL. `surface-routes.py` check 6 fails
    # when a variable this directory reads is missing from either traefik env
    # file, so "unset by accident" cannot happen quietly — and an estate that
    # does not run the dev kit sets both to empty and gets no routers at all.
{{ if env "CF_EXPLORER_INDEX_UPSTREAM" }}
    # `Path`, not `PathPrefix`, and that is deliberate rather than tidy. The
    # service routes on `url.pathname === '/api'` and nothing else — the whole
    # Etherscan grammar lives in the QUERY STRING (`?module=…&action=…`), which a
    # Traefik path condition does not see and does not need to. A prefix would
    # publish every future `/api/*` the service ever grows, silently, and the
    # `rpc` row in `scripts/check-gateway-covers-api-paths.py` claims exactly the
    # opposite: that this host's routed set is a fixed vocabulary. An exact path
    # is what makes that claim true instead of aspirational.
    cf-api-chain-index:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`) && Path(`/api`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-rpc-throttle]
      service: cf-svc-hearth-explorer-index
{{ end }}
{{ if env "CF_VERIFY_UPSTREAM" }}
    cf-api-verify:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`) && Path(`/verify`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-verify-throttle]
      service: cf-svc-hearth-verify

    # A SECOND ROUTER FOR THE READS, because a router carries one middleware list
    # and these two costs are not the same. `/verify` compiles; these answer from
    # a directory listing. Same upstream, same priority, ordinary RPC limiter.
    #
    # THE ONE PREFIX ON THIS HOST, and the exception is argued rather than assumed.
    # The rule above cf-api-chain-index asks for exact paths so the routed set stays
    # a fixed vocabulary; `/contract/0x…` and `/contract/0x…/abi` cannot be named
    # exactly, since the address IS the path. The prefix keeps its trailing slash,
    # so it matches neither `/contracts` (the listing, exact, above) nor anything
    # else — the vocabulary is still closed, it just has one member that reads an
    # argument. Without it the verifier's own documented route answers the RPC's
    # "JSON-RPC requires POST", which reads as a broken verifier.
    cf-api-verify-reads:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`) && (Path(`/contracts`) || Path(`/compilers`) || PathPrefix(`/contract/`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-rpc-throttle]
      service: cf-svc-hearth-verify
{{ end }}

    # ── p2p — PEER GOSSIP, BECAUSE A TUNNEL CANNOT CARRY A TCP SOCKET ─────────
    #
    # Hearth's peer transport is raw TCP on 8646 (`hearth/node/src/params.js`).
    # A Cloudflare Tunnel carries HTTP; there is no ingress rule that publishes a
    # TCP listener through one. So Hearth gains a WEBSOCKET transport — container
    # port 8648, env `HEARTH_P2P_WS`, path `/p2p` — and this is the estate's half of
    # that contract: the hostname, the router and the upstream.
    #
    # WRITTEN BEFORE THE UPSTREAM EXISTS, DELIBERATELY, AND THE COST IS STATED. The
    # section above this file's emberkin block argues that a router pointing at a
    # container that is not there answers 502 and "reads as 'the service fell over'
    # — a wrong diagnosis, permanently". That argument is accepted and overridden
    # here for one reason: this half and Hearth's half are being built in parallel,
    # and the alternative is an ingress that has to be regenerated and a gateway that
    # has to be reloaded on the day the other half lands. Until `HEARTH_P2P_WS` is
    # serving, `p2p.<apex>` answers 502 and that 502 means "the WebSocket transport
    # is not up yet". It is written here so the next reader is not left to guess.
    #
    # `PathPrefix(`/p2p`)` AND NOTHING ELSE ON THIS HOST. Unlike the RPC port above,
    # this one is a single endpoint on a path the contract names, so the router
    # publishes exactly that path and the hostname answers 404 everywhere else. The
    # prefix form rather than `Path` tolerates a trailing slash and a future
    # `/p2p/v2` without a second edit.
    #
    # ── NOTHING HERE MAY KILL A HEALTHY LONG-LIVED CONNECTION, AND NOTHING DOES ──
    #
    # This was checked rather than assumed, because it is the failure that would
    # appear as intermittent peer loss weeks later:
    #
    #   * NO TIMEOUT IS SET ON THIS ROUTER OR ITS SERVICE. Traefik has no per-router
    #     idle timeout; the only ones are the entrypoint's `respondingTimeouts`, and
    #     `compose/docker-compose.gateway.yml` sets none, so v3's defaults apply.
    #   * THE DEFAULT `readTimeout` DOES NOT REACH AN UPGRADED CONNECTION. Go's
    #     `net/http` clears every deadline on the socket when a handler hijacks it —
    #     `(*conn).hijackLocked` calls `rwc.SetDeadline(time.Time{})` — and a
    #     WebSocket proxy hijacks. So the 101 ends the reach of every server-side
    #     read deadline, which is why this needs no entrypoint override and gets
    #     none: widening `readTimeout` estate-wide to protect this one route would
    #     trade the whole gateway's slowloris bound for nothing.
    #   * THE RATE LIMIT COUNTS THE DIAL, NOT THE TRAFFIC. See `cf-p2p-dial-throttle`.
    #   * CLOUDFLARE IS THE ONE CLOCK THIS FILE CANNOT SET. Its edge closes a
    #     WebSocket that has been idle, and no gateway setting changes that; it is
    #     answered by application-level keepalive on Hearth's side, which is why that
    #     is part of the same contract as the port and the path.
{{ if env "CF_P2P_WS_UPSTREAM" }}
    cf-api-p2p:
      rule: 'Host(`p2p{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/p2p`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-p2p-dial-throttle]
      service: cf-svc-hearth-p2p
{{ end }}

  services:
    # ── EVERY BUNDLE UPSTREAM IS ONE POD ─────────────────────────────────────────────────────
    #
    # Twenty routers, twenty services, one backend: `web`, rendered by
    # `scripts/k8s-render-web.py`. Each bundle's own nginx.conf still decides everything about
    # its own paths — it runs unchanged on a loopback port inside that pod — so the ROUTERS
    # above are untouched and each surface's cache rules, redirects and 404 shape are the file
    # they always were.
    #
    # The router names are deliberately NOT collapsed. `cf-web-market` and `cf-web-journal`
    # naming the same service is how a reader sees that the split is now a routing fact rather
    # than a deployment one, and it is what makes putting one bundle back on its own pod a
    # one-line change.
    #
    # Port 8080 because the image is `nginx-unprivileged`: nothing in that container is root and
    # a non-root process cannot bind 80.
    cf-web-hub:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-site:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-market:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-create:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-trade:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-worlds:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-explorer:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-network:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-developers:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-admin:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-status:
      loadBalancer:
        servers: [{ url: "http://status-web:8080" }]
    cf-web-foresight:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-emberkin:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-aetherholm:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-tessera:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    # The two operator consoles. 8080 for the same reason as every bundle above —
    # `nginx-unprivileged` cannot bind 80 — read from each repository's Dockerfile
    # `EXPOSE`, not chosen.
    #
    # These two containers are the only frontends in docker-compose.estate.yml with
    # NO published host port, and that is deliberate: neither repository has a row
    # in micro-org's registry, so neither has a derived `4100 + index`, and
    # `scripts/web-check.py` fails on a chosen port in the derived block. The
    # container name is the only address the gateway needs and the only one either
    # bundle works at — see the block above them in the compose file.
    cf-web-lantern:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    cf-web-beacon:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    # The pool console. 8080 for the same reason, read from micro-pool-web's
    # Dockerfile `EXPOSE` — it runs `nginx-unprivileged`, which cannot bind 80.
    # Like the two above it this container publishes no host port; unlike them it
    # now has a registry row and therefore a derived one (4147), and it still does
    # not use it, because the gateway needs the container name and nothing else.
    # A published port here would be a second address for the same bundle and the
    # one nobody tests.
    cf-web-pool:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    # Forge Exchange. 8080 for the third time and the same reason, read from
    # micro-exchange-web's Dockerfile `EXPOSE`: `nginx-unprivileged` cannot bind 80.
    # It is NOT 5194 — that is the registry devPort, and on this row alone the
    # devPort names a vite dev server rather than anything a container listens on,
    # because there is no `micro-exchange` service to call. No published host port
    # here either: the gateway needs the container name and nothing else.
    cf-web-exchange:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    # Forge Journal. 8080 for the fourth time, same `nginx-unprivileged` reason,
    # read from micro-journal-web's Dockerfile `EXPOSE`. Not 5196 — that is the
    # registry devPort, and like exchange it names a vite dev server rather than
    # a listener, because there is no `micro-journal` and there is not going to
    # be one: this bundle's whole backend is `src/content/`, compiled to files.
    cf-web-journal:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
    # Forge Agora's bundle. 8080 for the fifth time and the same
    # `nginx-unprivileged` reason, read from micro-agora-web's Dockerfile
    # `EXPOSE`. Not 5197 — that is vite's port in a development stack — and not
    # 4150 either, which is the registry devPort and belongs to micro-agora, the
    # service below. This surface is the first in a while where the devPort and
    # the frontend are different processes, so the two are spelled out apart.
    cf-web-agora:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]

    # The APIs, on their surfaces' own hostnames. Every one listens on 4000 inside its own
    # container, which is fine because each has one; the 41xx numbers elsewhere in this estate are
    # host ports on one developer machine and are a different fact.
    cf-svc-hub-api:
      loadBalancer:
        servers: [{ url: "http://hub-api:4000" }]
    cf-svc-admin-api:
      loadBalancer:
        servers: [{ url: "http://admin-api:4000" }]
    cf-svc-market:
      loadBalancer:
        servers: [{ url: "http://market:4000" }]
    cf-svc-mint:
      loadBalancer:
        servers: [{ url: "http://mint:4000" }]
    cf-svc-trade:
      loadBalancer:
        servers: [{ url: "http://trade:4000" }]
    cf-svc-worlds:
      loadBalancer:
        servers: [{ url: "http://worlds:4000" }]
    cf-svc-devplatform:
      loadBalancer:
        servers: [{ url: "http://devplatform:4000" }]
    # The chain index. Named for the SERVICE (`indexer`) rather than for the surface it sits
    # under (`explorer`), because they are two different things and the registry has no `indexer`
    # key at all — which is the substitution micro-network-site had to name in its own header
    # (network-site/src/lib/hosts.ts, `CHAIN_INDEX_SURFACE`). 4000 is read from
    # `indexer/src/env.ts` and the container's published `127.0.0.1:4108->4000`, not assumed.
    cf-svc-indexer:
      loadBalancer:
        servers: [{ url: "http://indexer:4000" }]
    # 4022, and it is the ONE upstream in this file that is not 4000. Read from
    # `tessera/src/env.ts` and from its Dockerfile's `EXPOSE 4022`, not chosen here — the same
    # rule public-api.yml states for its upstreams. Writing 4000 out of habit would produce a
    # connection refused that looks exactly like a container that has not started.
    cf-svc-tessera:
      loadBalancer:
        servers: [{ url: "http://tessera:4022" }]
    cf-svc-identity:
      loadBalancer:
        servers: [{ url: "http://identity:4000" }]

    # wallet and custody, on the two hostnames Hub calls them by. custody is the only service in
    # this estate that holds private keys; it is reachable here because the key-export ceremony is
    # driven by the user's own browser and by nothing else. Note that the gateway is deliberately
    # NOT on the `cf-micro-vault` network (docker-compose.gateway.yml) — this route works
    # because the estate runs custody on its own default network in this dev environment, which is
    # the same dev-only compromise compose/estate/initdb.sql records for the database.
    cf-svc-wallet:
      loadBalancer:
        servers: [{ url: "http://wallet:4000" }]
    cf-svc-custody:
      loadBalancer:
        servers: [{ url: "http://custody:4000" }]
    # studio, on the hostname Market and Foresight fetch image bytes from. 4000 like almost
    # everything else here — the estate sets `PORT: "4000"` for every service — and NOT the 4015
    # the registry row carries, which is studio's own `pnpm dev` default (studio/src/env.ts).
    # Confirmed against both running gateways rather than assumed: `http://studio:4000/livez`
    # answers `{"ok":true,...}` from inside the mainnet and testnet gateways alike. Both have
    # been renamed since — `cloudsforge-estate-gateway-1` and `cf-testnet-gateway-1`, both in
    # the project of the services they serve (micro-org#257) — but the measurement stands.
    cf-svc-studio:
      loadBalancer:
        servers: [{ url: "http://studio:4000" }]
    # The second half of `pay.<apex>`. See the block beside `cf-api-pay-billing` for why one
    # hostname has two backends and why splitting it by resource is the registry's own model.
    cf-svc-billing:
      loadBalancer:
        servers: [{ url: "http://billing:4000" }]
    # 4000, like every other service here: the estate sets `PORT: "4000"` through
    # `*common-env`. Lantern's own DEFAULT is 4010 — the number the registry
    # carries as its devPort, and the one a bundle resolves on a loopback origin —
    # but in this environment it binds 4000 like the rest.
    cf-svc-lantern:
      loadBalancer:
        servers: [{ url: "http://lantern:4000" }]
    # 4000, through `*common-env`'s `PORT: "4000"`, like everything else here.
    # micro-pool's own default is 4146 (`pool/src/env.ts`) — the number the
    # registry derives and `pnpm dev` binds — and the compose file normalises the
    # CONTAINER port on top of it. Writing 4146 here would be a connection refused
    # that looks exactly like a container that has not started.
    #
    # This upstream is absent from a default `up`: micro-pool is behind the `pool`
    # compose profile until its coinbase payout address and its fee exist. Traefik
    # answers 502 on `/v1` until then, which is the honest answer and the one the
    # console is built to render — `pool-web` has no profile precisely so the page
    # that explains the hole is reachable before the service is.
    cf-svc-pool:
      loadBalancer:
        servers: [{ url: "http://pool:4000" }]

    # micro-agora. 4000 through `*common-env`'s `PORT: "4000"`, not the 4150 the
    # registry carries — that is the port the service binds by itself, and the
    # compose file normalises the CONTAINER port on top of it. Writing 4150 here
    # would be a connection refused that looks exactly like a container which has
    # not started.
    #
    # NO PROFILE on this one, unlike pool: the square is either open or it is
    # not, and a bundle that renders a timeline against a 502 has nothing honest
    # to put on the page — there is no equivalent of the pool console's "no
    # endpoint is published", because "there are no posts" and "the service is
    # down" are the same screen.
    cf-svc-agora:
      loadBalancer:
        servers: [{ url: "http://agora:4000" }]

    # ── the backends that arrived tonight ────────────────────────────────────
    #
    # All 4000, through `*common-env`'s `PORT: "4000"`, and all three bind something
    # else by default — emberkin 4100, aetherholm 4120, faucet 4013. Those are the
    # numbers `ui/packages/ui/src/surfaces.ts` carries as devPorts, because a devPort
    # is a fact about the service and the compose file normalises the CONTAINER port
    # on top of it. Writing a devPort here would be a connection refused that looks
    # exactly like a container that has not started.
    cf-svc-emberkin:
      loadBalancer:
        servers: [{ url: "http://emberkin:4000" }]
    cf-svc-aetherholm:
      loadBalancer:
        servers: [{ url: "http://emberkin:4000" }]
    # Behind the same condition as its router, and not because it would break —
    # an unreferenced service is harmless. Because a `cf-svc-faucet` defined in
    # an estate that runs no faucet is a standing invitation to point something
    # at it, and the next person to add a router would find the upstream already
    # written and assume somebody had checked. See the note above the router.
{{ if eq (env "CF_EMBER_NETWORK") "testnet" }}
    cf-svc-faucet:
      loadBalancer:
        servers: [{ url: "http://faucet:4000" }]
{{ end }}
    cf-svc-beacon:
      loadBalancer:
        servers: [{ url: "http://beacon:4000" }]
    # 4021, and it is the SECOND upstream in this file that is not 4000 — tessera's 4022 was the
    # first. Read from `foresight/src/env.ts` and its Dockerfile's `EXPOSE 4021`, not chosen
    # here, and it agrees with `public-api.yml`'s `http://foresight:4021`, which is the same fact
    # written down by the same rule. The compose file deliberately does NOT normalise this to 4000
    # the way it does emberkin's 4100 and aetherholm's 4120: 4021 sits below the derived 4100+
    # host-port block where nothing can grow into it, which is tessera's case and not theirs.
    cf-svc-foresight:
      loadBalancer:
        servers: [{ url: "http://foresight:4021" }]

    # ── the chain, which is the only upstream here that is not a container of ours ──
    #
    # Every other service in this file is a DNS name on the estate's own compose
    # network. These two are not, and cannot be: the chain is `hearth`, the frozen
    # upstream repository, run from its own compose file by
    # `scripts/ember-testnet.sh` on its own `hearth-testnet` network. The estate
    # reaches it the way `docker-compose.estate.yml` already does for the indexer
    # — through `host.docker.internal`, at the ports that file already publishes —
    # and the reason is ownership, stated beside that line: attaching hearth's seed
    # to this project's network would mean editing a repository that is read, run and
    # never modified.
    #
    # THE GATEWAY THEREFORE NEEDS `extra_hosts`, and it did not have it. Docker
    # Desktop resolves `host.docker.internal` for free and the Linux daemon does not,
    # which is the whole reason the indexer, foresight and the faucet each carry that
    # entry. This gateway had no upstream outside the compose network until now, so it
    # had no reason to — and the failure would have been invisible on the machine this
    # was written on and total on the box it deploys to. Added in
    # `compose/docker-compose.gateway.yml` beside the same comment.
    #
    # BOTH URLS ARE ENVIRONMENT VARIABLES rather than literals, and that is not
    # ceremony. Mainnet and testnet are two compose projects on one host reading two
    # env files, and the one thing they must never share is which chain they answer
    # for: a literal here would publish the testnet node at `rpc.cloudsforge.online`
    # the first time a mainnet chain existed, and every symptom of that would be a
    # correct-looking answer to the wrong question.
{{ if env "CF_RPC_UPSTREAM" }}
    cf-svc-hearth-rpc:
      loadBalancer:
        servers: [{ url: "{{ env "CF_RPC_UPSTREAM" }}" }]
{{ end }}
{{ if env "CF_P2P_WS_UPSTREAM" }}
    # `http://`, not `ws://`. A WebSocket begins as an HTTP request and Traefik
    # proxies the upgrade on the connection it already has, so the upstream is an
    # HTTP origin like every other one in this file. Traefik has no `ws://` scheme:
    # a URL written that way is rejected when the service is built and the router
    # that names it serves 502 while everything else in this directory keeps working
    # — loud enough to find, quiet enough to be worth naming here.
    cf-svc-hearth-p2p:
      loadBalancer:
        servers: [{ url: "{{ env "CF_P2P_WS_UPSTREAM" }}" }]
{{ end }}
{{ if env "CF_MINING_UPSTREAM" }}
    # The REST port, 8645 — a DIFFERENT upstream from cf-svc-hearth-rpc above and
    # the same node. `CF_RPC_UPSTREAM` is 8545, the Ethereum JSON-RPC port, and it
    # serves no `/mining/*` path at all: pointing this at that port would answer
    # every mining request with the JSON-RPC listener's 404 and read like an
    # ingress bug for as long as it took someone to compare two port numbers.
    cf-svc-hearth-mining:
      loadBalancer:
        servers: [{ url: "{{ env "CF_MINING_UPSTREAM" }}" }]
{{ end }}
{{ if env "CF_EXPLORER_INDEX_UPSTREAM" }}
    # ── THE TWO DEV-KIT UPSTREAMS ARE CONTAINER NAMES, NOT `CF_CHAIN_HOST` ────
    #
    # Every hearth upstream above resolves to the CHAIN HOST over WireGuard,
    # because the node is on another machine. These two are not the node: they
    # are `compose/docker-compose.hearth-devkit.yml`, which runs on THIS host,
    # beside the gateway, on the estate's own network. So they are reached by
    # compose service name through Docker's embedded DNS, exactly as the ~60
    # estate services in this file are.
    #
    # They in turn reach the chain over `EMBER_RPC_URL`, the same variable the
    # indexer and foresight use, so there is still exactly one statement per
    # environment of where the chain is.
    cf-svc-hearth-explorer-index:
      loadBalancer:
        servers: [{ url: "{{ env "CF_EXPLORER_INDEX_UPSTREAM" }}" }]
{{ end }}
{{ if env "CF_VERIFY_UPSTREAM" }}
    cf-svc-hearth-verify:
      loadBalancer:
        servers: [{ url: "{{ env "CF_VERIFY_UPSTREAM" }}" }]
{{ end }}
{{ else }}
# CF_WEB_APEX is unset, so this file contributes NOTHING rather than a full set of routers whose rules
# read `Host(``)` and match no request ever sent. That distinction is the whole of the comment at
# the top of compose/env/traefik.env, and it cost this estate a dead public API once already.
{}
{{ end }}
