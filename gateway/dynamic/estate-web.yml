# The surface route map — where the browser surfaces are served, and where each one's
# own API is served BEHIND THE SAME HOSTNAME.
#
# Eighteen of them now. The count is deliberately not written into the prose below any more:
# it was "fifteen" while sixteen frontends were routed, and then two operator consoles
# (`lantern.` and `beacon.`) arrived on hostnames this file had been treating as API-only.
# A number in a header is a copy of something countable, and this estate's whole record is
# that copies go stale. `scripts/surface-routes.py` counts the routers against the registry
# on every run and prints the total; that is the figure to trust.
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────────
#
# `public-api.yml` routes the third-party API on `api.<apex>`. `policy.yml` says how a request is
# treated. NEITHER SERVES A PAGE. Until the frontends joined docker-compose.estate.yml there was
# nothing to route, and docs/ecosystem/22 §8.7 recorded the consequence precisely: 318 browser
# scenarios specified, 86 of them tier T3, and not one of them able to run.
#
# ── THE ONE THING THIS FILE GETS RIGHT THAT A NAIVE VERSION WOULD NOT ──────────
#
# **A surface and its own API share an origin, and the gateway is what makes that true.**
#
# Every frontend resolves its API base by COMPARING ORIGINS (`resolveApiBase`, e.g.
# hub-web/src/lib/hosts.ts:34-42): if its registry host equals the page's origin the base is the
# EMPTY STRING and every request is relative. Served from `hub.<apex>`, hub-web asks
# `https://hub.<apex>/v1/dashboard` — not hub-api's hostname, which it does not have one of.
# micro-network-site states the obligation in as many words: "In production the origin is this
# page's, so the base is '' and the drip request is relative — which is what the registry asserts
# **and what the gateway therefore has to route**" (network-site/src/lib/hosts.ts:63-64).
#
# So each surface below gets TWO routers where its API exists in this estate: `/v1` to the
# service, everything else to the bundle. Routing only the bundle would leave every surface
# loading perfectly and answering nothing — the exact shape of failure that a `GET /` probe
# cannot see, and that doc 22 §4 built three tiers to catch.
#
# ── THE EMPTY-HOST TRAP, WHICH THIS ESTATE HAS ALREADY PAID FOR ────────────────
#
# The file provider renders Go templates BEFORE parsing YAML. `CF_API_HOST` was once undefined in
# the env file the gateway actually loads, so every router in public-api.yml rendered as
# ``Host(``) && PathPrefix(…)`` — a VALID rule that matches no request ever sent. Traefik logged
# nothing. The whole public API was dead and the only symptom was a 404 from the catch-all.
#
# This file refuses to reproduce that. Every router lives inside a conditional on CF_WEB_APEX (the
# action at the head of the document below), so an unset variable yields an empty document and NO
# ROUTERS AT ALL, rather than a full set of routers that silently match nothing.
# `scripts/estate-verify.sh` then fails on the first surface it cannot reach, which is a symptom
# pointing at its own cause.
#
# ── AND THE TRAP INSIDE THAT TRAP ──────────────────────────────────────────────
#
# **A Go template action written inside a YAML COMMENT is still an action.** The file provider
# renders the whole file as a template before anything parses YAML, and it has no idea what a
# comment is. This header used to spell the conditional out in prose-with-backticks; that opened a
# SECOND `if` which nothing closed, and Traefik answered:
#
#   ERR Error while building configuration (for the first time)
#       error="/etc/traefik/dynamic/estate-web.yml: template: :452: unexpected EOF"
#
# ── WHAT THAT ONE LINE COST, WHICH IS THE PART WORTH REMEMBERING ───────────────
#
# **The file provider is all-or-nothing.** One unparseable file in this directory publishes NO
# configuration from ANY file in it. `public-api.yml` went dark and `policy.yml` went with it — so
# the `/internal` refusal, a priority-100000 security rule, silently stopped existing and
# `GET /internal/x` answered 404 instead of 502. The error is logged ONCE, at startup, in a line
# that says nothing about the other two files.
#
# That is why estate-verify asserts `/internal` on a surface host at the very end of its run: it is
# the cheapest canary for "this directory did not load", and it costs one request.
#
# ── SET IT ─────────────────────────────────────────────────────────────────────
#
#   CF_WEB_APEX  the apex the surfaces are served under. `compose/env/traefik.env` defaults it to
#                `cloudsforge.localtest.me`, a public wildcard resolving to 127.0.0.1, so the dev
#                estate needs no /etc/hosts entry and no resolver. Production sets the real apex.
#
# `cloudsforgeHosts()` derives the apex from `window.location.hostname` by stripping a KNOWN
# subdomain (ui/packages/ui/src/surfaces.ts, KNOWN_SUBS), so `hub.cloudsforge.localtest.me`
# resolves its siblings to `nimbus.cloudsforge.localtest.me` and friends — all of which this file
# routes. It emits `https://` unconditionally, which is why the surfaces are on `websecure` and
# why the estate terminates TLS at the gateway even on loopback.
#
# ── SUBDOMAINS ARE READ, NOT CHOSEN ────────────────────────────────────────────
#
# Every host below is the `subdomain` field of that surface's row in
# `ui/packages/ui/src/surfaces.ts` — the registry whose own header records that this same list was
# maintained by hand in eight places and had already drifted. Two consequences that look like
# mistakes and are not:
#
#   * Forge Create is `create.`, though the repository is `micro-mint-web`.
#   * The developer platform is `developers.`, though the repository is `micro-devportal-web`.
#     policy.yml already carries that correction and the story of how it was found.
#
# Every host below now reads back to a registry row. `foresight-admin` used to be the one that did
# not — recorded here as a gap for micro-ui rather than invented into surfaces.ts from this
# repository, because a sixteenth hand-maintained copy is the mistake the registry exists to end.
# It was given a row, and at P13 the panel folded into `admin-web` and both went: the row, and the
# router that used to be beside `cf-web-foresight` below.

{{ if env "CF_WEB_SUFFIX" }}
http:
  middlewares:
    # Applied to every SURFACE route below — never to the API routes, which carry the service's
    # own answer semantics.
    #
    # The bundles already set these headers themselves in their own nginx.conf. Set again here
    # because a surface must not be able to relax the rule that constrains it: the same argument
    # policy.yml makes for keeping the /internal refusal out of a container label.
    cf-web-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # SAMEORIGIN rather than DENY: these surfaces carry a session that can move money, so no
        # foreign frame ancestor — but a surface framing its own page is a legitimate pattern and
        # frameDeny would break it. Matches what every frontend's nginx.conf already sends.
        customFrameOptionsValue: "SAMEORIGIN"

    # ── THE TWO CHAIN THROTTLES, AND WHY THEY ARE KEYED ON A HEADER ────────────
    #
    # `rpc.<apex>` and `p2p.<apex>` are the only two hostnames in this estate that
    # take work from a stranger with NO CREDENTIAL AT ALL. Every other unauthenticated
    # route here is either a static bundle or a service that checks a token inside
    # itself. An EVM JSON-RPC endpoint answers `eth_call` to anyone, and `eth_call`
    # runs a program.
    #
    # ── THE NODE'S OWN LIMITER CANNOT DO THIS JOB, AND HEARTH SAYS SO ITSELF ────
    #
    # `hearth/node/src/jsonrpc/server.js:244-255` bounds concurrent requests per
    # address, and its own comment names the exact defeat: "Keyed on
    # `socket.remoteAddress`, so behind a proxy — the public RPC ingress
    # docs/quickstart.md §9 still lists as pending — every request arrives from one
    # address and this degrades into a global cap."
    #
    # THAT DEGRADATION IS ALREADY LIVE AND IS NOT CAUSED BY THIS CHANGE. cloudflared
    # connects to the origin over loopback, so before today every tunnelled request
    # already reached hearth from 127.0.0.1 and already shared one bucket. What
    # changes is that the true client address is now available to something that can
    # act on it — which is only true once the request passes through here.
    #
    # `Cf-Connecting-Ip` RATHER THAN THE PEER ADDRESS, and that is the whole point:
    # the peer address is cloudflared's, one value for the entire internet, and a
    # limiter keyed on it throttles everyone as one client — the same collapse
    # quoted above, reproduced one layer up. Cloudflare SETS this header at its edge
    # and overwrites any client-supplied value, and the only path to this gateway is
    # the tunnel (every published port is bound to 127.0.0.1), so it is not
    # spoofable here.
    #
    # WHAT A REQUEST WITHOUT THE HEADER GETS, STATED. Anything that did not come
    # through Cloudflare — a loopback `curl`, `scripts/estate-verify.sh`, a probe on
    # the estate network — has no `Cf-Connecting-Ip`, so Traefik keys it on the empty
    # string and all such callers share ONE bucket. That is a deliberate acceptance
    # rather than an oversight: those callers are all on this box, the bucket is
    # generous, and the alternative (falling back to the peer address) would put the
    # real internet back into a single bucket to spare the loopback.
    #
    # THE NUMBERS. 30 requests/second sustained with a burst of 60 is roughly ten
    # times what a wallet polling `eth_blockNumber` needs and far below what makes a
    # single-threaded node — hearthd is one event loop, `scripts/ember-miner.sh:83`
    # — miss a block. It is a ceiling on abuse, not a quota anyone should meet.
    cf-rpc-throttle:
      rateLimit:
        average: 30
        period: 1s
        burst: 60
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip
    # The P2P limit counts DIALS, not messages: a WebSocket is one HTTP request and
    # then a hijacked socket this middleware never sees again, so an established peer
    # is untouched however much it gossips. 5/s with a burst of 20 bounds connection
    # churn — the thing a stranger can actually spend the node's memory with — and no
    # honest peer reconnects anywhere near that often.
    cf-p2p-dial-throttle:
      rateLimit:
        average: 5
        period: 1s
        burst: 20
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # ── THE MINING WORK API, AND WHAT ACTUALLY THREATENS IT ───────────────────
    #
    # Tighter than the RPC limit above and for a completely different reason, so
    # the number is argued rather than copied.
    #
    # `POST /mining/submit` IS NOT THE DANGEROUS ONE, which is the opposite of
    # how it reads. It mutates chain state, but a submission carries ONLY proof
    # fields — `hearth/node/src/mining.js:96` destructures exactly
    # `{templateId, nonce, powDigest, powSig}`, and `mining.js:110-111` rebuilds
    # the block as `{ ...t.header, nonce, powDigest, powSig }` with `txs: t.txs`
    # taken from the template THE NODE BUILT. A caller cannot smuggle in a
    # transaction, retarget, or repoint the coinbase, because none of that
    # travels in the body; `BLOCK.verifyPow` then rejects anything without real
    # work, and `chain.addBlock` revalidates all of it again. Spamming submit
    # costs the attacker a proof-of-work and buys them a 400.
    #
    # `GET /mining/template` IS. Each call makes the node assemble a candidate
    # block and store it, and the store is capped: `MAX_TEMPLATES = 256`
    # (`mining.js:32`, whose own comment is "Bounded so an unauthenticated caller
    # cannot grow this without limit"), with `_evict()` dropping the oldest. The
    # bound protects the node's MEMORY and does nothing for its USERS — a
    # stranger pulling templates in a loop evicts the owner's miners' work before
    # they can finish hashing it, and mining simply stops. Cheap to run, invisible
    # in any error rate, and the node stays perfectly healthy throughout.
    #
    # 2/s with a burst of 10, per client IP. A real miner pulls one template per
    # block attempt and re-pulls when the tip moves — `TTL_MS = 120_000`
    # (`mining.js:30`) is how long one stays valid — so single-figure requests per
    # minute is the honest shape, and 2/s is already generous by two orders of
    # magnitude. Keyed on `Cf-Connecting-Ip` for the reason the RPC block gives at
    # length: the node's own limiter sees cloudflared's address for every request
    # in the world, so this gateway is the only place the real client is visible.
    #
    # ── AND THIS IS NOT SUFFICIENT, WHICH IS SAID HERE RATHER THAN IMPLIED ────
    #
    # A per-IP limit does not stop a distributed or address-rotating caller from
    # keeping the 256-entry table churned. The correct protection for this
    # endpoint is AUTHENTICATION — the owner's miners are known machines, not the
    # public — and it is not here for one concrete reason: NO CLIENT SENDS A
    # CREDENTIAL TODAY. `hearth-mine`, the CLI light miner this route exists for,
    # builds its requests in one helper (`hearth/node/bin/hearth-mine.js:234`)
    # and sets only `content-type` (`:334`); the browser miner does a plain
    # `fetch` with no headers at all (`hearth/web/assets/mining/miner.js:213`,
    # `:282`). Putting basicAuth on this router would publish a route that every
    # existing caller answers with a 401, which is worse than the griefing risk it
    # removes.
    #
    # It is the RIGHT next step and it is cheap on the CLI side — one header in
    # one helper — so it is recorded here as owed rather than dismissed. It needs
    # a change in `hearth`, which is not this repository's to write, and a
    # credential store this gateway does not have yet (Traefik's basicAuth
    # `usersFile`, mounted like `gateway/certs/` and gitignored the same way).
    cf-mining-throttle:
      rateLimit:
        average: 2
        period: 1s
        burst: 10
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

  routers:
    # ─────────────────────────────────────────────────────── hub — AND SIGN-IN ──
    #
    # THE SURFACE THE WHOLE BROWSER CATALOGUE WAITS ON.
    #
    # `signInRedirect()` sends every signed-out visitor of every product to
    # `${accountUrl()}/login`, and `accountUrl()` resolves the `signin` registry row, which rides
    # on Hub at `/account` (ui/packages/ui/src/surfaces.ts, the `signin` entry). Nothing in any
    # environment served that address: identity renders no HTML, and there is no `account-web`
    # among the 58 repositories. doc 22 §8.1 calls it the largest blocker in the catalogue.
    #
    # hub-web's nginx.conf already enumerates `/account` as a client route, so the moment the
    # bundle ships a sign-in page this router serves it. That is the environment's half of the
    # blocker, and it is why estate-verify asserts `hub.<apex>/account/login` by name.
    cf-web-hub:
      rule: 'Host(`hub{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-hub

    # hub-api behind Hub's own hostname. hub-web asks `/v1/dashboard`, `/v1/portfolio`,
    # `/v1/activity`, `/v1/search`, `/v1/next-actions` RELATIVE to the page
    # (hub-api/src/server.ts:285-421, quoted in hub-web/src/lib/money.ts:7-8).
    cf-api-hub:
      rule: 'Host(`hub{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-hub-api

    # ─────────────────────────────────────────────────────────────── the apex ──
    # `site` has an EMPTY subdomain in the registry, so it is the bare apex rather than
    # `site.<apex>`. A router matching `Host(`.<apex>`)` would be the empty-host bug wearing a
    # different hat.
    cf-web-site:
      rule: 'Host(`{{ env "CF_SITE_HOST" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-site

    # ──────────────────────────────────────────────────────────────── market ──
    cf-web-market:
      rule: 'Host(`market{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-market
    cf-api-market-host:
      rule: 'Host(`market{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-market

    # ─────────────────────────────────────────────── create (micro-mint-web) ──
    cf-web-create:
      rule: 'Host(`create{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-create
    cf-api-create:
      rule: 'Host(`create{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-mint

    # ───────────────────────────────────────────────────────────────── trade ──
    cf-web-trade:
      rule: 'Host(`trade{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-trade
    cf-api-trade-host:
      rule: 'Host(`trade{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-trade

    # ──────────────────────────────────────────────────────────────── worlds ──
    cf-web-worlds:
      rule: 'Host(`worlds{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-worlds
    cf-api-worlds-host:
      rule: 'Host(`worlds{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-worlds

    # ──────────────────────────────────── worlds-api — REMOVED, AND IT STAYS REMOVED ──
    #
    # REMOVED: cf-api-worlds-api — worlds-api. was folded into api. and has no DNS record
    #
    # That router stood here, `Host(worlds-api{CF_WEB_SUFFIX})` -> `cf-svc-worlds`.
    # It is deleted, and this note exists so nobody restores it from the comment that used to be
    # here — that comment argued at length for the fold going `api.` -> `worlds-api.`, and THE
    # FOLD WENT THE OTHER WAY: `worlds-api` was consolidated INTO `api`. `api.` is the name a
    # third party is given, so `api.` is the name that survived; see the `api` row in
    # `ui/packages/ui/src/surfaces.ts`.
    #
    # **`worlds-api.<apex>` HAS NO DNS RECORD ON EITHER NETWORK AND IS NOT GETTING ONE.**
    # A router for a host that does not resolve is worse than no router: it makes a re-check of
    # this file conclude "worlds-api is configured, so it is fine". It was not fine, and that
    # reading is how the Forge Worlds outage survived review.
    #
    # The game API is reachable, unchanged, at two live addresses:
    #   `worlds{CF_WEB_SUFFIX}/v1` via `cf-api-worlds-host` above, and
    #   `api{CF_WEB_SUFFIX}/v1/titles|players|provisions|seasons` via `public-api.yml`.
    # `micro-worlds-web` calls the second — `API_SURFACE` is `'api'` (`worlds-web/src/lib/hosts.ts`).

    # ────────────────────────────────────────────────────────────── explorer ──
    # THE CHAIN INDEX IS ROUTED NOW, AND THE COMMENT THAT SAID IT WAS NOT IS THE DEFECT.
    #
    # What stood here until this edit described `cf-api-explorer` — "the same shape as cf-api-hub
    # above, with the host templated on explorer, PathPrefix `/v1`, priority 600, and a
    # cf-svc-indexer loadBalancer pointing at http://indexer:4000" — as a thing to add ONE DAY,
    # and read, to anyone skimming, exactly like documentation of a router that was present.
    # It was never defined. A DESCRIBED-BUT-UNDEFINED ROUTER IS WORSE THAN AN ABSENT ONE: it
    # answers the question "is the indexer routed?" with a yes, in prose, in the file that would
    # know.
    #
    # Its premise had also expired. The comment's whole argument was that `indexer` sat behind
    # `profiles: [indexer]` and was not started, so a router would answer 502 and read as "the
    # indexer fell over". THAT PROFILE IS GONE — compose/docker-compose.estate.yml:820-834 records
    # its removal and the reason ("THAT WORK IS COMMITTED … AND THE IMAGE BUILDS") — and the
    # container has been up and healthy on `cloudsforge-estate_default`, which this gateway is
    # also attached to, resolving `indexer` to a live address. The precondition for the omission
    # dissolved; the paragraph explaining the omission did not.
    #
    # ── WHAT IT COST, MEASURED BEFORE THIS EDIT ─────────────────────────────────────────────
    #
    #   http://127.0.0.1:4108/chains/ember/testnet/status         -> 200  application/json
    #   http://127.0.0.1:4108/v1/chains/ember/testnet/status      -> 200  application/json
    #   https://explorer.<apex>/v1/chains/ember/testnet/status    -> 404  TEXT/HTML
    #   https://network.<apex>/v1/chains/ember/testnet/status     -> 404  from cf-svc-faucet
    #
    # `micro-network-site`'s chain panel resolves the chain index through the registry key
    # `explorer` (network-site/src/lib/hosts.ts, `CHAIN_INDEX_SURFACE`), so the request it makes
    # is the third line. The panel rendered "No figures for ember:testnet — Request failed (404)"
    # against a live chain at tip height 2594, which is the correct behaviour for this estate and
    # the wrong answer to give a visitor.
    #
    # AND CHECK THE CONTENT TYPE, NOT THE STATUS. `cf-web-explorer` below matches the host with no
    # path constraint, so before this router existed some indexer paths returned **200 carrying
    # index.html** rather than a 404 — `/chains/ember/testnet/status` did exactly that. A reader
    # verifying by status code alone concludes the route works. The prefixed form 404'd only
    # because the bundle's own static server has no `/v1` fallback; that is luck, not routing.
    #
    # `/v1` IS THE CORRECT PREFIX AND BOTH CALLERS WERE ALREADY RIGHT. indexer mounts every route
    # twice — `PREFIXES` is `['/v1', '']` (indexer/src/server.ts:144), looped over in `buildRoutes`
    # (indexer/src/server.ts:416) — so there is no path mismatch to resolve and NO REWRITE
    # MIDDLEWARE IS WARRANTED. `/v1` is the estate convention; the service's own comment at
    # indexer/src/server.ts:137-143 says the bare form exists for its operator runbooks rather than
    # for new callers. Both bundles that read this surface already use the `/v1` form
    # (explorer-web/src/lib/indexer.ts:14-16, network-site/src/lib/chainstatus.ts:320), so this
    # router is prefixed and the bare form is deliberately NOT routed at the edge: mounting it here
    # would publish the runbook spelling as a public contract and make the estate's one convention
    # two.
    #
    # CORS needs nothing added. `network-site` reads this host CROSS-ORIGIN — the bundle is served
    # from `network.<apex>` and resolves the chain index to `explorer.<apex>` — and micro-indexer
    # sends no `access-control-*` header of its own anywhere in its source. The estate's CORS is
    # one middleware on the entrypoint chain (compose/docker-compose.gateway.yml:117,
    # `cf-cors@file`), so it applies to this router without being listed on it, and the network
    # surface's origin under the estate apex is already in that allowlist
    # (gateway/dynamic/policy.yml, the CF_WEB_APEX block, the `network.` line). The reads are
    # anonymous — `authoriseRead` returns null and lets the handler run when no bearer is
    # presented (indexer/src/server.ts:794) — so nothing here needs a credential.
    #
    # The templated hostname is spelled out in the RULE below and nowhere in this prose, and that
    # is the file's standing rule rather than a stylistic choice: a Go template action inside a
    # YAML comment is still an action to the file provider, which renders this file BEFORE
    # anything parses the YAML and has no idea what a comment is. An unclosed one takes every file
    # in this directory down with it.
    cf-web-explorer:
      rule: 'Host(`explorer{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-explorer
    # Priority 600 beats `cf-web-explorer`'s 500 on the same host, which is how every
    # surface-plus-API pair in this file separates a bundle from its service. No `cf-web-headers`:
    # that middleware sets a bundle's CSP and frame policy, and this upstream answers JSON.
    cf-api-explorer:
      rule: 'Host(`explorer{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-indexer

    # ────────────────────────────────────── developers (micro-devportal-web) ──
    cf-web-developers:
      rule: 'Host(`developers{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-developers
    cf-api-developers:
      rule: 'Host(`developers{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-devplatform

    # ───────────────────────────────────────────────────────────────── admin ──
    # The console and its API share `admin.<apex>` in production — the fact that hid a wrong
    # `devPort` in the registry for months, because production worked and `pnpm dev` did not
    # (ui/packages/ui/src/surfaces.ts, the `admin` row). Both halves are routed here.
    cf-web-admin:
      rule: 'Host(`admin{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-admin
    cf-api-admin:
      rule: 'Host(`admin{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-admin-api

    # ──────────────────── surfaces whose service WAS absent — four have arrived ──
    #
    # This section used to read "these five bundles are routed; the services behind them are NOT
    # IN THIS ESTATE", and said what to do when that changed: "The day one of these services
    # joins the estate, add its router beside its surface." **That day has come for four of the
    # five.** `aetherholm`, `emberkin`, `beacon` and `faucet` now have containers in
    # docker-compose.estate.yml, and `foresight` is the last one outstanding.
    #
    # The rule the section was built on still governs every router below and is unchanged: a
    # router pointing at a container that does not exist answers 502, which reads as "the service
    # fell over" — a wrong diagnosis, permanently. So a `/v1` router is written HERE ONLY WHEN the
    # container exists, and a surface whose backend is still absent keeps the bundle-only
    # treatment, where its API call 404s from nginx and honestly means "there is no such service".
    #
    # ── network — the bundle AND the faucet, which is a ROUTE on this host ──────
    #
    # `faucet` is not a hostname. The registry makes it a surface with
    # `subdomain: 'network'` and `basePath: '/faucet'` — "a route on the Network site rather than
    # a host of its own" — so `resolveApiBase` compares origins, finds them equal, and
    # `network-site` posts a drip to a RELATIVE `/v1/drips`. `network-site/src/lib/hosts.ts:63`
    # states the obligation this router discharges in as many words: "In production the origin is
    # this page's, so the base is '' and the drip request is relative — which is what the registry
    # asserts **and what the gateway therefore has to route**".
    #
    # `micro-faucet` serves `/v1/faucet`, `/v1/drips` and `/v1/drips/:id` and nothing else outside
    # the health endpoints, so `PathPrefix(/v1)` is its whole public surface. Priority 600 over
    # the bundle's 500, for the reason the tessera block gives: both rules match, and without the
    # higher number the SPA would answer the drip request with index.html — a 200 carrying HTML
    # where JSON was expected, which fails in the client as a parse error naming the wrong file.
    cf-web-network:
      rule: 'Host(`network{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-network
    # ── AND THE ROUTER EXISTS ONLY WHERE THE FAUCET CAN ──────────────────────
    #
    # This router was UNCONDITIONAL, and on the mainnet estate it answered 502:
    #
    #     https://network.cloudsforge.online/v1/faucet  ->  502   (2026-08-05)
    #     https://network.cloudsforge.online/faucet     ->  200 text/html
    #
    # There is no faucet container in the mainnet estate and there is never going
    # to be one. `faucet/src/env.ts:63` is `export const NETWORK = 'testnet' as
    # const`, annotated that way so `NETWORK === 'mainnet'` is a COMPILE ERROR
    # rather than a branch, and `faucet/src/index.ts:108-120` reads `eth_chainId`
    # at boot and exits on anything that is not 7412. Its own header says why: a
    # faucet is an unauthenticated withdrawal endpoint that happens to be pointed
    # at a worthless chain, and the EMBER mainnet on this host is mined, publicly
    # reachable and backs the ledger. So both faucet services carry
    # `profiles: ["ember-testnet"]` and mainnet starts neither.
    #
    # A 502 is the estate saying "there is a faucet here and it has fallen over".
    # That is a wrong diagnosis, permanently — and it is EXACTLY the failure the
    # rule at the head of this section already forbids: "a router pointing at a
    # container that does not exist answers 502… so a `/v1` router is written
    # HERE ONLY WHEN the container exists, and a surface whose backend is still
    # absent keeps the bundle-only treatment, where its API call 404s from nginx
    # and honestly means 'there is no such service'." The faucet's container
    # exists in one of the two environments, so the router does too.
    #
    # ── WHY `eq` AND NOT A BARE `if env` ON A CF_FAUCET_UPSTREAM ─────────────
    #
    # (Written without the braces on purpose. The file provider renders Go
    # template actions BEFORE it parses YAML, so `{`+`{ if … }`+`}` inside a `#`
    # comment is a REAL action — an unbalanced one here took the whole directory
    # down with `template: :1487: unexpected EOF`, and with it every router for
    # all twenty-four hostnames. `scripts/gateway-reload.sh --validate` caught it
    # in the throwaway and the live gateway was never touched. No other comment
    # in this file has ever contained one.)
    #
    # The chain upstreams at the foot of this file use the bare-`env` shape,
    # where an unset variable produces no router. That shape is unavailable here
    # and `scripts/surface-routes.py` check 6 is the reason, in its own words:
    # "An environment that genuinely should not carry that router changes the
    # ROUTER, where the reason can be written down — not this file, where its
    # absence looks like an oversight." An empty `CF_FAUCET_UPSTREAM=` in
    # `traefik.env` would be indistinguishable from somebody having deleted the
    # line. So the variable is SET IN BOTH environments, carries the estate's
    # actual chain, and the decision is taken here where this comment is.
    #
    # `CF_EMBER_NETWORK` is not a new fact either — `docker-compose.estate.yml`
    # already keys `env/chain.${CF_EMBER_NETWORK}.env` and the ledger's
    # reconciliation network on it, and `compose/testnet.env:126` sets it. The
    # gateway simply had no copy of the one variable that decides whether the
    # service behind this router exists.
    #
    # WHAT MAINNET ANSWERS INSTEAD: `cf-web-network` at priority 500 takes the
    # path, and the bundle's nginx answers `404 application/json` — measured on
    # `explorer.cloudsforge.online/v1/nope`, which has no `/v1` router and is the
    # same image. That is the honest answer and `estate-verify.sh` asserts both
    # the status and the content type, because a 404 of index.html would be the
    # right number from the wrong thing.
{{ if eq (env "CF_EMBER_NETWORK") "testnet" }}
    cf-api-network:
      rule: 'Host(`network{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-faucet
{{ end }}

    # ── status — the page whose whole job is to work when everything else does not ────
    #
    # `status-web` asks for `/api/status/public` SAME-ORIGIN, deliberately, and its own hosts.ts
    # argues the case: a relative request needs one hostname, one handshake and one certificate —
    # the ones the reader has already completed by having the page on screen — where a
    # cross-origin call to `beacon.<apex>` needs a second DNS answer, a second certificate and a
    # CORS preflight, "and every one of those is a way for the status page to fail during the
    # event it exists to describe".
    #
    # Nothing routed it. The page rendered *"Not determined — our status service answered with
    # HTTP 404"*, which is the honest thing for it to say and is why the frontend was left alone.
    #
    # `Path`, not `PathPrefix`, and exactly one of them. Beacon's other `/v1` routes are gated on
    # `BEACON_TOKEN` or an identity token and have no business on a public bundle's hostname; this
    # is the ONE projection built to be read by strangers, and `publicstatus.ts` is what makes that
    # safe — no target name, no error string, no latency and no journey step name is written into
    # the document at all.
    #
    # **THE ROUTE ALONE WOULD HAVE TURNED A 404 INTO A 401.** `beacon/src/server.ts:459` is
    # `if (!deps.publicStatus) await authorise(ctx, deps, READ_SCOPE)`, and `BEACON_PUBLIC_STATUS`
    # defaults FALSE (`beacon/src/env.ts:330`) and was set nowhere here. So the compose block sets
    # it, and the two changes are one change: a status page behind a login is not a status page.
    cf-web-status:
      rule: 'Host(`status{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-status
    cf-api-status-public:
      rule: 'Host(`status{{ env "CF_WEB_SUFFIX" }}`) && Path(`/api/status/public`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-beacon

    # ── beacon — THE HOST THAT WAS ALL API, AND NOW CARRIES A CONSOLE TOO ─────
    #
    # `beacon` is a registry SERVICE with `subdomain: 'beacon'`, so every bundle in the
    # estate composes `https://beacon.<apex>` from the registry — and for a while nothing
    # answered there at all. It is also what `status-web` reads: its own hosts.ts says the
    # status page's API base "is neither `hosts().status` — nothing serves an API there —
    # nor unconditionally `hosts().beacon`", which is only a decision it can make if the
    # second address exists.
    #
    # ── WHAT CHANGED, AND WHY THE ROUTER WAS RENAMED RATHER THAN REPOINTED ─────
    #
    # What stood here was ONE router, `cf-web-beacon`, matching the whole host and pointing
    # at `cf-svc-beacon`, with a paragraph arguing for exactly that: "no bundle is served at
    # `beacon.<apex>`, so there is no priority tie for a path prefix to break". **That
    # premise expired when `micro-beacon-web` was built.** `ui/packages/ui/src/surfaces.ts`
    # quotes the sentence above as the evidence for `servesUi: false`, and the consequence
    # it records is the defect: `beacon` is `inSwitcher: true`, so the operator switcher
    # offered every admin an entry that answered `404 application/json`.
    #
    # So the API router keeps its upstream and takes the name that describes it —
    # `cf-api-beacon`, at priority 600 — and `cf-web-beacon` is now the BUNDLE at 500, which
    # is the surface-plus-API shape every other pair in this file uses. Renaming rather than
    # adding a third router matters: `cf-web-*` pointing at a `cf-svc-*` upstream is the
    # whole-host shape that `scripts/surface-routes.py` reads to decide whether a host has an
    # API router at all, and leaving that name on the API would have made the two directions
    # of this file's own vocabulary disagree.
    #
    # ── THE PREFIX LIST IS READ OFF `beacon/src/server.ts`, NOT INHERITED ──────
    #
    # Every route micro-beacon defines, enumerated from its own `define(...)` calls:
    #
    #     /v1/gate  /v1/gate/history  /v1/gate/overrides  /v1/journeys
    #     /v1/journeys/:name/mute  /v1/probes  /v1/probes/:name  /v1/incidents
    #     /v1/incidents/:id/close  /v1/incidents/:id/updates  /v1/slos  /v1/slos/:name
    #     /v1/conformance     /api/status/public   /api/alerts/webhook
    #     /metrics   /livez   /readyz
    #
    # which is `/v1`, `/api`, `/metrics`, `/livez` and `/readyz` and nothing else. Checked
    # against the bundle's client routes in the other direction too: beacon-web's `ROUTES`
    # are `/`, `/journeys`, `/probes`, `/incidents`, `/objectives` and `/conformance`
    # (beacon-web/src/lib/routes.ts) — top-level names that look like the API's resources and
    # are NOT them, because the API's are all under `/v1`. There is no collision to break,
    # which is why this needs none of the `Accept`-header machinery foresight does.
    #
    # SAME ORIGIN IS MANDATORY HERE, NOT PREFERRED. micro-beacon sends no `access-control-*`
    # header anywhere in its source and answers 404 to a preflight, so a console on any other
    # hostname could not read it at all. That is why the bundle shares this host rather than
    # taking a `beacon-console.` of its own, and it is why beacon-web's nginx.conf answers
    # these same five prefixes with a plain-text 404 naming this file: if the priorities are
    # ever inverted, the operator gets that sentence instead of the console rendered under an
    # API address with a 404 status.
    #
    # NOT A PUBLIC READ SURFACE: every `/v1` route on beacon is gated on `BEACON_TOKEN` or
    # an identity token, checked inside the service. Routing the host does not open it —
    # and `/internal` stays refused above every router here by policy.yml's priority-100000
    # rule, which nothing in this file can outrank. `/api/status/public` is the one exception
    # and it is the service's own decision, taken with `BEACON_PUBLIC_STATUS`; see the
    # `cf-api-status-public` block above.
    cf-web-beacon:
      rule: 'Host(`beacon{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-beacon
    cf-api-beacon:
      rule: 'Host(`beacon{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/v1`) || PathPrefix(`/api`) || PathPrefix(`/metrics`) || PathPrefix(`/livez`) || PathPrefix(`/readyz`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-beacon

    # ── foresight — the fifth backend to arrive, and the only one whose API COLLIDES
    #    WITH ITS OWN BUNDLE'S CLIENT ROUTES ──────────────────────────────────
    #
    # `foresight` is now a container in docker-compose.estate.yml, so this surface gets an API
    # router beside its bundle for the emberkin/aetherholm/tessera reason. Two things make it
    # unlike all four of those, and both are read off the repositories rather than assumed.
    #
    # **1. THE UPSTREAM SERVES NO `/v1`.** `foresight/src/server.ts` defines every route at the
    # root — `/categories`, `/markets`, `/markets/:id`, `/markets/:id/stake-intent`, `/ideas`,
    # `/ideas/:id/approve` and the rest. That is the same shape identity has, and public-api.yml
    # already carries the consequence: it strips `/v1` for foresight (`cf-api-strip-version`)
    # because "11 §288 specifies the public API as URL-versioned" and the service is not. Here
    # there is no version to strip — `foresight-web` and the operator console both call the
    # unversioned paths directly — so the routers below name the RESOURCES.
    #
    # **2. `/markets` IS BOTH AN API PATH AND A CLIENT ROUTE.** `foresight-web/src/lib/routes.ts`
    # declares `{ path: 'markets', wildcard: true }` — `/markets/<uuid>` "is the address people
    # paste at each other" — and its nginx.conf serves the app shell for it. The SAME path is
    # what `foresight.ts:334` fetches for the market list. A plain `PathPrefix(/markets)` router
    # at priority 600 would therefore answer a person's pasted link with JSON, which is the
    # emberkin defect exactly inverted and no better.
    #
    # `/ideas` and `/categories` have no such collision: neither is in `ROUTES`, so nginx already
    # 404s them "on purpose, so that a wrong address answers 404 rather than 200" — and THAT 404
    # is the one the operator panel used to get, because it calls this host's API cross-origin and
    # nothing here answered. Those two are routed unconditionally.
    #
    # **THE CROSS-ORIGIN CALLER MOVED AT P13 AND DID NOT GO AWAY.** It was
    # `foresight-admin.<apex>`; it is now `admin.<apex>/foresight`, a section inside the operator
    # console (`admin-web/src/lib/hosts.ts`, `FORESIGHT_SURFACE = 'foresight'`). These three
    # routers are unchanged by that fold — the panel called this host from another origin before
    # and calls it from another origin still. What DID change is which origin, and therefore which
    # entry in `policy.yml`'s CORS allowlist has to be there: `https://admin.<apex>` already was.
    # The header list was the gap, and `idempotency-key` is now in it.
    #
    # `/markets` is separated by `Accept`, which is a FACT ABOUT THE TWO CALLERS and not a
    # heuristic: `foresight-web/src/lib/api.ts:265` and `admin-web/src/lib/api.ts` both
    # set `accept: application/json` on every request they make, and a browser NAVIGATION sends
    # `text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8` — which contains
    # `application/xml` and `application/xhtml+xml` and never `application/json`. So the deep link
    # gets the shell and the fetch gets the market. Priority 700 so it outranks both the resource
    # routers and the bundle.
    #
    # This is worth stating plainly because it is the kind of rule that looks clever and rots: if
    # foresight-web ever stops sending that header, the market list breaks and the deep link keeps
    # working — a visible failure in the surface that changed, not a silent one somewhere else.
    # The alternative was asking micro-foresight-web to move its client routes or micro-foresight
    # to version its API, and neither repository is mine tonight.
    cf-web-foresight:
      rule: 'Host(`foresight{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-foresight
    cf-api-foresight-resources:
      rule: 'Host(`foresight{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/ideas`) || PathPrefix(`/categories`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-foresight
    cf-api-foresight-markets:
      rule: 'Host(`foresight{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/markets`) && HeaderRegexp(`Accept`, `application/json`)'
      priority: 700
      entryPoints: [websecure, tunnel]
      service: cf-svc-foresight

    # ── THE FORESIGHT-ADMIN BUNDLE ROUTER WAS HERE, and the P13 fold removed it ───────────
    #
    # Its name is deliberately not written out below. `scripts/surface-routes.py` check 4 fails on
    # any `cf-api-*`/`cf-web-*`/`cf-svc-*` name that appears in a COMMENT in this directory and is
    # defined nowhere in it — because "a router that exists only as prose answers 'is it routed?'
    # with a yes, in the file that would know". A tombstone naming the deleted router is exactly
    # that sentence, so this one describes it instead. The check caught this comment on its first
    # run, which is the check doing its job on the person who added the check's neighbour.
    #
    # `foresight-admin.<apex>` is served by nothing now. The Foresight operator panel is a SECTION
    # inside the operator console — `admin.<apex>/foresight` — so it is served by `cf-web-admin`
    # above, behind the same Cloudflare Access policy as the rest of that host, and it needs no
    # router of its own.
    #
    # Its API router was never here either, and that is the part worth keeping straight: the panel
    # called `foresight.<apex>` cross-origin then and it still does now from its new home. Those
    # routers — `cf-api-foresight-resources` and `cf-api-foresight-markets` — are directly above
    # and are UNCHANGED by the fold. What changed is the browser origin they answer, which is why
    # `policy.yml` gained `idempotency-key` in the same commit; see the note there.
    #
    # The deletion could not have been made here alone. `scripts/surface-routes.py` check 2 fails
    # on a router for a host no registry row declares, and check 1 fails on a registry row with no
    # router — so this line and `ui/packages/ui/src/surfaces.ts`'s `foresight-admin` row had to go
    # together, which is exactly the coupling that script exists to enforce.

    # ── emberkin and aetherholm — their backends ARRIVED, and their bundles were still
    #    talking to nginx ──────────────────────────────────────────────────────
    #
    # Both call their OWN registry host and not a sibling: `emberkin-web/src/lib/hosts.ts:102` is
    # `new URL(hosts().emberkin).origin` and aetherholm-web:52 the same for `aetherholm`. Since
    # both bundles are served AT those hosts, that origin is the page's own — so every request is
    # `/v1/...` on this hostname, and until now `cf-web-emberkin` was the only router matching it.
    # The bundle answered its own API calls with its own index.html.
    #
    # Written now rather than when the containers landed, because that is the drift this section
    # was created to prevent and it recurred inside one night: the compose file gained a service
    # and this file was not opened. `scripts/gateway-check.py --surfaces` now fails on it.
    cf-web-emberkin:
      rule: 'Host(`emberkin{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-emberkin
    cf-api-emberkin:
      rule: 'Host(`emberkin{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-emberkin

    cf-web-aetherholm:
      rule: 'Host(`aetherholm{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-aetherholm
    cf-api-aetherholm:
      rule: 'Host(`aetherholm{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-aetherholm
    # `/readyz` is not under `/v1`, so the prefix router above never saw it and the bundle's nginx
    # 404'd it. `aetherholm-web` reads it to render whether the game is up, so a routing gap told
    # every visitor a perfectly healthy service was degraded. `Path`, exactly one, and NOT
    # `PathPrefix`: `/livez` and `/metrics` stay unrouted, because liveness is for the orchestrator
    # and `/metrics` is for Prometheus on the compose network.
    #
    # This is the only health endpoint published anywhere in this file, and it is published because
    # a BUNDLE consumes it. It is the same shape as the status page above: a frontend asking its
    # own origin for something only its backend can answer.
    cf-api-aetherholm-readyz:
      rule: 'Host(`aetherholm{{ env "CF_WEB_SUFFIX" }}`) && Path(`/readyz`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-aetherholm

    # ─────────────────────────────── tessera — THE FIRST TITLE WITH A SERVICE ──
    #
    # The section above exists for surfaces whose backend is not in this estate, and says what to
    # do when that changes: "The day one of these services joins the estate, add its router beside
    # its surface." This is that day. tessera-web AND tessera are both containers in
    # docker-compose.estate.yml, so this surface gets the `/v1` router the four above are
    # deliberately denied — and the reason they are denied it is the reason this one is safe to
    # write: a router pointing at a container that does not exist answers 502, which reads as "the
    # service fell over" rather than "there is no such service here". `cf-svc-tessera` points at a
    # container that does exist, so a 502 from it would be true.
    #
    # PRIORITY 600 ON THE API ROUTER, 500 ON THE SURFACE. Both rules match a request for
    # `tessera.<apex>/v1/wards`; Traefik resolves the tie by priority, and without the higher
    # number the bundle would win and every API call would be answered with index.html — a 200
    # carrying HTML where JSON was expected, which fails in the client as a parse error naming the
    # wrong file. That is the same ordering `cf-api-admin` uses above.
    #
    # WHY THE APP CAN CALL A RELATIVE PATH AT ALL: `resolveApiBase` returns the EMPTY STRING when
    # a bundle is served from its own registry host, so tessera-web's requests are same-origin
    # `/v1/...` and this router is what has to catch them. Route the bundle and not the API and the
    # surface loads beautifully and answers nothing.
    #
    # PORT 4022, not 4000. tessera is the one service in this estate that does not bind 4000, and
    # the number is argued rather than picked — 23-tessera.md §10.1, and the block beside its
    # container in docker-compose.estate.yml.
    cf-web-tessera:
      rule: 'Host(`tessera{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-tessera
    cf-api-tessera:
      rule: 'Host(`tessera{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/v1`)'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-tessera

    # ──────────────────────────────────────────────────────────────── nimbus ──
    #
    # identity, on the hostname every bundle in the estate calls it by.
    #
    # THIS IS THE OTHER HALF OF THE SIGN-IN BLOCKER. `consumeAuthCallback` posts the hand-off code
    # to `${cloudsforgeHosts().nimbus}/auth/handoff/redeem` and the token refresh goes to
    # `${nimbusUrl()}/auth/refresh` — both CROSS-ORIGIN from every surface, from `hub.<apex>`
    # included. Without this router the sign-in page loads and every call it makes 404s at the
    # gateway; with it, and with the CORS entry policy.yml now adds for this apex, the round trip
    # completes.
    #
    # The WHOLE host, not a prefix: identity serves 34 unversioned routes at the root
    # (identity/src/server.ts:618 onward) and picking prefixes here would be a second, drifting
    # copy of that list. `/internal` is still refused above every router in this file by
    # policy.yml's priority-100000 rule, which nothing here can outrank.
    cf-web-nimbus:
      rule: 'Host(`nimbus{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      service: cf-svc-identity

    # ────────────────────────────────── pay and vault — the two money hosts ──
    #
    # `micro-hub-web` names the gap and could not close it from its own repository:
    #
    #   "TWO THINGS IN micro-deploy HAVE TO BE TRUE BEFORE THIS WORKS IN A BROWSER, AND ARE NOT.
    #    There is no gateway router for `pay.<apex>` or `vault.<apex>` in the working tree, and the
    #    routers that do exist for wallet are on the API host, which deliberately carries the
    #    security headers WITHOUT the app CORS allowlist."   (hub-web/src/lib/money.ts:34-41)
    #
    # Both halves check out against source. `hosts().pay` → wallet and `hosts().keyvault` →
    # custody (hub-web/src/lib/money.ts:47-53), and the registry gives `pay` the subdomain `pay`
    # and `keyvault` the subdomain **`vault`** (ui/packages/ui/src/surfaces.ts) — the one host in
    # this estate whose name does not match its registry key.
    #
    # WHY THESE TWO CANNOT GO ON THE API HOST. Withdrawal and key-export are authorised against
    # the USER'S OWN token — custody's export ceremony reads `amr` and `auth_time` off it
    # (custody/src/exports.ts, gates 4 and 6) — so the caller is a first-party browser, and a
    # first-party browser needs the app CORS allowlist. `api.<apex>` is called by third-party
    # servers and the SDK and deliberately does not carry it.
    #
    # ON THE MIDDLEWARE, PRECISELY. `cf-cors@file` is NOT listed here, and that is not an
    # oversight: it is applied to every router on this entryPoint by
    # `--entrypoints.websecure.http.middlewares` in compose/docker-compose.gateway.yml:90. Listing
    # it again would run the same headers middleware twice on one request. The consequence is
    # asserted rather than assumed — `scripts/estate-verify.sh` sends a real cross-origin preflight
    # from Hub's origin to both hosts and requires the allowlist echo, which is the only way to
    # know. (It also means public-api.yml:66-69's claim that the API host gets the headers
    # "without the app CORS allowlist" is not true today; the entrypoint gives it one. Recorded
    # here rather than silently corrected there, because narrowing that chain is a policy change
    # and policy.yml is the file that owns it.)
    # ── `pay.<apex>` HAS TWO BACKENDS, AND ROUTING IT TO EITHER ONE IS WRONG ────
    #
    # It was pointed wholly at wallet, and `emberkin.<apex>`'s wardrobe 404'd on `/entitlements`.
    # The obvious repair — repoint it at billing — was checked against both consumers first and is
    # ALSO wrong. Two bundles resolve this one hostname, and each is right about its own half:
    #
    #   * `hub-web/src/lib/money.ts:47-49` — `const wallet = (path) => request(hosts().pay, path)`,
    #     and every call through it is `/v1/withdrawals` or `/v1/deposits`. Sending those to
    #     billing would break withdrawal and deposit in the Hub, which is the money path.
    #   * `emberkin-web/src/lib/hosts.ts:106-113` — `billingBase() { return hosts().pay }`, for
    #     `GET /entitlements` (`emberkin-web/src/lib/billing.ts:75`). Wallet has no such route —
    #     it has no `/entitlements` at all — so this has been a 404 since the host was routed.
    #
    # The registry calls the surface the "Forge Pay API" and gives it no repository: it is a
    # FAMILY, not a service. `money.ts:30-33` says so, and says what to do about it: "`pay` is the
    # estate's row for the payments API family … and the gateway routes wallet's resources by path
    # prefix (public-api.yml:118-124), so one host serving both by prefix is consistent with how
    # the public surface is already laid out."
    #
    # So the host is split by RESOURCE, exactly as `api.<apex>` is, and for the same stated reason:
    # which service owns a resource is an implementation detail, and publishing it turns an
    # internal refactor into a breaking change for a browser.
    #
    # BILLING'S ROUTER IS THE NARROW ONE and wallet keeps the host. That is deliberate: wallet's
    # surface here is the whole `/v1` money API and is the one that grows, while billing's use of
    # this hostname is the four resources it actually serves — enumerated from
    # `billing/src/server.ts` (`/products` :375, `/purchases` :409, `/entitlements` :473,
    # `/subscriptions` :580) rather than guessed. `/internal/entitlements/:userId` (:505) is
    # deliberately NOT among them and could not be reached if it were: policy.yml refuses
    # `/internal` at priority 100000, above every router in this file, and its header explains
    # that Pay's internal routes take a `userId` as a parameter and are therefore an
    # act-as-anyone primitive from off the box.
    cf-web-pay:
      rule: 'Host(`pay{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      service: cf-svc-wallet
    cf-api-pay-billing:
      rule: 'Host(`pay{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/entitlements`) || PathPrefix(`/products`) || PathPrefix(`/purchases`) || PathPrefix(`/subscriptions`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-billing

    cf-web-vault:
      rule: 'Host(`vault{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      service: cf-svc-custody

    # ──────────────────────────────── lantern — where the browsers report to ──
    #
    # THE ADDRESS SIXTEEN BUNDLES HAVE BEEN POSTING TO WITH NOTHING BEHIND IT.
    #
    # `src/lib/obs.ts` sends browser errors and page timings to
    # `${hosts().lantern}/ingest/client`, and `hosts().lantern` on any surface
    # served by this gateway is `https://lantern.<apex>` — the registry gives the
    # service the subdomain `lantern`. There was no router for that host and no
    # container behind it, so every post failed at DNS/connect and the page was
    # told `TypeError: Failed to fetch`, which is what it is also told for a
    # cross-origin 404. Two distinct faults, one indistinguishable symptom; that
    # is why this survived unnoticed for months.
    #
    # ── AND NOW ALSO WHERE AN OPERATOR READS WHAT THEY REPORTED ────────────────
    #
    # These lines used to route the WHOLE host to the service, "like nimbus
    # above", on the argument that "enumerating prefixes here would be a second
    # copy of that route list with its own drift". **That argument was right
    # while nothing else lived on this hostname and is wrong now.**
    # `micro-lantern-web` is the console the registry has been promising: `lantern`
    # is `inSwitcher: true`, and an operator who chose it got 404 JSON, because
    # this router matched `/` and handed it to a service that renders no HTML.
    #
    # So the API router keeps the upstream and takes the name for it —
    # `cf-api-lantern` at 600 — and `cf-web-lantern` becomes the bundle at 500.
    # The rename is not cosmetic: `scripts/surface-routes.py` reads a `cf-svc-*`
    # upstream as "this host has an API router", and a `cf-web-*` name on an API
    # would leave this file's own vocabulary disagreeing with the check that
    # reads it.
    #
    # THE PREFIXES ARE READ OFF `lantern/src/server.ts`, ROUTE BY ROUTE. Every
    # `define(...)` in that file:
    #
    #     /livez  /readyz  /metrics  POST /otlp/v1/logs
    #     POST /ingest/client  OPTIONS /ingest/client
    #     /v1/requests/:requestId  /v1/issues  /v1/events  /v1/rum
    #
    # — which is `/v1`, `/otlp`, `/ingest`, `/metrics`, `/livez`, `/readyz` and
    # nothing else. `/otlp` and `/ingest` are the two a `/v1`-only rule would have
    # dropped, and dropping them is the expensive mistake here: `/otlp/v1/logs`
    # begins with `/otlp` and NOT with `/v1`, so a prefix list copied from the
    # surface above would have sent every service's log export and every
    # browser's error report to a static file server. The bundle's nginx would
    # have answered 404 with the app shell, `obs.ts` would have reported
    # `Failed to fetch`, and the estate would have gone quietly blind — which is
    # the failure this hostname already suffered once, for months, and which the
    # block above this one was written to record.
    #
    # Checked in the other direction too. lantern-web's client routes are `/`,
    # `/events`, `/browser` and `/request` (lantern-web/src/lib/routes.ts). None
    # is a prefix of the six above and none is prefixed BY them — `/events` and
    # `/v1/events` are different addresses, which is the whole reason the API is
    # versioned — so there is no collision for a priority to resolve wrongly.
    #
    # The sink is still NOT protected by the router — it answers without a
    # credential by design, because a browser holds none. It is defended by
    # lantern's own origin allowlist (`LANTERN_RUM_ORIGINS`, set in
    # docker-compose.estate.yml) and a per-client quota. Its `/v1` read routes and
    # `/metrics` DO require a token, checked inside the service, which is what
    # makes it safe to serve an unauthenticated bundle in front of them.
    # `/internal` stays refused by policy.yml's priority-100000 rule, which
    # nothing in this file can outrank.
    cf-web-lantern:
      rule: 'Host(`lantern{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-web-headers]
      service: cf-web-lantern
    cf-api-lantern:
      rule: 'Host(`lantern{{ env "CF_WEB_SUFFIX" }}`) && (PathPrefix(`/v1`) || PathPrefix(`/otlp`) || PathPrefix(`/ingest`) || PathPrefix(`/metrics`) || PathPrefix(`/livez`) || PathPrefix(`/readyz`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      service: cf-svc-lantern

    # ── rpc — THE CHAIN, AND THE LAST INGRESS RULE THAT SKIPPED THIS FILE ─────
    #
    # `rpc.<apex>` went STRAIGHT FROM THE TUNNEL TO THE NODE. Every other hostname
    # this estate publishes arrived at `https://127.0.0.1:{gateway}`; this one alone
    # was `service: http://127.0.0.1:18545` in
    # `cloudflared/config.testnet.public.yml:128` and the same at :128 of the mainnet
    # file. One rule, out of twenty, that skipped the layer the other nineteen use.
    #
    # WHAT THE BYPASS ACTUALLY COST, rather than merely being inconsistent:
    #
    #   * NO THROTTLE WAS POSSIBLE. See the `cf-rpc-throttle` block above: the node's
    #     own per-address limiter is keyed on the socket's remote address, which is
    #     cloudflared's for every request in the world, and nothing between the two
    #     could see the real client. The limiter is now the first thing this request
    #     meets.
    #   * NO `/internal` REFUSAL, NO REQUEST ID, NO SECURITY HEADERS, NO ACCESS LOG.
    #     Those are entrypoint middlewares and a priority-100000 router in policy.yml,
    #     and all of them are attached to THIS gateway. A request that never entered
    #     it got none of them, and no line in the estate's access log recorded that it
    #     had happened at all.
    #   * IT WAS THE ONE-OFF THAT GETS FORGOTTEN. The generator carried a `RPC_PORT`
    #     constant and an `rpc=True` flag for exactly one appended rule; that constant
    #     and that flag are deleted, and the hostname is now derived from the registry
    #     like the other twenty.
    #
    # THE WHOLE HOST, NOT A PATH, AND THIS ONE IS SETTLED BY THE UPSTREAM RATHER THAN
    # BY PREFERENCE. `hearth/node/src/jsonrpc/server.js` has NO PATH DISPATCH AT ALL:
    # `httpListener()` (:227-241) hands every request to one `_serve`, whatever the
    # URL. There is no second thing on that port to keep unreachable, so a path rule
    # here would buy nothing and would cost the caller hearth's own diagnosis — a GET
    # is answered `405` with `allow: POST,OPTIONS` and a JSON-RPC error body saying
    # "JSON-RPC requires POST" (:277-279), which is a better answer than a 404 from a
    # gateway that will not say why.
    #
    # NO `cf-web-headers`: that middleware sets a bundle's frame policy and this
    # upstream answers JSON, the same reason every `cf-api-*` router omits it.
    #
    # CORS NEEDS NOTHING ADDED, and the interaction is worth writing down because two
    # policies meet here. Hearth sends `access-control-allow-origin: *` on every
    # response (`jsonrpc/server.js:271-274`) — correct for a public chain endpoint —
    # while `cf-cors@file` runs on this entrypoint and OVERWRITES that header with the
    # caller's own origin when the caller is in the estate allowlist, leaving the `*`
    # untouched when it is not. So a first-party surface gets a credentialed
    # same-origin echo and a third-party dapp keeps the open header the chain intends.
    # Neither needed a new allowlist entry: nothing is SERVED at `rpc.<apex>`, so no
    # page ever has that origin.
    #
    # THE CONDITIONAL BELOW IS ON `CF_RPC_UPSTREAM`, for the reason the whole file is
    # wrapped in one: an unset variable must produce NO ROUTER rather than one pointed
    # at an empty URL. It is a per-environment fact — which node this estate's chain is —
    # and it is set in `compose/env/traefik.env` and `compose/env/traefik.testnet.env`.
    # `scripts/surface-routes.py` check 6 fails when a variable this directory reads is
    # absent from either file, so "unset" cannot happen quietly.
{{ if env "CF_RPC_UPSTREAM" }}
    cf-api-rpc:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-rpc-throttle]
      service: cf-svc-hearth-rpc
{{ end }}

    # ── mining — THE WORK API WAS ON A PORT NOTHING PUBLISHED ─────────────────
    #
    # `rpc.<apex>` reaches `CF_RPC_UPSTREAM`, which is the ETHEREUM JSON-RPC port
    # (`hearth/node/src/params.js:366`, 8545). The pool-style work API a remote
    # miner calls is on the REST port — `params.js:306`, 8645, "HTTP REST + legacy
    # JSON-RPC + SSE" — and NOTHING published it, at any hostname or path. Two
    # ports on one node, and the ingress had only ever been told about one.
    #
    # ── ONLY TWO PATHS, AND THE OTHER FOUR ARE REFUSED ON PURPOSE ─────────────
    #
    # `Path`, twice, not `PathPrefix(`/mining`)` and emphatically not the whole
    # host: the REST port serves six things (`evmnode.js:399-424`) and a miner
    # needs exactly two of them. Publishing a port because one path on it is
    # wanted is how the other four become public without anyone deciding they
    # should be. Each refusal below is a decision:
    #
    #   /events    (`:407`) — Server-Sent Events. It holds the socket open and
    #                registers the response in `this.sseClients`, so every caller
    #                costs the node a live connection for as long as they care to
    #                keep it. Unauthenticated, that is connection exhaustion with
    #                no proof-of-work and no rate limit that helps — the limiter
    #                counts the DIAL, and one dial is all this costs. The same
    #                argument as the p2p WebSocket above, with none of the reasons
    #                that one is worth carrying.
    #   /mempool   (`:401`) — enumerates every pending transaction. A public
    #                mempool is normal for a chain and this is not the surface
    #                that should serve it: the estate already publishes chain
    #                reads through `indexer` at `explorer.<apex>`, where they are
    #                shaped, indexed and cached rather than read straight off the
    #                node a miner is depending on.
    #   /info,     (`:399`, `:400`) — real chain facts, and duplicates. Same
    #   /supply      reason: `explorer.<apex>` is where this estate answers "what
    #                is the state of the chain", and a second address for the same
    #                answer is a second thing to keep true.
    #
    # Priority 600 to outrank `cf-api-rpc`'s 500 on the same hostname, exactly as
    # `cf-api-hub` outranks `cf-web-hub`. Anything else under `/mining` — a path
    # this node does not serve — falls through to the RPC router and is answered
    # by the JSON-RPC port's own 404, which is a truthful "no route here".
    #
    # ── WHY IT RIDES `rpc.` AND DID NOT GET ITS OWN HOSTNAME ──────────────────
    #
    # A `mining.<apex>` router would fail `scripts/surface-routes.py` check 2 on
    # its first run: every host a router matches must be a subdomain the REGISTRY
    # declares, and the registry is `ui/packages/ui/src/surfaces.ts` in a
    # different repository — the one `rpc` and `p2p` were added to when they were
    # declared. That row is the right long-term shape and this router should move
    # to it. It is not done here because that repository is not this one's to
    # write, and a router on an undeclared host would take the drift check red for
    # everyone rather than wait.
    #
    # Riding `rpc.` is not merely the available option, though: the REST port IS
    # the node's own RPC surface by its own parameter name (`DEFAULT_RPC_PORT`),
    # the tunnel already publishes this hostname so no ingress changes, and a
    # miner configuring one address for a chain is the smaller ask.
    #
    # ── THE CLIENT THIS EXISTS FOR, AND A STALE DOC THAT NEARLY GOT REPEATED ──
    #
    # `hearth-mine` — a LIGHT miner that "holds no chain, syncs nothing and opens
    # no ports", written for exactly this case: "for someone who wants to mine on
    # their Mac and their PC … CloudsForge is published from a home server behind
    # a Cloudflare Tunnel — a transport that a tunnel can carry. This needs none
    # of it. It is HTTPS out" (`hearth/node/bin/hearth-mine.js:6-23`). The client
    # was designed against a tunnel; this router is the tunnel-side half it has
    # been waiting for.
    #
    # AND THE KEY-TYPE DEFECT IS NOT LIVE, THOUGH THREE DOCUMENTS SAY IT IS.
    # `hearth/docs/mining.md:50-56` says "the browser miner currently cannot mine
    # a block this node will accept" — the node wanting Ed25519 while the miner
    # signs secp256k1 — and MAP.md, SECURITY.md and listing-checklist M16 repeat
    # it. That was written about the LEGACY UTXO chain (`node/src/block.js:45`,
    # `node/src/mining.js`), and MAP.md:969 says so itself in a note nobody
    # carried forward: "Note which endpoint this is … on the **UTXO** REST".
    #
    # The EVM node this estate runs reconciled long ago: `node/src/chain/
    # miner.js:141` and `node/src/chain/header.js:250` both require a 65-byte
    # uncompressed secp256k1 key, which is what the miners sign. Measured through
    # this very router before this was written — `GET /mining/template` with no
    # `pub` answered 400 `{"err":"pub must be a 65-byte uncompressed secp256k1
    # key"}`, from `chain/miner.js:141`, on the EVM path.
    #
    # Recorded at this length because the first draft of this comment relayed the
    # stale doc as a live blocker. Four documents agreeing with each other is not
    # one of them agreeing with the running node.
{{ if env "CF_MINING_UPSTREAM" }}
    cf-api-mining:
      rule: 'Host(`rpc{{ env "CF_WEB_SUFFIX" }}`) && (Path(`/mining/template`) || Path(`/mining/submit`))'
      priority: 600
      entryPoints: [websecure, tunnel]
      middlewares: [cf-mining-throttle]
      service: cf-svc-hearth-mining
{{ end }}

    # ── p2p — PEER GOSSIP, BECAUSE A TUNNEL CANNOT CARRY A TCP SOCKET ─────────
    #
    # Hearth's peer transport is raw TCP on 8646 (`hearth/node/src/params.js:307`).
    # A Cloudflare Tunnel carries HTTP; there is no ingress rule that publishes a
    # TCP listener through one. So Hearth gains a WEBSOCKET transport — container
    # port 8648, env `HEARTH_P2P_WS`, path `/p2p` — and this is the estate's half of
    # that contract: the hostname, the router and the upstream.
    #
    # WRITTEN BEFORE THE UPSTREAM EXISTS, DELIBERATELY, AND THE COST IS STATED. The
    # section above this file's emberkin block argues that a router pointing at a
    # container that is not there answers 502 and "reads as 'the service fell over'
    # — a wrong diagnosis, permanently". That argument is accepted and overridden
    # here for one reason: this half and Hearth's half are being built in parallel,
    # and the alternative is an ingress that has to be regenerated and a gateway that
    # has to be reloaded on the day the other half lands. Until `HEARTH_P2P_WS` is
    # serving, `p2p.<apex>` answers 502 and that 502 means "the WebSocket transport
    # is not up yet". It is written here so the next reader is not left to guess.
    #
    # `PathPrefix(`/p2p`)` AND NOTHING ELSE ON THIS HOST. Unlike the RPC port above,
    # this one is a single endpoint on a path the contract names, so the router
    # publishes exactly that path and the hostname answers 404 everywhere else. The
    # prefix form rather than `Path` tolerates a trailing slash and a future
    # `/p2p/v2` without a second edit.
    #
    # ── NOTHING HERE MAY KILL A HEALTHY LONG-LIVED CONNECTION, AND NOTHING DOES ──
    #
    # This was checked rather than assumed, because it is the failure that would
    # appear as intermittent peer loss weeks later:
    #
    #   * NO TIMEOUT IS SET ON THIS ROUTER OR ITS SERVICE. Traefik has no per-router
    #     idle timeout; the only ones are the entrypoint's `respondingTimeouts`, and
    #     `compose/docker-compose.gateway.yml` sets none, so v3's defaults apply.
    #   * THE DEFAULT `readTimeout` DOES NOT REACH AN UPGRADED CONNECTION. Go's
    #     `net/http` clears every deadline on the socket when a handler hijacks it —
    #     `(*conn).hijackLocked` calls `rwc.SetDeadline(time.Time{})` — and a
    #     WebSocket proxy hijacks. So the 101 ends the reach of every server-side
    #     read deadline, which is why this needs no entrypoint override and gets
    #     none: widening `readTimeout` estate-wide to protect this one route would
    #     trade the whole gateway's slowloris bound for nothing.
    #   * THE RATE LIMIT COUNTS THE DIAL, NOT THE TRAFFIC. See `cf-p2p-dial-throttle`.
    #   * CLOUDFLARE IS THE ONE CLOCK THIS FILE CANNOT SET. Its edge closes a
    #     WebSocket that has been idle, and no gateway setting changes that; it is
    #     answered by application-level keepalive on Hearth's side, which is why that
    #     is part of the same contract as the port and the path.
{{ if env "CF_P2P_WS_UPSTREAM" }}
    cf-api-p2p:
      rule: 'Host(`p2p{{ env "CF_WEB_SUFFIX" }}`) && PathPrefix(`/p2p`)'
      priority: 500
      entryPoints: [websecure, tunnel]
      middlewares: [cf-p2p-dial-throttle]
      service: cf-svc-hearth-p2p
{{ end }}

  services:
    # The bundles. Port 8080 because the images are `nginx-unprivileged`: nothing in those
    # containers is root and a non-root process cannot bind 80. Read from each frontend's
    # Dockerfile `EXPOSE`, not chosen — the same rule public-api.yml states for its upstreams.
    cf-web-hub:
      loadBalancer:
        servers: [{ url: "http://hub-web:8080" }]
    cf-web-site:
      loadBalancer:
        servers: [{ url: "http://site:8080" }]
    cf-web-market:
      loadBalancer:
        servers: [{ url: "http://market-web:8080" }]
    cf-web-create:
      loadBalancer:
        servers: [{ url: "http://mint-web:8080" }]
    cf-web-trade:
      loadBalancer:
        servers: [{ url: "http://trade-web:8080" }]
    cf-web-worlds:
      loadBalancer:
        servers: [{ url: "http://worlds-web:8080" }]
    cf-web-explorer:
      loadBalancer:
        servers: [{ url: "http://explorer-web:8080" }]
    cf-web-network:
      loadBalancer:
        servers: [{ url: "http://network-site:8080" }]
    cf-web-developers:
      loadBalancer:
        servers: [{ url: "http://devportal-web:8080" }]
    cf-web-admin:
      loadBalancer:
        servers: [{ url: "http://admin-web:8080" }]
    cf-web-status:
      loadBalancer:
        servers: [{ url: "http://status-web:8080" }]
    cf-web-foresight:
      loadBalancer:
        servers: [{ url: "http://foresight-web:8080" }]
    cf-web-emberkin:
      loadBalancer:
        servers: [{ url: "http://emberkin-web:8080" }]
    cf-web-aetherholm:
      loadBalancer:
        servers: [{ url: "http://aetherholm-web:8080" }]
    cf-web-tessera:
      loadBalancer:
        servers: [{ url: "http://tessera-web:8080" }]
    # The two operator consoles. 8080 for the same reason as every bundle above —
    # `nginx-unprivileged` cannot bind 80 — read from each repository's Dockerfile
    # `EXPOSE`, not chosen.
    #
    # These two containers are the only frontends in docker-compose.estate.yml with
    # NO published host port, and that is deliberate: neither repository has a row
    # in micro-org's registry, so neither has a derived `4100 + index`, and
    # `scripts/web-check.py` fails on a chosen port in the derived block. The
    # container name is the only address the gateway needs and the only one either
    # bundle works at — see the block above them in the compose file.
    cf-web-lantern:
      loadBalancer:
        servers: [{ url: "http://lantern-web:8080" }]
    cf-web-beacon:
      loadBalancer:
        servers: [{ url: "http://beacon-web:8080" }]

    # The APIs, on their surfaces' own hostnames. Every one listens on 4000 inside its own
    # container, which is fine because each has one; the 41xx numbers elsewhere in this estate are
    # host ports on one developer machine and are a different fact.
    cf-svc-hub-api:
      loadBalancer:
        servers: [{ url: "http://hub-api:4000" }]
    cf-svc-admin-api:
      loadBalancer:
        servers: [{ url: "http://admin-api:4000" }]
    cf-svc-market:
      loadBalancer:
        servers: [{ url: "http://market:4000" }]
    cf-svc-mint:
      loadBalancer:
        servers: [{ url: "http://mint:4000" }]
    cf-svc-trade:
      loadBalancer:
        servers: [{ url: "http://trade:4000" }]
    cf-svc-worlds:
      loadBalancer:
        servers: [{ url: "http://worlds:4000" }]
    cf-svc-devplatform:
      loadBalancer:
        servers: [{ url: "http://devplatform:4000" }]
    # The chain index. Named for the SERVICE (`indexer`) rather than for the surface it sits
    # under (`explorer`), because they are two different things and the registry has no `indexer`
    # key at all — which is the substitution micro-network-site had to name in its own header
    # (network-site/src/lib/hosts.ts, `CHAIN_INDEX_SURFACE`). 4000 is read from
    # `indexer/src/env.ts` and the container's published `127.0.0.1:4108->4000`, not assumed.
    cf-svc-indexer:
      loadBalancer:
        servers: [{ url: "http://indexer:4000" }]
    # 4022, and it is the ONE upstream in this file that is not 4000. Read from
    # `tessera/src/env.ts:55` and from its Dockerfile's `EXPOSE 4022`, not chosen here — the same
    # rule public-api.yml states for its upstreams. Writing 4000 out of habit would produce a
    # connection refused that looks exactly like a container that has not started.
    cf-svc-tessera:
      loadBalancer:
        servers: [{ url: "http://tessera:4022" }]
    cf-svc-identity:
      loadBalancer:
        servers: [{ url: "http://identity:4000" }]

    # wallet and custody, on the two hostnames Hub calls them by. custody is the only service in
    # this estate that holds private keys; it is reachable here because the key-export ceremony is
    # driven by the user's own browser and by nothing else. Note that the gateway is deliberately
    # NOT on the `cf-micro-vault` network (docker-compose.gateway.yml:140-146) — this route works
    # because the estate runs custody on its own default network in this dev environment, which is
    # the same dev-only compromise compose/estate/initdb.sql records for the database.
    cf-svc-wallet:
      loadBalancer:
        servers: [{ url: "http://wallet:4000" }]
    cf-svc-custody:
      loadBalancer:
        servers: [{ url: "http://custody:4000" }]
    # The second half of `pay.<apex>`. See the block beside `cf-api-pay-billing` for why one
    # hostname has two backends and why splitting it by resource is the registry's own model.
    cf-svc-billing:
      loadBalancer:
        servers: [{ url: "http://billing:4000" }]
    # 4000, like every other service here: the estate sets `PORT: "4000"` through
    # `*common-env`. Lantern's own DEFAULT is 4010 — the number the registry
    # carries as its devPort, and the one a bundle resolves on a loopback origin —
    # but in this environment it binds 4000 like the rest.
    cf-svc-lantern:
      loadBalancer:
        servers: [{ url: "http://lantern:4000" }]

    # ── the backends that arrived tonight ────────────────────────────────────
    #
    # All 4000, through `*common-env`'s `PORT: "4000"`, and all three bind something
    # else by default — emberkin 4100, aetherholm 4120, faucet 4013. Those are the
    # numbers `ui/packages/ui/src/surfaces.ts` carries as devPorts, because a devPort
    # is a fact about the service and the compose file normalises the CONTAINER port
    # on top of it. Writing a devPort here would be a connection refused that looks
    # exactly like a container that has not started.
    cf-svc-emberkin:
      loadBalancer:
        servers: [{ url: "http://emberkin:4000" }]
    cf-svc-aetherholm:
      loadBalancer:
        servers: [{ url: "http://aetherholm:4000" }]
    # Behind the same condition as its router, and not because it would break —
    # an unreferenced service is harmless. Because a `cf-svc-faucet` defined in
    # an estate that runs no faucet is a standing invitation to point something
    # at it, and the next person to add a router would find the upstream already
    # written and assume somebody had checked. See the note above the router.
{{ if eq (env "CF_EMBER_NETWORK") "testnet" }}
    cf-svc-faucet:
      loadBalancer:
        servers: [{ url: "http://faucet:4000" }]
{{ end }}
    cf-svc-beacon:
      loadBalancer:
        servers: [{ url: "http://beacon:4000" }]
    # 4021, and it is the SECOND upstream in this file that is not 4000 — tessera's 4022 was the
    # first. Read from `foresight/src/env.ts:316` and its Dockerfile's `EXPOSE 4021`, not chosen
    # here, and it agrees with `public-api.yml`'s `http://foresight:4021`, which is the same fact
    # written down by the same rule. The compose file deliberately does NOT normalise this to 4000
    # the way it does emberkin's 4100 and aetherholm's 4120: 4021 sits below the derived 4100+
    # host-port block where nothing can grow into it, which is tessera's case and not theirs.
    cf-svc-foresight:
      loadBalancer:
        servers: [{ url: "http://foresight:4021" }]

    # ── the chain, which is the only upstream here that is not a container of ours ──
    #
    # Every other service in this file is a DNS name on the estate's own compose
    # network. These two are not, and cannot be: the chain is `hearth`, the frozen
    # upstream repository, run from its own compose file by
    # `scripts/ember-testnet.sh` on its own `hearth-testnet` network. The estate
    # reaches it the way `docker-compose.estate.yml:971` already does for the indexer
    # — through `host.docker.internal`, at the ports that file already publishes —
    # and the reason is ownership, stated beside that line: attaching hearth's seed
    # to this project's network would mean editing a repository that is read, run and
    # never modified.
    #
    # THE GATEWAY THEREFORE NEEDS `extra_hosts`, and it did not have it. Docker
    # Desktop resolves `host.docker.internal` for free and the Linux daemon does not,
    # which is the whole reason the indexer, foresight and the faucet each carry that
    # entry. This gateway had no upstream outside the compose network until now, so it
    # had no reason to — and the failure would have been invisible on the machine this
    # was written on and total on the box it deploys to. Added in
    # `compose/docker-compose.gateway.yml` beside the same comment.
    #
    # BOTH URLS ARE ENVIRONMENT VARIABLES rather than literals, and that is not
    # ceremony. Mainnet and testnet are two compose projects on one host reading two
    # env files, and the one thing they must never share is which chain they answer
    # for: a literal here would publish the testnet node at `rpc.cloudsforge.online`
    # the first time a mainnet chain existed, and every symptom of that would be a
    # correct-looking answer to the wrong question.
{{ if env "CF_RPC_UPSTREAM" }}
    cf-svc-hearth-rpc:
      loadBalancer:
        servers: [{ url: "{{ env "CF_RPC_UPSTREAM" }}" }]
{{ end }}
{{ if env "CF_P2P_WS_UPSTREAM" }}
    # `http://`, not `ws://`. A WebSocket begins as an HTTP request and Traefik
    # proxies the upgrade on the connection it already has, so the upstream is an
    # HTTP origin like every other one in this file. Traefik has no `ws://` scheme:
    # a URL written that way is rejected when the service is built and the router
    # that names it serves 502 while everything else in this directory keeps working
    # — loud enough to find, quiet enough to be worth naming here.
    cf-svc-hearth-p2p:
      loadBalancer:
        servers: [{ url: "{{ env "CF_P2P_WS_UPSTREAM" }}" }]
{{ end }}
{{ if env "CF_MINING_UPSTREAM" }}
    # The REST port, 8645 — a DIFFERENT upstream from cf-svc-hearth-rpc above and
    # the same node. `CF_RPC_UPSTREAM` is 8545, the Ethereum JSON-RPC port, and it
    # serves no `/mining/*` path at all: pointing this at that port would answer
    # every mining request with the JSON-RPC listener's 404 and read like an
    # ingress bug for as long as it took someone to compare two port numbers.
    cf-svc-hearth-mining:
      loadBalancer:
        servers: [{ url: "{{ env "CF_MINING_UPSTREAM" }}" }]
{{ end }}
{{ else }}
# CF_WEB_APEX is unset, so this file contributes NOTHING rather than a full set of routers whose rules
# read `Host(``)` and match no request ever sent. That distinction is the whole of the comment at
# the top of compose/env/traefik.env, and it cost this estate a dead public API once already.
{}
{{ end }}
