# The certificate the gateway actually serves.
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────────
#
# Without it Traefik terminates every one of this estate's twenty-one hostnames
# with its BUILT-IN SELF-SIGNED DEFAULT — `CN=TRAEFIK DEFAULT CERT`, issued by
# itself, trusted by nothing. That is not a cosmetic warning. It is why the estate
# was unusable in a real browser while reporting 183 green assertions and sixteen
# green browser journeys, and the reason is worth stating exactly once:
#
#   **every verification path in this repository had certificate checking turned
#   off.** `estate-verify.sh` used `curl -k`. `estate-browser.sh` passed
#   `ignoreHTTPSErrors: true`. `docker-compose.estate-gateway.yml` wrote the
#   trade-off down and called it correct. So the transport was the one layer of
#   this estate that had never been exercised the way a person exercises it, and
#   it was broken.
#
# A person's browser fails differently from `curl -k`, and worse. Navigating to
# `hub.<apex>` shows an interstitial that can be clicked through — so the PAGE
# loads and the estate looks fine. The sign-in form then POSTs cross-origin to
# `nimbus.<apex>`, a hostname no interstitial has ever been offered for, **and no
# browser offers one for an XHR**. Chrome refuses it with
# `net::ERR_CERT_AUTHORITY_INVALID`, `fetch` rejects with `TypeError: Failed to
# fetch`, and every frontend maps that to "Cannot reach the server. Check your
# connection and try again." A certificate fault wearing a network fault's words.
#
# ── WHAT IS SERVED, AND HOW IT GETS HERE ───────────────────────────────────────
#
# `scripts/gateway-cert.sh` mints a local CA and one leaf covering `<apex>` and
# `*.<apex>`, into `gateway/certs/`, which `.gitignore` refuses — the CA's private
# key is a real key and must never reach the fork network. `estate-up.sh` runs it
# before the gateway starts, so the files below exist by the time Traefik reads
# this. The owner trusts the CA once, with the command that script prints, and
# every host under the apex is clean in one step, including ones added later.
#
# `defaultCertificate` rather than a `certificates:` list with SNI entries: one
# wildcard leaf answers for every hostname this gateway serves, and enumerating
# them here would be the sixteenth copy of the registry — the drift this estate
# has paid for four times.
#
# ── IF THE FILES ARE ABSENT ────────────────────────────────────────────────────
#
# Traefik logs `unable to add a certificate to the store` and falls back to its
# self-signed default, i.e. exactly the previous behaviour. It does NOT invalidate
# the directory the way a template or YAML error does — that all-or-nothing
# failure is a PARSE failure, and this file parses whether or not the paths
# resolve. So a stack brought up without running the certificate script degrades
# to where it was rather than losing `policy.yml`'s `/internal` refusal with it.
# `estate-verify.sh` asserts the good case with `--cacert` and no `-k`, which is
# an assertion that can fail.
#
# That degradation is SILENT, so it is also asserted: `gateway-reload.sh
# --validate` renders this directory in a throwaway Traefik at the same version
# and fails on any ERR, and a `certFile` naming a file that is not in the mounted
# certificate directory produces exactly that ERR. Measured on this estate, not
# assumed — see the note in that script.
#
# ── AND WHICH PAIR IS SERVED IS PER-ENVIRONMENT, WHICH IT WAS NOT ──────────────
#
# Both gateways mount THIS DIRECTORY. `docker-compose.gateway.yml` binds
# `../gateway/dynamic` by a hardcoded relative path — the certificate directory
# beside it takes `CF_CERT_DIR` and this one takes nothing — so mainnet
# (`cfmicro`, :443) and testnet (`cf-testnet-gw`, :10443) read the same bytes.
# One `defaultCertificate` here is therefore one certificate for both estates,
# and the two now need different ones:
#
#   mainnet  `origin.crt` — a CLOUDFLARE ORIGIN CA leaf, `*.cloudsforge.online`
#            plus the bare apex. Cloudflare Tunnel carries public roots and its
#            own Origin CA and nothing else, so it refused the estate leaf and
#            answered 502 on every mainnet hostname. Measured on the box: a
#            client with only public roots got `000, connection refused` against
#            :443 while the same request with `--cacert gateway/certs/ca.crt`
#            got 200.
#
#   testnet  `estate.crt`, unchanged. The origin certificate does NOT cover
#            `*.testnet.cloudsforge.online` — Cloudflare's Universal SSL is one
#            label deep — so pointing testnet at it would trade a 502 for a
#            certificate whose SAN does not match the host, which is worse: the
#            estate CA at least verifies for every internal consumer.
#
# ── WHY A VARIABLE AND NOT AN SNI ENTRY, WHICH LOOKS CLEANER AND IS WRONG ──────
#
# The obvious alternative keeps one shared file and adds `origin.crt` to a
# `certificates:` list, letting SNI pick it for the names it covers and falling
# back to `estate.crt` for everything else. It enumerates nothing, so it does not
# reopen this file's argument against a hostname list, and it would need no
# per-environment anything.
#
# IT BREAKS TESTNET, and by one label. A wildcard matches one label, so
# `*.cloudsforge.online` matches `testnet.cloudsforge.online` — the testnet
# estate's own BARE APEX, which `estate-web.yml` routes to the marketing site.
# The testnet gateway, reading this same file, would have served a Cloudflare
# leaf on its front door and the estate leaf on every other testnet host: a split
# that no internal verifier is arranged to expect and that no reader would
# predict from this file. `hub.testnet.…` is two labels deep and would have been
# unaffected, which is precisely what makes it the kind of fault that is found
# late.
#
# So the environment says which pair it serves, in the env file it already has
# one of. `CF_TLS_DEFAULT_CERT` is the BASENAME of a pair in the mounted
# certificate directory, set in `compose/env/traefik.env` (mainnet: `origin`) and
# `compose/env/traefik.testnet.env` (testnet: `estate`). UNSET MEANS `estate`,
# because a fresh clone has run `gateway-cert.sh` and has no origin certificate
# at all, and the fallback for a name that does not resolve is the
# `CN=TRAEFIK DEFAULT CERT` this whole file exists to have ended.
#
# ── WHAT THIS DOES NOT FIX ON ITS OWN, MEASURED AFTER THE SWITCH ───────────────
#
# The tunnel still answers 502, AND THE REASON HAS CHANGED, which is the whole
# value of the change and is why both errors are written down here. `cloudflared`
# validates the origin certificate against THE HOSTNAME IN ITS SERVICE URL, not
# against the hostname of the request it is carrying, and the owner's tunnel is
# remotely managed — the running unit is `cloudflared … tunnel run --token-file`,
# so `cloudflared/config.*.yml` in this repository, `noTLSVerify: true` and all,
# is NOT what it reads. Every ingress rule points at `https://127.0.0.1:443`:
#
#   before   x509: certificate signed by unknown authority
#   after    x509: cannot validate certificate for 127.0.0.1 because it doesn't
#            contain any IP SANs
#
# The ISSUER objection is gone and cannot come back. What is left is a NAME, and
# Cloudflare Origin CA signs names in the zone and will never sign `127.0.0.1`.
# Nor can an SNI entry rescue it: a Go client dialling an IP literal sends no
# SNI, so the origin serves `defaultCertificate` whatever a `certificates:` list
# might say — a second, independent reason the per-environment variable above is
# the right mechanism.
#
# So the last step is one field in the Cloudflare dashboard and it is the owner's:
# per public hostname, Additional application settings → TLS → ORIGIN SERVER NAME
# = `cloudsforge.online`. Measured against the running gateway rather than
# predicted — an OpenSSL client trusting ONLY Cloudflare's Origin CA root, with
# that server name and hostname verification on, returns `Verify return code: 0
# (ok)`; the same client validating against the literal `127.0.0.1` returns
# `64 (IP address mismatch)`.
#
# `No TLS Verify`, in the same panel, would also clear it and is the wrong one:
# it is the trade this estate made 183 times with `curl -k`, on the one leg that
# faces the public internet.
#
# TESTNET IS UNCHANGED AND STILL FAILS ON THE ISSUER, which is correct — it has
# no Cloudflare-issued certificate to serve, because Universal SSL does not cover
# `*.testnet.cloudsforge.online`.
# ── AND `CF_TLS_DEFAULT_CERT` IS GONE, BECAUSE THERE IS ONE ISSUER AGAIN ──────
#
# Everything above this line is the record of a problem this deployment no longer
# has. It is kept because the reasoning is what stops it being re-introduced.
#
# The mainnet gateway terminated on a Cloudflare Origin CA leaf to stop the tunnel
# answering 502. That is not how the 502 was fixed. cloudflared validates a
# certificate against THE HOSTNAME IN ITS SERVICE URL, and that URL is the IP
# literal `127.0.0.1`; no Origin CA will ever sign an IP literal, so the Origin
# leaf only moved the error from `unknown authority` to `doesn't contain any IP
# SANs`. What fixed it was giving cloudflared an `http://` service URL — the
# `tunnel` entrypoint in compose/docker-compose.gateway.yml — so that hop performs
# no handshake and needs no certificate at all.
#
# With that hop plaintext, NOTHING IN THIS DEPLOYMENT SERVES A CLOUDFLARE-ISSUED
# LEAF, and the variable that chose between two issuers has one possible value. A
# lever with one position is not a lever, so it is a constant here, and
# `CF_TLS_DEFAULT_CERT` is removed from both `compose/env/traefik*.env`. The two
# had to move together: `scripts/surface-routes.py` check 6 fails when this
# directory reads a variable an env file does not set, and an env file setting a
# variable nothing reads is the dead lever this change exists to remove.
#
# Deleted with it: `gateway/certs/origin.crt` and `origin.key` — that private key
# passed through a chat transcript, so the fewest copies is the right number — and
# `gateway/trust/cloudflare-origin-rsa-root.pem`, which was the last authority in
# `trust.crt` this estate does not issue for itself.
#
# ── TLS IS NOT REMOVED, AND THIS IS THE BLOCK THAT KEEPS IT ──────────────────
#
# 443 still terminates, on the estate leaf, in BOTH environments. The tunnel does
# not use it — `tunnel` is plaintext and is what cloudflared reaches — but six
# consumers inside this host do, and none of them go through Cloudflare:
# `estate-verify.sh` (`--cacert`, no `-k`), the three seeders and
# `foresight-market-journey.mjs` (`NODE_EXTRA_CA_CERTS`), beacon in its container,
# and both miners over `rpc.<apex>`. Beacon is the one that decides it: it probes
# every surface at `https://<sub>.<apex>` and takes no configuration for a scheme
# or a port, so plaintext here would publish a full outage that is not happening.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/estate.crt
        keyFile: /etc/traefik/certs/estate.key
