# The public API route map — DERIVED from micro-sdk's verified route table, and CHECKED against
# it. Hand-edited, deliberately: the routers below group resources and carry middleware that no
# generator chose, so what is mechanical here is the AGREEMENT, not the text.
#
# The two lines this header used to carry said "GENERATED. Do not hand-edit." and named a command
# that writes `openapi.json` and has never written this file. That is the estate's own recurring
# defect — a document describing something other than reality — sitting in the header of the file
# whose whole purpose is to not be that.
#
# Check (in micro-sdk):  node --import tsx tools/public-api.ts --gateway <this repo's checkout>
#
# It fails if any resource in the table is unrouted here, and it fails if this file is absent —
# never skips. micro-sdk's `gateway` CI job runs it against a fresh checkout of this repository on
# every push, then deletes a router and requires the check to go red.
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────────
#
# It did not, and that was a P11 blocker nobody could see. `policy.yml` carries
# CORS, security headers and the /internal refusal — every rule about how a
# request is treated — and nothing that says where a public request GOES. There
# was no public API. `micro-sdk` was written against the services' own paths and
# exposed a `pathPrefix` seam rather than invent a layout, which was the right
# call and is why this file could be derived rather than designed.
#
# ── THE ONE DECISION ───────────────────────────────────────────────────────────
#
# The public surface is `api.<apex>/v1/<resource>`, uniformly.
#
# Four services already serve `/v1/…` (wallet, market, mint, worlds) and four do
# not (pricing, foresight, activity, identity). 11 §288 specifies the public API
# as URL-versioned, so half of it would have shipped unversioned. Changing the
# four would mean editing four shipped, CI-green services and breaking every
# internal caller; so the gateway presents one versioned surface and strips the
# prefix for the services that do not use it. The split stops at this file.
#
# Resources, not services. `api/v1/rates` rather than `api/v1/pricing/rates`:
# which service owns a resource is an implementation detail, and publishing it
# turns an internal refactor into a breaking public change. This is safe to do
# because the 65 verified public routes have NO method+path collision across
# services — checked, not assumed, and re-checked by `--check`.
#
# ── WHAT IS DELIBERATELY ABSENT ────────────────────────────────────────────────
#
# `ledger`. Every one of its routes refuses a non-service principal
# (ledger/src/server.ts), so it has no public surface. That is correct — the
# financial source of truth is reached through wallet and billing — and it is
# recorded here so nobody reads the gap as an oversight.
#
# Anything under `/internal`, which policy.yml refuses at a priority nothing can
# outrank. This file adds no route that could shadow it: every router here is
# scoped to the api host AND a `/v1/` prefix.

http:
  middlewares:
    # The four services that do not serve /v1 themselves. The gateway owns the
    # version in the public path; the service never sees it.
    cf-api-strip-version:
      stripPrefix:
        prefixes:
          - "/v1"

    # Applied to every public route below. The API host is not a browser origin
    # for a first-party app — it is called by third-party servers and by the
    # SDK — so it gets the security headers without the app CORS allowlist.
    cf-api-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "no-referrer"
        customResponseHeaders:
          # A public API answer is never a browser cache entry: an authenticated
          # response cached by an intermediary is that response served to the
          # next caller.
          Cache-Control: "no-store"

  routers:
    # ---------------------------------------------------------------- pricing
    # Unversioned upstream: GET /rates, /rates/:asset (pricing/src/server.ts,321)
    cf-api-pricing:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && PathPrefix(`/v1/rates`)'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers, cf-api-strip-version]
      service: cf-api-pricing

    # --------------------------------------------------------------- activity
    # Unversioned upstream: GET /feed, /feed/:id (activity/src/server.ts,351)
    cf-api-activity:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && PathPrefix(`/v1/feed`)'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers, cf-api-strip-version]
      service: cf-api-activity

    # -------------------------------------------------------------- foresight
    # Unversioned upstream: /categories, /markets, /stake-assets (foresight/src/server.ts)
    #
    # `/v1/stake-assets` added 2026-08-10 for micro-org#300. Measured that day against
    # this estate's gateway, with a Host header straight at the origin so no Cloudflare
    # hop is in the answer: `/v1/markets` 200, `/v1/stake-assets` 404, `/stake-assets`
    # 404 — and the same 404 pair on `foresight.<apex>`. The service answers 200 to an
    # unauthenticated in-estate GET, so the endpoint was public by design and reachable
    # by nobody outside.
    #
    # It rides the router that already exists rather than getting its own, because the
    # decision that would otherwise be needed is already made here: foresight serves no
    # `/v1` of its own, and `cf-api-strip-version` is on this router for exactly that
    # reason. The `foresight.<apex>` content-negotiated split (`estate-web.yml`) is left
    # alone deliberately — a second Accept-gated path there is the delicate option, and
    # `api.<apex>` is where the estate's public read endpoints live.
    #
    # WHY IT MATTERS MORE THAN A MISSING READ ENDPOINT USUALLY WOULD: this is the only
    # place the estate publishes `custodialStakingAvailable`, the capability flag behind
    # the `503 custodial_staking_unconfigured` of micro-org#34. The flag that explains
    # the refusal was unreachable by the caller receiving it. And micro-org#291 had to
    # be fixed by `micro-site` checking out `micro-foresight` at build time, because
    # asking the service at runtime was not possible — fine for the site, useless for a
    # wallet or a third-party integration, which cannot check out another repository.
    cf-api-foresight:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && (PathPrefix(`/v1/markets`) || PathPrefix(`/v1/categories`) || PathPrefix(`/v1/stake-assets`))'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers, cf-api-strip-version]
      service: cf-api-foresight

    # --------------------------------------------------------------- identity
    # Unversioned upstream: GET /auth/me (identity/src/server.ts).
    # NOTE: identity refuses a SERVICE token on /auth/me (identity/src/server.ts),
    # so a devplatform API key has no whoami through this route. Recorded in
    # 18 §3.3d; micro-devplatform owns the answer.
    cf-api-identity:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && PathPrefix(`/v1/auth`)'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers, cf-api-strip-version]
      service: cf-api-identity

    # ----------------------------------------------------------------- wallet
    # Serves /v1 natively — forwarded unchanged, no strip.
    cf-api-wallet:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && (PathPrefix(`/v1/wallets`) || PathPrefix(`/v1/deposits`) || PathPrefix(`/v1/withdrawals`) || PathPrefix(`/v1/spend`) || PathPrefix(`/v1/transfers`) || PathPrefix(`/v1/conversions`) || PathPrefix(`/v1/portfolio`))'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers]
      service: cf-api-wallet

    # ----------------------------------------------------------------- market
    cf-api-market:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && (PathPrefix(`/v1/listings`) || PathPrefix(`/v1/orders`) || PathPrefix(`/v1/offers`) || PathPrefix(`/v1/collections`) || PathPrefix(`/v1/verifications`))'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers]
      service: cf-api-market

    # ------------------------------------------------------------------- mint
    cf-api-mint:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && (PathPrefix(`/v1/catalogue`) || PathPrefix(`/v1/tokens`))'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers]
      service: cf-api-mint

    # ----------------------------------------------------------------- worlds
    # `/v1/seasons` was missing here, and it is the route a TITLE is paid through.
    # `worlds/src/server.ts` serves `POST /v1/seasons/:id/rewards`, which accepts a service
    # principal holding `worlds:title` — that is a title crediting a player at the end of a season.
    # Without a router it fell through to the catch-all, so **no title could be paid a season
    # reward through the public host**. `GET /v1/seasons/:id/budget` was unreachable the
    # same way, which is the read a title uses to know whether a grant will fit the budget.
    #
    # It was invisible to the drift check on purpose-built grounds: `sdk/tools/public-api.ts`
    # verifies that every resource in the SDK's table has a router here, and `/v1/seasons` was in
    # NEITHER document. Two artefacts agreeing with each other is not the same as either agreeing
    # with the services, and nothing in this estate yet compares this file against what the
    # services actually serve. Recorded as the real gap; this line only closes today's instance.
    cf-api-worlds:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && (PathPrefix(`/v1/titles`) || PathPrefix(`/v1/players`) || PathPrefix(`/v1/provisions`) || PathPrefix(`/v1/seasons`))'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers]
      service: cf-api-worlds

    # -------------------------------------------------- nda (Ninety Days After)
    # THE ROUTER THAT MAKES THE GAME REACHABLE AT ALL.
    #
    # `nda` serves the whole of *Ninety Days After* — worlds, the map, homesteads, the queued
    # actions, the day-resolution engine, reports, communes, objectives — and until this row it
    # had no hostname, no DNS record and no router. It was a healthy container nobody could
    # reach, which is what the title's `draft` status in `micro-worlds` has been recording.
    #
    # `/v1/worlds` is nda's ENTIRE public surface: every route it registers is that prefix or
    # below (`nda/src/server.ts`). Nothing else on this host claims it — `micro-worlds` owns
    # `/v1/titles`, `/v1/players`, `/v1/provisions` and `/v1/seasons`, and the two services are
    # neighbours in name only. The one other `/v1/worlds` in the estate is `admin-api`'s operator
    # proxy, and that is on the ADMIN host behind Access, not here.
    #
    # `POST /v1/events` is NOT routed, deliberately. It is nda's outbox inbox, HMAC-checked over
    # the raw bytes with `OUTBOX_SIGNING_SECRET`; publishing it would put the estate's event
    # ingress on the internet for no caller that lives there. Every producer reaches it on the
    # internal network by service name.
    cf-api-nda:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && PathPrefix(`/v1/worlds`)'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers]
      service: cf-api-nda

    cf-api-devplatform:
      rule: 'Host(`{{ env "CF_API_HOST" }}`) && (PathPrefix(`/v1/apps`) || PathPrefix(`/v1/keys`) || PathPrefix(`/v1/oauth-clients`) || PathPrefix(`/v1/organisations`) || PathPrefix(`/v1/projects`) || PathPrefix(`/v1/scopes`) || PathPrefix(`/v1/webhook-endpoints`))'
      priority: 1000
      entryPoints: [websecure, tunnel]
      middlewares: [cf-api-headers]
      service: cf-api-devplatform

    # ── THERE IS DELIBERATELY NO CATCH-ALL ON THE API HOST ───────────────────
    #
    # Anything else on the API host is a 404 from the gateway rather than a
    # request that reaches a service by accident. That sentence stood here for
    # months above a router that delivered 502, which is the one thing it was
    # written to prevent.
    #
    # REMOVED: cf-api-catchall — bare Host(CF_API_HOST) at priority 1; its 502 was a lie
    # REMOVED: cf-api-unrouted — the http://127.0.0.1:1 blackhole that catch-all pointed at
    #
    # `cf-api-catchall` matched bare `Host(CF_API_HOST)` at `priority: 1` and
    # pointed at `cf-api-unrouted`, `servers: [{ url: "http://127.0.0.1:1" }]` —
    # a blackhole Traefik cannot connect to, so it answered 502. Both are gone.
    #
    # WHY DELETING THE ROUTER IS THE FIX AND A "404 SERVICE" IS NOT. Traefik has
    # no static-response middleware, so there is nothing to swap the blackhole
    # for; every URL in a loadBalancer is a real upstream someone must run. But
    # Traefik's own default, when NO router matches, is already the answer —
    # `404 page not found`, from the entrypoint, with no upstream involved.
    # Measured on the mainnet tunnel entrypoint rather than assumed:
    #
    #   Host: api.cloudsforge.online              /          -> 502  Bad Gateway
    #   Host: api.cloudsforge.online              /livez     -> 502  Bad Gateway
    #   Host: api.cloudsforge.online              /v1/rates  -> 200
    #   Host: no-such-host-xyz.cloudsforge.online /          -> 404  page not found
    #
    # The third line is what makes this safe: every real route is a
    # `PathPrefix(/v1/…)` at `priority: 1000` and matches on its own. The
    # catch-all was load-bearing for nothing.
    #
    # AND THE 502 WAS NOT COSMETIC. `/livez` is the path a monitor probes, and
    # on this host it answered 502 on BOTH networks — api and api-testnet alike,
    # so this was never a leftover from folding `worlds-api` into the API host.
    # A 502 there says "the API is up and its backend has fallen over"; the API
    # was fine and every route worked. `scripts/estate-verify.sh` argues
    # this at length under "WHY A ROUTE THAT 502s IS THE WORST OF THE THREE
    # ANSWERS", and this router was the estate's own counter-example.
    #
    # NOT TO BE CONFUSED WITH `cf-refuse` IN policy.yml, which is the same
    # blackhole and STAYS one. That router hides `/internal`, where the path
    # does exist and a 404 would be a lie told to a prober. Here nothing exists,
    # so 404 is simply true. Same mechanism, opposite intent — which is why the
    # fix was not "reuse cf-refuse".
    #
    # Losing `cf-api-headers` on the miss costs nothing: the tunnel entrypoint
    # applies `cf-request-id`, `cf-security-headers` and `cf-cors` to every
    # request before routing (`compose/docker-compose.gateway.yml`), so a
    # 404 here is still CORS-clean for a browser.
    #
    # ── AND `/livez` AND `/readyz` ARE DELIBERATELY NOT SERVED HERE ──────────
    #
    # They now 404 with everything else unmatched, and that was a decision, not
    # a side effect. Rule 4 of `org/README.md` does require all three of
    # `/livez`, `/readyz` and `/metrics` — but it is enforced by
    # `org/.github/workflows/service-ci.yml`, which greps a SERVICE REPO's
    # `source-dir`. It is a rule about services. `api.<apex>` is not a service:
    # it is a gateway-composed SURFACE multiplexing the nine independent
    # services named above, each of which already satisfies rule 4 in its own
    # repo and is probed there. Nothing is exempted and no gap is opened.
    #
    # There is no honest answer for this host to give. A `/livez` here would
    # have to name ONE of the nine as the answerer, and it would then be wrong
    # in both directions: green while eight of the nine are down, red while the
    # one chosen is down and the API is fine. That is the same misdiagnosis as
    # the 502 this router just stopped producing, rebuilt with a different
    # mechanism — a health endpoint that does not measure the thing its
    # hostname names.
    #
    # `nimbus`, `pay` and `vault` answering 200 on `/livez` is not a precedent
    # against this; it is the reason for it. Each is a WHOLE-HOST route to a
    # single service (`estate-web.yml` nimbus -> cf-svc-identity
    # pay -> cf-svc-billing vault -> cf-svc-custody), so their `/livez`
    # is that one service's own and means exactly what it says. `api` has no
    # such single service to speak for it.
    #
    # And `/readyz` enumerates Postgres, JWKS and every declared upstream. On an
    # unauthenticated public host that is a dependency map handed to whoever
    # asks. The nine are reachable on their loopback ports, which is where
    # `estate-verify.sh` already reads them and where that detail belongs.

  services:
    # The upstream port is each image's own EXPOSE, read from its Dockerfile — not a number
    # chosen here. Every service but foresight listens on 4000 INSIDE its container, which is
    # fine because each has its own; the distinct ports elsewhere in this estate are dev ports on
    # one developer machine and are a different fact. Getting this wrong twice in one day (a
    # registry devPort of 4011 that was beacon's, then 3014 for a service that binds 4100) is why
    # it is derived rather than typed.
    cf-api-pricing:
      loadBalancer:
        # M5a: pricing is a module of agora now. Re-pointed at the absorber, as
        # analytics/notify/aetherholm/nda were; the `pricing` ExternalName still
        # resolves here too, this just names the real upstream.
        servers: [{ url: "http://agora:4000" }]
    cf-api-activity:
      loadBalancer:
        servers: [{ url: "http://agora:4000" }]
    cf-api-foresight:
      loadBalancer:
        servers: [{ url: "http://agora:4000" }]
    cf-api-identity:
      loadBalancer:
        servers: [{ url: "http://identity:4000" }]
    cf-api-wallet:
      loadBalancer:
        servers: [{ url: "http://wallet:4000" }]
    cf-api-market:
      loadBalancer:
        servers: [{ url: "http://agora:4000" }]
    cf-api-mint:
      loadBalancer:
        servers: [{ url: "http://agora:4000" }]
    cf-api-worlds:
      loadBalancer:
        servers: [{ url: "http://agora:4000" }]
    cf-api-nda:
      loadBalancer:
        servers: [{ url: "http://emberkin:4000" }]
    cf-api-devplatform:
      loadBalancer:
        # M5a: devplatform is a module of agora now. Re-pointed at the absorber.
        servers: [{ url: "http://agora:4000" }]

    # `cf-api-unrouted` was here — the `http://127.0.0.1:1` blackhole the
    # deleted catch-all pointed at. See the note where that router used to be:
    # its 502 was the misdiagnosis this file's own comment promised to avoid,
    # and Traefik's default 404 replaces it with no upstream at all.
