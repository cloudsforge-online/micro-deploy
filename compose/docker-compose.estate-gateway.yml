# The gateway, wired to the estate — the overlay that makes a BROWSER work.
#
#   docker compose -p cfmicro -f compose/docker-compose.telemetry.yml up -d
#   docker compose -p cloudsforge-estate \
#     -f compose/docker-compose.gateway.yml \
#     -f compose/docker-compose.estate-gateway.yml up -d gateway
#
# `scripts/estate-up.sh` does exactly that; this header exists so the ordering is written down
# somewhere that is not a script.
#
# TWO INVOCATIONS AND TWO PROJECTS, and both halves of that are load-bearing. Two invocations
# because the two stacks are different things with different lifetimes — the telemetry plane's
# volumes hold 15 days of metrics, the gateway is recreated whenever a route changes. It used to
# be for a second reason that no longer applies: the telemetry file CREATED the three `cf-micro-*`
# networks this one declares `external`, so merging the files in one command turned the creator
# into an attacher. Since 2026-08-10 `scripts/ensure-networks.sh` makes them and every file
# attaches, because the host showed those networks had never carried a compose label anyway.
# Two projects because this gateway serves the
# estate: it lived in the telemetry plane's project until 2026-08-10, so
# `docker compose -p cloudsforge-estate ps` did not list the one container every public hostname
# depends on. The testnet twin of that was deleted as an apparent orphan twice in three days
# (micro-org#257).
#
# ── WHY IT IS A SEPARATE FILE ──────────────────────────────────────────────────
#
# `docker-compose.gateway.yml` must keep working on its own. It joins `cf-micro-edge`,
# `cf-micro-app` and nothing else, and it can be brought up beside the telemetry plane with no
# estate running at all — which is how its own configuration is checked (`make config`). The two
# additions below both create a HARD DEPENDENCY on a running estate, so they live here rather
# than in the file that must not have one.
#
# ── ADDITION 1: THE GATEWAY COULD NOT REACH A SINGLE SERVICE ───────────────────
#
# `docker-compose.estate.yml` declares NO `networks:` section, so all 37 of its containers sit on
# the project default network, `cloudsforge-estate_default`. The gateway sits on `cf-micro-edge`
# and `cf-micro-app`. **They have never shared a network.**
#
# Every upstream in `gateway/dynamic/public-api.yml` is a DNS name — `http://identity:4000`,
# `http://wallet:4000` — resolved from inside the gateway container. From `cf-micro-edge` none of
# those names resolves, so the entire public API route map, the one that had never once loaded
# because of an unset `CF_API_HOST`, would have answered 502 on every route even after that fix.
# Nothing had noticed because nothing had ever run the gateway and the estate at the same time.
#
# Joining the estate's network is the smallest change that makes those names resolve, and it is
# the reason `estate-web.yml` can address the fifteen bundles the same way.
#
# ── ADDITION 2: 443, BECAUSE A BUNDLE DERIVES ITS SIBLINGS WITHOUT A PORT ──────
#
# `cloudsforgeHosts()` builds every sibling host as `https://<sub>.<apex>` — scheme and host, and
# **no port** (ui/packages/ui/src/surfaces.ts, the non-local branch). So a page served on
# `https://hub.<apex>:9096` asks for `https://nimbus.<apex>` on 443 and gets connection-refused,
# and the symptom is a sign-in that silently does nothing.
#
# The base file publishes 9095/9096/9097 on loopback deliberately — "public exposure is the
# tunnel's job". That stays true; this adds 443 ON LOOPBACK ONLY, beside them, because a browser
# is the one client that cannot be told to use a different port. 80 is not added: the redirect to
# websecure is what an http request needs, and it is already reachable on 9095.
#
# TLS is Traefik's self-signed default here, which is correct for loopback and wrong to ship. A
# browser will warn; `playwright-core` takes `ignoreHTTPSErrors`, and `curl` takes `-k`, which is
# what `scripts/estate-verify.sh` uses.

services:
  gateway:
    ports:
      # Merged with the base file's three, not replacing them. Compose appends `ports` across
      # files, so 9095/9096/9097 are still bound and every existing recipe still works.
      - "127.0.0.1:${CF_GATEWAY_PORT:-443}:443"
    networks:
      - estate

networks:
  edge:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-edge
  app:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-app
  vault:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-vault
  # `external` means compose attaches and never creates: the estate owns this network and this
  # file must not be able to bring a second one into existence under the same intent. If the
  # estate is not up, `docker compose up` fails HERE with a named missing network rather than
  # starting a gateway that resolves nothing.
  estate:
    external: true
    name: ${CF_PROJECT:-cloudsforge-estate}_default
