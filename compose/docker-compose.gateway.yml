# The gateway — AD-17.
#
# Traefik with LABEL-BASED DISCOVERY, which is the whole point. The estate today
# carries eighteen `container_name:` entries and a fixed host port for every
# service; that is what makes `deploy.replicas` illegal, because two replicas
# cannot both be `cloudsforge-pay` and cannot both bind 4003. Discovery by label
# deletes both, and horizontal scaling stops being a rewrite.
#
# It owns four things that are currently owned by four different places:
#
#   TLS         — today: cloudflared. Moves here so a certificate is a gateway
#                 concern rather than a tunnel configuration nobody reads.
#   CORS        — today: an env-var allowlist copied into eight services, which
#                 has already drifted once (:4004 in nimbus's list and missing
#                 from everyone else's, so ForgeMint's SPA could sign in and
#                 could not call Pay). One middleware, one list.
#   /internal   — cloudflared/config.*.yml, FIRST ingress rule (generated)
#                 config.example.yml, asserted by a CI invariant that parses
#                 that YAML. The MECHANISM moves, so the INVARIANT moves with
#                 it: see the CI check at the bottom of this file.
#   SPA serving — today: static bundles inside API processes plus a
#                 hand-maintained API_PREFIXES array.
#
#   docker compose -f compose/docker-compose.telemetry.yml \
#                  -f compose/docker-compose.gateway.yml up -d
#
# The telemetry file must be up first: it creates the three networks this one
# attaches to as external.

x-obs: &obs
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  gateway:
    <<: *obs
    image: traefik:v3.2.3
    # No container_name, deliberately, and it is the first place to prove the
    # point: this service is discovered by label like everything behind it.
    environment:
      # ── ONE VALUE, TWO CONSUMERS, AND THAT IS THE POINT ──────────────────────
      #
      # The flag in `command:` is COMPOSE interpolation; `gateway/dynamic/tls.yml`
      # is a Go template the file provider renders against the CONTAINER's
      # environment. Two different layers, and if they disagreed the gateway would
      # advertise TLS and serve no certificate — `CN=TRAEFIK DEFAULT CERT`, the
      # exact state `tls.yml` was written to end.
      #
      # Passing the value through here makes that impossible: both read
      # `CF_GATEWAY_TLS` from the same place, defaulted identically. It is
      # deliberately NOT a second line in `env/traefik*.env` beside the other
      # gateway variables, because that file cannot feed `${...}` in `command:`
      # and a value written twice is a value that drifts.
      CF_GATEWAY_TLS: ${CF_GATEWAY_TLS:-true}
    env_file:
      # PARAMETERISED so a second compose project on this host can serve a
      # different apex. `traefik.env` pins CF_WEB_APEX and CF_API_HOST, and both
      # are per-environment facts — the testnet project sets
      # CF_TRAEFIK_ENV=traefik.testnet and gets env/traefik.testnet.env.
      # Unset is mainnet, byte-for-byte what it always was.
      - env/${CF_TRAEFIK_ENV:-traefik}.env
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      # Access logs as JSON so the collector parses them without a regex, and
      # so `cf.request_id` survives into Loki as a field rather than as a
      # substring somebody greps.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.names.X-Request-Id=keep
      - --accesslog.fields.headers.names.Traceparent=keep
      # Never log a credential. The gateway sees every Authorization header in
      # the estate; it is the single highest-value line in any log file here.
      - --accesslog.fields.headers.names.Authorization=drop
      - --accesslog.fields.headers.names.Cookie=drop

      # --- discovery ---------------------------------------------------------
      #
      # ⚠ THE DOCKER PROVIDER IS GONE, AND NOTHING LOST A ROUTE.
      #
      #   It never worked here. Traefik v3.2.3 pins its Docker API version to
      #   1.24 in code and Docker Desktop's daemon refuses anything below 1.40,
      #   so every ~4 seconds, for the life of the container, it logged:
      #
      #     ERR Failed to retrieve information of the docker client and server
      #         host  error="client version 1.24 is too old..."  providerName=docker
      #     ERR Provider error, retrying in 4.17s
      #
      #   Neither `DOCKER_API_VERSION` nor v3.3.7 changed it; both were tried and
      #   the error was byte-identical. It was recorded rather than fixed on the
      #   grounds that it had no live symptom.
      #
      #   IT HAD TWO. A provider retrying forever floods the log a real provider
      #   failure would have to be noticed in — the file provider's errors land
      #   in the same stream. And it required `/var/run/docker.sock` in a
      #   container that terminates TLS for the whole estate, which is the single
      #   most valuable mount an attacker can reach, held for a feature that has
      #   never once routed a request.
      #
      #   MEASURED BEFORE REMOVING, not assumed: no container in the estate
      #   carries a routing label. The only `traefik.enable=true` was on this
      #   container, described here as "the cheapest possible proof that label
      #   discovery is working" — a self-test for a mechanism that has never
      #   worked, routing a dashboard that does not exist either, since there is
      #   no `--api` flag and `:8082` is the metrics entrypoint. Three vestigial
      #   things propping each other up.
      #
      #   SO THE FILE PROVIDER IS THE MECHANISM, not a fallback. Every upstream
      #   is addressed by DNS name in `gateway/dynamic/`, and `surface-routes.py`
      #   now runs in CI to keep that in step with the registry.
      #
      #   The consequence the old header drew is unchanged and still unpaid:
      #   `deploy.replicas` remains illegal for anything routed by name. If label
      #   discovery is ever wanted, it needs a Traefik past the pinned constant
      #   or a socket proxy — and re-adding the flags alone will silently do
      #   nothing, which is why this says so here.
      #
      # Dynamic configuration that is NOT a container: the /internal refusal and
      # the CORS list. Policy belongs in a file under review, not in a label on
      # the service it is supposed to constrain.
      - --providers.file.directory=/etc/traefik/dynamic
      # ── THE WATCH IS TRUE AND, ON A MAC, IT NEVER FIRES ──────────────────────
      #
      # Left on deliberately, and the reason it cannot simply be believed is
      # written here rather than discovered again. `gateway/dynamic/` reaches this
      # container as a bind mount out of a Lima VM — `/proc/mounts` inside it says
      # `lima-… /etc/traefik/dynamic virtiofs ro`, and `colima status` says
      # `mountType: virtiofs`. virtiofs does not forward host-originated
      # filesystem change notifications into the guest, so the inotify watch
      # Traefik registers here is on a filesystem that will never tell it
      # anything. The write happens on macOS; the watcher is in Linux.
      #
      # Measured against this estate: a file written at epoch 1785837810 left the
      # gateway reporting `traefik_config_last_reload_success 1785836079` and
      # routing the old table twenty seconds later. It changed only on restart.
      #
      # The flag stays because it is CORRECT where this estate deploys — a Linux
      # host, where this is a real bind mount and inotify works — and turning it
      # off would break reload there to describe a developer machine. What closes
      # the gap instead is `scripts/gateway-reload.sh`: `--check` compares this
      # exact metric against the newest mtime over gateway/dynamic/*.yml AND the
      # certificates in the directory mounted below, and fails
      # when the gateway is behind, and it runs in `estate-up.sh` and in every
      # `estate-verify.sh`. The state announces itself rather than being
      # something a person has to suspect.
      #
      # THE CERTIFICATES WERE NOT IN THAT COMPARISON UNTIL 2026-08-04, and a
      # certificate is the one file here whose change this watch could never have
      # carried anyway: Traefik reads `certFile` when it builds the TLS store, not
      # per handshake, so replacing the pair `tls.yml` names does nothing at all
      # until this container restarts. The check that was supposed to notice was
      # hashing only `*.yml`.
      - --providers.file.watch=true

      # --- entrypoints -------------------------------------------------------
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # ── AND IT STILL SAYS `https` WHEN `CF_GATEWAY_TLS` IS false ─────────────
      #
      # Left that way deliberately, and written down rather than discovered.
      # `web` is :80 (published on ${CF_GW_PORT_BASE}95), and on a plaintext
      # deployment NOTHING REACHES IT: the tunnel's service URL names the
      # `websecure` port directly, so the only client that could follow this
      # redirect never asks for it. Measured — with TLS off, `:80` still answers
      # `301 -> https://hub.<apex>/`.
      #
      # It is one variable rather than two ON PURPOSE. Making this scheme follow
      # the TLS switch needs a SECOND compose variable (compose interpolation has
      # no conditional, so `true`/`false` cannot become `https`/`http`), and two
      # levers that must agree are two levers that drift — the defect this
      # repository has paid for repeatedly and that `surface-routes.py` check 6
      # exists to catch. A redirect nobody follows is a smaller cost than a second
      # source of truth for the same fact.
      - --entrypoints.websecure.address=:443
      # TLS termination. ACME in production; the local stack runs Traefik's
      # self-signed default, which is correct for loopback and wrong to ship.
      # ── TLS HERE IS NOW A PER-ENVIRONMENT DECISION, AND IT DEFAULTS TO ON ────
      #
      # `true` is what every environment renders that does not say otherwise, so
      # an unset variable leaves this line byte-for-byte what it always was. The
      # owner's local estate on `cloudsforge.localtest.me` depends on that: a
      # browser being able to use the estate over REAL TLS is what caught a
      # gateway serving `CN=TRAEFIK DEFAULT CERT` while every check passed, and
      # that arrangement is deliberate rather than incidental.
      #
      # `false` IS NOT "TLS off and everything else the same". Measured on
      # traefik:v3.2.3, because the difference decides whether 53 routers answer
      # at all:
      #
      #   tls=true    a router on this entrypoint is SPLIT into a TLS copy, and
      #               plaintext on :443 answers 404 — TLS is required.
      #   tls=false   the router is not split; it answers PLAINTEXT on :443, and
      #               the entrypoint middleware chain below STILL APPLIES to it.
      #
      # That second measurement is the whole reason this is one flag rather than a
      # second entrypoint: `cf-request-id`, `cf-security-headers` and `cf-cors`
      # are attached to the ENTRYPOINT, not to the TLS on it, so turning TLS off
      # does not drop one of them. Verified by reading the headers off the
      # plaintext response, not inferred from the configuration.
      #
      # WHY ANY ENVIRONMENT WOULD SET `false`. Cloudflare Tunnel validates a
      # certificate against THE HOSTNAME IN ITS SERVICE URL, and on this host that
      # URL is an IP literal — `https://127.0.0.1:443`. Both certificates tried
      # failed for reasons no certificate can fix:
      #
      #   estate CA leaf   -> x509: certificate signed by unknown authority
      #   Origin CA leaf   -> x509: cannot validate certificate for 127.0.0.1
      #                      because it doesn't contain any IP SANs
      #
      # and no Origin CA will ever sign an IP literal. The dashboard settings that
      # would sidestep it — *No TLS Verify*, *Origin Server Name* — the owner
      # could not find in their UI, twice. `cloudflared/config.*.yml` in this
      # repository carries `noTLSVerify: true` and IS NOT WHAT THE RUNNING TUNNEL
      # READS: the unit is `cloudflared tunnel run --token-file`, so its ingress
      # arrives from the dashboard over the API.
      #
      # So on that deployment the gateway stops offering a certificate at all and
      # the tunnel's service URL becomes `http://`. Nothing a user touches is
      # downgraded: browser -> Cloudflare is HTTPS, Cloudflare -> this host is the
      # tunnel's own encrypted connection, and the only plaintext segment is a
      # loopback socket inside one machine, on a port bound to 127.0.0.1.
      - --entrypoints.websecure.http.tls=${CF_GATEWAY_TLS:-true}
      # Every request gets an x-request-id at the edge if it does not have one.
      # This is the id a user reads off an error page and an operator pastes
      # into one search box — a workflow that already works and must keep
      # working. `traceparent` is 55 hex characters and nobody reads one aloud.
      # The /internal refusal is NOT in this chain: it is a router at priority
      # 100000 in gateway/dynamic/policy.yml, because a middleware cannot refuse
      # a request and a route can. Nothing a service labels can outrank it.
      - --entrypoints.websecure.http.middlewares=cf-request-id@file,cf-security-headers@file,cf-cors@file

      # --- observability -----------------------------------------------------
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --entrypoints.metrics.address=:8082
      - --tracing.otlp=true
      - --tracing.otlp.grpc.endpoint=otel-collector:4317
      - --tracing.otlp.grpc.insecure=true
      # The gateway is the first span of every trace. Sampling it away would
      # break the join between a browser error and the server trace that caused
      # it, which is the whole reason Lantern gains RUM. Head sampling stays at
      # 100% here; the tail sampler decides.
      - --tracing.sampleRate=1.0
      - --ping=true
    ports:
      # Loopback, like every other port in this stack. Public exposure is the
      # tunnel's job and it is the tunnel that terminates on a public address.
      - "127.0.0.1:${CF_GW_PORT_BASE:-90}95:80"
      - "127.0.0.1:${CF_GW_PORT_BASE:-90}96:443"
      - "127.0.0.1:${CF_GW_PORT_BASE:-90}97:8082"
      # 443 ITSELF, because every URL in the estate is written without a port.
      # `https://hub.<apex>/` means 443, the surface registry composes addresses
      # with no port, and the browser suites and `beacon smoke` all drive those
      # addresses. This binding existed on the running container and NOT in this
      # file, so it survived only until the next `up` recreated it — the same
      # class of defect as the credentials that vanished on a plain compose up.
      # Recreating the gateway to remove a dead provider is exactly how it was
      # found: every route returned 000 while the container reported healthy.
      - "127.0.0.1:${CF_GATEWAY_PORT:-443}:443"
    volumes:
      # Read-only. Traefik reads container labels; it never needs to create,
      # stop or exec anything — the same reasoning that makes Lantern's socket
      # mount read-only.
      - ../gateway/dynamic:/etc/traefik/dynamic:ro
      # The estate's own CA and leaf, minted by `scripts/gateway-cert.sh` and
      # referenced by `gateway/dynamic/tls.yml`. Read-only, and never committed:
      # `.gitignore` refuses `gateway/certs/`.
      #
      # WITHOUT THIS MOUNT Traefik serves `CN=TRAEFIK DEFAULT CERT`, and the
      # estate is unusable in a real browser while every verifier in this
      # repository reports green — `curl -k` and `ignoreHTTPSErrors: true` were
      # the only two clients it had ever had. A page loads after a click-through
      # and then every CROSS-ORIGIN call fails, because no browser offers an
      # interstitial for an XHR. See tls.yml for the whole diagnosis.
      #
      # Docker creates the host directory if it is absent rather than failing, so
      # a stack brought up without the certificate script degrades to the old
      # self-signed default instead of refusing to start.
      #
      # `CF_CERT_DIR` because this path was HARDCODED, and the gateway is the
      # file a second environment collides in: two projects mounting one
      # directory means the second `gateway-cert.sh` run decides what the FIRST
      # one serves. The leaf is additive now (see that script), so sharing this
      # default directory is correct and is what both environments do — but the
      # variable is the escape hatch for a deployment that wants two CAs, and a
      # hardcoded path is not an escape hatch at all.
      - ${CF_CERT_DIR:-../gateway/certs}:/etc/traefik/certs:ro
    # ── THE ONE UPSTREAM THAT IS NOT ON A COMPOSE NETWORK ────────────────────
    #
    # `gateway/dynamic/estate-web.yml` routes `rpc.<apex>` and `p2p.<apex>` to the
    # EMBER chain, and the chain is not ours to attach: `hearth` is the frozen
    # upstream repository, run from its own compose file by
    # `scripts/ember-testnet.sh` on its own `hearth-testnet` network. The estate has
    # always crossed the host to reach it — docker-compose.estate.yml gives the
    # indexer, foresight and the faucet the identical entry, each with the identical
    # reason beside it.
    #
    # DOCKER DESKTOP RESOLVES THIS NAME FOR FREE AND THE LINUX DAEMON DOES NOT, which
    # is precisely why it has to be declared rather than relied on: without it the
    # gateway would route the chain perfectly on the machine this was written on and
    # answer 502 on the box it deploys to, with a DNS failure buried in a proxy log.
    # `host-gateway` is a no-op where the name already resolves.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      edge:
      app:
      estate:
        # ── THE GATEWAY MUST ANSWER TO ITS PUBLIC HOSTNAMES FROM INSIDE THE ESTATE ──────────
        #
        # `beacon` probes the surfaces at the addresses a person uses —
        # `https://hub.<apex>/` — because a probe that skips the gateway reports
        # healthy while the gateway is broken, which is the exact failure that hid
        # a dead `cf-api-explorer` router for days.
        #
        # But `*.localtest.me` resolves to 127.0.0.1, and inside a container that is
        # THE CONTAINER. Every one of the 19 probes got ECONNREFUSED, opened a SEV3,
        # and the public status page confidently reported a full outage that was not
        # happening. A status page that invents an outage is worse than one that says
        # nothing, and this one had just been fixed to stop saying nothing.
        #
        # These aliases point those names at the gateway on the estate's own network,
        # so a probe traverses the real path: DNS, TLS, Traefik routing, the upstream.
        #
        # THE LIST IS STATIC BECAUSE COMPOSE ALIASES CANNOT BE COMPUTED, AND NOTHING
        # CHECKS IT. This block claimed, until 2026-08-04, that
        # "`scripts/surface-routes.py` compares it against the surface registry and
        # fails on drift". IT DOES NOT. That script has five checks — routers against
        # the registry in both directions, an API router per deployed backend, cf-*
        # names written in comments, and the CORS allowlist — and the word `aliases`
        # appears nowhere in `scripts/`. This was a check described in prose, in the
        # file that would know, which is the exact defect check 4 of that script was
        # added for.
        #
        # AND IT HAD ALREADY DRIFTED, which is how the claim was found. `lantern` and
        # `beacon` became browser surfaces the day micro-lantern-web and
        # micro-beacon-web were deployed (`ui/packages/ui/src/surfaces.ts` flipped both
        # to `servesUi: true` on the measurement), and neither hostname is in the list
        # below — so beacon, which probes these addresses from inside the estate for
        # the reason this block explains, cannot resolve the two operator consoles.
        #
        # Corrected here rather than fixed: adding the two aliases requires recreating
        # this container, and both hostnames belong to micro-beacon's probe set, which
        # another agent holds tonight. Written down so the next reader inherits a true
        # sentence and a named defect instead of a check that does not exist.
        #
        # `rpc` and `p2p` are deliberately absent, and correctly so: this list is the
        # surfaces a BROWSER opens, which is why the six API hostnames — nimbus, api,
        # worlds-api, pay, vault and account — are absent from it too.
        aliases:
          # The bare apex first, because it has no subdomain and a prefixed list
          # silently omits it — which is exactly what happened: 18 of 19 groups
          # went operational and the marketing site alone stayed in outage.
          - ${CF_WEB_APEX:-cloudsforge.localtest.me}
          - admin.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - aetherholm.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - create.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - developers.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - emberkin.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - explorer.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - foresight.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - hub.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - market.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - network.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - status.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - tessera.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - trade.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - worlds.${CF_WEB_APEX:-cloudsforge.localtest.me}
networks:
  # External here: created by docker-compose.telemetry.yml, which is the file
  # that owns them. Two compose files each creating a network called
  # `cf-micro-edge` is two networks or one error, depending on ordering.
  edge:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-edge
  app:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-app
  # Declared so that a service overlay adding custody to this stack attaches to
  # the network with the right properties rather than inventing one. NOTHING in
  # this file joins it: the gateway must not be able to reach custody, and the
  # way to guarantee that is for the gateway to have no route to it at all.
  vault:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-vault

  # The estate's own network, and it was NOT declared here until 2026-08-04.
  #
  # `docker-compose.estate.yml` creates `cloudsforge-estate_default` for its ~60
  # services. The gateway proxies to them BY DNS NAME, so without this it
  # resolves nothing and every route answers 502 — which is exactly what happened
  # when the gateway was recreated to remove a dead Docker provider: healthy
  # container, correct certificate, 502 on every host.
  #
  # It had been attached by hand on the running container. That is the third
  # piece of undeclared runtime state found in one night, after the credentials
  # that blanked on a plain `up` and the missing `443:443` binding above. All
  # three shared a shape: the estate worked, and nothing in the repository said
  # why, so the next recreate silently undid it.
  estate:
    external: true
    name: ${CF_PROJECT:-cloudsforge-estate}_default
