# The gateway — AD-17.
#
# Traefik with LABEL-BASED DISCOVERY, which is the whole point. The estate today
# carries eighteen `container_name:` entries and a fixed host port for every
# service; that is what makes `deploy.replicas` illegal, because two replicas
# cannot both be `cloudsforge-pay` and cannot both bind 4003. Discovery by label
# deletes both, and horizontal scaling stops being a rewrite.
#
# It owns four things that are currently owned by four different places:
#
#   TLS         — today: cloudflared. Moves here so a certificate is a gateway
#                 concern rather than a tunnel configuration nobody reads.
#   CORS        — today: an env-var allowlist copied into eight services, which
#                 has already drifted once (:4004 in nimbus's list and missing
#                 from everyone else's, so ForgeMint's SPA could sign in and
#                 could not call Pay). One middleware, one list.
#   /internal   — today: a hand-written path rule in deploy/cloudflared/
#                 config.example.yml, asserted by a CI invariant that parses
#                 that YAML. The MECHANISM moves, so the INVARIANT moves with
#                 it: see the CI check at the bottom of this file.
#   SPA serving — today: static bundles inside API processes plus a
#                 hand-maintained API_PREFIXES array.
#
#   docker compose -f compose/docker-compose.telemetry.yml \
#                  -f compose/docker-compose.gateway.yml up -d
#
# The telemetry file must be up first: it creates the three networks this one
# attaches to as external.

x-obs: &obs
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  gateway:
    <<: *obs
    image: traefik:v3.2.3
    # No container_name, deliberately, and it is the first place to prove the
    # point: this service is discovered by label like everything behind it.
    env_file:
      - env/traefik.env
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      # Access logs as JSON so the collector parses them without a regex, and
      # so `cf.request_id` survives into Loki as a field rather than as a
      # substring somebody greps.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.names.X-Request-Id=keep
      - --accesslog.fields.headers.names.Traceparent=keep
      # Never log a credential. The gateway sees every Authorization header in
      # the estate; it is the single highest-value line in any log file here.
      - --accesslog.fields.headers.names.Authorization=drop
      - --accesslog.fields.headers.names.Cookie=drop

      # --- discovery ---------------------------------------------------------
      #
      # ⚠ THE DOCKER PROVIDER IS GONE, AND NOTHING LOST A ROUTE.
      #
      #   It never worked here. Traefik v3.2.3 pins its Docker API version to
      #   1.24 in code and Docker Desktop's daemon refuses anything below 1.40,
      #   so every ~4 seconds, for the life of the container, it logged:
      #
      #     ERR Failed to retrieve information of the docker client and server
      #         host  error="client version 1.24 is too old..."  providerName=docker
      #     ERR Provider error, retrying in 4.17s
      #
      #   Neither `DOCKER_API_VERSION` nor v3.3.7 changed it; both were tried and
      #   the error was byte-identical. It was recorded rather than fixed on the
      #   grounds that it had no live symptom.
      #
      #   IT HAD TWO. A provider retrying forever floods the log a real provider
      #   failure would have to be noticed in — the file provider's errors land
      #   in the same stream. And it required `/var/run/docker.sock` in a
      #   container that terminates TLS for the whole estate, which is the single
      #   most valuable mount an attacker can reach, held for a feature that has
      #   never once routed a request.
      #
      #   MEASURED BEFORE REMOVING, not assumed: no container in the estate
      #   carries a routing label. The only `traefik.enable=true` was on this
      #   container, described here as "the cheapest possible proof that label
      #   discovery is working" — a self-test for a mechanism that has never
      #   worked, routing a dashboard that does not exist either, since there is
      #   no `--api` flag and `:8082` is the metrics entrypoint. Three vestigial
      #   things propping each other up.
      #
      #   SO THE FILE PROVIDER IS THE MECHANISM, not a fallback. Every upstream
      #   is addressed by DNS name in `gateway/dynamic/`, and `surface-routes.py`
      #   now runs in CI to keep that in step with the registry.
      #
      #   The consequence the old header drew is unchanged and still unpaid:
      #   `deploy.replicas` remains illegal for anything routed by name. If label
      #   discovery is ever wanted, it needs a Traefik past the pinned constant
      #   or a socket proxy — and re-adding the flags alone will silently do
      #   nothing, which is why this says so here.
      #
      # Dynamic configuration that is NOT a container: the /internal refusal and
      # the CORS list. Policy belongs in a file under review, not in a label on
      # the service it is supposed to constrain.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # --- entrypoints -------------------------------------------------------
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # TLS termination. ACME in production; the local stack runs Traefik's
      # self-signed default, which is correct for loopback and wrong to ship.
      - --entrypoints.websecure.http.tls=true
      # Every request gets an x-request-id at the edge if it does not have one.
      # This is the id a user reads off an error page and an operator pastes
      # into one search box — a workflow that already works and must keep
      # working. `traceparent` is 55 hex characters and nobody reads one aloud.
      # The /internal refusal is NOT in this chain: it is a router at priority
      # 100000 in gateway/dynamic/policy.yml, because a middleware cannot refuse
      # a request and a route can. Nothing a service labels can outrank it.
      - --entrypoints.websecure.http.middlewares=cf-request-id@file,cf-security-headers@file,cf-cors@file

      # --- observability -----------------------------------------------------
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --entrypoints.metrics.address=:8082
      - --tracing.otlp=true
      - --tracing.otlp.grpc.endpoint=otel-collector:4317
      - --tracing.otlp.grpc.insecure=true
      # The gateway is the first span of every trace. Sampling it away would
      # break the join between a browser error and the server trace that caused
      # it, which is the whole reason Lantern gains RUM. Head sampling stays at
      # 100% here; the tail sampler decides.
      - --tracing.sampleRate=1.0
      - --ping=true
    ports:
      # Loopback, like every other port in this stack. Public exposure is the
      # tunnel's job and it is the tunnel that terminates on a public address.
      - "127.0.0.1:9095:80"
      - "127.0.0.1:9096:443"
      - "127.0.0.1:9097:8082"
      # 443 ITSELF, because every URL in the estate is written without a port.
      # `https://hub.<apex>/` means 443, the surface registry composes addresses
      # with no port, and the browser suites and `beacon smoke` all drive those
      # addresses. This binding existed on the running container and NOT in this
      # file, so it survived only until the next `up` recreated it — the same
      # class of defect as the credentials that vanished on a plain compose up.
      # Recreating the gateway to remove a dead provider is exactly how it was
      # found: every route returned 000 while the container reported healthy.
      - "127.0.0.1:443:443"
    volumes:
      # Read-only. Traefik reads container labels; it never needs to create,
      # stop or exec anything — the same reasoning that makes Lantern's socket
      # mount read-only.
      - ../gateway/dynamic:/etc/traefik/dynamic:ro
      # The estate's own CA and leaf, minted by `scripts/gateway-cert.sh` and
      # referenced by `gateway/dynamic/tls.yml`. Read-only, and never committed:
      # `.gitignore` refuses `gateway/certs/`.
      #
      # WITHOUT THIS MOUNT Traefik serves `CN=TRAEFIK DEFAULT CERT`, and the
      # estate is unusable in a real browser while every verifier in this
      # repository reports green — `curl -k` and `ignoreHTTPSErrors: true` were
      # the only two clients it had ever had. A page loads after a click-through
      # and then every CROSS-ORIGIN call fails, because no browser offers an
      # interstitial for an XHR. See tls.yml for the whole diagnosis.
      #
      # Docker creates the host directory if it is absent rather than failing, so
      # a stack brought up without the certificate script degrades to the old
      # self-signed default instead of refusing to start.
      - ../gateway/certs:/etc/traefik/certs:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      edge:
      app:
      estate:
        # ── THE GATEWAY MUST ANSWER TO ITS PUBLIC HOSTNAMES FROM INSIDE THE ESTATE ──────────
        #
        # `beacon` probes the surfaces at the addresses a person uses —
        # `https://hub.<apex>/` — because a probe that skips the gateway reports
        # healthy while the gateway is broken, which is the exact failure that hid
        # a dead `cf-api-explorer` router for days.
        #
        # But `*.localtest.me` resolves to 127.0.0.1, and inside a container that is
        # THE CONTAINER. Every one of the 19 probes got ECONNREFUSED, opened a SEV3,
        # and the public status page confidently reported a full outage that was not
        # happening. A status page that invents an outage is worse than one that says
        # nothing, and this one had just been fixed to stop saying nothing.
        #
        # These aliases point those names at the gateway on the estate's own network,
        # so a probe traverses the real path: DNS, TLS, Traefik routing, the upstream.
        #
        # THE LIST IS STATIC BECAUSE COMPOSE ALIASES CANNOT BE COMPUTED, so it is
        # CHECKED instead: `scripts/surface-routes.py` compares it against the surface
        # registry and fails on drift, and that script now runs in CI. A hand-kept copy
        # that nothing verifies is the defect this estate has paid for four times.
        aliases:
          # The bare apex first, because it has no subdomain and a prefixed list
          # silently omits it — which is exactly what happened: 18 of 19 groups
          # went operational and the marketing site alone stayed in outage.
          - ${CF_WEB_APEX:-cloudsforge.localtest.me}
          - admin.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - aetherholm.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - create.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - developers.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - emberkin.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - explorer.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - foresight.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - foresight-admin.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - hub.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - market.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - network.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - status.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - tessera.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - trade.${CF_WEB_APEX:-cloudsforge.localtest.me}
          - worlds.${CF_WEB_APEX:-cloudsforge.localtest.me}
networks:
  # External here: created by docker-compose.telemetry.yml, which is the file
  # that owns them. Two compose files each creating a network called
  # `cf-micro-edge` is two networks or one error, depending on ordering.
  edge:
    external: true
    name: cf-micro-edge
  app:
    external: true
    name: cf-micro-app
  # Declared so that a service overlay adding custody to this stack attaches to
  # the network with the right properties rather than inventing one. NOTHING in
  # this file joins it: the gateway must not be able to reach custody, and the
  # way to guarantee that is for the gateway to have no route to it at all.
  vault:
    external: true
    name: cf-micro-vault

  # The estate's own network, and it was NOT declared here until 2026-08-04.
  #
  # `docker-compose.estate.yml` creates `cloudsforge-estate_default` for its ~60
  # services. The gateway proxies to them BY DNS NAME, so without this it
  # resolves nothing and every route answers 502 — which is exactly what happened
  # when the gateway was recreated to remove a dead Docker provider: healthy
  # container, correct certificate, 502 on every host.
  #
  # It had been attached by hand on the running container. That is the third
  # piece of undeclared runtime state found in one night, after the credentials
  # that blanked on a plain `up` and the missing `443:443` binding above. All
  # three shared a shape: the estate worked, and nothing in the repository said
  # why, so the next recreate silently undid it.
  estate:
    external: true
    name: cloudsforge-estate_default
