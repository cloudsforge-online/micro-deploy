# ══════════════════════════════════════════════════════════════════════════════════════════════
# THE BACKUP RUNNER — the DATA PLANE of estate backup and restore.
#
#   mainnet   docker compose -p cloudsforge-estate \
#               --env-file compose/mainnet.env --env-file compose/estate/tokens.env \
#               -f compose/docker-compose.estate.yml \
#               -f compose/docker-compose.backup.yml up -d --no-deps backup-runner
#   testnet   docker compose -p cf-testnet ... (same, with the testnet env files)
#
# BOTH `--env-file` FLAGS, ALWAYS. `--env-file` replaces the default rather than adding to it
# (micro-org#158), and since micro-org#434 three of this file's variables have no default at all —
# a bare invocation now REFUSES rather than mounting the wrong machine's directories.
#
# `--no-deps` because `depends_on: postgres` would otherwise let compose reconcile a running
# postgres against whatever this checkout says, and this checkout is not what the estate deployed:
# `release-deploy.sh` renders a pinned overlay that is not on this command line.
#
# ── NO DEPLOY PATH RENDERS THIS FILE, WHICH IS HOW IT WENT MISSING FOR 43 HOURS ────────────────
#
# It is named by no release manifest and `release-deploy.sh` never composes it, so a deploy neither
# starts nor stops it. The 2026-08-10 host migration moved everything a deploy renders and silently
# dropped this. `BackupNeverRun` fired fourteen minutes later and was correct for two days
# (micro-org#434). `estate-verify.sh` now ends with a section that asserts this container exists in
# the project, answers /metrics, has a success inside the 36h page threshold and has had a set
# restored — so the next deploy says it out loud instead of leaving it to a ticket queue.
#
# It leases `backup.*` jobs out of admin_api's `jobs` table. admin-api owns the catalogue, the
# authority to start a run and the approval a live restore needs; this owns the bytes and nothing
# else. `JobRunner.claim()` filters by REGISTERED kind, so neither can take the other's work.
#
# ── WHY THIS FILE IS AN OVERLAY AND NOT A BLOCK IN docker-compose.estate.yml ──────────────────
#
# The estate file is 46 services of application. This is the one container in the estate that holds
# a superuser DSN for the whole cluster and read access to the custody vault. Keeping it in its own
# file makes that grant reviewable in isolation rather than on line 3300 of a 4000-line file.
# ══════════════════════════════════════════════════════════════════════════════════════════════

services:
  backup-runner:
    restart: unless-stopped
    build:
      context: ../backup
      additional_contexts:
        runtimepkgs: ../../runtime
    environment:
      # ── IDENTITY. Baked in at container creation, never taken from a job payload, a route or a
      #    manifest. It is one half of the cross-environment restore refusal (src/manifest.ts); the
      #    other half is written inside the artefact. Neither is a parameter, because on 2026-08-05
      #    the thing that failed — twice — was a parameter that was ignored.
      BACKUP_ENVIRONMENT: ${CF_BACKUP_ENVIRONMENT:?set it to mainnet or testnet; it is one half of the cross-environment restore refusal and must never be guessed}
      BACKUP_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-cloudsforge-estate}

      # ── TWO DSNs, WHICH IS WHY THIS IS NOT PART OF admin-api.
      #    Rule 1 gives a service one database and CI greps admin-api/src for a second. A process
      #    that dumps 29 OTHER databases cannot satisfy that and should not: reading every database
      #    in the cluster is a different trust domain from composing an operator's console.
      BACKUP_ADMIN_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/admin_api
      BACKUP_CLUSTER_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/postgres

      BACKUP_ROOT: /backups
      BACKUP_CUSTODY_VAULT_DIR: /vault/custody-keys/keys
      BACKUP_STUDIO_ASSETS_DIR: /volumes/studio-assets
      BACKUP_WORLD_ASSETS_DIR: /world-assets
      BACKUP_MINER_KEYS_DIR: /miner-keys

      # ── A PUBLIC KEY. Safe here, safe in git, safe in a log line — that is the whole reason `age`
      #    with a recipient was chosen over a symmetric key in this container's environment. The
      #    private identity must NEVER exist on this host; it lives with the paper and the encrypted
      #    USB from docs/custody-backup-restore.md §4.1.
      #
      #    Unset means the miner coinbase key is simply NOT backed up, and the manifest says so.
      #    There is deliberately no path that writes a private key unencrypted: that fallback would
      #    fire exactly when configuration is broken, which is exactly when nobody is watching.
      BACKUP_AGE_RECIPIENT: ${CF_BACKUP_AGE_RECIPIENT:-}

      INSTANCE_ID: backup-runner-${CF_BACKUP_ENVIRONMENT:-estate}
      LOG_LEVEL: ${CF_LOG_LEVEL:-info}

      # ══════════════════════════════════════════════════════════════════════════════════════
      # NOTE THE ABSENCE. There is NO env_file here and NO CUSTODY_MASTER_SECRET_V* of any kind.
      #
      # This container archives the custody VAULT — ciphertext. Adding the keyring to it would put
      # artefacts B and C of docs/custody-backup-restore.md §1.5 in one process and, from there,
      # into one backup set: "not a backup with a key, it is a plaintext key store with extra
      # steps — anyone who finds that medium has the coins."
      #
      # src/keyring.ts REFUSES TO START if any CUSTODY_MASTER_SECRET_V<n> is present in this
      # process's environment, matched by pattern so a rotation to V4 cannot slip past. If somebody
      # adds an env_file here to let the runner "check the keys work", the container will not boot.
      # That is the intended outcome. Do not weaken it.
      # ══════════════════════════════════════════════════════════════════════════════════════

    volumes:
      # ══════════════════════════════════════════════════════════════════════════════════════
      # **THE DESTINATION HAS NO DEFAULT, AND THAT IS THE WHOLE OF micro-org#434.**
      #
      # It defaulted to `/home/malf/cloudsforge-backups` — a path on the CHAIN host — from the day
      # this file was written until 2026-08-12. That was correct while the estate ran there. After
      # the 2026-08-10 cutover it was a default naming a machine that no longer runs anything this
      # container backs up, and nothing anywhere said so: the runner drained with the migration, was
      # never brought up beside the data, and the estate went 43 hours with no backup.
      #
      # A default is a guess about which host this is. This container writes the estate's only
      # recovery point and reads a key vault; it should not guess. So the variable is REQUIRED, and
      # `compose/mainnet.env` and `compose/testnet.env` carry the answer for this host in a tracked
      # file where a host migration has to walk past it.
      #
      # THE OTHER FAILURE MODE IS STILL LIVE AND STILL WORSE, so keep reading it. On the old host
      # docker was the CANONICAL SNAP (29.3.1, rev 3505), whose confinement grants `docker:home` but
      # not `removable-media` — so the daemon could not see /data at all, and a bind of a path it
      # cannot see does not fail. The container gets an empty directory in its own ephemeral layer,
      # every write "succeeds", and the artefacts are destroyed with the container. Verified on that
      # host 2026-08-05: a canary written through a /data bind was absent afterwards; the same write
      # through /home/malf was present.
      #
      # Nothing in the runner would notice: pg_dump exits 0, the checksums are correct, the manifest
      # is written and backup_runs says `succeeded`. That is why src/disk.ts writes a canary and
      # checks the filesystem size at boot and REFUSES to run if the destination is implausible.
      # That check is what stands between this variable and a destination that swallows writes,
      # which is the reason a wrong value here is caught and a wrong value is still not fine.
      # ══════════════════════════════════════════════════════════════════════════════════════
      - ${CF_BACKUP_DESTINATION:?set it in the environment's env file; it has no default because a default is a guess about which host this is, and micro-org#434 is what that guess cost}:/backups

      # READ-ONLY, all four sources. This process copies; it has no business writing to any of them,
      # and a `:ro` mount is the difference between a bug that fails and a bug that eats the vault.
      - custody-keys:/vault/custody-keys:ro
      - studio-assets:/volumes/studio-assets:ro
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/world-assets:ro

      # The miner coinbase keys: 240-byte plaintext private keys, mode 0600, holding real mined
      # coin at 0x980d…5b45 on mainnet. They are read, encrypted to BACKUP_AGE_RECIPIENT, and only
      # the ciphertext is written. If no recipient is configured they are not read at all.
      #
      # REQUIRED for the same reason as the destination, and with a sharper edge: this default also
      # named the chain host, and the two hosts do not hold the same files. `src/env.ts` takes
      # `<dir>/<env>/coinbase-key.json` — the PLAINTEXT key — and the app host's miner-keys
      # directory holds only the sealed `coinbase-keystore.json`, because micro-org#206 sealed it
      # there and never created a plaintext copy. So on this host the backup path and the sealing
      # path point at different files, and a default that quietly resolved to an absent one would
      # read as "backed up" to anybody who did not go looking. It is recorded in micro-org#434.
      - ${CF_MINER_KEYS:?set it in the environment's env file; the two hosts do not hold the same miner-key files and a default cannot tell which host this is}:/miner-keys:ro

    # ── NO DOCKER SOCKET, AND THAT IS A DESIGN DECISION RATHER THAN AN OMISSION.
    #
    # A backup tool that mounts /var/run/docker.sock is a backup tool with root on the host: the
    # socket is an unauthenticated API that can start a privileged container with / bind-mounted.
    # Nothing here needs it. The databases are reached over the network as any other client, and the
    # volumes are reached as volume mounts. `docker exec` is convenient for a human at a terminal
    # (which is what the §2 runbook uses) and is a privilege escalation when it is left in a daemon.
    ports:
      # ── 4147 ON THE HOST, 4130 IN THE CONTAINER, AND THE TWO ARE NOT A TYPO ──────────────────
      #
      # This published 4130:4130 until 2026-08-10, and `trade-web` in `docker-compose.estate.yml`
      # has owned `127.0.0.1:${CF_PORT_BASE:-4}130` the whole time. The first attempt to bring the
      # runner up on mainnet — the composition this file's own header prescribes — built the image,
      # created the container and then died at the last step with
      # `Bind for 127.0.0.1:4130 failed: port is already allocated` (micro-org#328).
      #
      # It hid because this is the only compose file in the repository that no deploy path renders:
      # it is named by no release manifest, `release-deploy.sh` never composes it, and it is brought
      # up by hand. Nothing had ever put the two files in one model, and one file cannot see the
      # other's ports. `scripts/check-compose-host-ports.py` now does, in CI.
      #
      # ONLY THE HOST SIDE MOVED. The container listens on 4130, which is what the healthcheck below
      # probes and what `prometheus/prometheus.yml`'s `backup-runner:4130` job scrapes over the
      # estate network — neither goes through this publish. The host mapping exists for a human with
      # a terminal, and 4147 is one past the top of the estate file's contiguous 41xx block rather
      # than into the 4144/4145 gap, which is not obviously free to claim.
      - "127.0.0.1:${CF_PORT_BASE:-4}147:4130"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4130/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # This process holds a superuser DSN and reads a key vault. It should not also be able to gain
    # privileges it was not started with — so the DEFAULT here is the hardened value and stays that
    # way.
    #
    # ══════════════════════════════════════════════════════════════════════════════════════════
    # **THE OPT-OUT IS NO LONGER TAKEN. THE OLD HOST COULD NOT HONOUR IT (micro-org#329).**
    #
    # `mainnet.env` and `testnet.env` set `no-new-privileges:false` from 2026-08-10 to 2026-08-12
    # and no longer do. The estate now runs on Docker Desktop 29.1.2, where the same one-line probe
    # below prints `ok` — measured 2026-08-12 — so the hardened default applies again.
    #
    # The measurement is kept because the mechanism is not obvious and the next snap host will hit
    # it. Docker on the OLD estate host was the canonical SNAP, 29.3.1 rev 3505. On that build
    # `no-new-privileges` makes the container fail to exec ANYTHING. Measured 2026-08-10, with no
    # compose file involved at all:
    #
    #   docker run --rm --security-opt no-new-privileges:true node:22-slim node -e 1
    #     -> exec /usr/local/bin/docker-entrypoint.sh: operation not permitted
    #   docker run --rm --security-opt no-new-privileges:true alpine:3.20 echo ok
    #     -> exec /bin/echo: operation not permitted
    #   docker run --rm node:22-slim node -e 1
    #     -> works
    #
    # Not AppArmor: adding `apparmor=unconfined` changes nothing. It is not this image and not this
    # service — the first container in the estate to ask for the flag was simply the first to find
    # out. The symptom is a `Restarting (255)` loop with one line of log, which is why the
    # measurement is written down here rather than left to be re-derived.
    #
    # THE OPT-OUT IS A VARIABLE AND NOT A DELETION. Deleting the line would make every future host
    # inherit the weakening silently; a variable whose default is `true` means only a host that has
    # declared it cannot comply runs without it, and the declaration is in a tracked file.
    # `no-new-privileges:false` is a real docker security-opt, so the opt-out is explicit rather
    # than an empty string compose would have to interpret.
    # ══════════════════════════════════════════════════════════════════════════════════════════
    security_opt:
      - ${CF_BACKUP_SECURITY_OPT:-no-new-privileges:true}

# Declared so the overlay can mount them by their project-scoped names
# (`<project>_custody-keys`). `external: false` is the default: these are the estate file's own
# volumes and compose resolves them within the same project.
volumes:
  custody-keys:
  studio-assets:
