# THE SEED ONLY, AND IT MUST NOT MINE. An overlay on hearth's own
# `docker-compose.testnet.yml`, applied from the hearth checkout:
#
#   cd ../hearth && docker compose \
#     -f docker-compose.testnet.yml \
#     -f ../deploy/compose/docker-compose.hearth-seed.yml \
#     up -d hearth-testnet-seed
#
# ── WHY ONLY THE SEED ─────────────────────────────────────────────────────────
#
# `hearth/docker-compose.testnet.yml` declares three services: the seed and
# two miners (:84, :103), each with `HEARTH_MINE: "1"` and `HEARTH_THROTTLE: 0.6`
# (:91-92, :110-111). On this host — 4 cores, already carrying 46 estate services
# and 7 telemetry containers — those two miners took the load average to 37. This
# machine is the SEED and the ecosystem; the owner mines from their Mac and PC
# with `hearth-mine` over HTTPS (`hearth/node/bin/hearth-mine.js`).
#
# The seed needs no `HEARTH_MINE: "0"` override: it never had the variable, and
# `hearth/node/bin/hearthd.js` arms mining only on the exact string `"1"`.
# Naming the service on the command line is what keeps the miners down —
# `depends_on` runs seed→miner, never the reverse.
#
# ── WHY THE PORTS ARE REPUBLISHED ─────────────────────────────────────────────
#
# Upstream publishes 8545/8645/8646/8648 on ALL INTERFACES. Every other port on
# this box binds 127.0.0.1 only and the chain must not be the exception: nothing
# here is meant to be reachable from the LAN, only through the gateway.
#
# But loopback alone is not enough either. The gateway and the estate reach the
# chain as `host.docker.internal`, which `docker-compose.gateway.yml`
# maps to `host-gateway` — measured on this host as 172.17.0.1, the default
# bridge. A process bound to 127.0.0.1 does not accept on 172.17.0.1, so a
# loopback-only node answers the operator's curl and 502s every container.
#
# Hence both, and only both:
#   127.0.0.1  — the operator's own `curl`, and `scripts/ember-*.sh`
#   172.17.0.1 — the gateway container and the estate's indexer/foresight/faucet
#
# `ports:` REPLACES the upstream list rather than adding to it — compose merges
# service keys but takes the override's sequence whole for `ports` — which is the
# reason this override can narrow a binding at all.
services:
  hearth-testnet-seed:
    # ── THE NAME, WHICH IS NOT FREE ───────────────────────────────────────────
    #
    # `container_name: hearth-testnet-seed` is a LITERAL at
    # `hearth/docker-compose.testnet.yml`, and container names are global to
    # the daemon. The legacy `stack` project — working dir
    # /home/malf/dev/fullstack/stack, deliberately stopped with `restart=no` —
    # still holds that exact name on an exited container, so a plain `up` here
    # fails with `Conflict. The container name "/hearth-testnet-seed" is already
    # in use`. Renaming ours is the only option that does not disturb a project
    # that is meant to stay down. Nothing routes by this name: the gateway and
    # the estate reach the chain across the host, not by container DNS.
    container_name: cf-hearth-seed
    environment:
      # ── THE DATA DIRECTORY, AND WHY THE DEFAULT IS A TRAP ───────────────────
      #
      # `docker-compose.testnet.yml` sets HEARTH_EVM=1 and does NOT set
      # HEARTH_DATA, so the account-model node writes `/data/blocks.ndjson` —
      # the SAME filename the retired UTXO chain uses. `hearth/docker-compose.yml`
      # sets `HEARTH_DATA: /data/evm` at :27 for exactly this reason and states
      # it at :20-23: "both chains write the same `blocks.ndjson` filename and an
      # EVM node pointed at UTXO history READS GARBAGE RATHER THAN REFUSING."
      # The testnet file never got that fix.
      #
      # This is not hypothetical here. The volume the legacy `stack` project left
      # behind holds 1827 blocks of UTXO history — `ember1…` outputs and a
      # 44-byte DER Ed25519 `coinbasePub` (`302a300506032b6570…`), not the
      # 65-byte uncompressed secp256k1 key the account model requires at
      # `node/src/chain/miner.js`. Subdirectory, so the two can never meet.
      #
      # ── AND NOW A THIRD SUBDIRECTORY, FOR A THIRD CHAIN ────────────────────
      #
      # `/data/evm` on this volume holds 64 blocks of the chain this seed ran as
      # `hearth-testnet`. Those blocks are NOT deleted; they are simply not the
      # ones this node reads any more. `HEARTH_NETWORK` below changes the chain
      # id under a genesis whose hash does not depend on it, so a 7411 node
      # pointed at that directory would CONTINUE the 7412 history under a new
      # identity — every existing block re-attributed to a chain it was never
      # mined on, which is worse than either chain alone. A fresh directory makes
      # the restart a restart, and leaves the old chain readable by pointing a
      # node back at `/data/evm` if it is ever wanted.
      HEARTH_DATA: /data/hearth-mainnet
      # ── THE NETWORK, WHICH IS THE CHAIN ID ────────────────────────────────
      #
      # `hearth/docker-compose.testnet.yml` sets `hearth-testnet` for all three
      # of its services, and this overlay used to inherit it — so the MAINNET
      # estate's seed answered `"network":"hearth-testnet","chainId":7412`, the
      # same id as the testnet estate's own seed. Two independent chains (separate
      # volumes, separate genesis-forward history, no peering — 8646 is unpublished
      # on both) sharing one identity: they cannot merge, but a transaction signed
      # for one is REPLAYABLE on the other, because EIP-155 binds a signature to
      # the chain id and to nothing else. Acceptable while both were test chains;
      # not acceptable for the one called mainnet.
      #
      # `hearth/node/src/params.js` maps `hearth` to 7411 and
      # `hearth-testnet` to 7412, and reads `HEARTH_NETWORK` with `hearth` as
      # its default — so this line restores that default rather than inventing
      # anything. An unregistered value is a hard error at require() time
      # (`params.js`), which is the failure mode this deserves.
      #
      # THE ESTATE HAS TO FOLLOW, and does: `compose/env/chain.mainnet.env` sets
      # `INDEXER_CHAINS=ember:mainnet`, which is what makes
      # `indexer/src/evm.ts` assert 7411 rather than 7412 before it writes
      # a block, and `docker-compose.miners.yml` mines this node as `hearth`.
      HEARTH_NETWORK: "hearth"
    # ── 10.10.0.1 IS THE WIREGUARD ADDRESS, AND IT IS NOT 0.0.0.0 FOR A REASON ──
    #
    # The application stack moved to a second machine on 2026-08-10 (micro-org#338).
    # This node stays here — it IS a chain — so the four consumers that used to reach
    # it over `docker0` (indexer, settlement, foresight and the gateway's three
    # `CF_*_UPSTREAM`s) now arrive from off-box and need an address that exists on
    # the wire.
    #
    # This RPC carries NO CREDENTIAL AT ALL. `estate-web.yml` says so plainly: `rpc.`
    # and `p2p.` are the only two hostnames in this estate that take work from a
    # stranger with nothing, and the only thing standing in front of them is a
    # Traefik rate limit keyed on `Cf-Connecting-Ip` — a limit that is worth
    # something ONLY because Traefik is the sole path in. Publishing on `0.0.0.0`
    # here would hand `eth_call` to anybody on the LAN and quietly retire that whole
    # argument. 10.10.0.1 is a WireGuard address: it is not reachable from the LAN at
    # all, only from the one peer whose public key is in `wg0.conf` on this host, so
    # "the only path in is controlled" stays true.
    #
    # wg0 must therefore be up before this container starts, or the bind fails and
    # compose says so loudly. That is the correct failure: a seed that came up
    # without the app's path to it is worse than one that refused to start.
    ports: !override
      - "127.0.0.1:8545:8545"     # Ethereum JSON-RPC     -> CF_RPC_UPSTREAM
      - "172.17.0.1:8545:8545"
      - "10.10.0.1:8545:8545"
      - "127.0.0.1:8645:8645"     # REST, /mining/*       -> CF_MINING_UPSTREAM
      - "172.17.0.1:8645:8645"
      - "10.10.0.1:8645:8645"
      - "127.0.0.1:8648:8648"     # P2P over WebSocket    -> CF_P2P_WS_UPSTREAM
      - "172.17.0.1:8648:8648"
      - "10.10.0.1:8648:8648"
    # 8646 (raw TCP gossip) is deliberately NOT published. It is the transport a
    # tunnel cannot carry, it has no in-estate consumer, and the two miners that
    # used it are the two services this file exists to keep down.
    restart: unless-stopped
    healthcheck:
      # ── IT PROBES 8545 TOO, BECAUSE THAT IS THE PORT THE ESTATE ACTUALLY USES ──
      #
      # This was `GET :8645/info` alone. `/info` is still the REST port's cheapest
      # truthful answer (`evmnode.js`), but 8645 is not the port anything in
      # this estate talks to: `CF_RPC_UPSTREAM`, the indexer, foresight and the
      # gateway all speak Ethereum JSON-RPC on 8545, and only `/mining/*` uses REST.
      #
      # The two are SEPARATE `http.createServer` listeners in one process —
      # `evmnode.js` (`listenRest`) and (`listenJsonRpc`) — and a bind
      # failure on either is reported with `this.error(...)` and
      # and is NOT fatal. So a node whose JSON-RPC never came up keeps running,
      # keeps answering `/info` 200, and reports HEALTHY while every consumer 502s.
      # A green light on a component nobody can reach is the failure this estate has
      # already been bitten by twice; one probe cannot cover two independent servers.
      #
      # ── AND IT PINS THE CHAIN ID, WHICH IS THE ONE THING /info CANNOT SELF-CHECK ─
      #
      # 7411 is `0x1cf3`, the id `HEARTH_NETWORK: "hearth"` above selects through
      # `params.js`. Pinning it here catches exactly the defect fixed in
      # `fix(chain): mainnet and testnet were two chains sharing one identity`: this
      # seed answered `"network":"hearth-testnet","chainId":7412` for weeks while
      # serving happily, so EIP-155 made every mainnet signature replayable on
      # testnet. Nothing at runtime would have said a word. Cross-checking the two
      # ports against each other would not have caught it either — both were 7412
      # together. Only a literal states which chain THIS file means, and this file is
      # mainnet-only, so the literal is honest rather than a shared-script guess (the
      # mistake `estate-verify.sh` made with a hardcoded `0x1cf4`).
      #
      # No curl in node:22-alpine; node itself is the one dependency guaranteed.
      test:
        - CMD
        - node
        - -e
        - |
          const h=require('http'),EXPECT=7411;
          const call=(o,b)=>new Promise((ok,no)=>{const q=h.request(o,r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>ok({c:r.statusCode,d}))});q.on('error',no);q.setTimeout(4000,()=>q.destroy(new Error('timeout')));q.end(b)});
          (async()=>{
            const i=await call({host:'127.0.0.1',port:8645,path:'/info'});
            if(i.c!==200) throw new Error('rest /info '+i.c);
            const p=await call({host:'127.0.0.1',port:8545,path:'/',method:'POST',headers:{'content-type':'application/json'}},'{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}');
            if(p.c!==200) throw new Error('json-rpc '+p.c);
            const rpc=parseInt(JSON.parse(p.d).result,16), rest=JSON.parse(i.d).chainId;
            if(rpc!==EXPECT) throw new Error('json-rpc chain '+rpc+' != '+EXPECT);
            if(rest!==EXPECT) throw new Error('rest chain '+rest+' != '+EXPECT);
          })().then(()=>process.exit(0),e=>{console.error(String(e&&e.message||e));process.exit(1)});
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
