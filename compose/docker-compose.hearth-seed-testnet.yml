# THE TESTNET ENVIRONMENT'S OWN SEED. A sibling of docker-compose.hearth-seed.yml.
#
#   cd ../hearth && docker compose -p cf-testnet-chain \
#     -f docker-compose.testnet.yml \
#     -f ../deploy/compose/docker-compose.hearth-seed-testnet.yml \
#     up -d hearth-testnet-seed
#
# Everything the mainnet-estate seed's header argues applies here unchanged:
# seed only (the two miners stay down by naming the service), HEARTH_DATA in a
# subdirectory so the retired UTXO history can never be read as account-model
# blocks, and both 127.0.0.1 and 172.17.0.1 published because a loopback-only
# node answers the operator and 502s every container.
#
# WHAT DIFFERS, AND IT IS ONLY THE THREE THINGS THAT WOULD COLLIDE:
#   container name  cf-hearth-seed-testnet   (names are global to the daemon)
#   host ports      87xx/88xx instead of 85xx/86xx
#   volume          namespaced by the `-p cf-testnet-chain` project
#
# THE CHAIN ID IS 7412 HERE AND 7411 ON THE OTHER ONE, WHICH IT WAS NOT.
# `node/src/params.js:37-38` maps hearth->7411 and hearth-testnet->7412, and this
# file used to record that BOTH seeds ran as `hearth-testnet` — two INDEPENDENT
# chains (separate volumes, separate genesis-forward history, no peering; 8646 is
# unpublished on both) sharing one identity. They could not merge, but a signed
# transaction was replayable from either to the other, because EIP-155 binds a
# signature to the chain id and to nothing else.
#
# The obstacle this file recorded was real and has been removed rather than
# worked around: `docker-compose.estate.yml` hardcoded `INDEXER_CHAINS:
# "ember:testnet"` and `INDEXER_RPC_EMBER_TESTNET`, and TWO OF THOSE THREE
# VARIABLES CARRY THE NETWORK IN THEIR NAME — which a compose `environment:` key
# cannot interpolate, which is why it stayed. They now live in
# `compose/env/chain.<network>.env`, loaded through an `env_file:` whose PATH is
# interpolated from `CF_EMBER_NETWORK`. The mainnet estate loads
# `chain.mainnet.env` and asserts 7411; this one loads `chain.testnet.env` and
# asserts 7412, at `indexer/src/evm.ts:471-480`, before it will write a block.
#
# This seed is unchanged. It was always `hearth-testnet` and it stays that way.
services:
  hearth-testnet-seed:
    container_name: cf-hearth-seed-testnet
    environment:
      HEARTH_DATA: /data/evm
    ports: !override
      - "127.0.0.1:8745:8545"     # Ethereum JSON-RPC  -> CF_RPC_UPSTREAM
      - "172.17.0.1:8745:8545"
      - "127.0.0.1:8845:8645"     # REST, /mining/*    -> CF_MINING_UPSTREAM
      - "172.17.0.1:8845:8645"
      - "127.0.0.1:8848:8648"     # P2P over WebSocket -> CF_P2P_WS_UPSTREAM
      - "172.17.0.1:8848:8648"
    restart: unless-stopped
    healthcheck:
      # The mainnet overlay carries the full argument; it applies here unchanged
      # except for the id. In short: 8645 (REST) and 8545 (Ethereum JSON-RPC) are
      # SEPARATE listeners in one process (`evmnode.js:411` and `:214`), a bind
      # failure on either is logged and not fatal (`:414`, `:217`), and 8545 is the
      # port the estate actually consumes — so probing only `/info` reports HEALTHY
      # on a node no consumer can reach.
      #
      # 7412 is `0x1cf4`. This seed is `hearth-testnet` and always was; the id is
      # pinned so that a seed which came up on the OTHER chain — the defect fixed in
      # `fix(chain): mainnet and testnet were two chains sharing one identity`, when
      # both seeds answered 7412 and EIP-155 made signatures replayable across them —
      # is caught by the healthcheck rather than by a replayed transaction.
      test:
        - CMD
        - node
        - -e
        - |
          const h=require('http'),EXPECT=7412;
          const call=(o,b)=>new Promise((ok,no)=>{const q=h.request(o,r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>ok({c:r.statusCode,d}))});q.on('error',no);q.setTimeout(4000,()=>q.destroy(new Error('timeout')));q.end(b)});
          (async()=>{
            const i=await call({host:'127.0.0.1',port:8645,path:'/info'});
            if(i.c!==200) throw new Error('rest /info '+i.c);
            const p=await call({host:'127.0.0.1',port:8545,path:'/',method:'POST',headers:{'content-type':'application/json'}},'{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}');
            if(p.c!==200) throw new Error('json-rpc '+p.c);
            const rpc=parseInt(JSON.parse(p.d).result,16), rest=JSON.parse(i.d).chainId;
            if(rpc!==EXPECT) throw new Error('json-rpc chain '+rpc+' != '+EXPECT);
            if(rest!==EXPECT) throw new Error('rest chain '+rest+' != '+EXPECT);
          })().then(()=>process.exit(0),e=>{console.error(String(e&&e.message||e));process.exit(1)});
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
