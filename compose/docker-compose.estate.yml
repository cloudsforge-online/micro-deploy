# The estate environment — every domain service that can be run, running together.
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────────
#
# Before it, `deploy/compose/` defined the telemetry stack and the gateway and
# NOT ONE OF THE TWENTY-TWO SERVICES. Forty-one repositories were pushed and
# green, ~5,600 tests passed, and there was no way to start a single service —
# let alone have two talk to each other. Nothing in this estate had ever been
# executed against anything else.
#
# That matters because of what the record shows. Every defect found in this
# programme so far was found by READING: six times a downstream consumer caught
# what an upstream's own suite could not; the reusable CI carried nine defects
# because it had never run; micro-brand's verifier failed on its own repository;
# the design system's dE figures cited a validator that did not exist. Things
# that have never been executed are wrong at a high rate here, and deployment had
# never been executed at all.
#
# This file began as a two-service slice (identity + ledger), grew to four, and
# is now the whole runnable estate. It kept the same shape at every step, because
# the shape is the point: a migrator that runs once, a service that asserts its
# schema and refuses to serve below it, a /readyz that probes the database, and a
# verification script that drives a REAL FLOW rather than counting containers.
#
# ── DEPENDENCY ORDER ───────────────────────────────────────────────────────────
#
# identity is upstream of nearly everything, via JWKS. Everything below is
# ordered by what it needs:
#
#   postgres  →  identity  →  { policy, ledger, pricing, activity, notify,
#                               studio, devplatform, analytics, indexer }
#                          →  custody (needs policy)
#                          →  the money and product tier (needs the above)
#                          →  hub-api, admin-api (BFFs, need almost everything)
#
# ── HOST PORTS ARE DERIVED, NOT CHOSEN ─────────────────────────────────────────
#
# 4100 + the service's index in micro-org's registry (`portFor`, cfctl.ts).
# The estate has already lost time twice to a hand-picked port that belonged to
# another service, so the number is derived from the one list that orders every
# repository. They bind to 127.0.0.1 only.
#
# Derived means POSITIONAL, and that is the sharp edge: a row inserted into the
# middle of the registry moves every port below it. That has already happened
# once — a 46→70 sweep moved sixteen of the thirty-nine pins in this file, in
# silence. `scripts/web-check.py` (`make check-web`) recomputes all of them and
# goes red on any disagreement; micro-org's `test/cfctl.test.ts` guards the other
# side by pinning the derived ORDER, because the test it had asserted the ports
# were DISTINCT — true before the sweep and after it, and not what broke.
#
# ── HOW TO RUN IT ──────────────────────────────────────────────────────────────
#
#   cd deploy && ./scripts/estate-up.sh          # build, migrate, bootstrap, verify
#
# Or by hand:
#   docker compose -f compose/docker-compose.estate.yml up -d --build
#   ./scripts/estate-bootstrap.sh                # the admin UPDATE and the tokens
#   ./scripts/estate-verify.sh
#
# Every value below is a THROWAWAY for a local environment. The secrets are
# literal and weak on purpose: a real one in a committed compose file is a real
# one in the fork network.

name: ${CF_PROJECT:-cloudsforge-estate}

# ── shared fragments ───────────────────────────────────────────────────────────
# ── `compose/.env` IS A COMMITTED SYMLINK, AND IT IS LOAD-BEARING ────────────
#
# Every credential below is `${NAME:-}` shell interpolation, so a plain
# `docker compose up` with no `--env-file` resolves ALL of them to EMPTY and
# silently reverts a service to a broken auth state. Two agents hit that in one
# night: one recreated `wallet` as a dependency of a web service and blanked
# `WALLET_IDENTITY_CREDENTIAL`; another ran `up -d --build ledger` and blanked
# `LEDGER_IDENTITY_CREDENTIAL`, producing a `no_credential` reconciliation. No
# error, no log line — the service starts and fails closed somewhere else.
#
# `compose/.env` -> `estate/tokens.env` fixes it, because Compose auto-loads
# `.env` from the project directory. The SYMLINK is committed and carries no
# secret; the TARGET is gitignored, untracked and absent from history.
#
# This is not the `env_file:` fan-out rule 9 refuses — that rule is about each
# service naming its own file. This is one project-wide default, and it is the
# mechanism Compose already provides.
#
# A dangling symlink is harmless and was measured: before `estate-bootstrap.sh`
# has minted anything, `docker compose config` succeeds with the target missing.
# So a fresh clone works, and the credentials appear the moment bootstrap writes
# them.

# Anchors rather than an `env_file:` fan-out. Rule 9 of 03 §2 — "a repo declares
# the variables it needs; the deploy provides exactly those" — and pricing's
# env.ts calls the fan-out out by name: handing every container the whole
# estate's secrets has nothing to justify it. Each service below still lists its
# own variables; what is shared here is only what is genuinely common to all.

x-build-contexts: &build-contexts
  runtimepkgs: ../../runtime
  contractspkgs: ../../contracts
  # `walletcore` is used by ONE image — beacon's — and is declared here with the other two anyway.
  # A named context that a Dockerfile never COPYs from costs nothing: buildkit resolves it and
  # never reads it. Giving beacon a build block of its own that differs from every other service's
  # by one line is how the next person copies the wrong one, and how a second anchor drifts from
  # this one. Beacon takes @cloudsforge/hearth-wallet-core because BJ-DEX-02 signs a real swap in
  # a browser that has no wallet extension; its own package.json records why it may not carry a
  # fourth copy of a signer instead.
  walletcore: ../../hearth-wallet-core

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: info
  CLOUDSFORGE_TAG: estate
  PORT: "4000"
  # ── THE NETWORK GATE, ARMED EVERYWHERE AT ONCE (micro-org#459 stage 2) ──────────────────────
  #
  # Every service's token verifier (@cloudsforge/runtime-auth) reads this as its expected
  # network: a verified token whose `net` claim names the OTHER estate is refused 401
  # `wrong_network`. This is the single line that makes the shared-identity migration safe —
  # without it a testnet service token with `ledger:post` passes at the mainnet ledger, because
  # receivers gate on scope, not network.
  #
  # Safe to arm ahead of the claim flowing: a token WITHOUT the claim is tolerated by design
  # (the rollout story, recorded at VerifierOptions.expectedNetwork), so today this refuses
  # nothing and starts protecting the moment identity's release mints the claim.
  AUTH_EXPECTED_NETWORK: ${CF_EMBER_NETWORK:-mainnet}

# ── THE ONE SECRET THIS FILE MAY NOT CONTAIN ──────────────────────────────────
#
# `CUSTODY_MASTER_SECRET_V<n>` — the keyring that decrypts every custodied private
# key and every HD seed on this host — was TWO HARDCODED LITERALS in this file,
# on the `custody` and `custody-migrate` blocks, in a repository `gh repo view`
# reports PUBLIC. Not an interpolation: the value itself, under a comment reading
# "Minimum 32 characters", which it was. `custody/src/crypto.ts` derives a
# per-address AES key from it with scrypt, so anybody who read this file and ever
# obtained the `custody-keys` volume — a backup, a disk, a stray `docker cp` —
# held the plaintext of all 387 blobs on it. It is not the address derivation
# (that is a per-user BIP-39 mnemonic, `custody/src/hd.ts`), so no address was
# forgeable from this file alone. It is every key at rest, and that is enough.
#
# WHY A FILE AND NOT `${...}` FROM `compose/estate/tokens.env`, which is the
# estate's existing gitignored mechanism and the obvious first answer. Two
# measured reasons, either of which is fatal on its own:
#
#   1. `tokens.env` IS REGENERATED. `scripts/estate-bootstrap.sh` does
#      `mv "$tmp" "$TOKENS_FILE"` — the file is replaced wholesale on every run.
#      A master secret living there would be silently replaced by a bootstrap,
#      and a replaced master secret is not a rotation: it is 387 blobs nothing
#      can decrypt, with no way back. This file is written once and never by a
#      script.
#   2. `tokens.env` DOES NOT REACH THE SECOND ENVIRONMENT. The testnet estate is
#      brought up with `--env-file compose/testnet.env`, which REPLACES the
#      default `.env` rather than adding to it. Measured on this host, not
#      assumed: `SMTP_USER` — set only in `tokens.env` — renders as `""` under
#      the testnet render and non-empty under the mainnet one. An interpolation
#      from `tokens.env` would therefore reach exactly one of the two live
#      stacks, and the other's custody would refuse to boot.
#
# An `env_file:` PATH is interpolated and is read relative to this file, so it is
# independent of whichever `--env-file` the operator passed — the same property
# the indexer's `env/chain.${CF_EMBER_NETWORK}.env` relies on, measured there on
# this host with Compose v5.1.1. `CF_EMBER_NETWORK` is set by `compose/testnet.env`
# and unset for the estate, so the two environments hold SEPARATE keyrings, which
# is what they should have held all along.
#
# `required: true` is the fail-closed half: a missing file stops `up` with the
# path in the message, rather than rendering an empty variable and leaving custody
# to exit on it after every dependent has already started waiting.
#
# NEITHER FILE IS IN GIT — `compose/secrets/` is ignored whole, a directory rule
# rather than a filename, because the filename here carries an environment suffix
# and the next environment's would not have been covered. The runbook for what is
# in them, how they are backed up and what a restore looks like is
# `runbooks/runbook-custody-master-secret.md`.
# The ITEM is anchored as well as the list, because two services need this file
# ALONGSIDE another one and a YAML anchor cannot merge two sequences. Without the
# item anchor the path would have to be retyped in those blocks, and a retyped
# path is one that drifts.
x-custody-secret-file: &custody-secret-file
  path: secrets/custody.${CF_EMBER_NETWORK:-mainnet}.env
  required: true

x-custody-secrets: &custody-secrets
  - *custody-secret-file

# ── THE EVENT-BUS KEY, AND WHY IT IS ONE FILE UNDER SEVERAL NAMES ─────────────
#
# The SAME HMAC key signs and verifies every outbox->inbox hop in the estate. It
# was a hardcoded placeholder in this PUBLIC file, on 54 lines across 24 services
# and 7 variable names — the services read it under different names, but there is
# and only ever was ONE key.
#
# So one file carries every alias. That is not a fan-out of unrelated secrets
# into containers that should not hold them: every one of these 24 services
# already holds this exact key, because it is the key they use to talk to each
# other. There is no separation here to lose.
#
# Same mechanics as `x-custody-secrets` above, for the same measured reasons:
# an `env_file:` PATH is interpolated and read relative to THIS file, so it is
# independent of whichever `--env-file` the operator passed, and `tokens.env` is
# not usable (estate-bootstrap.sh rewrites it wholesale, and the testnet
# `--env-file compose/testnet.env` drops it entirely). `required: true` is the
# fail-closed half. `compose/secrets/` is gitignored whole.
#
# Rotation is STAGED, never swapped — a sender on the new key talking to a
# receiver on the old one is a silent partition, not an error anyone would see.
# `OUTBOX_ACCEPT_SECRETS` (and the *_INGEST_SECRETS lists) hold BOTH keys for the
# cutover window while `OUTBOX_SIGNING_SECRET` holds the one being signed with.
# Runbook: runbooks/runbook-outbox-signing-secret.md
x-outbox-secret-file: &outbox-secret-file
  path: secrets/outbox.${CF_EMBER_NETWORK:-mainnet}.env
  required: true

x-outbox-secrets: &outbox-secrets
  - *outbox-secret-file

# ── IDENTITY'S KEY-ENCRYPTION KEYRING, AND ANALYTICS'S PEPPER ─────────────────
#
# Both were hardcoded literals in this PUBLIC file — `IDENTITY_KEY_SECRET`
# (fingerprint 6ab33c683a65) and `ANALYTICS_PSEUDONYM_KEY` (bcd734b7c127), the
# SAME value on both networks, so testnet derived mainnet's pseudonyms. #188 and
# #189. Neither could be rotated as a compose edit, and the reasons differ:
#
#   identity  `IDENTITY_KEY_SECRET` is not a token-signing key — tokens are RS256
#             under per-kid keys with real JWKS rotation. It is the KEK that WRAPS
#             those keys and every TOTP seed. One value with no accept-list meant
#             replacing it made every blob undecryptable at once. A signing key
#             re-bootstraps; a TOTP seed does not — it exists in that blob and in
#             the user's authenticator app and nowhere else, so a naive rotation
#             does not invalidate MFA, it DESTROYS it.
#
#   analytics `ANALYTICS_PSEUDONYM_KEY` derives STORED pseudonyms. Replacing it
#             re-derives every returning subject to a new lookup key, so one
#             person becomes two, their history is orphaned, and erasure stops
#             reaching pre-rotation rows — a GDPR problem, not a tidiness one.
#
# Both now hold a VERSIONED RING (`_V<n>` plus a `*_VERSION` naming the writer),
# so old data keeps opening while new data is written under the new value. The
# asymmetry that matters operationally is how the old value is retired:
#
#   identity  DRAINS. `pnpm rewrap` re-seals every blob under the new version;
#             when nothing remains below it, delete the old line. Runbook:
#             runbooks/runbook-identity-key-secret.md
#   analytics CANNOT DRAIN, ever. `lookup_key` is HMAC(pepper, subject) and the
#             raw subject is never stored, so a mapping cannot be recomputed
#             under a new pepper. The old pepper stays until retention prunes
#             every pre-rotation row. Runbook:
#             runbooks/runbook-analytics-pseudonym-key.md
#
# Same file mechanics and the same measured reasons as the two blocks above:
# `tokens.env` is rewritten wholesale by estate-bootstrap.sh and does not reach
# the testnet render, and an `env_file:` PATH is interpolated relative to THIS
# file, so `CF_EMBER_NETWORK` gives the two environments genuinely separate
# values — which is what closes the cross-network derivability in #189.
#
# `environment:` WINS over `env_file:` in Compose, so the literals these replace
# are DELETED above rather than left commented out: a reinstated line would
# silently override the file and put the published value back.
x-identity-key-file: &identity-key-file
  path: secrets/identity-key.${CF_EMBER_NETWORK:-mainnet}.env
  required: true

x-analytics-pepper-file: &analytics-pepper-file
  path: secrets/analytics-pepper.${CF_EMBER_NETWORK:-mainnet}.env
  required: true

# ── THE IMAGE MODEL'S CREDENTIALS ─────────────────────────────────────────────
#
# `AZURE_FOUNDRY_ENDPOINT` and `AZURE_FOUNDRY_API_KEY` for FLUX 2 Pro. Same
# mechanics and the same reasons as the two blocks above: interpolated on
# `CF_EMBER_NETWORK` rather than hardcoded, so the second environment is covered
# by the rule instead of by somebody remembering to add a file — which is the
# near-miss `.gitignore` records for `docker-compose.release.testnet.yml`.
#
# ONE RESOURCE PER ENVIRONMENT, NOT ONE SHARED. The two files are separate even
# though a single Foundry resource could serve both, because generation is
# METERED and billed: a shared key makes testnet's spend indistinguishable from
# mainnet's on the invoice, and a leaked testnet key would have to be rotated on
# mainnet too.
#
# WHAT THIS CHANGES, WHICH IS EVERYTHING ABOUT THIS SERVICE. Until now studio
# had NEVER generated an image: `env.ts` returns `flux: null` when the
# endpoint is unset and the placeholder backend answers instead. All 40 assets
# in the live database came from it, each with an empty model. So this is not a
# configuration tidy-up — it is the difference between a service that draws and
# one that has only ever pretended to.
#
# `STUDIO_IMAGE_MODEL` is deliberately NOT set here: `env.ts` already
# defaults it to `FLUX.2-pro` whenever the endpoint is present, and
# `AZURE_FOUNDRY_IMAGE_PATH` likewise defaults to the flux-2-pro provider path.
# Restating either would be a second source of truth for a value the service
# already knows.
#
# Both halves or neither — `env.ts` refuses to boot on one without the
# other, because "an endpoint with no key looks exactly like a key that has been
# revoked". `required: true` below is the other half of that: a missing file is
# a container that stops, not one that quietly draws placeholders again.
x-studio-secret-file: &studio-secret-file
  path: secrets/studio.${CF_EMBER_NETWORK:-mainnet}.env
  required: true

# ══════════════════════════════════════════════════════════════════════════════
# THE TWO VARIABLES WITHOUT WHICH NOTHING IN THIS ESTATE CAN BE WITHDRAWN.
#
# Neither appeared anywhere in this file, and between them they closed the money-
# out path for EVERY asset, not merely for the ones nobody had wired yet. Both
# are anchors rather than repeated literals because each is read by a service AND
# by its migrator (both import the eagerly-loaded `env.ts`), and a value that
# differs between the two is a schema migration running under a configuration the
# service will not itself accept.
#
# ── WALLET_FEE_QUOTES — ABSENT, SO EVERY WITHDRAWAL WAS REFUSED 503 ───────────
#
# `wallet/src/env.ts` reads it with a default of `'{}'`, `wallet/src/index.ts`
# wires that empty table into `staticFeeQuoter`, and `wallet/src/settlement.ts`
# throws `FeeUnavailableError` for any asset the table does not name. The route
# turns that into 503 `fee_unavailable` at `wallet/src/withdrawals.ts`,
# BEFORE the idempotency claim and before any ledger reservation — so the estate
# has been refusing every withdrawal of every asset, safely and silently, for as
# long as this file has existed. `micro-beacon` recorded it from the outside
# (`beacon/src/browser/walletjourneys.ts,307`) and was right.
#
# ── WHY EMBER WAS THE ONLY ENTRY, AND WHY THIS TABLE IS SHORTER THAN THE CHAINS ─
#
# `staticFeeQuoter`'s docstring states the rule this file is obeying: an operator
# STATES the fee, and an asset absent from the table is refused "rather than
# priced by guessing". When this note was written the estate followed one chain
# and the sentence here said so; `INDEXER_CHAINS` in `env/chain.mainnet.env` now
# reads `ember:mainnet,ltc:mainnet,btc:mainnet`, and that is deliberately NOT the
# same list as this table.
#
# **This table is what opens a deposit, and `INDEXER_CHAINS` is not.** `wallet`
# gates observability behind `payableChainsOnly` with the payability half
# OUTERMOST, so an asset absent here is one the estate neither offers an address
# for nor credits, however well the indexer can see it. That is still what the
# table is for, and the BTC row below is what taking the decision looks like
# rather than a reason to stop drawing the distinction: DOGE and ETC are one
# line away in `INDEXER_CHAINS` and neither would become depositable, because
# neither is named here.
#
# 21000000000000 is MEASURED, not copied: `eth_gasPrice` on this estate's own
# hearth-seed answers 0x3b9aca00 (1 gwei) and a plain transfer is 21000 gas, so
# 21000 x 1e9 = 2.1e13 wei = 0.000021 EMBER at 18 decimals
# (`contracts/packages/chain/src/index.ts`). It agrees with the figure
# `wallet/src/testsupport.ts` has always used, which is a check, not the source.
#
# A STRING, not a number: `parseFeeQuotes` converts with `BigInt` and never
# `Number`, because an EVM fee routinely exceeds `Number.MAX_SAFE_INTEGER` and a
# float would round the number a withdrawal is priced at.
#
# ── LTC: 10,000 litoshis = 0.0001 LTC, ~USD 0.0045 at the rate `pricing` quotes live ─────────
#
# This entry has been through two rounds of argument and the second one overturned the first, so
# both are kept: the paragraph that said LTC "must stay absent until an LTC node exists" was
# written when there was no Litecoin node on this host. There is one now — `litecoind 0.21.5.6`,
# `-datadir=/data/chains/litecoin`, started from `/etc/rc.local`, measured synced at 3,156,498
# blocks with `initialblockdownload:false`. The fail-closed rule it invoked was right; the fact
# it rested on stopped being true. That is the pattern worth recognising: a comment that argues
# from a measurement outlives the measurement.
#
# ── `estimatesmartfee` WILL NEVER ANSWER ON THIS NODE, SO NOTHING WAITS FOR IT ────────────────
#
# This note used to close with "REVISIT once `estimatesmartfee` answers". That is a condition
# that cannot arrive, and leaving it standing left a real number looking provisional. Measured
# with the node synced, up three hours, ten peers:
#
#     estimatesmartfee 2|6|12|24|144 -> {"errors":["Insufficient data or no fee rate found"]}
#     getmempoolinfo                 -> size 0, mempoolminfee 0.00001
#     litecoin.conf                  -> blocksonly=1
#
# `blocksonly=1` means the node does not accept relayed transactions into its mempool at all.
# The fee estimator learns by watching transactions enter a mempool and later confirm, so with
# no mempool it has nothing to learn from — and the mempool is empty because it is configured to
# be, not because Litecoin is quiet. The same 144 blocks carried 53,590 transactions. Dropping
# `blocksonly` is the wrong trade on a box running two chains beside sixty containers at `par=3`.
# Filed as micro-org#268. Bitcoin's node here carries the same posture, so BTC will land in the
# same place.
#
# ── SO THE QUOTE IS DERIVED FROM CONFIRMED BLOCKS, WHICH IS GROUND TRUTH ANYWAY ───────────────
#
# `getblockstats` reports `feerate_percentiles` per block. It is built from transactions that
# actually confirmed rather than from a forecast, and it works fine under `blocksonly`. Measured
# over blocks 3,156,352-3,156,495 (144 blocks, 53,590 transactions), in sat/vB:
#
#     block's 10th-pct feerate   median 1    p90 1     max 3
#     block's 50th-pct feerate   median 5    p90 5     max 10
#     block's 90th-pct feerate   median 11   p90 36    max 529
#     block's average feerate    median 12   p90 22    max 149
#
# A 1-in-2-out P2WPKH spend is ~141 vB, so 10,000 litoshis buys that transaction ~70 sat/vB —
# comfortably above the median-block-median of 5 and above the p90-of-p90 of 36, with room for a
# multi-input sweep. Erring high costs the user under half a cent; erring low leaves a withdrawal
# stuck. The figure is unchanged from when it was first written against `minrelaytxfee`; what
# changed is that it is now backed by a fee market read rather than by a relay floor.
#
# ── BTC: 3,000 satoshi = 0.00003 BTC, ~USD 1.92 at the rate `pricing` quotes live ─────────────
#
# The paragraph above this one used to end "BTC is followed and has no entry: adding one is the
# separate decision described in `settlement/src/bitcoin.ts`". This is that decision, taken on
# 2026-08-11, and it is taken now rather than earlier because the two things it was waiting on
# both landed first and neither of them was this variable:
#
#   * **A UTXO source.** micro-org#382 — every node here runs `disablewallet=1`, so `listunspent`
#     answered `-32601` and a Bitcoin withdrawal could not choose coins at all. settlement 2.5.21
#     takes candidate outpoints from the indexer and re-reads each one with `gettxout`, which is a
#     chainstate RPC and needs no wallet.
#   * **A fee source.** micro-org#383 and the `deriveFeeRateFromBlocks` block in
#     `settlement/src/bitcoin.ts`. `estimatesmartfee` is not merely quiet on this node, it is
#     absent: Core 25 and later do not construct an estimator under `blocksonly`, and the node
#     answers `-32603 Fee estimation disabled`. Confirmed blocks answer instead.
#
# ── WHAT THE CHAIN ACTUALLY COSTS TODAY, READ FROM THE ESTATE'S OWN NODE ───────────────────────
#
# `getblockstats` over Bitcoin mainnet blocks 961,937-961,960 (24 blocks, 123,944 transactions),
# 2026-08-11, in sat/vB:
#
#     block's 10th-pct feerate   median 0    p90 0     max 0
#     block's 50th-pct feerate   median 0    p90 2     max 2
#     block's 90th-pct feerate   median 2    p90 4     max 5
#     block's average feerate    median 1    p90 2     max 5
#
# Thirteen of those twenty-four blocks report a 50th-percentile feerate of ZERO, which is not a
# quiet-chain artefact — it is what an unfull block looks like when half its weight paid nothing
# above the relay floor. settlement declines to call that a fee market reading: its window needs
# more than half the blocks it asked about to carry a usable percentile, and with 11 of 24 it
# returns `null` and takes the 1 sat/vB relay floor. So a Bitcoin withdrawal built on this estate
# today costs about 141 satoshi — 1 sat/vB across a 141-vB 1-in-2-out P2WPKH spend — or USD 0.09.
#
# ── SO WHY 3,000 AND NOT 141 ───────────────────────────────────────────────────────────────────
#
# Because this number is a STATED price and the market it covers is the one that moved by two
# orders of magnitude inside a week, more than once. 3,000 satoshi buys 21 sat/vB on that 141-vB
# spend and 8 sat/vB on a 350-vB three-input one — above every rate this node has measured, with
# an order of magnitude of headroom for the day it is not. In ratio it is TIGHTER than the LTC
# entry above, which quotes 70 sat/vB against a chain building at 1.
#
# ── AND WHAT HAPPENS WHEN THE MARKET GOES ABOVE IT, STATED PLAINLY ────────────────────────────
#
# **Nothing gets stuck.** This is not a fee budget the build is clamped to — settlement builds at
# the rate it derives, and `settlement/src/fees.ts` books what was burned as a platform expense
# against `(platform, BTC, payout_due)`. So a spike above 21 sat/vB means the platform absorbs the
# difference and every withdrawal still confirms; it is a P&L line, not an outage. The permanent
# repair is the one `wallet/src/settlement.ts` already names — swapping `staticFeeQuoter` for
# `httpFeeQuoter`, so the user is quoted what settlement is about to pay — and that swap is a
# one-line change in `wallet/src/index.ts` that this entry does not block.
x-wallet-fee-quotes: &wallet-fee-quotes '{"EMBER":"21000000000000","LTC":"10000","BTC":"3000"}'

# ── SETTLEMENT_RPC_URLS — ABSENT, SO NOTHING COULD BE BUILT OR BROADCAST ──────
#
# The brief that sent me here said this needed "an `ltc` entry". It needed more
# than that: the variable was absent ENTIRELY, so `settlement/src/env.ts`
# resolved it to `{}` and EVERY chain was endpointless. Measured on the live
# estate rather than inferred — settlement's own boot line reports
# `chains:[{ember,endpoint:false},{eth,false},{btc,false},{sol,false},{ltc,false}]`
# (`settlement/src/index.ts`). So this is not a Litecoin gap. An EMBER
# withdrawal reaching settlement would `eth_chainId`/`eth_getTransactionCount`/
# `eth_getBalance` at `settlement/src/evm.ts`, get `NoEndpointError`, and
# be classified `endpoint` with a refund at the deadline
# (`settlement/src/withdrawals.ts`). `GET /v1/fees/...` 503s for the same
# reason (`settlement/src/server.ts,495`).
#
# `ember` points at the same node the indexer follows and by the same expression,
# so the follower and the broadcaster cannot disagree about which chain this is —
# see the note on `INDEXER_RPC_EMBER_MAINNET` in `env/chain.mainnet.env`.
#
# ── `ltc` IS SUPPLIED ONLY WHEN AN OPERATOR HAS A NODE, AND THAT IS THE POINT ─
#
# `LTC_RPC_URL` unset leaves the key out, which leaves `NoEndpointError` standing.
# That refusal is CORRECT and is not being softened: it is a named, permanent,
# operator-actionable classification, and pointing the key at a node that is not
# there would replace it with a connection failure classified `unclassified`
# (`settlement/src/withdrawals.ts`) — a round trip per tick, telling nobody.
# Absent beats wrong. Set the variable and the entry appears with no code change.
#
# ── OF THE TWO BLOCKERS THIS NOTE USED TO LIST, ONE IS GONE AND ONE IS NAMED ──
#
# It said there was no Litecoin node on this host and that mainnet Litecoin was
# not a thing this ProLiant could sync beside two Hearth chains and 60 containers.
# It could and it did. `litecoind 0.21.5.6` runs from `/etc/rc.local` on
# `-datadir=/data/chains/litecoin`, measured at 3,156,498 blocks with
# `initialblockdownload:false`. `LTC_RPC_URL` is set in `compose/estate/tokens.env`
# and settlement's own boot line now reports `{"chain":"ltc","endpoint":true}`.
#
# **The second blocker is the whole of what remains, and it is one line of
# transport code.** `settlement/src/registry.ts` builds its client with
# `baseUrl: parsed.origin`, and `URL.origin` DISCARDS userinfo — so an endpoint
# written `http://user:pass@host:50002` sends no `Authorization` header and
# Litecoin Core answers 401. There is no cookie-auth path either. Measured from
# inside the running settlement container, against the endpoint it already holds:
#
#     NO-AUTH   (baseUrl = parsed.origin, what registry.ts does today) -> 401
#     WITH-AUTH (Authorization: Basic base64(user:pass))               -> 200,
#                                          blocks=3156498, ibd=false
#
# So the estate can take custody of Litecoin and cannot send it back, and the
# reason has nothing to do with Litecoin. Filed as micro-org#267 against
# `micro-settlement`, which owns it. It will block BTC and DOGE identically —
# same family, same auth scheme — so it is worth fixing before those are wired
# rather than discovering it three more times.
#
# ── `btc` IS SET, AND UNLIKE `ltc` IT WAS NEVER THE NODE THAT WAS MISSING ────
#
# Bitcoin is the third key on this map and the first one added after the estate
# split across two hosts. Measured on the chain host 2026-08-11:
# `bitcoind 27.0` from `/etc/rc.local` on `-datadir=/data/chains/bitcoin`, block
# 961,956, headers equal, `initialblockdownload:false`, `pruned:false`,
# `txindex=1`, 866G on disk. So the node that DOGE is still waiting to become,
# Bitcoin already is.
#
# What was missing was narrower and much quieter. `BTC_RPC_URL` is set in
# `compose/estate/tokens.env`, MAINNET ONLY, exactly as `LTC_RPC_URL` is — but
# the credential the INDEXER held for the same node had never matched
# `bitcoin.conf`'s `rpcauth`, so bitcoind had answered it 401 on every poll since
# the chain host was stood up. Nothing surfaced: the retry logs at `warn`, and an
# address with no observed rows reads exactly like an address with no coins. Both
# credentials were rotated together on 2026-08-11 (micro-org#383) and the node
# restarted cleanly to pick the new `rpcauth` up; `rpcauth` is read once at
# daemon startup and nowhere else.
#
# ── AND THE KEY ALONE WOULD STILL NOT HAVE BUILT A TRANSACTION ───────────────
#
# Every node in this estate runs `disablewallet=1` — verified on the chain host
# 2026-08-11 for `bitcoin.conf`, `litecoin.conf` and `dogecoin.conf`. `listunspent`
# is a WALLET rpc, so all three answer it `-32601 Method not found`, and a
# bitcoin-family sweep built on it would have found nothing to spend no matter how
# synced the chain was or how correct the credential. micro-org#382 moved the
# proposal to the indexer and left the ADJUDICATION on the node: settlement asks
# the indexer which outpoints an address has, then re-reads each one with
# `gettxout` (chainstate, no wallet) and signs the node's value, script and depth
# rather than the record's. Shipped in `micro-settlement 2.5.21` /
# `micro-indexer 2.5.20`. This key is what those two releases spend.
#
# ── `doge` AND `etc`, WIRED AND DELIBERATELY UNSET (micro-settlement#8) ───────
#
# micro-settlement#8 gave both chains a real adapter — DOGE reuses `bitcoin.ts`
# with its own address kind, dust floor, relay floor and fee ceilings; ETC reuses
# `evm.ts` unchanged because it is pre-London and that builder has only ever
# signed legacy type-0. Both are OPTIONAL KEYS ON THIS MAP AND NOTHING ELSE.
# `settlement/.env.example` says so in as many words: "THIS IS THE ONLY PLACE A
# CHAIN IS TURNED ON, AND THERE IS NO PER-CHAIN VARIABLE TO ADD" — a
# `SETTLEMENT_DOGE_RPC_URL` here would be a second answer to a question this map
# already answers, and the two would disagree the first time somebody edited one.
# That is rule 9 of docs/ecosystem/03 §2, which is why the service did not add
# the variables and why this file must not add them either.
#
# WITHOUT THE KEYS THE CHAINS ARE NOT MERELY OFF, THEY ARE MISREPORTED. Both are
# in `contracts-chain`, so wallet will mint a deposit address and custody will
# hold it; settlement reports `no_endpoint` in its boot line and refuses each
# request by name (`chainStatuses`, `settlement/src/index.ts`). That refusal is
# the correct and permanent one, and the same argument the `ltc` note above
# makes applies unchanged: absent beats wrong, because a key pointed at a node
# that is not there turns a named operator-actionable classification into an
# `unclassified` connection failure that costs a round trip per tick and tells
# nobody.
#
# SO BOTH SHIP UNSET, AND THE MEASUREMENTS ARE WHY. Read on the estate host
# 2026-08-09. The UTXO and EVM nodes here are HOST PROCESSES rather than
# containers — `pgrep -a dogecoind` finds them, binaries under
# `/data/docs/<coin>-<version>/bin/`, data under `/data/chains/<coin>`:
#
#   DOGE  `dogecoind 1.14.9` IS running, `-dbcache=450 -par=1
#         -maxconnections=24`, RPC bound inside the docker bridges. NOT READY:
#         5,009,958 of 5,606,914 blocks, `verificationprogress` 0.3607,
#         `initialblockdownload: true`. A node in IBD answers
#         `getblockchaininfo` happily and lies about everything that matters —
#         an unspent output it has not reached yet is one it will report as
#         absent, so a sweep would be built against a balance that is a third of
#         a chain out of date.
#   ETC   NO NODE RUNS ON THIS HOST. `core-geth 1.12.22` is unpacked at
#         `/data/docs/core-geth-1.12.22`, the datadir exists at
#         `/data/chains/ethereum-classic` -> `/data2/chains/ethereum-classic`
#         (1.9G, plus a 1.8G `.old` beside it), and `/etc/rc.local` carries a
#         COMMENTED-OUT launch line for it on port 8555 — 8545 belongs to the
#         Hearth seed node. Its log stops on 2026-08-08 at `state download in
#         progress synced=4.41%` followed by `Rewinding blockchain to block
#         target=411,330`. So the intent is recorded, the sync is 4% done and
#         abandoned, and no process is listening.
#
# Both entries therefore exist as INTERPOLATIONS and neither is set anywhere. An
# operator who finishes either sync sets one variable in
# `compose/estate/tokens.env` and the key appears, with no change to this file
# and no change to the service — which is the whole property being bought here,
# and the same one `ltc` already demonstrated.
#
# THE `${VAR:+,"key":"$VAR"}` FORM IS LOAD-BEARING AND IS NOT DECORATION. An
# unset variable must contribute NOTHING — not an empty entry. `,"doge":""`
# would parse as JSON and then be refused by `jsonMap` with
# `SETTLEMENT_RPC_URLS.doge must be a non-empty string`, which is thrown at
# import from an eager `env.ts`: a boot failure, on the migrator as well as the
# service, taking settlement down for the chains that ARE configured. A stray
# comma is worse still — the value stops being JSON at all and the same import
# throws before anything else is read. `scripts/check-settlement-rpc-urls.py`
# renders this anchor through real `docker compose` in all sixteen combinations
# of the four optional variables and asserts every one is valid JSON with no empty
# value, because the failure it guards is one nobody sees until a container will
# not start.
x-settlement-rpc-urls: &settlement-rpc-urls
  '{"ember":"${EMBER_RPC_URL:-http://host.docker.internal:8545}"${BTC_RPC_URL:+,"btc":"$BTC_RPC_URL"}${LTC_RPC_URL:+,"ltc":"$LTC_RPC_URL"}${DOGE_RPC_URL:+,"doge":"$DOGE_RPC_URL"}${ETC_RPC_URL:+,"etc":"$ETC_RPC_URL"}}'

# ══════════════════════════════════════════════════════════════════════════════
# WHICH NETWORK THE MONEY TIER THINKS IT IS ON — AND IT WAS NOT THIS ONE.
#
# `WALLET_NETWORK` and `SETTLEMENT_NETWORK` both default to `testnet`
# (`wallet/src/env.ts`, `settlement/src/env.ts`) and NEITHER was set here.
# `INDEXER_CHAINS` and `LEDGER_RECONCILE_NETWORK` were set, to `mainnet`. So on
# the mainnet estate the money tier was split down the middle, and every symptom
# of it looked like something else:
#
#   1. **Every EMBER withdrawal was refused 409 `asset_frozen`.** wallet
#      registers each deposit address with the indexer under ITS network, so the
#      watch rows landed on `ember:testnet` (measured: indexer logs
#      `address watched … network:"testnet" by:"wallet"`). ledger then asked for
#      `ember:mainnet` and the indexer answered, correctly and loudly,
#      `no_custody_addresses` — "no watched address on ember:mainnet carries a
#      custody label, which is not the same as holding nothing". Reconciliation
#      failed, and a chain-backing that cannot be observed freezes the asset.
#      The freeze was RIGHT. What it was reporting was this line's absence.
#   2. **The mainnet estate minted testnet deposit addresses.** `tb1q…` for BTC
#      and `tltc1…` for LTC, on the estate serving `cloudsforge.online`. Custody
#      derives from the network wallet asks for, so the address is exactly as
#      wrong as the request that produced it — and it is well-formed, so nothing
#      throws.
#
# Derived from `CF_EMBER_NETWORK`, the same variable that selects
# `env/chain.${CF_EMBER_NETWORK}.env` and the custody and outbox secret files, so
# there is ONE answer to "which network is this" and no way to set half of it.
# The default matches those: `mainnet`.
#
# ── WHAT THIS DOES NOT DO ─────────────────────────────────────────────────────
#
# It does not migrate the `deposit_address_assignments` rows already written on
# `testnet`. They stay, inert: the partial unique index is on
# `(user_id, asset_code, network)` (`wallet/src/migrations.ts`), so an
# existing user's next request mints a fresh MAINNET address rather than
# colliding. Anyone holding one of the old testnet addresses would be holding an
# address this estate no longer watches. That exposure is bounded and was checked
# before changing this: the ledger's EMBER custody total is 3 EMBER, all of it
# the estate's own faucet and treasury, and the three assets whose addresses this
# most affects (BTC, ETH, SOL) could not be issued at all until 2026.08.4.
x-money-network: &money-network ${CF_EMBER_NETWORK:-mainnet}

# The JWKS seam. Every service that verifies a token fetches identity's keys over
# a real network here, which is the thing no unit suite could reach.
x-identity-trust: &identity-trust
  # ── ONE IDENTITY FOR BOTH ESTATES (micro-org#459 stage 2/step 3) ────────────────────────────
  #
  # IDENTITY_ISSUER stays the LITERAL on both estates, deliberately: it is the `iss` CLAIM
  # string, tokens minted by the surviving identity carry exactly `http://identity:4000`, and a
  # verifier expects the string, not a route. What moves per estate is where the KEYS and the
  # EXCHANGE actually live: unset (mainnet), both default to the local identity container;
  # testnet.env points them at the mainnet identity's public endpoints through the tunnel —
  # measured before this landed: the JWKS answers 200 and the exchange refuses a bad body 401
  # via nimbus.cloudsforge.online, which is reachable exactly the same way from either project.
  #
  # The `net` claim is what makes this SAFE rather than merely possible: service tokens name
  # their estate (micro-identity#19/#20), every verifier is armed (AUTH_EXPECTED_NETWORK on
  # x-common-env), and a person's token deliberately carries no claim so one login serves both.
  IDENTITY_ISSUER: http://identity:4000
  IDENTITY_JWKS_URL: ${CF_IDENTITY_JWKS_URL:-http://identity:4000/.well-known/jwks.json}
  IDENTITY_URL: ${CF_IDENTITY_URL:-http://identity:4000}

# ── THE PROBE SPAWNS A NODE RUNTIME, SO ITS INTERVAL IS A CAPACITY DECISION ────
#
# `node -e` is a whole process: measured at **0.387s of CPU per probe** on the
# ProLiant. At the 3s interval this used to carry, ~46 containers meant about 15
# process spawns a second, and the healthchecks alone accounted for **roughly 218%
# of that box's 400%** — more than half a four-core machine spent asking services
# whether they were ready. It was the single largest consumer on the host, ahead
# of every service, and it is what made a second environment look impossible on
# hardware that can in fact carry one.
#
# The split below is strictly better than either a fast or a slow interval alone,
# because startup and steady state want opposite things:
#
#   start_interval 2s   during start_period, probe FASTER than the old 3s, so
#                       `up --wait` and `depends_on: service_healthy` settle
#                       sooner rather than later. Failures here are not counted.
#   interval 30s        afterwards, 10x less often. A ready service that has been
#                       ready for an hour does not need asking every 3 seconds.
#   retries 3           3 x 30s = 90s to unhealthy, which is exactly what 30 x 3s
#                       gave before. Detection time is unchanged.
#
# Needs Docker >= 25 for `start_interval` (the estate runs 29.x).
x-healthcheck: &healthcheck
  # /readyz, not /livez: liveness answers while the database is unreachable,
  # which is the whole distinction those two endpoints exist to draw.
  test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 90s
  start_interval: 2s

# The same probe, against 4022 — one of the TWO services in this file that do
# not bind 4000. See the `tessera` block for why that is deliberate and must not
# be "tidied" by setting PORT=4000 on it.
x-healthcheck-4022: &healthcheck-4022
  test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4022/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 90s
  start_interval: 2s

# And against 4021 — `foresight`, the second. Same argument as tessera's, and it
# is NOT the aetherholm/nda case: see the long note in the `foresight` block for
# why the two are distinguished by WHICH number a service binds, not by the fact
# that it is not 4000.
x-healthcheck-4021: &healthcheck-4021
  test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4021/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 90s
  start_interval: 2s

x-migrate-defaults: &migrate-defaults
  command: ["node", "--import", "tsx", "src/migrator.ts"]
  # `no` IS THE POLICY HERE, and it is a decision rather than an omission.
  #
  # A migrator runs once and exits 0, and `unless-stopped` restarts a container
  # that exits for ANY reason, including success. A migrator under that policy
  # runs its migrations again on every daemon start, forever — and the ones that
  # are not idempotent would fail on the second pass, so the estate would come
  # back from a reboot with a container in a crash loop and a `depends_on:
  # service_completed_successfully` that never completes.
  #
  # This is what distinguishes a real exception from an unanswered question, and
  # it is why the `restart:` on this line is spelled out beside the one below.
  restart: "no"

# ── AND EVERY LONG-RUNNING SERVICE, WHICH 30 OF THEM DID NOT HAVE ─────────────
#
# Compose has no default restart policy, so a service with no `restart:` key gets
# Docker's default, which is `no` — the container stays down after a host reboot,
# a `systemctl restart docker`, or an OOM kill, and nothing starts it again.
#
# That is what this file had. Measured with `docker inspect` over the running
# estate before this anchor existed: the frontends restarted, because
# `x-web-defaults` happens to carry `restart: unless-stopped`; the migrators did
# not, correctly, because `x-migrate-defaults` says so. EVERY OTHER SERVICE had
# no policy at all — all 29 APIs and, worst of all, `postgres`. So a reboot of
# the host brought back fifteen frontends, each of them talking to nothing, and
# the database and every API they call stayed down until a person noticed.
#
# The split was never designed. It is the shape of "whichever anchor a service
# happened to use", and the two anchors that existed were both written for
# reasons that had nothing to do with restarting. A service that MUST NOT restart
# is a real category — the migrators above, the three root one-shots below — and
# each of those says why. A service that merely never had the question asked is
# not a category, and this is the anchor that ends it.
#
# `unless-stopped` rather than `always`: the difference is what happens after an
# operator deliberately stops a container. `always` brings it back when the
# daemon restarts even then, which turns `docker stop` into something that does
# not survive a reboot and makes taking one service out for maintenance
# impossible to express. `unless-stopped` restarts everything the operator did
# not deliberately stop, which is the intent in every case here.
#
# This does NOT make the estate self-healing, and it should not be read that way:
# a service that crash-loops on a bad config will crash-loop faster. What it
# changes is the unattended case — a home host that reboots at 4am comes back
# whole instead of coming back as a frontend serving errors.
x-service-defaults: &service-defaults
  restart: unless-stopped

# ── the frontends ──────────────────────────────────────────────────────────────
#
# `uipkg` is the named build context every frontend's Dockerfile expects, and it
# is the whole reason a frontend could not be containerised from a single
# checkout: `@cloudsforge/ui` is consumed as `link:../ui/packages/ui`, a symlink
# into a SIBLING REPOSITORY, so a build context rooted at the app contains a
# dangling link and nothing else. The reusable web CI workflow carried exactly
# this defect — one checkout, zero callers, and unable to work if it had any.
#
# The named context is what makes the symlink resolvable: the Dockerfile copies
# `packages/ui` to /ui/packages/ui and `tsconfig.base.json` to /ui, which is
# precisely where `link:../ui/packages/ui` points from /app. If this anchor is
# ever dropped, every frontend build fails at `pnpm install --frozen-lockfile`
# rather than producing an image that boots and serves nothing — which is the
# failure mode micro-service-template shipped for months.
x-web-contexts: &web-contexts
  uipkg: ../../ui

x-web-defaults: &web-defaults
  restart: unless-stopped
  # The image already carries a HEALTHCHECK, at a 30-second interval that is
  # right for production and useless to `--wait`. Overridden here for cadence
  # only: the probe is nginx's own /healthz, exactly as the image defines it.
  #
  # IT PROVES NGINX IS ANSWERING AND NOTHING MORE. Every frontend nginx.conf
  # says so in its own words ("it says the server is up — never that the app
  # works"). A container that answers 200 on /healthz can be serving an
  # index.html whose bundle 404s, which leaves the network idle and every
  # server-side probe green. That is what `scripts/estate-verify.sh` §"the
  # frontends" exists to catch, and why nothing here is treated as proof.
  healthcheck:
    # Same startup-fast / steady-slow split as the backend probes above, for the
    # same reason. `wget` is far cheaper than their `node -e` — measured at 1.36%
    # per frontend against 8.63% per backend — so this is the smaller half of the
    # saving, but sixteen frontends probing every 3s is still five spawns a second
    # to ask a static file server a question it has answered the same way all day.
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s
    start_interval: 2s

# The build identity, stamped into the `cf-release` meta tag by each frontend's
# Dockerfile and read back by estate-verify. It is the cheapest possible defence
# against the failure that cost this estate an hour once already: Docker Desktop
# keeps a stale bind-mount cache, and a container serving a file that no longer
# matches disk looks exactly like a configuration bug. A served page that does
# not carry the release this compose file asked for is a stale artefact, and the
# verifier says so by name rather than leaving three wrong theories to be
# written down first.
x-web-build-args: &web-build-args
  RELEASE: ${CLOUDSFORGE_RELEASE:-estate}

# ── the apex the browser sees ──────────────────────────────────────────────────
#
# `cloudsforge.localtest.me` is a PUBLIC wildcard that resolves to 127.0.0.1, so the dev estate
# needs no /etc/hosts entry, no sudo and no resolver of its own. Every subdomain of it
# — hub., market., nimbus. — resolves to loopback, which is exactly the shape
# `ui/packages/ui/src/surfaces.ts` derives: `cloudsforgeHosts()` strips a KNOWN subdomain from
# `window.location.hostname` to get the apex and rebuilds every sibling host from it, so a bundle
# served at `hub.cloudsforge.localtest.me` addresses identity at `nimbus.cloudsforge.localtest.me`
# without being told anything.
#
# `CF_WEB_APEX` is read TWICE, by two mechanisms that cannot see each other's files: compose
# interpolation here, and Traefik's file-provider Go template in gateway/dynamic/estate-web.yml
# via compose/env/traefik.env. Set it in one place — the shell, or deploy/.env — and both follow.
# `scripts/estate-up.sh` exports it once for exactly this reason.
#
# It is spelled out at every use below rather than hidden behind a YAML anchor: an anchor can
# alias a whole scalar but cannot be interpolated into a longer string, so
# `https://hub.<anchor>` is not a thing YAML can express.

services:
  # ------------------------------------------------------------------ postgres
  # One server, one database per service. See compose/estate/initdb.sql for why
  # that is a dev-only compromise and why it does not break the ownership rule.
  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloudsforge
      # ── THE PASSWORD IS NO LONGER A LITERAL, AND MUST NEVER BE ONE AGAIN ──────
      #
      # It was spelled out here and in the 56 connection strings below: ONE
      # value, byte-identical, in a repository that is PUBLIC, on BOTH networks.
      # So testnet access was mainnet access at the database layer, and the git
      # history had already published both. micro-org#157.
      #
      # `:?` RATHER THAN A DEFAULT, and that is the entire safety property here.
      # A default would let an estate brought up without its tokens file render a
      # password the server does not accept — 22 services would boot, fail every
      # query, and sit `unhealthy` with no clue as to why. That is not a
      # hypothetical: removing a placeholder is what took testnet down for an
      # hour on 2026-08-05. With `:?` compose REFUSES TO RENDER and names the
      # missing variable, which is the only form of this that fails closed.
      #
      # AN INTERPOLATION VARIABLE, NOT `env_file:`, because the 56 connection
      # strings below need it substituted into the middle of a URL, and
      # `env_file:` only ever reaches a container's own environment. It is
      # therefore supplied with `--env-file`, from a file that is gitignored,
      # mode 0600, and DIFFERENT PER NETWORK:
      #
      #   mainnet  compose/estate/tokens.env          (also `compose/.env`)
      #   testnet  compose/estate/tokens.testnet.env
      #
      # Two files is precisely what makes the two networks' passwords genuinely
      # different rather than merely nominally so, and CI asserts they differ.
      #
      # ROTATING IT IS NOT A RESTART. Postgres reads POSTGRES_PASSWORD only when
      # it initialises an empty data directory; on a volume that already exists
      # the server keeps the old password no matter what this file says, until an
      # `ALTER ROLE` changes it. Change this variable alone and every service
      # authenticates with a password the server has never heard of. The ordered
      # operation, and its rollback, are in
      # runbooks/runbook-postgres-password.md.
      POSTGRES_PASSWORD: ${CF_POSTGRES_PASSWORD:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); see runbooks/runbook-postgres-password.md}
      POSTGRES_DB: postgres
    volumes:
      - ./estate/initdb.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    command:
      # 22 services x a pool of 10 exceeds the default 100 connections, and the
      # symptom is a service that boots, passes its first probe and then fails
      # readiness under no load at all. Raised here rather than by shrinking
      # every pool, because the pool sizes are each service's own decision.
      - "postgres"
      - "-c"
      - "max_connections=400"
    healthcheck:
      # Without this the migrators race the server's first accept and the
      # failure reads as a flaky stack rather than as a start-order bug.
      test: ["CMD-SHELL", "pg_isready -U cloudsforge -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ================================================================== identity
  # Upstream of everything. Its migrator runs first because every other
  # service's readiness depends on being able to fetch its JWKS.
  identity-migrate:
    <<: *migrate-defaults
    build:
      context: ../../identity
      additional_contexts: *build-contexts
    environment:
      <<: *common-env
      IDENTITY_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/identity?sslmode=require
      IDENTITY_ISSUER: http://identity:4000
      # The network every token this identity mints is FOR — the `net` claim (micro-org#459
      # stage 2). Inert until a verifier sets an expectation; the day both estates trust one
      # identity, this is what stops a testnet service token passing at a mainnet service.
      # Set in the migrate block too: paired blocks share an env parser (micro-deploy#104).
      IDENTITY_NETWORK: ${CF_EMBER_NETWORK:-mainnet}
      IDENTITY_PUBLIC_URL: http://identity:4000
      IDENTITY_DELETION_GRACE_DAYS: "0"
      INSTANCE_ID: identity-migrate
    env_file:
      - *outbox-secret-file
      - *identity-key-file
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    <<: *service-defaults
    build:
      context: ../../identity
      additional_contexts: *build-contexts
    environment:
      <<: *common-env
      IDENTITY_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/identity?sslmode=require
      IDENTITY_ISSUER: http://identity:4000
      # The network every token this identity mints is FOR — the `net` claim (micro-org#459
      # stage 2). Inert until a verifier sets an expectation; the day both estates trust one
      # identity, this is what stops a testnet service token passing at a mainnet service.
      # Set in the migrate block too: paired blocks share an env parser (micro-deploy#104).
      IDENTITY_NETWORK: ${CF_EMBER_NETWORK:-mainnet}
      IDENTITY_PUBLIC_URL: http://identity:4000
      # Zero, in this environment only: the erasure drill cannot wait seven days,
      # and 0 is a value env.ts explicitly allows (integer floor 0). Production
      # keeps the default 7.
      IDENTITY_DELETION_GRACE_DAYS: "0"

      # ── CROSS-SURFACE SSO: the variable that was set nowhere ─────────────────
      #
      # `IDENTITY_HANDOFF_ORIGINS` defaulted to '' and this file never set it.
      # `isAllowedOrigin` is `env.handoffOrigins.includes(origin)`
      # (identity/src/handoff.ts) over an empty frozen array, so
      # `createHandoffCode` returned null for EVERY origin and `POST /auth/handoff`
      # answered 403 to every caller (identity/src/server.ts, the handoff route).
      #
      # WHAT THAT COST. Signing in at Hub worked; moving to any second surface did
      # not. Every one of the 86 tier-T3 scenarios in
      # docs/ecosystem/22-browser-journeys.md begins with a sign-in and most then
      # cross to another surface, so an empty allowlist stopped the catalogue at
      # its second step — while every server-side check in this repository stayed
      # green, because nothing here had ever minted a hand-off code.
      #
      # WHY IT IS A LIST OF ORIGINS AND NOT A WILDCARD. The code is BOUND to the
      # origin it was minted for and redeemed only from that origin, matched
      # against the browser's own `Origin` header (identity/src/handoff.ts).
      # That binding is the entire security property of the hand-off; an allowlist
      # that admitted anything would mint codes redeemable from an attacker's page.
      # env.ts refuses a value carrying a path, query or fragment (`origin()`,
      # identity/src/env.ts), so a wrong entry is a dead container rather
      # than a silently-ignored line.
      #
      # These are the twenty surfaces this compose file serves, at the apex the
      # gateway routes them on. `site` is the bare apex — it has an empty
      # `subdomain` in the registry — which is why the first entry has no label.
      #
      # ── `pool.` WAS THE TWENTIETH, AND IT WAS MISSING FOR AS LONG AS IT EXISTED ─
      #
      # Found by the origin sweep for micro-org#480, which asked identity to mint
      # a code for every live hostname in turn: `pool.cloudsforge.online` serves
      # 200, is `servesUi` in the registry, and was the ONLY such surface the
      # allowlist did not name — `POST /auth/handoff` answered 403 for it while
      # every one of its nineteen siblings answered 201.
      #
      # It cost nothing YET, and that is the only reason it survived this long.
      # pool-web is the one shipped bundle with no account bar (it never imports
      # `consumeAuthCallback`), so nothing on that surface has ever asked for a
      # code to be refused. The line is here before the bar is, deliberately:
      # `exchange.` and `journal.` below are the two worked examples of this list
      # being a step BEHIND a surface, and in both the symptom was a reader
      # bounced to a page showing them signed out — which reads as a broken
      # account rather than as a surface that has none. An origin that ships the
      # shared UI belongs here on the day it ships, not on the day it grows a bar.
      #
      # It is also why `scripts/surface-routes.py` now derives this list from the
      # registry instead of trusting it. Nineteen of twenty correct is exactly the
      # shape of drift no human reading finds, and this file had two such lists.
      #
      # ── `journal.` WAS THE NINETEENTH, AND IT LEFT WITH ITS SUBDOMAIN ─────────
      #
      # Forge Journal is an archive: nothing on it is gated, no page fetches
      # anything, and a reader who never signs in loses no function whatsoever.
      # The line was here anyway, from the day the container shipped, because the
      # account bar is the estate's CHROME rather than a gate — and because
      # `exchange.` was the worked example of what leaving it out costs. A bar
      # that renders a sign-in link and then 403s the hand-off does not read as
      # "this surface has no account"; it reads as a broken account.
      #
      # `exchange.` HAS SINCE LEFT TOO, in wave 2, for exactly the reason below —
      # it is `<apex>/exchange` now. The worked example is preserved in the past
      # tense rather than rewritten, because the lesson is about what an origin
      # list costs when a surface is missing from it, and that is still the
      # lesson. Twelve more surfaces follow, and each one leaves this list the
      # same way: not by having its grant revoked, but by moving to an origin
      # that already holds one.
      #
      # It is gone now, and NOT because any of that stopped being true. Wave 1 of
      # `docs/apex-consolidation.md` moved the surface from `journal.<apex>` to
      # `<apex>/journal` — `subdomain: ''`, `basePath: '/journal'` on the registry
      # row — so the ORIGIN a reader signs in from is the apex, and the apex is
      # the FIRST line of this list. The grant did not need deleting and
      # re-adding; it was already there, because an origin is a scheme, a host and
      # a port, and a path is none of those.
      #
      # Leaving the old line would not have been harmless bloat. `journal.<apex>`
      # now 301s to the apex (`cf-journal-to-apex` in `gateway/dynamic/
      # estate-web.yml`), so no browser is ever ON that origin, and a grant to an
      # origin that cannot exist is one nobody can audit by looking at what uses
      # it. `scripts/surface-routes.py` refuses it in those terms: it derives this
      # list from `servesUi AND NOT basePath` in the registry, so a surface that
      # becomes a path leaves this list automatically or CI goes red. The deletion
      # is a consequence of the registry edit rather than something to remember.
      #
      # ── `exchange.` WAS THE EIGHTEENTH, AND IT WAS ADDED THE DAY IT NEEDED ONE ─
      #
      # exchange-web shipped WITHOUT an account bar on purpose: no CloudsForge
      # service stands behind it, every read is an anonymous `eth_call` and every
      # write is signed by the reader's own wallet, so there was nothing a session
      # could unlock. The owner reported the consequence rather than the cause —
      # "i tried url directly its open but it has no login bar on top" — and the
      # bar went on, because the bar is the estate's CHROME (product switcher,
      # network switcher, home link, the reader's handle) and not an
      # authorisation mechanism.
      #
      # Adding the bar WITHOUT adding this line would have been worse than
      # leaving it off. `createHandoffCode` returns null for an origin not on
      # this list, `POST /auth/handoff` answers 403, and the reader is bounced
      # back to a page that shows them signed out — which reads as a broken
      # account rather than as a surface that has none.
      #
      # THE LAST ENTRY IS THE ONE ODD ONE, AND IT IS DELIBERATE.
      # `http://localhost:5172` is micro-tessera-web's VITE DEV PORT, not a
      # deployed surface. It is here because a title is developed against this
      # estate rather than against a stub: `pnpm dev` on 5172 signs in through
      # the same identity container as everything else, and `createHandoffCode`
      # returns null for an origin not on this list (identity/src/handoff.ts),
      # so without it a developer's sign-in 403s with nothing server-side saying
      # why. It is `http`, which `origin()` accepts (identity/src/env.ts),
      # and it is loopback — an allowlist entry that only an attacker running
      # code on the developer's own machine could reach, at which point the
      # hand-off code is not the exposure.
      #
      # ── THE TWO OPERATOR CONSOLES, ADDED WITH THEIR CONTAINERS ────────────────
      #
      # `lantern.` and `beacon.` are the two entries before that dev port. Both
      # bundles are `adminOnly` and render a SIGN-IN PANEL rather than fetching
      # anything while signed out, so WITHOUT THESE TWO LINES NEITHER SURFACE
      # OPENS AT ALL — `createHandoffCode` returns null for an origin not on this
      # list, `POST /auth/handoff` answers 403, and the page reports a failed
      # sign-in with nothing server-side saying why. A 403 there is
      # indistinguishable from a wrong password.
      #
      # NOTE FOR THE NEXT EDITOR, LEARNED BY DOING IT WRONG: everything below the
      # `>-` is a FOLDED BLOCK SCALAR, not YAML. A `#` line inside it is CONTENT,
      # not a comment — it is folded into the value, and `docker compose config`
      # then rejects the whole file with "invalid interpolation format" pointing
      # at a `${…}` written inside the prose. That is why this note sits up here
      # rather than beside the two lines it is about, and it is the same shape as
      # the trap estate-web.yml's header records for Go template actions inside
      # YAML comments.
      # ── WAVE 3f REMOVED THREE ENTRIES, AND A COMMENT CANNOT GO INSIDE THE LIST ──
      #
      # `emberkin.`, `aetherholm.` and `tessera.` were granted here and no longer
      # need to be: each title runs at `<apex>/worlds/<title>` now, so the ORIGIN
      # of a hand-off or a telemetry write from any of them is the APEX — the
      # first entry below. Those hostnames load no page in either environment;
      # the tombstone routers 301 them, and a browser follows that before making
      # the request a grant would have covered.
      #
      # Same removal `journal`, `market`, `create`, `trade`, `agora`, `pool` and
      # `worlds` already had. The note lives HERE and not among the entries
      # because the value below is a YAML FOLDED SCALAR: a `#` line inside it is
      # not a comment, it is one more origin — which is exactly what the first
      # attempt did, and `surface-routes.py` reported four prose fragments as
      # ungranted origins rather than letting them through.
      # Wave 3g removed `developers.` for the same reason as the three above it.
      IDENTITY_HANDOFF_ORIGINS: >-
        https://${CF_SITE_HOST:-cloudsforge.localtest.me},
        https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://network${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://admin${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://status${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://lantern${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://beacon${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        http://localhost:5172

      # ── THE ACCOUNT LINK, WITHOUT WHICH A VERIFICATION MAIL CARRIES NOTHING ───
      #
      # `IDENTITY_ACCOUNT_URL` was unset, and unset is not a failure here: it is
      # optional, defaults to '' and becomes `accountUrl: null`
      # (identity/src/env.ts,291). `emailVerification.ts` then emits
      # the event with `linkable: false` and NO `verifyUrl` — so the mail is sent,
      # and it contains no way to verify. Silent, like every other defect in this
      # header: nothing errors, the user simply cannot finish signing up.
      #
      # It is HUB, not the apex. `emailVerification.ts` builds
      # `${accountUrl}/account/verify#token=…` and hub-web is what serves that
      # route (hub-web/src/app.tsx). The apex would 404.
      #
      # THE TOKEN IS AFTER `#`, NOT `?`, AND THAT IS LOAD-BEARING — a fragment is
      # never sent to a server, so the token cannot land in an access log. Do not
      # "tidy" this into a query string.
      #
      # Interpolated for the same reason the allowlist above is: a literal would
      # point testnet's verification mail at mainnet's Hub, which is a working
      # link to the wrong estate — the worst kind, because it succeeds.
      IDENTITY_ACCOUNT_URL: https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}

      # ── THE REGISTRATION CHALLENGE (Cloudflare Turnstile), micro-org#361 ──────
      #
      # `POST /auth/register` is the estate's one unauthenticated write, and it
      # had nothing in front of it but a rate limit of 5. What that cost is
      # measured, not feared: 4,483 verification tokens issued across the two
      # networks with ZERO ever consumed, and the mail plan's 250 sends a day
      # gone before anyone was awake (micro-org#243). Every one of those rows is
      # still in `identity.users`.
      #
      # ── ALL THREE ARE INTERPOLATIONS, AND ONE OF THEM IS A REAL SECRET ───────
      #
      # `TURNSTILE_SECRET` is what redeems a solved challenge at Cloudflare's
      # `siteverify`. It is set BY HAND in `compose/estate/tokens.env` — mode
      # 0600, gitignored, untracked, absent from history — and it may never
      # appear here as a literal, in any environment, for the reason the custody
      # header at the top of this file records in full: this repository is
      # public. Nothing in this repo reads it and nothing needs to; `identity`
      # takes it from the environment by name.
      #
      # A hand-set value in `tokens.env` SURVIVES A BOOTSTRAP. `estate-bootstrap.sh`
      # rewrites that file wholesale, but its carry-forward copies every key the
      # script does not itself write and prints the NAMES it carried. These three
      # are not minted by it, so they are carried. (The header of `x-custody-secrets`
      # above says `tokens.env` "IS REGENERATED" as a reason not to put a master
      # secret there; that was true before the carry-forward existed and is no
      # longer the whole story. The OTHER reason it gives still stands, and it is
      # the one that applies here — see the next paragraph.)
      #
      # ── WHY THIS IS OFF ON TESTNET, DELIBERATELY ─────────────────────────────
      #
      # Testnet is brought up with `--env-file compose/testnet.env`, which
      # REPLACES the default `.env` symlink rather than adding to it, so nothing
      # from `tokens.env` reaches it. All three render empty there. That is the
      # correct outcome and not a gap: `identity/src/env.ts` enables the gate only
      # when the secret AND the site key are both present, and a testnet estate
      # whose registrations are challenged by a widget keyed to `hub.cloudsforge.online`
      # would refuse every one of them — the hostname assertion would never hold.
      #
      # ── `:-` AND NOT `:?`, WHICH IS THE UNCOMFORTABLE HALF ───────────────────
      #
      # `:?` would fail the bring-up when the secret is missing, which is the
      # fail-closed instinct and is wrong HERE: it would stop testnet and every
      # fresh clone dead, arming a guard only where it was never needed. So a
      # deploy that loses `tokens.env` turns the gate OFF rather than failing, and
      # that is a real hole with a real precedent — the top of this file records
      # two agents blanking service credentials with a bare `docker compose up`.
      # What closes it is the same thing that closes it for every other
      # credential here: deploy with `scripts/release-deploy.sh`, which passes the
      # env files explicitly. `identity` publishes the answer at
      # `GET /auth/challenge`, so `required` there is the one-request check that
      # the gate is actually on, and beacon's `identity.registration-challenge`
      # journey asks it every run.
      #
      # ── AND WHY THE SITE KEY IS NOT BAKED INTO hub-web ───────────────────────
      #
      # It is public — it is in the HTML of the register page — but hub-web reads
      # NO build-time constants (`hub-web/test/no-build-time-config.test.ts`
      # forbids it), and one bundle serves every environment. So the browser asks
      # `identity` for it at runtime, which is why the site key belongs on THIS
      # service and not on a web one.
      #
      # `TURNSTILE_HOSTNAMES` is the allowlist a verified token's `hostname` must
      # be in — bare hostnames, comma-separated, no scheme and no port, or
      # `env.ts` refuses to boot. Mainnet has exactly one register form, so it is
      # one entry.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}

      # ══════════════════════════════════════════════════════════════════════════
      # GENERATED — `node scripts/derive-grants.mjs --write`. Do not hand-edit.
      #
      # `scripts/estate-verify.sh` runs `--check` and FAILS if this block and the
      # services disagree, so an edit here is reverted by the next verification
      # rather than quietly kept. (The word GENERATED is load-bearing and has been
      # false in this repository before — commit 05e9284, "the map said GENERATED
      # by a command that has never written it". This one is written by that
      # command; the check is what keeps the claim true.)
      # ══════════════════════════════════════════════════════════════════════════
      #
      # WHY THIS IS DERIVED AND NO LONGER HAND-WRITTEN. This was fourteen lines of
      # hand-maintained JSON describing what OTHER repositories need, and it went
      # stale the way every such copy in this estate has: four separate agents hit
      # a missing grant in one week. `nda` held `worlds:read,worlds:write` while
      # the achievement-unlock route demands `worlds:title`; `emberkin`, `beacon`,
      # `custody`, `faucet` and `foresight` had no entry at all.
      #
      # The fact lives in the SERVICES, which already declare the scopes their
      # deploy must mint — `community/src/index.ts` says so outright: "The
      # scopes it needs are named in `LEDGER_SCOPES`, `POLICY_SCOPES` and
      # `INDEXER_SCOPES` so the deploy can mint exactly those." Twenty repositories
      # follow that convention and nothing consumed it until now.
      #
      # The derivation reads two seams — an exported `*_SCOPES` constant in a
      # module that presents a credential, and the `scopes:` body of a
      # `POST /service-tokens/exchange` call (which is how `beacon` states its
      # demand, beacon/src/ecosystem.ts). It refuses to guess: a module that
      # presents a credential and declares nothing FAILS unless it is named, with
      # a written reason, in `compose/estate/grant-gaps.json` — ten such modules,
      # each naming the repository that owns it. See that file and the tool header.
      #
      # WHAT THE DERIVATION CHANGED, beyond filling the gaps above. Every one of
      # these is a narrowing the hand-written map got wrong in the permissive
      # direction, and each was checked against the peer's actual gate:
      #
      #   * `worlds`, `nda` and `trade` lost `billing:grant`, and `trade` also lost
      #     `billing:read`. Their billing clients are read-only `EntitlementReader`s
      #     (list/owns) and `trade` has no billing client at all.
      #   * `admin-api` lost `market:read`, `market:admin` and `billing:read`. Those
      #     calls deliberately forward THE OPERATOR'S OWN BEARER so the upstream
      #     records which administrator acted (SD-11); no service token carried them.
      #   * `wallet` lost `policy:decide` (it has no policy client) and GAINED
      #     `settlement:read`, which it genuinely needs for the withdrawal fee quote
      #     and never had — a live 403 nobody had reported.
      #   * `ledger` and `analytics` lost their entries entirely. Neither makes a
      #     tokened outbound call; `ANALYTICS_TOKEN` is an inbound `/metrics` secret.
      #
      # The scope names are identity's own, from SCOPE_NAMES. Configuration is
      # validated at import, so a wrong value is a dead container rather than a
      # service that runs and denies requests for a reason nobody can see — and the
      # derivation checks every scope against that same registry before writing, so
      # the container-killing failure is caught here instead.
      #
      # A service absent from this map cannot be issued a token at all. That is the
      # correct answer for `devplatform`, which forwards the developer's own bearer
      # and derives an empty set — absent, not `[]`.
      IDENTITY_SERVICE_TOKEN_GRANTS: >-
        {"admin-api":["identity:admin","ledger:post","ledger:read"],
         "agora":["policy:decide"],
         "beacon":["ledger:read"],
         "billing":["admin:read","ledger:post"],
         "community":["indexer:read","ledger:post","policy:decide"],
         "custody":["policy:decide"],
         "emberkin":["billing:read","ledger:post","worlds:title"],
         "faucet":["custody:sign:treasury"],
         "foresight":["admin:read","custody:address:create","custody:sign:deployer","indexer:read","indexer:write","ledger:post","ledger:read","policy:decide"],
         "hub-api":["billing:read","ledger:read","notify:read","policy:decide","pricing:read","wallet:read"],
         "ledger":["indexer:read"],
         "market":["indexer:read","ledger:post","policy:decide"],
         "mint":["custody:address:create","custody:sign:deployer","indexer:read","ledger:post"],
         "nda":["billing:read","worlds:title"],
         "pool":["ledger:post"],
         "settlement":["custody:sign:deposit","custody:sign:treasury","custody:treasury:read","indexer:read","indexer:write","ledger:post"],
         "tessera":["ledger:post","ledger:reserve","studio:read","studio:write"],
         "trade":["ledger:post","ledger:read","ledger:reserve","pricing:read"],
         "wallet":["custody:address:create","indexer:read","indexer:write","ledger:post","ledger:read","ledger:reserve","pricing:read","settlement:read"],
         "worlds":["aetherholm:provision","billing:read","ledger:post","tessera:provision"]}
      INSTANCE_ID: identity-estate
    env_file:
      - *outbox-secret-file
      - *identity-key-file
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}100:4000"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck

  # ================================================ tier 1: database + JWKS only
  # Nothing here calls another service, so nothing here needs a service token.
  # This is the tier that can be brought up and verified before the bootstrap
  # has minted anything.

  # ------------------------------------------------------------------- ledger
  ledger-migrate:
    <<: *migrate-defaults
    build:
      context: ../../ledger
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LEDGER_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/ledger?sslmode=require
      INSTANCE_ID: ledger-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  ledger:
    <<: *service-defaults
    build:
      context: ../../ledger
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LEDGER_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/ledger?sslmode=require
      # ══════════════════════════════════════════════════════════════════════
      # THE ASSETS RECONCILIATION SWEEPS — WRITTEN OUT RATHER THAN INHERITED
      # FROM THE DEFAULT, BECAUSE NAMING AN ASSET HERE IS A DECISION AND AN
      # ASSET NAMED AGAINST A BUILD THAT CANNOT SEE IT FREEZES.
      #
      # `SHARD,EMBER` is ledger's default (ledger/src/env.ts). LTC is the
      # estate's addition, so the line is spelled out in full: the decision is
      # attributable in the manifest instead of being an absence somebody has to
      # know about, and the difference from the default is visible.
      #
      # THE RULE THAT GOVERNS THIS LINE. `reconcileAsset` demands a chain
      # observation for any asset in ON_CHAIN_ASSETS and records `unavailable` /
      # `failed` without one, which freezes that asset's withdrawals on the
      # first sweep after boot. Only an exactly-clean OBSERVED run lifts a
      # freeze, and an unobserved run can never be clean — so naming an asset
      # this deployment cannot observe does not schedule a check, it schedules a
      # permanent freeze, and backing the name out afterwards does not clear the
      # row it left. Add an asset here only once INDEXER_CHAINS follows its
      # chain and the custody total answers 200.
      #
      # EMBER USED TO FAIL EVERY RUN HERE, AND NO LONGER DOES. That paragraph
      # described an INDEXER_CHAINS that was unset: no Hearth node, the indexer
      # following nothing, and the custody route answering 503
      # `chain_not_followed`. INDEXER_CHAINS is now `ember:mainnet,ltc:mainnet`
      # (see the indexer block), and EMBER reconciles `observed_source=indexer`,
      # `status=clean`, drift 0 on every sweep. The reasoning still stands for
      # any estate where Hearth has not launched — a freeze on an EMBER custody
      # of zero costs nothing, and on a non-zero one it is correct rather than
      # regrettable — but it is no longer a description of THIS deployment, and
      # a comment that predicts a failure the database does not show teaches the
      # next reader to disbelieve the file.
      #
      # WHY LTC JOINS NOW, BEFORE IT HOLDS ANYTHING. Both sides were measured
      # first, which is the whole of the argument:
      #   - the ledger has NO LTC accounts at all, so its custody total is 0;
      #   - `GET /v1/custody/ltc/mainnet/total` answers 200 with total 0 over
      #     2 deposit addresses, and answers it because both watched rows now
      #     carry a `history_from_height` — the derivation refuses if ANY
      #     watched row's claim is null, not merely the address being asked
      #     about, so one unclaimed deposit row kept the whole aggregate
      #     unanswerable until it was claimed;
      #   - LTC's tolerance is 0 by decision (ledger/src/env.ts), so 0 against 0
      #     is clean rather than within-tolerance.
      # An asset is cheapest to bring under the check while it is empty: the
      # first LTC deposit is then checked from its first block, rather than
      # being onboarded into an asset nobody is comparing. A treasury pin is NOT
      # a prerequisite — settlement's registration measures, watches, posts and
      # marks in one movement, so the pinned balance lands on both sides at
      # once and cannot open a drift by arriving.
      #
      # THE ONLY LEGITIMATE EXEMPTION IS REMOVING AN ASSET FROM THIS LINE. It is
      # deliberately the only one: it makes the asset stop being CHECKED rather
      # than making it LOOK checked, it is attributable and reviewable here, and
      # the freeze it leaves behind stays until an exactly-clean observed run
      # lifts it — so the decision cannot be quietly forgotten. A code exemption
      # would be an `if (asset === 'EMBER')` on the one asset this whole release
      # is about, which is the defect it removed wearing a new name.
      LEDGER_RECONCILE_ASSETS: "SHARD,EMBER,LTC"
      # WHICH NETWORK'S CUSTODY TOTAL IS RECONCILED — and it has to be the same
      # one `indexer` follows or the call is `GET /v1/custody/ember/testnet/total`
      # against a follower that only has `ember/mainnet` rows. That reads as
      # `undefined`, which freezes EMBER, which is the honest failure and also an
      # invisible one: nothing distinguishes "the chain is unreachable" from "the
      # deploy named two different networks". So this is the SAME variable the
      # indexer's `env_file` is keyed on, and the two cannot drift.
      #
      # IT IS ONE NETWORK FOR EVERY ASSET ON THE LINE ABOVE, NOT ONE PER ASSET.
      # `CF_EMBER_NETWORK` is named for the asset it was introduced for and now
      # governs LTC as well; the name is kept rather than churned because it is
      # the variable the indexer's `env_file` is keyed on and splitting them is
      # exactly the drift this block exists to prevent. The constraint it puts
      # on INDEXER_CHAINS is therefore that every reconciled chain must be
      # followed on THIS network — `ember:mainnet,ltc:mainnet` against a
      # `mainnet` here. Following `ltc:testnet` while reconciling `mainnet` does
      # not read as a misconfiguration at either end; it reads as a chain
      # nobody can see, and freezes LTC.
      LEDGER_RECONCILE_NETWORK: ${CF_EMBER_NETWORK:-mainnet}
      # ── the indexer call, and the one rule it must hold ───────────────────
      #
      # URL and timeout for `GET /v1/custody/:chain/:network/total`. UNREACHABLE
      # MUST ARRIVE AT `reconcileAsset` AS `undefined`, NEVER AS `0n`: a zero is
      # a claim that the chain holds nothing, and the whole defect this release
      # removed was a zero masquerading as knowledge. The reference client that
      # holds that line — every non-200, every timeout, every body that is not a
      # decimal string maps to `undefined` — is `observedTotalFor` in
      # indexer/src/chainbacking.test.ts, which proves it against a real socket.
      #
      # THESE TWO ARE PROVISIONED AHEAD OF THE CODE THAT READS THEM, and that is
      # said plainly rather than left to be discovered: micro-ledger's job
      # handler (ledger/src/jobs.ts) does not make this call yet, so today
      # these are inert. They are set now because the alternative is a deploy
      # edit racing a code deploy, and because a URL and a timeout are not
      # secrets — rule 9's concern is the `env_file: .env` fan-out that put the
      # custody master secret in a game container, not a service address.
      #
      # THAT CALL HAS LANDED, AND SO HAS THE GRANT. The block above used to end
      # "it will 401 until ledger holds a grant … the correct sequence is:
      # ledger's client exports `INDEXER_SCOPES = ['indexer:read']`, the map is
      # regenerated, the grant appears." Both halves have now happened —
      # `ledger/src/jobs.ts` makes the call, `ledger/src/indexerclient.ts`
      # declares the scope, and `derive-grants.mjs` picked it up on its next run
      # without one character being typed into the grants map by hand.
      #
      # THE THIRD HALF WAS MISSING AND IS THE LINE BELOW. A grant says what
      # identity MAY mint for a service; it does not hand the service anything.
      # ledger read `LEDGER_SERVICE_TOKEN` and nothing was ever setting it — so
      # the call went out with no bearer, the indexer answered 401, the 401 maps
      # to `undefined`, the reconciliation ran unobserved, and EMBER froze.
      # `ledger/src/index.ts` logs that at FATAL.
      #
      # AND SETTING IT WAS NOT ENOUGH, WHICH IS WHY THE VARIABLE BELOW CHANGED.
      # `LEDGER_SERVICE_TOKEN` carried a token that lives 600s
      # (identity/src/tokens.ts), read once at import, while the
      # reconciliation job runs every 900s (ledger/src/jobs.ts). 600 < 900,
      # so the chain-backing call authenticated on the FIRST run after a
      # bootstrap and on no run ever again — and the resulting freeze was
      # byte-identical to the honest "no chain is followed" one. It passed
      # verification only because `estate-up.sh` bootstraps and verifies inside
      # the window: a check that could only be run the one way that passes.
      #
      # micro-ledger fixed it at the layer that owns it. `ledger/src/env.ts`
      # now reads `LEDGER_IDENTITY_CREDENTIAL` — long-lived, `cfsc_…`, already
      # minted by `estate-bootstrap.sh` — and exchanges it for a fresh token per
      # call at `POST /service-tokens/exchange` via `@cloudsforge/auth`'s
      # `ServiceTokenProvider`, as wallet, billing, custody and community do.
      # `env.ts` keeps `legacyServiceTokenPresent` purely to COMPLAIN about
      # the old variable, so handing it back would be silently ignored rather
      # than obeyed. That is why this is a rename and not an addition.
      #
      # ORDER MATTERS HERE. The new image freezes EMBER with `no_credential` if
      # it is started against the old variable, so this line and the ledger
      # image must move together; rebuilding first breaks a running estate.
      #
      # THE TWO FREEZES LOOK IDENTICAL AND ARE NOT THE SAME FACT. EMBER frozen
      # because no Hearth node is followed is CORRECT and is argued beside
      # LEDGER_RECONCILE_ASSETS above — if the chain has not launched then no
      # EMBER is backed by anything. EMBER frozen because ledger cannot
      # AUTHENTICATE is a deployment defect wearing the same status. From a
      # health check they are one line; `scripts/estate-verify.sh` now separates
      # them by driving the custody route with ledger's own credential and
      # asserting the answer is 503 `chain_not_followed` rather than 401.
      INDEXER_URL: http://indexer:4000
      LEDGER_INDEXER_DEADLINE_MS: "5000"
      LEDGER_IDENTITY_CREDENTIAL: ${LEDGER_IDENTITY_CREDENTIAL:-}
      # ══════════════════════════════════════════════════════════════════════
      INSTANCE_ID: ledger-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}102:4000"
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *healthcheck

  studio-assets-init:
    image: busybox:1.37
    # The ONLY container here that runs as root, and it runs for milliseconds and
    # then exits. It holds no credential, opens no socket and reaches no network.
    user: "0:0"
    restart: "no"
    volumes:
      - studio-assets:/assets
    # 1000:1000 is `node` in node:22-slim, which is what studio's final stage
    # selects. Idempotent: re-running it on a populated volume is a no-op.
    command: ["sh", "-c", "mkdir -p /assets && chown -R 1000:1000 /assets && chmod 755 /assets"]

  # ------------------------------------------------------------------ indexer
  # INDEXER_CHAINS is deliberately unset, so indexer follows NO chain. There is
  # no Hearth node in this environment, and env.ts refuses to start a follower
  # for a chain with no provider — "a follower with no provider reports healthy
  # and indexes nothing". Following nothing is the honest configuration; what
  # this proves is that indexer boots, migrates and answers, not that it indexes.
  #
  # ── IT WAS BEHIND A PROFILE, AND THE REASON HAS EXPIRED ───────────────────────
  #
  # `profiles: [indexer]` kept the default `up` from including it. Not because
  # indexer was broken, but because of something this environment was the first
  # thing to demonstrate: EVERY SERVICE HERE BUILDS FROM A WORKING TREE, not from
  # a published image. micro-indexer then had uncommitted changes in src/reads.ts,
  # src/store.ts and src/migrations.ts and a new src/bitcoin.ts, and `pnpm
  # typecheck` failed inside its Dockerfile on a RowStatus that had grown a
  # 'conflicted' member the ActivityView type had not. Another agent's work in
  # flight; never a defect in committed code.
  #
  # THAT WORK IS COMMITTED (micro-indexer 64ff91a, tree clean) AND THE IMAGE
  # BUILDS. Checked by building it, not by reading the log that recorded the
  # failure — which is the same standard the profile was added under. So the
  # profile is removed and indexer is a member of the estate.
  #
  # This was not cosmetic. `indexer.deposit.confirmed` is how a user's deposit
  # becomes a balance, and wallet is its only consumer; with indexer absent there
  # was no producer for the estate's money-in path at all, and `wallet` and
  # `settlement` both carry a note below saying their INDEXER_URL resolves to
  # nothing. It now resolves.
  #
  # The lesson the profile taught still stands and is still the case FOR the
  # release manifest: an environment built from working trees is only ever as
  # green as every checkout on the machine, and it fails for reasons that have
  # nothing to do with the change under test. cfctl's rule — "an image tag cannot
  # name a working tree" — is the same observation from the other side.
  indexer-migrate:
    <<: *migrate-defaults
    build:
      context: ../../indexer
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      INDEXER_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/indexer?sslmode=require
      INSTANCE_ID: indexer-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    <<: *service-defaults
    build:
      context: ../../indexer
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      INDEXER_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/indexer?sslmode=require
      # ══════════════════════════════════════════════════════════════════════
      # THE CUSTODY SET, which is what `GET /v1/custody/:chain/:network/total`
      # sums and what micro-ledger reconciles its custody accounts against.
      #
      # `deposit:` is the label micro-wallet writes for every assigned deposit
      # address (wallet/src/deposits.ts), and coin arriving there is debited
      # to the ledger's custody asset account — so those addresses ARE the
      # custody position.
      #
      # `treasury:` IS CARRIED AND NOTHING WRITES IT. micro-settlement sweeps
      # deposits to a pinned treasury address (settlement/src/bitcoin.ts)
      # and its grant below has no `indexer:write`, so treasury addresses are
      # not registered with the indexer at all. On a deployment that has swept,
      # the aggregate therefore UNDER-reports, which reads at the ledger as
      # positive drift and freezes the asset. That is the safe direction and it
      # is loud; the repair is a registration in micro-settlement, not a change
      # to this value. Named here so the gap is visible in the manifest.
      #
      # An empty value is not "everything" — indexer's env.ts refuses it,
      # because a set matching nothing sums to zero over zero addresses, which
      # is "we did not look" reported as "the chain holds nothing".
      # `pool:` joins the set for micro-org#302. It is added AHEAD of any pool address actually
      # being registered, and that order is deliberate and safe: this variable decides which
      # labels the custody set will ADMIT, so a prefix with no addresses behind it admits nothing
      # and changes no balance. The reverse order is the one that fails — registering an address
      # under a label the indexer does not admit leaves it observed by nothing while the pool
      # believes it is backed.
      #
      # Registering the address itself is NOT this line and must not follow it casually. LTC is a
      # walked-balance chain: `deriveBalances` requires every address in the custody set to carry a
      # `history_from_height` at or below the record's lowest walked height and THROWS FOR THE
      # WHOLE ASSET when one cannot, so a badly-registered pool address freezes LTC reconciliation
      # estate-wide rather than under-reporting itself. See the four prerequisites in
      # `pool/src/payouts.ts` and the measurements on micro-org#302.
      INDEXER_CUSTODY_LABEL_PREFIXES: "deposit:,treasury:,pool:"
      # Above this the route answers 503 rather than summing a page. A page of a
      # custody set is a partial sum, and a partial sum freezes withdrawals.
      INDEXER_CUSTODY_MAX_ADDRESSES: "2000"
      INDEXER_CUSTODY_CONCURRENCY: "8"
      # ══════════════════════════════════════════════════════════════════════
      # THE CHAIN THIS ESTATE FOLLOWS IS IN `env/chain.<network>.env`, NOT HERE.
      #
      # `INDEXER_CHAINS`, `INDEXER_RPC_EMBER_<NETWORK>` and
      # `INDEXER_START_HEIGHT_EMBER_<NETWORK>` used to be three literals in this
      # block naming `testnet`. They moved to the `env_file` below, and the move
      # is forced rather than stylistic: TWO OF THE THREE CARRY THE NETWORK IN
      # THE VARIABLE NAME, and a compose `environment:` key cannot be
      # interpolated. `INDEXER_RPC_EMBER_${CF_EMBER_NETWORK}` is not a thing this
      # file can write. An `env_file:` PATH can be interpolated, and — measured on
      # this host with Compose v5.1.1, not assumed — the VALUES inside one are
      # interpolated too, so `${EMBER_RPC_URL}` still reaches through it.
      #
      # It is also not enough to add the mainnet variable beside the testnet one
      # and let the unused one sit: `env.ts` is a MIRROR CHECK that refuses to
      # boot when an `INDEXER_RPC_*` names a scope `INDEXER_CHAINS` does not list.
      # Exactly one of the two files may ever be loaded, which is what an
      # interpolated path gives and what a merged map does not.
      #
      # HOST NETWORKING, NOT A COMPOSE LINK, and the reason is ownership.
      # `hearth` is the frozen legacy repository: it is read, run and never
      # modified. Attaching its seed to this project's network would mean
      # editing its compose file. `host.docker.internal` reaches the port that
      # file already publishes, and costs this estate nothing but a hostname.
      #
      # WITH THE CHAIN DOWN this service still boots and still reports healthy:
      # env.ts validates the URL, not the socket. What changes is only WHICH
      # honest refusal the custody route gives — `nothing_indexed` instead of
      # `chain_not_followed`. Both reach ledger as `undefined`, both freeze
      # EMBER, and neither is a number nobody measured.
      # ══════════════════════════════════════════════════════════════════════
      INSTANCE_ID: indexer-estate
    env_file:
      - env/chain.${CF_EMBER_NETWORK:-mainnet}.env
      # Chain RPC credentials: gitignored, 0600, interpolated into chain.<network>.env
      # as ${LTC_RPC_URL}. The path is per-network, and BOTH networks now define a
      # Litecoin endpoint — mainnet the real node, testnet a `litecoind -regtest`
      # whose outputs an operator can control (micro-org#252). They must stay in step
      # with `INDEXER_CHAINS` in the matching `env/chain.<network>.env`: env.ts runs a
      # mirror check and refuses to boot when an `INDEXER_RPC_*` names a scope
      # `INDEXER_CHAINS` does not list, and equally when a listed scope has no endpoint.
      #
      # `required: false` because this file is gitignored BY DESIGN and therefore
      # never exists on a CI runner. As a bare path, `docker compose config` fails
      # outright — not a warning, an error — so `make check-restart` could not read
      # this file at all and every deploy PR failed on a check that had nothing to
      # do with its own contents. main was red for three runs for this reason.
      #
      # Making it optional does not make a missing credential survivable, which is
      # the only thing that would make this the wrong fix. indexer/src/env.ts:19
      # holds the real guarantee — "a configured chain must have at least one RPC
      # endpoint" — and throws EnvError on boot if the file is genuinely absent on
      # a host that lists ltc:mainnet in INDEXER_CHAINS. So the loud failure stays
      # exactly where it belongs, at the service that needs the credential, rather
      # than at a config-rendering step that was never about credentials.
      - path: secrets/chainrpc.${CF_EMBER_NETWORK:-mainnet}.env
        required: false
      - *outbox-secret-file
    # Docker Desktop resolves `host.docker.internal` for free; the Linux daemon
    # does not, and there the indexer would report a healthy follower that can
    # reach no provider — the exact failure env.ts's mirror check exists to stop.
    # `host-gateway` is a no-op where the name already resolves.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}108:4000"
    depends_on:
      indexer-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *healthcheck

  # ---------------------------------------------------------------- analytics
  #
  # NOT A SERVICE ANY MORE. Wave M1 of `docs/service-merge-plan.md`: micro-analytics'
  # code ships inside micro-lantern's image as plain directories under `src/analytics/`,
  # so `analytics` and `analytics-migrate` are GONE from here rather than merely
  # unrendered.
  #
  # That is the difference between this and the twenty web bundles, which keep their
  # compose services. A bundle is still its own image; an absorbed service's old image
  # is STALE BY CONSTRUCTION, and leaving the entry here "so local dev still works"
  # would run two versions of the same code against one database.
  #
  # `ANALYTICS_DATABASE_URL`, `ANALYTICS_TOKEN` and both secret files moved onto
  # `lantern` and `lantern-migrate` above; nothing else in this block was unique to it.
  # The NAME still resolves in Kubernetes — `scripts/k8s-render.py` emits it as an
  # ExternalName from MERGED_INTO, and refuses to render at all if a compose service by
  # that name comes back, because the two halves of a merge have to land together.

  # ====================================================== tier 2: needs policy
  # ------------------------------------------------------------------ custody
  # A named volume is created ROOT-OWNED 755, and custody runs as `node` (uid
  # 1000) — so mounting one is only half the fix and the other half fails
  # identically. This is `studio-assets-init`'s pattern, used for the same reason
  # and pointed at a directory that matters far more: milliseconds as root, then
  # gone, holding no credential and reaching no network. Idempotent, so a re-run
  # against a populated vault is a no-op and never touches the seeds inside.
  custody-keys-init:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    volumes:
      - custody-keys:/vault
    # 1000:1000 is `node` in node:22-slim, which custody's final stage selects
    # (`custody/Dockerfile:77`). 700 rather than studio's 755: this directory
    # holds every key the platform custodies, and nothing but custody has any
    # business reading it.
    command: ["sh", "-c", "mkdir -p /vault/keys && chown -R 1000:1000 /vault && chmod 700 /vault /vault/keys"]

  custody-migrate:
    <<: *migrate-defaults
    build:
      context: ../../custody
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      CUSTODY_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/custody?sslmode=require
      POLICY_BASE_URL: http://policy:4000
      INSTANCE_ID: custody-migrate
    # THE MIGRATOR NEEDS THE KEYRING TOO. `migrator.ts` imports `env.ts`, which
    # validates at import, so a migrator without the file does not run a
    # migration and fail — it exits before it starts, and `custody` waits on
    # `service_completed_successfully` for ever. Same file as the service below;
    # the argument for it is there.
    env_file:
      - *custody-secret-file
      - *outbox-secret-file
    depends_on:
      postgres:
        condition: service_healthy

  custody:
    <<: *service-defaults
    build:
      context: ../../custody
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      CUSTODY_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/custody?sslmode=require
      POLICY_BASE_URL: http://policy:4000
      # OUTBOX_SIGNING_SECRET IS STILL A PLACEHOLDER IN A PUBLIC FILE AND IS A
      # LIVE DEFECT — it is left here rather than fixed alongside the master
      # secret because it is ONE SHARED HMAC KEY across fifteen services
      # (`custody`, `ledger`, `mint`, `identity`, `studio`, `worlds`, … each
      # `requiredSecret(source, 'OUTBOX_SIGNING_SECRET')`). Moving custody's copy
      # alone would leave custody signing with a value its verifiers do not hold,
      # which is a silent estate-wide event-delivery failure rather than a fix.
      # It needs one coordinated rotation of every service at once. Recorded, not
      # forgotten: `custody/src/env.ts` says the same thing where the guard that
      # deliberately does not cover it is defined.
      INSTANCE_ID: custody-estate
    # THE KEYRING. Not in `environment:` above and it never may be — see
    # `x-custody-secrets` at the head of this file for the whole argument.
    # `environment:` WINS over `env_file:` in compose, so a line reinstated above
    # would silently override this one and the file would look correct while the
    # placeholder was live again.
    env_file:
      - *custody-secret-file
      - *outbox-secret-file
    # THE VAULT. Without it `POST /v1/addresses` fails with EACCES on the first
    # write and this estate cannot mint a key at all — which was true until the
    # faucet asked for one. See the `custody-keys` block at the foot of this file
    # for the whole finding and for why `down -v` is not a safe habit here.
    #
    # `/var/lib/custody`, the PARENT of `CUSTODY_DATA_DIR`'s default
    # (`/var/lib/custody/keys`, custody/src/env.ts): the service creates its
    # own `keys/` subdirectory, and mounting the leaf would leave the parent
    # unwritable and reproduce the same EACCES one level up.
    volumes:
      - custody-keys:/var/lib/custody
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}107:4000"
    depends_on:
      custody-migrate:
        condition: service_completed_successfully
      custody-keys-init:
        condition: service_completed_successfully
      agora:
        condition: service_healthy
    healthcheck: *healthcheck

  # ========================================== tier 3: the money and product tier
  #
  # Every service below reads a SERVICE TOKEN from its environment and presents
  # it to an upstream. Those variables are `requiredSecret`, so a 24+ character
  # placeholder is enough to BOOT — the token is only rejected when the service
  # actually calls someone. That is why these come up on placeholders and
  # `estate-bootstrap.sh` replaces them with real, identity-minted tokens before
  # any flow that crosses a service boundary is verified.
  #
  # ── THE TEN-MINUTE CLIFF ──────────────────────────────────────────────────────
  #
  # identity issues service tokens with a TTL of 600 seconds
  # (identity/src/tokens.ts). Nothing below re-mints. wallet built the seam for
  # it — `const token = () => env.serviceToken` (wallet/src/index.ts), a
  # function called per request precisely so a short-TTL token could rotate
  # without a restart — but the function returns a static environment string, and
  # its own comment concedes the rotation waits for "when identity starts minting
  # them". So ten minutes after the bootstrap, every service-to-service call in
  # this tier starts failing 401 until the bootstrap is run again. This is a real
  # defect, it belongs to identity and the service repos rather than to this
  # file, and it is recorded here because a running environment is the only place
  # it was ever going to be visible.

  # ------------------------------------------------------------------- wallet
  # --------------------------------------------------------------- settlement
  settlement-migrate:
    <<: *migrate-defaults
    build:
      context: ../../settlement
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      SETTLEMENT_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/settlement?sslmode=require
      LEDGER_URL: http://ledger:4000
      CUSTODY_URL: http://custody:4000
      INDEXER_URL: http://indexer:4000
      # ── THE CREDENTIAL, UNDER ITS OWN NAME AT LAST ────────────────────────
      # See the `settlement` block below for why this replaces
      # `SETTLEMENT_SERVICE_TOKEN` rather than sitting beside it. On the
      # migrator for the reason wallet's block gives: `src/migrator.ts` imports
      # the eager `env.ts`, so it resolves the credential at boot exactly as the
      # service does.
      SETTLEMENT_IDENTITY_CREDENTIAL: ${SETTLEMENT_IDENTITY_CREDENTIAL:-}
      # On the migrator for the reason wallet's block gives: `src/migrator.ts`
      # imports the eager `env.ts` and parses this at boot.
      SETTLEMENT_RPC_URLS: *settlement-rpc-urls
      SETTLEMENT_NETWORK: *money-network
      INSTANCE_ID: settlement-migrate
    env_file: *outbox-secrets
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not.
    # Same reason as the `indexer`, `foresight` and `faucet` blocks, and on the
    # MIGRATOR as well because `src/migrator.ts` imports the eager `env.ts`,
    # which parses SETTLEMENT_RPC_URLS at boot.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    <<: *service-defaults
    build:
      context: ../../settlement
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      SETTLEMENT_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/settlement?sslmode=require
      LEDGER_URL: http://ledger:4000
      CUSTODY_URL: http://custody:4000
      INDEXER_URL: http://indexer:4000
      # ── THE CREDENTIAL, UNDER ITS OWN NAME AT LAST (micro-org#191 §2) ─────
      #
      # `estate-bootstrap.sh` has minted `SETTLEMENT_IDENTITY_CREDENTIAL` into
      # both tokens files all along and no compose block referenced it, so it
      # reached no container. The bootstrap papered over that by writing the same
      # secret a second time under `SETTLEMENT_SERVICE_TOKEN`, which
      # `settlement/src/env.ts` accepts off the `cfsc_` prefix. That alias is
      # deleted in the same commit as this line, because leaving both is worse
      # than either: the workaround would then be permanent and invisible.
      #
      # Confirmed on this estate 2026-08-10 before making the change: the two
      # keys in `compose/estate/tokens.env` hold the SAME 48-character `cfsc_`
      # value — identical sha256 prefix bc42662d5f60 — so this is a rename of the
      # slot the secret arrives in, not a new secret. `tokens.testnet.env`
      # carries the credential under its own name too.
      #
      # REPLACES the token rather than joining it, and that is enforced:
      # `check-service-credential-wiring.py` refuses a block that carries a
      # credential beside a `*_SERVICE_TOKEN` with a non-empty default, because
      # the old `estate-placeholder-token-0000000000000000` default hands the
      # service forty characters that read as configured. No default here for the
      # same reason as wallet's: an absent credential must be a hard `/readyz`
      # failure, not a placeholder.
      SETTLEMENT_IDENTITY_CREDENTIAL: ${SETTLEMENT_IDENTITY_CREDENTIAL:-}
      # See the anchor. Without this the service boots reporting `endpoint:false`
      # for all five chains and can neither build nor broadcast anything.
      SETTLEMENT_RPC_URLS: *settlement-rpc-urls
      # Same anchor, same reason: settlement booted reporting network:"testnet"
      # on the mainnet estate, so its treasury pins and sweeps were addressed to
      # the wrong half of custody.
      SETTLEMENT_NETWORK: *money-network
      INSTANCE_ID: settlement-estate
    env_file: *outbox-secrets
    # ── THE NAME THE RPC MAP IS WRITTEN IN HAS TO RESOLVE (micro-org#191 §1) ──
    #
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not.
    # Same reason as the `indexer`, `foresight` and `faucet` blocks, whose own
    # comments say so — and this is the block that needed it most and did not
    # have it. The anchor's EMBER default is `http://host.docker.internal:8545`,
    # so without this line every EMBER withdrawal failed to build with
    # `TypeError: fetch failed`, was retried to its stuck deadline and refunded,
    # against a Hearth node that was healthy and one hop away.
    #
    # Measured on this estate 2026-08-10, which is the asymmetry this repairs:
    #   cloudsforge-estate-settlement-1          ExtraHosts []
    #   cloudsforge-estate-settlement-migrate-1  ExtraHosts []
    #   cloudsforge-estate-indexer-1             ExtraHosts [host.docker.internal:host-gateway]
    # and `getent hosts host.docker.internal` returns nothing inside settlement
    # while indexer resolves it to 172.17.0.1.
    #
    # THIS REPLACES A WORKAROUND THAT IS NOT PORTABLE. Both estates' untracked
    # tokens files currently pin `EMBER_RPC_URL` to that literal 172.17.0.1
    # address, which is only what `host-gateway` happens to mean on this daemon
    # and is silently wrong on any host whose bridge is not 172.17.0.0/16. Those
    # two lines are an operator deletion, not a commit — the files are gitignored
    # by design — and the bootstrap's carry-forward now preserves any key it does
    # not itself write, so they survive indefinitely until deleted by hand.
    # `/readyz` green with them gone is the run that distinguishes the repair
    # from the workaround.
    #
    # `host-gateway` is a no-op where the name already resolves, as indexer says.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}104:4000"
    depends_on:
      settlement-migrate:
        condition: service_completed_successfully
      ledger:
        condition: service_healthy
      custody:
        condition: service_healthy
      # indexer is a member of the estate now (its profile is gone; see its
      # block) so INDEXER_URL resolves. It is still NOT waited on here, and that
      # is deliberate rather than an oversight: INDEXER_CHAINS is unset, so
      # indexer follows no chain and has no deposit to report. This service must
      # boot whether or not indexer is healthy, exactly as it did before.
    healthcheck: *healthcheck

  # -------------------------------------------------------------------- trade
  # --------------------------------------------------------------- aetherholm
  #
  # ── THE THIRD FORGE WORLDS TITLE, AND ONE OF FIVE DEPLOYABLES NEVER RUN ─────
  #
  # `deployableRepos()` lists 45 services; this file served 40. The five missing
  # were `aetherholm`, `emberkin`, `foresight`, `beacon` and `faucet`, and
  # `scripts/web-check.py` had been naming them on every run under "registry rows
  # with no container in this compose file". That is correctly not a failure —
  # this file is not obliged to serve every deployable — but three of the five
  # are the BACKENDS OF FRONTENDS THIS ESTATE ALREADY SERVES. `aetherholm-web`
  # has been up on its own hostname with its API absent.
  #
  # ── THE PORT, AND WHY THIS IS *NOT* A SECOND tessera ────────────────────────
  #
  # aetherholm BINDS 4120 by default (`aetherholm/src/env.ts`, `.env.example`,
  # `Dockerfile:87`), and 4120 IS ADMIN-API'S HOST PORT IN THIS FILE. The tessera
  # block above argues at length for keeping a service's own bind port and moving
  # the healthcheck instead; that argument turns on 4022 sitting BELOW the derived
  # 4100+ block, where no number of new repositories can ever reach it. 4120 has
  # the opposite property: it is already taken, here, today.
  #
  # So this follows `nda` — which EXPOSEs 4110, another number this file hands to
  # somebody else (notify's host port), and is normalised to 4000 by
  # `x-common-env`. Twenty-one of the twenty-two services in this file bind 4000;
  # tessera is the single argued exception, not the pattern. The container port is
  # 4000 and the HOST port is derived.
  #
  # HOST PORT 4124 IS DERIVED, NOT CHOSEN: index 24 in `deployableRepos()`, via
  # `portFor` (org/tools/cfctl.ts). `make check-web` recomputes it.
  #
  # ── WHAT IT IS HANDED, AND WHAT IT DELIBERATELY IS NOT ──────────────────────
  #
  # Its `.env.example` has a closing section headed "not read by this service",
  # and it is load-bearing rather than decorative: phase 1 makes NO outbound HTTP
  # call. The title contract is inbound — worlds calls POST /v1/provision with a
  # credential carrying `aetherholm:provision` — and every background timer is a
  # leased job against its own database. So there is no upstream URL and no
  # service credential here. Rule 9 is not "declare the variables you might want";
  # a variable nothing reads is a secret nothing needed, handed to a container
  # anyway.
  # ------------------------------------------------------------- aetherholm
  #
  # NOT A SERVICE ANY MORE. Wave M3 of `docs/service-merge-plan.md`: micro-aetherholm's
  # code ships inside micro-emberkin's image as plain directories under `src/aetherholm/`,
  # so `aetherholm` and `aetherholm-migrate` are GONE from here rather than merely
  # unrendered — an absorbed service's old image is stale by construction, and running it
  # beside the absorber would point two versions of the same code at one database.
  #
  # `AETHERHOLM_DATABASE_URL` moved onto `emberkin` and `emberkin-migrate` above, and it is
  # the only thing that moved. The NAME still resolves in Kubernetes: `scripts/k8s-render.py`
  # emits it as an ExternalName from MERGED_INTO, and refuses to render if a compose service
  # by that name returns.
  # ------------------------------------------------------------------- beacon
  #
  # ── THE RELEASE GATE, WHICH HAD NEVER RUN IN ANY ENVIRONMENT ────────────────
  #
  # Synthetic monitoring: journeys, incidents and SLOs. It is the service that
  # answers "does the estate actually work", and it is the one that had never been
  # started — so every judgement about this environment so far has been made
  # without it. HOST PORT 4143 IS DERIVED: index 43 in `deployableRepos()`.
  #
  # ── BEACON_TOKEN IS INBOUND BREAK-GLASS, NOT AN OUTBOUND SERVICE TOKEN ──────
  #
  # A static shared secret, like `ANALYTICS_TOKEN`, and NOT minted by identity.
  # Its own header says why it is checked BEFORE the identity token: "when
  # identity is the thing that has broken, a Beacon that could only be read with
  # an identity token would be a Beacon nobody can read." Minting this from
  # identity would destroy the one property it exists to have.
  #
  # ── BEACON_SERVICE_CREDENTIAL IS A CREDENTIAL, AND THE NAMES DO NOT MATCH ───
  #
  # This is the third variable in this file whose name has to be checked against
  # its USE rather than read (see tessera and emberkin above, in the opposite
  # direction). `beacon/src/ecosystem.ts` EXCHANGES it at
  # `POST /service-tokens/exchange` for a `ledger:read` token, so it is the
  # long-lived `cfsc_…` kind — which section 5b of `estate-bootstrap.sh` already
  # mints, under the name `BEACON_IDENTITY_CREDENTIAL`. The deploy is where those
  # two names are joined, and that is exactly what a deploy is for.
  #
  # SUPPLYING IT MAKES THE GATE STRICTER, WHICH IS WHY IT IS SUPPLIED. Without a
  # credential `ecosystemJourneys()` DOES NOT DECLARE the trial-balance journey at
  # all — the repository's own comment draws the line: "absent because it cannot
  # run", which it holds, versus "declared and skipping for ever", which is how a
  # gate gets switched off. An unset credential here would silently buy a smaller
  # suite that still reports green.
  #
  # ── THE SIX TARGETS ARE READ OFF THE JOURNEYS, NOT CHOSEN ───────────────────
  #
  # `ctx.target('…')` across `src/` names exactly six: activity, hub-api,
  # identity, ledger, market, worlds. A target a journey asks for and this list
  # omits is a journey that cannot run, so the list is derived from the call sites
  # the same way the grants map is.
  #
  # `BEACON_BROWSER_EXECUTABLE` is deliberately UNSET: no browser is installed in
  # this image, and its own env.ts documents absent as a supported mode. The
  # browser journeys stay undeclared rather than declared-and-failing.
  #
  # ── OPEN, FOUND BY RUNNING IT: EVERY SLO OBSERVATION IS BEING DROPPED ───────
  #
  # Starting this service surfaced a real gap within one scheduling cycle, which
  # is precisely the argument for deploying the gate rather than reasoning about
  # it. All eleven journeys run and are recorded in `journey_runs`, but every
  # `slo_observations` insert fails:
  #
  #   insert or update on table "slo_observations" violates foreign key
  #   constraint "slo_observations_slo_name_fkey"
  #
  # `jobs.ts` records against `journeySloName(name)` = `<journey>.runs`, and
  # `slos` is EMPTY: nothing seeds it. `upsertSlo` has exactly one caller in the
  # repository — `PUT /v1/slos/:name` (server.ts, admin-only) — so an SLO is
  # REGISTERED, never derived, and beacon ships no catalogue.
  #
  # It does not crash: `jobs.ts` catches and warns, so the service is healthy
  # and the journeys are real. What is lost is every objective and every error
  # budget — the numbers the gate is supposed to gate ON. A green `/readyz` here
  # is worth less than it looks, which is this file's recurring lesson.
  #
  # NOT FIXED HERE, AND THE CHOICE IS DELIBERATE. Registering eleven SLOs from
  # `estate-bootstrap.sh` is defensible — section 5c already argues that WHO
  # RECEIVES WHAT is deploy configuration, and an objective of 99% is written
  # down (13-operational-model.md, "99% of scheduled runs pass. A skip counts
  # against it"). But the objective, tier and window of each journey are the
  # GATE'S OWN policy, and inventing eleven of them in a compose repository is
  # how a threshold nobody agreed to becomes the one the estate is judged by.
  # Reported to micro-beacon: either seed the declared journeys' SLOs at boot, or
  # make a missing SLO a startup failure instead of a per-cycle warning. Until
  # then this container runs its journeys and reports no budget.
  beacon-migrate:
    <<: *migrate-defaults
    build:
      context: ../../beacon
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      BEACON_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/beacon?sslmode=require
      BEACON_TOKEN: ${BEACON_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); inbound break-glass, see runbooks/runbook-beacon-token.md}
      INSTANCE_ID: beacon-migrate
    depends_on:
      postgres:
        condition: service_healthy

  beacon:
    <<: *service-defaults
    build:
      context: ../../beacon
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # ── BEACON MUST TRUST THE ESTATE CA, BECAUSE IT PROBES OVER REAL TLS ──────────
      #
      # Probes target the addresses a person uses — `https://hub.<apex>/` — so they
      # traverse DNS, TLS, Traefik routing and the upstream. A probe that skipped the
      # gateway would report healthy while the gateway was broken, which is exactly
      # how a `cf-api-explorer` router that never existed went unnoticed for days.
      #
      # That path is served by the estate's own CA, which nothing inside the estate
      # trusted. Every probe failed `UNABLE_TO_VERIFY_LEAF_SIGNATURE`, opened a SEV3,
      # and the public status page reported a full outage that was not happening.
      #
      # The fix is to TRUST the certificate, never to stop verifying it. Disabling
      # verification here would make beacon blind to a real certificate failure — and
      # the estate has already paid for that once tonight: 183 uses of `curl -k` hid a
      # gateway serving `CN=TRAEFIK DEFAULT CERT` that every browser refused, while
      # every check passed.
      #
      # ── IT IS THE BUNDLE NOW, AND THE MAINNET GATEWAY IS WHY ─────────────────────
      #
      # `trust.crt` is the estate CA plus every public root in `gateway/trust/`,
      # rebuilt by `scripts/gateway-cert.sh`. The mainnet gateway terminates on a
      # Cloudflare Origin CA leaf (`gateway/dynamic/tls.yml`) so that Cloudflare
      # Tunnel stops refusing the origin and answering 502; the testnet gateway
      # still serves the estate leaf, because the origin certificate is one label
      # deep and does not cover `*.testnet.<apex>`. Beacon runs in BOTH projects
      # against BOTH apexes, so `ca.crt` alone would have taken every mainnet probe
      # to `UNABLE_TO_VERIFY_LEAF_SIGNATURE` — the exact outage this block was
      # written for, reintroduced from the other end.
      #
      # The container path is renamed with the file. `/etc/ssl/estate/ca.crt`
      # holding two roots would be a name that lies to the next reader, which is
      # the cost this repository keeps paying for elsewhere.
      NODE_EXTRA_CA_CERTS: /etc/ssl/estate/trust.crt
      BEACON_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/beacon?sslmode=require
      BEACON_TOKEN: ${BEACON_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); inbound break-glass, see runbooks/runbook-beacon-token.md}
      # ── `wallet` AND `custody` ADDED 2026-08-04, AND THE ABSENCE WAS NOT NEUTRAL ────
      #
      # `estate.reachable` has named `wallet` in its service list since it was written and
      # had no address for it, so it quietly skipped that target on every cycle — a service
      # the estate runs, that beacon believed it was watching, and was not.
      #
      # `custody` is new here and is what `ecosystem.deposit-address` needs. That journey
      # asks custody directly whether it is holding the key wallet just handed out, which is
      # the assertion no per-service suite can make: `POST /v1/deposits` answered 500 for the
      # whole life of the service because wallet sent no `orderId`, and both suites passed.
      #
      # Compose-network names, not gateway hostnames, exactly like the six beside them.
      # These are SERVICE targets — the browser tier is the only one that must use a real
      # public hostname, because a page derives its API hosts from the one it was loaded from.
      # `studio` joins the list because market and foresight now hold ASSET
      # REFERENCES that only studio can resolve, so it sits on the read path of
      # two surfaces that were already smoke-tested and it was not smoke-tested
      # at all. This is the in-cluster address — the browser-facing one is
      # `STUDIO_PUBLIC_URL` on those two services, and the two are different
      # things that happen to name one container.
      #
      # ── `identity` IS THE ONE TARGET THAT IS NOT THIS ESTATE'S CONTAINER ───────────
      #
      # It said `http://identity:4000` like the rest until 2026-08-16, and on the
      # testnet estate that address is `cf-testnet-identity-1` — a container every
      # other service in this file stopped trusting when `*identity-trust` above
      # started following `CF_IDENTITY_URL` (micro-org#459 stage 2, #472). It still
      # answers, it still signs, and NOTHING accepts what it signs.
      #
      # Measured on testnet, seven journeys open and failing for two days:
      #
      #   ecosystem.trial-balance   expected 2xx from /service-tokens/exchange, got 401
      #   identity.register         expected 2xx from /service-tokens/exchange, got 401
      #   ecosystem.one-account     expected 200 from /v1/dashboard, got 401
      #   ecosystem.one-portfolio   expected 200 from /v1/dashboard, got 401
      #   ecosystem.one-activity    expected 200 from activity /feed, got 401
      #   ecosystem.event-bus       expected 200 from activity /feed, got 401
      #   ecosystem.deposit-address expected 201 from POST /v1/deposits, got 401
      #
      # Two different 401s with one cause. The pool signs in here and hands the token
      # to `ledger`/`activity`/`wallet`, which verify against the JWKS at
      # `CF_IDENTITY_URL`; and `mintServiceToken` (`beacon/src/calls.ts`) exchanges
      # `BEACON_SERVICE_CREDENTIAL` here, and that credential row lives at the
      # identity this estate declares, not at the one it happens to run.
      #
      # The seeder had the identical defect and was fixed first — `IDENTITY_BASE` in
      # `scripts/seed/lib.mjs`, which hard-coded `https://nimbus${WEB_SUFFIX}` and
      # 401'd a whole testnet seeding run. This line is the same fix at the compose
      # tier: the journeys must sign in where the services they call verify.
      #
      # `${CF_IDENTITY_URL:-http://identity:4000}` and NOT a second literal, so this
      # target and the `IDENTITY_URL` on `*identity-trust` cannot drift apart — two
      # readings of one question that can disagree is the shape of the defect above.
      # The default keeps mainnet byte-identical: unset there, where the in-compose
      # identity IS the shared one, which is why mainnet's journeys were green
      # throughout.
      #
      # The net claim makes the crossing safe rather than merely possible: a testnet
      # service exchanging at the mainnet identity is minted `net=testnet` from the
      # credential row's own `network` column (`identity/src/tokens.ts`), so this
      # buys a valid token for THIS estate and not a passport to the other one.
      BEACON_TARGETS: identity=${CF_IDENTITY_URL:-http://identity:4000},ledger=http://ledger:4000,market=http://market:4000,worlds=http://worlds:4000,activity=http://activity:4000,hub-api=http://hub-api:4000,wallet=http://wallet:4000,custody=http://custody:4000,studio=http://studio:4000
      # ── AND THE CONSEQUENCE OF THE LINE ABOVE, DECLARED RATHER THAN GUESSED ────────────────
      #
      # Pointing the journeys at the identity their services trust fixed seven 401s and exposed
      # something the combined view never decided: that identity's `event_subscriptions` are bare
      # service names — `http://activity:4000/ingest` — which resolve inside ITS compose network
      # and nowhere else. So a session committed for a testnet account reaches MAINNET's activity,
      # and testnet's activity, whose only producer identity has ever been, receives nothing ever
      # again. Measured 2026-08-16: activity's inbox on both estates carries three topics, all
      # `identity.*`, and testnet's newest record is 10:32:18 — the minute the pool stopped
      # signing in locally.
      #
      # Three journeys (`ecosystem.event-bus`, `.one-activity`, `.one-account`) assert a fact
      # committed in identity arriving here. On an estate whose identity is elsewhere that is not
      # a failing assertion, it is an unanswerable one, and no product change makes it green. They
      # read this and skip — which is NOT green: `journeys.ts` emits 0.5 and the gate counts a
      # skip exactly as a failure. micro-org#474 holds the cross-estate delivery decision, whose
      # expensive half is `identity.user.deleted`: sixteen subscribers, none of them testnet's, so
      # a deleted user keeps every row they wrote on the testnet data plane.
      #
      # `:+` and not `:-`: it expands to `true` only when `CF_IDENTITY_URL` is set and non-empty,
      # which is exactly and only when this estate's identity is somebody else's. Mainnet gets the
      # empty string. Derived from the SAME variable as the target above so the two cannot drift —
      # beacon inferred this from the target shape for one revision, and that inference called an
      # IP-addressed estate two estates.
      BEACON_IDENTITY_FOREIGN: ${CF_IDENTITY_URL:+true}
      BEACON_SERVICE_CREDENTIAL: ${BEACON_IDENTITY_CREDENTIAL:-}
      # ── THE POOL THE JOURNEYS SIGN IN AS, WHICH NOTHING PASSED THROUGH ──────
      #
      # Eight provisioned accounts, as JSON. `beacon/scripts/provision-journey-accounts.md`
      # describes making them; this line is what carries them, and until it existed the
      # variable could be set in `tokens.env` all day and never reach the container.
      #
      # Measured on mainnet 2026-08-11, with the pool unprovisioned: EIGHT OF FIFTEEN
      # journeys skipping — `identity.signin`, `identity.handoff`, all five `ecosystem.*`
      # and both `browser.*`. Every journey that passed was one that needs no session, so
      # the monitor was green while proving nothing at all about the signed-in product.
      #
      # A skip rather than a fail is the correct behaviour when it is unset (`pool.ts`: an
      # estate that has not provisioned the pool has not demonstrated a broken product) —
      # but a skip nobody reads is indistinguishable from a pass, and this one went unread
      # long enough to matter.
      #
      # `:-` and not `:?`: an estate that has not provisioned the pool must still boot.
      BEACON_JOURNEY_ACCOUNTS: ${BEACON_JOURNEY_ACCOUNTS:-}
      # The SSO origin the handoff journey hands off TO. Unset, `identity.handoff`
      # SKIPS rather than guesses an origin — correctly, since a guessed origin would
      # test nothing and report green. That skip was the last open SEV2 and the last
      # skipped critical journey on the release gate.
      BEACON_HANDOFF_ORIGIN: https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # ── A STATUS PAGE BEHIND A LOGIN IS NOT A STATUS PAGE ────────────────────
      #
      # `BEACON_PUBLIC_STATUS` defaults FALSE (`beacon/src/env.ts`) and was set nowhere here,
      # so `GET /api/status/public` ran `authorise(ctx, deps, READ_SCOPE)` first
      # (`beacon/src/server.ts`) and answered 401 to the browser that is meant to read it.
      # `status-web` therefore rendered "Not determined — our status service answered with HTTP
      # 404" (404 because the gateway had no route either; both halves are fixed together, and
      # adding only the route would have turned the 404 into a 401, which is not progress).
      #
      # Turning it on is safe because of what the route serves, not because of who reaches it:
      # `beacon/src/publicstatus.ts` PROJECTS the document rather than redacting one, so no target
      # name, no error string, no latency and no journey step name can appear in it — a field it
      # was never told about is a field it cannot leak.
      BEACON_PUBLIC_STATUS: "true"
      INSTANCE_ID: beacon-estate
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}142:4000"
    depends_on:
      beacon-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      ledger:
        condition: service_healthy
      # `hub-api` was here as a second dependency until wave M5d absorbed it — it is a module of
      # agora now, so the line above already waits for the process that serves the dashboard.
      # A `depends_on` naming a service the file no longer declares is a hard compose error, not a
      # tolerated stale reference, which is why this one had to move with the merge rather than
      # after it.
      agora:
        condition: service_healthy
    healthcheck: *healthcheck

  # ------------------------------------------------------------------ faucet
  #
  # The fourth of the five never-run deployables, and the one that decides
  # whether this testnet is usable by anybody who is not holding the miner's
  # key. Until it is here, "a real EMBER testnet" means a chain the owner can
  # spend on and nobody else can.
  #
  # HOST PORT 4144 IS DERIVED: index 44 in `deployableRepos()`, the last row.
  # Re-derived rather than inherited — `node --import tsx -e "import
  # {deployableRepos} from './tools/registry.ts'; …"` in micro-org prints
  # `4144 faucet ops`, and `make check-web` recomputes it on every run.
  #
  # It BINDS 4013 by default (`faucet/src/env.ts`, `Dockerfile:84`), which
  # is not a number this file hands to anybody — but it is normalised to 4000
  # anyway, by `x-common-env`'s `PORT`. That follows `nda` and `aetherholm` and
  # not `tessera`: tessera's 4022 is argued from sitting BELOW the derived 4100+
  # block where no new repository can ever collide with it, and every other
  # service in this file binds 4000 so that ONE healthcheck anchor covers them.
  # A second bind port is a second anchor and a second thing to get wrong.
  #
  # ── CUSTODY_TOKEN IS PRESENTED, NOT EXCHANGED, AND THAT WAS CHECKED ─────────
  #
  # The fourth variable in this file whose authority had to be read out of the
  # source rather than off its name. `faucet/src/index.ts` is
  # `token: () => env.custodyToken`, handed straight to `HttpClient`, which sets
  # `authorization: Bearer <that value>` verbatim (`runtime/packages/http/src/
  # index.ts`). There is no `ServiceTokenProvider` anywhere in this
  # repository. So the value must be a ten-minute JWT from
  # `POST /service-tokens` — NOT `FAUCET_IDENTITY_CREDENTIAL`, which section 5b
  # of the bootstrap also mints and which is sitting in `tokens.env` looking
  # like the obvious answer. A `cfsc_…` secret here would 401 every signature
  # request with nothing in either log naming the cause.
  #
  # It is fed from `FAUCET_CUSTODY_TOKEN` rather than from a variable called
  # `CUSTODY_TOKEN`: the container's variable is generic, `tokens.env` is one
  # flat file shared by every service, and a bare `CUSTODY_TOKEN=` line there
  # would be a token belonging to one service under a name that reads like it
  # belongs to all of them.
  #
  # THE TEN-MINUTE CLIFF IS REAL HERE AND IS WORSE THAN EMBERKIN'S, because the
  # call site is a TIMER and not a request path. `driveChain` runs on the job
  # queue (`faucet/src/jobs.ts`), so a drip requested more than ten minutes
  # after a bootstrap reaches custody with an expired bearer — the exact shape
  # that froze EMBER reconciliation through ledger. What it costs here is
  # bounded and visible rather than silent: the dispense stays `queued`, the
  # row is retried, and it completes on the next bootstrap. The honest fix
  # belongs to micro-faucet — adopt `ServiceTokenProvider` and read
  # `FAUCET_IDENTITY_CREDENTIAL`, which the bootstrap already mints — and is
  # reported there rather than papered over here.
  #
  # ── THE FUNDING ADDRESS IS MINTED, NOT CHOSEN ──────────────────────────────
  #
  # `custodyclient.ts` is explicit that the faucet must get its OWN
  # treasury-purpose address and must not use custody's PINNED `(ember,
  # testnet)` treasury, which is settlement's: two services on one nonce is how
  # a payment is permanently lost. `POST /v1/addresses` is not idempotent —
  # every call derives a fresh BIP-44 index — so `estate-bootstrap.sh` §5d looks
  # the address up by its `(userId, orderId)` binding on `GET /v1/admin/keys`
  # first and mints only when there is none, then writes
  # `FAUCET_FUNDING_ADDRESS` into `tokens.env` beside the tokens.
  #
  # The default below is the ZERO ADDRESS, and it is a placeholder that boots
  # rather than one that works: `env.ts` validates the SHAPE (0x + 40 hex) and
  # nothing else, so the container starts, serves `/v1/faucet`, and refuses
  # every drip at the balance check. That is the right failure — a faucet that
  # cannot pay says so, and the bootstrap replaces it on its first run.
  #
  # `FAUCET_CUSTODY_ORDER_ID` / `_USER_ID` are the other half of that binding.
  # Custody compares seven identity fields character for character and its 403
  # deliberately does not name which one disagreed (`custody/src/keys.ts`),
  # so these cannot be debugged from a response: they are written here, read by
  # the bootstrap from this same file, and never typed twice.
  #
  # ── AND THE CHAIN, WHICH THIS SERVICE WILL NOT LET THE DEPLOY CHOOSE ───────
  #
  # There is NO chain-id variable. `faucet/src/env.ts` reads 7412 from
  # `@cloudsforge/contracts-chain` and exits if `FAUCET_CHAIN_ID` is set to
  # anything else — the frozen `hearth/tools/faucet` compared the node against a
  # variable that DEFAULTED TO 7411, EMBER MAINNET, which verifies agreement
  # rather than identity. So the only chain input here is the RPC URL, and it is
  # the same expression `indexer` uses: `host.docker.internal` plus
  # `extra_hosts`, because hearth is frozen and attaching it to this project's
  # network would mean editing it.
  #
  # ── AND THAT IS WHY BOTH FAUCET SERVICES SIT BEHIND A PROFILE ──────────────
  #
  # `faucet/src/env.ts` is `export const NETWORK = 'testnet' as const`, with
  # the annotation chosen so that `NETWORK === 'mainnet'` is a COMPILE ERROR and
  # not a branch. `index.ts` reads `eth_chainId` at boot and calls
  # `process.exit(1)` on anything that is not 7412. There is no configuration
  # under which this service runs against EMBER mainnet, deliberately: its own
  # header calls a testnet faucet pointed at mainnet "an unauthenticated
  # withdrawal endpoint".
  #
  # So when `CF_EMBER_NETWORK=mainnet` this service must not be started at all.
  # Started anyway it does not degrade — it crash-loops, taking `--wait` with it.
  # Compose has no way to REMOVE a service for one environment, only to add one
  # for a profile, so the profile is on the faucet and `compose/testnet.env` opts
  # in with `COMPOSE_PROFILES=ember-testnet`. The consequence is stated rather
  # than buried: a plain `docker compose -f compose/docker-compose.estate.yml up`
  # now brings up NO FAUCET, because its plain default is the mainnet chain. An
  # estate that wants a faucet is an estate on the testnet chain, and it is
  # brought up with `--env-file compose/testnet.env`, which sets both.
  #
  # `faucet-migrate` carries the same profile: it imports the same `env.ts` and
  # would fail the same check, and a migration run for a service that is not
  # running is a database touched for no reason.
    volumes:
      # Read-only, and only public certificates — never a key. `trust.crt` is a
      # DERIVED file: `scripts/gateway-cert.sh` rebuilds it from `ca.crt` plus
      # `gateway/trust/*.pem` on every run, and `estate-up.sh` runs that before
      # anything here starts. A bind of a file that does not exist yet is created
      # by Docker as a DIRECTORY, and beacon would then fail to start rather than
      # probe unverified — loud, and the right way round.
      - ../gateway/certs/trust.crt:/etc/ssl/estate/trust.crt:ro
  faucet-migrate:
    profiles: ["ember-testnet"]
    <<: *migrate-defaults
    build:
      context: ../../faucet
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      FAUCET_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/faucet?sslmode=require
      # The migrator imports the same `env.ts`, which builds the WHOLE config
      # before it opens a connection — so every required value is supplied here
      # too. It dials none of them and signs nothing.
      FAUCET_TOKEN: ${FAUCET_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); PIN FAUCET_REQUESTER_SALT BEFORE ROTATING or every rate-limit bucket re-keys (faucet/src/env.ts:425)}
      # PINNED, AND THE PINNING IS THE POINT: unset, faucet DERIVES this salt from
      # FAUCET_TOKEN (faucet/src/env.ts -> requester.ts), so rotating the token
      # would silently re-key every requester pseudonym and rate-limit bucket. Pinned
      # to the value derived from the PRE-ROTATION token, continuity survives rotation.
      FAUCET_REQUESTER_SALT: ${FAUCET_REQUESTER_SALT:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet)}
      FAUCET_RPC_URL: ${EMBER_RPC_URL:-http://host.docker.internal:8545}
      CUSTODY_URL: http://custody:4000
      CUSTODY_TOKEN: ${FAUCET_CUSTODY_TOKEN:-estate-placeholder-token-0000000000000000}
      FAUCET_FUNDING_ADDRESS: ${FAUCET_FUNDING_ADDRESS:-0x0000000000000000000000000000000000000000}
      FAUCET_CUSTODY_USER_ID: faucet-estate
      FAUCET_CUSTODY_ORDER_ID: faucet-estate-treasury-1
      INSTANCE_ID: faucet-migrate
    depends_on:
      postgres:
        condition: service_healthy

  faucet:
    # See the long note above `faucet-migrate`: this service cannot run on the
    # EMBER mainnet, by a compile-time constant in its own source.
    profiles: ["ember-testnet"]
    <<: *service-defaults
    build:
      context: ../../faucet
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      FAUCET_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/faucet?sslmode=require
      # Inbound, not outbound: the credential Prometheus presents in
      # `x-faucet-token` to read `/metrics`, which publishes the REMAINING
      # BUDGET and is gated for exactly that reason. Never identity-minted —
      # asking identity for it would produce a token that opens nothing, which
      # is the mistake `analytics` was removed from the CREDENTIALS list for.
      FAUCET_TOKEN: ${FAUCET_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); PIN FAUCET_REQUESTER_SALT BEFORE ROTATING or every rate-limit bucket re-keys (faucet/src/env.ts:425)}
      # PINNED, AND THE PINNING IS THE POINT: unset, faucet DERIVES this salt from
      # FAUCET_TOKEN (faucet/src/env.ts -> requester.ts), so rotating the token
      # would silently re-key every requester pseudonym and rate-limit bucket. Pinned
      # to the value derived from the PRE-ROTATION token, continuity survives rotation.
      FAUCET_REQUESTER_SALT: ${FAUCET_REQUESTER_SALT:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet)}
      FAUCET_RPC_URL: ${EMBER_RPC_URL:-http://host.docker.internal:8545}
      CUSTODY_URL: http://custody:4000
      CUSTODY_TOKEN: ${FAUCET_CUSTODY_TOKEN:-estate-placeholder-token-0000000000000000}
      FAUCET_FUNDING_ADDRESS: ${FAUCET_FUNDING_ADDRESS:-0x0000000000000000000000000000000000000000}
      FAUCET_CUSTODY_USER_ID: faucet-estate
      FAUCET_CUSTODY_ORDER_ID: faucet-estate-treasury-1
      # The browser origin that posts a drip. `faucet` is a SURFACE on the
      # Network site — `subdomain: 'network'`, `basePath: '/faucet'`
      # (`ui/packages/ui/src/surfaces.ts`) — not a host of its own, so the
      # Origin header on a real drip is `https://network.<apex>` and nothing
      # else. The allowlist has no wildcard and fails closed, so naming the
      # wrong host here is a faucet that answers every browser with 403 while
      # every server-side probe stays green.
      FAUCET_CORS_ORIGINS: https://network${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # 60 confirmations is `contracts-chain`'s EMBER depth and is NOT
      # configurable from here. On a laptop chain that is minutes per drip; the
      # dispense is `sent` long before it is `confirmed`, and both states are
      # readable at `GET /v1/drips/:id`.
      INSTANCE_ID: faucet-estate
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not,
    # and there the faucet would boot, warn that the node is unreachable, serve
    # anyway, and queue every drip for ever. Same reason as `indexer`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}143:4000"
    depends_on:
      faucet-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      custody:
        condition: service_healthy
    healthcheck: *healthcheck

  # ====================================================== tier 4: the two BFFs
  # ---------------------------------------------------------------- admin-api
  # NOTE: admin-api/src/server.ts returns 501 for bootstrap and identity grants
  # no admin role, so the FIRST ADMIN IS A MANUAL UPDATE. That is deliberate,
  # and `estate-bootstrap.sh` does it as an explicit, named step rather than
  # leaving it as folklore.
  # ------------------------------------------------------------------ hub-api
  # No migrator and no database: it is a BFF that composes other services'
  # answers and owns no state. It mints SEVEN separate narrow service tokens,
  # one per upstream, rather than one token with the union of the scopes —
  # which is the least-privilege property the scope vocabulary exists to make
  # possible.
  # ══════════════════════════════════════════ tier 5: the sixteen frontends ════
  #
  # ── WHY THEY ARE HERE ─────────────────────────────────────────────────────────
  #
  # Until this section, this file defined 22 domain services and NOT ONE FRONTEND
  # CONTAINER, and `docs/ecosystem/22-browser-journeys.md` §8.7 named that as the
  # blocker it is: 318 browser scenarios are specified, 86 of them are tier T3 and
  # need the estate, and *none of them could run* because nothing in the estate
  # served a bundle. A T3 harness was being built in micro-beacon against an
  # environment that could not host it.
  #
  # ── THE HOST PORTS ARE DERIVED, LIKE EVERY OTHER PORT HERE ────────────────────
  #
  # 4100 + the repository's index in micro-org's registry — the same `portFor`
  # rule the 21 services above obey (org/tools/cfctl.ts, over
  # `deployableRepos()` in org/tools/registry.ts). Read out of the registry
  # rather than typed:
  #
  #   node --import tsx -e "import {deployableRepos} from './tools/registry.ts'; \
  #     deployableRepos().forEach((r,i)=>console.log(4100+i, r.name))"   # in micro-org
  #
  # ── THERE ARE NO LONGER ANY CHOSEN PORTS IN THIS FILE ─────────────────────────
  #
  # This block used to say four surfaces — `foresight-web`, `foresight-admin-web`,
  # `emberkin-web`, `aetherholm-web` — were ABSENT FROM THE REGISTRY and so took
  # 4136-4139 by hand, "THE ONLY CHOSEN PORTS IN THIS FILE". micro-org's registry
  # has since been swept from 46 rows to 70 and carries all four, plus `tessera`,
  # `tessera-web` and the three services behind those surfaces. Every host port
  # here is now derived. Nothing in this file is chosen.
  #
  # THE SWEEP MOVED SIXTEEN OF THEM, and this is the part worth remembering: the
  # new rows went in MID-LIST rather than appended — four services ahead of the
  # frontend block, five frontends ahead of ops. The port IS the index, so every
  # row below an insertion moved. The eleven original frontends each slid +4
  # (hub-web 4122 → 4126). `tessera` went 4140 → 4125. The four surfaces above
  # were reordered among themselves. `tessera-web` stayed on 4141 by arithmetic
  # coincidence — which is exactly why individual numbers must never be adopted
  # one at a time: a spot-check of the two ports somebody noticed would have
  # found one already correct and left fourteen wrong.
  #
  # ── THE GUARD, WHICH FOR A LONG TIME DID NOT EXIST ────────────────────────────
  #
  # These lines used to end: "`scripts/web-check.py` fails when this file and the
  # registry disagree, so the drift cannot be silent." THAT SCRIPT DID NOT EXIST.
  # `scripts/` held nine files and none of them was it. The estate's signature
  # defect — a check that cannot fail — in its purest form: one that could not
  # even run, asserted in a comment directly above the thing it claimed to guard.
  # The drift was, in fact, silent, and it stayed silent through a 24-row sweep.
  #
  # The script is now written, and the claim is true rather than aspirational. It
  # executes micro-org's registry rather than parsing it — a regex over
  # `registry.ts` would be a second private copy of the list whose drift is the
  # bug — checks all 39 pins here AND the ports `scripts/estate-verify.sh` drives,
  # and refuses to skip: if micro-org cannot be reached it reports failure rather
  # than a success it did not establish. Run it with `make check-web`.
  #
  # ── WHAT A GREEN HEALTHCHECK HERE IS WORTH ────────────────────────────────────
  #
  # Nothing on its own. See the note on `x-web-defaults`. The proof is in
  # `scripts/estate-verify.sh`.

  # -------------------------------------------------------------- hub-web (hub)
  # THE MOST LOAD-BEARING FRONTEND IN THE ESTATE, for a reason that is not its own
  # feature set: it serves the SIGN-IN SURFACE. `signInRedirect()` sends every
  # product's signed-out visitor to `${accountUrl()}/login`, and the `signin`
  # registry row resolves that to `hub.<apex>/account`
  # (ui/packages/ui/src/surfaces.ts, the `signin` entry). Nothing served that
  # address in any environment, which is why docs/ecosystem/22 §8.1 calls it the
  # largest blocker in the catalogue. Bringing this container up is what closes
  # the environment's half of it.
  hub-web:
    <<: *web-defaults
    # ── AND THE SAME ONE THING, FOR THE SAME REASON (micro-org#406) ──────────
    #
    # `hub-web` serves `/mine`, which reads `GET /v1/pool` from `pool.<apex>` —
    # the service that does not exist on an estate without the `pool` profile.
    # MEASURED 2026-08-11: `hub-testnet.cloudsforge.online/mine` could not load
    # pool status, and the page rendered a full-page failure for it, so EMBER —
    # mined in the tab against hearth, nothing to do with micro-pool — was
    # unreachable behind an error about micro-pool. On the one network where
    # EMBER is the only thing a browser can usefully mine.
    #
    # Same variable, same document, same asymmetry as `pool-web` below: this
    # container's nginx renders `/deployment.json` from it at start, only the
    # exact string `absent` means "no pool here", and the IMAGE defaults to
    # `present` so an estate that has never heard of the flag is unchanged. The
    # full argument — why not a profile, why not a build arg, why the default
    # cannot live in the template — is at `pool-web`.
    #
    # WHAT IT CHANGES HERE IS SMALLER, AND DELIBERATELY SO. `pool-web` has
    # nothing to be without a pool; this surface has a wallet, a portfolio and
    # an EMBER miner. `absent` replaces one panel with an explanation and a link
    # to the network that does run a pool, and stops two doomed cross-origin
    # requests — the page's and the mining bar's, the second of which fires on
    # every address in the app. It removes nothing else.
    environment:
      POOL_API_PRESENCE: "${POOL_API_PRESENCE:-present}"
    build:
      context: ../../hub-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}126:8080"

  # ------------------------------------------------------------- site (apex)
  # The apex. It has no subdomain in the registry, which is why the gateway routes
  # it on the bare apex host rather than on `site.<apex>`.
  site:
    <<: *web-defaults
    build:
      context: ../../site
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}127:8080"

  # --------------------------------------------------------- admin-web (admin)
  admin-web:
    <<: *web-defaults
    build:
      context: ../../admin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}128:8080"

