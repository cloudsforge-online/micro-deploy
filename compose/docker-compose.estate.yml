  # -------------------------------------------------- devportal-web (developers)
  # `developers.<apex>`, from the registry — NOT `devportal.`, which is the
  # repository name. gateway/dynamic/policy.yml already carries the correction and
  # the reason it was found.
  devportal-web:
    <<: *web-defaults
    build:
      context: ../../devportal-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}135:8080"

  # ------------------------------------------------------- status-web (status)
  status-web:
    <<: *web-defaults
    build:
      context: ../../status-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}136:8080"

  # --------------------------------------------- foresight-web (foresight) 4138
  # From here down, the four surfaces micro-org's registry did not carry until the
  # 46→70 sweep. They are derived now, like everything else, and the sweep also
  # REORDERED them relative to each other: emberkin-web sorts ahead of the two
  # foresight surfaces in the registry, so it holds 4137 while its block still sits
  # below theirs in this file. The blocks are not in port order and never were —
  # `pricing` (4105) is above `activity` (4109) too. The number is read from the
  # registry, not from position in this file.
  foresight-web:
    <<: *web-defaults
    build:
      context: ../../foresight-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}138:8080"

  # ── foresight-admin-web WAS HERE (4139), and the P13 fold removed it ────────
  #
  # The Foresight operator panel is a SECTION inside the operator console now —
  # `admin.<apex>/foresight`, served by the `admin-web` container above — so there
  # is no second bundle to run and no second hostname to serve it on.
  #
  # ── The gap recorded here for two months is closed, in both directions ──────
  #
  # This block used to carry a long note saying `foresight-admin` was the one
  # surface hostname in the estate not read out of `ui/packages/ui/src/surfaces.ts`,
  # and that the missing row broke `cloudsforgeHosts()`: the label was not in
  # `KNOWN_SUBS`, so it was not stripped, the whole host became the apex, and
  # sign-out resolved to `https://hub.foresight-admin.<apex>/account/logout` — a
  # 404 — with identity, billing and telemetry composed the same way. The note
  # ended "THE FIX IS ONE `subdomain: 'foresight-admin'` ROW IN micro-ui."
  #
  # That row was added, which fixed it. It has now been REMOVED again, and that is
  # not a regression: the row was needed because a bundle answered at that name,
  # and none does. The screens derive their apex through the `admin` row, which is
  # a known subdomain and always was.
  #
  # Nothing was left behind. `gateway/dynamic/estate-web.yml` lost the bundle
  # router and its service, `policy.yml` lost the CORS origin, `cloudflared/gen.py`
  # lost two tunnel hostnames, and micro-org's registry lost the repository row.
  # `scripts/surface-routes.py` is what forces them to move together.
  #
  # Host port 4139 is free. It is deliberately NOT reassigned: the ports in this
  # file are pinned by hand and other repositories have written some of them down,
  # so a gap costs nothing and shuffling to close one costs a search.

  # ------------------------------------------ emberkin-web (emberkin)      4137
  emberkin-web:
    <<: *web-defaults
    build:
      context: ../../emberkin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}137:8080"

  # ------------------------------------------ aetherholm-web (aetherholm)  4140
  aetherholm-web:
    <<: *web-defaults
    build:
      context: ../../aetherholm-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}139:8080"

  # ------------------------------------------ tessera-web (tessera)        4141
  # The SIXTEENTH frontend, and the first whose service is also in this file.
  # foresight-web, emberkin-web and aetherholm-web are bundles with no backend
  # here, which is why estate-web.yml writes no `/v1` router for them: a router
  # pointing at a container that does not exist answers 502, and 502 reads as
  # "the service fell over" — a wrong diagnosis, permanently. tessera-web DOES
  # get one, beside its surface, exactly as that file's note says to do "the day
  # one of these services joins the estate".
  tessera-web:
    <<: *web-defaults
    build:
      context: ../../tessera-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}140:8080"
    # ── `/world-assets/`, THE ONE micro-tessera-web NAMED AS MOST LIKELY TO BE
    #    MISSED — AND `materialise.py` HAS SINCE LANDED ────────────────────────
    #
    # `tessera-web/nginx.conf:73` serves `location /world-assets/` with
    # `try_files $uri =404` and NO index.html fallback — deliberately, because a
    # sprite request answered with HTML decodes as a corrupt PNG rather than as
    # a 404, and the client would report a decode failure for a file that simply
    # is not there. Its own comment says the bytes are "NOT served from this
    # image. micro-deploy maps it … to wherever micro-tessera-assets is
    # materialised".
    #
    # THESE LINES USED TO SAY micro-tessera-assets "HAS NO materialise.py" and
    # described what to do "the day it lands". IT LANDED (its af1aa98). That is
    # the same defect as the `web-check.py` this file once claimed to have and
    # did not: a comment describing the present as the future, sitting directly
    # above the thing it describes. Corrected by wiring it, not by deleting the
    # sentence.
    #
    #     python3 materialise.py --provider flux-2-pro --into <dir>   # in micro-tessera-assets
    #     CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh
    #
    # Switching sets is the whole point and is why this is MOUNTED rather than
    # baked, unlike the chrome every web app carries in its own `public/`: a set
    # is 392 files, and comparing FLUX against a challenger by rebuilding the
    # image would be a rebuild per comparison. The client makes that safe — it
    # resolves by stable relative path and there is NO code path in the bundle
    # that can name a provider (`tessera-web/src/lib/hosts.ts:100-112`), so the
    # directory behind the path is the only variable.
    #
    # THE DEFAULT IS STILL THE EMPTY DIRECTORY, and that is a supported state,
    # not a stopgap: with no art mounted the location 404s, which is what the
    # bundle expects and what `scripts/estate-verify.sh` asserts — including
    # that it 404s WITHOUT the app shell.
    volumes:
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/usr/share/nginx/html/world-assets:ro
    depends_on:
      tessera-assets-check:
        condition: service_completed_successfully

  # ═══════════════════ the two OPERATOR consoles — and the only containers ═════
  #                     in this file with NO PUBLISHED HOST PORT
  #
  # ── WHY THEY EXIST ────────────────────────────────────────────────────────────
  #
  # `lantern` and `beacon` are `inSwitcher: true` in ui/packages/ui/src/surfaces.ts
  # and, until tonight, `servesUi: false`: the operator switcher offered every
  # admin two entries that answered **404 application/json** on their own
  # hostnames, because estate-web.yml routed the WHOLE host to the API and said so
  # in as many words — "no bundle is served at `beacon.<apex>`". `micro-lantern-web`
  # and `micro-beacon-web` were written to fill exactly that gap, and this is the
  # half of it that lives here.
  #
  # ── WHY THERE IS NO `ports:` BLOCK, WHICH IS THE ONE THING THAT LOOKS WRONG ───
  #
  # Every other frontend above publishes `127.0.0.1:41xx:8080`, derived as
  # `4100 + the repository's index in micro-org's deployableRepos()`. These two
  # publish NOTHING, and that is a decision rather than an omission:
  #
  #   1. **`micro-lantern-web` and `micro-beacon-web` have no row in micro-org's
  #      registry**, so there is no index for them and therefore no derived port.
  #      `scripts/web-check.py` check 4 is explicit about what happens if one is
  #      chosen anyway — "a chosen port in a derived block is how 'tessera' ended
  #      up on 4140" — and it FAILS on a 4100+ pin whose name the registry does
  #      not carry. Publishing 4145/4146 here would go red immediately.
  #
  #   2. **Adding the rows is not free and is not this repository's to make.**
  #      The port IS the index, so two `web()` rows inserted beside the other
  #      frontends would push `lantern` (4142), `beacon` (4143) and `faucet`
  #      (4144) down by two and move every pin below them — the same mid-list
  #      insertion that silently moved sixteen ports during the 46→70 sweep.
  #      Appending after `faucet` would avoid the shift, but micro-org is not a
  #      repository this change owns, and a registry row added from here would be
  #      a second copy of the very list whose drift these checks exist to end.
  #
  #   3. **Nothing needs the port.** A host port on a frontend is a developer
  #      convenience; the estate reaches these bundles by container name on the
  #      compose network, which is what `cf-web-lantern` and `cf-web-beacon` in
  #      gateway/dynamic/estate-web.yml point at (`http://lantern-web:8080`).
  #      And a loopback port is the WRONG way to open either of them anyway:
  #      both are `adminOnly` bundles that sign in through `nimbus.<apex>` and
  #      read their own API same-origin, so on `127.0.0.1:41xx` `cloudsforgeHosts()`
  #      takes the LOCAL_HOSTS branch and the page resolves an estate that is not
  #      there. `https://lantern.<apex>` is the only address either one works at,
  #      and it is the address `estate-verify.sh` drives them on.
  #
  # `web-check.py` reads pins, not services: a container with no `127.0.0.1:`
  # mapping is simply not in `compose_pins()`, so this is not a hole in the check
  # — there is no number here for it to have an opinion about.

  # ------------------------------------------ lantern-web (lantern.<apex>)
  # Shares `lantern.<apex>` with micro-lantern, which is what makes
  # `resolveApiBase()` return the empty string and every `/v1/issues` request
  # relative (lantern-web/src/lib/hosts.ts). estate-web.yml splits the hostname:
  # `/v1`, `/otlp`, `/ingest`, `/metrics`, `/livez`, `/readyz` to the service at
  # priority 600, everything else to this bundle at 500.
  lantern-web:
    <<: *web-defaults
    build:
      context: ../../lantern-web
      additional_contexts: *web-contexts
      args: *web-build-args

  # ------------------------------------------ beacon-web (beacon.<apex>)
  # Same arrangement, and for this one same-origin is not a preference but the
  # only workable option: micro-beacon sends no `access-control-*` header
  # anywhere in its source and answers 404 to a preflight, so a bundle on any
  # other hostname could not read it at all. micro-beacon-web's own nginx.conf
  # carries a plain-text 404 on `/v1|/api|/metrics|/livez|/readyz` naming this
  # exact gateway rule, so a mis-ordered priority reports itself instead of
  # rendering the console under an API address.
  beacon-web:
    <<: *web-defaults
    build:
      context: ../../beacon-web
      additional_contexts: *web-contexts
      args: *web-build-args

  # ------------------------------------------------ lantern (ops)          4142
  #
  # ══════════════════════════════════════════════════════════════════════════════
  # THE OBSERVABILITY SINK, WHICH THIS FILE DID NOT CONTAIN.
  #
  # `grep -c lantern docker-compose.estate.yml` returned 0. Sixteen frontends have
  # shipped `src/lib/obs.ts` posting browser telemetry since the day the template
  # was written, and NOT ONE EVENT HAS EVER BEEN STORED — because there was no
  # container to store it, and because the bundles were posting the wrong path,
  # the wrong envelope key and the wrong record shape at the same time.
  #
  # Those two failures HID EACH OTHER. A cross-origin POST to a host that does not
  # exist surfaces to the page as `TypeError: Failed to fetch`; so does a 404 that
  # carries no CORS headers. Deploying the service without fixing the bundles
  # would have produced `202 {"stored":0}` — accepted and discarded — and fixing
  # the bundles without deploying the service changes nothing observable at all.
  # Both halves are required before anything can be proven, which is why neither
  # was done for months.
  #
  # It sits LAST because nothing depends on it. That is a property worth stating:
  # a telemetry sink that another service waited on would be a telemetry sink
  # whose outage is an estate outage, and this one is deliberately not that. It
  # is also why it has no `depends_on` from anybody above.
  # ══════════════════════════════════════════════════════════════════════════════
  lantern-migrate:
    <<: *migrate-defaults
    build:
      context: ../../lantern
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LANTERN_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/lantern
      LANTERN_TOKEN: estate-only-lantern-token-000000000000
      INSTANCE_ID: lantern-migrate
    depends_on:
      postgres:
        condition: service_healthy

  lantern:
    <<: *service-defaults
    build:
      context: ../../lantern
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LANTERN_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/lantern
      # Thirty-six characters. `requiredSecret` refuses anything under 24 AND
      # refuses a known placeholder by name (`changeme`, `secret`, `token`, …),
      # so this cannot be shortened or made "obvious" without a dead container.
      LANTERN_TOKEN: estate-only-lantern-token-000000000000
      # ══════════════════════════════════════════════════════════════════════════
      # WITHOUT THIS THE SINK IS OFF, AND OFF MEANS 404 ON EVERYTHING.
      #
      # `rumOrigins` defaults to EMPTY, and empty is not "allow all" — it is the
      # sink disabled. `server.ts` throws NotFoundError before reading a byte, and
      # its own unknown-path diagnostics are unreachable too. Lantern would be
      # deployed, healthy, and still silent: the exact state this whole change
      # exists to end, wearing a green healthcheck.
      #
      # THESE ARE THE GATEWAY ORIGINS, NOT THE LOOPBACK PORTS, and that is the
      # correction that mattered. A bundle derives its siblings from the hostname
      # it was served on (`cloudsforgeHosts()`): served from
      # `https://hub.<apex>` it posts to `https://lantern.<apex>`, which is the
      # path the estate's own browser tier drives. Served from
      # `http://127.0.0.1:4126` it takes the LOCAL_HOSTS branch and posts to
      # `http://localhost:4010` — lantern's BIND port, which this file does not
      # publish because host ports here are derived, not chosen. So the loopback
      # origins are deliberately absent: listing them would advertise a route that
      # cannot complete, and an allowlist entry that can never match is another
      # check that cannot fail.
      #
      # Eighteen surfaces, same list and same order as IDENTITY_HANDOFF_ORIGINS
      # above. `site` is the bare apex — empty `subdomain` in the registry — which
      # is why the first entry carries no label.
      #
      # ── THE LAST TWO, AND WHY `lantern.` ITSELF IS ON ITS OWN ALLOWLIST ───────
      #
      # `lantern.` and `beacon.` are the operator consoles that now share these
      # two hostnames with their services. `beacon.` is the ordinary case — one
      # more surface shipping the shared UI, so one more origin posting to
      # `${hosts().lantern}/ingest/client` from `src/lib/obs.ts`.
      #
      # `lantern.` looks like a mistake and is not. `isAllowedOrigin` is
      # `env.rumOrigins.includes(origin)` over the browser's `Origin` header, and
      # a browser sends `Origin` on a cross-site-capable POST whether or not the
      # target happens to be the page's own host. So the console that exists to
      # READ Lantern would have had its own error reports refused with 400 — a
      # blind spot precisely over the pages an operator opens when something is
      # already wrong, which is the worst possible place for one.
      # ══════════════════════════════════════════════════════════════════════════
      LANTERN_RUM_ORIGINS: >-
        https://${CF_SITE_HOST:-cloudsforge.localtest.me},
        https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://market${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://create${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://trade${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://worlds${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
