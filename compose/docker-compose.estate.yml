  # ------------------------------------------------------------------- notify
  # Holds the most personal data in the estate — addresses, phone numbers, push
  # tokens, preferences — which is exactly why the registry's erasure SLA names
  # it first among the services that must forget a deleted user.
  notify-migrate:
    <<: *migrate-defaults
    build:
      context: ../../notify
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      NOTIFY_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/notify
      # ── EVERY LINK IN EVERY NOTIFICATION EMAIL WAS POINTING AT localhost ────────────────────
      #
      # A template declares a RELATIVE `path` — `/wallet`, `/settings/security/exports`,
      # `/developers/keys` — and notify resolves it against this. The value here was the dev
      # default, hardcoded rather than interpolated, on BOTH estates. So the welcome mail arrived
      # with a link to `http://localhost:4110/`, and so would every other templated link; the
      # verification mail was the one exception, because it carries a `verifyUrl` identity built
      # from `IDENTITY_ACCOUNT_URL` and never touches this.
      #
      # It went unseen because almost no mail was ever sent: the welcome mail could not be
      # addressed at all until micro-org#447, and the first one delivered after that fix is what
      # exposed this. Found by the owner, in an inbox, which is the only place it was visible.
      #
      # `hub`, because every path in `notify/src/templates.ts` is a hub-web route. Same shape as
      # `IDENTITY_ACCOUNT_URL` two hundred lines up, so the two agree about where an account
      # lives, and the localtest.me fallback keeps a bare `docker compose up` working.
      NOTIFY_PUBLIC_URL: https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      INSTANCE_ID: notify-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  notify:
    <<: *service-defaults
    build:
      context: ../../notify
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      NOTIFY_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/notify
      # ── EVERY LINK IN EVERY NOTIFICATION EMAIL WAS POINTING AT localhost ────────────────────
      #
      # A template declares a RELATIVE `path` — `/wallet`, `/settings/security/exports`,
      # `/developers/keys` — and notify resolves it against this. The value here was the dev
      # default, hardcoded rather than interpolated, on BOTH estates. So the welcome mail arrived
      # with a link to `http://localhost:4110/`, and so would every other templated link; the
      # verification mail was the one exception, because it carries a `verifyUrl` identity built
      # from `IDENTITY_ACCOUNT_URL` and never touches this.
      #
      # It went unseen because almost no mail was ever sent: the welcome mail could not be
      # addressed at all until micro-org#447, and the first one delivered after that fix is what
      # exposed this. Found by the owner, in an inbox, which is the only place it was visible.
      #
      # `hub`, because every path in `notify/src/templates.ts` is a hub-web route. Same shape as
      # `IDENTITY_ACCOUNT_URL` two hundred lines up, so the two agree about where an account
      # lives, and the localtest.me fallback keeps a bare `docker compose up` working.
      NOTIFY_PUBLIC_URL: https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # ── SMTP: PASSED THROUGH, NEVER WRITTEN HERE ─────────────────────────────
      #
      # Unconfigured is still a supported mode and still the default: every value
      # below falls back to empty, and `notify` treats an unset SMTP_HOST as "this
      # deployment does without email" rather than as an error. A local drill needs
      # rows, not emails.
      #
      # What changed is that a deployment which DOES send can now say so without
      # editing this file. The values arrive from `compose/estate/tokens.env` —
      # gitignored, symlinked as `compose/.env`, and loaded by Compose
      # automatically. **A credential must never be written into this file**, which
      # is committed and public.
      #
      # SMTP_SECURE is the one worth reading twice: it means IMPLICIT TLS, which is
      # port 465 only. On 587 and 2525 the session starts in the clear and upgrades
      # with STARTTLS, so `SMTP_SECURE=true` on 587 does not harden anything — it
      # makes the connection fail. Default false, because 587 is the port to use.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      INSTANCE_ID: notify-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}110:4000"
    depends_on:
      notify-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *healthcheck

  # ------------------------------------------------------------------- studio
  #
  # ── THE ASSET ROOT, AND WHY IT NEEDED A CONTAINER OF ITS OWN ──────────────────
  #
  # `STUDIO_ASSET_ROOT` was UNSET here, and `studio/src/env.ts` defaults it to
  # `./out` — resolved against WORKDIR, so `/app/out`. `/app` is root-owned
  # (`drwxr-xr-x root root`, every layer COPYed as root) and the image drops to
  # `USER node` (uid 1000). So the first thing every generation did was
  #
  #     EACCES: permission denied, mkdir '/app/out'
  #
  # for EVERY kind, flux and placeholder alike — while `/readyz` answered 200 and
  # compose reported the container `healthy`. Nothing in the service probes the
  # directory it exists to write, so the environment held a studio that could not
  # studio and said nothing. Driven, not read: a `mark` generation through
  # `POST /v1/brand-kits/:id/generate` returned that exact string in
  # `job.errorDetail`. micro-studio should refuse to be ready in this state; that
  # is its change to make and is filed rather than done here.
  #
  # The image's own comment states the contract this satisfies: the asset root
  # "must be a mounted volume THE DEPLOY MAKES WRITABLE — it is deliberately NOT
  # baked into the image, because an asset written into a container layer is an
  # asset lost on the next deploy" (studio/Dockerfile:68).
  #
  # ── WHY THE INIT CONTAINER IS NOT CEREMONY ────────────────────────────────────
  #
  # Naming a volume is NOT enough, and both obvious fixes reproduce the bug
  # exactly. Docker creates a fresh named volume's mount point root:root unless
  # the image already has that path with other ownership, so
  # `studio-assets:/assets` and `studio-assets:/home/node/assets` BOTH land
  # `drwxr-xr-x root root` and still EACCES as uid 1000. Both were run against
  # this image before this block was written.
  #
  # A host bind mount appears to work — and only here. Docker Desktop maps
  # ownership across virtiofs so the write lands whoever owns the host directory;
  # on Linux the same YAML gives a genuinely root-owned directory and the
  # original failure returns. A fix that is true on one operator's laptop and
  # false on the CI runner is the estate's signature defect wearing a fix's
  # clothes, so it is not used.
  #
  # One root one-shot that chowns the volume to 1000:1000 is portable, is the
  # standard pattern for exactly this, and keeps `USER node` intact — the
  # alternative, running studio as root, would trade a visible failure for a
  # permanently weaker container.
  studio-assets-init:
    image: busybox:1.37
    # The ONLY container here that runs as root, and it runs for milliseconds and
    # then exits. It holds no credential, opens no socket and reaches no network.
    user: "0:0"
    restart: "no"
    volumes:
      - studio-assets:/assets
    # 1000:1000 is `node` in node:22-slim, which is what studio's final stage
    # selects. Idempotent: re-running it on a populated volume is a no-op.
    command: ["sh", "-c", "mkdir -p /assets && chown -R 1000:1000 /assets && chmod 755 /assets"]

  studio-migrate:
    <<: *migrate-defaults
    build:
      context: ../../studio
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      STUDIO_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/studio
      INSTANCE_ID: studio-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    <<: *service-defaults
    build:
      context: ../../studio
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      STUDIO_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/studio
      # The variable this whole block exists for. See the header above.
      STUDIO_ASSET_ROOT: /var/lib/studio/assets
      # STUDIO_ASSET_BASE_URL is deliberately left unset: no HTTP server in this
      # environment serves that directory, so a base URL here would mint
      # `storageUrl`s that look fetchable and 404 — a zero wearing a status code.
      # Unset, `assets.ts` stores a `file://` URL, which is honest about where
      # the bytes actually are. Read them with
      #   docker compose -f compose/docker-compose.estate.yml run --rm \
      #     -v studio-assets:/a busybox:1.37 find /a -type f
      INSTANCE_ID: studio-estate
    # Spelled out rather than `*outbox-secrets`, because this service needs TWO
    # secret files and a YAML anchor cannot merge two sequences — which is the
    # exact case `x-outbox-secret-file`'s header says the ITEM anchor exists for.
    env_file:
      - *outbox-secret-file
      - *studio-secret-file
    volumes:
      - studio-assets:/var/lib/studio/assets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}111:4000"
    depends_on:
      studio-assets-init:
        condition: service_completed_successfully
      studio-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *healthcheck

