  # --------------------------------------------- foresight-web (foresight) 4138
  # From here down, the four surfaces micro-org's registry did not carry until the
  # 46→70 sweep. They are derived now, like everything else, and the sweep also
  # REORDERED them relative to each other: emberkin-web sorts ahead of the two
  # foresight surfaces in the registry, so it holds 4137 while its block still sits
  # below theirs in this file. The blocks are not in port order and never were —
  # `pricing` (4105) is above `activity` (4109) too. The number is read from the
  # registry, not from position in this file.
  foresight-web:
    <<: *web-defaults
    build:
      context: ../../foresight-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:4138:8080"

  # -------------------------------- foresight-admin-web (no micro-ui row)  4139
  # micro-org's registry now carries this repository, so the PORT is derived. What
  # it still has no row in is `ui/packages/ui/src/surfaces.ts` — a different
  # registry answering a different question — so it has no
  # registry subdomain either. It is served at `foresight-admin.<apex>` — a name
  # chosen here, and the only surface hostname in this estate that is not read out
  # of the registry. Recorded as a gap for micro-ui rather than fixed here: the
  # registry's own header says the list was maintained by hand in eight places and
  # had already drifted, and adding a sixteenth copy would be that mistake again.
  #
  # ── THAT GAP HAS NOW BEEN OBSERVED BREAKING SIGN-OUT, AND IT IS STILL NOT
  #    OURS TO FIX ────────────────────────────────────────────────────────────
  #
  # `cloudsforgeHosts()` (ui/packages/ui/src/index.tsx:156) derives the apex by
  # stripping the leftmost label ONLY when that label is in `KNOWN_SUBS`, and
  # `KNOWN_SUBS` (ui/packages/ui/src/surfaces.ts:688) is built from the SURFACES
  # registry's `subdomain` values. `foresight-admin` is in no such row, so the
  # label is NOT stripped, the whole host is taken to be the apex, and every
  # address that bundle composes gains a level:
  #
  #     at    foresight-admin.<apex>
  #     wrong https://hub.foresight-admin.<apex>/account/logout   ← 404
  #     right https://hub.<apex>/account/logout
  #
  # Reproduced against the built `dist/surfaces.js` rather than inferred. It is
  # NOT a prefixing bug and NOT gateway routing — this file's own routes for
  # `foresight-admin.<apex>` are correct, and nothing in the gateway composes
  # that URL. Falling back to the full host is DELIBERATE (a preview at
  # `pr-42.example.dev` is its own apex); the fault is the missing registry row.
  #
  # Sign-out is only the loudest symptom: identity, billing and telemetry are
  # composed the same way, which is exactly the Emberkin defect recorded at
  # surfaces.ts:445 and fixed there by adding the row. A gateway rewrite here
  # would hide one 404 and leave the other three, so it is deliberately not
  # done. THE FIX IS ONE `subdomain: 'foresight-admin'` ROW IN micro-ui.
  foresight-admin-web:
    <<: *web-defaults
    build:
      context: ../../foresight-admin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:4139:8080"

  # ------------------------------------------ emberkin-web (emberkin)      4137
  emberkin-web:
    <<: *web-defaults
    build:
      context: ../../emberkin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:4137:8080"

  # ------------------------------------------ aetherholm-web (aetherholm)  4140
  aetherholm-web:
    <<: *web-defaults
    build:
      context: ../../aetherholm-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:4140:8080"

  # ------------------------------------------ tessera-web (tessera)        4141
  # The SIXTEENTH frontend, and the first whose service is also in this file.
  # foresight-web, emberkin-web and aetherholm-web are bundles with no backend
  # here, which is why estate-web.yml writes no `/v1` router for them: a router
  # pointing at a container that does not exist answers 502, and 502 reads as
  # "the service fell over" — a wrong diagnosis, permanently. tessera-web DOES
  # get one, beside its surface, exactly as that file's note says to do "the day
  # one of these services joins the estate".
  tessera-web:
    <<: *web-defaults
    build:
      context: ../../tessera-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:4141:8080"
    # ── `/world-assets/`, THE ONE micro-tessera-web NAMED AS MOST LIKELY TO BE
    #    MISSED — AND `materialise.py` HAS SINCE LANDED ────────────────────────
    #
    # `tessera-web/nginx.conf:73` serves `location /world-assets/` with
    # `try_files $uri =404` and NO index.html fallback — deliberately, because a
    # sprite request answered with HTML decodes as a corrupt PNG rather than as
    # a 404, and the client would report a decode failure for a file that simply
    # is not there. Its own comment says the bytes are "NOT served from this
    # image. micro-deploy maps it … to wherever micro-tessera-assets is
    # materialised".
    #
    # THESE LINES USED TO SAY micro-tessera-assets "HAS NO materialise.py" and
    # described what to do "the day it lands". IT LANDED (its af1aa98). That is
    # the same defect as the `web-check.py` this file once claimed to have and
    # did not: a comment describing the present as the future, sitting directly
    # above the thing it describes. Corrected by wiring it, not by deleting the
    # sentence.
    #
    #     python3 materialise.py --provider flux-2-pro --into <dir>   # in micro-tessera-assets
    #     CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh
    #
    # Switching sets is the whole point and is why this is MOUNTED rather than
    # baked, unlike the chrome every web app carries in its own `public/`: a set
    # is 392 files, and comparing FLUX against a challenger by rebuilding the
    # image would be a rebuild per comparison. The client makes that safe — it
    # resolves by stable relative path and there is NO code path in the bundle
    # that can name a provider (`tessera-web/src/lib/hosts.ts:100-112`), so the
    # directory behind the path is the only variable.
    #
    # THE DEFAULT IS STILL THE EMPTY DIRECTORY, and that is a supported state,
    # not a stopgap: with no art mounted the location 404s, which is what the
    # bundle expects and what `scripts/estate-verify.sh` asserts — including
    # that it 404s WITHOUT the app shell.
    volumes:
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/usr/share/nginx/html/world-assets:ro
    depends_on:
      tessera-assets-check:
        condition: service_completed_successfully

  # ------------------------------------------------ lantern (ops)          4142
  #
  # ══════════════════════════════════════════════════════════════════════════════
  # THE OBSERVABILITY SINK, WHICH THIS FILE DID NOT CONTAIN.
  #
  # `grep -c lantern docker-compose.estate.yml` returned 0. Sixteen frontends have
  # shipped `src/lib/obs.ts` posting browser telemetry since the day the template
  # was written, and NOT ONE EVENT HAS EVER BEEN STORED — because there was no
  # container to store it, and because the bundles were posting the wrong path,
  # the wrong envelope key and the wrong record shape at the same time.
  #
  # Those two failures HID EACH OTHER. A cross-origin POST to a host that does not
  # exist surfaces to the page as `TypeError: Failed to fetch`; so does a 404 that
  # carries no CORS headers. Deploying the service without fixing the bundles
  # would have produced `202 {"stored":0}` — accepted and discarded — and fixing
  # the bundles without deploying the service changes nothing observable at all.
  # Both halves are required before anything can be proven, which is why neither
  # was done for months.
  #
  # It sits LAST because nothing depends on it. That is a property worth stating:
  # a telemetry sink that another service waited on would be a telemetry sink
  # whose outage is an estate outage, and this one is deliberately not that. It
  # is also why it has no `depends_on` from anybody above.
  # ══════════════════════════════════════════════════════════════════════════════
  lantern-migrate:
    <<: *migrate-defaults
    build:
      context: ../../lantern
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LANTERN_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/lantern
      LANTERN_TOKEN: estate-only-lantern-token-000000000000
      INSTANCE_ID: lantern-migrate
    depends_on:
      postgres:
        condition: service_healthy

  lantern:
    build:
      context: ../../lantern
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LANTERN_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/lantern
      # Thirty-six characters. `requiredSecret` refuses anything under 24 AND
      # refuses a known placeholder by name (`changeme`, `secret`, `token`, …),
      # so this cannot be shortened or made "obvious" without a dead container.
      LANTERN_TOKEN: estate-only-lantern-token-000000000000
      # ══════════════════════════════════════════════════════════════════════════
      # WITHOUT THIS THE SINK IS OFF, AND OFF MEANS 404 ON EVERYTHING.
      #
      # `rumOrigins` defaults to EMPTY, and empty is not "allow all" — it is the
      # sink disabled. `server.ts` throws NotFoundError before reading a byte, and
      # its own unknown-path diagnostics are unreachable too. Lantern would be
      # deployed, healthy, and still silent: the exact state this whole change
      # exists to end, wearing a green healthcheck.
      #
      # THESE ARE THE GATEWAY ORIGINS, NOT THE LOOPBACK PORTS, and that is the
      # correction that mattered. A bundle derives its siblings from the hostname
      # it was served on (`cloudsforgeHosts()`): served from
      # `https://hub.<apex>` it posts to `https://lantern.<apex>`, which is the
      # path the estate's own browser tier drives. Served from
      # `http://127.0.0.1:4126` it takes the LOCAL_HOSTS branch and posts to
      # `http://localhost:4010` — lantern's BIND port, which this file does not
      # publish because host ports here are derived, not chosen. So the loopback
      # origins are deliberately absent: listing them would advertise a route that
      # cannot complete, and an allowlist entry that can never match is another
      # check that cannot fail.
      #
      # Sixteen surfaces, same list and same order as IDENTITY_HANDOFF_ORIGINS
      # above. `site` is the bare apex — empty `subdomain` in the registry — which
      # is why the first entry carries no label.
      # ══════════════════════════════════════════════════════════════════════════
      LANTERN_RUM_ORIGINS: >-
        https://${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://hub.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://market.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://create.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://trade.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://worlds.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://explorer.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://network.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://developers.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://admin.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://status.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://foresight.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://foresight-admin.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://emberkin.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://aetherholm.${CF_WEB_APEX:-cloudsforge.localtest.me},
        https://tessera.${CF_WEB_APEX:-cloudsforge.localtest.me}
      INSTANCE_ID: lantern-estate
    ports:
      # 4142 — `deployableRepos()` index 42, immediately after tessera-web's 4141.
      # Derived, not chosen; `make check-web` re-derives it from micro-org.
      - "127.0.0.1:4142:4000"
    depends_on:
      lantern-migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck

  # ------------------------------------------ the world-art mount, VALIDATED ──
  #
  # ── WHY A HALF-POPULATED MOUNT IS THE DANGEROUS CASE, AND THE ONLY ONE ────────
  #
  # `micro-tessera-assets`' `materialise.py` already refuses an incomplete set:
  # it resolves all 392 entries before writing a byte, names every gap, and
  # materialises NOTHING on a miss — because "a directory that is mostly Qwen and
  # quietly partly FLUX" makes every judgement about the art a judgement about a
  # blend nobody chose. THAT GUARANTEE ENDS AT THE DIRECTORY. Nothing downstream
  # re-checks it, and a mount is trivially easy to get half right: a copy
  # interrupted, a subdirectory excluded, a path pointed one level too deep.
  #
  # And the symptom is the worst kind. `tessera-web/src/lib/sprites.ts` has NO
  # FALLBACK SPRITE by design — a missing sprite is "a visible hole with a name,
  # not a substitute" — so a 90%-populated mount renders a world with holes while
  # nginx answers 200 on everything it does have and every healthcheck in this
  # file stays green. That is exactly the shape of `STUDIO_ASSET_ROOT` being
  # unset, which EACCES'd every generation while the container reported healthy
  # and nothing in the service probed the directory it exists to write.
  #
  # So the mount is asserted before tessera-web serves, and there are three
  # states rather than two:
  #
  #   empty     no SET.json and no PNG. The documented default: no art here, the
  #             location 404s, the bundle expects it. PASSES, loudly.
  #   complete  SET.json present AND the PNG count equals its own
  #             `materialisedCount`. PASSES.
  #   anything  a receipt without its files, files without a receipt, or a count
  #   else      that disagrees. FAILS, and tessera-web does not start.
  #
  # The count is compared against the RECEIPT the writer left, not against a
  # number typed here. A literal 392 in this file would be a second copy of a
  # fact micro-tessera-assets owns, and it would be wrong the first time a set
  # gains an asset — which is the drift this estate has already paid for twice.
  tessera-assets-check:
    image: busybox:1.37
    restart: "no"
    volumes:
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/world-assets:ro
    # `sh -c`, single-quoted in YAML so `$` reaches the shell rather than compose.
    # busybox has no jq: `materialisedCount` is read with grep -o, which is
    # sufficient for a number this file did not write and does not parse further.
    command:
      - sh
      - -c
      - |
        set -e
        pngs=$$(find /world-assets -name '*.png' | wc -l)
        if [ -f /world-assets/SET.json ]; then
          want=$$(grep -o '"materialisedCount"[^0-9]*[0-9]*' /world-assets/SET.json | grep -o '[0-9]*$$')
          if [ -z "$$want" ]; then
            echo "FATAL: /world-assets/SET.json has no materialisedCount." >&2
            echo "       It was not written by materialise.py, so nothing can say what a" >&2
            echo "       complete mount is. Re-run: python3 materialise.py --provider <id> --into <dir>" >&2
            exit 1
          fi
          if [ "$$pngs" != "$$want" ]; then
            echo "FATAL: the world-art mount is HALF POPULATED." >&2
            echo "       SET.json says $$want file(s) were materialised; the mount holds $$pngs." >&2
            echo "       tessera-web has no fallback sprite, so serving this renders a world with" >&2
            echo "       holes while every healthcheck stays green. Refusing to start." >&2
            exit 1
          fi
          set_id=$$(grep -o '"provider"[^,]*' /world-assets/SET.json | head -1)
          echo "world art: $$pngs file(s), $$set_id — complete against its own receipt"
          exit 0
        fi
        if [ "$$pngs" != 0 ]; then
          echo "FATAL: /world-assets holds $$pngs PNG(s) and NO SET.json." >&2
          echo "       Nothing records which asset set this is, and nothing can check it is" >&2
          echo "       whole. The sets are deliberately the same shapes in the same colours," >&2
          echo "       so 'which model is this?' is not answerable by eye. Materialise it:" >&2
          echo "         python3 materialise.py --provider <id> --into <dir>   # micro-tessera-assets" >&2
          exit 1
        fi
        echo "world art: none mounted. /world-assets/ will 404, which is the supported default."
        echo "           To serve a set:  CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh"
        exit 0

# ── named volumes ──────────────────────────────────────────────────────────────
#
# The first one in this file, and the reason is worth stating: everything else
# here is deliberately ephemeral — postgres included, so that `down -v` and a
# fresh `up` is always a clean-room run of every migrator. Generated assets are
# the exception. They cost money to make (a FLUX.2-pro call at
# STUDIO_IMAGE_PRICE_USD each) and studio's rows point at them with
# `on delete restrict`, so bytes that vanish on restart leave the database
# referencing files that no longer exist. That is the state the content-addressed
# store is built to avoid.
#
# NOTE FOR ANYONE CLEANING UP: this volume is NOT ephemeral scratch. `docker
# compose down -v` destroys paid artefacts and orphans every `assets` row.
volumes:
  studio-assets:
