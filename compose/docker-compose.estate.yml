  # ------------------------------------------------------------------ tessera
  #
  # ── THE PORT, AND WHY THIS BLOCK LOOKS DIFFERENT FROM THE TWENTY-ONE ABOVE ──
  #
  # Every other service here binds 4000 (from `x-common-env`) and is mapped to a
  # derived host port. **tessera binds 4022**, and that is not a quirk to
  # normalise — it is the point of the choice, argued at 23-tessera.md §10.1 and
  # again in `tessera/src/env.ts`.
  #
  # This estate keeps three port spaces and keeps confusing them: the port a
  # service BINDS, the HOST port here (derived, `4100 + index in
  # deployableRepos()`), and micro-ui's `devPort`, which is documented as "not an
  # allocation; it is a fact about a service". Spaces one and two already collide
  # THREE TIMES in repositories that are pushed and green: emberkin binds 4100,
  # which is identity's host port in this very file; aetherholm binds 4120, which
  # is admin-api's; nda binds 4110, which is notify's. Each of those services
  # binds a number this file hands to somebody else.
  #
  # 4022 sits BELOW the derived 4100+ block, so no number of repositories
  # appended to `deployableRepos()` can grow into it. Setting `PORT: "4000"` here
  # would make this container disagree with its own Dockerfile (`EXPOSE 4022`),
  # with `tessera/src/env.ts`, and with the `tessera` row in micro-ui's registry
  # — whose test pins 4022 as "the port the service binds". A pin that is false
  # in the only environment that exists is worse than no pin, so the port stays
  # and the healthcheck moves. That is the whole cost: one extra anchor.
  #
  # ── HOST PORT 4125, AND WHY IT IS NO LONGER 4140 ────────────────────────────
  #
  # This block used to read "micro-org's REGISTRY has no `tessera` or
  # `tessera-web` entry … so no index exists to derive from", and took 4140 and
  # 4141 by hand. THAT IS NO LONGER TRUE. The registry was swept from 46 rows to
  # 70 and now carries both, so both are derived like everything else — and the
  # sweep INSERTED the new rows mid-list rather than appending, which moved
  # sixteen of this file's thirty-nine host ports at once.
  #
  # `tessera` derives to 4125 (index 25), behind `emberkin`, `foresight` and
  # `aetherholm`, which were inserted ahead of it. 4140 now belongs to
  # `aetherholm-web`, so leaving this at 4140 would not have been a stale number
  # — it would have been ANOTHER SERVICE'S number.
  #
  # `tessera-web` derives to 4141, which is exactly what was chosen for it by
  # hand. That agreement is arithmetic coincidence and is worth naming, because
  # it is precisely what makes this class of drift look survivable: two ports
  # were noticed, one of them already matched, and fourteen others were wrong.
  # `scripts/web-check.py` now recomputes ALL of them against the registry.
  #
  # The BIND port below is a different question and is not touched: 4022 stays.
  #
  # ── WHAT IT TALKS TO, AND WHAT IS DELIBERATELY OPTIONAL ─────────────────────
  #
  # `STUDIO_URL`, `LEDGER_URL` and `MARKET_URL` are all optional in
  # `tessera/src/env.ts`, and their absence is a SUPPORTED mode: the Kiln
  # answers 503 `kiln_unconfigured` rather than 500 and every other route still
  # serves. They are set anyway, because a world whose Kiln is cold in the one
  # environment we can drive is a world whose Kiln has never been driven.
  tessera-migrate:
    <<: *migrate-defaults
    build:
      context: ../../tessera
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # Explicit, and it OVERRIDES the 4000 in `x-common-env` — an explicit key
      # beats a merge key in YAML. The migrator binds nothing, but it loads the
      # same `env.ts`, and a migrator that disagreed with its service about the
      # port would be one more copy of a fact to drift.
      PORT: "4022"
      TESSERA_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/tessera
      # A SECOND variable holding the same value, on purpose. `tessera/src/env.ts`
      # explains it: outbound signatures and inbound verification are one secret
      # today and stop being one the day the estate moves to per-producer signing
      # keys. A service that read one variable for both would have to be found.
      INSTANCE_ID: tessera-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  tessera:
    <<: *service-defaults
    build:
      context: ../../tessera
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      PORT: "4022"
      TESSERA_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/tessera
      STUDIO_URL: http://studio:4000
      LEDGER_URL: http://ledger:4000
      MARKET_URL: http://market:4000
      # ── NOW A CREDENTIAL, BECAUSE THE FIX THIS COMMENT ASKED FOR HAS LANDED ──
      #
      # This block used to explain why tessera had to be handed a ten-minute JWT:
      # it presented the value directly as a bearer, so a long-lived credential
      # would have produced a Bearer that is not a JWT and studio would have
      # answered 401 to every firing. It ended by naming the fix — micro-tessera
      # adopting `ServiceTokenProvider`. That is what 1.2.0 does, so the token is
      # gone and the credential it exchanges takes its place.
      #
      # `TESSERA_SERVICE_CREDENTIAL` is NOT passed through. It is vestigial in
      # 1.2.0 and the value the tokens files still hold for it is a 718-byte JWT,
      # which `assertServiceCredential` refuses BY NAME (micro-org#222) — so
      # forwarding it would refuse the boot rather than degrade. The identity
      # credential below always wins when both are set, which makes the variable
      # pure downside here.
      #
      # The default this replaces was `estate-placeholder-token-0000000000000000`:
      # 40 characters, on no deny-list, over every length floor, and therefore
      # passed by every guard in the estate. That is micro-org #142 exactly, and
      # it is why the guard now asserts SHAPE instead of keeping a list.
      #
      # No IDENTITY_URL: it derives from IDENTITY_ISSUER via *identity-trust.
      TESSERA_IDENTITY_CREDENTIAL: ${TESSERA_IDENTITY_CREDENTIAL:-}
      INSTANCE_ID: tessera-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}125:4022"
    depends_on:
      tessera-migrate:
        condition: service_completed_successfully
      studio:
        condition: service_healthy
      ledger:
        condition: service_healthy
      market:
        condition: service_healthy
    healthcheck: *healthcheck-4022

  # --------------------------------------------------------------- aetherholm
  #
  # ── THE THIRD FORGE WORLDS TITLE, AND ONE OF FIVE DEPLOYABLES NEVER RUN ─────
  #
  # `deployableRepos()` lists 45 services; this file served 40. The five missing
  # were `aetherholm`, `emberkin`, `foresight`, `beacon` and `faucet`, and
  # `scripts/web-check.py` had been naming them on every run under "registry rows
  # with no container in this compose file". That is correctly not a failure —
  # this file is not obliged to serve every deployable — but three of the five
  # are the BACKENDS OF FRONTENDS THIS ESTATE ALREADY SERVES. `aetherholm-web`
  # has been up on its own hostname with its API absent.
  #
  # ── THE PORT, AND WHY THIS IS *NOT* A SECOND tessera ────────────────────────
  #
  # aetherholm BINDS 4120 by default (`aetherholm/src/env.ts`, `.env.example`,
  # `Dockerfile:87`), and 4120 IS ADMIN-API'S HOST PORT IN THIS FILE. The tessera
  # block above argues at length for keeping a service's own bind port and moving
  # the healthcheck instead; that argument turns on 4022 sitting BELOW the derived
  # 4100+ block, where no number of new repositories can ever reach it. 4120 has
  # the opposite property: it is already taken, here, today.
  #
  # So this follows `nda` — which EXPOSEs 4110, another number this file hands to
  # somebody else (notify's host port), and is normalised to 4000 by
  # `x-common-env`. Twenty-one of the twenty-two services in this file bind 4000;
  # tessera is the single argued exception, not the pattern. The container port is
  # 4000 and the HOST port is derived.
  #
  # HOST PORT 4124 IS DERIVED, NOT CHOSEN: index 24 in `deployableRepos()`, via
  # `portFor` (org/tools/cfctl.ts). `make check-web` recomputes it.
  #
  # ── WHAT IT IS HANDED, AND WHAT IT DELIBERATELY IS NOT ──────────────────────
  #
  # Its `.env.example` has a closing section headed "not read by this service",
  # and it is load-bearing rather than decorative: phase 1 makes NO outbound HTTP
  # call. The title contract is inbound — worlds calls POST /v1/provision with a
  # credential carrying `aetherholm:provision` — and every background timer is a
  # leased job against its own database. So there is no upstream URL and no
  # service credential here. Rule 9 is not "declare the variables you might want";
  # a variable nothing reads is a secret nothing needed, handed to a container
  # anyway.
  aetherholm-migrate:
    <<: *migrate-defaults
    build:
      context: ../../aetherholm
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      AETHERHOLM_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/aetherholm
      INSTANCE_ID: aetherholm-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  aetherholm:
    <<: *service-defaults
    build:
      context: ../../aetherholm
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      AETHERHOLM_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/aetherholm
      INSTANCE_ID: aetherholm-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}124:4000"
    depends_on:
      aetherholm-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *healthcheck

  # ----------------------------------------------------------------- emberkin
  #
  # The monster-collecting RPG, played through Forge Worlds. `emberkin-web` has
  # been served by this estate with this API absent, exactly as aetherholm was.
  #
  # HOST PORT 4122 IS DERIVED: index 22 in `deployableRepos()`. Its natural bind
  # is 4100 — IDENTITY'S HOST PORT IN THIS FILE — so it is normalised to 4000 for
  # the reason argued in the aetherholm block above.
  #
  # ── THE TEN-MINUTE CLIFF, AND THE REMEDY THIS BLOCK USED TO ONLY PREDICT ────
  #
  # What stood here said `EMBERKIN_SERVICE_TOKEN` "is a TOKEN and must not be
  # handed a credential": `emberkin/src/index.ts` was `const token = (): string
  # => env.serviceToken`, presenting the value verbatim as a Bearer with no
  # exchange, so it had to be a ten-minute JWT from `POST /service-tokens` and a
  # `cfsc_…` in that slot earned a 401 from all three upstreams with nothing in
  # either log naming the cause. It then recorded the cliff as real and named the
  # remedy: "micro-emberkin adopting `ServiceTokenProvider` and reading the
  # credential instead".
  #
  # micro-emberkin#3 is that remedy, merged. `src/upstreams.ts` now exchanges
  # `EMBERKIN_IDENTITY_CREDENTIAL` at `POST /service-tokens/exchange` and
  # re-mints before expiry, the same way tessera, community, market and foresight
  # already do. So the credential is wired below and the cliff is gone: emberkin's
  # calls are on REQUEST paths rather than a 900-second timer, so a bootstrap was
  # never guaranteed to outrun the expiry — it failed whenever a player acted more
  # than ten minutes after one, which is not a state anything alerted on.
  #
  # ── THE ORDER OF THESE TWO LINES IS THE WHOLE DEPLOY RULE ───────────────────
  #
  # `env.ts` requires ONE OF the two and both slots are individually optional, so
  # removing `EMBERKIN_SERVICE_TOKEN` before the credential is in place leaves
  # neither satisfiable and emberkin refuses to boot at the door — `emberkin-migrate`
  # with it, since it loads the same `env.ts`. The token therefore STAYS here for
  # now and comes out in a later release, once every environment has run a
  # bootstrap. Until the credential is present the service runs in `static` mode
  # and behaves exactly as it does today, announcing the mode at boot, so there is
  # nothing to hurry.
  #
  # Both slots refuse the OTHER'S value by name — `optionalMintedToken` demands a
  # JWT, `assertServiceCredential` refuses one — so the two cannot be swapped by a
  # deploy in a hurry, in either direction.
  #
  # ── AND THE PLACEHOLDER DEFAULT HAD TO GO WITH IT ───────────────────────────
  #
  # `${EMBERKIN_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}` was
  # defensible while the slot was REQUIRED: it let a bootstrap-less host render.
  # It cannot survive the slot becoming optional. That literal is 40 characters
  # and does not match `/^ey[A-Za-z0-9_-]*\./`, so `optionalMintedToken` THROWS on
  # it — meaning a host with a perfectly good credential and no minted token would
  # crash-loop on the variable that is only still here for the rollout. Defaulted
  # empty instead, which `env.ts` reads as absence ("absent and empty are the same
  # thing here", says its own comment), leaving the credential to satisfy the
  # check. Where neither is set the boot error now names both variables and the
  # command that mints them, rather than complaining about the shape of a
  # placeholder this file invented.
  #
  # No `IDENTITY_URL`: `env.ts` falls back to `IDENTITY_ISSUER`, which
  # `*identity-trust` already supplies — the same reason tessera and community
  # do not set it either.
  #
  # Its grant is DERIVED and already present: billing:read, ledger:post,
  # worlds:title, from BILLING_SCOPES, LEDGER_SCOPES and WORLDS_SCOPES in its own
  # three client modules. Nothing was typed into the map for it.
  emberkin-migrate:
    <<: *migrate-defaults
    build:
      context: ../../emberkin
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      EMBERKIN_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/emberkin
      # The migrator loads the same `env.ts`, which demands these three URLs and
      # the token before it will construct a config — so they are supplied here
      # too. It dials none of them.
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      WORLDS_URL: http://worlds:4000
      # The credential FIRST and the token still beside it — see the ordering note
      # in this block's header. `emberkin-migrate` needs both lines for the same
      # reason it needs the three URLs above: it loads the same `env.ts`, which
      # builds the whole config before it opens a connection, and it dials none
      # of them.
      EMBERKIN_IDENTITY_CREDENTIAL: ${EMBERKIN_IDENTITY_CREDENTIAL:-}
      EMBERKIN_SERVICE_TOKEN: ${EMBERKIN_SERVICE_TOKEN:-}
      INSTANCE_ID: emberkin-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  emberkin:
    <<: *service-defaults
    build:
      context: ../../emberkin
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      EMBERKIN_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/emberkin
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      WORLDS_URL: http://worlds:4000
      # The long-lived `cfsc_…` this service exchanges for short tokens. Section 5b
      # of `estate-bootstrap.sh` has minted it all along and nothing read it —
      # confirmed present in the mainnet tokens file 2026-08-09, by key name.
      EMBERKIN_IDENTITY_CREDENTIAL: ${EMBERKIN_IDENTITY_CREDENTIAL:-}
      # Still wired, deliberately, and it comes out in a later release. Removing it
      # in the same change that adds the line above is the one ordering that will
      # not boot.
      EMBERKIN_SERVICE_TOKEN: ${EMBERKIN_SERVICE_TOKEN:-}
      INSTANCE_ID: emberkin-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}122:4000"
    depends_on:
      emberkin-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      ledger:
        condition: service_healthy
      billing:
        condition: service_healthy
      worlds:
        condition: service_healthy
    healthcheck: *healthcheck

  # ---------------------------------------------------------------- foresight
  #
  # ── THE LAST OF THE FIVE, AND THE ONE THAT PUTS A CONTRACT ON A CHAIN ───────
  #
  # The aetherholm block above names five deployables this file never served:
  # `aetherholm`, `emberkin`, `foresight`, `beacon`, `faucet`. This is the fifth
  # and last. `foresight-web` and `foresight-admin-web` have both been up on
  # their own hostnames with this API absent since the day they were added, and
  # `foresight-admin` answered 404 to `/ideas` and `/categories` for exactly that
  # reason — the gateway routed them at a service that was not running.
  #
  # ── HOST PORT 4123 IS DERIVED, NOT CHOSEN ───────────────────────────────────
  #
  # Index 23 in `deployableRepos()`, via `portFor` (org/tools/cfctl.ts), and
  # re-derived rather than copied from a brief: `node --experimental-strip-types`
  # over `org/tools/registry.ts` prints `4123 foresight` at position 23, between
  # `4122 emberkin` and `4124 aetherholm`. `make check-web` recomputes it.
  #
  # ── THE BIND PORT IS 4021 AND IT IS NOT NORMALISED TO 4000 ──────────────────
  #
  # This was handed to me as "it binds a non-4000 port that collides with existing
  # host pins — follow the `nda` normalisation argued in the aetherholm block".
  # **That is wrong, and checking it is the whole point of the two-case rule the
  # tessera and aetherholm blocks set up between them.** The two cases are told
  # apart by WHICH number a service binds, never by the bare fact that it is not
  # 4000:
  #
  #   * aetherholm binds 4120, which is admin-api's HOST port in this file, and
  #     nda binds 4110, which is notify's. Those numbers are taken, here, today —
  #     so both are normalised to 4000 by `x-common-env`.
  #   * tessera binds 4022, which sits BELOW the derived 4100+ block where no
  #     number of repositories appended to `deployableRepos()` can ever reach it.
  #     So it keeps its port and the healthcheck moves.
  #
  # foresight binds 4021 (`foresight/src/env.ts`, `Dockerfile:86 EXPOSE 4021`,
  # and micro-ui's registry row, whose test pins it as "the port the service
  # actually binds"). 4021 is tessera's case exactly — one below 4022, in the same
  # unreachable region — and it collides with nothing: every host pin in this file
  # is 4100–4144. So the port stays and `x-healthcheck-4021` is the one extra
  # anchor it costs, exactly as tessera's did.
  #
  # There is a second, decisive reason not to normalise it, and it is already
  # committed: `gateway/dynamic/public-api.yml` sends the public API's
  # `/v1/markets`, `/v1/categories` and `/v1/stake-assets` to
  # `http://foresight:4021`, read off this
  # image's own `EXPOSE`. Setting `PORT: "4000"` here would break the public API
  # surface and put this file in drift with the gateway, which
  # `scripts/surface-routes.py` now fails on.
  #
  # ── FORESIGHT NOW EXCHANGES A CREDENTIAL. THIS BLOCK USED TO SAY THE OPPOSITE ─
  #
  # It was right when written, and it is worth keeping the correction visible
  # rather than swapping the paragraph out. It said `FORESIGHT_SERVICE_TOKEN` is
  # PRESENTED verbatim — `foresight/src/index.ts` was `const token = () =>
  # env.serviceToken` handed straight to five HttpClients — so handing it the
  # credential would have sent custody, the indexer, the ledger and policy a
  # Bearer that is not a JWT, earning 401 with nothing in any log naming why.
  #
  # It also named the consequence exactly: **a ten-minute token behind LEASED
  # BACKGROUND JOBS**, which is the shape that froze EMBER through `ledger`. A
  # market approved eleven minutes after a bootstrap sat in `awaiting_funds` with
  # a 401 from custody until somebody re-ran the bootstrap. And it named the fix —
  # "one seam wide, `index.ts` is already a function called per request,
  # exactly so that it could become `serviceTokenProvider(...).token`".
  #
  # That is what micro-foresight did. `foresight/src/upstreams.ts` builds a
  # real `ServiceTokenProvider`, so **both variables are passed below**: the
  # credential is what it exchanges, and the token remains for the paths that
  # still present one. The service prefers the credential when both are set, and
  # a test pins that precedence — added because the first attempt to break it
  # passed, since nothing had exercised the state this compose file now creates.
  #
  # Live proof rather than inference: `mirror_cursors` held the before and the
  # after in one table — the old container's `last_error` was
  # `GET …/activity → 401`, and the replacement, **13m53s after boot** and well
  # past the 600-second cliff, had `last_error` null with two tokens minted.
  #
  # The `:-` default is empty on purpose. `estate-bootstrap.sh` §5b mints this
  # into `tokens.env`; an unset credential leaves the service on the old token
  # and the cliff returns, which is a failure worth being loud about rather than
  # papering over with a placeholder that looks like a value.
  #
  # ── TWO CUSTODY ADDRESSES, AND WHY NEITHER IS WRITTEN HERE ──────────────────
  #
  # `FORESIGHT_ORACLE_ADDRESS` and `FORESIGHT_TREASURY_ADDRESS` are both required
  # and both must be REAL: `ForesightMarket`'s constructor reverts `BadConstruction`
  # on a zero oracle or a zero treasury, so the placeholders below boot the service
  # and refuse to produce a working market — which is the fail-closed shape the
  # faucet's `FAUCET_FUNDING_ADDRESS` has. Neither can be written into this file,
  # for the reason section 5e already gives: an address does not exist until
  # custody derives it, and custody takes the next BIP-44 index off a seed whose
  # state lives in its own database. `estate-bootstrap.sh` section 5f mints both,
  # reuses them on every later run, and appends them to `tokens.env`.
  #
  # The ORACLE is `purpose: 'deployer'`, which looks wrong and is not.
  # `custody/src/gates.ts` has three signable purposes and none of them signs a
  # contract CALL — `transfer` requires empty calldata and says widening it would
  # make the key a signing oracle. So foresight's oracle resolves a market by
  # CREATING a contract (`ForesightResolver`, whose constructor calls `oracleAct`
  # and which then has no runtime code), and the market checks
  # `msg.sender == createAddress(oracle, nonce)`, which is exactly as strong as
  # checking the oracle address itself. Nothing about custody changed.
  #
  # The per-market DEPLOYER addresses are NOT bootstrapped: the service mints one
  # per market itself, idempotently on `(chain, network, userId='foresight',
  # orderId=<market id>)` (`deploy.ts`), which is what `custody:address:create`
  # is in its grant for. Each one needs gas before its market can deploy; the
  # service reports that as `awaiting_funds` and logs the exact shortfall rather
  # than burning an attempt.
  #
  # ── WHAT IS DELIBERATELY ABSENT, BECAUSE ABSENT IS A DECLARED MODE ──────────
  #
  # `foresight/src/env.ts` names four groups whose absence its header calls a
  # supported mode rather than an error, and all four stay unset:
  #
  #   * `FORESIGHT_CUSTODIAL_ADDRESS`. The platform address the custodial pool
  #     share is staked from, when there is one. It stays unset, and since
  #     micro-foresight#22 that is an ordinary mode rather than a switch nobody
  #     is allowed to throw.
  #
  #     It used to be the ONE thing `server.ts` read to decide whether
  #     `GET /stake-assets` reported custodial staking available at all, and it
  #     was held unset on purpose: the lifecycle after `accepted` had no route,
  #     so setting it would have escrowed a stranger's coins with no way to
  #     stake, refund or settle them. Migration 12 built that route — a fifth
  #     terminal state, `paid`, settled out of the ledger and constrained to
  #     carry no `tx_hash` — because `custody/src/gates.ts` signs only for
  #     `deployer`, `treasury` and `deposit`, and `stake(uint8)` is a
  #     value-bearing CALL with calldata that no key in this estate can make.
  #
  #     A `paid` stake never reaches the chain, so it needs no address, and
  #     migration 13 ties `platform_address` to the two states that assert the
  #     chain saw the stake. Availability no longer reads this variable. Set it
  #     only if the platform ever holds a key that can place the aggregate
  #     position itself.
  #   * `FORESIGHT_HOUSE_ADDRESS` (21 §5). The house seed address must hold its
  #     own key OUTSIDE this estate's custody — `houseseed.ts` explains that
  #     custody has no transaction shape that can call `stake(uint8)` at all — and
  #     this estate has no such key. So it runs no engagement programme and
  #     `POST /markets/:id/approve` refuses a `houseSeedPerOutcomeWei` plainly,
  #     which is the documented behaviour and not a degradation.
  #   * `FORESIGHT_PROPOSER_*` and `FORESIGHT_SEARCH_*`. No external model or
  #     search adapter is wired here, so the idea pipeline records "no proposals"
  #     and the operator queue stays empty. `index.ts` logs
  #     `proposerConfigured: false` at boot so an operator can see which mode they
  #     are in without an error line every six hours.
  #   * `FORESIGHT_MAINNET_ENABLED`. NO LONGER IN THIS GROUP, and the correction
  #     belongs here rather than only where the change is. This bullet used to say
  #     the variable was unset and `FORESIGHT_NETWORK` was `testnet`, so two
  #     deliberate settings stood between this estate and a mainnet. There is a
  #     real EMBER mainnet now — `hearth`, chain 7411 — and on that environment
  #     BOTH settings are made, in `env/chain.mainnet.env`, together, with the
  #     reason written beside them. Still two settings and still deliberate; what
  #     changed is that one environment has deliberately made them.
  #
  # `ADMIN_API_URL` IS set even though it is optional, and that is the one
  # judgement call in this list. It is `admin:read` on the engagement caps, which
  # is unreachable while there is no house address — so by the aetherholm rule
  # ("a variable nothing reads is a secret nothing needed") it could go. It stays
  # because the moment a house address exists this deployment must read caps
  # BEFORE anything moves (21 §8), and because leaving it out would make
  # `admin:read` an unexplained entry in a DERIVED grant map. The token it is
  # handed is the same one, so it is no extra secret.
  #
  # ── FORESIGHT_RPC_URLS IS THE ONE THING WITHOUT WHICH NOTHING REACHES A CHAIN
  #
  # Empty by default, so a chain with no endpoint is refused rather than falling
  # back to a public node nobody chose. `host.docker.internal` and `extra_hosts`
  # for the reason the faucet and indexer blocks give: Docker Desktop resolves it
  # and the Linux daemon does not, and there this service would boot, log
  # `rpcConfigured: false`, serve, and refuse every deploy.
  foresight-migrate:
    <<: *migrate-defaults
    build:
      context: ../../foresight
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # Explicit, and it OVERRIDES the 4000 in `x-common-env` — an explicit key
      # beats a merge key in YAML. tessera's reasoning: the migrator binds
      # nothing, but it loads the same `env.ts`, and a migrator that disagreed
      # with its service about the port would be one more copy of a fact to drift.
      PORT: "4021"
      FORESIGHT_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/foresight
      # Foresight quotes a stake brought in BTC or ETH against EMBER, so it needs
      # pricing. Left OPTIONAL in the service rather than required, deliberately: a
      # missing quote makes non-EMBER staking inert, where a required variable would
      # refuse to boot and take EMBER staking down with it. Wired here so it is not
      # inert. Third service this week to need this line — billing and mint were the
      # others, both found only when something failed.
      PRICING_URL: http://pricing:4000
      # The migrator imports the same `env.ts`, which builds the WHOLE config
      # before it opens a connection — so every required value is supplied here
      # too. It dials none of them and signs nothing.
      CUSTODY_URL: http://custody:4000
      INDEXER_URL: http://indexer:4000
      LEDGER_URL: http://ledger:4000
      POLICY_URL: http://policy:4000
      FORESIGHT_IDENTITY_CREDENTIAL: ${FORESIGHT_IDENTITY_CREDENTIAL:-}
      FORESIGHT_TREASURY_ADDRESS: ${FORESIGHT_TREASURY_ADDRESS:-0x0000000000000000000000000000000000000000}
      FORESIGHT_ORACLE_ADDRESS: ${FORESIGHT_ORACLE_ADDRESS:-0x0000000000000000000000000000000000000000}
      # The published house-seed address (21 §5). Absent means no seed: foresight refuses a
      # houseSeedPerOutcomeWei plainly rather than staking nothing and reporting success. It was
      # documented at :2623 and never MAPPED, so setting it in an env file changed nothing,
      # silently — a control that reports success while doing nothing.
      FORESIGHT_HOUSE_ADDRESS: ${FORESIGHT_HOUSE_ADDRESS:-}
      # The published address the CUSTODIAL pool share is staked from, when there is one — the
      # second way to bet, with coins already deposited here rather than a browser wallet.
      #
      # IT IS MAPPED HERE AND LEFT UNSET, and mapping it unset is still the point: it was readable
      # only by `foresight/src/env.ts` before this line, so an operator who set it in an env file
      # would have got no error and no effect — the same trap `docs/house-seed.md` §3.1 records for
      # the line above. A variable that cannot be set is also a variable whose absence nobody can
      # prove.
      #
      # WHAT CHANGED (micro-foresight#22): this is no longer the switch. `server.ts` used to derive
      # `custodialStakingAvailable` from nothing but this being set, and the instruction here was DO
      # NOT SET IT YET — because `server.ts` called one of the lifecycle functions `custodialstakes.ts`
      # exports, so the intake moved a stranger's BTC from available to escrow and then had no route
      # to stake, refund or settle it.
      #
      # Migration 12 built the route: `paid`, a fifth terminal state settled out of the ledger and
      # constrained to carry no `tx_hash`. It exists because `custody/src/gates.ts` signs only for
      # `deployer`, `treasury` and `deposit`, and `stake(uint8)` is a value-bearing CALL with
      # calldata — so no key in this estate can place the platform's aggregate position, and waiting
      # for one would have been waiting forever. A `paid` stake never reaches the chain and needs no
      # address; migration 13 ties `platform_address` to the states that assert the chain saw it.
      #
      # So availability is now `true` and this stays unset. Set it only if the platform ever holds a
      # key that can stake the aggregate itself.
      FORESIGHT_CUSTODIAL_ADDRESS: ${FORESIGHT_CUSTODIAL_ADDRESS:-}
      FORESIGHT_ORACLE_USER_ID: foresight-estate
      FORESIGHT_ORACLE_ORDER_ID: foresight-estate-oracle-1
      INSTANCE_ID: foresight-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  foresight:
    <<: *service-defaults
    build:
      context: ../../foresight
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      PORT: "4021"
      FORESIGHT_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/foresight
      # Foresight quotes a stake brought in BTC or ETH against EMBER, so it needs
      # pricing. Left OPTIONAL in the service rather than required, deliberately: a
      # missing quote makes non-EMBER staking inert, where a required variable would
      # refuse to boot and take EMBER staking down with it. Wired here so it is not
      # inert. Third service this week to need this line — billing and mint were the
      # others, both found only when something failed.
      PRICING_URL: http://pricing:4000
      CUSTODY_URL: http://custody:4000
      INDEXER_URL: http://indexer:4000
      LEDGER_URL: http://ledger:4000
      POLICY_URL: http://policy:4000
      ADMIN_API_URL: http://admin-api:4000
      # The browser-facing half of studio, exactly as in `market` above — see the
      # long note there. Foresight holds an asset reference and builds `bytesUrl`
      # from this at read time, deliberately NOT storing a URL in the durable
      # event (`foresight/src/images.test.ts` asserts that), so the value is
      # read on every render and a wrong one is wrong everywhere at once.
      #
      # `env.test.ts` requires an ORIGIN and rejects a path — a trailing
      # slash is accepted and normalised, anything more throws at boot. The
      # interpolation below produces a bare origin on both estates.
      #
      # Gated on studio's gateway router and its DNS record, which do not exist
      # yet. Set now for the reason given in market's block.
      STUDIO_PUBLIC_URL: https://studio${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # A TOKEN, NOT A CREDENTIAL. See the long note above; it is presented
      # verbatim by `index.ts` and a `cfsc_…` secret here 401s all five
      # upstreams.
      FORESIGHT_IDENTITY_CREDENTIAL: ${FORESIGHT_IDENTITY_CREDENTIAL:-}
      # `FORESIGHT_NETWORK` AND `FORESIGHT_MAINNET_ENABLED` ARE IN THE SAME
      # `env_file` AS THE INDEXER'S, AND THAT IS THE POINT.
      #
      # `env.ts` refuses to boot on `FORESIGHT_NETWORK=mainnet` unless
      # `FORESIGHT_MAINNET_ENABLED=true`, so that a one-word typo cannot put
      # strangers' money on a live chain. That gate is worth keeping and is easy
      # to defeat by accident — the obvious parameterisation here would have been
      # `FORESIGHT_MAINNET_ENABLED: ${…:-false}` beside a `FORESIGHT_NETWORK`
      # derived from `CF_EMBER_NETWORK`, which turns two independent settings
      # into one and removes the whole defence.
      #
      # So NEITHER is written here. Both are stated, per network, in
      # `env/chain.<network>.env` — a committed file whose only subject is which
      # chain this estate is on, where the pair is visible together and turning
      # the gate on is a diff somebody has to read. `foresight` reads the same
      # file as `indexer` so the two cannot name different networks.
      #
      # `chainIdOf(chain, market.network)` (`foresight/src/deploy.ts`) is what
      # actually signs, so a `FORESIGHT_NETWORK` disagreeing with the node would
      # produce transactions the node rejects on EIP-155 — silently, at the one
      # moment a market is created.
      FORESIGHT_RPC_URLS: '{"ember":"${EMBER_RPC_URL:-http://host.docker.internal:8545}"}'
      # Minted by estate-bootstrap.sh §5f and reused thereafter. The zero
      # placeholders boot the service and cannot produce a market: the contract's
      # constructor reverts on either.
      FORESIGHT_TREASURY_ADDRESS: ${FORESIGHT_TREASURY_ADDRESS:-0x0000000000000000000000000000000000000000}
      FORESIGHT_ORACLE_ADDRESS: ${FORESIGHT_ORACLE_ADDRESS:-0x0000000000000000000000000000000000000000}
      # The published house-seed address (21 §5). Absent means no seed: foresight refuses a
      # houseSeedPerOutcomeWei plainly rather than staking nothing and reporting success. It was
      # documented at :2623 and never MAPPED, so setting it in an env file changed nothing,
      # silently — a control that reports success while doing nothing.
      FORESIGHT_HOUSE_ADDRESS: ${FORESIGHT_HOUSE_ADDRESS:-}
      # The published address the CUSTODIAL pool share is staked from, when there is one — the
      # second way to bet, with coins already deposited here rather than a browser wallet.
      #
      # IT IS MAPPED HERE AND LEFT UNSET, and mapping it unset is still the point: it was readable
      # only by `foresight/src/env.ts` before this line, so an operator who set it in an env file
      # would have got no error and no effect — the same trap `docs/house-seed.md` §3.1 records for
      # the line above. A variable that cannot be set is also a variable whose absence nobody can
      # prove.
      #
      # WHAT CHANGED (micro-foresight#22): this is no longer the switch. `server.ts` used to derive
      # `custodialStakingAvailable` from nothing but this being set, and the instruction here was DO
      # NOT SET IT YET — because `server.ts` called one of the lifecycle functions `custodialstakes.ts`
      # exports, so the intake moved a stranger's BTC from available to escrow and then had no route
      # to stake, refund or settle it.
      #
      # Migration 12 built the route: `paid`, a fifth terminal state settled out of the ledger and
      # constrained to carry no `tx_hash`. It exists because `custody/src/gates.ts` signs only for
      # `deployer`, `treasury` and `deposit`, and `stake(uint8)` is a value-bearing CALL with
      # calldata — so no key in this estate can place the platform's aggregate position, and waiting
      # for one would have been waiting forever. A `paid` stake never reaches the chain and needs no
      # address; migration 13 ties `platform_address` to the states that assert the chain saw it.
      #
      # So availability is now `true` and this stays unset. Set it only if the platform ever holds a
      # key that can stake the aggregate itself.
      FORESIGHT_CUSTODIAL_ADDRESS: ${FORESIGHT_CUSTODIAL_ADDRESS:-}
      FORESIGHT_ORACLE_USER_ID: foresight-estate
      FORESIGHT_ORACLE_ORDER_ID: foresight-estate-oracle-1
      INSTANCE_ID: foresight-estate
    env_file:
      - env/chain.${CF_EMBER_NETWORK:-mainnet}.env
      - *outbox-secret-file
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not.
    # Same reason as the `faucet` and `indexer` blocks.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}123:4021"
    depends_on:
      foresight-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      custody:
        condition: service_healthy
      indexer:
        condition: service_healthy
      ledger:
        condition: service_healthy
      policy:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck: *healthcheck-4021

  # ------------------------------------------------------------------- beacon
  #
  # ── THE RELEASE GATE, WHICH HAD NEVER RUN IN ANY ENVIRONMENT ────────────────
  #
  # Synthetic monitoring: journeys, incidents and SLOs. It is the service that
  # answers "does the estate actually work", and it is the one that had never been
  # started — so every judgement about this environment so far has been made
  # without it. HOST PORT 4143 IS DERIVED: index 43 in `deployableRepos()`.
  #
  # ── BEACON_TOKEN IS INBOUND BREAK-GLASS, NOT AN OUTBOUND SERVICE TOKEN ──────
  #
  # A static shared secret, like `ANALYTICS_TOKEN`, and NOT minted by identity.
  # Its own header says why it is checked BEFORE the identity token: "when
  # identity is the thing that has broken, a Beacon that could only be read with
  # an identity token would be a Beacon nobody can read." Minting this from
  # identity would destroy the one property it exists to have.
  #
  # ── BEACON_SERVICE_CREDENTIAL IS A CREDENTIAL, AND THE NAMES DO NOT MATCH ───
  #
  # This is the third variable in this file whose name has to be checked against
  # its USE rather than read (see tessera and emberkin above, in the opposite
  # direction). `beacon/src/ecosystem.ts` EXCHANGES it at
  # `POST /service-tokens/exchange` for a `ledger:read` token, so it is the
  # long-lived `cfsc_…` kind — which section 5b of `estate-bootstrap.sh` already
  # mints, under the name `BEACON_IDENTITY_CREDENTIAL`. The deploy is where those
  # two names are joined, and that is exactly what a deploy is for.
  #
  # SUPPLYING IT MAKES THE GATE STRICTER, WHICH IS WHY IT IS SUPPLIED. Without a
  # credential `ecosystemJourneys()` DOES NOT DECLARE the trial-balance journey at
  # all — the repository's own comment draws the line: "absent because it cannot
  # run", which it holds, versus "declared and skipping for ever", which is how a
  # gate gets switched off. An unset credential here would silently buy a smaller
  # suite that still reports green.
  #
  # ── THE SIX TARGETS ARE READ OFF THE JOURNEYS, NOT CHOSEN ───────────────────
  #
  # `ctx.target('…')` across `src/` names exactly six: activity, hub-api,
  # identity, ledger, market, worlds. A target a journey asks for and this list
  # omits is a journey that cannot run, so the list is derived from the call sites
  # the same way the grants map is.
  #
  # `BEACON_BROWSER_EXECUTABLE` is deliberately UNSET: no browser is installed in
  # this image, and its own env.ts documents absent as a supported mode. The
  # browser journeys stay undeclared rather than declared-and-failing.
  #
  # ── OPEN, FOUND BY RUNNING IT: EVERY SLO OBSERVATION IS BEING DROPPED ───────
  #
  # Starting this service surfaced a real gap within one scheduling cycle, which
  # is precisely the argument for deploying the gate rather than reasoning about
  # it. All eleven journeys run and are recorded in `journey_runs`, but every
  # `slo_observations` insert fails:
  #
  #   insert or update on table "slo_observations" violates foreign key
  #   constraint "slo_observations_slo_name_fkey"
  #
  # `jobs.ts` records against `journeySloName(name)` = `<journey>.runs`, and
  # `slos` is EMPTY: nothing seeds it. `upsertSlo` has exactly one caller in the
  # repository — `PUT /v1/slos/:name` (server.ts, admin-only) — so an SLO is
  # REGISTERED, never derived, and beacon ships no catalogue.
  #
  # It does not crash: `jobs.ts` catches and warns, so the service is healthy
  # and the journeys are real. What is lost is every objective and every error
  # budget — the numbers the gate is supposed to gate ON. A green `/readyz` here
  # is worth less than it looks, which is this file's recurring lesson.
  #
  # NOT FIXED HERE, AND THE CHOICE IS DELIBERATE. Registering eleven SLOs from
  # `estate-bootstrap.sh` is defensible — section 5c already argues that WHO
  # RECEIVES WHAT is deploy configuration, and an objective of 99% is written
  # down (13-operational-model.md, "99% of scheduled runs pass. A skip counts
  # against it"). But the objective, tier and window of each journey are the
  # GATE'S OWN policy, and inventing eleven of them in a compose repository is
  # how a threshold nobody agreed to becomes the one the estate is judged by.
  # Reported to micro-beacon: either seed the declared journeys' SLOs at boot, or
  # make a missing SLO a startup failure instead of a per-cycle warning. Until
  # then this container runs its journeys and reports no budget.
  beacon-migrate:
    <<: *migrate-defaults
    build:
      context: ../../beacon
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      BEACON_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/beacon
      BEACON_TOKEN: ${BEACON_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); inbound break-glass, see runbooks/runbook-beacon-token.md}
      INSTANCE_ID: beacon-migrate
    depends_on:
      postgres:
        condition: service_healthy

  beacon:
    <<: *service-defaults
    build:
      context: ../../beacon
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # ── BEACON MUST TRUST THE ESTATE CA, BECAUSE IT PROBES OVER REAL TLS ──────────
      #
      # Probes target the addresses a person uses — `https://hub.<apex>/` — so they
      # traverse DNS, TLS, Traefik routing and the upstream. A probe that skipped the
      # gateway would report healthy while the gateway was broken, which is exactly
      # how a `cf-api-explorer` router that never existed went unnoticed for days.
      #
      # That path is served by the estate's own CA, which nothing inside the estate
      # trusted. Every probe failed `UNABLE_TO_VERIFY_LEAF_SIGNATURE`, opened a SEV3,
      # and the public status page reported a full outage that was not happening.
      #
      # The fix is to TRUST the certificate, never to stop verifying it. Disabling
      # verification here would make beacon blind to a real certificate failure — and
      # the estate has already paid for that once tonight: 183 uses of `curl -k` hid a
      # gateway serving `CN=TRAEFIK DEFAULT CERT` that every browser refused, while
      # every check passed.
      #
      # ── IT IS THE BUNDLE NOW, AND THE MAINNET GATEWAY IS WHY ─────────────────────
      #
      # `trust.crt` is the estate CA plus every public root in `gateway/trust/`,
      # rebuilt by `scripts/gateway-cert.sh`. The mainnet gateway terminates on a
      # Cloudflare Origin CA leaf (`gateway/dynamic/tls.yml`) so that Cloudflare
      # Tunnel stops refusing the origin and answering 502; the testnet gateway
      # still serves the estate leaf, because the origin certificate is one label
      # deep and does not cover `*.testnet.<apex>`. Beacon runs in BOTH projects
      # against BOTH apexes, so `ca.crt` alone would have taken every mainnet probe
      # to `UNABLE_TO_VERIFY_LEAF_SIGNATURE` — the exact outage this block was
      # written for, reintroduced from the other end.
      #
      # The container path is renamed with the file. `/etc/ssl/estate/ca.crt`
      # holding two roots would be a name that lies to the next reader, which is
      # the cost this repository keeps paying for elsewhere.
      NODE_EXTRA_CA_CERTS: /etc/ssl/estate/trust.crt
      BEACON_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/beacon
      BEACON_TOKEN: ${BEACON_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); inbound break-glass, see runbooks/runbook-beacon-token.md}
      # ── `wallet` AND `custody` ADDED 2026-08-04, AND THE ABSENCE WAS NOT NEUTRAL ────
      #
      # `estate.reachable` has named `wallet` in its service list since it was written and
      # had no address for it, so it quietly skipped that target on every cycle — a service
      # the estate runs, that beacon believed it was watching, and was not.
      #
      # `custody` is new here and is what `ecosystem.deposit-address` needs. That journey
      # asks custody directly whether it is holding the key wallet just handed out, which is
      # the assertion no per-service suite can make: `POST /v1/deposits` answered 500 for the
      # whole life of the service because wallet sent no `orderId`, and both suites passed.
      #
      # Compose-network names, not gateway hostnames, exactly like the six beside them.
      # These are SERVICE targets — the browser tier is the only one that must use a real
      # public hostname, because a page derives its API hosts from the one it was loaded from.
      # `studio` joins the list because market and foresight now hold ASSET
      # REFERENCES that only studio can resolve, so it sits on the read path of
      # two surfaces that were already smoke-tested and it was not smoke-tested
      # at all. This is the in-cluster address — the browser-facing one is
      # `STUDIO_PUBLIC_URL` on those two services, and the two are different
      # things that happen to name one container.
      BEACON_TARGETS: identity=http://identity:4000,ledger=http://ledger:4000,market=http://market:4000,worlds=http://worlds:4000,activity=http://activity:4000,hub-api=http://hub-api:4000,wallet=http://wallet:4000,custody=http://custody:4000,studio=http://studio:4000
      BEACON_SERVICE_CREDENTIAL: ${BEACON_IDENTITY_CREDENTIAL:-}
      # ── THE POOL THE JOURNEYS SIGN IN AS, WHICH NOTHING PASSED THROUGH ──────
      #
      # Eight provisioned accounts, as JSON. `beacon/scripts/provision-journey-accounts.md`
      # describes making them; this line is what carries them, and until it existed the
      # variable could be set in `tokens.env` all day and never reach the container.
      #
      # Measured on mainnet 2026-08-11, with the pool unprovisioned: EIGHT OF FIFTEEN
      # journeys skipping — `identity.signin`, `identity.handoff`, all five `ecosystem.*`
      # and both `browser.*`. Every journey that passed was one that needs no session, so
      # the monitor was green while proving nothing at all about the signed-in product.
      #
      # A skip rather than a fail is the correct behaviour when it is unset (`pool.ts`: an
      # estate that has not provisioned the pool has not demonstrated a broken product) —
      # but a skip nobody reads is indistinguishable from a pass, and this one went unread
      # long enough to matter.
      #
      # `:-` and not `:?`: an estate that has not provisioned the pool must still boot.
      BEACON_JOURNEY_ACCOUNTS: ${BEACON_JOURNEY_ACCOUNTS:-}
      # The SSO origin the handoff journey hands off TO. Unset, `identity.handoff`
      # SKIPS rather than guesses an origin — correctly, since a guessed origin would
      # test nothing and report green. That skip was the last open SEV2 and the last
      # skipped critical journey on the release gate.
      BEACON_HANDOFF_ORIGIN: https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # ── A STATUS PAGE BEHIND A LOGIN IS NOT A STATUS PAGE ────────────────────
      #
      # `BEACON_PUBLIC_STATUS` defaults FALSE (`beacon/src/env.ts`) and was set nowhere here,
      # so `GET /api/status/public` ran `authorise(ctx, deps, READ_SCOPE)` first
      # (`beacon/src/server.ts`) and answered 401 to the browser that is meant to read it.
      # `status-web` therefore rendered "Not determined — our status service answered with HTTP
      # 404" (404 because the gateway had no route either; both halves are fixed together, and
      # adding only the route would have turned the 404 into a 401, which is not progress).
      #
      # Turning it on is safe because of what the route serves, not because of who reaches it:
      # `beacon/src/publicstatus.ts` PROJECTS the document rather than redacting one, so no target
      # name, no error string, no latency and no journey step name can appear in it — a field it
      # was never told about is a field it cannot leak.
      BEACON_PUBLIC_STATUS: "true"
      INSTANCE_ID: beacon-estate
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}142:4000"
    depends_on:
      beacon-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      ledger:
        condition: service_healthy
      market:
        condition: service_healthy
      worlds:
        condition: service_healthy
      activity:
        condition: service_healthy
      hub-api:
        condition: service_healthy
    healthcheck: *healthcheck

  # ------------------------------------------------------------------ faucet
  #
  # The fourth of the five never-run deployables, and the one that decides
  # whether this testnet is usable by anybody who is not holding the miner's
  # key. Until it is here, "a real EMBER testnet" means a chain the owner can
  # spend on and nobody else can.
  #
  # HOST PORT 4144 IS DERIVED: index 44 in `deployableRepos()`, the last row.
  # Re-derived rather than inherited — `node --import tsx -e "import
  # {deployableRepos} from './tools/registry.ts'; …"` in micro-org prints
  # `4144 faucet ops`, and `make check-web` recomputes it on every run.
  #
  # It BINDS 4013 by default (`faucet/src/env.ts`, `Dockerfile:84`), which
  # is not a number this file hands to anybody — but it is normalised to 4000
  # anyway, by `x-common-env`'s `PORT`. That follows `nda` and `aetherholm` and
  # not `tessera`: tessera's 4022 is argued from sitting BELOW the derived 4100+
  # block where no new repository can ever collide with it, and every other
  # service in this file binds 4000 so that ONE healthcheck anchor covers them.
  # A second bind port is a second anchor and a second thing to get wrong.
  #
  # ── CUSTODY_TOKEN IS PRESENTED, NOT EXCHANGED, AND THAT WAS CHECKED ─────────
  #
  # The fourth variable in this file whose authority had to be read out of the
  # source rather than off its name. `faucet/src/index.ts` is
  # `token: () => env.custodyToken`, handed straight to `HttpClient`, which sets
  # `authorization: Bearer <that value>` verbatim (`runtime/packages/http/src/
  # index.ts`). There is no `ServiceTokenProvider` anywhere in this
  # repository. So the value must be a ten-minute JWT from
  # `POST /service-tokens` — NOT `FAUCET_IDENTITY_CREDENTIAL`, which section 5b
  # of the bootstrap also mints and which is sitting in `tokens.env` looking
  # like the obvious answer. A `cfsc_…` secret here would 401 every signature
  # request with nothing in either log naming the cause.
  #
  # It is fed from `FAUCET_CUSTODY_TOKEN` rather than from a variable called
  # `CUSTODY_TOKEN`: the container's variable is generic, `tokens.env` is one
  # flat file shared by every service, and a bare `CUSTODY_TOKEN=` line there
  # would be a token belonging to one service under a name that reads like it
  # belongs to all of them.
  #
  # THE TEN-MINUTE CLIFF IS REAL HERE AND IS WORSE THAN EMBERKIN'S, because the
  # call site is a TIMER and not a request path. `driveChain` runs on the job
  # queue (`faucet/src/jobs.ts`), so a drip requested more than ten minutes
  # after a bootstrap reaches custody with an expired bearer — the exact shape
  # that froze EMBER reconciliation through ledger. What it costs here is
  # bounded and visible rather than silent: the dispense stays `queued`, the
  # row is retried, and it completes on the next bootstrap. The honest fix
  # belongs to micro-faucet — adopt `ServiceTokenProvider` and read
  # `FAUCET_IDENTITY_CREDENTIAL`, which the bootstrap already mints — and is
  # reported there rather than papered over here.
  #
  # ── THE FUNDING ADDRESS IS MINTED, NOT CHOSEN ──────────────────────────────
  #
  # `custodyclient.ts` is explicit that the faucet must get its OWN
  # treasury-purpose address and must not use custody's PINNED `(ember,
  # testnet)` treasury, which is settlement's: two services on one nonce is how
  # a payment is permanently lost. `POST /v1/addresses` is not idempotent —
  # every call derives a fresh BIP-44 index — so `estate-bootstrap.sh` §5d looks
  # the address up by its `(userId, orderId)` binding on `GET /v1/admin/keys`
  # first and mints only when there is none, then writes
  # `FAUCET_FUNDING_ADDRESS` into `tokens.env` beside the tokens.
  #
  # The default below is the ZERO ADDRESS, and it is a placeholder that boots
  # rather than one that works: `env.ts` validates the SHAPE (0x + 40 hex) and
  # nothing else, so the container starts, serves `/v1/faucet`, and refuses
  # every drip at the balance check. That is the right failure — a faucet that
  # cannot pay says so, and the bootstrap replaces it on its first run.
  #
  # `FAUCET_CUSTODY_ORDER_ID` / `_USER_ID` are the other half of that binding.
  # Custody compares seven identity fields character for character and its 403
  # deliberately does not name which one disagreed (`custody/src/keys.ts`),
  # so these cannot be debugged from a response: they are written here, read by
  # the bootstrap from this same file, and never typed twice.
  #
  # ── AND THE CHAIN, WHICH THIS SERVICE WILL NOT LET THE DEPLOY CHOOSE ───────
  #
  # There is NO chain-id variable. `faucet/src/env.ts` reads 7412 from
  # `@cloudsforge/contracts-chain` and exits if `FAUCET_CHAIN_ID` is set to
  # anything else — the frozen `hearth/tools/faucet` compared the node against a
  # variable that DEFAULTED TO 7411, EMBER MAINNET, which verifies agreement
  # rather than identity. So the only chain input here is the RPC URL, and it is
  # the same expression `indexer` uses: `host.docker.internal` plus
  # `extra_hosts`, because hearth is frozen and attaching it to this project's
  # network would mean editing it.
  #
  # ── AND THAT IS WHY BOTH FAUCET SERVICES SIT BEHIND A PROFILE ──────────────
  #
  # `faucet/src/env.ts` is `export const NETWORK = 'testnet' as const`, with
  # the annotation chosen so that `NETWORK === 'mainnet'` is a COMPILE ERROR and
  # not a branch. `index.ts` reads `eth_chainId` at boot and calls
  # `process.exit(1)` on anything that is not 7412. There is no configuration
  # under which this service runs against EMBER mainnet, deliberately: its own
  # header calls a testnet faucet pointed at mainnet "an unauthenticated
  # withdrawal endpoint".
  #
  # So when `CF_EMBER_NETWORK=mainnet` this service must not be started at all.
  # Started anyway it does not degrade — it crash-loops, taking `--wait` with it.
  # Compose has no way to REMOVE a service for one environment, only to add one
  # for a profile, so the profile is on the faucet and `compose/testnet.env` opts
  # in with `COMPOSE_PROFILES=ember-testnet`. The consequence is stated rather
  # than buried: a plain `docker compose -f compose/docker-compose.estate.yml up`
  # now brings up NO FAUCET, because its plain default is the mainnet chain. An
  # estate that wants a faucet is an estate on the testnet chain, and it is
  # brought up with `--env-file compose/testnet.env`, which sets both.
  #
  # `faucet-migrate` carries the same profile: it imports the same `env.ts` and
  # would fail the same check, and a migration run for a service that is not
  # running is a database touched for no reason.
    volumes:
      # Read-only, and only public certificates — never a key. `trust.crt` is a
      # DERIVED file: `scripts/gateway-cert.sh` rebuilds it from `ca.crt` plus
      # `gateway/trust/*.pem` on every run, and `estate-up.sh` runs that before
      # anything here starts. A bind of a file that does not exist yet is created
      # by Docker as a DIRECTORY, and beacon would then fail to start rather than
      # probe unverified — loud, and the right way round.
      - ../gateway/certs/trust.crt:/etc/ssl/estate/trust.crt:ro
  faucet-migrate:
    profiles: ["ember-testnet"]
    <<: *migrate-defaults
    build:
      context: ../../faucet
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      FAUCET_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/faucet
      # The migrator imports the same `env.ts`, which builds the WHOLE config
      # before it opens a connection — so every required value is supplied here
      # too. It dials none of them and signs nothing.
      FAUCET_TOKEN: ${FAUCET_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); PIN FAUCET_REQUESTER_SALT BEFORE ROTATING or every rate-limit bucket re-keys (faucet/src/env.ts:425)}
      # PINNED, AND THE PINNING IS THE POINT: unset, faucet DERIVES this salt from
      # FAUCET_TOKEN (faucet/src/env.ts -> requester.ts), so rotating the token
      # would silently re-key every requester pseudonym and rate-limit bucket. Pinned
      # to the value derived from the PRE-ROTATION token, continuity survives rotation.
      FAUCET_REQUESTER_SALT: ${FAUCET_REQUESTER_SALT:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet)}
      FAUCET_RPC_URL: ${EMBER_RPC_URL:-http://host.docker.internal:8545}
      CUSTODY_URL: http://custody:4000
      CUSTODY_TOKEN: ${FAUCET_CUSTODY_TOKEN:-estate-placeholder-token-0000000000000000}
      FAUCET_FUNDING_ADDRESS: ${FAUCET_FUNDING_ADDRESS:-0x0000000000000000000000000000000000000000}
      FAUCET_CUSTODY_USER_ID: faucet-estate
      FAUCET_CUSTODY_ORDER_ID: faucet-estate-treasury-1
      INSTANCE_ID: faucet-migrate
    depends_on:
      postgres:
        condition: service_healthy

  faucet:
    # See the long note above `faucet-migrate`: this service cannot run on the
    # EMBER mainnet, by a compile-time constant in its own source.
    profiles: ["ember-testnet"]
    <<: *service-defaults
    build:
      context: ../../faucet
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      FAUCET_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/faucet
      # Inbound, not outbound: the credential Prometheus presents in
      # `x-faucet-token` to read `/metrics`, which publishes the REMAINING
      # BUDGET and is gated for exactly that reason. Never identity-minted —
      # asking identity for it would produce a token that opens nothing, which
      # is the mistake `analytics` was removed from the CREDENTIALS list for.
      FAUCET_TOKEN: ${FAUCET_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet); PIN FAUCET_REQUESTER_SALT BEFORE ROTATING or every rate-limit bucket re-keys (faucet/src/env.ts:425)}
      # PINNED, AND THE PINNING IS THE POINT: unset, faucet DERIVES this salt from
      # FAUCET_TOKEN (faucet/src/env.ts -> requester.ts), so rotating the token
      # would silently re-key every requester pseudonym and rate-limit bucket. Pinned
      # to the value derived from the PRE-ROTATION token, continuity survives rotation.
      FAUCET_REQUESTER_SALT: ${FAUCET_REQUESTER_SALT:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet)}
      FAUCET_RPC_URL: ${EMBER_RPC_URL:-http://host.docker.internal:8545}
      CUSTODY_URL: http://custody:4000
      CUSTODY_TOKEN: ${FAUCET_CUSTODY_TOKEN:-estate-placeholder-token-0000000000000000}
      FAUCET_FUNDING_ADDRESS: ${FAUCET_FUNDING_ADDRESS:-0x0000000000000000000000000000000000000000}
      FAUCET_CUSTODY_USER_ID: faucet-estate
      FAUCET_CUSTODY_ORDER_ID: faucet-estate-treasury-1
      # The browser origin that posts a drip. `faucet` is a SURFACE on the
      # Network site — `subdomain: 'network'`, `basePath: '/faucet'`
      # (`ui/packages/ui/src/surfaces.ts`) — not a host of its own, so the
      # Origin header on a real drip is `https://network.<apex>` and nothing
      # else. The allowlist has no wildcard and fails closed, so naming the
      # wrong host here is a faucet that answers every browser with 403 while
      # every server-side probe stays green.
      FAUCET_CORS_ORIGINS: https://network${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # 60 confirmations is `contracts-chain`'s EMBER depth and is NOT
      # configurable from here. On a laptop chain that is minutes per drip; the
      # dispense is `sent` long before it is `confirmed`, and both states are
      # readable at `GET /v1/drips/:id`.
      INSTANCE_ID: faucet-estate
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not,
    # and there the faucet would boot, warn that the node is unreachable, serve
    # anyway, and queue every drip for ever. Same reason as `indexer`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}143:4000"
    depends_on:
      faucet-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      custody:
        condition: service_healthy
    healthcheck: *healthcheck

  # ====================================================== tier 4: the two BFFs
  # ---------------------------------------------------------------- admin-api
  # NOTE: admin-api/src/server.ts returns 501 for bootstrap and identity grants
  # no admin role, so the FIRST ADMIN IS A MANUAL UPDATE. That is deliberate,
  # and `estate-bootstrap.sh` does it as an explicit, named step rather than
  # leaving it as folklore.
  admin-api-migrate:
    <<: *migrate-defaults
    build:
      context: ../../admin-api
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      ADMIN_API_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/admin_api
      # WHICH ESTATE AM I? Required by admin-api 1.1.0 with no default, deliberately:
      # its own env.ts records that "a default answer to 'which estate am I?' is how a
      # testnet backup gets restored over mainnet balances". So it is answered here, per
      # network, from the same variable the custody and outbox secret files key on --
      # `CF_EMBER_NETWORK` is set to `testnet` by compose/testnet.env and unset for
      # mainnet, so the two environments cannot both claim to be the same one.
      ADMIN_API_ESTATE_ENVIRONMENT: ${CF_EMBER_NETWORK:-mainnet}
      # No `IDENTITY_URL`: it comes from `*identity-trust` above, so this block
      # follows `CF_IDENTITY_URL` per estate. See the long note in `hub-api`
      # for what overriding it here cost on testnet.
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      MARKET_URL: http://market:4000
      # The migrator never dials notify — it runs migrations and exits — but it boots through
      # the same env parser as the service, which REQUIRES this. Learned on the 2026.08.30
      # deploy: the service block got NOTIFY_URL, this block did not, the migrate job refused
      # to start, and admin-api sat in Created on BOTH networks until this line existed.
      NOTIFY_URL: http://notify:4000
      # Same rule, same reason: the migrator never dials nda either, and refuses to start without
      # it. See the service block below for what this address is for.
      NDA_URL: http://nda:4000
      # The long-lived credential admin-api EXCHANGES for short-lived tokens, re-minting before
      # expiry. 1.3.0 is the first version that can: before it there was no ServiceTokenProvider at
      # all, `index.ts` read the token once at import and handed it verbatim to the ledger, market,
      # billing and identity clients, so the operator console authenticated for the ten minutes
      # after a restart and 401'd every privileged action thereafter — while /livez stayed green,
      # because it makes no outbound call (micro-org#197).
      #
      # `estate-bootstrap.sh` has minted this variable into both tokens files all along and NO
      # compose block referenced it, which is why the JWT stayed in use.
      #
      # ADMIN_API_SERVICE_TOKEN is NOT passed through: 1.3.0 holds it to the same assertion as the
      # credential, and what the tokens files hold for it is a 701-byte JWT that
      # `assertServiceCredential` refuses BY NAME (#222). Its default here was
      # `estate-placeholder-token-0000000000000000` — 40 characters, on no deny-list, over every
      # length floor, so every guard in the estate passed it. That is #142 exactly.
      #
      # This block and admin-api-migrate MUST NOT DRIFT: a market-only change of this shape caused
      # a testnet-wide outage once, and admin-api depends on its migrator with
      # service_completed_successfully.
      ADMIN_API_IDENTITY_CREDENTIAL: ${ADMIN_API_IDENTITY_CREDENTIAL:-}
      INSTANCE_ID: admin-api-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  admin-api:
    <<: *service-defaults
    build:
      context: ../../admin-api
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      ADMIN_API_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/admin_api
      # WHICH ESTATE AM I? Required by admin-api 1.1.0 with no default, deliberately:
      # its own env.ts records that "a default answer to 'which estate am I?' is how a
      # testnet backup gets restored over mainnet balances". So it is answered here, per
      # network, from the same variable the custody and outbox secret files key on --
      # `CF_EMBER_NETWORK` is set to `testnet` by compose/testnet.env and unset for
      # mainnet, so the two environments cannot both claim to be the same one.
      ADMIN_API_ESTATE_ENVIRONMENT: ${CF_EMBER_NETWORK:-mainnet}
      # No `IDENTITY_URL`: it comes from `*identity-trust` above. See `hub-api`.
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      MARKET_URL: http://market:4000
      # The operator mail view (GET /v1/mail, POST /v1/mail/:id/resend). Unlike the four above,
      # this one is called with the OPERATOR's own bearer rather than admin-api's service token:
      # notify's /admin/deliveries routes are requireAdmin and refuse a service principal, and
      # resending somebody's mail should be recorded against the human who asked for it. So there
      # is no grant to derive and no credential to rotate for this peer — only an address.
      NOTIFY_URL: http://notify:4000
      # Forge Worlds. The Worlds screen in the operator console generates and runs *Ninety Days
      # After* worlds through this, and it is the ONLY door into the service: nda has no row in
      # `surfaces.ts`, so no gateway router, no DNS record and no tunnel ingress rule — the
      # container has been healthy for weeks and unreachable from any browser on earth. That is
      # why the title still reads `draft`.
      #
      # Port 4000, NOT the 4110 in nda's own Dockerfile: `x-common-env` sets `PORT: "4000"` for
      # every service here, and the aetherholm block above argues at length for why nda is
      # normalised rather than left on its EXPOSEd port — 4110 is notify's HOST port in this file.
      # The container listens on 4000. `4116` in nda's own `ports:` is the derived HOST port and is
      # bound to 127.0.0.1, so it is not an address admin-api could use even if it wanted to.
      #
      # Called with the OPERATOR's own bearer, like NOTIFY_URL and for the same reason —
      # nda's `requireAdminPrincipal` takes either a service holding nda:write or a human with
      # role:admin, and a world should record the human who generated it. So there is no grant to
      # derive and no credential to rotate here either, only an address.
      NDA_URL: http://nda:4000
      # The long-lived credential admin-api EXCHANGES for short-lived tokens, re-minting before
      # expiry. 1.3.0 is the first version that can: before it there was no ServiceTokenProvider at
      # all, `index.ts` read the token once at import and handed it verbatim to the ledger, market,
      # billing and identity clients, so the operator console authenticated for the ten minutes
      # after a restart and 401'd every privileged action thereafter — while /livez stayed green,
      # because it makes no outbound call (micro-org#197).
      #
      # `estate-bootstrap.sh` has minted this variable into both tokens files all along and NO
      # compose block referenced it, which is why the JWT stayed in use.
      #
      # ADMIN_API_SERVICE_TOKEN is NOT passed through: 1.3.0 holds it to the same assertion as the
      # credential, and what the tokens files hold for it is a 701-byte JWT that
      # `assertServiceCredential` refuses BY NAME (#222). Its default here was
      # `estate-placeholder-token-0000000000000000` — 40 characters, on no deny-list, over every
      # length floor, so every guard in the estate passed it. That is #142 exactly.
      #
      # This block and admin-api-migrate MUST NOT DRIFT: a market-only change of this shape caused
      # a testnet-wide outage once, and admin-api depends on its migrator with
      # service_completed_successfully.
      ADMIN_API_IDENTITY_CREDENTIAL: ${ADMIN_API_IDENTITY_CREDENTIAL:-}
      INSTANCE_ID: admin-api-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}120:4000"
    depends_on:
      admin-api-migrate:
        condition: service_completed_successfully
      ledger:
        condition: service_healthy
      billing:
        condition: service_healthy
      market:
        condition: service_healthy
    healthcheck: *healthcheck

  # ------------------------------------------------------------------ hub-api
  # No migrator and no database: it is a BFF that composes other services'
  # answers and owns no state. It mints SEVEN separate narrow service tokens,
  # one per upstream, rather than one token with the union of the scopes —
  # which is the least-privilege property the scope vocabulary exists to make
  # possible.
  hub-api:
    <<: *service-defaults
    build:
      context: ../../hub-api
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # ── NO `IDENTITY_URL` HERE, AND ITS ABSENCE IS THE FIX ─────────────────
      #
      # It used to be `http://identity:4000`, written as the first of the
      # upstream URLs below and years older than the anchor above. A key that
      # appears in a mapping AFTER a merge key overrides what the merge brought,
      # silently, so `*identity-trust` set `IDENTITY_URL` from `CF_IDENTITY_URL`
      # and this line put the local container back — on the one estate where
      # that is the wrong identity.
      #
      # MEASURED 2026-08-14 on testnet, and it is what "wallet could not be
      # reached" turned out to be. `tokens.testnet.env` holds credentials minted
      # in the MAINNET identity with `network: testnet` (the combined view's
      # whole point: one identity, and the row carries the estate). The testnet
      # identity has never seen them, so `POST /service-tokens/exchange` answered
      # 401 "the service credential presented is not valid" — and a token
      # provider that cannot mint throws `ServiceTokenUnavailableError`, which is
      # not an `HttpError`, so hub-api's `describeFault` fell through to its last
      # arm and reported EVERY upstream as unreachable. Eleven tiles, one
      # credential, no network fault anywhere: `fetch` from this container to
      # `wallet:4000` answered fine throughout.
      #
      # The same line sent the reader's own bearer — minted by the mainnet
      # identity, because there is only one login — to the testnet identity for
      # `GET /auth/me`, which rejected it as `bad_signature`. Both faults are one
      # line, and the line is gone. `scripts/check-identity-trust.py` now fails
      # the build if any service block writes one again.
      LEDGER_URL: http://ledger:4000
      WALLET_URL: http://wallet:4000
      BILLING_URL: http://billing:4000
      PRICING_URL: http://pricing:4000
      POLICY_URL: http://policy:4000
      ACTIVITY_URL: http://activity:4000
      # ── THE ONE THAT WAS MISSING, AND WHAT IT COST ────────────────────────
      #
      # NOTIFY_URL was absent from this block for the whole life of the estate,
      # and hub-api's env.ts did not require it — so the `notifications` tile
      # was hard-coded `unavailable`, `degraded` contained it on every single
      # dashboard response, and hub-web turned that into "notifications is not
      # showing current data. Everything else on this page is." on EVERY
      # signed-in Overview, permanently. Measured 2026-08-11:
      # hub_tile_status_total{tile="notifications",status="unavailable"} was 32
      # of 32 compositions on mainnet and 29 of 29 on testnet, while notify held
      # 172 notifications for 85 users and 77 for 37. micro-org #415.
      #
      # hub-api 1.4.0 makes this REQUIRED rather than optional: a URL that may
      # be absent is a feature that can be silently unconfigured, and this one
      # was, for months, with an incident banner as the only symptom. A deploy
      # that forgets it now fails at boot with the variable's name.
      #
      # `notify:read` is already in IDENTITY_SERVICE_TOKEN_GRANTS for hub-api
      # above — the grant was derived from the scope constants and provisioned
      # long before anything used it, so no grant change accompanies this.
      NOTIFY_URL: http://notify:4000
      # ── SIX NARROW TOKENS WERE HERE, AND THEIR ABSENCE IS THE POINT ───────
      # HUB_LEDGER_TOKEN, HUB_WALLET_TOKEN, HUB_BILLING_TOKEN, HUB_PRICING_TOKEN,
      # HUB_POLICY_TOKEN and HUB_ACTIVITY_TOKEN were six separate 10-minute
      # tokens, deliberately narrow — the AD-05 separation, so a process reached
      # by an attacker held six read tokens and not one that could move money.
      # hub-api has RETIRED all six: env.ts keeps them only as
      # `legacyServiceTokenPresent`, a presence check it reports and never obeys.
      # The narrowing did not go away with them; it moved into the exchange,
      # which mints per upstream from the one credential below. Passing them
      # anyway meant this deploy minted six live JWTs nothing would ever present.
      HUB_API_IDENTITY_CREDENTIAL: ${HUB_API_IDENTITY_CREDENTIAL:-}
      # ── THE SAME DEPLOY FACT hub-web's NGINX RENDERS, HANDED TO THE BFF ───
      #
      # `GET /v1/deployment` answers "does THIS estate run a mining pool", and
      # it exists because the combined view made the question cross-estate.
      # hub-web has always read `/deployment.json` from its own container, which
      # is the right answer to "does the estate serving this page run a pool"
      # and the wrong answer to the question a reader viewing the other network
      # is actually asking. Testnet runs no micro-pool — the `pool` profile is
      # mainnet's, and a pool on that estate's regtest litecoind would refuse to
      # boot — so a mainnet-served page viewing testnet asked `pool-testnet` for
      # `/v1/pool`, got the 502 that mechanism exists to avoid rendering, and
      # showed "The pool could not be read" over an EMBER miner that works.
      #
      # A WEB path cannot answer it: every `-testnet` web hostname 302s to its
      # mainnet sibling, so reading the other estate's `/deployment.json` reads
      # this one's. `/v1` is the half of those hostnames that still answers from
      # the other estate, which is why the fact is served by the BFF.
      #
      # Same variable, same default, same asymmetry as `hub-web` and `pool-web`:
      # only the exact string `absent` means "no pool here", and the image
      # defaults to `present` so an estate that has never heard of the flag is
      # unchanged.
      POOL_API_PRESENCE: "${POOL_API_PRESENCE:-present}"
      INSTANCE_ID: hub-api-estate
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}119:4000"
    depends_on:
      ledger:
        condition: service_healthy
      wallet:
        condition: service_healthy
      billing:
        condition: service_healthy
      pricing:
        condition: service_healthy
      policy:
        condition: service_healthy
      activity:
        condition: service_healthy
      notify:
        condition: service_healthy
    healthcheck: *healthcheck

  # ══════════════════════════════════════════ tier 5: the sixteen frontends ════
  #
  # ── WHY THEY ARE HERE ─────────────────────────────────────────────────────────
  #
  # Until this section, this file defined 22 domain services and NOT ONE FRONTEND
  # CONTAINER, and `docs/ecosystem/22-browser-journeys.md` §8.7 named that as the
  # blocker it is: 318 browser scenarios are specified, 86 of them are tier T3 and
  # need the estate, and *none of them could run* because nothing in the estate
  # served a bundle. A T3 harness was being built in micro-beacon against an
  # environment that could not host it.
  #
  # ── THE HOST PORTS ARE DERIVED, LIKE EVERY OTHER PORT HERE ────────────────────
  #
  # 4100 + the repository's index in micro-org's registry — the same `portFor`
  # rule the 21 services above obey (org/tools/cfctl.ts, over
  # `deployableRepos()` in org/tools/registry.ts). Read out of the registry
  # rather than typed:
  #
  #   node --import tsx -e "import {deployableRepos} from './tools/registry.ts'; \
  #     deployableRepos().forEach((r,i)=>console.log(4100+i, r.name))"   # in micro-org
  #
  # ── THERE ARE NO LONGER ANY CHOSEN PORTS IN THIS FILE ─────────────────────────
  #
  # This block used to say four surfaces — `foresight-web`, `foresight-admin-web`,
  # `emberkin-web`, `aetherholm-web` — were ABSENT FROM THE REGISTRY and so took
  # 4136-4139 by hand, "THE ONLY CHOSEN PORTS IN THIS FILE". micro-org's registry
  # has since been swept from 46 rows to 70 and carries all four, plus `tessera`,
  # `tessera-web` and the three services behind those surfaces. Every host port
  # here is now derived. Nothing in this file is chosen.
  #
  # THE SWEEP MOVED SIXTEEN OF THEM, and this is the part worth remembering: the
  # new rows went in MID-LIST rather than appended — four services ahead of the
  # frontend block, five frontends ahead of ops. The port IS the index, so every
  # row below an insertion moved. The eleven original frontends each slid +4
  # (hub-web 4122 → 4126). `tessera` went 4140 → 4125. The four surfaces above
  # were reordered among themselves. `tessera-web` stayed on 4141 by arithmetic
  # coincidence — which is exactly why individual numbers must never be adopted
  # one at a time: a spot-check of the two ports somebody noticed would have
  # found one already correct and left fourteen wrong.
  #
  # ── THE GUARD, WHICH FOR A LONG TIME DID NOT EXIST ────────────────────────────
  #
  # These lines used to end: "`scripts/web-check.py` fails when this file and the
  # registry disagree, so the drift cannot be silent." THAT SCRIPT DID NOT EXIST.
  # `scripts/` held nine files and none of them was it. The estate's signature
  # defect — a check that cannot fail — in its purest form: one that could not
  # even run, asserted in a comment directly above the thing it claimed to guard.
  # The drift was, in fact, silent, and it stayed silent through a 24-row sweep.
  #
  # The script is now written, and the claim is true rather than aspirational. It
  # executes micro-org's registry rather than parsing it — a regex over
  # `registry.ts` would be a second private copy of the list whose drift is the
  # bug — checks all 39 pins here AND the ports `scripts/estate-verify.sh` drives,
  # and refuses to skip: if micro-org cannot be reached it reports failure rather
  # than a success it did not establish. Run it with `make check-web`.
  #
  # ── WHAT A GREEN HEALTHCHECK HERE IS WORTH ────────────────────────────────────
  #
  # Nothing on its own. See the note on `x-web-defaults`. The proof is in
  # `scripts/estate-verify.sh`.

  # -------------------------------------------------------------- hub-web (hub)
  # THE MOST LOAD-BEARING FRONTEND IN THE ESTATE, for a reason that is not its own
  # feature set: it serves the SIGN-IN SURFACE. `signInRedirect()` sends every
  # product's signed-out visitor to `${accountUrl()}/login`, and the `signin`
  # registry row resolves that to `hub.<apex>/account`
  # (ui/packages/ui/src/surfaces.ts, the `signin` entry). Nothing served that
  # address in any environment, which is why docs/ecosystem/22 §8.1 calls it the
  # largest blocker in the catalogue. Bringing this container up is what closes
  # the environment's half of it.
  hub-web:
    <<: *web-defaults
    # ── AND THE SAME ONE THING, FOR THE SAME REASON (micro-org#406) ──────────
    #
    # `hub-web` serves `/mine`, which reads `GET /v1/pool` from `pool.<apex>` —
    # the service that does not exist on an estate without the `pool` profile.
    # MEASURED 2026-08-11: `hub-testnet.cloudsforge.online/mine` could not load
    # pool status, and the page rendered a full-page failure for it, so EMBER —
    # mined in the tab against hearth, nothing to do with micro-pool — was
    # unreachable behind an error about micro-pool. On the one network where
    # EMBER is the only thing a browser can usefully mine.
    #
    # Same variable, same document, same asymmetry as `pool-web` below: this
    # container's nginx renders `/deployment.json` from it at start, only the
    # exact string `absent` means "no pool here", and the IMAGE defaults to
    # `present` so an estate that has never heard of the flag is unchanged. The
    # full argument — why not a profile, why not a build arg, why the default
    # cannot live in the template — is at `pool-web`.
    #
    # WHAT IT CHANGES HERE IS SMALLER, AND DELIBERATELY SO. `pool-web` has
    # nothing to be without a pool; this surface has a wallet, a portfolio and
    # an EMBER miner. `absent` replaces one panel with an explanation and a link
    # to the network that does run a pool, and stops two doomed cross-origin
    # requests — the page's and the mining bar's, the second of which fires on
    # every address in the app. It removes nothing else.
    environment:
      POOL_API_PRESENCE: "${POOL_API_PRESENCE:-present}"
    build:
      context: ../../hub-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}126:8080"

  # ------------------------------------------------------------- site (apex)
  # The apex. It has no subdomain in the registry, which is why the gateway routes
  # it on the bare apex host rather than on `site.<apex>`.
  site:
    <<: *web-defaults
    build:
      context: ../../site
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}127:8080"

  # --------------------------------------------------------- admin-web (admin)
  admin-web:
    <<: *web-defaults
    build:
      context: ../../admin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}128:8080"

  # --------------------------------------------------------- mint-web (create)
  # `create.<apex>`, not `mint.`: the repository is micro-mint-web and the surface
  # is Forge Create. The registry's subdomain is the address; the repository name
  # is not. The CORS allowlist in gateway/dynamic/policy.yml still names
  # `mint.cloudsforge.online`, which is a separate defect recorded there.
  mint-web:
    <<: *web-defaults
    build:
      context: ../../mint-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}129:8080"

  # --------------------------------------------------------- trade-web (trade)
  trade-web:
    <<: *web-defaults
    build:
      context: ../../trade-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}130:8080"

  # ------------------------------------------------------- worlds-web (worlds)
  worlds-web:
    <<: *web-defaults
    build:
      context: ../../worlds-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}131:8080"

  # --------------------------------------------------- explorer-web (explorer)
  explorer-web:
    <<: *web-defaults
    build:
      context: ../../explorer-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}132:8080"

  # ------------------------------------------------------ network-site (network)
  network-site:
    <<: *web-defaults
    build:
      context: ../../network-site
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}133:8080"

  # ------------------------------------------------------- market-web (market)
  market-web:
    <<: *web-defaults
    build:
      context: ../../market-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}134:8080"

  # -------------------------------------------------- devportal-web (developers)
  # `developers.<apex>`, from the registry — NOT `devportal.`, which is the
  # repository name. gateway/dynamic/policy.yml already carries the correction and
  # the reason it was found.
  devportal-web:
    <<: *web-defaults
    build:
      context: ../../devportal-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}135:8080"

  # ------------------------------------------------------- status-web (status)
  status-web:
    <<: *web-defaults
    build:
      context: ../../status-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}136:8080"

  # --------------------------------------------- foresight-web (foresight) 4138
  # From here down, the four surfaces micro-org's registry did not carry until the
  # 46→70 sweep. They are derived now, like everything else, and the sweep also
  # REORDERED them relative to each other: emberkin-web sorts ahead of the two
  # foresight surfaces in the registry, so it holds 4137 while its block still sits
  # below theirs in this file. The blocks are not in port order and never were —
  # `pricing` (4105) is above `activity` (4109) too. The number is read from the
  # registry, not from position in this file.
  foresight-web:
    <<: *web-defaults
    build:
      context: ../../foresight-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}138:8080"

  # ── foresight-admin-web WAS HERE (4139), and the P13 fold removed it ────────
  #
  # The Foresight operator panel is a SECTION inside the operator console now —
  # `admin.<apex>/foresight`, served by the `admin-web` container above — so there
  # is no second bundle to run and no second hostname to serve it on.
  #
  # ── The gap recorded here for two months is closed, in both directions ──────
  #
  # This block used to carry a long note saying `foresight-admin` was the one
  # surface hostname in the estate not read out of `ui/packages/ui/src/surfaces.ts`,
  # and that the missing row broke `cloudsforgeHosts()`: the label was not in
  # `KNOWN_SUBS`, so it was not stripped, the whole host became the apex, and
  # sign-out resolved to `https://hub.foresight-admin.<apex>/account/logout` — a
  # 404 — with identity, billing and telemetry composed the same way. The note
  # ended "THE FIX IS ONE `subdomain: 'foresight-admin'` ROW IN micro-ui."
  #
  # That row was added, which fixed it. It has now been REMOVED again, and that is
  # not a regression: the row was needed because a bundle answered at that name,
  # and none does. The screens derive their apex through the `admin` row, which is
  # a known subdomain and always was.
  #
  # Nothing was left behind. `gateway/dynamic/estate-web.yml` lost the bundle
  # router and its service, `policy.yml` lost the CORS origin, `cloudflared/gen.py`
  # lost two tunnel hostnames, and micro-org's registry lost the repository row.
  # `scripts/surface-routes.py` is what forces them to move together.
  #
  # Host port 4139 is free. It is deliberately NOT reassigned: the ports in this
  # file are pinned by hand and other repositories have written some of them down,
  # so a gap costs nothing and shuffling to close one costs a search.

  # ------------------------------------------ emberkin-web (emberkin)      4137
  emberkin-web:
    <<: *web-defaults
    build:
      context: ../../emberkin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}137:8080"

  # ------------------------------------------ aetherholm-web (aetherholm)  4140
  aetherholm-web:
    <<: *web-defaults
    build:
      context: ../../aetherholm-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}139:8080"

  # ------------------------------------------ tessera-web (tessera)        4141
  # The SIXTEENTH frontend, and the first whose service is also in this file.
  # foresight-web, emberkin-web and aetherholm-web are bundles with no backend
  # here, which is why estate-web.yml writes no `/v1` router for them: a router
  # pointing at a container that does not exist answers 502, and 502 reads as
  # "the service fell over" — a wrong diagnosis, permanently. tessera-web DOES
  # get one, beside its surface, exactly as that file's note says to do "the day
  # one of these services joins the estate".
  tessera-web:
    <<: *web-defaults
    build:
      context: ../../tessera-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}140:8080"
    # ── `/world-assets/`, THE ONE micro-tessera-web NAMED AS MOST LIKELY TO BE
    #    MISSED — AND `materialise.py` HAS SINCE LANDED ────────────────────────
    #
    # `tessera-web/nginx.conf:73` serves `location /world-assets/` with
    # `try_files $uri =404` and NO index.html fallback — deliberately, because a
    # sprite request answered with HTML decodes as a corrupt PNG rather than as
    # a 404, and the client would report a decode failure for a file that simply
    # is not there. Its own comment says the bytes are "NOT served from this
    # image. micro-deploy maps it … to wherever micro-tessera-assets is
    # materialised".
    #
    # THESE LINES USED TO SAY micro-tessera-assets "HAS NO materialise.py" and
    # described what to do "the day it lands". IT LANDED (its af1aa98). That is
    # the same defect as the `web-check.py` this file once claimed to have and
    # did not: a comment describing the present as the future, sitting directly
    # above the thing it describes. Corrected by wiring it, not by deleting the
    # sentence.
    #
    #     python3 materialise.py --provider flux-2-pro --into <dir>   # in micro-tessera-assets
    #     CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh
    #
    # Switching sets is the whole point and is why this is MOUNTED rather than
    # baked, unlike the chrome every web app carries in its own `public/`: a set
    # is 392 files, and comparing FLUX against a challenger by rebuilding the
    # image would be a rebuild per comparison. The client makes that safe — it
    # resolves by stable relative path and there is NO code path in the bundle
    # that can name a provider (`tessera-web/src/lib/hosts.ts`), so the
    # directory behind the path is the only variable.
    #
    # THE DEFAULT IS STILL THE EMPTY DIRECTORY, and that is a supported state,
    # not a stopgap: with no art mounted the location 404s, which is what the
    # bundle expects and what `scripts/estate-verify.sh` asserts — including
    # that it 404s WITHOUT the app shell.
    volumes:
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/usr/share/nginx/html/world-assets:ro
    depends_on:
      tessera-assets-check:
        condition: service_completed_successfully

  # ═══════════════════ the two OPERATOR consoles — and the only containers ═════
  #                     in this file with NO PUBLISHED HOST PORT
  #
  # ── WHY THEY EXIST ────────────────────────────────────────────────────────────
  #
  # `lantern` and `beacon` are `inSwitcher: true` in ui/packages/ui/src/surfaces.ts
  # and, until tonight, `servesUi: false`: the operator switcher offered every
  # admin two entries that answered **404 application/json** on their own
  # hostnames, because estate-web.yml routed the WHOLE host to the API and said so
  # in as many words — "no bundle is served at `beacon.<apex>`". `micro-lantern-web`
  # and `micro-beacon-web` were written to fill exactly that gap, and this is the
  # half of it that lives here.
  #
  # ── WHY THERE IS NO `ports:` BLOCK, WHICH IS THE ONE THING THAT LOOKS WRONG ───
  #
  # Every other frontend above publishes `127.0.0.1:41xx:8080`, derived as
  # `4100 + the repository's index in micro-org's deployableRepos()`. These two
  # publish NOTHING, and that is a decision rather than an omission:
  #
  #   1. **`micro-lantern-web` and `micro-beacon-web` have no row in micro-org's
  #      registry**, so there is no index for them and therefore no derived port.
  #      `scripts/web-check.py` check 4 is explicit about what happens if one is
  #      chosen anyway — "a chosen port in a derived block is how 'tessera' ended
  #      up on 4140" — and it FAILS on a 4100+ pin whose name the registry does
  #      not carry. Publishing 4145/4146 here would go red immediately.
  #
  #   2. **Adding the rows is not free and is not this repository's to make.**
  #      The port IS the index, so two `web()` rows inserted beside the other
  #      frontends would push `lantern` (4142), `beacon` (4143) and `faucet`
  #      (4144) down by two and move every pin below them — the same mid-list
  #      insertion that silently moved sixteen ports during the 46→70 sweep.
  #      Appending after `faucet` would avoid the shift, but micro-org is not a
  #      repository this change owns, and a registry row added from here would be
  #      a second copy of the very list whose drift these checks exist to end.
  #
  #   3. **Nothing needs the port.** A host port on a frontend is a developer
  #      convenience; the estate reaches these bundles by container name on the
  #      compose network, which is what `cf-web-lantern` and `cf-web-beacon` in
  #      gateway/dynamic/estate-web.yml point at (`http://lantern-web:8080`).
  #      And a loopback port is the WRONG way to open either of them anyway:
  #      both are `adminOnly` bundles that sign in through `nimbus.<apex>` and
  #      read their own API same-origin, so on `127.0.0.1:41xx` `cloudsforgeHosts()`
  #      takes the LOCAL_HOSTS branch and the page resolves an estate that is not
  #      there. `https://lantern.<apex>` is the only address either one works at,
  #      and it is the address `estate-verify.sh` drives them on.
  #
  # `web-check.py` reads pins, not services: a container with no `127.0.0.1:`
  # mapping is simply not in `compose_pins()`, so this is not a hole in the check
  # — there is no number here for it to have an opinion about.

  # ------------------------------------------ lantern-web (lantern.<apex>)
  # Shares `lantern.<apex>` with micro-lantern, which is what makes
  # `resolveApiBase()` return the empty string and every `/v1/issues` request
  # relative (lantern-web/src/lib/hosts.ts). estate-web.yml splits the hostname:
  # `/v1`, `/otlp`, `/ingest`, `/metrics`, `/livez`, `/readyz` to the service at
  # priority 600, everything else to this bundle at 500.
  lantern-web:
    <<: *web-defaults
    build:
      context: ../../lantern-web
      additional_contexts: *web-contexts
      args: *web-build-args

  # ------------------------------------------ beacon-web (beacon.<apex>)
  # Same arrangement, and for this one same-origin is not a preference but the
  # only workable option: micro-beacon sends no `access-control-*` header
  # anywhere in its source and answers 404 to a preflight, so a bundle on any
  # other hostname could not read it at all. micro-beacon-web's own nginx.conf
  # carries a plain-text 404 on `/v1|/api|/metrics|/livez|/readyz` naming this
  # exact gateway rule, so a mis-ordered priority reports itself instead of
  # rendering the console under an API address.
  beacon-web:
    <<: *web-defaults
    build:
      context: ../../beacon-web
      additional_contexts: *web-contexts
      args: *web-build-args

  # ------------------------------------------------ lantern (ops)          4142
  #
  # ══════════════════════════════════════════════════════════════════════════════
  # THE OBSERVABILITY SINK, WHICH THIS FILE DID NOT CONTAIN.
  #
  # `grep -c lantern docker-compose.estate.yml` returned 0. Sixteen frontends have
  # shipped `src/lib/obs.ts` posting browser telemetry since the day the template
  # was written, and NOT ONE EVENT HAS EVER BEEN STORED — because there was no
  # container to store it, and because the bundles were posting the wrong path,
  # the wrong envelope key and the wrong record shape at the same time.
  #
  # Those two failures HID EACH OTHER. A cross-origin POST to a host that does not
  # exist surfaces to the page as `TypeError: Failed to fetch`; so does a 404 that
  # carries no CORS headers. Deploying the service without fixing the bundles
  # would have produced `202 {"stored":0}` — accepted and discarded — and fixing
  # the bundles without deploying the service changes nothing observable at all.
  # Both halves are required before anything can be proven, which is why neither
  # was done for months.
  #
  # It sits LAST because nothing depends on it. That is a property worth stating:
  # a telemetry sink that another service waited on would be a telemetry sink
  # whose outage is an estate outage, and this one is deliberately not that. It
  # is also why it has no `depends_on` from anybody above.
  # ══════════════════════════════════════════════════════════════════════════════
  lantern-migrate:
    <<: *migrate-defaults
    build:
      context: ../../lantern
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LANTERN_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/lantern
      LANTERN_TOKEN: ${LANTERN_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet)}
      INSTANCE_ID: lantern-migrate
    depends_on:
      postgres:
        condition: service_healthy

  lantern:
    <<: *service-defaults
    build:
      context: ../../lantern
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      LANTERN_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/lantern
      # Thirty-six characters. `requiredSecret` refuses anything under 24 AND
      # refuses a known placeholder by name (`changeme`, `secret`, `token`, …),
      # so this cannot be shortened or made "obvious" without a dead container.
      LANTERN_TOKEN: ${LANTERN_TOKEN:?set it in compose/estate/tokens.env (mainnet) or tokens.testnet.env (testnet)}
      # ══════════════════════════════════════════════════════════════════════════
      # WITHOUT THIS THE SINK IS OFF, AND OFF MEANS 404 ON EVERYTHING.
      #
      # `rumOrigins` defaults to EMPTY, and empty is not "allow all" — it is the
      # sink disabled. `server.ts` throws NotFoundError before reading a byte, and
      # its own unknown-path diagnostics are unreachable too. Lantern would be
      # deployed, healthy, and still silent: the exact state this whole change
      # exists to end, wearing a green healthcheck.
      #
      # THESE ARE THE GATEWAY ORIGINS, NOT THE LOOPBACK PORTS, and that is the
      # correction that mattered. A bundle derives its siblings from the hostname
      # it was served on (`cloudsforgeHosts()`): served from
      # `https://hub.<apex>` it posts to `https://lantern.<apex>`, which is the
      # path the estate's own browser tier drives. Served from
      # `http://127.0.0.1:4126` it takes the LOCAL_HOSTS branch and posts to
      # `http://localhost:4010` — lantern's BIND port, which this file does not
      # publish because host ports here are derived, not chosen. So the loopback
      # origins are deliberately absent: listing them would advertise a route that
      # cannot complete, and an allowlist entry that can never match is another
      # check that cannot fail.
      #
      # Eighteen surfaces, same list and same order as IDENTITY_HANDOFF_ORIGINS
      # above. `site` is the bare apex — empty `subdomain` in the registry — which
      # is why the first entry carries no label.
      #
      # ── THE LAST TWO, AND WHY `lantern.` ITSELF IS ON ITS OWN ALLOWLIST ───────
      #
      # `lantern.` and `beacon.` are the operator consoles that now share these
      # two hostnames with their services. `beacon.` is the ordinary case — one
      # more surface shipping the shared UI, so one more origin posting to
      # `${hosts().lantern}/ingest/client` from `src/lib/obs.ts`.
      #
      # `lantern.` looks like a mistake and is not. `isAllowedOrigin` is
      # `env.rumOrigins.includes(origin)` over the browser's `Origin` header, and
      # a browser sends `Origin` on a cross-site-capable POST whether or not the
      # target happens to be the page's own host. So the console that exists to
      # READ Lantern would have had its own error reports refused with 400 — a
      # blind spot precisely over the pages an operator opens when something is
      # already wrong, which is the worst possible place for one.
      # ══════════════════════════════════════════════════════════════════════════
      LANTERN_RUM_ORIGINS: >-
        https://${CF_SITE_HOST:-cloudsforge.localtest.me},
        https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://market${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://create${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://trade${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://worlds${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://explorer${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://network${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://developers${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://admin${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://status${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://foresight${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://emberkin${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://aetherholm${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://tessera${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://lantern${CF_WEB_SUFFIX:-.cloudsforge.localtest.me},
        https://beacon${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      INSTANCE_ID: lantern-estate
    ports:
      # 4142 — `deployableRepos()` index 42, immediately after tessera-web's 4141.
      # Derived, not chosen; `make check-web` re-derives it from micro-org.
      - "127.0.0.1:${CF_PORT_BASE:-4}141:4000"
    depends_on:
      lantern-migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck

  # ------------------------------------------ the world-art mount, VALIDATED ──
  #
  # ── WHY A HALF-POPULATED MOUNT IS THE DANGEROUS CASE, AND THE ONLY ONE ────────
  #
  # `micro-tessera-assets`' `materialise.py` already refuses an incomplete set:
  # it resolves all 392 entries before writing a byte, names every gap, and
  # materialises NOTHING on a miss — because "a directory that is mostly Qwen and
  # quietly partly FLUX" makes every judgement about the art a judgement about a
  # blend nobody chose. THAT GUARANTEE ENDS AT THE DIRECTORY. Nothing downstream
  # re-checks it, and a mount is trivially easy to get half right: a copy
  # interrupted, a subdirectory excluded, a path pointed one level too deep.
  #
  # And the symptom is the worst kind. `tessera-web/src/lib/sprites.ts` has NO
  # FALLBACK SPRITE by design — a missing sprite is "a visible hole with a name,
  # not a substitute" — so a 90%-populated mount renders a world with holes while
  # nginx answers 200 on everything it does have and every healthcheck in this
  # file stays green. That is exactly the shape of `STUDIO_ASSET_ROOT` being
  # unset, which EACCES'd every generation while the container reported healthy
  # and nothing in the service probed the directory it exists to write.
  #
  # So the mount is asserted before tessera-web serves, and there are three
  # states rather than two:
  #
  #   empty     no SET.json and no PNG. The documented default: no art here, the
  #             location 404s, the bundle expects it. PASSES, loudly.
  #   complete  SET.json present AND the PNG count equals its own
  #             `materialisedCount`. PASSES.
  #   anything  a receipt without its files, files without a receipt, or a count
  #   else      that disagrees. FAILS, and tessera-web does not start.
  #
  # The count is compared against the RECEIPT the writer left, not against a
  # number typed here. A literal 392 in this file would be a second copy of a
  # fact micro-tessera-assets owns, and it would be wrong the first time a set
  # gains an asset — which is the drift this estate has already paid for twice.
  tessera-assets-check:
    image: busybox:1.37
    restart: "no"
    volumes:
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/world-assets:ro
    # `sh -c`, single-quoted in YAML so `$` reaches the shell rather than compose.
    # busybox has no jq: `materialisedCount` is read with grep -o, which is
    # sufficient for a number this file did not write and does not parse further.
    command:
      - sh
      - -c
      - |
        set -e
        pngs=$$(find /world-assets -name '*.png' | wc -l)
        if [ -f /world-assets/SET.json ]; then
          want=$$(grep -o '"materialisedCount"[^0-9]*[0-9]*' /world-assets/SET.json | grep -o '[0-9]*$$')
          if [ -z "$$want" ]; then
            echo "FATAL: /world-assets/SET.json has no materialisedCount." >&2
            echo "       It was not written by materialise.py, so nothing can say what a" >&2
            echo "       complete mount is. Re-run: python3 materialise.py --provider <id> --into <dir>" >&2
            exit 1
          fi
          if [ "$$pngs" != "$$want" ]; then
            echo "FATAL: the world-art mount is HALF POPULATED." >&2
            echo "       SET.json says $$want file(s) were materialised; the mount holds $$pngs." >&2
            echo "       tessera-web has no fallback sprite, so serving this renders a world with" >&2
            echo "       holes while every healthcheck stays green. Refusing to start." >&2
            exit 1
          fi
          set_id=$$(grep -o '"provider"[^,]*' /world-assets/SET.json | head -1)
          echo "world art: $$pngs file(s), $$set_id — complete against its own receipt"
          exit 0
        fi
        if [ "$$pngs" != 0 ]; then
          echo "FATAL: /world-assets holds $$pngs PNG(s) and NO SET.json." >&2
          echo "       Nothing records which asset set this is, and nothing can check it is" >&2
          echo "       whole. The sets are deliberately the same shapes in the same colours," >&2
          echo "       so 'which model is this?' is not answerable by eye. Materialise it:" >&2
          echo "         python3 materialise.py --provider <id> --into <dir>   # micro-tessera-assets" >&2
          exit 1
        fi
        echo "world art: none mounted. /world-assets/ will 404, which is the supported default."
        echo "           To serve a set:  CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh"
        exit 0

  # ══════════════════════════════════════════════════════════════════════════════
  # THE MINING POOL — BEHIND A PROFILE, AND THE PROFILE IS THE POINT.
  #
  # `micro-pool` is a Stratum v1 server for the Bitcoin-family chains this host
  # already runs nodes for (docs/ecosystem/36-multi-chain-and-mining-pool.md §5).
  # It builds templates with `getblocktemplate`, hands work to real hardware over
  # raw TCP, judges shares, submits blocks, and records who is owed what.
  #
  # ── WHY IT IS BEHIND A PROFILE, AND WHAT ADMITTED IT ON 2026-08-09 ────────────
  #
  # Two of its variables had no value, and both were decisions rather than
  # oversights. `profiles:` is the faucet's precedent, applied for the faucet's
  # reason: compose can add a service for a profile but cannot remove one for an
  # environment, and a service that crash-loops takes `--wait` down with it.
  #
  # BOTH ARE NOW ANSWERED and `compose/mainnet.env` sets `COMPOSE_PROFILES=pool`,
  # so the mainnet estate brings the pool up as part of a release like any other
  # service. The profile stays because it is what keeps the pool OFF a testnet
  # estate, whose litecoind this service would refuse anyway (`POOL_NETWORK`), and
  # off any host where the two variables below are unset — where the container
  # would refuse to start and take the deploy's `--wait` with it.
  #
  #   1. **POOL_LTC_PAYOUT_ADDRESS — the coinbase output.** 36 §5.3 says found
  #      blocks are "the pool's revenue AND THE MINERS' CLAIM ON IT", so this
  #      address holds coin that is owed to people and its key belongs in custody.
  #      Custody has four purposes today — deposit, treasury, deployer, user — and
  #      none of them is this one. `treasury` in particular must never be used:
  #      a treasury-purpose key on ltc/mainnet is a ROTATION CANDIDATE for
  #      settlement's pinned treasury, and if it were ever pinned every block this
  #      pool had mined to it would become unbooked custody inflow — the exact
  #      drift that refused every EMBER withdrawal for three days on 2026-08-05
  #      (micro-org#247, #248).
  #
  #      SETTLED 2026-08-09: custody grew a `pool` purpose and an operator route,
  #      `POST /v1/admin/pool-payouts/:chain/:network/mint` (micro-org#293), and
  #      the mainnet address was minted through it under an operator's own name —
  #      not a service's. It is set in `estate/tokens.env`, which is untracked and
  #      0600, so this line still reads it from the environment and still defaults
  #      to empty: a host that has not minted one gets a refusal to start rather
  #      than a pool mining to nowhere.
  #   2. **POOL_FEE_BASIS_POINTS — chosen on 2026-08-09: 1%, 100 basis points.**
  #      36 §7.1 asked for it to be chosen "before the first miner connects rather
  #      than after", and it now has been. Until today this line passed an empty
  #      string through on purpose — a default of 0 would have answered the question
  #      with "free" and a default of 200 with "2%", either of them written in the
  #      file least likely to be read by whoever eventually decided. That is why the
  #      number was not invented here earlier and why it took an actual decision to
  #      put one here now: the fee is not a tuning knob, it is a term. It is
  #      multiplied into the coinbase split of every block this pool finds and lands
  #      in the recorded history of a public chain, where changing it later does not
  #      restate what it already paid.
  #
  #      1% is the low end of what operating pools charge; the pool has no miners
  #      yet and the first ones will compare it against pools that have been paying
  #      out for years. `pool/src/env.ts` still uses `requiredInteger` — the default
  #      below lives in this file, not in the service, so a deployment that unsets
  #      it does not silently mine for free: the container refuses to start.
  #
  # So the consequence is stated rather than buried, exactly as the faucet's block
  # states its own: on an estate whose env file does not name the profile, a plain
  # `up` brings up NO POOL, and bringing it up is deliberate —
  #
  #   COMPOSE_PROFILES=pool ./scripts/estate-up.sh
  #
  # ── LTC AND, SINCE 2026-08-11, BTC — AND BOTH ARE MEASUREMENTS ────────────────
  #
  # `POOL_CHAINS` defaults to `ltc` alone and `mainnet.env` now names both. The
  # default stays at `ltc` because it is what a host with no bitcoind can serve;
  # the estate overrides it because this one has reached the tip.
  #
  # The condition this line waited on was stated here on 2026-08-09 — "add `btc`
  # when bitcoind reports `initialblockdownload: false`, and not before" — and it
  # was met on 2026-08-10. Measured 2026-08-11: bitcoind at height 961,967,
  # `initialblockdownload: false`, difficulty 1.2748e14. `getblocktemplate` on a
  # node still in IBD returns work for a tip eighty thousand blocks behind the
  # network, so every share against it would be judged against a template no other
  # miner has ever seen. That is no longer the state.
  #
  # ── TWO THINGS ABOUT BTC HERE THAT LOOK LIKE FAULTS AND ARE NOT ───────────────
  #
  #   1. **BTC templates carry zero transactions, and that is `blocksonly`.**
  #      Measured 2026-08-11 at 961,967: `getblocktemplate` returned an empty
  #      `transactions` array with `coinbasevalue 312500000` — the subsidy alone,
  #      no fees. This node runs `blocksonly=1`, so it keeps no mempool to build
  #      from, which is the correct setting for a node whose job is custody
  #      observation and which makes it a poor block builder. A found block would
  #      pay 3.125 BTC and forgo the fees a full-mempool template would have
  #      collected. That is a known cost of the node's configuration and NOT
  #      something to repair by flipping `blocksonly` on a machine that is also
  #      the estate's custody source of truth — see micro-org#373 §6 item 6.
  #   2. **`stratumEndpoint` stays null for BTC, exactly as it is for LTC.** There
  #      is no TCP ingress to this estate at all; the section below argues why at
  #      length and nothing about adding a second chain changes it. So the mapping
  #      for 3333 is added on the same loopback default as 3334 — reachable from
  #      this host and this LAN once an operator widens the bind on purpose, and
  #      advertised to nobody until `POOL_STRATUM_PUBLIC_HOST` and
  #      `POOL_BTC_STRATUM_PUBLIC_PORT` are BOTH set. micro-org#373 §6 item 7.
  #
  # ── AND BTC IS NOT OFFERED TO BROWSERS, WHICH IS THE SERVICE'S DECISION ───────
  #
  # micro-org#360. `pool/src/chains.ts` refuses BTC to the browser transport by
  # name and `GET /v1/pool` reports the refusal with its reason; the pool builds
  # that chain with no ticket redeemer, so its listener answers `attachWebSocket`
  # with false. Nothing in this file configures that and nothing here can turn it
  # on — measured 2026-08-11 at height 961,966 the Bitcoin network ran at about
  # 793 EH/s of purpose-built silicon, and a browser tab against it returns shares
  # that can never become a block. Adding `btc` to `POOL_CHAINS` therefore admits
  # hardware over Stratum and no browser at all, deliberately.
  #
  # ── THE STRATUM PORT IS RAW TCP AND TRAEFIK CANNOT CARRY IT ───────────────────
  #
  # Every other ingress in this estate is HTTP through the gateway. Stratum is a
  # newline-delimited JSON-RPC stream over a plain socket, so the gateway has no
  # router that could serve it and the Cloudflare Tunnel cannot forward it either.
  # It is published directly, and the bind defaults to LOOPBACK: an unauthenticated
  # TCP listener on a box that also serves public traffic is not something to widen
  # by accident. A real miner needs it widened on purpose —
  # `POOL_STRATUM_HOST_BIND=0.0.0.0` — and that is a decision with a blast radius,
  # which is why it is a variable and not a literal.
  #
  # As of micro-org#285 it is a TWO-PART decision, and both parts are here. Widening
  # the bind makes the listener reachable; it does not make the console able to say
  # so. `GET /v1/pool` reports the endpoint a miner should dial from
  # `POOL_STRATUM_PUBLIC_HOST` plus `POOL_<CHAIN>_STRATUM_PUBLIC_PORT`, and reports
  # `null` when either is unset — it never infers one from the request `Host`, which
  # is what it used to do and which produced `stratum+tcp://pool.cloudsforge.online`,
  # a name that resolves to Cloudflare and a port Cloudflare does not carry. So a
  # widened bind with those two unset is a pool that accepts miners while its own
  # console tells them there is nowhere to connect, and the two variables set with a
  # loopback bind is the reverse and worse. Set all three or none of them.
  #
  # The published port is `POOL_LTC_STRATUM_PUBLIC_PORT` in BOTH roles below: it is
  # the host side of the port mapping and it is what the service reports. It used to
  # be `POOL_LTC_STRATUM_PORT` on the mapping alone — a variable the container's own
  # environment never received, so moving the published port moved the mapping and
  # nothing else. One name doing both jobs cannot drift from itself.
  pool-migrate:
    profiles: ["pool"]
    <<: *migrate-defaults
    build:
      context: ../../pool
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      POOL_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/pool
      # The migrator imports the same eager `env.ts` the service does, so it needs
      # every variable the service needs — which is why the fee default is repeated
      # here rather than left to the service. A migration run for a service that
      # cannot start is a schema created for nothing.
      POOL_NETWORK: *money-network
      POOL_CHAINS: ${POOL_CHAINS:-ltc}
      POOL_LTC_NODE_URL: ${LTC_RPC_URL:-}
      POOL_LTC_PAYOUT_ADDRESS: ${POOL_LTC_PAYOUT_ADDRESS:-}
      # Both empty by default, and empty is a refusal to start rather than a
      # default — `pool/src/env.ts` requires a node URL and a payout address for
      # every chain in `POOL_CHAINS`. A host that names `btc` without minting an
      # address gets a container that will not boot, which is the outcome to want:
      # a pool mining to nowhere pays a block reward to a script nobody holds.
      POOL_BTC_NODE_URL: ${BTC_RPC_URL:-}
      POOL_BTC_PAYOUT_ADDRESS: ${POOL_BTC_PAYOUT_ADDRESS:-}
      POOL_FEE_BASIS_POINTS: ${POOL_FEE_BASIS_POINTS:-100}
      INSTANCE_ID: pool-migrate
    depends_on:
      postgres:
        condition: service_healthy

  pool:
    profiles: ["pool"]
    <<: *service-defaults
    build:
      context: ../../pool
      additional_contexts: *build-contexts
    # ── WHERE THE ADVERTISED STRATUM ADDRESS COMES FROM (micro-org#457) ─────────────────────────
    #
    # `stratum-endpoint` writes this file when — and only when — it has an address it is willing
    # to stand behind. It sets `POOL_STRATUM_PUBLIC_HOST` and the per-chain public ports directly,
    # as container-side names, so nothing here has to interpolate them and no `--env-file` can
    # reach past it.
    #
    # `required: false` for the same reason the indexer's chainrpc file is optional, and the same
    # evidence: the file is generated, gitignored, and therefore ABSENT on a CI runner, where a
    # bare path makes `docker compose config` fail outright rather than warn. That failure has
    # turned main red before.
    #
    # Absent is also the correct state before a NAT rule exists. With no file, no public host is
    # set, `GET /v1/pool` reports `stratumEndpoint: null`, and `pool-web` says to contact the
    # administrator — which is the honest answer while nothing can actually connect.
    env_file:
      - path: generated/stratum.env
        required: false
    environment:
      # `*identity-trust` was already on this line and is now LOAD-BEARING rather
      # than incidental. micro-org#289 gives the pool a user-facing route for the
      # first time — `POST /v1/pool/ticket`, which verifies an estate access token
      # against `IDENTITY_JWKS_URL` and `IDENTITY_ISSUER` — and micro-pool reads
      # that pair as both-or-neither, refusing to start on half of it.
      #
      # NOTHING IS ADDED HERE, DELIBERATELY. The anchor is this estate's one
      # answer to "which JWKS", shared with the 55 other services that verify a
      # token, and writing the two URLs out again on this block would be a second
      # copy that drifts from it the first time identity moves. The `x-identity-
      # trust` block near the top of this file is where they are decided.
      #
      # Identity unset stays a SUPPORTED mode in the service — the WebSocket
      # transport is simply not attached and the ticket route answers 503 — but it
      # is not a mode this estate is ever in, and it is not a mode that may be
      # combined with the advertised origin below. See
      # `scripts/check-pool-websocket-config.py`.
      <<: [*common-env, *identity-trust]
      POOL_DATABASE_URL: postgres://cloudsforge:${CF_POSTGRES_PASSWORD}@postgres:5432/pool
      # The same anchor the money tier reads, and for the same reason: one answer
      # to "which network is this". It is load-bearing here in a way it is not
      # elsewhere — `pool/src/template.ts` asks the node `getblockchaininfo` and
      # REFUSES to mine if the chain it reports does not match, because a mainnet
      # template mined towards a testnet payout address pays the reward to nobody.
      # On a testnet estate this service therefore refuses the mainnet litecoind
      # rather than quietly mining to an address on the wrong network.
      POOL_NETWORK: *money-network
      POOL_CHAINS: ${POOL_CHAINS:-ltc}
      # Carries HTTP Basic userinfo. `pool/src/env.ts` never echoes it — a node URL
      # in an error message is the most reliably logged string in any process — and
      # neither does anything here.
      POOL_LTC_NODE_URL: ${LTC_RPC_URL:-}
      POOL_LTC_PAYOUT_ADDRESS: ${POOL_LTC_PAYOUT_ADDRESS:-}
      # The same two for bitcoin, and the same rule: `POOL_BTC_NODE_URL` carries
      # HTTP Basic userinfo and is never echoed, by `env.ts` or by anything here.
      # `POOL_BTC_PAYOUT_ADDRESS` is `bc1q7u9…f9jlx`, minted 2026-08-11 through
      # custody's `POST /v1/admin/pool-payouts/bitcoin/mainnet/mint` under the
      # `pool` purpose and under an operator's own name — never a service's, so
      # `custody_keys.created_by` names a human as the creator of the address
      # every BTC block reward would pay into. `pool` and not `treasury` for the
      # reason stated above: a treasury-purpose key on btc/mainnet is a ROTATION
      # CANDIDATE for settlement's pinned treasury, and pinning one the pool had
      # mined to would turn every found block into unbooked custody inflow.
      POOL_BTC_NODE_URL: ${BTC_RPC_URL:-}
      POOL_BTC_PAYOUT_ADDRESS: ${POOL_BTC_PAYOUT_ADDRESS:-}
      POOL_FEE_BASIS_POINTS: ${POOL_FEE_BASIS_POINTS:-100}
      # ══════════════════════════════════════════════════════════════════════════
      # TWO STRATUM TRANSPORTS, CONFIGURED NOTHING ALIKE, AND THE ASYMMETRY IS THE
      # DESIGN — micro-org#289
      # ══════════════════════════════════════════════════════════════════════════
      #
      # From here to the end of `ports:` below, one pool is published over two
      # transports, and the two halves look so unlike each other that the natural
      # reading is that one of them is half-finished. Neither is. They differ
      # because the protocols differ, and the difference is worth a page because
      # the obvious "tidy-up" is the one thing that must not be done.
      #
      # ── RAW TCP ON 3334 CANNOT BE PUBLISHED FROM THIS ESTATE AT ALL ───────────
      #
      # Stratum v1 is newline-delimited JSON-RPC over a plain socket. It is not
      # HTTP. Traefik therefore has no router that could carry it — every router in
      # `gateway/dynamic/` matches a `Host()` and usually a path, and this protocol
      # offers neither — and the Cloudflare Tunnel in front of the gateway forwards
      # HTTP and nothing else. So the container publishes that port itself and the
      # bind defaults to LOOPBACK, which leaves exactly one population able to
      # reach it: somebody already on this host, or on this LAN once an operator
      # sets `POOL_STRATUM_HOST_BIND` on purpose. That ceiling is a decision, not
      # an omission, and it is not lifted by anything in micro-org#289.
      #
      # ── THE WEBSOCKET TRANSPORT NEEDS NONE OF IT, BECAUSE IT IS HTTP ──────────
      #
      # `/v1/pool/stratum/<chain>` is an ordinary HTTPS request until the 101, so
      # it rides the router this estate already had: `cf-api-pool` in
      # `gateway/dynamic/estate-web.yml` matches `PathPrefix(/v1)` on
      # `pool{CF_WEB_SUFFIX}` and was carrying that path before anyone asked it to.
      # The listener attaches to micro-pool's EXISTING HTTP server via the
      # `upgrade` event, on the same `PORT` that already answers /livez, /readyz
      # and /v1 — so there is no new port, no new mapping, no second listener and
      # no bind to widen. The whole of what it costs this file is the one
      # advertisement variable below.
      #
      # ── SO THE FAST TRANSPORT IS THE PRIVATE ONE. READ THAT TWICE ─────────────
      #
      # An ASIC or a GPU rig speaks raw TCP and can reach this pool only from the
      # LAN. A browser tab — the slowest miner that exists, by orders of magnitude
      # — is the one a stranger anywhere on the internet can use. That is the
      # INVERSE of what a reader expects, and it is the trap in this block: the
      # instinctive repair is to publish 3334 so that "real" miners get the public
      # path too. Publishing 3334 is precisely what must not happen by reflex. An
      # unauthenticated TCP listener on the box that serves every public surface in
      # this estate is not a port to open because a comment read oddly, and the
      # WebSocket path does not need it opened — it is not a workaround for the
      # loopback bind, it is a different transport for a different client.
      #
      # ── WHAT PUBLISHING RAW TCP WOULD ACTUALLY TAKE, IF IT IS EVER DECIDED ────
      #
      # Both of these, and neither on its own:
      #
      #   1. A TCP entryPoint on Traefik plus a `tcp:` router with a `HostSNI`
      #      rule. This gateway defines four entryPoints — `web`, `websecure`,
      #      `tunnel`, `metrics` (`compose/docker-compose.gateway.yml`) — and all
      #      four are HTTP. There is no `tcp:` section in `gateway/dynamic/` at
      #      all. And SNI is not free here either: Stratum firmware dials a bare
      #      host and port with no TLS, so a `HostSNI` rule has nothing to match.
      #   2. A path from the internet that carries arbitrary TCP. On Cloudflare
      #      that means Spectrum — a paid, Enterprise-tier product for arbitrary
      #      ports — and NOT the free `cloudflared` tunnel this estate runs, which
      #      is what `cloudflared/gen.py` generates ingress for.
      #
      # Neither exists here as of 2026-08-09, and the second is a billing decision
      # rather than a configuration one. Until both do, the loopback bind is not a
      # limitation to route around; it is an accurate statement of what this host
      # can offer, which is what `GET /v1/pool` reports.
      # ══════════════════════════════════════════════════════════════════════════

      # The endpoint the console hands a stranger, and the second half of the bind
      # decision described above. Empty by default and empty is a real answer here:
      # `GET /v1/pool` then reports no stratum endpoint at all rather than guessing
      # one, which is the whole of micro-org#285. `env.ts` refuses to start if one
      # of the pair is set without the other, so a half-configured endpoint is
      # caught while the operator who typed it is still watching — not by a miner
      # whose firmware silently fails to connect.
      POOL_STRATUM_PUBLIC_HOST: ${POOL_STRATUM_PUBLIC_HOST:-}
      POOL_LTC_STRATUM_PUBLIC_PORT: ${POOL_LTC_STRATUM_PUBLIC_PORT:-}
      # Per chain, because the ports differ and a single one would advertise the
      # litecoin listener to a bitcoin miner. Unset on this estate, so `GET
      # /v1/pool` reports `stratumEndpoint: null` for BTC — there is no TCP
      # ingress here to advertise (micro-org#373 §6 item 7).
      POOL_BTC_STRATUM_PUBLIC_PORT: ${POOL_BTC_STRATUM_PUBLIC_PORT:-}
      # The other transport's advertisement, and the same rule as the pair above:
      # `GET /v1/pool` composes each chain's `websocketEndpoint` from this origin
      # plus the served path, and reports `null` when it is unset. It is NEVER
      # derived from the request `Host`, the bind address or the container port —
      # micro-org#285 again, applied to the transport that did not exist when #285
      # was written.
      #
      # DERIVED FROM `CF_WEB_SUFFIX`, NOT TYPED, which is how every other public
      # URL in this file is written (`IDENTITY_ACCOUNT_URL`, `STUDIO_PUBLIC_URL`,
      # `BEACON_HANDOFF_ORIGIN`). Each environment then advertises its own
      # hostname and neither can be handed the other's — the failure that took
      # cross-surface sign-in down for eleven hours on 2026-08-05 was one
      # hostname carried in shell state, and this variable is exactly that shape.
      # `wss:`, not `ws:`, because the only way in is the tunnel and the tunnel is
      # TLS at the edge; micro-pool validates the scheme at boot and refuses a
      # path, query, fragment or userinfo on it.
      #
      # ADVERTISEMENT ONLY. It binds nothing, routes nothing and appears in no
      # port mapping — the listener is already up on `PORT` and `cf-api-pool`
      # already carries the path. Its one hazard is the combination it must never
      # be in: set here with the identity pair unset is a BOOT REFUSAL, not a
      # warning, because advertising an endpoint nobody can authenticate to is
      # micro-org#285's defect with the sign flipped. On this estate the pair
      # arrives through `*identity-trust` above and cannot be absent — but a
      # compose file is exactly where that combination would be shipped, and a
      # shipped crash loop on a profile-gated service is one nobody sees until
      # they start it by hand. `scripts/check-pool-websocket-config.py` refuses it.
      POOL_WEBSOCKET_PUBLIC_ORIGIN: wss://pool${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # Written into every coinbase this pool builds. Capped at 32 bytes here and
      # refused at boot above that: the scriptSig it lives in is capped at 100 by
      # consensus and shares that space with the BIP34 height and the extranonce,
      # so an over-long tag does not truncate — it makes the coinbase invalid.
      POOL_COINBASE_TAG: ${POOL_COINBASE_TAG:-/cloudsforge/}
      INSTANCE_ID: pool-estate
    ports:
      # 4146 — `deployableRepos()` index 46, immediately after beacon-web's 4145.
      # Derived, not chosen; `make check-web` re-derives it from micro-org.
      #
      # AND THIS IS THE WHOLE OF WHAT THE WEBSOCKET TRANSPORT PUBLISHES. It
      # upgrades on this same container port 4000, so there is no line for it in
      # this block and there must not be one: a second mapping would be a second
      # address for a listener that only ever had one, and the one nobody tests.
      # See the asymmetry note above.
      - "127.0.0.1:${CF_PORT_BASE:-4}146:4000"
      # Stratum. See the note above on why this is not behind the gateway, why the
      # default bind is loopback, and why the host side reads the PUBLIC port —
      # the same variable the service reports, so the two cannot disagree. The
      # container side is the literal 3334 because `POOL_LTC_STRATUM_PORT` is not
      # passed in and the listener therefore always binds its own default.
      - "${POOL_STRATUM_HOST_BIND:-127.0.0.1}:${POOL_LTC_STRATUM_PUBLIC_PORT:-3334}:3334"
      # Bitcoin's listener, on the same terms. `DEFAULT_STRATUM_PORT` in
      # `pool/src/chains.ts` is 3333 for btc and 3334 for ltc, and the container
      # side is the literal for the same reason as above — `POOL_BTC_STRATUM_PORT`
      # is not passed in, so the listener always binds its own default.
      - "${POOL_STRATUM_HOST_BIND:-127.0.0.1}:${POOL_BTC_STRATUM_PUBLIC_PORT:-3333}:3333"
    depends_on:
      pool-migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck

  # ------------------------------------------------ pool-web (pool.<apex>)
  # Shares `pool.<apex>` with micro-pool, the arrangement lantern and beacon use:
  # the bundle resolves its API base to the empty string and issues relative
  # `/v1/...`, and estate-web.yml splits the hostname by path. It carries NO
  # published host port and NO environment at all — micro-pool-web has no
  # configuration surface and a CI grep in that repository fails the build if one
  # appears, because a static bundle's "configuration" is baked at build time and
  # a runtime variable on one is a promise nothing keeps.
  #
  # No profile. A bundle with nothing behind it renders its own named holes rather
  # than crashing, which is what that repository was built to do, and a console
  # that is reachable before the service is is how an operator finds out the
  # service is not there. It is the pool container that must not start half
  # configured, not the page that describes it.
  pool-web:
    <<: *web-defaults
    # ── THE ONE THING THIS CONSOLE CANNOT WORK OUT FOR ITSELF (micro-org#406) ──
    #
    # The paragraph above says a bundle with nothing behind it "renders its own
    # named holes rather than crashing". It did not. MEASURED 2026-08-11:
    # `pool-testnet.cloudsforge.online/` served the console with a 200 and every
    # `/v1/…` under it answered a Traefik 502 — there is no `pool` container on
    # this estate to forward to — so `/`, `/workers` and `/blocks` each rendered
    # "The pool did not answer" with a **Try again** button that could never
    # succeed. Three pages of an incident that was not happening, on a network
    # that is behaving exactly as this file intends.
    #
    # A 502 is indistinguishable from an outage to a client that has never been
    # told the difference, and nothing had ever told it. THIS LINE IS THAT
    # TELLING. `absent` makes the container's own nginx answer
    # `GET /deployment.json` with `{"poolApi":"absent"}`; the bundle reads it
    # above its router, renders a branded explanation with a link to the mainnet
    # pool in place of every console page, and — the half that matters here —
    # issues NO `/v1` request at all.
    #
    # ── WHY IT IS NOT A PROFILE ON THIS SERVICE ───────────────────────────────
    #
    # Because `gateway/dynamic/estate-web.yml` points `cf-web-pool` at
    # `http://pool-web:8080` and its router matches the whole Host. Take the
    # container away and Traefik answers 502 for the ENTIRE hostname — `/`,
    # `/workers`, `/blocks`, and `robots.txt` with the `Disallow: /` that keeps a
    # testnet pool console out of search results. That is strictly worse than
    # today, not better: an unbranded gateway error instead of a page.
    #
    # ── WHY IT IS AN ENVIRONMENT VARIABLE AND NOT A BUILD ARG ─────────────────
    #
    # The paragraph above is right that a static bundle's configuration is baked
    # at build time — for the BUNDLE. This is read by the container's nginx, not
    # by the bundle: the stock entrypoint expands a template into
    # `/etc/nginx/conf.d/` when the container starts. One image, one digest,
    # promoted unchanged from mainnet to testnet, which is the rule this estate
    # pins releases by. The image defaults it to `present`, so a host that has
    # never heard of this variable is unaffected — and it must default in the
    # IMAGE rather than here, because envsubst leaves an unset variable in the
    # config verbatim and nginx then refuses to start.
    environment:
      POOL_API_PRESENCE: "${POOL_API_PRESENCE:-present}"
    build:
      context: ../../pool-web
      additional_contexts: *web-contexts
      args: *web-build-args

# ── named volumes ──────────────────────────────────────────────────────────────
#
# The first one in this file, and the reason is worth stating: everything else
# here is deliberately ephemeral — postgres included, so that `down -v` and a
# fresh `up` is always a clean-room run of every migrator. Generated assets are
# the exception. They cost money to make (a FLUX.2-pro call at
# STUDIO_IMAGE_PRICE_USD each) and studio's rows point at them with
# `on delete restrict`, so bytes that vanish on restart leave the database
# referencing files that no longer exist. That is the state the content-addressed
# store is built to avoid.
#
# NOTE FOR ANYONE CLEANING UP: this volume is NOT ephemeral scratch. `docker
# compose down -v` destroys paid artefacts and orphans every `assets` row.
volumes:
  studio-assets:

  # ── custody-keys — THE VOLUME THIS ESTATE HAD NEVER HAD, AND THE DEFECT IT HID ──
  #
  # `custody/Dockerfile:93` says it in capitals: "CUSTODY_DATA_DIR MUST BE A
  # MOUNTED VOLUME, and it must be writable by uid 1000. Nothing else in this
  # image is written to at runtime; that directory holds every key the platform
  # custodies, so a container losing it loses the coins."
  #
  # There was no such volume. custody runs as `node` (uid 1000) against a
  # read-only image layer, so `FileVault.write` fell over on the FIRST WRITE:
  #
  #     EACCES: permission denied, mkdir '/var/lib/custody'
  #       at FileVault.write (custody/src/vault.ts)
  #       at ensureSeed (custody/src/keys.ts)
  #       at provisionAddress (custody/src/keys.ts)
  #
  # `select count(*) from custody_keys` returned **0**. Not "few" — none. **The
  # key service in this estate had never successfully minted a key**, for the
  # whole life of the environment, and every check stayed green because nothing
  # had ever called `POST /v1/addresses`. It surfaced the moment the faucet needed
  # a treasury address of its own, which is the argument for deploying a service
  # rather than reasoning about one, made a second time in one night.
  #
  # WHY IT LOOKED FINE. custody's `/readyz` probes Postgres, not the vault, which
  # is correct — the vault is not a dependency it can usefully report on — and the
  # three "registered custody addresses" the chain-backing section counts are
  # INDEXER LABELS seeded by `scripts/ember-seed.js`, which never asks custody to
  # derive anything. Two facts that both mention custody addresses, neither of
  # which touches the code path that was broken.
  #
  # A NAMED VOLUME, NOT A BIND MOUNT, and the reason is the same one the miner's
  # wallet is kept outside every work tree for: a bind mount would put private key
  # material — encrypted, but key material — inside a git repository, one
  # `.gitignore` edit away from the fork network. A named volume cannot be
  # committed by accident.
  #
  # NOTE FOR ANYONE CLEANING UP: like `studio-assets`, this is NOT ephemeral
  # scratch. `docker compose down -v` destroys every seed in it, and every
  # `custody_keys` row then points at a vault slot that no longer exists — the
  # addresses survive in the database and become permanently unspendable. On a
  # testnet that costs a re-seed; the same command in an environment holding
  # anything real loses the coins, which is what the Dockerfile line above is
  # warning about.
  custody-keys:
