  # ------------------------------------------------------------------ tessera
  #
  # ── THE PORT, AND WHY THIS BLOCK LOOKS DIFFERENT FROM THE TWENTY-ONE ABOVE ──
  #
  # Every other service here binds 4000 (from `x-common-env`) and is mapped to a
  # derived host port. **tessera binds 4022**, and that is not a quirk to
  # normalise — it is the point of the choice, argued at 23-tessera.md §10.1 and
  # again in `tessera/src/env.ts:31-55`.
  #
  # This estate keeps three port spaces and keeps confusing them: the port a
  # service BINDS, the HOST port here (derived, `4100 + index in
  # deployableRepos()`), and micro-ui's `devPort`, which is documented as "not an
  # allocation; it is a fact about a service". Spaces one and two already collide
  # THREE TIMES in repositories that are pushed and green: emberkin binds 4100,
  # which is identity's host port in this very file; aetherholm binds 4120, which
  # is admin-api's; nda binds 4110, which is notify's. Each of those services
  # binds a number this file hands to somebody else.
  #
  # 4022 sits BELOW the derived 4100+ block, so no number of repositories
  # appended to `deployableRepos()` can grow into it. Setting `PORT: "4000"` here
  # would make this container disagree with its own Dockerfile (`EXPOSE 4022`),
  # with `tessera/src/env.ts`, and with the `tessera` row in micro-ui's registry
  # — whose test pins 4022 as "the port the service binds". A pin that is false
  # in the only environment that exists is worse than no pin, so the port stays
  # and the healthcheck moves. That is the whole cost: one extra anchor.
  #
  # ── HOST PORT 4125, AND WHY IT IS NO LONGER 4140 ────────────────────────────
  #
  # This block used to read "micro-org's REGISTRY has no `tessera` or
  # `tessera-web` entry … so no index exists to derive from", and took 4140 and
  # 4141 by hand. THAT IS NO LONGER TRUE. The registry was swept from 46 rows to
  # 70 and now carries both, so both are derived like everything else — and the
  # sweep INSERTED the new rows mid-list rather than appending, which moved
  # sixteen of this file's thirty-nine host ports at once.
  #
  # `tessera` derives to 4125 (index 25), behind `emberkin`, `foresight` and
  # `aetherholm`, which were inserted ahead of it. 4140 now belongs to
  # `aetherholm-web`, so leaving this at 4140 would not have been a stale number
  # — it would have been ANOTHER SERVICE'S number.
  #
  # `tessera-web` derives to 4141, which is exactly what was chosen for it by
  # hand. That agreement is arithmetic coincidence and is worth naming, because
  # it is precisely what makes this class of drift look survivable: two ports
  # were noticed, one of them already matched, and fourteen others were wrong.
  # `scripts/web-check.py` now recomputes ALL of them against the registry.
  #
  # The BIND port below is a different question and is not touched: 4022 stays.
  #
  # ── WHAT IT TALKS TO, AND WHAT IS DELIBERATELY OPTIONAL ─────────────────────
  #
  # `STUDIO_URL`, `LEDGER_URL` and `MARKET_URL` are all optional in
  # `tessera/src/env.ts:168-178`, and their absence is a SUPPORTED mode: the Kiln
  # answers 503 `kiln_unconfigured` rather than 500 and every other route still
  # serves. They are set anyway, because a world whose Kiln is cold in the one
  # environment we can drive is a world whose Kiln has never been driven.
  tessera-migrate:
    <<: *migrate-defaults
    build:
      context: ../../tessera
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # Explicit, and it OVERRIDES the 4000 in `x-common-env` — an explicit key
      # beats a merge key in YAML. The migrator binds nothing, but it loads the
      # same `env.ts`, and a migrator that disagreed with its service about the
      # port would be one more copy of a fact to drift.
      PORT: "4022"
      TESSERA_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/tessera
      # A SECOND variable holding the same value, on purpose. `tessera/src/env.ts:150-160`
      # explains it: outbound signatures and inbound verification are one secret
      # today and stop being one the day the estate moves to per-producer signing
      # keys. A service that read one variable for both would have to be found.
      INSTANCE_ID: tessera-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  tessera:
    <<: *service-defaults
    build:
      context: ../../tessera
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      PORT: "4022"
      TESSERA_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/tessera
      STUDIO_URL: http://studio:4000
      LEDGER_URL: http://ledger:4000
      MARKET_URL: http://market:4000
      # ── A TOKEN, NOT A CREDENTIAL, AND THE NAME IS NOT THE REASON ──────────
      #
      # `estate-bootstrap.sh` writes both kinds and they are NOT interchangeable:
      # `*_IDENTITY_CREDENTIAL` is long-lived and is EXCHANGED at
      # POST /service-tokens/exchange, `*_SERVICE_TOKEN` is a ten-minute JWT that
      # is PRESENTED as a bearer. tessera presents this value directly —
      # `token: async () => env.serviceCredential ?? ''` (tessera/src/index.ts:127),
      # under a header saying "until this service is granted a credential in the
      # deploy, the credential IS the token". So it must be a token. Handing it a
      # long-lived credential secret would produce a Bearer that is not a JWT,
      # and studio would answer 401 to every firing with nothing in either log
      # naming the cause.
      #
      # It is therefore bootstrapped as a TOKEN (`TESSERA_SERVICE_CREDENTIAL` in
      # the CREDENTIALS list), and the ten-minute expiry is real: a firing
      # attempted more than ten minutes after a bootstrap will 401 until the next
      # run. Recorded, not hidden — the fix is micro-tessera adopting
      # `ServiceTokenProvider`, which its own comment already names.
      TESSERA_SERVICE_CREDENTIAL: ${TESSERA_SERVICE_CREDENTIAL:-estate-placeholder-token-0000000000000000}
      INSTANCE_ID: tessera-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}125:4022"
    depends_on:
      tessera-migrate:
        condition: service_completed_successfully
      studio:
        condition: service_healthy
      ledger:
        condition: service_healthy
      market:
        condition: service_healthy
    healthcheck: *healthcheck-4022

  # --------------------------------------------------------------- aetherholm
  #
  # ── THE THIRD FORGE WORLDS TITLE, AND ONE OF FIVE DEPLOYABLES NEVER RUN ─────
  #
  # `deployableRepos()` lists 45 services; this file served 40. The five missing
  # were `aetherholm`, `emberkin`, `foresight`, `beacon` and `faucet`, and
  # `scripts/web-check.py` had been naming them on every run under "registry rows
  # with no container in this compose file". That is correctly not a failure —
  # this file is not obliged to serve every deployable — but three of the five
  # are the BACKENDS OF FRONTENDS THIS ESTATE ALREADY SERVES. `aetherholm-web`
  # has been up on its own hostname with its API absent.
  #
  # ── THE PORT, AND WHY THIS IS *NOT* A SECOND tessera ────────────────────────
  #
  # aetherholm BINDS 4120 by default (`aetherholm/src/env.ts:105`, `.env.example`,
  # `Dockerfile:87`), and 4120 IS ADMIN-API'S HOST PORT IN THIS FILE. The tessera
  # block above argues at length for keeping a service's own bind port and moving
  # the healthcheck instead; that argument turns on 4022 sitting BELOW the derived
  # 4100+ block, where no number of new repositories can ever reach it. 4120 has
  # the opposite property: it is already taken, here, today.
  #
  # So this follows `nda` — which EXPOSEs 4110, another number this file hands to
  # somebody else (notify's host port), and is normalised to 4000 by
  # `x-common-env`. Twenty-one of the twenty-two services in this file bind 4000;
  # tessera is the single argued exception, not the pattern. The container port is
  # 4000 and the HOST port is derived.
  #
  # HOST PORT 4124 IS DERIVED, NOT CHOSEN: index 24 in `deployableRepos()`, via
  # `portFor` (org/tools/cfctl.ts:987). `make check-web` recomputes it.
  #
  # ── WHAT IT IS HANDED, AND WHAT IT DELIBERATELY IS NOT ──────────────────────
  #
  # Its `.env.example` has a closing section headed "not read by this service",
  # and it is load-bearing rather than decorative: phase 1 makes NO outbound HTTP
  # call. The title contract is inbound — worlds calls POST /v1/provision with a
  # credential carrying `aetherholm:provision` — and every background timer is a
  # leased job against its own database. So there is no upstream URL and no
  # service credential here. Rule 9 is not "declare the variables you might want";
  # a variable nothing reads is a secret nothing needed, handed to a container
  # anyway.
  aetherholm-migrate:
    <<: *migrate-defaults
    build:
      context: ../../aetherholm
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      AETHERHOLM_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/aetherholm
      INSTANCE_ID: aetherholm-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  aetherholm:
    <<: *service-defaults
    build:
      context: ../../aetherholm
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      AETHERHOLM_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/aetherholm
      INSTANCE_ID: aetherholm-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}124:4000"
    depends_on:
      aetherholm-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *healthcheck

  # ----------------------------------------------------------------- emberkin
  #
  # The monster-collecting RPG, played through Forge Worlds. `emberkin-web` has
  # been served by this estate with this API absent, exactly as aetherholm was.
  #
  # HOST PORT 4122 IS DERIVED: index 22 in `deployableRepos()`. Its natural bind
  # is 4100 — IDENTITY'S HOST PORT IN THIS FILE — so it is normalised to 4000 for
  # the reason argued in the aetherholm block above.
  #
  # ── EMBERKIN_SERVICE_TOKEN IS A TOKEN AND MUST NOT BE HANDED A CREDENTIAL ───
  #
  # This is the tessera trap again, and it is worth stating per service because
  # the variable NAME is not what settles it. `emberkin/src/index.ts:60` is
  # `const token = (): string => env.serviceToken` — the value is PRESENTED as a
  # bearer, verbatim, with no exchange. So it must be a ten-minute JWT from
  # `POST /service-tokens`, and it is minted in `estate-bootstrap.sh`'s
  # CREDENTIALS list. Handing it `EMBERKIN_IDENTITY_CREDENTIAL` — which section
  # 5b already mints, and which is sitting in `tokens.env` looking like the
  # obvious answer — would send its three upstreams a Bearer that is not a JWT
  # and earn a 401 with nothing in either log naming the cause.
  #
  # The ten-minute expiry is therefore REAL here, and is recorded rather than
  # hidden: this is the same cliff that froze EMBER through `ledger`, and the
  # same remedy applies — micro-emberkin adopting `ServiceTokenProvider` and
  # reading the credential instead. Unlike ledger's, emberkin's calls are on
  # request paths rather than a 900-second timer, so a bootstrap is not
  # guaranteed to outrun it; it fails when a player acts more than ten minutes
  # after one.
  #
  # Its grant is DERIVED and already present: billing:read, ledger:post,
  # worlds:title, from BILLING_SCOPES, LEDGER_SCOPES and WORLDS_SCOPES in its own
  # three client modules. Nothing was typed into the map for it.
  emberkin-migrate:
    <<: *migrate-defaults
    build:
      context: ../../emberkin
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      EMBERKIN_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/emberkin
      # The migrator loads the same `env.ts`, which demands these three URLs and
      # the token before it will construct a config — so they are supplied here
      # too. It dials none of them.
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      WORLDS_URL: http://worlds:4000
      EMBERKIN_SERVICE_TOKEN: ${EMBERKIN_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}
      INSTANCE_ID: emberkin-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  emberkin:
    <<: *service-defaults
    build:
      context: ../../emberkin
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      EMBERKIN_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/emberkin
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      WORLDS_URL: http://worlds:4000
      EMBERKIN_SERVICE_TOKEN: ${EMBERKIN_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}
      INSTANCE_ID: emberkin-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}122:4000"
    depends_on:
      emberkin-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      ledger:
        condition: service_healthy
      billing:
        condition: service_healthy
      worlds:
        condition: service_healthy
    healthcheck: *healthcheck

  # ---------------------------------------------------------------- foresight
  #
  # ── THE LAST OF THE FIVE, AND THE ONE THAT PUTS A CONTRACT ON A CHAIN ───────
  #
  # The aetherholm block above names five deployables this file never served:
  # `aetherholm`, `emberkin`, `foresight`, `beacon`, `faucet`. This is the fifth
  # and last. `foresight-web` and `foresight-admin-web` have both been up on
  # their own hostnames with this API absent since the day they were added, and
  # `foresight-admin` answered 404 to `/ideas` and `/categories` for exactly that
  # reason — the gateway routed them at a service that was not running.
  #
  # ── HOST PORT 4123 IS DERIVED, NOT CHOSEN ───────────────────────────────────
  #
  # Index 23 in `deployableRepos()`, via `portFor` (org/tools/cfctl.ts:987), and
  # re-derived rather than copied from a brief: `node --experimental-strip-types`
  # over `org/tools/registry.ts` prints `4123 foresight` at position 23, between
  # `4122 emberkin` and `4124 aetherholm`. `make check-web` recomputes it.
  #
  # ── THE BIND PORT IS 4021 AND IT IS NOT NORMALISED TO 4000 ──────────────────
  #
  # This was handed to me as "it binds a non-4000 port that collides with existing
  # host pins — follow the `nda` normalisation argued in the aetherholm block".
  # **That is wrong, and checking it is the whole point of the two-case rule the
  # tessera and aetherholm blocks set up between them.** The two cases are told
  # apart by WHICH number a service binds, never by the bare fact that it is not
  # 4000:
  #
  #   * aetherholm binds 4120, which is admin-api's HOST port in this file, and
  #     nda binds 4110, which is notify's. Those numbers are taken, here, today —
  #     so both are normalised to 4000 by `x-common-env`.
  #   * tessera binds 4022, which sits BELOW the derived 4100+ block where no
  #     number of repositories appended to `deployableRepos()` can ever reach it.
  #     So it keeps its port and the healthcheck moves.
  #
  # foresight binds 4021 (`foresight/src/env.ts:316`, `Dockerfile:86 EXPOSE 4021`,
  # and micro-ui's registry row, whose test pins it as "the port the service
  # actually binds"). 4021 is tessera's case exactly — one below 4022, in the same
  # unreachable region — and it collides with nothing: every host pin in this file
  # is 4100–4144. So the port stays and `x-healthcheck-4021` is the one extra
  # anchor it costs, exactly as tessera's did.
  #
  # There is a second, decisive reason not to normalise it, and it is already
  # committed: `gateway/dynamic/public-api.yml:193` sends the public API's
  # `/v1/markets` and `/v1/categories` to `http://foresight:4021`, read off this
  # image's own `EXPOSE`. Setting `PORT: "4000"` here would break the public API
  # surface and put this file in drift with the gateway, which
  # `scripts/surface-routes.py` now fails on.
  #
  # ── FORESIGHT NOW EXCHANGES A CREDENTIAL. THIS BLOCK USED TO SAY THE OPPOSITE ─
  #
  # It was right when written, and it is worth keeping the correction visible
  # rather than swapping the paragraph out. It said `FORESIGHT_SERVICE_TOKEN` is
  # PRESENTED verbatim — `foresight/src/index.ts:101` was `const token = () =>
  # env.serviceToken` handed straight to five HttpClients — so handing it the
  # credential would have sent custody, the indexer, the ledger and policy a
  # Bearer that is not a JWT, earning 401 with nothing in any log naming why.
  #
  # It also named the consequence exactly: **a ten-minute token behind LEASED
  # BACKGROUND JOBS**, which is the shape that froze EMBER through `ledger`. A
  # market approved eleven minutes after a bootstrap sat in `awaiting_funds` with
  # a 401 from custody until somebody re-ran the bootstrap. And it named the fix —
  # "one seam wide, `index.ts:101` is already a function called per request,
  # exactly so that it could become `serviceTokenProvider(...).token`".
  #
  # That is what micro-foresight did. `foresight/src/upstreams.ts:142` builds a
  # real `ServiceTokenProvider`, so **both variables are passed below**: the
  # credential is what it exchanges, and the token remains for the paths that
  # still present one. The service prefers the credential when both are set, and
  # a test pins that precedence — added because the first attempt to break it
  # passed, since nothing had exercised the state this compose file now creates.
  #
  # Live proof rather than inference: `mirror_cursors` held the before and the
  # after in one table — the old container's `last_error` was
  # `GET …/activity → 401`, and the replacement, **13m53s after boot** and well
  # past the 600-second cliff, had `last_error` null with two tokens minted.
  #
  # The `:-` default is empty on purpose. `estate-bootstrap.sh` §5b mints this
  # into `tokens.env`; an unset credential leaves the service on the old token
  # and the cliff returns, which is a failure worth being loud about rather than
  # papering over with a placeholder that looks like a value.
  #
  # ── TWO CUSTODY ADDRESSES, AND WHY NEITHER IS WRITTEN HERE ──────────────────
  #
  # `FORESIGHT_ORACLE_ADDRESS` and `FORESIGHT_TREASURY_ADDRESS` are both required
  # and both must be REAL: `ForesightMarket`'s constructor reverts `BadConstruction`
  # on a zero oracle or a zero treasury, so the placeholders below boot the service
  # and refuse to produce a working market — which is the fail-closed shape the
  # faucet's `FAUCET_FUNDING_ADDRESS` has. Neither can be written into this file,
  # for the reason section 5e already gives: an address does not exist until
  # custody derives it, and custody takes the next BIP-44 index off a seed whose
  # state lives in its own database. `estate-bootstrap.sh` section 5f mints both,
  # reuses them on every later run, and appends them to `tokens.env`.
  #
  # The ORACLE is `purpose: 'deployer'`, which looks wrong and is not.
  # `custody/src/gates.ts:35` has three signable purposes and none of them signs a
  # contract CALL — `transfer` requires empty calldata and says widening it would
  # make the key a signing oracle. So foresight's oracle resolves a market by
  # CREATING a contract (`ForesightResolver`, whose constructor calls `oracleAct`
  # and which then has no runtime code), and the market checks
  # `msg.sender == createAddress(oracle, nonce)`, which is exactly as strong as
  # checking the oracle address itself. Nothing about custody changed.
  #
  # The per-market DEPLOYER addresses are NOT bootstrapped: the service mints one
  # per market itself, idempotently on `(chain, network, userId='foresight',
  # orderId=<market id>)` (`deploy.ts:340`), which is what `custody:address:create`
  # is in its grant for. Each one needs gas before its market can deploy; the
  # service reports that as `awaiting_funds` and logs the exact shortfall rather
  # than burning an attempt.
  #
  # ── WHAT IS DELIBERATELY ABSENT, BECAUSE ABSENT IS A DECLARED MODE ──────────
  #
  # `foresight/src/env.ts` names three groups whose absence its header calls a
  # supported mode rather than an error, and all three stay unset:
  #
  #   * `FORESIGHT_HOUSE_ADDRESS` (21 §5). The house seed address must hold its
  #     own key OUTSIDE this estate's custody — `houseseed.ts` explains that
  #     custody has no transaction shape that can call `stake(uint8)` at all — and
  #     this estate has no such key. So it runs no engagement programme and
  #     `POST /markets/:id/approve` refuses a `houseSeedPerOutcomeWei` plainly,
  #     which is the documented behaviour and not a degradation.
  #   * `FORESIGHT_PROPOSER_*` and `FORESIGHT_SEARCH_*`. No external model or
  #     search adapter is wired here, so the idea pipeline records "no proposals"
  #     and the operator queue stays empty. `index.ts:79` logs
  #     `proposerConfigured: false` at boot so an operator can see which mode they
  #     are in without an error line every six hours.
  #   * `FORESIGHT_MAINNET_ENABLED`. NO LONGER IN THIS GROUP, and the correction
  #     belongs here rather than only where the change is. This bullet used to say
  #     the variable was unset and `FORESIGHT_NETWORK` was `testnet`, so two
  #     deliberate settings stood between this estate and a mainnet. There is a
  #     real EMBER mainnet now — `hearth`, chain 7411 — and on that environment
  #     BOTH settings are made, in `env/chain.mainnet.env`, together, with the
  #     reason written beside them. Still two settings and still deliberate; what
  #     changed is that one environment has deliberately made them.
  #
  # `ADMIN_API_URL` IS set even though it is optional, and that is the one
  # judgement call in this list. It is `admin:read` on the engagement caps, which
  # is unreachable while there is no house address — so by the aetherholm rule
  # ("a variable nothing reads is a secret nothing needed") it could go. It stays
  # because the moment a house address exists this deployment must read caps
  # BEFORE anything moves (21 §8), and because leaving it out would make
  # `admin:read` an unexplained entry in a DERIVED grant map. The token it is
  # handed is the same one, so it is no extra secret.
  #
  # ── FORESIGHT_RPC_URLS IS THE ONE THING WITHOUT WHICH NOTHING REACHES A CHAIN
  #
  # Empty by default, so a chain with no endpoint is refused rather than falling
  # back to a public node nobody chose. `host.docker.internal` and `extra_hosts`
  # for the reason the faucet and indexer blocks give: Docker Desktop resolves it
  # and the Linux daemon does not, and there this service would boot, log
  # `rpcConfigured: false`, serve, and refuse every deploy.
  foresight-migrate:
    <<: *migrate-defaults
    build:
      context: ../../foresight
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # Explicit, and it OVERRIDES the 4000 in `x-common-env` — an explicit key
      # beats a merge key in YAML. tessera's reasoning: the migrator binds
      # nothing, but it loads the same `env.ts`, and a migrator that disagreed
      # with its service about the port would be one more copy of a fact to drift.
      PORT: "4021"
      FORESIGHT_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/foresight
      # Foresight quotes a stake brought in BTC or ETH against EMBER, so it needs
      # pricing. Left OPTIONAL in the service rather than required, deliberately: a
      # missing quote makes non-EMBER staking inert, where a required variable would
      # refuse to boot and take EMBER staking down with it. Wired here so it is not
      # inert. Third service this week to need this line — billing and mint were the
      # others, both found only when something failed.
      PRICING_URL: http://pricing:4000
      # The migrator imports the same `env.ts`, which builds the WHOLE config
      # before it opens a connection — so every required value is supplied here
      # too. It dials none of them and signs nothing.
      CUSTODY_URL: http://custody:4000
      INDEXER_URL: http://indexer:4000
      LEDGER_URL: http://ledger:4000
      POLICY_URL: http://policy:4000
      FORESIGHT_SERVICE_TOKEN: ${FORESIGHT_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}
      FORESIGHT_IDENTITY_CREDENTIAL: ${FORESIGHT_IDENTITY_CREDENTIAL:-}
      FORESIGHT_TREASURY_ADDRESS: ${FORESIGHT_TREASURY_ADDRESS:-0x0000000000000000000000000000000000000000}
      FORESIGHT_ORACLE_ADDRESS: ${FORESIGHT_ORACLE_ADDRESS:-0x0000000000000000000000000000000000000000}
      FORESIGHT_ORACLE_USER_ID: foresight-estate
      FORESIGHT_ORACLE_ORDER_ID: foresight-estate-oracle-1
      INSTANCE_ID: foresight-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  foresight:
    <<: *service-defaults
    build:
      context: ../../foresight
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      PORT: "4021"
      FORESIGHT_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/foresight
      # Foresight quotes a stake brought in BTC or ETH against EMBER, so it needs
      # pricing. Left OPTIONAL in the service rather than required, deliberately: a
      # missing quote makes non-EMBER staking inert, where a required variable would
      # refuse to boot and take EMBER staking down with it. Wired here so it is not
      # inert. Third service this week to need this line — billing and mint were the
      # others, both found only when something failed.
      PRICING_URL: http://pricing:4000
      CUSTODY_URL: http://custody:4000
      INDEXER_URL: http://indexer:4000
      LEDGER_URL: http://ledger:4000
      POLICY_URL: http://policy:4000
      ADMIN_API_URL: http://admin-api:4000
      # A TOKEN, NOT A CREDENTIAL. See the long note above; it is presented
      # verbatim by `index.ts:101` and a `cfsc_…` secret here 401s all five
      # upstreams.
      FORESIGHT_SERVICE_TOKEN: ${FORESIGHT_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}
      FORESIGHT_IDENTITY_CREDENTIAL: ${FORESIGHT_IDENTITY_CREDENTIAL:-}
      # `FORESIGHT_NETWORK` AND `FORESIGHT_MAINNET_ENABLED` ARE IN THE SAME
      # `env_file` AS THE INDEXER'S, AND THAT IS THE POINT.
      #
      # `env.ts:374-379` refuses to boot on `FORESIGHT_NETWORK=mainnet` unless
      # `FORESIGHT_MAINNET_ENABLED=true`, so that a one-word typo cannot put
      # strangers' money on a live chain. That gate is worth keeping and is easy
      # to defeat by accident — the obvious parameterisation here would have been
      # `FORESIGHT_MAINNET_ENABLED: ${…:-false}` beside a `FORESIGHT_NETWORK`
      # derived from `CF_EMBER_NETWORK`, which turns two independent settings
      # into one and removes the whole defence.
      #
      # So NEITHER is written here. Both are stated, per network, in
      # `env/chain.<network>.env` — a committed file whose only subject is which
      # chain this estate is on, where the pair is visible together and turning
      # the gate on is a diff somebody has to read. `foresight` reads the same
      # file as `indexer` so the two cannot name different networks.
      #
      # `chainIdOf(chain, market.network)` (`foresight/src/deploy.ts:421`) is what
      # actually signs, so a `FORESIGHT_NETWORK` disagreeing with the node would
      # produce transactions the node rejects on EIP-155 — silently, at the one
      # moment a market is created.
      FORESIGHT_RPC_URLS: '{"ember":"${EMBER_RPC_URL:-http://host.docker.internal:8545}"}'
      # Minted by estate-bootstrap.sh §5f and reused thereafter. The zero
      # placeholders boot the service and cannot produce a market: the contract's
      # constructor reverts on either.
      FORESIGHT_TREASURY_ADDRESS: ${FORESIGHT_TREASURY_ADDRESS:-0x0000000000000000000000000000000000000000}
      FORESIGHT_ORACLE_ADDRESS: ${FORESIGHT_ORACLE_ADDRESS:-0x0000000000000000000000000000000000000000}
      FORESIGHT_ORACLE_USER_ID: foresight-estate
      FORESIGHT_ORACLE_ORDER_ID: foresight-estate-oracle-1
      INSTANCE_ID: foresight-estate
    env_file:
      - env/chain.${CF_EMBER_NETWORK:-mainnet}.env
      - *outbox-secret-file
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not.
    # Same reason as the `faucet` and `indexer` blocks.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}123:4021"
    depends_on:
      foresight-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      custody:
        condition: service_healthy
      indexer:
        condition: service_healthy
      ledger:
        condition: service_healthy
      policy:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck: *healthcheck-4021

  # ------------------------------------------------------------------- beacon
  #
  # ── THE RELEASE GATE, WHICH HAD NEVER RUN IN ANY ENVIRONMENT ────────────────
  #
  # Synthetic monitoring: journeys, incidents and SLOs. It is the service that
  # answers "does the estate actually work", and it is the one that had never been
  # started — so every judgement about this environment so far has been made
  # without it. HOST PORT 4143 IS DERIVED: index 43 in `deployableRepos()`.
  #
  # ── BEACON_TOKEN IS INBOUND BREAK-GLASS, NOT AN OUTBOUND SERVICE TOKEN ──────
  #
  # A static shared secret, like `ANALYTICS_TOKEN`, and NOT minted by identity.
  # Its own header says why it is checked BEFORE the identity token: "when
  # identity is the thing that has broken, a Beacon that could only be read with
  # an identity token would be a Beacon nobody can read." Minting this from
  # identity would destroy the one property it exists to have.
  #
  # ── BEACON_SERVICE_CREDENTIAL IS A CREDENTIAL, AND THE NAMES DO NOT MATCH ───
  #
  # This is the third variable in this file whose name has to be checked against
  # its USE rather than read (see tessera and emberkin above, in the opposite
  # direction). `beacon/src/ecosystem.ts:549` EXCHANGES it at
  # `POST /service-tokens/exchange` for a `ledger:read` token, so it is the
  # long-lived `cfsc_…` kind — which section 5b of `estate-bootstrap.sh` already
  # mints, under the name `BEACON_IDENTITY_CREDENTIAL`. The deploy is where those
  # two names are joined, and that is exactly what a deploy is for.
  #
  # SUPPLYING IT MAKES THE GATE STRICTER, WHICH IS WHY IT IS SUPPLIED. Without a
  # credential `ecosystemJourneys()` DOES NOT DECLARE the trial-balance journey at
  # all — the repository's own comment draws the line: "absent because it cannot
  # run", which it holds, versus "declared and skipping for ever", which is how a
  # gate gets switched off. An unset credential here would silently buy a smaller
  # suite that still reports green.
  #
  # ── THE SIX TARGETS ARE READ OFF THE JOURNEYS, NOT CHOSEN ───────────────────
  #
  # `ctx.target('…')` across `src/` names exactly six: activity, hub-api,
  # identity, ledger, market, worlds. A target a journey asks for and this list
  # omits is a journey that cannot run, so the list is derived from the call sites
  # the same way the grants map is.
  #
  # `BEACON_BROWSER_EXECUTABLE` is deliberately UNSET: no browser is installed in
  # this image, and its own env.ts documents absent as a supported mode. The
  # browser journeys stay undeclared rather than declared-and-failing.
  #
  # ── OPEN, FOUND BY RUNNING IT: EVERY SLO OBSERVATION IS BEING DROPPED ───────
  #
  # Starting this service surfaced a real gap within one scheduling cycle, which
  # is precisely the argument for deploying the gate rather than reasoning about
  # it. All eleven journeys run and are recorded in `journey_runs`, but every
  # `slo_observations` insert fails:
  #
  #   insert or update on table "slo_observations" violates foreign key
  #   constraint "slo_observations_slo_name_fkey"
  #
  # `jobs.ts:299` records against `journeySloName(name)` = `<journey>.runs`, and
  # `slos` is EMPTY: nothing seeds it. `upsertSlo` has exactly one caller in the
  # repository — `PUT /v1/slos/:name` (server.ts:685, admin-only) — so an SLO is
  # REGISTERED, never derived, and beacon ships no catalogue.
  #
  # It does not crash: `jobs.ts:305` catches and warns, so the service is healthy
  # and the journeys are real. What is lost is every objective and every error
  # budget — the numbers the gate is supposed to gate ON. A green `/readyz` here
  # is worth less than it looks, which is this file's recurring lesson.
  #
  # NOT FIXED HERE, AND THE CHOICE IS DELIBERATE. Registering eleven SLOs from
  # `estate-bootstrap.sh` is defensible — section 5c already argues that WHO
  # RECEIVES WHAT is deploy configuration, and an objective of 99% is written
  # down (13-operational-model.md:437, "99% of scheduled runs pass. A skip counts
  # against it"). But the objective, tier and window of each journey are the
  # GATE'S OWN policy, and inventing eleven of them in a compose repository is
  # how a threshold nobody agreed to becomes the one the estate is judged by.
  # Reported to micro-beacon: either seed the declared journeys' SLOs at boot, or
  # make a missing SLO a startup failure instead of a per-cycle warning. Until
  # then this container runs its journeys and reports no budget.
  beacon-migrate:
    <<: *migrate-defaults
    build:
      context: ../../beacon
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      BEACON_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/beacon
      BEACON_TOKEN: estate-only-beacon-breakglass-000000000
      INSTANCE_ID: beacon-migrate
    depends_on:
      postgres:
        condition: service_healthy

  beacon:
    <<: *service-defaults
    build:
      context: ../../beacon
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      # ── BEACON MUST TRUST THE ESTATE CA, BECAUSE IT PROBES OVER REAL TLS ──────────
      #
      # Probes target the addresses a person uses — `https://hub.<apex>/` — so they
      # traverse DNS, TLS, Traefik routing and the upstream. A probe that skipped the
      # gateway would report healthy while the gateway was broken, which is exactly
      # how a `cf-api-explorer` router that never existed went unnoticed for days.
      #
      # That path is served by the estate's own CA, which nothing inside the estate
      # trusted. Every probe failed `UNABLE_TO_VERIFY_LEAF_SIGNATURE`, opened a SEV3,
      # and the public status page reported a full outage that was not happening.
      #
      # The fix is to TRUST the certificate, never to stop verifying it. Disabling
      # verification here would make beacon blind to a real certificate failure — and
      # the estate has already paid for that once tonight: 183 uses of `curl -k` hid a
      # gateway serving `CN=TRAEFIK DEFAULT CERT` that every browser refused, while
      # every check passed.
      #
      # ── IT IS THE BUNDLE NOW, AND THE MAINNET GATEWAY IS WHY ─────────────────────
      #
      # `trust.crt` is the estate CA plus every public root in `gateway/trust/`,
      # rebuilt by `scripts/gateway-cert.sh`. The mainnet gateway terminates on a
      # Cloudflare Origin CA leaf (`gateway/dynamic/tls.yml`) so that Cloudflare
      # Tunnel stops refusing the origin and answering 502; the testnet gateway
      # still serves the estate leaf, because the origin certificate is one label
      # deep and does not cover `*.testnet.<apex>`. Beacon runs in BOTH projects
      # against BOTH apexes, so `ca.crt` alone would have taken every mainnet probe
      # to `UNABLE_TO_VERIFY_LEAF_SIGNATURE` — the exact outage this block was
      # written for, reintroduced from the other end.
      #
      # The container path is renamed with the file. `/etc/ssl/estate/ca.crt`
      # holding two roots would be a name that lies to the next reader, which is
      # the cost this repository keeps paying for elsewhere.
      NODE_EXTRA_CA_CERTS: /etc/ssl/estate/trust.crt
      BEACON_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/beacon
      BEACON_TOKEN: estate-only-beacon-breakglass-000000000
      # ── `wallet` AND `custody` ADDED 2026-08-04, AND THE ABSENCE WAS NOT NEUTRAL ────
      #
      # `estate.reachable` has named `wallet` in its service list since it was written and
      # had no address for it, so it quietly skipped that target on every cycle — a service
      # the estate runs, that beacon believed it was watching, and was not.
      #
      # `custody` is new here and is what `ecosystem.deposit-address` needs. That journey
      # asks custody directly whether it is holding the key wallet just handed out, which is
      # the assertion no per-service suite can make: `POST /v1/deposits` answered 500 for the
      # whole life of the service because wallet sent no `orderId`, and both suites passed.
      #
      # Compose-network names, not gateway hostnames, exactly like the six beside them.
      # These are SERVICE targets — the browser tier is the only one that must use a real
      # public hostname, because a page derives its API hosts from the one it was loaded from.
      BEACON_TARGETS: identity=http://identity:4000,ledger=http://ledger:4000,market=http://market:4000,worlds=http://worlds:4000,activity=http://activity:4000,hub-api=http://hub-api:4000,wallet=http://wallet:4000,custody=http://custody:4000
      BEACON_SERVICE_CREDENTIAL: ${BEACON_IDENTITY_CREDENTIAL:-}
      # The SSO origin the handoff journey hands off TO. Unset, `identity.handoff`
      # SKIPS rather than guesses an origin — correctly, since a guessed origin would
      # test nothing and report green. That skip was the last open SEV2 and the last
      # skipped critical journey on the release gate.
      BEACON_HANDOFF_ORIGIN: https://hub${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # ── A STATUS PAGE BEHIND A LOGIN IS NOT A STATUS PAGE ────────────────────
      #
      # `BEACON_PUBLIC_STATUS` defaults FALSE (`beacon/src/env.ts:330`) and was set nowhere here,
      # so `GET /api/status/public` ran `authorise(ctx, deps, READ_SCOPE)` first
      # (`beacon/src/server.ts:459`) and answered 401 to the browser that is meant to read it.
      # `status-web` therefore rendered "Not determined — our status service answered with HTTP
      # 404" (404 because the gateway had no route either; both halves are fixed together, and
      # adding only the route would have turned the 404 into a 401, which is not progress).
      #
      # Turning it on is safe because of what the route serves, not because of who reaches it:
      # `beacon/src/publicstatus.ts` PROJECTS the document rather than redacting one, so no target
      # name, no error string, no latency and no journey step name can appear in it — a field it
      # was never told about is a field it cannot leak.
      BEACON_PUBLIC_STATUS: "true"
      INSTANCE_ID: beacon-estate
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}142:4000"
    depends_on:
      beacon-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      ledger:
        condition: service_healthy
      market:
        condition: service_healthy
      worlds:
        condition: service_healthy
      activity:
        condition: service_healthy
      hub-api:
        condition: service_healthy
    healthcheck: *healthcheck

  # ------------------------------------------------------------------ faucet
  #
  # The fourth of the five never-run deployables, and the one that decides
  # whether this testnet is usable by anybody who is not holding the miner's
  # key. Until it is here, "a real EMBER testnet" means a chain the owner can
  # spend on and nobody else can.
  #
  # HOST PORT 4144 IS DERIVED: index 44 in `deployableRepos()`, the last row.
  # Re-derived rather than inherited — `node --import tsx -e "import
  # {deployableRepos} from './tools/registry.ts'; …"` in micro-org prints
  # `4144 faucet ops`, and `make check-web` recomputes it on every run.
  #
  # It BINDS 4013 by default (`faucet/src/env.ts:311`, `Dockerfile:84`), which
  # is not a number this file hands to anybody — but it is normalised to 4000
  # anyway, by `x-common-env`'s `PORT`. That follows `nda` and `aetherholm` and
  # not `tessera`: tessera's 4022 is argued from sitting BELOW the derived 4100+
  # block where no new repository can ever collide with it, and every other
  # service in this file binds 4000 so that ONE healthcheck anchor covers them.
  # A second bind port is a second anchor and a second thing to get wrong.
  #
  # ── CUSTODY_TOKEN IS PRESENTED, NOT EXCHANGED, AND THAT WAS CHECKED ─────────
  #
  # The fourth variable in this file whose authority had to be read out of the
  # source rather than off its name. `faucet/src/index.ts:137` is
  # `token: () => env.custodyToken`, handed straight to `HttpClient`, which sets
  # `authorization: Bearer <that value>` verbatim (`runtime/packages/http/src/
  # index.ts:342`). There is no `ServiceTokenProvider` anywhere in this
  # repository. So the value must be a ten-minute JWT from
  # `POST /service-tokens` — NOT `FAUCET_IDENTITY_CREDENTIAL`, which section 5b
  # of the bootstrap also mints and which is sitting in `tokens.env` looking
  # like the obvious answer. A `cfsc_…` secret here would 401 every signature
  # request with nothing in either log naming the cause.
  #
  # It is fed from `FAUCET_CUSTODY_TOKEN` rather than from a variable called
  # `CUSTODY_TOKEN`: the container's variable is generic, `tokens.env` is one
  # flat file shared by every service, and a bare `CUSTODY_TOKEN=` line there
  # would be a token belonging to one service under a name that reads like it
  # belongs to all of them.
  #
  # THE TEN-MINUTE CLIFF IS REAL HERE AND IS WORSE THAN EMBERKIN'S, because the
  # call site is a TIMER and not a request path. `driveChain` runs on the job
  # queue (`faucet/src/jobs.ts`), so a drip requested more than ten minutes
  # after a bootstrap reaches custody with an expired bearer — the exact shape
  # that froze EMBER reconciliation through ledger. What it costs here is
  # bounded and visible rather than silent: the dispense stays `queued`, the
  # row is retried, and it completes on the next bootstrap. The honest fix
  # belongs to micro-faucet — adopt `ServiceTokenProvider` and read
  # `FAUCET_IDENTITY_CREDENTIAL`, which the bootstrap already mints — and is
  # reported there rather than papered over here.
  #
  # ── THE FUNDING ADDRESS IS MINTED, NOT CHOSEN ──────────────────────────────
  #
  # `custodyclient.ts` is explicit that the faucet must get its OWN
  # treasury-purpose address and must not use custody's PINNED `(ember,
  # testnet)` treasury, which is settlement's: two services on one nonce is how
  # a payment is permanently lost. `POST /v1/addresses` is not idempotent —
  # every call derives a fresh BIP-44 index — so `estate-bootstrap.sh` §5d looks
  # the address up by its `(userId, orderId)` binding on `GET /v1/admin/keys`
  # first and mints only when there is none, then writes
  # `FAUCET_FUNDING_ADDRESS` into `tokens.env` beside the tokens.
  #
  # The default below is the ZERO ADDRESS, and it is a placeholder that boots
  # rather than one that works: `env.ts` validates the SHAPE (0x + 40 hex) and
  # nothing else, so the container starts, serves `/v1/faucet`, and refuses
  # every drip at the balance check. That is the right failure — a faucet that
  # cannot pay says so, and the bootstrap replaces it on its first run.
  #
  # `FAUCET_CUSTODY_ORDER_ID` / `_USER_ID` are the other half of that binding.
  # Custody compares seven identity fields character for character and its 403
  # deliberately does not name which one disagreed (`custody/src/keys.ts:277`),
  # so these cannot be debugged from a response: they are written here, read by
  # the bootstrap from this same file, and never typed twice.
  #
  # ── AND THE CHAIN, WHICH THIS SERVICE WILL NOT LET THE DEPLOY CHOOSE ───────
  #
  # There is NO chain-id variable. `faucet/src/env.ts` reads 7412 from
  # `@cloudsforge/contracts-chain` and exits if `FAUCET_CHAIN_ID` is set to
  # anything else — the frozen `hearth/tools/faucet` compared the node against a
  # variable that DEFAULTED TO 7411, EMBER MAINNET, which verifies agreement
  # rather than identity. So the only chain input here is the RPC URL, and it is
  # the same expression `indexer` uses: `host.docker.internal` plus
  # `extra_hosts`, because hearth is frozen and attaching it to this project's
  # network would mean editing it.
  #
  # ── AND THAT IS WHY BOTH FAUCET SERVICES SIT BEHIND A PROFILE ──────────────
  #
  # `faucet/src/env.ts:63` is `export const NETWORK = 'testnet' as const`, with
  # the annotation chosen so that `NETWORK === 'mainnet'` is a COMPILE ERROR and
  # not a branch. `index.ts:108-120` reads `eth_chainId` at boot and calls
  # `process.exit(1)` on anything that is not 7412. There is no configuration
  # under which this service runs against EMBER mainnet, deliberately: its own
  # header calls a testnet faucet pointed at mainnet "an unauthenticated
  # withdrawal endpoint".
  #
  # So when `CF_EMBER_NETWORK=mainnet` this service must not be started at all.
  # Started anyway it does not degrade — it crash-loops, taking `--wait` with it.
  # Compose has no way to REMOVE a service for one environment, only to add one
  # for a profile, so the profile is on the faucet and `compose/testnet.env` opts
  # in with `COMPOSE_PROFILES=ember-testnet`. The consequence is stated rather
  # than buried: a plain `docker compose -f compose/docker-compose.estate.yml up`
  # now brings up NO FAUCET, because its plain default is the mainnet chain. An
  # estate that wants a faucet is an estate on the testnet chain, and it is
  # brought up with `--env-file compose/testnet.env`, which sets both.
  #
  # `faucet-migrate` carries the same profile: it imports the same `env.ts` and
  # would fail the same check, and a migration run for a service that is not
  # running is a database touched for no reason.
    volumes:
      # Read-only, and only public certificates — never a key. `trust.crt` is a
      # DERIVED file: `scripts/gateway-cert.sh` rebuilds it from `ca.crt` plus
      # `gateway/trust/*.pem` on every run, and `estate-up.sh` runs that before
      # anything here starts. A bind of a file that does not exist yet is created
      # by Docker as a DIRECTORY, and beacon would then fail to start rather than
      # probe unverified — loud, and the right way round.
      - ../gateway/certs/trust.crt:/etc/ssl/estate/trust.crt:ro
  faucet-migrate:
    profiles: ["ember-testnet"]
    <<: *migrate-defaults
    build:
      context: ../../faucet
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      FAUCET_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/faucet
      # The migrator imports the same `env.ts`, which builds the WHOLE config
      # before it opens a connection — so every required value is supplied here
      # too. It dials none of them and signs nothing.
      FAUCET_TOKEN: estate-only-faucet-operator-token-00000
      FAUCET_RPC_URL: ${EMBER_RPC_URL:-http://host.docker.internal:8545}
      CUSTODY_URL: http://custody:4000
      CUSTODY_TOKEN: ${FAUCET_CUSTODY_TOKEN:-estate-placeholder-token-0000000000000000}
      FAUCET_FUNDING_ADDRESS: ${FAUCET_FUNDING_ADDRESS:-0x0000000000000000000000000000000000000000}
      FAUCET_CUSTODY_USER_ID: faucet-estate
      FAUCET_CUSTODY_ORDER_ID: faucet-estate-treasury-1
      INSTANCE_ID: faucet-migrate
    depends_on:
      postgres:
        condition: service_healthy

  faucet:
    # See the long note above `faucet-migrate`: this service cannot run on the
    # EMBER mainnet, by a compile-time constant in its own source.
    profiles: ["ember-testnet"]
    <<: *service-defaults
    build:
      context: ../../faucet
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      FAUCET_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/faucet
      # Inbound, not outbound: the credential Prometheus presents in
      # `x-faucet-token` to read `/metrics`, which publishes the REMAINING
      # BUDGET and is gated for exactly that reason. Never identity-minted —
      # asking identity for it would produce a token that opens nothing, which
      # is the mistake `analytics` was removed from the CREDENTIALS list for.
      FAUCET_TOKEN: estate-only-faucet-operator-token-00000
      FAUCET_RPC_URL: ${EMBER_RPC_URL:-http://host.docker.internal:8545}
      CUSTODY_URL: http://custody:4000
      CUSTODY_TOKEN: ${FAUCET_CUSTODY_TOKEN:-estate-placeholder-token-0000000000000000}
      FAUCET_FUNDING_ADDRESS: ${FAUCET_FUNDING_ADDRESS:-0x0000000000000000000000000000000000000000}
      FAUCET_CUSTODY_USER_ID: faucet-estate
      FAUCET_CUSTODY_ORDER_ID: faucet-estate-treasury-1
      # The browser origin that posts a drip. `faucet` is a SURFACE on the
      # Network site — `subdomain: 'network'`, `basePath: '/faucet'`
      # (`ui/packages/ui/src/surfaces.ts`) — not a host of its own, so the
      # Origin header on a real drip is `https://network.<apex>` and nothing
      # else. The allowlist has no wildcard and fails closed, so naming the
      # wrong host here is a faucet that answers every browser with 403 while
      # every server-side probe stays green.
      FAUCET_CORS_ORIGINS: https://network${CF_WEB_SUFFIX:-.cloudsforge.localtest.me}
      # 60 confirmations is `contracts-chain`'s EMBER depth and is NOT
      # configurable from here. On a laptop chain that is minutes per drip; the
      # dispense is `sent` long before it is `confirmed`, and both states are
      # readable at `GET /v1/drips/:id`.
      INSTANCE_ID: faucet-estate
    # Docker Desktop resolves `host.docker.internal`; the Linux daemon does not,
    # and there the faucet would boot, warn that the node is unreachable, serve
    # anyway, and queue every drip for ever. Same reason as `indexer`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}143:4000"
    depends_on:
      faucet-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      custody:
        condition: service_healthy
    healthcheck: *healthcheck

  # ====================================================== tier 4: the two BFFs
  # ---------------------------------------------------------------- admin-api
  # NOTE: admin-api/src/server.ts returns 501 for bootstrap and identity grants
  # no admin role, so the FIRST ADMIN IS A MANUAL UPDATE. That is deliberate,
  # and `estate-bootstrap.sh` does it as an explicit, named step rather than
  # leaving it as folklore.
  admin-api-migrate:
    <<: *migrate-defaults
    build:
      context: ../../admin-api
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      ADMIN_API_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/admin_api
      IDENTITY_URL: http://identity:4000
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      MARKET_URL: http://market:4000
      ADMIN_API_SERVICE_TOKEN: ${ADMIN_API_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}
      INSTANCE_ID: admin-api-migrate
    env_file: *outbox-secrets
    depends_on:
      postgres:
        condition: service_healthy

  admin-api:
    <<: *service-defaults
    build:
      context: ../../admin-api
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      ADMIN_API_DATABASE_URL: postgres://cloudsforge:estate-only-not-a-real-password@postgres:5432/admin_api
      IDENTITY_URL: http://identity:4000
      LEDGER_URL: http://ledger:4000
      BILLING_URL: http://billing:4000
      MARKET_URL: http://market:4000
      ADMIN_API_SERVICE_TOKEN: ${ADMIN_API_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}
      INSTANCE_ID: admin-api-estate
    env_file: *outbox-secrets
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}120:4000"
    depends_on:
      admin-api-migrate:
        condition: service_completed_successfully
      ledger:
        condition: service_healthy
      billing:
        condition: service_healthy
      market:
        condition: service_healthy
    healthcheck: *healthcheck

  # ------------------------------------------------------------------ hub-api
  # No migrator and no database: it is a BFF that composes other services'
  # answers and owns no state. It holds SIX separate service tokens, one per
  # upstream, rather than one token with the union of the scopes — which is the
  # least-privilege property the scope vocabulary exists to make possible.
  hub-api:
    <<: *service-defaults
    build:
      context: ../../hub-api
      additional_contexts: *build-contexts
    environment:
      <<: [*common-env, *identity-trust]
      IDENTITY_URL: http://identity:4000
      LEDGER_URL: http://ledger:4000
      WALLET_URL: http://wallet:4000
      BILLING_URL: http://billing:4000
      PRICING_URL: http://pricing:4000
      POLICY_URL: http://policy:4000
      ACTIVITY_URL: http://activity:4000
      # ── SIX NARROW TOKENS WERE HERE, AND THEIR ABSENCE IS THE POINT ───────
      # HUB_LEDGER_TOKEN, HUB_WALLET_TOKEN, HUB_BILLING_TOKEN, HUB_PRICING_TOKEN,
      # HUB_POLICY_TOKEN and HUB_ACTIVITY_TOKEN were six separate 10-minute
      # tokens, deliberately narrow — the AD-05 separation, so a process reached
      # by an attacker held six read tokens and not one that could move money.
      # hub-api has RETIRED all six: env.ts keeps them only as
      # `legacyServiceTokenPresent`, a presence check it reports and never obeys.
      # The narrowing did not go away with them; it moved into the exchange,
      # which mints per upstream from the one credential below. Passing them
      # anyway meant this deploy minted six live JWTs nothing would ever present.
      HUB_API_IDENTITY_CREDENTIAL: ${HUB_API_IDENTITY_CREDENTIAL:-}
      INSTANCE_ID: hub-api-estate
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}119:4000"
    depends_on:
      ledger:
        condition: service_healthy
      wallet:
        condition: service_healthy
      billing:
        condition: service_healthy
      pricing:
        condition: service_healthy
      policy:
        condition: service_healthy
      activity:
        condition: service_healthy
    healthcheck: *healthcheck

  # ══════════════════════════════════════════ tier 5: the sixteen frontends ════
  #
  # ── WHY THEY ARE HERE ─────────────────────────────────────────────────────────
  #
  # Until this section, this file defined 22 domain services and NOT ONE FRONTEND
  # CONTAINER, and `docs/ecosystem/22-browser-journeys.md` §8.7 named that as the
  # blocker it is: 318 browser scenarios are specified, 86 of them are tier T3 and
  # need the estate, and *none of them could run* because nothing in the estate
  # served a bundle. A T3 harness was being built in micro-beacon against an
  # environment that could not host it.
  #
  # ── THE HOST PORTS ARE DERIVED, LIKE EVERY OTHER PORT HERE ────────────────────
  #
  # 4100 + the repository's index in micro-org's registry — the same `portFor`
  # rule the 21 services above obey (org/tools/cfctl.ts:868, over
  # `deployableRepos()` in org/tools/registry.ts:134). Read out of the registry
  # rather than typed:
  #
  #   node --import tsx -e "import {deployableRepos} from './tools/registry.ts'; \
  #     deployableRepos().forEach((r,i)=>console.log(4100+i, r.name))"   # in micro-org
  #
  # ── THERE ARE NO LONGER ANY CHOSEN PORTS IN THIS FILE ─────────────────────────
  #
  # This block used to say four surfaces — `foresight-web`, `foresight-admin-web`,
  # `emberkin-web`, `aetherholm-web` — were ABSENT FROM THE REGISTRY and so took
  # 4136-4139 by hand, "THE ONLY CHOSEN PORTS IN THIS FILE". micro-org's registry
  # has since been swept from 46 rows to 70 and carries all four, plus `tessera`,
  # `tessera-web` and the three services behind those surfaces. Every host port
  # here is now derived. Nothing in this file is chosen.
  #
  # THE SWEEP MOVED SIXTEEN OF THEM, and this is the part worth remembering: the
  # new rows went in MID-LIST rather than appended — four services ahead of the
  # frontend block, five frontends ahead of ops. The port IS the index, so every
  # row below an insertion moved. The eleven original frontends each slid +4
  # (hub-web 4122 → 4126). `tessera` went 4140 → 4125. The four surfaces above
  # were reordered among themselves. `tessera-web` stayed on 4141 by arithmetic
  # coincidence — which is exactly why individual numbers must never be adopted
  # one at a time: a spot-check of the two ports somebody noticed would have
  # found one already correct and left fourteen wrong.
  #
  # ── THE GUARD, WHICH FOR A LONG TIME DID NOT EXIST ────────────────────────────
  #
  # These lines used to end: "`scripts/web-check.py` fails when this file and the
  # registry disagree, so the drift cannot be silent." THAT SCRIPT DID NOT EXIST.
  # `scripts/` held nine files and none of them was it. The estate's signature
  # defect — a check that cannot fail — in its purest form: one that could not
  # even run, asserted in a comment directly above the thing it claimed to guard.
  # The drift was, in fact, silent, and it stayed silent through a 24-row sweep.
  #
  # The script is now written, and the claim is true rather than aspirational. It
  # executes micro-org's registry rather than parsing it — a regex over
  # `registry.ts` would be a second private copy of the list whose drift is the
  # bug — checks all 39 pins here AND the ports `scripts/estate-verify.sh` drives,
  # and refuses to skip: if micro-org cannot be reached it reports failure rather
  # than a success it did not establish. Run it with `make check-web`.
  #
  # ── WHAT A GREEN HEALTHCHECK HERE IS WORTH ────────────────────────────────────
  #
  # Nothing on its own. See the note on `x-web-defaults`. The proof is in
  # `scripts/estate-verify.sh`.

  # -------------------------------------------------------------- hub-web (hub)
  # THE MOST LOAD-BEARING FRONTEND IN THE ESTATE, for a reason that is not its own
  # feature set: it serves the SIGN-IN SURFACE. `signInRedirect()` sends every
  # product's signed-out visitor to `${accountUrl()}/login`, and the `signin`
  # registry row resolves that to `hub.<apex>/account`
  # (ui/packages/ui/src/surfaces.ts, the `signin` entry). Nothing served that
  # address in any environment, which is why docs/ecosystem/22 §8.1 calls it the
  # largest blocker in the catalogue. Bringing this container up is what closes
  # the environment's half of it.
  hub-web:
    <<: *web-defaults
    build:
      context: ../../hub-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}126:8080"

  # ------------------------------------------------------------- site (apex)
  # The apex. It has no subdomain in the registry, which is why the gateway routes
  # it on the bare apex host rather than on `site.<apex>`.
  site:
    <<: *web-defaults
    build:
      context: ../../site
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}127:8080"

  # --------------------------------------------------------- admin-web (admin)
  admin-web:
    <<: *web-defaults
    build:
      context: ../../admin-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}128:8080"

  # --------------------------------------------------------- mint-web (create)
  # `create.<apex>`, not `mint.`: the repository is micro-mint-web and the surface
  # is Forge Create. The registry's subdomain is the address; the repository name
  # is not. The CORS allowlist in gateway/dynamic/policy.yml still names
  # `mint.cloudsforge.online`, which is a separate defect recorded there.
  mint-web:
    <<: *web-defaults
    build:
      context: ../../mint-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}129:8080"

  # --------------------------------------------------------- trade-web (trade)
  trade-web:
    <<: *web-defaults
    build:
      context: ../../trade-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}130:8080"

  # ------------------------------------------------------- worlds-web (worlds)
  worlds-web:
    <<: *web-defaults
    build:
      context: ../../worlds-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}131:8080"

  # --------------------------------------------------- explorer-web (explorer)
  explorer-web:
    <<: *web-defaults
    build:
      context: ../../explorer-web
      additional_contexts: *web-contexts
      args: *web-build-args
    ports:
      - "127.0.0.1:${CF_PORT_BASE:-4}132:8080"

  # ------------------------------------------------------ network-site (network)
  network-site:
