      lantern-migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck

  # ------------------------------------------ the world-art mount, VALIDATED ──
  #
  # ── WHY A HALF-POPULATED MOUNT IS THE DANGEROUS CASE, AND THE ONLY ONE ────────
  #
  # `micro-tessera-assets`' `materialise.py` already refuses an incomplete set:
  # it resolves all 392 entries before writing a byte, names every gap, and
  # materialises NOTHING on a miss — because "a directory that is mostly Qwen and
  # quietly partly FLUX" makes every judgement about the art a judgement about a
  # blend nobody chose. THAT GUARANTEE ENDS AT THE DIRECTORY. Nothing downstream
  # re-checks it, and a mount is trivially easy to get half right: a copy
  # interrupted, a subdirectory excluded, a path pointed one level too deep.
  #
  # And the symptom is the worst kind. `tessera-web/src/lib/sprites.ts` has NO
  # FALLBACK SPRITE by design — a missing sprite is "a visible hole with a name,
  # not a substitute" — so a 90%-populated mount renders a world with holes while
  # nginx answers 200 on everything it does have and every healthcheck in this
  # file stays green. That is exactly the shape of `STUDIO_ASSET_ROOT` being
  # unset, which EACCES'd every generation while the container reported healthy
  # and nothing in the service probed the directory it exists to write.
  #
  # So the mount is asserted before tessera-web serves, and there are three
  # states rather than two:
  #
  #   empty     no SET.json and no PNG. The documented default: no art here, the
  #             location 404s, the bundle expects it. PASSES, loudly.
  #   complete  SET.json present AND the PNG count equals its own
  #             `materialisedCount`. PASSES.
  #   anything  a receipt without its files, files without a receipt, or a count
  #   else      that disagrees. FAILS, and tessera-web does not start.
  #
  # The count is compared against the RECEIPT the writer left, not against a
  # number typed here. A literal 392 in this file would be a second copy of a
  # fact micro-tessera-assets owns, and it would be wrong the first time a set
  # gains an asset — which is the drift this estate has already paid for twice.
  tessera-assets-check:
    image: busybox:1.37
    restart: "no"
    volumes:
      - ${CF_WORLD_ASSETS:-./estate/world-assets}:/world-assets:ro
    # `sh -c`, single-quoted in YAML so `$` reaches the shell rather than compose.
    # busybox has no jq: `materialisedCount` is read with grep -o, which is
    # sufficient for a number this file did not write and does not parse further.
    command:
      - sh
      - -c
      - |
        set -e
        pngs=$$(find /world-assets -name '*.png' | wc -l)
        if [ -f /world-assets/SET.json ]; then
          want=$$(grep -o '"materialisedCount"[^0-9]*[0-9]*' /world-assets/SET.json | grep -o '[0-9]*$$')
          if [ -z "$$want" ]; then
            echo "FATAL: /world-assets/SET.json has no materialisedCount." >&2
            echo "       It was not written by materialise.py, so nothing can say what a" >&2
            echo "       complete mount is. Re-run: python3 materialise.py --provider <id> --into <dir>" >&2
            exit 1
          fi
          if [ "$$pngs" != "$$want" ]; then
            echo "FATAL: the world-art mount is HALF POPULATED." >&2
            echo "       SET.json says $$want file(s) were materialised; the mount holds $$pngs." >&2
            echo "       tessera-web has no fallback sprite, so serving this renders a world with" >&2
            echo "       holes while every healthcheck stays green. Refusing to start." >&2
            exit 1
          fi
          set_id=$$(grep -o '"provider"[^,]*' /world-assets/SET.json | head -1)
          echo "world art: $$pngs file(s), $$set_id — complete against its own receipt"
          exit 0
        fi
        if [ "$$pngs" != 0 ]; then
          echo "FATAL: /world-assets holds $$pngs PNG(s) and NO SET.json." >&2
          echo "       Nothing records which asset set this is, and nothing can check it is" >&2
          echo "       whole. The sets are deliberately the same shapes in the same colours," >&2
          echo "       so 'which model is this?' is not answerable by eye. Materialise it:" >&2
          echo "         python3 materialise.py --provider <id> --into <dir>   # micro-tessera-assets" >&2
          exit 1
        fi
        echo "world art: none mounted. /world-assets/ will 404, which is the supported default."
        echo "           To serve a set:  CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh"
        exit 0

# ── named volumes ──────────────────────────────────────────────────────────────
#
# The first one in this file, and the reason is worth stating: everything else
# here is deliberately ephemeral — postgres included, so that `down -v` and a
# fresh `up` is always a clean-room run of every migrator. Generated assets are
# the exception. They cost money to make (a FLUX.2-pro call at
# STUDIO_IMAGE_PRICE_USD each) and studio's rows point at them with
# `on delete restrict`, so bytes that vanish on restart leave the database
# referencing files that no longer exist. That is the state the content-addressed
# store is built to avoid.
#
# NOTE FOR ANYONE CLEANING UP: this volume is NOT ephemeral scratch. `docker
# compose down -v` destroys paid artefacts and orphans every `assets` row.
volumes:
  studio-assets:

  # ── custody-keys — THE VOLUME THIS ESTATE HAD NEVER HAD, AND THE DEFECT IT HID ──
  #
  # `custody/Dockerfile:93` says it in capitals: "CUSTODY_DATA_DIR MUST BE A
  # MOUNTED VOLUME, and it must be writable by uid 1000. Nothing else in this
  # image is written to at runtime; that directory holds every key the platform
  # custodies, so a container losing it loses the coins."
  #
  # There was no such volume. custody runs as `node` (uid 1000) against a
  # read-only image layer, so `FileVault.write` fell over on the FIRST WRITE:
  #
  #     EACCES: permission denied, mkdir '/var/lib/custody'
  #       at FileVault.write (custody/src/vault.ts:72)
  #       at ensureSeed (custody/src/keys.ts:213)
  #       at provisionAddress (custody/src/keys.ts:122)
  #
  # `select count(*) from custody_keys` returned **0**. Not "few" — none. **The
  # key service in this estate had never successfully minted a key**, for the
  # whole life of the environment, and every check stayed green because nothing
  # had ever called `POST /v1/addresses`. It surfaced the moment the faucet needed
  # a treasury address of its own, which is the argument for deploying a service
  # rather than reasoning about one, made a second time in one night.
  #
  # WHY IT LOOKED FINE. custody's `/readyz` probes Postgres, not the vault, which
  # is correct — the vault is not a dependency it can usefully report on — and the
  # three "registered custody addresses" the chain-backing section counts are
  # INDEXER LABELS seeded by `scripts/ember-seed.js`, which never asks custody to
  # derive anything. Two facts that both mention custody addresses, neither of
  # which touches the code path that was broken.
  #
  # A NAMED VOLUME, NOT A BIND MOUNT, and the reason is the same one the miner's
  # wallet is kept outside every work tree for: a bind mount would put private key
  # material — encrypted, but key material — inside a git repository, one
  # `.gitignore` edit away from the fork network. A named volume cannot be
  # committed by accident.
  #
  # NOTE FOR ANYONE CLEANING UP: like `studio-assets`, this is NOT ephemeral
  # scratch. `docker compose down -v` destroys every seed in it, and every
  # `custody_keys` row then points at a vault slot that no longer exists — the
  # addresses survive in the database and become permanently unspendable. On a
  # testnet that costs a re-seed; the same command in an environment holding
  # anything real loses the coins, which is what the Dockerfile line above is
  # warning about.
  custody-keys:
