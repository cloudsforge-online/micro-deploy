# ONE MINER PER NETWORK, ALWAYS ON. The server used to seed only; it now also
# mines, because a chain with no miner produces no blocks — so confirmations
# never accumulate, the indexer has nothing to follow and reconciliation has
# nothing to read. The owner mining intermittently from a Mac and a PC does not
# keep an always-on ecosystem moving.
#
#   cd deploy && docker compose -p cf-miners -f compose/docker-compose.miners.yml up -d
#
# ── THESE ARE LIGHT MINERS, NOT NODES ────────────────────────────────────────
#
# `bin/hearth-mine.js` holds no chain and opens no port: it GETs
# /mining/template?pub=<65-byte uncompressed secp256k1 key>, grinds, and POSTs
# /mining/submit. That is why one image and no volumes beyond a key file is the
# whole deployment. Running `hearthd --mine` instead would mean a second full
# copy of each chain on the same host for no benefit — and on this box the two
# upstream miner services took the load average to 37, which is the reason
# `docker-compose.hearth-seed.yml` exists to keep them down.
#
# ── WHY THEY GO THROUGH THE GATEWAY RATHER THAN STRAIGHT TO THE SEED ──────────
#
# Each miner could talk to its seed directly on loopback. It goes through the
# public HTTPS path instead, with `--cacert` semantics supplied by
# NODE_EXTRA_CA_CERTS, so that an always-on process continuously exercises the
# exact route a remote miner uses. A gateway, certificate or router regression
# then shows up as blocks stopping, rather than being discovered the next time
# the owner opens a laptop. `--add-host` is required because the apexes are real
# public names that must resolve to this host's loopback, not to the internet.
#
# ── AND THAT IS WHY BOTH MOUNT `trust.crt` AND NOT `ca.crt` ───────────────────
#
# The design above is load-bearing here and cuts both ways: the mainnet miner
# verifies the MAINNET gateway's certificate on every poll, and that gateway now
# terminates on a Cloudflare Origin CA leaf rather than the estate leaf, so that
# Cloudflare Tunnel stops refusing the origin and answering 502 (see
# `gateway/dynamic/tls.yml`). Left on `ca.crt`, `cf-miner-mainnet` would have
# stopped producing blocks the moment that certificate changed — a live chain
# halted by a TLS edit, reported as nothing at all until somebody looked at the
# height.
#
# `trust.crt` is `ca.crt` plus every public root in `gateway/trust/`, rebuilt by
# `scripts/gateway-cert.sh`. The testnet miner keeps working unchanged for the
# same reason: the testnet gateway still serves the estate leaf, which is in the
# bundle. NODE_EXTRA_CA_CERTS is read ONCE at startup, so a change to this file
# needs `docker compose … up -d` and not just a file rewrite.
#
# ── THE KEY IS THE POINT, AND IT IS NOT OPTIONAL ─────────────────────────────
#
# Under the account model the coinbase must SIGN the block, so there is no
# "mine to this address" mode: `bin/hearthd.js` refuses `--miner-address`
# with `--evm` in those words. So the miner genuinely needs the PRIVATE key,
# not the address — it signs the winning proof, which is what stops the RPC
# endpoint it polls from simply keeping the block. Whoever holds that key holds
# the coins; nothing here ever prints it, and `session.js` is written so a
# private key cannot reach an event a front-end renders.
#
# ── AND IT IS NO LONGER IN THE CLEAR. cloudsforge-online/micro-org#206 ────────
#
# It was. Until 2026-08-11 both miners here read `<data>/coinbase-key.json`, a
# 240-byte JSON file holding the key as a plain hex string, bind-mounted
# READ-WRITE into a container whose whole job is to talk to the internet. The
# mainnet one pays `0x980d…5b45`, which had earned five figures of EMBER.
#
# Now they read `<data>/coinbase-keystore.json` — the same key under scrypt +
# AES-256-GCM (`hearth/node/src/mine/keystore.js`) — with the passphrase
# supplied as a FILE, not an environment string. Three things had to be true
# together and all three are set below:
#
#   HEARTH_COINBASE_SOURCE: keystore   pins the source. Without it `coinbase.js`
#                                      walks its four candidates in order and
#                                      would silently fall back to the plaintext
#                                      file, which is the failure that looks
#                                      exactly like success.
#   HEARTH_COINBASE_PASSPHRASE_FILE    a path, not HEARTH_COINBASE_PASSPHRASE:
#                                      an env string is readable by anything that
#                                      can read this process's environment, and
#                                      `docker inspect` is one of those things.
#   HEARTH_COINBASE_ADDRESS            public, and load-bearing. It is what turns
#                                      a mis-mounted volume into a REFUSAL rather
#                                      than a miner quietly paying somebody else.
#
# The data mount is `:ro`. A miner never needs to write its sealed key, and a
# container that cannot write the directory cannot destroy the key either.
#
# THE PLAINTEXT FILE IS STILL THERE, ON PURPOSE, and this is the one step left.
# `hearth minerkey seal` deliberately does not delete it: removing somebody's
# only copy of a funded key on their behalf is not a tidiness worth the risk.
# It comes out only after a keystore+passphrase pair has been RESTORED FROM a
# backup on a different machine — see `hearth/docs/mining-key-custody.md` §4
# Step 3. Until that rehearsal happens this file is the mitigation and not yet
# the fix, and saying otherwise would be the kind of claim that gets believed.
#
# The app host's miner (`docker-compose.miners-apphost.yml`) reached this shape
# first, on 2026-08-10, and has no plaintext file at all. This block is that
# configuration brought across, which is why the two now read alike.
#
# ── THE THROTTLE IS A BUDGET, NOT A PERFORMANCE SETTING ──────────────────────
#
# 0.25 of one core each. These exist to keep blocks flowing, not to compete for
# them: at the current target one core finds a block every few seconds, so a
# quarter core is already far more than the chain needs, and the estate keeps
# the rest of a 4-core box. Raise it only with a measurement, not a hunch.
#
# ── THE IMAGE IS PINNED BY COMMIT, AND THE CODE IS NOT BIND-MOUNTED ──────────
#
# Both miners ran the fix as a read-only bind mount of the hearth checkout over
# `/hearth-node`, layered on a locally-built seed image. That worked and was the
# right way to get a stall fixed on a live box — but it meant the running code
# was whatever happened to be in a directory on one machine. Rebuild the image,
# recreate from it without the mount, or lose the checkout, and the miners
# silently go back to re-testing the same nonces for ever.
#
# So the image is `hearth-node` at the exact commit that carries the fix, and the
# entrypoint is the copy INSIDE it. The tag is a `sha-` and not `main` on
# purpose: `main` moves, and a miner that follows a moving tag changes behaviour
# on a restart nobody asked for. To take a newer build, change this line — which
# is a review, not a surprise.
#
# 0cf1445 — "carry the nonce across a re-fetch, or the miner stops for good" —
# was that commit until 2026-08-11, and it predated `hearth minerkey` and
# `src/coinbase.js`'s four key sources entirely: a 0cf1445 miner CANNOT open a
# keystore, so the pin and the custody change below had to move together.
#
# fcc2738 is hearth `main` as of 2026-08-11 and adds, beyond the keystore:
#   · 938a073  a block is stamped when its nonce was FOUND, not when the search
#              began — the candidate was memoized per tip, so every block on this
#              chain recorded the instant its parent landed and the whole
#              timestamp series ran one block late. That is difficulty input.
#   · faa5dde  the chain replays outside the EvmNode constructor and the node
#              REFUSES until it is done (micro-org#349)
#   · 4a5e150  an expired or evicted template is 409, not 400
services:
  miner-mainnet:
    image: ghcr.io/cloudsforge-online/hearth-node:sha-fcc2738c3ca6931fbbbe58b2be4db0931bbda748
    container_name: cf-miner-mainnet
    entrypoint: ["node", "/app/bin/hearth-mine.js"]
    command:
      - "--url"
      - "https://rpc.cloudsforge.online"
      - "--data"
      - "/minerdata"
      # `hearth` — CHAIN 7411 — because this is the mainnet environment's miner.
      # It said `hearth-testnet` while the mainnet seed also said `hearth-testnet`,
      # which is how both environments came to be chain 7412 at once.
      #
      # HONEST ABOUT WHAT THIS FLAG DOES: `bin/hearth-mine.js` puts it in
      # `HEARTH_NETWORK` and `params.js` resolves the id from it, but the only
      # consumer in this process is the banner at `hearth-mine.js` — the light
      # miner holds no chain, and the header it grinds comes from the node's
      # `/mining/template`. So this line does not by itself decide which chain is
      # mined; `docker-compose.hearth-seed.yml` does. It is corrected anyway,
      # because a status line that names the wrong chain is how the wrong chain
      # goes unnoticed, and because an unregistered value is a hard error at
      # startup (`params.js`) — which makes this flag a cheap assertion that
      # somebody thought about which network this miner is on.
      - "--network"
      - "hearth"
      - "--throttle"
      - "0.25"
      - "--status-ms"
      - "60000"
    network_mode: host
    # ── NO extra_hosts, NO TRUST MOUNT: THIS GOES OUT THROUGH CLOUDFLARE ───────
    #
    # `rpc.cloudsforge.online` used to be pinned to 127.0.0.1 here and verified
    # against a mounted `trust.crt`, so the miner reached the gateway's TLS port
    # directly and never left the box. All three of those — the pin, the mount and
    # the private trust store — existed only to make that shortcut work.
    #
    # It resolves PUBLICLY now: DNS -> Cloudflare -> the tunnel -> this host's
    # gateway over plain HTTP on 127.0.0.1. The certificate presented is
    # Cloudflare's own, which the base image's trust store already carries, so
    # `NODE_EXTRA_CA_CERTS` has nothing left to add.
    #
    # WHAT THIS BUYS BEYOND FEWER LINES: the miner now exercises the SAME path a
    # third-party miner has to use. The loopback shortcut meant this estate's own
    # miner could keep producing blocks while `rpc.<apex>` was completely broken
    # for everyone else — which is exactly the state the tunnel was in.
    #
    # AND WHAT IT COSTS, SAID OUT LOUD: mining now depends on the tunnel. If the
    # tunnel's ingress is wrong, these stop. That is the correct dependency —
    # a public endpoint that only the local miner can reach is not a public
    # endpoint — but it is a real one, and it is why the Cloudflare dashboard
    # entries must be pointing at the plaintext origin before these are recreated.
    environment:
      HEARTH_NO_TTY: "1"
      HEARTH_COINBASE_SOURCE: keystore
      HEARTH_COINBASE_PASSPHRASE_FILE: /run/secrets/coinbase-passphrase
      # Public — an address is not a credential. Pinned so that a wrong mount is
      # a refusal at startup rather than a miner paying an address nobody owns.
      HEARTH_COINBASE_ADDRESS: "0x980d52a868d41a34a186ce890874c8e547975b45"
    volumes:
      - ${CF_MINER_KEYS:-/home/malf/dev/cloudsforge/miner-keys}/mainnet:/minerdata:ro
      # The passphrase is a SEPARATE mount from a SEPARATE directory, not a file
      # inside the keys dir. On one host that is not true separation of media and
      # this file will not pretend it is — but it does mean the mount that carries
      # the sealed key does not also carry the thing that opens it, so a single
      # over-broad bind or a backup of the keys directory is not game over.
      - ${CF_MINER_SECRETS:-/home/malf/secrets}/ember-coinbase-mainnet.pass:/run/secrets/coinbase-passphrase:ro
    restart: unless-stopped

  miner-testnet:
    image: ghcr.io/cloudsforge-online/hearth-node:sha-fcc2738c3ca6931fbbbe58b2be4db0931bbda748
    container_name: cf-miner-testnet
    entrypoint: ["node", "/app/bin/hearth-mine.js"]
    command:
      # NO PORT. 10443 was the testnet gateway's LOCAL bind (compose/testnet.env),
      # reachable only through the `extra_hosts` pin that is now gone. Publicly
      # this host is behind Cloudflare on 443 like every other name in the estate.
      #
      # ── THE NAME CHANGED ON 2026-08-05, AND IT IS THE REASON THIS COULD NOT
      #    HAVE WORKED BEFORE ────────────────────────────────────────────────
      #
      # It was `rpc.testnet.cloudsforge.online`, which is TWO LABELS under the
      # zone. Cloudflare's Universal SSL is `*.cloudsforge.online` and a wildcard
      # matches ONE label, so that hostname failed the TLS handshake at
      # Cloudflare's edge — measured, not predicted: `curl` returns exit 35 and
      # `ssl_verify_result 1` against it from the public internet. Recreating this
      # container from the file as it stood would therefore have stopped testnet
      # mining outright, while the file said the opposite in the paragraph above.
      #
      # ── AND THE PUBLIC FORM IS NOT REACHABLE YET, SO THIS IS THE LOOPBACK ──
      #
      # `--url https://rpc-testnet.cloudsforge.online` — no port, no pin, out
      # through Cloudflare like the mainnet miner above claims to be — is the
      # TARGET, and it cannot be used until `rpc-testnet.cloudsforge.online` is a
      # hostname in the Cloudflare tunnel. Adding it is a manual dashboard step
      # that only the owner can take, so until they have, this reaches the testnet
      # gateway across loopback on its own port (10443, `compose/testnet.env`).
      #
      # ── WHY THIS BLOCK NOW MATCHES WHAT IS RUNNING, AND DID NOT BEFORE ─────
      #
      # Measured on 2026-08-05: the live `cf-miner-testnet` had been created from
      # an older revision of this file and was on
      # `https://rpc.testnet.cloudsforge.online:10443` with an `extra_hosts` pin
      # and `NODE_EXTRA_CA_CERTS=/trust.crt`. The live `cf-miner-mainnet` is the
      # same shape on its own name. So the paragraph above — "the loopback
      # shortcut is now gone", "mining now depends on the tunnel" — was true of
      # this file and false of the estate, and had been for as long as neither
      # container was recreated. That divergence is what made the rename
      # dangerous: retiring `rpc.testnet.cloudsforge.online` at the gateway
      # stopped the testnet miner within a minute, and nothing in this file
      # predicted it because this file did not describe the miner that was
      # running.
      #
      # So the committed form is the running form again. THE LAST STEP OF THE
      # RENAME IS TO DELETE THE PORT AND THE `extra_hosts` BELOW, once the owner
      # has added the tunnel hostnames — at which point the argument in the
      # mainnet block above becomes true of both miners for the first time, and
      # that block should be corrected in the same commit rather than left as an
      # aspiration for a third time.
      - "--url"
      - "https://rpc-testnet.cloudsforge.online:10443"
      - "--data"
      - "/minerdata"
      - "--network"
      - "hearth-testnet"
      - "--throttle"
      - "0.25"
      - "--status-ms"
      - "60000"
    network_mode: host
    # The two lines the loopback path needs, and neither survives the move to the
    # tunnel: the pin, because 10443 is bound to 127.0.0.1 only and no DNS answer
    # points there; and the estate CA, because the certificate on that port is
    # `estate.crt` rather than Cloudflare's. `gateway/certs/trust.crt` is the CA
    # bundle `scripts/gateway-cert.sh` writes for exactly this kind of consumer.
    extra_hosts:
      - "rpc-testnet.cloudsforge.online:127.0.0.1"
    environment:
      HEARTH_NO_TTY: "1"
      NODE_EXTRA_CA_CERTS: /trust.crt
      HEARTH_COINBASE_SOURCE: keystore
      HEARTH_COINBASE_PASSPHRASE_FILE: /run/secrets/coinbase-passphrase
      # Testnet's own coinbase, and a DIFFERENT address from mainnet's. Sealed on
      # 2026-08-11 in the same pass. Public, and pinned for the same reason.
      HEARTH_COINBASE_ADDRESS: "0x91a11854b364178ed96054d8a6e9be1dbd751d33"
    volumes:
      - ${CF_CERT_DIR:-/home/malf/dev/cloudsforge/deploy/gateway/certs}/trust.crt:/trust.crt:ro
      - ${CF_MINER_KEYS:-/home/malf/dev/cloudsforge/miner-keys}/testnet:/minerdata:ro
      - ${CF_MINER_SECRETS:-/home/malf/secrets}/ember-coinbase-testnet.pass:/run/secrets/coinbase-passphrase:ro
    restart: unless-stopped
