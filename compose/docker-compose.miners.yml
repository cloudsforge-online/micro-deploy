# ONE MINER PER NETWORK, ALWAYS ON. The server used to seed only; it now also
# mines, because a chain with no miner produces no blocks — so confirmations
# never accumulate, the indexer has nothing to follow and reconciliation has
# nothing to read. The owner mining intermittently from a Mac and a PC does not
# keep an always-on ecosystem moving.
#
#   cd deploy && docker compose -p cf-miners -f compose/docker-compose.miners.yml up -d
#
# ── THESE ARE LIGHT MINERS, NOT NODES ────────────────────────────────────────
#
# `bin/hearth-mine.js` holds no chain and opens no port: it GETs
# /mining/template?pub=<65-byte uncompressed secp256k1 key>, grinds, and POSTs
# /mining/submit. That is why one image and no volumes beyond a key file is the
# whole deployment. Running `hearthd --mine` instead would mean a second full
# copy of each chain on the same host for no benefit — and on this box the two
# upstream miner services took the load average to 37, which is the reason
# `docker-compose.hearth-seed.yml` exists to keep them down.
#
# ── WHY THEY GO THROUGH THE GATEWAY RATHER THAN STRAIGHT TO THE SEED ──────────
#
# Each miner could talk to its seed directly on loopback. It goes through the
# public HTTPS path instead, with `--cacert` semantics supplied by
# NODE_EXTRA_CA_CERTS, so that an always-on process continuously exercises the
# exact route a remote miner uses. A gateway, certificate or router regression
# then shows up as blocks stopping, rather than being discovered the next time
# the owner opens a laptop. `--add-host` is required because the apexes are real
# public names that must resolve to this host's loopback, not to the internet.
#
# ── THE trust.crt MOUNT IS NOW INERT, AND IT IS KEPT ON PURPOSE ──────────────
#
# This paragraph used to explain that the mainnet miner had to mount `trust.crt`
# rather than `ca.crt` because the mainnet gateway terminated on a Cloudflare
# Origin CA leaf. It does not any more: that leaf never solved the 502 it was
# installed for — cloudflared validates against the hostname in its service URL,
# which is `127.0.0.1`, and no Origin CA will ever sign an IP literal — so the
# gateway now terminates no TLS at all and both miners poll it over `http`.
#
# There is therefore NO CERTIFICATE ON THIS PATH TO VERIFY, and NODE_EXTRA_CA_CERTS
# below verifies nothing. It is left in place, with the mount, for one reason: it
# makes `CF_MINER_RPC_URL` a COMPLETE switch. A deployment that terminates TLS
# points that variable back at `https://` and needs to change nothing else, which
# is worth more than the tidiness of deleting two inert lines — the failure this
# file's header describes is a chain that stops silently, and a half-configured
# way back to TLS is exactly how that happens.
#
# NODE_EXTRA_CA_CERTS is read ONCE at startup, so a change here needs
# `docker compose … up -d` and not just a file rewrite.
#
# ── THE KEY IS THE POINT, AND IT IS NOT OPTIONAL ─────────────────────────────
#
# Under the account model the coinbase must SIGN the block, so there is no
# "mine to this address" mode: `bin/hearthd.js:75-79` refuses `--miner-address`
# with `--evm` in those words. Each miner therefore holds its own key at
# <data>/coinbase-key.json, in a directory outside the repository. Whoever holds
# that file holds the coins; nothing here ever prints it, and `session.js` is
# written so a private key cannot reach an event a front-end renders.
#
# ── THE THROTTLE IS A BUDGET, NOT A PERFORMANCE SETTING ──────────────────────
#
# 0.25 of one core each. These exist to keep blocks flowing, not to compete for
# them: at the current target one core finds a block every few seconds, so a
# quarter core is already far more than the chain needs, and the estate keeps
# the rest of a 4-core box. Raise it only with a measurement, not a hunch.
#
# ── THE IMAGE IS PINNED BY COMMIT, AND THE CODE IS NOT BIND-MOUNTED ──────────
#
# Both miners ran the fix as a read-only bind mount of the hearth checkout over
# `/hearth-node`, layered on a locally-built seed image. That worked and was the
# right way to get a stall fixed on a live box — but it meant the running code
# was whatever happened to be in a directory on one machine. Rebuild the image,
# recreate from it without the mount, or lose the checkout, and the miners
# silently go back to re-testing the same nonces for ever.
#
# So the image is `hearth-node` at the exact commit that carries the fix, and the
# entrypoint is the copy INSIDE it. The tag is a `sha-` and not `main` on
# purpose: `main` moves, and a miner that follows a moving tag changes behaviour
# on a restart nobody asked for. To take a newer build, change this line — which
# is a review, not a surprise.
#
# 0cf1445 — "carry the nonce across a re-fetch, or the miner stops for good".
services:
  miner-mainnet:
    image: ghcr.io/cloudsforge-online/hearth-node:sha-0cf14451d0e6b1e3dbd8587a3ca2e3e3050a8095
    container_name: cf-miner-mainnet
    entrypoint: ["node", "/app/bin/hearth-mine.js"]
    command:
      - "--url"
      # ── `http`, AND WITHOUT IT THIS CHAIN STOPS ──────────────────────────────
      #
      # The gateway on this box terminates no TLS (`CF_GATEWAY_TLS=false`), so an
      # `https://` poll here would fail every four seconds and the miner would
      # produce nothing. That is the single most expensive consequence of the
      # transport change, and it is invisible in the way this file's header warns
      # about: nothing errors loudly, the height just stops moving.
      #
      # The PORT is now explicit because the scheme no longer implies it — `http`
      # defaults to 80 and the gateway's browser port is 443, still bound to
      # 127.0.0.1 and reached through the `extra_hosts` entry below.
      #
      # THE REASON FOR GOING THROUGH THE GATEWAY IS UNCHANGED and is the whole
      # point of the header above: this still drives the real router table, the
      # real `rpc.<apex>` host rule and the real upstream, so a routing regression
      # still shows up as blocks stopping. What it no longer exercises is a TLS
      # handshake, because there no longer is one to exercise — the public leg is
      # Cloudflare's and cannot be driven from this host at all.
      #
      # A deployment that does terminate TLS sets `CF_MINER_RPC_URL` back to
      # `https://rpc.<apex>`; the CA mount below is deliberately left in place so
      # that variable is the only thing such a deployment has to change.
      - "${CF_MINER_RPC_URL:-http://rpc.cloudsforge.online:443}"
      - "--data"
      - "/minerdata"
      # `hearth` — CHAIN 7411 — because this is the mainnet environment's miner.
      # It said `hearth-testnet` while the mainnet seed also said `hearth-testnet`,
      # which is how both environments came to be chain 7412 at once.
      #
      # HONEST ABOUT WHAT THIS FLAG DOES: `bin/hearth-mine.js:123` puts it in
      # `HEARTH_NETWORK` and `params.js` resolves the id from it, but the only
      # consumer in this process is the banner at `hearth-mine.js:197` — the light
      # miner holds no chain, and the header it grinds comes from the node's
      # `/mining/template`. So this line does not by itself decide which chain is
      # mined; `docker-compose.hearth-seed.yml` does. It is corrected anyway,
      # because a status line that names the wrong chain is how the wrong chain
      # goes unnoticed, and because an unregistered value is a hard error at
      # startup (`params.js:52-58`) — which makes this flag a cheap assertion that
      # somebody thought about which network this miner is on.
      - "--network"
      - "hearth"
      - "--throttle"
      - "0.25"
      - "--status-ms"
      - "60000"
    network_mode: host
    extra_hosts:
      - "rpc.cloudsforge.online:127.0.0.1"
    environment:
      NODE_EXTRA_CA_CERTS: /trust.crt
      HEARTH_NO_TTY: "1"
    volumes:
      - ${CF_CERTS_DIR:-/home/malf/dev/cloudsforge/deploy/gateway/certs}/trust.crt:/trust.crt:ro
      - ${CF_MINER_KEYS:-/home/malf/dev/cloudsforge/miner-keys}/mainnet:/minerdata
    restart: unless-stopped

  miner-testnet:
    image: ghcr.io/cloudsforge-online/hearth-node:sha-0cf14451d0e6b1e3dbd8587a3ca2e3e3050a8095
    container_name: cf-miner-testnet
    entrypoint: ["node", "/app/bin/hearth-mine.js"]
    command:
      # Port 10443 is the testnet gateway's browser port (compose/testnet.env),
      # and `http` for the reason given on the mainnet miner above: that gateway
      # terminates no TLS either, and an https:// poll here would silently stop
      # this chain rather than fail loudly.
      - "--url"
      - "${CF_MINER_RPC_URL_TESTNET:-http://rpc.testnet.cloudsforge.online:10443}"
      - "--data"
      - "/minerdata"
      - "--network"
      - "hearth-testnet"
      - "--throttle"
      - "0.25"
      - "--status-ms"
      - "60000"
    network_mode: host
    extra_hosts:
      - "rpc.testnet.cloudsforge.online:127.0.0.1"
    environment:
      NODE_EXTRA_CA_CERTS: /trust.crt
      HEARTH_NO_TTY: "1"
    volumes:
      - ${CF_CERTS_DIR:-/home/malf/dev/cloudsforge/deploy/gateway/certs}/trust.crt:/trust.crt:ro
      - ${CF_MINER_KEYS:-/home/malf/dev/cloudsforge/miner-keys}/testnet:/minerdata
    restart: unless-stopped
