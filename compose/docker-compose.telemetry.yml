# CloudsForge telemetry plane — AD-20.
#
# A PARALLEL stack. It shares no port, no volume and no container name with the
# eighteen-container estate in ../../../docker-compose.yml, which keeps running
# untouched while this comes up beside it. Port allocation and the reasoning are
# in ../README.md.
#
#   docker compose -f compose/docker-compose.telemetry.yml up -d
#
# Every image is pinned to a released tag. The estate has exactly one floating
# base image (`nginx:alpine` on cv-web) and it is recorded as a known risk; a
# telemetry plane that silently changes underneath an incident is worse than no
# telemetry plane, because you will not believe it.

# Applied to every container here, matching the estate's x-svc anchor: survive a
# host reboot, and cap the json-file driver so telemetry cannot fill the disk it
# shares with Postgres. Losing Postgres because Loki grew is the exact failure
# mode a monitor must never cause.
x-obs: &obs
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ------------------------------------------------------------- collector ---
  # The only component that knows where telemetry goes. Services speak OTLP to
  # this and nothing else, which is what makes adopting a commercial APM later a
  # change to one exporter block rather than a re-instrumentation of 38 repos.
  otel-collector:
    <<: *obs
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/collector.yaml"]
    env_file:
      # Per-service env file, never the estate's 64-variable fan-out. The
      # collector needs three variables; it receives three.
      - env/otel-collector.env
    volumes:
      - ../otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "127.0.0.1:9317:4317"   # OTLP gRPC  — services
      - "127.0.0.1:9318:4318"   # OTLP HTTP  — browsers, via the gateway
      - "127.0.0.1:9098:13133"  # health_check extension
      - "127.0.0.1:9099:8889"   # Prometheus exposition of collector-received metrics
    healthcheck:
      # The health_check extension answers 200 only once every pipeline has
      # started. `depends_on: service_healthy` downstream is therefore a real
      # ordering guarantee and not a liveness guess.
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks: [app, edge]

  # ------------------------------------------------------------ prometheus ---
  prometheus:
    <<: *obs
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d raw. The justification and what "400d downsampled" actually costs
      # are in ../README.md — it is not a Prometheus flag.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      # Exemplars are the AD-20 requirement that a p99 spike links to a slow
      # trace. Off by default in Prometheus; nothing else turns it on.
      - --enable-feature=exemplar-storage
      # Tempo's metrics_generator remote-writes span metrics and service graphs
      # here. Without this flag that write 404s silently and the upstream-call
      # latency panels are empty for a reason nothing reports.
      - --web.enable-remote-write-receiver
      - --web.external-url=http://localhost:9090
    env_file:
      - env/prometheus.env
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      # file_sd target lists. Generated from the release manifest (AD-03), not
      # hand-edited, and reloaded without a restart.
      - ../prometheus/targets:/etc/prometheus/targets:ro
      # Scrape credentials, never in the committed config. See README §Secrets.
      - ../prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    # ── HOW THREE LIVE SCRAPE CREDENTIALS STOP BEING WORLD-READABLE ───────────
    #
    # `../prometheus/secrets/` holds the Beacon, analytics and lantern tokens.
    # They were mode 644 — readable by every account on the host — and the
    # reason written into ../up.sh was not laziness: this image runs as `nobody`
    # (uid 65534, gid 65534, measured with `docker exec cfmicro-prometheus-1 id`
    # on 2026-08-09 and again on 2026-08-10), the files are written by the
    # operator (uid 1000), and 600 therefore means unreadable BY THE PROCESS
    # THAT NEEDS THEM. Setting a token then produced the same dead scrape as not
    # setting one, with `unable to read headers file` in the log.
    #
    # A supplementary group is what closes that without root and without moving
    # the files out of the operator's ownership: the container process keeps its
    # own uid and gains gid 1000, so `-rw-r----- malf malf` is readable inside
    # and unreadable to any other account outside. `chmod 600` was the wrong
    # tool for a permission problem that was about a GROUP.
    #
    # The alternative — `chown 65534` on the host — was rejected because it
    # needs root on every deploy AND takes write access away from the operator
    # and from up.sh, which rewrites these files. This needs neither.
    #
    # Measured after the change on 2026-08-10, mainnet: files 640 malf:malf,
    # `/api/v1/targets` 37 active / 37 up / 0 down, beacon, analytics and lantern
    # all `up`. micro-org#340.
    group_add:
      - "${CF_SECRETS_GID:-1000}"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      alertmanager:
        condition: service_healthy
    networks:
      app: {}
      # Prometheus, and only Prometheus, joins the existing estate's network so
      # it can scrape Beacon at `beacon:4011`. Joining a network does not modify
      # it; the estate's compose file is untouched and unaware. This is what
      # makes "adopting a scraper costs a scrape config" finally true.
      estate: {}

  # ------------------------------------------------------------------ tempo ---
  tempo:
    <<: *obs
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    env_file:
      - env/tempo.env
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:9094:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [app]

  # ------------------------------------------------------------------- loki ---
  loki:
    <<: *obs
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    env_file:
      - env/loki.env
    user: "0:0"
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:9092:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [app]

  # ----------------------------------------------------------- alertmanager ---
  alertmanager:
    <<: *obs
    # ── v0.28.1 AND NOT v0.27.0, BECAUSE v0.27.0 CRASHES ON A 4xx ─────────────
    #
    # prometheus/alertmanager#3798: a `webhook_configs` entry configured with
    # `url_file` rather than `url` dereferences a nil `conf.URL` when it builds
    # the retry-failure message, so ANY non-2xx response from that webhook is a
    # segfault. Fixed by #3800, merged 2024-04-12, and there is no v0.27.1 — the
    # first release carrying it is v0.28.0.
    #
    # Both delivery receivers here (`page`, `ticket`) use `url_file`, because a
    # webhook URL is a credential and belongs in a file rather than in a config
    # that ends up in backups and screenshots. So the estate's entire alert
    # delivery path was one 4xx away from a crash loop.
    #
    # Measured on 2026-08-09, on mainnet, and not from the changelog: correcting
    # Beacon's incident URL from the port nothing binds (4011) to the port it
    # listens on (4000) turned a `connection refused` — a transport error, which
    # never reaches the retrier — into a `401`, and Alertmanager panicked on
    # every alert notification thereafter, three times in three minutes:
    #
    #   panic: runtime error: invalid memory address or nil pointer dereference
    #   notify/webhook.New.func1  /app/notify/webhook/webhook.go:60
    #   notify.(*Retrier).Check   /app/notify/util.go:239
    #
    # This bug could not be found while nothing was ever delivered, which is the
    # same reason micro-org#308 lasted as long as it did. `amtool check-config`
    # on v0.28.1 accepts this configuration unchanged.
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    env_file:
      - env/alertmanager.env
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Receiver URLs, written by ../up.sh from ../.env. Never committed.
      - ../alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    # The same supplementary group, for the same reason and against the same
    # measured uid — see the long note on prometheus above. This directory holds
    # Beacon's token a second time (`authorization.credentials_file`, because
    # Alertmanager cannot send an arbitrary header) plus the two delivery
    # webhook URLs, and a webhook URL is a credential. micro-org#340.
    group_add:
      - "${CF_SECRETS_GID:-1000}"
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      app: {}
      # Alertmanager must reach Beacon's incident receiver: an alert opens a
      # Beacon incident rather than inventing a second incident system.
      estate: {}

  # ---------------------------------------------------------------- grafana ---
  grafana:
    <<: *obs
    image: grafana/grafana:11.4.0
    env_file:
      - env/grafana.env
    environment:
      # The one credential this stack holds. It is NOT in a committed file: it
      # comes from ../.env (gitignored, made from ../.env.example).
      #
      # `:?` RATHER THAN A DEFAULT, since 2026-08-09. The default used to be the
      # literal `local-dev-only`, defended here on two grounds — that it made
      # `docker compose config` work on a clean checkout, and that every port in
      # this file is bound to 127.0.0.1 so the operator plane is not public.
      # Both are true and neither is the point. A committed default IS the
      # password on any host where nobody set the variable, and this file cannot
      # see whether anybody did; loopback binding decides who can reach the
      # login form, not what the password is. The estate learned that argument
      # the expensive way with the administrator account (micro-org#276), where
      # "a throwaway operator for a throwaway environment" is exactly the
      # reasoning that put a real credential in a public repository.
      #
      # So the render now FAILS when it is unset, which is the same treatment
      # `docker-compose.estate.yml` already gives CF_POSTGRES_PASSWORD, and for
      # the same reason: a stack that comes up with a credential nobody chose is
      # worse than one that refuses to come up. Nothing in CI renders this file,
      # so the clean-checkout argument costs a person one line in ../.env and
      # buys back a password that only exists where someone typed it.
      GF_SECURITY_ADMIN_PASSWORD: ${CF_GRAFANA_ADMIN_PASSWORD:?set it in ../.env (see ../.env.example); there is deliberately no default, because a default is the password on every host that did not set one}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:9091:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks: [app, edge]

# AD-17's three networks. `app` is where services talk to each other, `edge` is
# the gateway's side, `vault` holds custody, ledger and settlement.
#
# The isolation is structural, not a rule: a container attached only to `vault`
# has no route to a container attached only to `app`, so "custody is unreachable
# from app" is a property of the topology rather than of a firewall somebody has
# to remember to write. `vault` is additionally `internal`, so nothing on it can
# reach the internet — custody has no business making an outbound call.
#
# Nothing in THIS file sits on `vault`; it is declared here so that the gateway
# overlay and the eventual service overlays attach to networks that already
# exist with the right properties, rather than each inventing their own.
#
# ── THESE FOUR NAMES WERE LITERALS, AND THAT MADE THE OVERLAY A FICTION ───────
#
# `compose/testnet.env` says a second environment is "six variables, no second
# copy of anything", and names `CF_NET_PREFIX` as the one that moves the three
# shared networks. THIS FILE IGNORED IT. It was also, at the time, the file that
# OWNED them — that ownership has since moved to `scripts/ensure-networks.sh`,
# which interpolates the same variable — and gateway.yml has interpolated
# `${CF_NET_PREFIX:-cf-micro}` all along. So the consumer was parameterised and
# the producer was not: setting
# `CF_NET_PREFIX=cf-testnet` made the testnet gateway ask for `cf-testnet-edge`
# and `cf-testnet-app`, and left the only file that could create them building
# `cf-micro-*` regardless. Measured before this change — `CF_NET_PREFIX=cf-testnet
# CF_PROJECT=cf-testnet docker compose -f docker-compose.telemetry.yml config`
# emitted `cf-micro-app`, `cf-micro-edge` and `stack_default`, byte-identical to
# the unset run.
#
# UNSET STILL RENDERS EXACTLY AS BEFORE for the three prefixed names, which is
# the property testnet.env claims for the whole mechanism and which is verified
# for this file by `docker compose config` diff, not assumed.
#
# ── `estate` IS A DIFFERENT BUG IN THE SAME BLOCK, AND IT IS NOT A NO-OP ──────
#
# It said `stack_default`: the network of the LEGACY `stack` project, which is
# deliberately stopped. The live estate is `cloudsforge-estate_default`, and
# `docker-compose.gateway.yml` already derives it as
# `${CF_PROJECT:-cloudsforge-estate}_default`. Today the trio is brought up
# together and gateway.yml is merged LAST, so its correct value silently wins and
# the wrong one here is invisible. Bring THIS FILE up on its own — which is what
# the header invites — and Prometheus attaches to a stopped project's network and
# scrapes nothing, while reporting itself healthy.
#
# So this line changes behaviour on purpose, and only in the case that was
# already broken.
# ── ALL FOUR ARE EXTERNAL, AND THE THREE cf-micro-* ONES DID NOT USED TO BE ───
#
# This file used to declare `edge`, `app` and `vault` as networks it CREATES,
# and `docker-compose.gateway.yml` declares the same three as `external: true`.
# Every header in this directory recorded the discipline that followed from
# that: telemetry first, in its own invocation, because compose merges the
# top-level `networks:` map across `-f` files last-wins, so passing both files in
# one command turned the creator into an attacher.
#
# On 2026-08-10 that model was measured against the host and it is not what is
# running. All three networks exist with NO labels at all —
# `docker network inspect cf-micro-app --format '{{json .Labels}}'` returns `{}` —
# so they were created by hand, not by this file, and compose refuses to adopt
# them:
#
#   network cf-micro-app was found but has incorrect label
#   com.docker.compose.network set to "" (expected: "app")
#
# That is FATAL, not a warning. Which means every invocation this repository
# documents as "telemetry first, on its own" — `./up.sh` with no arguments, and
# step 3a of `scripts/estate-up.sh` — has been dead on this host for as long as
# the networks have existed, and nobody noticed because the only invocations that
# ever ran were the merged ones, where the gateway file's `external: true` won
# the merge and compose attached instead of creating.
#
# `cf-micro-vault` proved the same point a second way: this file declared it
# `internal: true`, and the live network had `Internal=false`. A declaration that
# nothing enforces is a comment.
#
# So the ownership moves OUT of compose, to `scripts/ensure-networks.sh`, which
# both bring-up paths call. Three consequences, all of them wanted:
#
#   - the last-wins merge hazard is GONE. Every file that mentions these networks
#     now declares them external, so no ordering discipline is required and none
#     can be forgotten.
#   - the networks outlive `docker compose down`, which is correct: the gateway
#     lives in a different project and is attached to two of them.
#   - if they are missing, compose fails HERE, naming the network, instead of
#     silently building a second one under a different name.
networks:
  edge:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-edge
  app:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-app
  vault:
    external: true
    name: ${CF_NET_PREFIX:-cf-micro}-vault
  estate:
    # The running estate. `external` means compose attaches to it and never
    # creates, modifies or removes it.
    external: true
    name: ${CF_PROJECT:-cloudsforge-estate}_default

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
  alertmanager-data:
