# -- 2.5.3, ON TESTNET ONLY ----------------------------------------------------
#
# Applied as a THIRD overlay after `docker-compose.release.yml`, and only for the
# testnet project. The release overlay is shared by both estates, so editing its
# pins would have put an unreviewed rewrite in front of mainnet users -- which is
# the opposite of what a branch is for.
#
# To take it away, drop the `-f compose/docker-compose.design.yml` and redeploy.
# Nothing else changes, because nothing else was touched.
#
# A TAG HERE MUST DIFFER FROM THE ONE ON main. `worlds-web` sat at 1.0.1 in this
# file while main was also 1.0.1, so its branch build published nothing -- GHCR
# tags are immutable -- and testnet served the old bundle behind a green run and
# a successful deploy. Nothing compares merged code to running code, so the
# version is the deploy unit: bump it or ship nothing.
#
# -- ONE VERSION, THE WHOLE ESTATE ---------------------------------------------
#
# The 1.x edition of this file pinned seventeen frontends at eleven different
# versions and said nothing at all about the twenty-nine services underneath
# them, which carried twenty-odd more between them. So "which release is this box
# on?" had thirty answers and not one of them was the estate.
#
# It is 2.5.3 for all seventy-four containers. Anything on this estate NOT
# reading 2.5.3 is visibly not this release, and that is checkable with one
# `docker ps` rather than with a spreadsheet.
#
# THE RULE THIS COMES FROM, IN THE OWNER'S WORDS: "from now on all container
# services will be on the same version, if you do a change to one, you will
# update the version to be the same to all, and then deploy them." One changed
# line in one service means forty-six version bumps and forty-six deploys. It is
# written up in `deploy/docs/releasing.md`, with the reasoning.
#
# -- WHAT 2.1.x CARRIES --------------------------------------------------------
#
# 2.0.0 was the site rewrite: every tile, paragraph, button and product
# description, browser mining back on the site, the previous wording gone.
#
# 2.1.0 is the second pass over that copy, and it is a minor rather than a major
# because it changes what the same pages say, not what they are. Engineering
# provenance had been rendered AT CUSTOMERS -- repository paths, HTTP routes and
# status codes printed inside sentences meant for people who will never open the
# repository. Those are gone from the consumer surfaces and the claims they
# supported are kept, in the reader's words, with the provenance moved into
# source comments where the next maintainer will actually look for it. API
# vocabulary stays on devportal-web and on the operator consoles (admin, beacon,
# lantern), because there the reader is the person the route name is for.
#
# Also in this tag: meta descriptions brought under 160 characters across the
# estate, four page headings that named a noun instead of making a promise, and
# one 404 screen that had no heading of any level for a screen reader to find.
#
# The services underneath carry no behaviour change at this tag. They are here so
# that the version names the estate rather than the half of it a reader can see.
#
# -- WHERE THESE IMAGES CAME FROM ----------------------------------------------
#
# All seventy-four, forty-six distinct images, are in GHCR, so `docker compose
# pull` is the right command here.
#
# At 2.0.0 the frontends had been built on this host from each repository's
# `sitev2` branch and pushed by hand, because CI builds `main` and
# `design-system/**` and nothing else. That is no longer true and it is worth
# saying why it changed: `publish-image.yml` checks out `micro-ui` with no `ref:`
# and therefore always at its default branch, so a frontend built from a side
# branch would have silently linked against ui@main's older surface registry --
# a hand-built image that does not match its own sources. All eighteen sitev2
# branches were fast-forwarded into main instead, and every image at this tag was
# published by its own repository's CI on a green push to main, which is the
# designed path (the `publish` job, gated on `github.ref == refs/heads/main`).
#
# Mainnet is unaffected by that merge. It does not deploy from main; it deploys
# from a pinned release manifest that still names 1.x, which is also why this
# overlay is still testnet-only.
#
# Three repositories missed the 2.1.0 publish -- aetherholm-web, devportal-web
# and explorer-web -- each on a differently-broken "Estate rules" gate rather
# than on anything in their code. Written up in micro-org#239 and fixed at
# source rather than skipped. 2.1.1 published 46 of 46 on the first attempt.
#
# -- WHAT 2.1.1 ADDS OVER 2.1.0 ------------------------------------------------
#
# 2.1.0 was checked the way the four attempts before it were: by asserting about
# the source. 2.1.1 was checked by opening all seventeen surfaces in Chromium and
# reading what came back, and that found six things no source check could see.
# Tessera's front door had no heading of any level -- a stranger got one cryptic
# sentence and a screen reader got an empty heading list. Five meta descriptions
# were longer than a search result will show, network at 240 characters. Four
# paragraphs told the reader what the page used to say. Three headings named a
# noun instead of saying what the page does. All fixed at this tag.
#
# Also measured in the browser here, not inferred: 64 internal links PRESSED
# rather than fetched, every one landing on a page with exactly one h1 and real
# content; the consent banner on all seventeen surfaces with the analytics tag
# NOT loaded until it is answered; no console error and no failed request
# anywhere; and no repository path, route or status code left in any sentence on
# a consumer surface -- the only remaining ones are on developers, where the
# reader is the person a route name is for.
#
# -- WHAT 2.2.0 ADDS OVER 2.1.1 ------------------------------------------------
#
# 2.1.1 was checked by opening every surface and pressing sixty-four links, and
# every one of them was reported as landing correctly. The owner then pressed the
# same links on this estate and reported that most of them "take you to the
# ecosystem page". Both observations were true, and the gap between them is the
# whole of this tag.
#
# React Router does not reset the scroll position when the address changes, and
# no frontend here did it either -- searching all seventeen for ScrollRestoration
# or a scrollTo call found nothing anywhere. So a link pressed part-way down a
# page opened the next page at that same offset. On the marketing site that is
# severe, because every page there ends with the same grid of all the products:
# pressing a product tile two thousand pixels down the home page landed the
# reader on that product's page, scrolled to the grid of every OTHER product,
# which is exactly what the ecosystem page looks like.
#
# It was invisible to the 2.1.1 check because that harness pressed links and
# asserted the destination had one h1 and real content -- a correctly routed,
# wrongly scrolled page passes that. Measured before fixing: /products/trade
# clicked from the home page went from scrollY 1965 to 1466, with "The rest of
# it", "Products" and "This site" on screen and its own h1 far above the fold.
# Written up in micro-org#240.
#
# The fix is components/scroll-to-top.tsx in each of the seventeen frontends,
# mounted inside BrowserRouter. It leaves POP alone so back and forward still
# restore where the reader was, honours a #hash so in-page anchors keep working,
# and scrolls instantly rather than smoothly, because animating a page change
# makes every click feel slow. It is a per-app file rather than a @cloudsforge/ui
# export on purpose: ui is consumed as `link:` and carries its own router copy in
# its own node_modules, so a router hook imported from inside the package reads a
# different context and throws -- the same trap test-loader.ts exists to solve
# for React. That was tried first and reverted; twelve duplicated lines beat
# adding a router to resolve.dedupe in seventeen vite configs.
#
# Also at this tag, and the reason the site's own version matters here: the
# owner read the home, ecosystem, platform and about pages back line by line and
# named thirteen sentences that do not survive being read once. They were written
# at the architecture rather than at a person -- explaining why a section sits
# where it does, denying a design nobody had proposed, arguing about what the
# word "platform" means, and naming the same four nouns twice in consecutive
# sentences. All rewritten. One was not a style fault but a factual one: the site
# said Hearth "runs the Ethereum virtual machine", when what is here is an
# Ethereum-compatible machine written in Node. That both borrowed a guarantee
# that is not ours and hid the thing that was actually built, and it now says so.
#
# The six product tiles say what a person does there in one line each, and the
# blurbs behind them are the surface registry's, so they are the same six lines
# wherever any surface renders a tile.
#
# The services underneath carry no behaviour change at this tag. They are here so
# the version names the estate rather than the half of it a reader can see.
#
# -- WHAT 2.5.3 ADDS OVER 2.5.2 ------------------------------------------------
#
# Three services change -- `micro-indexer`, `micro-wallet`, `micro-settlement` --
# and nothing a visitor sees. It is step 4 of the chain-solvency invariant
# (docs/ecosystem/35), micro-org#252: a UTXO custody balance becomes something
# this estate can OBSERVE rather than assume.
#
# It matters because of how the freeze is wired. An asset absent from the
# tolerance map gets ZERO tolerance, and only an exactly-clean OBSERVED run lifts
# a freeze -- so an asset nobody can observe can never be unfrozen. LTC could not
# be added to LEDGER_RECONCILE_ASSETS at all until this tag; adding it would have
# frozen Litecoin withdrawals permanently, with the chain perfectly solvent.
#
# A UTXO chain has no `eth_getBalance` and stock Core keeps no address index, so
# the indexer derives the balance from the outputs it walked: credits with no
# matching spend, both bounded by the measurement height (head - confirmations
# + 1). The obvious `in - out` is wrong and measurably so -- the bitcoin follower
# records a spend unconditionally but writes the outbound movement only when the
# prevout resolves, and on this estate's own ltc:mainnet record that gap is 1,372
# movements against 853,960 spends.
#
# A derivation is only a balance if the record reaches below anything the address
# could have received, which the indexer cannot establish about itself. So the
# registrar states it: `freshlyDerived: true` means "nothing can have paid this
# key before now", and the indexer stamps its own head against the address. No
# claim means height 0 -- a tautology -- so an unclaimed address answers on a
# genesis-walked chain and refuses with `history_unknown` on a cold-started one,
# rather than reporting a number that is not a balance.
#
# -- WHY THIS TAG IS THE ONE THAT COULD BE PROVED ------------------------------
#
# Testnet gained a UTXO chain at this tag: `cf-testnet-litecoind-regtest`, wired
# as `ltc:testnet` and WALKED FROM GENESIS (`INDEXER_START_HEIGHT_LTC_TESTNET=0`
# in `env/chain.testnet.env`). `indexer/src/bitcoin.ts:471` accepts `regtest` as
# a `getblockchaininfo.chain` value for a `testnet` scope; that line was written
# for exactly this.
#
# What testnet needs is not a copy of Litecoin but a UTXO chain whose outputs an
# operator can control, because that is the only way to prove the arithmetic
# instead of asserting it. Measured here, on this stack, before anything merged:
#
#   unfunded, no history claim  ->  200, balance 0, measured at 90 (head 101 - 12 + 1)
#   funded 5 LTC, +12 blocks    ->  custody total 500000000
#   spent 2, change 2.999 back  ->  custody total 299900000
#
# The identical read on ltc:mainnet refuses `history_unknown`, because that
# record was cold-started at 3,155,209 and cannot see below its own floor. Two
# estates, two floors, opposite outcomes from one rule -- which is what makes the
# rule testable rather than a claim in a comment.
#
# -- WHAT 2.5.2 ADDS OVER 2.5.1 ------------------------------------------------
#
# No source in any of the forty-six repositories changes. The fix is in
# `@cloudsforge/http`, which every service consumes through
# `link:../runtime/packages/http` and which the image build checks out from
# micro-runtime's default branch -- so a rebuild is the only way it reaches a
# container, and a rebuild needs a version. micro-org#251.
#
# `HttpClient` applied its own service token AFTER merging a caller's per-request
# headers, so an `authorization` a call site had deliberately supplied was
# silently replaced. `micro-settlement`'s
# `POST /v1/treasuries/:chain/:network/provision` forwards an OPERATOR's bearer
# token to custody's admin mint, custody requires `role:admin`, and a service
# token does not carry it -- so that route could only ever answer 500. It had
# never worked, on either estate.
#
# That is the route the reconciliation runbook tells an operator to use, and the
# path micro-org#248 needs to register a treasury from scratch. 2.5.1 made the
# treasury MINT correct; 2.5.2 is what makes it reachable.
#
# Precedence is now accept default -> client `headers` -> client `token` ->
# per-request `headers`, with names lower-cased as they merge so that case cannot
# decide which credential survives.
#
# Nothing that works today changes: the break needed a client carrying both a
# `token` and a per-request `authorization`, and settlement's admin surface is the
# only one in the estate that does.
#
# -- WHAT 2.5.1 ADDS OVER 2.5.0 ------------------------------------------------
#
# One behaviour change, in `micro-custody`, and it is what makes the 2.5.0 repair
# below PROVABLE on testnet at all. micro-org#250.
#
# `purpose: 'treasury'` means "an address the platform owns", not "the address
# deposits sweep into". Other services mint one for their own float under their
# own binding and are entitled to: on the live testnet stack the ONLY two
# treasury-purpose keys on ember/testnet belong to `foresight-estate` (the house
# seed) and `faucet-estate` (the faucet's funding address). Custody chose the
# settlement treasury on purpose alone, so with nothing yet pinned,
# `POST /v1/admin/treasuries/ember/testnet/mint` answered 200 `reused: true`
# with foresight's house seed -- and `micro-settlement` pins whatever custody
# returns, so one operator call would have swept every user deposit into it.
#
# The faucet's address is the worse of the two, and 2.5.0 is what makes it worse:
# settlement now books the pinned address's balance as platform equity the moment
# it starts watching it, and the faucet then drips that float away. A growing
# NEGATIVE drift, and every EMBER withdrawal frozen -- micro-org#248's failure
# from the other side.
#
# At this tag both routes that choose the treasury -- the rotation-candidate
# query and the pin -- require the DERIVED binding `cloudsforge:treasury` /
# `treasury:<chain>:<network>`. Minting a platform-owned address is untouched,
# because foresight and the faucet legitimately do it. Rotation is unchanged and
# asserted so with a stranger present.
#
# Mainnet is unaffected: its EMBER treasury already carries the derived binding
# and is the only treasury-purpose key on that pair.
#
# -- WHAT 2.5.0 ADDED OVER 2.4.0 -----------------------------------------------
#
# One behaviour change, in two services, and it is a repair to the platform's
# solvency check rather than anything a visitor will see. micro-org#248.
#
# THE CHAIN AND THE BOOKS CAN AGREE AGAIN. `micro-ledger` reconciles the ledger's
# custody total against `micro-indexer`'s custody aggregate, which sums the
# balances of every address the platform has registered as its own. Registering
# an address raised the aggregate. NOTHING raised the ledger side, because no
# service had ever booked platform float as anything at all.
#
# So on 2026-08-05 the mainnet EMBER treasury was pinned at 12:39:37 and
# registered at 12:40:11 holding 25.000021 EMBER. Reconciliation recorded
# `drift -25000020999999996000` and froze the asset. EVERY EMBER WITHDRAWAL IN
# THE ESTATE WAS REFUSED FOR THREE DAYS WHILE THE PLATFORM HELD MORE COIN THAN
# IT OWED -- an invented insolvency, and one that any future registration would
# have reproduced.
#
# At this tag, watching and booking are ONE operation. `micro-settlement` asks
# `micro-indexer` what the address holds -- at the aggregate's own confirmation
# depth, from a block hash proved either side of the read, because a reading at
# `latest` would book coin the aggregate will not count for another sixty blocks
# and freeze the asset from the other side -- then watches it, then posts one
# entry: debit `(custody, ASSET, available)`, credit `(platform, ASSET,
# treasury)`. It books the address's own measured balance and never `the drift`,
# because the drift is an aggregate a genuine shortfall also moves.
#
# TESTNET IS WHERE THIS IS PROVED. Mainnet's treasury was already registered and
# repaired by hand, so its migration starts life marked as booked and the new
# code never touches it. Testnet registers one from scratch, which is the only
# place the whole path runs end to end.
#
# The other seventy-two containers carry no change and are here because the
# version names the estate.
#
# -- WHAT 2.4.0 ADDED OVER 2.3.0 -----------------------------------------------
#
# One behaviour change, in `notify`, and seventy-three containers that carry no
# change at all and are here because the version names the estate.
#
# NOTIFY NO LONGER SENDS MAIL TO A DOMAIN THE STANDARDS RESERVE. micro-org#243.
#
# `beacon` registers a synthetic account roughly every thirty-eight seconds, each
# at `beacon+<hex>@beacon.test`. `.test` is reserved by RFC 6761 s6: it has no
# mail exchanger, cannot be delegated one, and every message addressed there is
# undeliverable by construction. The estate was sending them anyway -- and then
# retrying each one up to `deliveries.max_attempts`, which is six.
#
# What that cost, measured on the host on 2026-08-07: 7,319 of mainnet's 7,398
# users are beacon's, 5,259 of 5,290 email channel targets are beacon's, and the
# provider's daily allowance was exhausted by them. On that day the estate sent
# 89 messages and failed 1,839. The failures included identity's email
# verification links, so a person who registered while the allowance was spent
# never received one and could not verify. Across both estates 4,483 verification
# tokens have been issued and NONE has ever been consumed.
#
# The rule is a standard, not a deny-list: reserved TLDs (`.test`, `.example`,
# `.invalid`, `.localhost`) from RFC 6761 s6 and the documentation domains
# (`example.com`, `.net`, `.org`) from RFC 2606 s3. It matches on the final
# LABEL, so `testing.com`, `example.company`, `invalidate.co` and `localhost.com`
# are ordinary deliverable domains and stay that way -- the negative cases have
# their own tests, because `endsWith('test')` passes every positive case and
# refuses real people's mail for ever.
#
# It is applied in `channelsAvailable`, BEFORE the route is chosen, not in the
# adapter. That is the load-bearing part: no delivery row is written, nothing is
# retried six times, nothing is dead-lettered, and the address is not counted as
# a user with no address on file. The adapter carries the same check as a
# backstop for rows written before this shipped.
#
# HOW TO SEE IT WORKED: `users` must keep climbing at roughly ninety-five an hour
# while `deliveries where channel='email'` stays flat. A flat user count means
# beacon stopped, which measures nothing.
#
# -- WHAT 2.3.0 ADDS OVER 2.2.0 ------------------------------------------------
#
# Two defects in the consent banner, both found by the owner using it rather
# than by any check here.
#
# It asked again on every subdomain. The decision was kept in `localStorage`,
# which is scoped to an ORIGIN, and every surface in this estate is a different
# subdomain -- so a reader who accepted on the marketing site was asked again on
# hub, again on explorer, again on developers, again on status. Seventeen
# banners, one decision they had already made. It is now a cookie on the
# registrable domain, which every subdomain can see. `localStorage` is still
# written and still read as a fallback, so nobody who already answered is asked
# again because the mechanism changed.
#
# And it covered the last footer link. The banner is fixed to the bottom of the
# viewport, so on a first visit it sat on top of the final link in the footer
# and the click landed on the banner instead. micro-org#241. Fixed with a
# measured spacer in normal flow.
#
# Also at this tag, from the owner reading the pages back: Foresight is a place
# you BET and the copy says so now -- in the verb line, the hero, the spend
# step, the tile and the product page. And Forge Trade leads with trading crypto
# natively, settled on chain against a price feed with no order book and no
# exchange account, rather than with backtesting, which is the safety step
# rather than the product.
#
# -- THIS FILE NOW LIVES IN THE REPOSITORY -------------------------------------
#
# Until 2.3.0 it existed ONLY on the deploy host. Seventy-four image pins and
# the entire record of what each release carried, in one unversioned file with
# no backup, describing the environment every change is checked on before it
# reaches anybody. It is now `deploy/compose/docker-compose.design.yml` in
# `micro-deploy`, and the copy on the host is a copy.
#
# Edit it HERE and copy it there. The host is not a checkout and does not pull.
