# Alert routing — 13-operational-model.md §9.
#
# Two things happen to every alert, and only one of them wakes anybody:
#
#   1. It opens a Beacon incident. Beacon already owns incident open/close,
#      hysteresis, the timeline and the public status page, so an alert lands
#      where incidents already live rather than in a second incident system that
#      then has to be reconciled with the first. This is the `continue: true`
#      first route below and it applies to every alert without exception.
#
#   2. It is delivered to a human, as a page or as a ticket. Page = user-visible
#      failure or irreversible money risk. Ticket = everything else.
#
# No secret appears in this file. Receiver URLs that carry a token in the path,
# and the bearer credential the Beacon receiver presents, are read from files
# under /etc/alertmanager/secrets, written by ../up.sh from ../.env.
# Unconfigured is a SUPPORTED MODE: with no delivery URL set, both
# receivers fall back to the Beacon incident record, which is a degradation
# (no acknowledgement, no escalation) rather than a failure. The estate's single
# fire-and-forget BEACON_WEBHOOK_URL is kept as the chat receiver and is
# explicitly not the paging path — paging needs acknowledgement and escalation,
# and a fire-and-forget POST has neither.

global:
  resolve_timeout: 5m

route:
  # Grouping per §9. One incident produces one notification even when it lights
  # up six rules on the same service.
  group_by: [service, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ticket

  routes:
    # ---- 1. Every alert, always, opens a Beacon incident ------------------
    # `continue: true` means matching here does not stop routing, so the alert
    # goes on to be paged or ticketed as well. Wider grouping (by alertname
    # only) because Beacon deduplicates into an incident anyway and a per-service
    # split here would open three incidents for one outage.
    - receiver: beacon-incident
      continue: true
      group_by: [alertname]
      group_wait: 10s
      group_interval: 5m
      # Beacon holds hysteresis and open/close state; re-POSTing the same firing
      # alert every four hours would add an update to an incident nobody has
      # touched. Long, so a resolve is what closes it.
      repeat_interval: 24h

    # ---- 2. Money, always paged, never grouped away ------------------------
    # Split out of the general page route with a tighter group_wait: a trial
    # balance that is non-zero is not something to hold for 30 seconds in case a
    # friend arrives, and it must never be grouped behind an unrelated alert on
    # the same service.
    - receiver: page-money
      matchers:
        - severity = page
        - team =~ "ledger|settlement|security"
      group_by: [alertname, service, currency, chain]
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

    # ---- 3. Everything else that pages ------------------------------------
    - receiver: page
      matchers:
        - severity = page
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    # ---- 4. Tickets --------------------------------------------------------
    # Longer group_wait, because nothing is waiting on it and a wider batch is
    # one notification instead of five. repeat_interval is a working day: a
    # ticket that repeats every four hours is a ticket that gets muted.
    - receiver: ticket
      matchers:
        - severity = ticket
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h

# Suppression. Both rules exist because the alternative is a page storm in which
# the one alert that names the cause is the twelfth notification.
inhibit_rules:
  # A service that is down will also be slow, erroring and burning budget. Those
  # are consequences, and paging on a consequence when the cause is already
  # paging is how an on-call learns to silence the group.
  - source_matchers:
      - alertname =~ "CustodyUnreachable|TelemetryComponentDown|BeaconTargetDown"
    target_matchers:
      - alertname =~ "SLOErrorBudgetBurn.*|GatewayErrorRatioHigh|JobQueueOverdue|BeaconJourneyStale"
    equal: [service]

  # Postgres taking a money service with it suppresses everything bound to that
  # service — the ledger cannot post if it cannot write, and the posting-failure
  # alert adds nothing to the database alert.
  - source_matchers:
      - alertname = PostgresUnreachable
    target_matchers:
      - team =~ "ledger|wallet|settlement"
    equal: [service]

  # A page suppresses the ticket for the same condition on the same service.
  # Otherwise every SEV1 also files paperwork at itself.
  - source_matchers:
      - severity = page
    target_matchers:
      - severity = ticket
    equal: [service, alertname]

receivers:
  # Beacon's Alertmanager receiver (13-operational-model.md §3). Not a secret:
  # a compose-network address, unreachable from outside the estate.
  #
  # ── 4000, AND IT WAS 4011 (micro-org#308) ──────────────────────────────────
  #
  # EVERY alert in this file routes here as well as to its own receiver, so this
  # one line is the estate's whole incident path. It named 4011 — Beacon's
  # default bind port in its own source — and the estate's compose normalises
  # every service to `PORT: 4000` via the `x-common-env` anchor, so nothing has
  # ever bound 4011. Measured from inside this container on 2026-08-09:
  #
  #   http://beacon:4011/api/alerts/webhook  can't connect: Connection refused
  #   http://beacon:4000/api/alerts/webhook  HTTP/1.1 401 Unauthorized
  #
  # The same wrong port was in prometheus.yml's Beacon scrape and in up.sh's
  # fallback URL; all three are corrected. This one is why `BeaconScrapeFailing`
  # could fire correctly and continuously from 2026-08-05T21:07:58Z and reach
  # nobody: the rule was right and the delivery path was pointed at a closed port.
  #
  # ── AND THE CREDENTIAL, WHICH WAS THE OTHER HALF (micro-org#311) ────────────
  #
  # Correcting the port turned `connection refused` into `401 Unauthorized`, and
  # a 401 on every alert is the same silence with a better error message. Beacon
  # gated this route on an `x-beacon-token` header, and Alertmanager's
  # `http_config` has `basic_auth`, `authorization` and `oauth2` and NO way to
  # set an arbitrary header — Prometheus has `http_headers`, Alertmanager does
  # not. So the credential could not be attached here at all, at any version.
  #
  # Beacon now accepts the same break-glass token in either `x-beacon-token` or
  # `Authorization: Bearer` (micro-beacon#10). That is the same secret and the
  # same scopes — the token is still not an administrator, which Beacon's own
  # suite pins by POSTing an adminOnly route with it as a bearer and asserting
  # 403 — so this line grants Alertmanager nothing it did not already have on
  # the header it could not send.
  #
  # `credentials_file` and not `credentials`: a token in a config file is a token
  # in a backup and in a screenshot, which is the same reason the two delivery
  # receivers below use `url_file`. The file is written by ../up.sh and is
  # gitignored. An EMPTY file is the supported unconfigured mode — the header
  # goes out as a bare `Authorization: Bearer`, Beacon refuses the empty string
  # explicitly rather than matching it against an unset `BEACON_TOKEN`, and the
  # 401 is visible in a log. What is NOT supported is the file being absent;
  # up.sh creates it unconditionally for exactly that reason.
  - name: beacon-incident
    webhook_configs:
      - url: http://beacon:4000/api/alerts/webhook
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/beacon_token

  - name: page-money
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/page_webhook_url
        send_resolved: true

  - name: page
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/page_webhook_url
        send_resolved: true

  - name: ticket
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_webhook_url
        send_resolved: true
