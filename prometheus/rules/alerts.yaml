# Alerting rules.
#
# THE RUNBOOK RULE (13-operational-model.md §9). Every rule below carries a
# `runbook_url`. An alert without one is deleted, not silenced, because an
# unactionable page teaches the on-call to ignore pages — and the pages that
# matter here are about somebody's money. CI enforces it:
#
#   yq '.groups[].rules[] | select(.alert) | select(.annotations.runbook_url == null)' \
#     prometheus/rules/alerts.yaml
#
# must return nothing, and every URL must resolve.
#
# PAGE VS TICKET. `severity: page` wakes a human, and only for user-visible
# failure or irreversible money risk. `severity: ticket` is everything else.
# A metric says "p99 is high"; a journey says "a user cannot withdraw". Page on
# the second. Alertmanager routes on this label and on `team`, both mandatory.
#
# METRICS THAT DO NOT EXIST YET. The money and chain rules reference metrics
# that ledger, wallet, settlement, custody and indexer must emit — those
# services are P4/P5 and are not written. Those rules are the CONTRACT: a
# service that does not emit `ledger_trial_balance_delta` fails an alert that is
# already deployed and already has a runbook, rather than shipping and then
# being instrumented. The `MoneyMetricContractMissing` rule at the bottom is
# what stops a missing metric reading as a healthy system, which is the failure
# mode this whole design exists to prevent.

groups:
  # ======================================================== PAGE — money ====
  - name: cf.page.money
    rules:
      - alert: LedgerTrialBalanceNonZero
        # Sum of debits minus sum of credits. Double-entry has exactly one
        # invariant and this is it. Non-zero does not mean a number is off — it
        # means the accounting is not accounting, and every balance derived from
        # it is unproven, including the ones users are looking at.
        expr: ledger_trial_balance_delta != 0
        for: 2m
        labels:
          severity: page
          team: ledger
          service: ledger
          sev: "1"
        annotations:
          summary: "Trial balance is {{ $value }} for {{ $labels.currency }} — it must be exactly 0"
          description: >-
            Σ debits − Σ credits is non-zero on the {{ $labels.currency }} journal.
            No balance in the platform is trustworthy until this is 0. Do not
            correct it with an UPDATE; an adjustment is a new balanced entry
            under dual approval.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-trial-balance-nonzero.md

      - alert: WithdrawalStuck
        # Pages on >= 1, not on a rate. One user unable to get their money out
        # is the failure this platform is least allowed to have, and it is
        # invisible to every latency and error-rate metric — the request
        # succeeded, the money did not move.
        #
        # `withdrawal_stuck`, NOT `withdrawal_stuck_total`, RENAMED 2026-08-10.
        # This expression is a LEVEL — it asks whether any withdrawal is stuck
        # right now, and runbook-stuck-withdrawal expects the page to clear once
        # an operator adjudicates. `_total` promises a monotonic counter to
        # `rate()`, to `increase()` and to Grafana's unit picker, and a counter
        # under `>= 1` is a page that fires on the estate's first stuck
        # withdrawal and can never be resolved without editing this file.
        #
        # Renamed here and in micro-settlement in the same release because this
        # rule had been evaluating against NO SERIES since the alerting plane was
        # written: settlement exports the metric for the first time in this
        # release, so there is no history to break and no migration to run. Every
        # later moment costs one. Do not repoint this at
        # `settlement_stuck_total{chain,purpose}`, which IS a real monotonic
        # transition counter and is exactly what must not be read with `>= 1`.
        expr: withdrawal_stuck >= 1
        for: 5m
        labels:
          severity: page
          team: settlement
          service: settlement
          sev: "1"
        annotations:
          summary: "{{ $value }} withdrawal(s) stuck on {{ $labels.chain }}"
          description: >-
            A withdrawal has been in pending, signed or broadcast longer than the
            chain's policy allows. Freeze before diagnosing: freezing is
            reversible, a duplicated payout is not.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-stuck-withdrawal.md

      - alert: AssetWithdrawalsFrozen
        # Reconciliation freezes an asset when it cannot PROVE the chain backs
        # the liability, and a frozen asset is a user who cannot withdraw. That
        # is the same user-visible money failure WithdrawalStuck names, arriving
        # by the opposite route: nothing is stuck, because nothing was accepted.
        #
        # THIS IS THE RULE THAT WOULD HAVE CAUGHT micro-org#307. On 2026-08-09
        # litecoind stopped answering its own RPC — "work queue depth exceeded",
        # with idle workers and no connections — reconciliation could not observe
        # LTC, and LTC withdrawals were frozen for about thirty minutes. Every
        # deployed rule stayed green for all of it: the indexer was up, the
        # ledger was up, and `indexer_lag_blocks` was zero because a chain nobody
        # can read produces no lag. The money consequence was the only honest
        # signal in the estate and nothing was watching it.
        #
        # `for: 20m` is deliberate and not a round number. The reconciliation
        # sweep runs every 15 minutes and ONLY an exactly-clean observed run
        # lifts a freeze, so 20m rides out one full self-healing cycle and fires
        # on the second — while still firing inside a thirty-minute outage.
        #
        # No `by (asset)`: the gauge carries no labels, because it is the length
        # of `listFreezes(...)`. The runbook opens with the query that names
        # them, which is where that belongs — the answer is a row in
        # `asset_freezes`, not a label Prometheus would carry for every asset
        # the platform will ever list.
        expr: ledger_assets_frozen > 0
        for: 20m
        labels:
          severity: page
          team: ledger
          service: ledger
          sev: "2"
        annotations:
          summary: "{{ $value }} asset(s) have withdrawals frozen by reconciliation"
          description: >-
            Withdrawals are stopped on at least one asset because reconciliation
            could not prove the chain backs it. Read the reason before touching
            anything: an unobservable chain and a real drift are different
            mornings, and only one of them is about the money.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-reconciliation-drift.md

  # ====================================================== PAGE — custody ====
  - name: cf.page.custody
    rules:
      - alert: CustodyUnreachable
        # Custody is permanently single-replica (AD-18) and that is accepted, so
        # its availability objective is deliberately the lowest in the estate at
        # 99.5%. Accepted does not mean unwatched: while it is down, deposits
        # still land and withdrawals and sweeps queue, and that degradation is
        # supposed to be visible on the public status page rather than
        # discovered by a user whose withdrawal is silent.
        expr: up{job=~"cf-services|custody", service="custody"} == 0
        for: 2m
        labels:
          severity: page
          team: security
          service: custody
          sev: "1"
        annotations:
          summary: "Custody has not answered for 2 minutes"
          description: >-
            Signing is unavailable. Withdrawals and sweeps queue; deposits are
            unaffected. Confirm the queue is queuing and not failing, and put the
            degradation on the status page before users find it.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-custody-unreachable.md

  # ======================================================== PAGE — chain ====
  - name: cf.page.chain
    rules:
      - alert: IndexerLagPastConfirmationDepth
        # Compared against the chain's OWN confirmation depth, published as a
        # metric by the indexer, rather than against a constant. Hearth's depth
        # is 60 and Bitcoin's is not; one threshold for both is one threshold
        # that is wrong for one of them.
        #
        # Past this point deposits are provably not being credited — it is a
        # user-visible money failure wearing an infrastructure metric's clothes.
        expr: indexer_lag_blocks > on (chain) group_left indexer_confirmation_depth
        for: 10m
        labels:
          severity: page
          team: indexer
          service: indexer
          sev: "2"
        annotations:
          summary: "Indexer is {{ $value }} blocks behind on {{ $labels.chain }}, past its confirmation depth"
          description: >-
            Deposits on {{ $labels.chain }} are not being credited. Check
            provider health before restarting anything — a failover loop looks
            identical to a stalled worker in this metric.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-indexer-lag.md

      # ── ChainHeightSpreadSustained WAS HERE AND IS RETIRED (2026-08-10) ──────
      #
      #   expr: beacon_chain_height_spread > 3   for: 15m   page · sev2
      #
      # It could not fire, and it could not have fired on any day of its life.
      # `beacon_chain_height_spread` is registered by nothing: `grep -rn
      # chain_height_spread beacon/src` returns zero hits, so no scrape has ever
      # produced the series and the expression has always evaluated over an empty
      # vector. A rule in that state is worse than no rule — it is a green row on
      # the alert list that reads as "Hearth forks are covered".
      #
      # AND THE METRIC COULD NOT BE MADE HONEST BY WRITING IT. A spread is
      # max(height) − min(height) across nodes, and exactly ONE Hearth full node
      # runs in this estate (`cf-hearth-seed`). One node's spread is 0 by
      # construction, forever, whatever the chain is doing. Publishing that zero
      # would convert an alert that cannot fire into an alert that reports
      # agreement it never checked, which is the same failure with a worse tell.
      #
      # RESTORE IT WHEN, AND ONLY WHEN, there are at least two Hearth full nodes
      # per network AND beacon registers the gauge over them. Both halves are
      # required: two nodes with no metric is this rule again, and one node with a
      # metric is a lie. `runbook-hearth-fork.md` is deliberately KEPT — a fork is
      # still a real incident with a real procedure, it is simply not something
      # this estate can currently detect automatically, and that runbook now says
      # so at the top and names how a fork is actually noticed today.

      - alert: ChainNodeTemplateStale
        # A CHAIN NODE THAT HAS STOPPED ANSWERING, MEASURED WHERE IT COSTS
        # SOMETHING (micro-org#307).
        #
        # The pool asks its node for a block template every ten seconds. When the
        # node stops answering, this age climbs and every miner pointed at the
        # estate is burning electricity on work that can no longer win — which is
        # the first place an unreachable node becomes visible to a person.
        #
        # 120 IS NOT A THRESHOLD CHOSEN HERE. It is the pool's own
        # `TEMPLATE_STALE_AFTER_MS` (pool/src/template.ts), documented there as
        # the staleness at which /readyz stops claiming the chain works. Copying
        # the constant into this file would be a second answer to one question;
        # comparing against the pool's own line is the same number by
        # construction, and if the pool changes its mind this rule follows.
        #
        # `for: 5m` comes from the 5.7h of mainnet history Prometheus held on
        # 2026-08-10: 2.87% of samples above 120s, p99 206s, mean 38s, max 359s,
        # and the longest single unbroken run above 120s about 240s. Five minutes
        # clears every benign excursion measured, and the 2026-08-09 wedge
        # produced no template at all for roughly twenty minutes.
        expr: pool_template_age_seconds > 120
        for: 5m
        labels:
          severity: page
          team: pool
          service: pool
          sev: "2"
        annotations:
          summary: "No fresh {{ $labels.chain }} block template for {{ $value | humanizeDuration }}"
          description: >-
            The pool's {{ $labels.chain }} node has stopped serving templates.
            Miners are hashing on work that cannot win. Ask the node directly
            before restarting the pool — a wedged RPC answers the CLI instantly
            and refuses HTTP, which looks identical to a pool bug from here.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-chain-node-unreachable.md

      - alert: IndexerChainHalted
        # A HALT IS NOT UNREACHABILITY, and the distinction is the whole reason
        # this rule is not the one above. `indexer_chain_halted` is set when a
        # reorg deeper than the chain's policy allows stopped the follower on
        # purpose; it is cleared by an operator and never by waiting. A node that
        # is merely unreachable leaves this at 0 forever.
        #
        # It pages because crediting has stopped on that chain and the ledger
        # will freeze the asset behind it within two sweeps, so the alternative
        # is discovering it from AssetWithdrawalsFrozen forty minutes later with
        # the cause already scrolled off.
        #
        # `for: 5m` and not shorter: the gauge is set by the follower loop, and a
        # halt that clears inside one loop was a read the follower retried.
        expr: indexer_chain_halted > 0
        for: 5m
        labels:
          severity: page
          team: indexer
          service: indexer
          sev: "2"
        annotations:
          summary: "Indexer has halted {{ $labels.chain }} on {{ $labels.network }}"
          description: >-
            A reorg past the policy depth stopped the follower deliberately.
            Deposits on {{ $labels.chain }} are not being credited and only an
            operator clears this. Do not restart the indexer to make it go away —
            establish the common ancestor first.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-reorg-recovery.md

      # ── AND DELIBERATELY NO RULE ON indexer_provider_failures_total ──────────
      #
      # The obvious alert for "a chain node is unreachable" is a rate of RPC
      # failures, and on this estate it cannot be written honestly. Measured on
      # mainnet on 2026-08-10 over the 5.7h Prometheus held:
      #
      #   increase(indexer_provider_failures_total[5m])   p99 56, max 76
      #   the same window on 2026-08-09, mid-wedge        about 78
      #
      # Routine and outage are the same number. 285 failures accrued in 24h
      # against a node that answers `litecoin-cli` instantly, so the counter is
      # measuring the indexer's own retry behaviour rather than the node's
      # reachability, and every threshold above the noise is also above the
      # signal. A rule written on it today would page hourly and be silenced by
      # Friday, which is worse than the absence it appears to fix. Making the
      # counter mean something is a change in micro-indexer, not a threshold
      # here; the three rules that carry #307 are the ones above, which measure
      # the consequence instead of the plumbing.

  # ===================================================== PAGE — journeys ====
  - name: cf.page.journeys
    rules:
      - alert: BeaconCriticalJourneyFailing
        # `!= 1`, never `== 0`. Beacon emits 0.5 for a skip, and a skip is
        # not-run, which is never green — alerting on `== 0` would treat a
        # journey whose credentials went missing as passing.
        #
        # "Twice consecutively" is expressed as `for:`, not counted: the gauge
        # holds its last value between runs, so remaining non-1 across a window
        # longer than the journey interval means the most recent run failed and
        # the one before it did too. Beacon applies hysteresis at the source for
        # target state (failThreshold=3); it deliberately does not for journeys,
        # so this is where it belongs. Do not double-apply it.
        expr: beacon_journey_status{journey=~"critical.*|register|signin|deposit|convert|withdraw|mint.*|market.*"} != 1
        for: 10m
        labels:
          severity: page
          team: on-call
          service: "{{ $labels.group }}"
          sev: "2"
        annotations:
          summary: "Journey {{ $labels.journey }} has been failing for two consecutive runs"
          description: >-
            A synthetic user cannot complete {{ $labels.journey }}. This is a
            user-visible failure, not a metric being ugly. Beacon's journey grid
            before Grafana — the journey names what broke.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-incident-comms.md

  # ========================================================== PAGE — SLO ====
  - name: cf.page.slo
    rules:
      - alert: SLOErrorBudgetBurnFast
        # 14.4x over 1h is 2% of a 28-day budget in an hour. Paired with the 6h
        # ticket rule below because one window cannot serve both cases: short
        # alone pages on every blip, long alone fires after the budget is gone.
        expr: cf:slo_burn_rate_tier1:1h > 14.4
        for: 5m
        labels:
          severity: page
          team: "{{ $labels.service }}"
          sev: "2"
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.network }} is burning its error budget at {{ $value | printf \"%.1f\" }}x"
          description: >-
            At this rate a Tier-1 28-day budget is gone inside two days. Tier 1
            is 99.95% — twenty-one minutes for the month.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-rollback-release.md

      - alert: GatewayErrorRatioHigh
        expr: cf:http_errors:ratio5m{service="gateway"} > 0.05
        for: 5m
        labels:
          severity: page
          team: platform
          service: gateway
          sev: "1"
        annotations:
          summary: "Gateway is returning {{ $value | humanizePercentage }} 5xx on {{ $labels.network }}"
          description: >-
            Every product is behind this. Check the deploy annotation first; if a
            release landed in the window, roll back to the previous manifest
            before diagnosing.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-rollback-release.md

  # ======================================================= PAGE — backup ====
  - name: cf.page.backup
    rules:
      - alert: BackupAgeExceeded
        # Alerting on AGE rather than on failure is the whole point. A backup job
        # that silently stops firing produces no failure to alert on, so the
        # first thing to watch is that it ran at all.
        #
        # ── `backup_last_success_unixtime`, AND IT READ A NAME NOTHING EXPORTS ─
        #
        # This was `time() - backup_last_success_timestamp_seconds > 129600`.
        # Measured against the mainnet Prometheus on 2026-08-10: of 1,329 metric
        # names in the estate, ZERO contain the substring `backup`. So this sev2
        # page had never evaluated against a series and could not fire, for two
        # separate reasons that each had to be fixed (micro-org#310):
        #
        #   1. The runner has never been started. `deploy/backup` is complete —
        #      four job handlers, a per-artefact manifest, `age` encryption of
        #      the miner coinbase key, a cross-environment restore refusal — and
        #      `compose/docker-compose.backup.yml` is a complete overlay, but
        #      `docker ps -a` on the host shows no backup-runner container and
        #      the destination directory holds nothing. The estate has zero
        #      backups against a stated RPO of zero.
        #   2. Even once it runs, the OLD NAME would still have been absent. The
        #      runner registers `backup_last_success_bytes` — how big — and had
        #      no gauge at all for WHEN. It now exports
        #      `backup_last_success_unixtime`, spelled to match the
        #      `backup_last_verified_unixtime` beside it in the same exporter
        #      rather than to match Prometheus's `_timestamp_seconds`.
        #
        # THE GAUGE IS SEEDED AT BOOT from `backup_runs.finished_at`, and that is
        # what makes this expression trustworthy rather than merely correct. A
        # gauge set only when a run completes is erased by a restart, and
        # `time() - <absent> > 129600` evaluates over an EMPTY VECTOR — no
        # series, no alert, a page that reads as satisfied because there is
        # nothing to compare. That is the same silent green this rule spent its
        # whole life in.
        #
        # No `{{ $labels.target }}` in the summary any more: the gauge carries no
        # labels, because it is one estate's one backup destination. The old
        # summary interpolated a label nothing publishes and would have rendered
        # "No successful backup of  for 4d".
        #
        # 129600s is 36h — one missed daily sweep plus half a day, so a run that
        # started late or a redeploy that skipped a night does not page.
        expr: time() - backup_last_success_unixtime > 129600
        labels:
          severity: page
          team: platform
          service: backup-runner
          sev: "2"
        annotations:
          summary: "The estate's last successful backup finished {{ $value | humanizeDuration }} ago"
          description: >-
            The ledger's RPO is zero. A backup nobody has restored is a
            hypothesis; a backup that has not run is not even that.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-restore-from-backup.md

      - alert: BackupDestinationFilesystemErrors
        # THE BACKUP DISK HAS NO SMART, AND THIS IS THE ONLY HEALTH SIGNAL LEFT
        # (micro-org#207).
        #
        # `/dev/sdb` — 3.6 TB, `/data`, and as of 2026-08-10 the estate's ONLY
        # backup destination — is a MARVELL 88SE9230 virtual disk. `smartctl -H`
        # answers "device lacks SMART capability", and on 2026-08-10 the "we used
        # the wrong `-d` type" hypothesis was closed permanently rather than left
        # untried: the controller is bound to `ahci`, not to a RAID driver, so it
        # does its array in FIRMWARE and hands the kernel one ordinary SATA
        # device. The member disks are not devices Linux has ever seen, there is
        # no `-d` value that can work, and `mvcli` is in no Ubuntu archive.
        # Reallocated sectors, pending sectors, power-on hours and the overall
        # assessment are permanently unknown for the disk holding every backup.
        #
        # ext4 keeps its own error count in the SUPERBLOCK and exposes it under
        # `/sys`, so it survives a reboot and a remount and needs no root, no
        # smartmontools and no privileged container. The backup runner publishes
        # it from the process that already has the destination mounted, resolving
        # the device from `st_dev` rather than from configuration — measured
        # inside the running container on 2026-08-10, `/backups` resolves to
        # `sdb1` and reads 0.
        #
        # ── WHAT THIS DOES AND DOES NOT SAY, BECAUSE IT WILL BE OVER-READ ─────
        #
        # SMART's value is PREDICTION — sectors climbing before anything fails —
        # and that is genuinely lost. This is DETECTION only. It counts errors
        # ext4 itself hits; a read error on file DATA handed straight back to a
        # caller is not one, and a disk days from failure reads zero here until
        # the first failure. A smoke alarm, not a thermometer. It is still
        # strictly more than the estate had, which was nothing.
        #
        # Do not read a firing of this as "a disk is dying" either. On a firmware
        # array the member is invisible, so a non-zero count says only that ext4
        # was handed something it could not complete. The runbook's first step is
        # therefore to establish whether the BACKUPS are still readable, not to
        # order hardware.
        #
        # ── SEV2 PAGE, NOT A TICKET ───────────────────────────────────────────
        #
        # Same severity as `BackupAgeExceeded` above and for the same reason: the
        # ledger's RPO is zero and this is the medium every backup is on. Unlike
        # that one it is not a slow-moving condition an operator can catch in the
        # morning — corruption on a backup volume spreads with every subsequent
        # write, and the runner writes to it nightly.
        #
        # NO `absent()` COMPANION, and that is a deliberate boundary rather than
        # an oversight. The gauge is absent in exactly two states, and both are
        # already covered: a runner nobody scrapes fires `BackupNeverRun` below
        # after 30m, and a destination that is not the real backup disk stops the
        # runner from starting at all (src/disk.ts writes a canary and checks the
        # filesystem size). The residue is "the backup disk was reformatted as
        # something other than ext4", which is a deliberate host change and not a
        # failure this can be asked to notice.
        #
        # `for: 5m` on a counter that lives in a superblock and only ever rises.
        # It costs nothing on a signal that is permanent once set, and it means a
        # single anomalous scrape cannot page.
        expr: backup_destination_fs_errors > 0
        for: 5m
        labels:
          severity: page
          team: platform
          service: backup-runner
          sev: "2"
        annotations:
          summary: "ext4 has recorded {{ $value }} error(s) on {{ $labels.device }}, which holds every backup"
          description: >-
            The backup disk exposes no SMART, so this counter is the only health
            signal it has. Establish whether the existing sets are still readable
            before writing another one to the same volume.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-backup-destination-fs-errors.md

  # ==================================================== TICKET — money ======
  - name: cf.ticket.money
    rules:
      - alert: LedgerReconciliationDrift
        # Ledger's custody account versus the indexer's observed on-chain
        # balance. Ticket at any non-zero; the per-chain dust threshold that
        # escalates it to a page is a property of the chain and belongs in the
        # metric's own labels, not in a second copy of the number here.
        #
        # ── PER ASSET, NOT `_native`, AND THE VALUE HAS NO COMMON UNIT ────────
        #
        # This read `ledger_reconciliation_drift_native != 0` and interpolated
        # `{{ $labels.chain }}`. Neither existed. `ledger_reconciliation_drift`
        # is what ledger publishes, it is labelled by ASSET and not by chain, and
        # a single "native" number was asked for and refused on 2026-08-10 for
        # four reasons, each sufficient on its own:
        #
        #   · the assets have different decimals — SHARD 0, LTC 8, EMBER 18 — so
        #     one integer over all three adds three different units together;
        #   · SHARD has no chain at all (`chainNameFor('SHARD')` is `platform`),
        #     so "native" is undefined for a third of the series;
        #   · collapsing it needs a price oracle ledger does not have, and one
        #     behind a solvency alert makes the threshold move with the market;
        #   · the drifts are SIGNED, so +1 LTC and −1 EMBER cancel to zero and
        #     the rule goes green on two simultaneous discrepancies.
        #
        # THE `and on (asset)` GUARD IS LOAD-BEARING. Ledger writes the drift
        # gauge only when a drift was actually computed, and the telemetry
        # package has no way to remove a labelled series — so an asset that stops
        # reconciling keeps publishing its LAST drift value for the life of the
        # process. Without the guard this rule cannot tell a live discrepancy
        # from a stale one, and would hold a ticket open against a number nobody
        # is still measuring. `ledger_reconciliation_observed{asset}` is set to
        # 0/1 on every run and is the estate's existing "did we look" companion.
        #
        # A firing series is already past that asset's declared tolerance
        # (`LEDGER_ASSET_TOLERANCE`; LTC deliberately 0, EMBER 1e15), so it is a
        # discrepancy an owner has already called intolerable. It stays a ticket
        # because the page on the CONSEQUENCE exists above:
        # `AssetWithdrawalsFrozen` on `ledger_assets_frozen > 0`.
        expr: ledger_reconciliation_drift != 0 and on (asset) ledger_reconciliation_observed == 1
        for: 15m
        labels:
          severity: ticket
          team: ledger
          service: ledger
          sev: "3"
        annotations:
          summary: "Reconciliation drift of {{ $value }} on {{ $labels.asset }}, in that asset's smallest unit"
          description: >-
            What the ledger says custody holds and what the chain says custody
            holds have diverged. Two truths is the thing the single-journal
            design exists to prevent, so this is a real finding even when small.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-reconciliation-drift.md

      - alert: DepositAddressUnwatched
        # WAS `DepositAddressFrozen - wallet_deposit_address_frozen > 0`, AND
        # THAT STATE CANNOT EXIST IN THIS ESTATE (2026-08-10).
        #
        # micro-wallet's `deposit_address_assignments_status_ck` admits exactly
        # `active`, `rotated`, `retired`. `frozen` does exist in that repository
        # as a WALLET status meaning "cannot send, can still receive" — the
        # opposite of a crediting stop — and `ledger_assets_frozen` is an
        # asset-wide WITHDRAWAL freeze. Neither is the thing, and repointing at
        # either would have been a rule that fires on the wrong incident.
        #
        # The condition the old rule and `runbook-frozen-deposit-address.md`
        # describe is FORGE-PAY'S, and micro-wallet exists to close it: the
        # address row carried its own high-water mark, a rotation left the old
        # mark behind, every probe read a regression and crediting stopped for
        # ever. That runbook's step 2 is literally "compare against the address's
        # high-water mark". micro-wallet has no high-water mark — a rotation is a
        # new row and credits key on (chain, network, txHash, logIndex) — so the
        # state cannot arise by construction. The rule was an artefact of the
        # data model this service replaced.
        #
        # WHAT IS REAL is the backlog of assigned deposit addresses the indexer
        # has not been told to watch: until it is registered, a deposit to it is
        # never seen and the user's money is on the chain and not in the ledger.
        #
        # SUBTRACTING `unobservable` IS WHAT MAKES IT A FAULT RATHER THAN A
        # PREFERENCE. A chain the indexer follows no source for is an owner's
        # decision, not a defect, and today that is seven of eight chains
        # (`INDEXER_CHAINS=ember:mainnet`) — alerting on it would fire for ever
        # and be silenced, which is how a rule stops being read.
        #
        # `for: 30m` is measured, not chosen: `deposit.watch` runs every 30s, so
        # a backlog that survives thirty minutes has failed about sixty times and
        # is not a queue. And `{{ $labels.chain }}` now resolves — both gauges
        # are written per chain by `sampleDepositAddressMetrics` in
        # `beforeScrape`, on every replica, which is also what stopped the two
        # writers of the old unlabelled gauge from alternating between a cap of
        # 50 and a cap of 500.
        expr: wallet_deposit_addresses_unwatched - wallet_deposit_addresses_unobservable > 0
        for: 30m
        labels:
          severity: ticket
          team: wallet
          service: wallet
          sev: "3"
        annotations:
          summary: "{{ $value }} deposit address(es) unregistered with the indexer on {{ $labels.chain }}"
          description: >-
            These addresses are assigned to users and the indexer is not
            watching them, on a chain it does follow a source for. A deposit to
            one of them is not seen and is not credited. This is the registration
            path failing, not a crediting freeze — no such state exists.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-deposit-address-unwatched.md

      - alert: DepositCreditsUnposted
        # THE MIRROR IMAGE OF THE RULE ABOVE, AND THE ONE HALF OF THE DEPOSIT
        # PATH NOTHING WAS WATCHING (micro-org#326).
        #
        # `wallet_deposit_credits_pending` counts deposit credits whose
        # `ledger_entry_id` is still null: money that arrived on chain, was
        # claimed by wallet, and was never posted to the ledger. Until it is
        # posted the owner cannot see it — their balance is the ledger's answer,
        # and the ledger has not been told. micro-wallet's own `index.ts` says
        # "a credit claimed but never posted is money the user cannot see"
        # beside the line that publishes the gauge, and until this rule nothing
        # in the estate read it. `grep -rn wallet_deposit_credits_pending
        # deploy/` returned nothing on 2026-08-10.
        #
        # The estate pages for a withdrawal that is stuck and for an asset that
        # is frozen. Both are money the user cannot move. This is money the user
        # cannot SEE, arriving by the deposit side, and it was the only one of
        # the three with no rule at all.
        #
        # ── IN cf.ticket.money, NOT A NEW cf.ticket.wallet ──────────────────
        #
        # micro-org#326 proposed a `cf.ticket.wallet` group. It is here instead:
        # the groups in this file are cut by DOMAIN — money, jobs, backup, slo,
        # telemetry, conformance — and never by owning team, which is why
        # `DepositAddressUnwatched` directly above already carries `team: wallet`
        # from inside `cf.ticket.money`. Alertmanager routes on the `severity`
        # and `team` LABELS and never on the group name, so a new group would
        # change no routing and would separate the two halves of one failure
        # path in the file an operator reads at 3am. Group membership only
        # controls evaluation order and interval, and these two want neither.
        #
        # ── TICKET AND NOT A PAGE, DELIBERATELY ──────────────────────────────
        #
        # `deposit.post` retries the whole backlog on a schedule and the retry
        # is safe to repeat: `postCredit` sends the credit key as the ledger's
        # idempotency key, so a posting that did in fact land is replayed rather
        # than doubled. A non-zero reading that clears on its own is therefore
        # the system working, not an incident. A reading that PERSISTS is a
        # posting that keeps being refused — the ledger down, or a credit the
        # ledger will not accept — and that never clears without a human.
        #
        # ── `for: 20m` IS MEASURED AGAINST THE JOB, NOT CHOSEN FOR ROUNDNESS ──
        #
        # `RECURRING` in micro-wallet's `jobs.ts` schedules `deposit.post` at
        # `everyMs: 5_000`, so twenty minutes is roughly 240 passes over the
        # same backlog. Anything still unposted after that is not a queue
        # draining; it is the same posting failing 240 times. The same reasoning
        # as `for: 30m` on `DepositAddressUnwatched` above, which is sixty
        # passes of a 30s job — and a shorter window here because the user is
        # already waiting on a balance they cannot see.
        #
        # ── NO `by`, AND NO `absent()` COMPANION ─────────────────────────────
        #
        # The gauge is unlabelled by decision, argued at its registration in
        # micro-wallet's `registerServiceMetrics`: every unposted credit has the
        # same repair, and the per-row answer — `creditId` and `err` on the
        # `deposit credit posting failed` log line — belongs in the logs rather
        # than in a label Prometheus would carry for ever. The runbook opens
        # with the query that names them, which is the other half of that
        # bargain and is the half micro-org#327 found missing on
        # `ledger_assets_frozen`.
        #
        # No `absent()` guard either, unlike `BackupNeverRun` below: `beforeScrape`
        # writes this series unconditionally on every scrape on every replica, so
        # it cannot go missing while wallet is being scraped at all — and wallet
        # not being scraped is `BeaconTargetDown`'s question, not this rule's.
        #
        # ── THE VALUE IN `summary` ONLY BECAME TRUE WITH micro-org#326 ───────
        #
        # The gauge was `(await pendingCredits(db, 500)).length`, i.e.
        # `min(backlog, 500)`, so `{{ $value }}` saturated at 500 and a runaway
        # backlog and a nearly-drained one printed the same number. It is a
        # `count(*)` now. Deploy this rule against a wallet older than that fix
        # and the condition is still detected — it is `> 0` — but the number in
        # front of the operator stops being the backlog at 500.
        expr: wallet_deposit_credits_pending > 0
        for: 20m
        labels:
          severity: ticket
          team: wallet
          service: wallet
          sev: "3"
        annotations:
          summary: "{{ $value }} deposit credit(s) claimed and never posted to the ledger"
          description: >-
            Money is on the chain, wallet has claimed it, and the ledger has not
            been told — so the owner's balance does not include it. The retry
            job has been failing to post these for twenty minutes, which means
            the posting is being refused rather than queued. Find out why before
            touching any row: the credits are intact and re-posting is
            idempotent.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-deposit-credits-unposted.md

      # ── THE EXCHANGE DESK, WHICH NOTHING WATCHED AT ALL (micro-org#501) ────
      #
      # Forge Exchange fills a conversion out of a desk: an `exchange`/`inventory`
      # account per asset, funded by hand. `fundDesk` is `requireAdmin` and stays
      # that way — both fundings this estate has booked drew on a USER's
      # available balance, so a service principal able to call it would be a
      # machine that can debit a user without that user's session. The gate is
      # right, and it means the desk can ONLY be refilled by a person, which is
      # what makes the absence of any signal a defect rather than a nicety.
      #
      # Before these two rules the desk could run to zero and nothing anywhere
      # would say so. `convert` throws `desk_inventory_short` BEFORE the
      # conversion route's counter runs, so a refusal moved no series either: the
      # first party to learn the desk was empty was the person holding the 409,
      # and they have no way to tell anyone. Both halves are new — the gauge and
      # the `desk_short` outcome — and neither is useful without the other, for
      # the reason set out on the second rule.
      - alert: ExchangeDeskInventoryLow
        # ── THE LEADING HALF: FUND IT BEFORE ANYBODY IS REFUSED ──────────────
        #
        # `wallet_desk_inventory` is per asset, in WHOLE UNITS. That is not
        # cosmetic: a Prometheus sample is a float64 and the desk's EMBER balance
        # is 2.84e22 wei, four orders of magnitude past the last integer a
        # float64 holds exactly, so a smallest-unit gauge would hand this
        # threshold a silently rounded number.
        #
        # ── WHY THE THRESHOLD IS RELATIVE AND NOT A NUMBER ───────────────────
        #
        # There is no honest absolute here. "Below 100" is a serious warning for
        # BTC and meaningless for SHARD, and the assets do not share a unit — the
        # same objection `LedgerReconciliationDrift` above records against a
        # single `_native` figure. Converting to a common unit needs a price
        # oracle behind an alert threshold, which makes the threshold move with
        # the market.
        #
        # So it is measured against the desk's OWN high-water mark. A desk at a
        # tenth of the most it has held in thirty days is a desk most of the way
        # through whatever the operator last decided it should hold, whichever
        # asset it is and whatever they decided. It self-calibrates when the desk
        # is deliberately resized: fund it smaller on purpose and the peak decays
        # out of the window in thirty days rather than holding a stale ticket
        # open.
        #
        # ── MULTIPLY, DO NOT DIVIDE, AND THAT IS TWO SEPARATE BUGS AVOIDED ───
        #
        # The obvious spelling of "a tenth of the peak" is
        # `inventory / max_over_time(...) < 0.1`. It was written that way first
        # and the promtool cases below rejected it, twice over:
        #
        #   1. `$value` on a comparison is the LEFT side. Under the division it
        #      is the ratio, so the summary read "Exchange desk is down to
        #      0.0703 EMBER" for a desk holding 2,000 — a plausible-looking
        #      number that is not a quantity of anything.
        #   2. `0 / 0` is NaN and `NaN < 0.1` is FALSE. A desk that has been
        #      empty for the WHOLE window — never funded, or drained more than
        #      thirty days ago — is invisible to the ratio. That is the case an
        #      operator most needs to see, and the division is what hides it.
        #
        # Moving the constant to the right fixes both at once: the value stays a
        # balance in whole units, and `0 <= 0.1 * 0` is true, so the empty desk
        # fires without needing a second clause bolted on beside it. Both sides
        # carry identical labels, so the vector match is exact.
        #
        # ── NO `absent()` COMPANION, SAME ARGUMENT AS THE RULE ABOVE ─────────
        #
        # `beforeScrape` writes this on every scrape on every replica, so it
        # cannot go missing while wallet is scraped at all. But it can only
        # publish an asset the desk has a balance ROW for — an asset it was never
        # funded in has no row, no series, and no way for this rule to notice.
        # That gap is why the refusal rule below exists and why it is not
        # optional.
        expr: wallet_desk_inventory <= 0.1 * max_over_time(wallet_desk_inventory[30d])
        # Long, deliberately. Funding the desk is a human action with a ledger
        # entry behind it, and the point of this rule is to give that person lead
        # time rather than to react. A dip that clears inside half an hour did
        # not need anybody.
        for: 30m
        labels:
          severity: ticket
          team: wallet
          service: wallet
          sev: "3"
        annotations:
          summary: "Exchange desk is down to {{ $value }} {{ $labels.asset }}"
          description: >-
            The conversion desk is nearly out of this asset, and it cannot refill
            itself — funding it is an admin action against a real balance. Every
            conversion INTO this asset starts being refused when it reaches zero,
            with a 409 that deliberately does not tell the user why. Decide how
            much the desk should hold before funding it: the figure this fell
            from is the last decision somebody made, not a target.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-exchange-desk-inventory.md

      - alert: ExchangeDeskInventoryShort
        # ── THE TRAILING HALF: IT HAS ALREADY HAPPENED TO SOMEBODY ───────────
        #
        # A conversion was refused because the desk could not fill it. This is
        # the only signal that survives the gauge's blind spot: an asset the desk
        # holds no account in publishes no series, so `wallet_desk_inventory`
        # cannot fall below anything for it and the silence is indistinguishable
        # from health. The route increments this whether or not an account
        # exists.
        #
        # ── WHY IT IS NOT `rate(...) > 0` ───────────────────────────────────
        #
        # Zero conversions have ever been posted on this estate. A rate over a
        # 5m window on a route that sees one request a week is a number that
        # rounds to nothing and a rule that never fires. `increase(...[1h]) > 0`
        # asks the question that matters — did this happen at all — and holds the
        # ticket open for an hour afterwards, which is the operator's window to
        # find it.
        #
        # ── NO ASSET LABEL, AND THAT IS THE SAME DECISION THE 409 MAKES ──────
        #
        # Which asset the desk is out of is a trading signal: it is what somebody
        # would need in order to size an order against the platform's book, and
        # it is precisely what `desk_inventory_short`'s wording withholds from an
        # anonymous caller. `/metrics` is loopback-bound today, but a series is
        # forever and a gateway route is one line — so the counter does not carry
        # it. The operator reads the asset off `wallet_desk_inventory` and off
        # the admin route, both of which are already gated.
        #
        # `sev: "2"` rather than 3: unlike the rule above, a user has already
        # been turned away from a working product, and no retry of theirs fixes
        # it.
        expr: increase(wallet_money_operations_total{route="conversion",outcome="desk_short"}[1h]) > 0
        for: 0m
        labels:
          severity: ticket
          team: wallet
          service: wallet
          sev: "2"
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} conversion(s) refused in the last hour — the desk is out"
          description: >-
            Forge Exchange turned a user away because the desk had nothing to
            fill their conversion with. Nothing is broken and nothing is lost —
            the refusal is checked inside the ledger transaction, so no partial
            posting exists — but the product is not working and only an admin
            funding the desk fixes it. Read `wallet_desk_inventory` to see which
            asset; this series deliberately does not say.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-exchange-desk-inventory.md

  # ==================================================== TICKET — chain ======
  #
  # EMBER'S TWO STANDING DEFECTS, MADE VISIBLE (micro-org#363).
  #
  # The issue records four things. Three of them are RETARGET CHANGES to Hearth
  # — a shorter LWMA window, a tighter solve-time clamp, a lower floor — and
  # none of them is here, deliberately: they change consensus and they are the
  # chain owner's call. The fourth is that on 2026-08-10 nothing in this estate
  # could see either defect happen, and that is what these two rules fix. They
  # are correct whichever way the retarget question is answered, and if it is
  # answered well they go quiet on their own.
  #
  # WHY THEY ARE SCOPED `chain="ember"` AND NOT WRITTEN FOR EVERY CHAIN. Both
  # thresholds are derived from EMBER's own 15 s target and its own measured
  # solve-time distribution. Litecoin targets 150 s and Dogecoin 60 s; one
  # threshold across all three is one threshold that is wrong for two of them.
  # A generic version of these rules needs a per-chain target published as a
  # metric, which is the `indexer_confirmation_depth` pattern and is worth doing
  # if a third proof-of-work chain ever arrives here.
  - name: cf.ticket.chain
    rules:
      - alert: EmberTipNotAdvancing
        # THE WEDGE NOBODY NOTICED. On 2026-08-10 the EMBER tip sat at 11242 for
        # 19 minutes, and later at 11245 for 52 minutes, against a 15 s target.
        # No rule in this file moved. `IndexerChainHalted` stayed 0 — it is a
        # deliberate reorg-policy stop and nothing had halted. `IndexerLagPast-
        # ConfirmationDepth` stayed 0 — the indexer was perfectly in step with a
        # chain that was not moving. `ChainNodeTemplateStale` watches the POOL's
        # Litecoin and Dogecoin templates and has never seen Hearth at all.
        #
        # ── THE TRAP: 15 SECONDS IS THE TARGET, NOT THE STEADY STATE ─────────
        #
        # A threshold derived from `TARGET_BLOCK_TIME` alone fires continuously
        # on a healthy chain, because EMBER at its difficulty floor is HONESTLY
        # slower than its target: total hashrate is about 19-20 H/s against the
        # ~17 H/s a 15 s block at difficulty 256 needs. Measured over the 3,000
        # blocks from 8249 (2026-08-09 12:22:01Z) to 11249 (2026-08-10
        # 20:59:49Z), solve times were mean 39.2 s, median 24 s, p90 85 s,
        # p95 113 s, p99 197 s. A rule at one minute would have fired on 10% of
        # blocks all day and told the reader nothing.
        #
        # ── WHERE 10m + 5m COMES FROM ────────────────────────────────────────
        #
        # `changes(v[W]) == 0` becomes true W after the last block and `for: F`
        # delays it by F more, so this rule fires on a gap of W+F = 15 minutes
        # and on nothing shorter. Fifteen minutes is not a round number picked
        # for being round; it is the empty band in the measured distribution.
        # Over those same 3,000 blocks the gaps sort into two populations with
        # nothing in between:
        #
        #   the routine ones          max 771 s
        #   ── nothing at all between 771 s and 1210 s ──
        #   the three real wedges     1210 s, 1407 s, 3147 s
        #
        # 900 s sits in that gap. Simulated against the mainnet Prometheus's
        # full 28.3 h of `indexer_tip_height{chain="ember"}` history on
        # 2026-08-10, this exact expression and `for:` produce THREE firings —
        # 10:36, 19:30 and 20:02 UTC — which are those same three wedges, and no
        # others. The neighbours were checked and are worse: `[10m]` with
        # `for: 3m` adds a fourth firing that is a 771 s gap the chain healed
        # from, and `[5m]` with `for: 5m` produces seven.
        #
        # ── WHAT THIS METRIC CONFLATES, WHICH THE RUNBOOK MUST SAY ───────────
        #
        # `indexer_tip_height` freezes when the CHAIN stops and it freezes when
        # the INDEXER stops, and this expression cannot tell those apart. That
        # is not a defect to be papered over with a narrower-sounding metric
        # name; it is the honest reading of the only series that exists, and the
        # runbook opens with the one RPC call that separates them. Note also
        # that if the indexer stops being scraped ENTIRELY the series goes
        # absent, `changes()` returns nothing, and this rule goes SILENT rather
        # than firing — `TelemetryComponentDown` is what covers that, and the
        # runbook says to check it first.
        expr: changes(indexer_tip_height{chain="ember"}[10m]) == 0
        for: 5m
        labels:
          severity: ticket
          team: chain
          service: indexer
          sev: "3"
        annotations:
          summary: "EMBER {{ $labels.network }} tip has not advanced in at least 15 minutes"
          description: >-
            No new EMBER block has been indexed for fifteen minutes against a
            fifteen second target. This series freezes for a stalled chain and
            for a stalled indexer alike — ask the node for its own height before
            concluding anything, the runbook has the call. If the node agrees
            the tip is stuck, the usual cause is difficulty left high by
            hashrate that has since gone away, and it resolves itself as the
            retarget walks down; the runbook says how long that has taken
            before, and when to stop waiting.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-tip-not-advancing.md

      - alert: EmberDifficultyAtFloor
        # THE RETARGET IS SATURATED. Measured on mainnet 2026-08-10: of the
        # 3,001 blocks from 8249 to 11249, 2,830 sat at difficulty EXACTLY 256,
        # including one unbroken run of 2,686 blocks over 28.99 h. Over the same
        # window the chain produced a median of 94 blocks per hour against a
        # target of 240. The difficulty adjustment had already given everything
        # it has; the chain is slow because there is not enough hashrate, and no
        # retarget parameter can fix that.
        #
        # ── WHY THE SECOND CLAUSE IS NOT OPTIONAL ────────────────────────────
        #
        # "Difficulty is at the floor" ON ITS OWN IS NOT A DEFECT. The floor is
        # the easiest the chain is allowed to be; a chain sitting there with
        # plenty of hashrate simply mines fast, which is fine, and a rule that
        # fired on that would fire for ever on a healthy chain — the same trap
        # `EmberTipNotAdvancing` above documents, one metric over. The defect is
        # at the floor AND STILL TOO SLOW, which is what the second clause says.
        #
        # 240 is 3600 / TARGET_BLOCK_TIME, and TARGET_BLOCK_TIME is 15 in
        # hearth/node/src/params.js. It is that constant divided by an hour, not
        # a number chosen here — `ChainNodeTemplateStale` derives its 120 from
        # the pool's own constant for the same reason. Measured against it, all
        # 336 five-minute samples of the rolling-hour block count over the 28.3 h
        # the mainnet Prometheus held on 2026-08-10 were BELOW 240: min 2, median
        # 94, mean 92.7, max 216. Stated honestly, the clause has therefore never
        # yet been observed false, so it is a guard against a state the estate
        # has not reached rather than one validated against both outcomes. Its
        # 10% headroom at the observed max is deliberate and it is the point:
        # micro-deploy#53 added a second miner on 2026-08-10, and if that is
        # enough hashrate this alert should CLEAR ITSELF. If EMBER returns to the
        # floor with two miners running and this still fires, the hashrate
        # arithmetic in #363 was wrong and that is worth knowing.
        #
        # `offset 1h` and not `delta(...[1h])`: `delta` extrapolates to the
        # window edges, which invents fractional blocks either side of a real
        # integer count. The trade is that for the first hour after a Prometheus
        # restart the right-hand side has no samples, the whole expression is
        # empty, and this rule is silent. For a ticket about a condition that has
        # stood for 29 hours, an hour of blindness after a restart is the cheaper
        # error; for a page it would not be.
        #
        # `<= 256` and not `== 256`, on purpose. 256 is `MAX_TARGET`, pinned to
        # `GENESIS_TARGET`, in hearth/node/src/params.js — verifiable in one RPC
        # call against any floor block, and NOT published as a metric anywhere.
        # A floor gauge was considered and rejected in micro-indexer's
        # `src/metrics.ts`: the estate's `indexer_confirmation_depth` precedent
        # works because that constant lives in the indexer's own pinned
        # dependency, whereas this one lives in a repository the indexer does not
        # import, so a gauge here would be a second uncoupled copy that goes
        # QUIET if hearth ever lowers the floor. `<=` is the cheap insurance
        # against that: if the floor drops, this rule keeps firing and somebody
        # comes and edits this comment, which is the failure direction to want.
        #
        # `for: 1h`. The condition is a standing state, not an event — the rules
        # header reserves `ticket` for exactly that — so the only thing `for:`
        # buys is not re-opening a ticket the moment a transient excursion above
        # the floor ends. The longest excursion the chain healed from by itself
        # in the measured window was 1,804 s (30 min, 2026-08-10 17:21:14Z to
        # 17:52:51Z). An hour is twice that.
        # `on (chain, network, instance)` and NOT `on (chain, network)`. `and` is
        # a set intersection, so a coarser join asks "is SOME ember series slow?"
        # rather than "is THIS one slow?" — with one indexer replica the two are
        # the same answer and with two they are not. Written the coarse way and
        # fed three synthetic targets in alerts.test.yaml, this rule fired on a
        # target mining at 300 blocks/hour because a different target was slow.
        # `instance` is what makes the two clauses describe the same scrape.
        expr: |
          indexer_chain_difficulty{chain="ember"} <= 256
            and on (chain, network, instance)
          (
            indexer_tip_height{chain="ember"}
              - indexer_tip_height{chain="ember"} offset 1h
          ) < 240
        for: 1h
        labels:
          severity: ticket
          team: chain
          service: indexer
          sev: "4"
        annotations:
          summary: "EMBER {{ $labels.network }} is at its difficulty floor and still below target block rate"
          description: >-
            EMBER difficulty is at 256, the lowest value the chain's parameters
            permit, and it has still produced fewer than 240 blocks in the last
            hour against a 15 s target. The retarget is saturated: it cannot make
            the chain any easier, so blocks stay slow until hashrate arrives.
            This is a capacity decision, not an incident — nothing is broken and
            nothing needs restarting. The runbook has the two levers and what each
            one costs.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-difficulty-at-floor.md

      - alert: EmberDifficultySustainedFarAboveFloor
        # THE OPPOSITE END OF THE AXIS FROM THE RULE ABOVE, and an arm-signal
        # rather than a fault. `EmberDifficultyAtFloor` notices too little
        # hashrate; this notices one miner with far too much — measured
        # 2026-08-12, a single browser tab held difficulty at ~14,000 (55x the
        # floor) and 15 of 16 consecutive blocks. The chain itself is FINE in
        # that state: hearth#13's emergency rule bounds the worst block at
        # ~2 minutes however high difficulty goes. What stops working is
        # browser PARTICIPATION, and micro-org#451's plan gates its later
        # phases (pool aggregation, the PoW-hardness redesign) on exactly this
        # condition being sustained rather than a tab left open over lunch.
        #
        # `/ 256` is the same floor constant `<= 256` above reads, for the same
        # reason and with the same insurance direction: if hearth ever lowers
        # the floor this expression OVERSTATES the multiple and fires earlier,
        # which is the failure direction to want. The named recording rule
        # `cf:ember:difficulty_over_floor` (rules/mining.yaml) is this same
        # arithmetic for dashboards; the alert repeats it inline so it can be
        # tested with this file alone and cannot break if the rule files load
        # in a different order.
        #
        # `for: 6h`, derived from the observed pattern rather than picked: the
        # operator's own mining tab produced exactly this signature for ~3 h on
        # 2026-08-12 and then stopped. A human's session ends; a rented rig or
        # a farmed GPU does not go home in the evening. Six hours filters the
        # first without meaningfully delaying the second — the response is
        # reading a plan, not restarting a service, so hours of latency cost
        # nothing.
        expr: indexer_chain_difficulty{chain="ember"} / 256 > 100
        for: 6h
        labels:
          severity: ticket
          team: chain
          service: indexer
          sev: "4"
        annotations:
          summary: "EMBER {{ $labels.network }} difficulty has been over 100x the floor for six hours"
          description: >-
            A miner far larger than the browsers has been setting EMBER's
            difficulty for six hours. The chain is healthy — the emergency rule
            bounds the worst block at about two minutes — but browser miners
            cannot win blocks at this level, which is the condition the
            micro-org#451 plan gates its later phases on. Nothing is broken and
            nothing needs restarting; the runbook says what decision is due and
            where the plan lives.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-difficulty-sustained.md

      # ── AND DELIBERATELY NO PAGE FOR EITHER OF THESE ────────────────────────
      #
      # The case for paging on a stalled EMBER tip is real and was argued rather
      # than waved away: EMBER is the chain the wallet, the explorer and the
      # mining bar all read, and this estate already pages on the analogous
      # Litecoin condition. Four things decide it the other way.
      #
      # 1. THE LITECOIN PAGE IS NOT ANALOGOUS. `ChainNodeTemplateStale` pages
      #    because miners pointed at the pool are burning electricity on work
      #    that cannot win — other people's money, spent per second, while the
      #    condition lasts. EMBER's two miners are ours.
      # 2. NOTHING A WOKEN HUMAN CAN DO. All three wedges measured on 2026-08-10
      #    resolved with no intervention, the longest in 3,147 s. The recovery is
      #    the LWMA walking difficulty down and it runs on its own schedule; the
      #    only real lever is adding hashrate, which micro-deploy#53 did
      #    permanently and which nobody does at 3 a.m.
      # 3. THE BAR IN THIS FILE'S HEADER. `page` is for user-visible failure or
      #    irreversible money risk. A slow chain delays confirmations in the
      #    explorer and the mining bar; it loses no money and it is entirely
      #    reversible.
      # 4. THE RATE. This condition occurred 3 times in 28.3 h. A page firing
      #    twice a day is a page that is silenced by Friday, which is the exact
      #    argument this file already makes about
      #    `indexer_provider_failures_total` in cf.page.chain, and the silence
      #    would then cover the ticket too.
      #
      # A PAGING ESCALATION AT A LONGER STALL WAS CONSIDERED AND REFUSED, for
      # one reason: its threshold would be unmeasured. The longest stall in the
      # whole retained history is 3,147 s, so any escalation above it has fired
      # zero times and its number would be invention dressed in a comment. WRITE
      # IT WHEN there is a stall this estate did NOT recover from without a
      # human — that observation, and only that, sets the threshold.

      - alert: TestnetChainSeriesMissing
        # THE TWO RULES ABOVE ARE WRITTEN FOR BOTH NETWORKS AND, UNTIL
        # 2026-08-12, COULD ONLY EVER MATCH ONE. `EmberTipNotAdvancing`'s own
        # summary says "EMBER {{ $labels.network }} tip", and
        # `/api/v1/label/network/values` on the mainnet Prometheus answered
        # `["mainnet"]` — not because either rule was scoped, but because this
        # Prometheus was attached to no network the testnet estate is on and no
        # testnet series had ever existed (micro-org#398).
        #
        # `cf-indexer-testnet` in prometheus.yml is what fixed that, and this
        # rule is what stops it rotting back. The failure it guards is the one
        # the whole ticket is about and it is SILENT BY CONSTRUCTION: if that
        # target stops being scraped, `changes()` and the difficulty comparison
        # both return an empty vector, both chain rules go quiet, and quiet is
        # what they look like when testnet is healthy. Nothing else covers it —
        # `TelemetryComponentDown` names five telemetry-plane jobs explicitly,
        # and the two `up` rules beside it name `cf-services`, `custody` and
        # `beacon`. A monitoring gap that closes itself back up unobserved is
        # the same defect twice.
        #
        # `ticket` and sev 4, not a page: nobody is on call for testnet, and the
        # loss is a delayed ticket about a chain no user's money is on. `for:
        # 10m` because the testnet estate is redeployed by hand and a target is
        # legitimately absent for the length of a `docker compose up`.
        # ── WHY THIS NO LONGER WATCHES A SCRAPE ──────────────────────────
        #
        # It used to be `up{job="cf-indexer-testnet"} == 0`, and that job is
        # gone: one pod serves both estates and labels its own series
        # `network`, so there is no second target to be down.
        #
        # The `up` form could not have caught the failure it was written for.
        # When the consolidation turned `indexer.cf-testnet` into a CNAME to the
        # mainnet pod, the target stayed UP and answered — with mainnet's
        # numbers under `estate="testnet"`. Both chain rules went on evaluating,
        # against the wrong network, for five hours, and this alert stayed
        # silent the whole time because its premise was liveness rather than
        # presence (micro-org#516).
        #
        # `indexer_chain_halted` rather than `indexer_tip_height`: the indexer
        # emits one per CONFIGURED chain scope at startup, whereas a tip series
        # appears only after a successful tip read. A testnet chain that is
        # healthy but idle — which EMBER testnet often is, sitting at its
        # difficulty floor — has no tip series and is not a fault. Absence of
        # the halted series means the scope was never configured, which is
        # exactly the defect: `INDEXER_CHAINS` naming no testnet chain.
        expr: absent(indexer_chain_halted{network="testnet"})
        for: 15m
        labels:
          severity: ticket
          team: chain
          service: indexer
          estate: testnet
          sev: "4"
        annotations:
          summary: "The indexer exports no testnet chain series — both EMBER chain rules are blind to testnet"
          description: >-
            No `indexer_chain_halted{network="testnet"}` exists, which means the
            consolidated indexer has no testnet chain scope configured at all.
            While this is true EmberTipNotAdvancing and EmberDifficultyAtFloor
            evaluate against no testnet series, so a frozen testnet chain
            produces silence rather than a ticket. The usual cause is
            INDEXER_CHAINS in compose/env/chain.mainnet.env having lost its
            testnet entries, or env-chain-testnet not being mounted on the pod —
            check `INDEXER_CHAINS` in the running container first.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-testnet-chain-scrape-down.md

  # ===================================================== TICKET — jobs ======
  - name: cf.ticket.jobs
    rules:
      - alert: JobDeadLetterGrowth
        # `jobs_dead_total` is what @cloudsforge/telemetry registers;
        # 13-operational-model.md §5.2 calls it `jobs_dead_lettered_total`.
        # The library wins — see README §Divergences.
        expr: increase(jobs_dead_total[15m]) > 0
        labels:
          severity: ticket
          team: "{{ $labels.service }}"
          sev: "4"
        annotations:
          summary: "{{ $value }} job(s) of kind {{ $labels.kind }} dead-lettered in {{ $labels.service }}"
          description: >-
            A dead letter is work that will never happen unless somebody makes it
            happen. Drain deliberately; replaying blindly is how a double
            withdrawal is created.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-dead-letter-drain.md

      - alert: JobQueueOverdue
        # `jobs_overdue` counts work due more than five minutes ago. It rises for
        # two very different reasons — nothing is claiming, or a worker died
        # holding a lease — and the second is the class of bug that produced the
        # estate's double-billing.
        expr: jobs_overdue > 0
        for: 10m
        labels:
          severity: ticket
          team: "{{ $labels.service }}"
          sev: "4"
        annotations:
          summary: "{{ $labels.service }} has {{ $value }} overdue job(s)"
          description: >-
            Either nothing is claiming, or a worker died holding a lease. Check
            jobs_claimed_total before assuming the queue is idle.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-lease-expiry-storm.md

  # =================================================== TICKET — backup ======
  - name: cf.ticket.backup
    rules:
      - alert: BackupNeverRun
        # THE PAGE ABOVE CANNOT TELL "THE BACKUP IS OLD" FROM "THERE IS NO
        # BACKUP", AND ON THIS ESTATE IT IS THE SECOND ONE.
        #
        # `time() - backup_last_success_unixtime > 129600` needs a series to
        # subtract. With none it produces an empty vector, which never crosses a
        # threshold, so the worst possible state — nothing has ever been backed
        # up — is the one state that page is guaranteed to stay green through.
        # Measured on the mainnet Prometheus on 2026-08-10: zero of 1,329 metric
        # names contain `backup`, `docker ps -a` on the host lists no
        # backup-runner container, and the backup destination holds nothing.
        #
        # `absent()` and NOT `== 0`, which is where this differs from
        # `ConformanceCorpusNeverReplayed` further down. Beacon seeds its suite
        # counters at zero on every scrape, so a `sum() == 0` there means "no
        # suite has run". The backup runner deliberately publishes NO SAMPLE for
        # this gauge until a run has actually succeeded — a zero would be a
        # series claiming the estate was last backed up in 1970, and "very old"
        # is a claim that a backup once happened. Absent is the honest encoding,
        # so `absent()` is the only expression that can read it.
        #
        # THE THREE CAUSES THIS COVERS ARE ALL REAL AND THE RUNBOOK SEPARATES
        # THEM: the runner has never been deployed (today's state); it is
        # deployed and Prometheus is not scraping it — which was itself the case
        # until this release, because `backup-runner` lives in the overlay
        # `compose/docker-compose.backup.yml`, is named by no release manifest,
        # and therefore cannot appear in the file_sd list
        # `render-prometheus-targets.py` generates from the release; or it is
        # running and no run has ever succeeded.
        #
        # A TICKET AND NOT A PAGE, at sev3. It is a standing data-loss exposure
        # rather than an outage, and every fix for it — deploying a container,
        # correcting a scrape, reading a failed run — is a daylight change. A
        # page nobody can act on at three in the morning is how an on-call learns
        # to silence the group, and the group this would be silenced with
        # contains the money pages.
        #
        # `for: 30m` matches `MoneyMetricContractMissing`, which is the same
        # shape: absence, meaning the alert beside it cannot fire. It is long
        # enough to ride out a redeploy of the runner and short enough that a
        # container which failed to come back is noticed the same morning. The
        # boot-time seed is what makes 30m safe — the gauge is repopulated from
        # `backup_runs` as the process starts, not on the next successful run.
        # ── PER INSTANCE, AND THAT IS THE WHOLE POINT OF THE MATCHERS ─────────
        #
        # `absent()` answers about the WHOLE SERIES SET, so the bare
        # `absent(backup_last_success_unixtime)` this used to be went empty the
        # moment ANY runner succeeded anywhere. That was harmless while one
        # estate had a runner and the other had none — and it became a hole on
        # 2026-08-19, when the Kubernetes migration gave testnet a backup runner
        # of its own. From that day a healthy mainnet would have covered for a
        # testnet that never once succeeded: exactly the silent-green this rule
        # exists to remove, reintroduced by a second copy of the thing it
        # watches.
        #
        # So one `absent()` per instance, `or`-ed. `absent()` with matchers
        # returns 1 CARRYING those matchers as labels, so the firing alert names
        # its own estate and the two cannot mask each other. The instances are
        # written out rather than derived because that is what makes ADDING A
        # THIRD RUNNER WITHOUT ADDING A CLAUSE HERE a visible omission instead of
        # a quiet one — there is no expression over an empty set that can notice
        # a runner nobody told it about.
        expr: >-
          absent(backup_last_success_unixtime{instance="backup-runner:4130"})
          or absent(backup_last_success_unixtime{instance="cf-testnet-backup-runner:4130"})
        for: 30m
        labels:
          severity: ticket
          team: platform
          service: backup-runner
          sev: "3"
        annotations:
          summary: "Nothing has ever backed {{ $labels.instance }} up, and the backup page cannot say so"
          description: >-
            No series exists for backup_last_success_unixtime on
            {{ $labels.instance }}, so BackupAgeExceeded is green for it because
            there is nothing to compare rather than because a backup is recent.
            Establish which of the three states this is — no runner, no scrape,
            or no successful run — before touching anything.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-backup-never-run.md

      - alert: MinerCoinbaseKeyUnbacked
        # A GREEN BACKUP THAT CONTAINS NO KEY, WHICH IS THE ONLY ARTEFACT IN THE
        # SET THAT CANNOT BE REBUILT FROM ANYTHING (micro-org#206).
        #
        # Every other artefact this runner writes has a second source of truth
        # somewhere. A database dump can be re-dumped, a volume re-archived, a
        # vault blob re-read. The miner coinbase key is the one file whose loss
        # is permanent and priced: the mainnet address `0x980d…5b45` and the
        # app host's second miner between them hold 65,099.909467 EMBER, and
        # `docs/custody-backup-restore.md` §4.2 step 6 states the key "cannot be
        # rotated without abandoning the balance at the address".
        #
        # ── WHY THIS NEEDED AN ALERT AND NOT A BETTER LOG LINE ────────────────
        #
        # It has already failed silently once, for weeks, in the state that looks
        # most like success. `run.ts` asked for `coinbase-key.json` by name; the
        # seal that closed the plaintext-at-rest half of #206 left only
        # `coinbase-keystore.json`; the read took the ENOENT branch, whose
        # warning was *"nothing to encrypt"* and whose comment read *"On an
        # estate with no miner this is normal."* The estate has two miners.
        # Measured on mainnet 2026-08-12: `backup_artefacts` held 264 rows — 240
        # `database`, 16 `files`, 8 `vault` — and ZERO of kind `secrets`, ever,
        # the whole time `BackupAgeExceeded` and `BackupNeverRun` were satisfied.
        #
        # That is the precise failure both existing backup rules are blind to by
        # construction: they watch WHETHER a run finished and HOW OLD it is, and
        # a run that quietly omits the one irreplaceable file finishes on time.
        #
        # `== 0` AND NOT `absent()`, which inverts the reasoning in
        # `BackupNeverRun` directly above and is worth stating because the two
        # rules sit adjacent. Absence here is not the bad state — the runner
        # publishes no sample for this gauge until a full run has classified the
        # key, so absent means "not yet known", which `BackupNeverRun` already
        # covers from the other side. Zero is a positive claim by the runner that
        # it looked and there was nothing to encrypt. The one exception is seeded
        # explicitly: with `BACKUP_AGE_RECIPIENT` unset the runner sets this to 0
        # at boot, because that configuration guarantees no key will ever be in a
        # set and there is no reason to make the estate wait a night to hear it.
        #
        # TICKET AT SEV3, matching `BackupNeverRun`. It is a standing exposure,
        # not an outage — nothing is broken while it fires, and everything that
        # fixes it (generate an age identity off-host, set the recipient, check
        # the mount) is a daylight change made by a human with the identity in
        # hand. Paging on it at three in the morning teaches an operator to
        # silence a group that also contains the money pages.
        #
        # `for: 30m` for the same reason as the rule above: long enough that a
        # redeploy of the runner cannot fire it, short enough that a set which
        # came back without the key is noticed the same morning.
        expr: backup_secrets_included == 0
        for: 30m
        labels:
          severity: ticket
          team: platform
          service: backup-runner
          sev: "3"
        annotations:
          summary: "The last backup contained no miner coinbase key — the one artefact that cannot be rebuilt"
          description: >-
            Backups are running and green, and the encrypted coinbase key is not
            in them. Either BACKUP_AGE_RECIPIENT is unset — in which case there
            is no path that writes a key at all, by design — or neither
            coinbase-keystore.json nor coinbase-key.json was found where the
            runner looked. Losing that key abandons the balance at the address;
            no other artefact in the set has that property.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-miner-coinbase-key-backup.md

  # ====================================================== TICKET — SLO ======
  - name: cf.ticket.slo
    rules:
      - alert: SLOErrorBudgetBurnSlow
        # BOTH TIERS, EXPLICITLY. `cf:slo_burn_rate:6h` used to cover every
        # service because it was unfiltered, and it is now `{tier="2"}` — the
        # Tier-2 objective applied to Tier-2 services, which is what it always
        # claimed to be (micro-org#308). Without the second half of this
        # expression, that change would have silently removed the slow-burn
        # ticket from ledger, wallet, settlement, custody, indexer, pricing and
        # policy: a monitoring change that reduces coverage of the money path
        # and reports nothing is the failure this whole issue is about.
        #
        # `or` and not a single series, because the two are divided by different
        # budgets. 6x of a 99.95% budget and 6x of a 99.5% one are different
        # absolute error rates, and that is the point of having two tiers.
        expr: cf:slo_burn_rate:6h > 6 or cf:slo_burn_rate_tier1:6h > 6
        for: 30m
        labels:
          severity: ticket
          team: "{{ $labels.service }}"
          sev: "3"
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.network }} is burning budget at {{ $value | printf \"%.1f\" }}x over 6h"
          description: >-
            Not a page. At 50% consumed this becomes a ticket named in the weekly
            review; at 75% reliability work outranks features; at 100% the
            service is frozen to fixes only.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-rollback-release.md

  # ================================================== TICKET — telemetry ====
  - name: cf.ticket.telemetry
    rules:
      - alert: MailSentToReservedDomain
        # ── AN ALERT WHOSE THRESHOLD IS ZERO, BECAUSE ITS EVENT IS IMPOSSIBLE ──
        #
        # `notify` declines to ROUTE email to a domain the standards reserve
        # (`.test`, `.example`, `.invalid`, `.localhost`, and the RFC 2606
        # documentation domains) — the rule lives in `reserved.ts` and runs in
        # `pipeline.ts`, before a delivery row is written. The adapter keeps its
        # own guard as a backstop. That backstop firing means the routing rule
        # did not run, which has exactly three causes: a row written before the
        # rule shipped, a caller building an OutboundMessage some other way, or
        # A BUILD THAT LOST THE RULE.
        #
        # The third one is not hypothetical. Measured on mainnet 2026-08-11:
        # 1,535 of 1,552 email deliveries over seven days went to `beacon.test`,
        # because the deployed `notify` process predated a rule that had been
        # merged since 2.4.0 and verified — on TESTNET. The estate found out
        # from a provider dashboard reading 241 against a 150/day allowance, six
        # days and one exhausted allowance later, during which a real visitor's
        # verification mail could not be delivered at all. micro-org#390.
        #
        # ── WHY `> 0` AND NOT A RATE ─────────────────────────────────────────
        #
        # Every other mail alert here is a rate, because mail failures are
        # normal at some level. This one is not: the estate's synthetic monitor
        # registers ~2,250 accounts a day under `beacon.test`, so the CORRECT
        # value of this counter is exactly zero forever, and any increase at all
        # means the thing that spends the whole allowance in an afternoon has
        # started again. A rate threshold would wait for the damage it exists to
        # prevent.
        #
        # sev2 rather than sev3: the allowance is shared with every real
        # recipient, and the first genuine signup is the one whose verification
        # link lands in the exhausted window and can never be clicked.
        expr: increase(notify_failed_total{channel="email",reason="reserved_domain"}[1h]) > 0
        for: 0m
        labels:
          severity: ticket
          team: platform
          service: notify
          sev: "2"
        annotations:
          summary: "notify attempted mail to a reserved domain — the routing rule is not running"
          description: >-
            The adapter backstop in notify refused an address under a reserved
            domain. On the live path nothing should ever reach it, because
            pipeline.ts declines to route email there first. Check that the
            RUNNING notify container carries reserved.ts — read the container,
            not the repo; the last time this happened the fix was merged and the
            process was older. Then check the provider's remaining daily
            allowance before assuming mail is otherwise healthy.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

      - alert: MailRoutedToReservedDomain
        # ── THE ONE ABOVE CANNOT FIRE FOR THE CAUSE IT NAMES. THIS ONE CAN. ──
        #
        # `MailSentToReservedDomain` watches the BACKSTOP in notify's email
        # adapter. Measured on mainnet 2026-08-11, that counter is zero over
        # seven days — and it is zero structurally, not happily: pipeline.ts
        # drops the email channel before a delivery row is written, so on the
        # live path nothing ever reaches the backstop. It fires only for a
        # PARTIAL regression, where the routing call site is removed and the
        # adapter guard survives.
        #
        # The regression that actually happened was the whole one. The deployed
        # process was an older image that contained NEITHER guard, so nothing
        # incremented, and the alert above would have stayed inactive through
        # all six days and all 1,535 messages. micro-org#390.
        #
        # This watches the delivery ROWS instead — ground truth, from notify's
        # own table, and true whatever the code believes about itself. A row
        # exists the moment routing returns `email` for an address the DNS root
        # guarantees can never resolve.
        #
        # ── ROWS AND NOT SENDS ───────────────────────────────────────────────
        #
        # Of the 1,535 rows measured, 418 were ever `sent`; the other 1,117 died
        # against an allowance the first 418 had already emptied. A gauge of
        # sends would have seen a quarter of the damage and would have gone
        # QUIET at the moment it got worst, because the evidence that mail is
        # leaking is destroyed by the mail having already leaked.
        #
        # `> 0` and not a rate, for the reason the alert above gives: the
        # correct value is zero forever.
        expr: notify_deliveries_reserved_domain > 0
        for: 0m
        labels:
          severity: ticket
          team: platform
          service: notify
          sev: "2"
        annotations:
          summary: "notify ROUTED mail to a reserved domain — the rule is not running in the deployed build"
          description: >-
            notify wrote at least one email delivery in the last hour whose
            recipient is under a domain the standards reserve. This is measured
            from the delivery table, so it is what happened and not what the
            code claims. Read the RUNNING container's build, not the repository
            — the last time this occurred the fix had been merged for six days
            and the process was older. Then check the provider's remaining daily
            allowance before assuming mail is otherwise healthy.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

      - alert: NotifyReservedDomainGuardLost
        # The same question asked BEFORE any mail is sent, which is the only way
        # to answer it in minutes rather than in messages.
        #
        # notify answers `notify_reserved_domain_guard` at every scrape by
        # driving its real routing function with a canary address under a
        # reserved TLD: 1 if this process refuses, 0 if it would send. A build
        # that lost the rule reports 0 on its first scrape, before a single
        # notification has been created.
        #
        # ── `absent()` IS HALF THE ALERT, NOT A FLOURISH ─────────────────────
        #
        # A build old enough to have lost the rule has lost this metric with it,
        # and then `== 0` matches nothing at all — the same unfireable shape as
        # the alert above. Absence IS the evidence in that case. It is qualified
        # on notify being up, so a notify that is simply down pages as NotifyDown
        # and not as this; a service that is not running is not sending mail to
        # anybody.
        #
        # ── AND THE QUALIFIER IS `service=`, NOT `job=` ──────────────────────
        #
        # This half shipped as `up{job="notify"} == 1`, and `job="notify"` does
        # not exist. Every application service in this estate is scraped by ONE
        # file_sd job — `cf-services` — which relabels `__meta_cf_service` into
        # `service`. The real target is
        # `up{job="cf-services",service="notify",instance="notify:4000"}`, and
        # `up{job="notify"}` selects nothing at all.
        #
        # So the half of the alert written for "the metric is absent" was itself
        # absent: `== 0` matches nothing when there is no series, and `unless`
        # over an empty left side is empty too. Measured on mainnet 2026-08-11,
        # `up{job="notify"}` returned NO SERIES while notify was up and healthy.
        # The unit tests passed throughout, because their `input_series` invented
        # `job="notify"` — a fixture is free to fabricate a label set the estate
        # never produces, and this one did. `scripts/check-alert-job-labels.py`
        # now reads both files against `prometheus.yml`'s `job_name`s so a
        # selector no target can satisfy cannot merge again.
        #
        # `for: 10m` on the absent half and not 0m, because a rolling deploy
        # legitimately has no notify series for a few scrapes and a page on
        # every release is a page nobody reads.
        #
        # ── `service="activity"`, AND THAT IS NOT A TYPO ─────────────────────
        #
        # Wave M2 of `docs/service-merge-plan.md` put notify's code inside
        # micro-activity's process, so `notify` is no longer a scrape target and
        # `up{job="cf-services", service="notify"}` selects NO SERIES — the exact
        # unfireable shape this expression already had once, when it shipped as
        # `up{job="notify"}` and returned nothing on mainnet while notify was up
        # and healthy (2026-08-11). The label had to follow the process.
        #
        # The metric name is doing the identifying work either way:
        # `notify_reserved_domain_guard` is emitted by the notify module and by
        # nothing else, so the first half of this expression is unaffected by the
        # merge. This half exists only to tell "the guard series vanished because
        # the process is down" apart from "the guard series vanished while the
        # process is up", and it is the PROCESS that moved.
        expr: >-
          notify_reserved_domain_guard == 0
          or (up{job="cf-services", service="activity"} == 1 unless notify_reserved_domain_guard)
        for: 10m
        labels:
          severity: ticket
          team: platform
          service: notify
          sev: "2"
        annotations:
          summary: "the running notify build does not refuse mail to reserved domains"
          description: >-
            notify reports that its routing path would accept an address under a
            reserved TLD, or is not reporting the guard at all — which for this
            metric means a build predating it. Either way the deployed process
            is one that can empty the mail allowance on synthetic addresses in
            an afternoon. Compare the container's image digest against the
            release manifest; do not read the repository, which was right the
            last time this happened and had been for six days.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

      - alert: BeaconScrapeFailing
        # Beacon gates /metrics behind auth. The most likely cause of this alert
        # is not that Beacon is down — it is that BEACON_TOKEN is unset or the
        # token file is stale, which is a silent condition that would otherwise
        # present as "the journey panels are empty" three weeks later.
        expr: up{job="beacon"} == 0
        for: 10m
        labels:
          severity: ticket
          team: platform
          service: beacon
          sev: "3"
        annotations:
          summary: "Prometheus cannot scrape Beacon"
          description: >-
            Beacon's /metrics needs an x-beacon-token. Check
            prometheus/secrets/beacon_token and BEACON_TOKEN on the Beacon
            container before assuming Beacon itself is down — Beacon holds live
            state in memory and stays up through a Postgres outage.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md

      - alert: TelemetryComponentDown
        expr: up{job=~"otel-collector|tempo|loki|alertmanager|grafana"} == 0
        for: 5m
        labels:
          severity: ticket
          team: platform
          sev: "3"
        annotations:
          summary: "{{ $labels.job }} is down"
          description: >-
            Part of the observability plane has stopped. Everything downstream of
            it is now reporting silence, which is not the same as health.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md

      - alert: BeaconJourneyStale
        # A journey that stopped running reports its last status forever. A green
        # grid can mean the scheduler died, and no status metric says so.
        expr: cf:journey_staleness_seconds > 3600
        for: 15m
        labels:
          severity: ticket
          team: platform
          service: beacon
          sev: "3"
        annotations:
          summary: "Journey {{ $labels.journey }} has not run for {{ $value | humanizeDuration }}"
          description: >-
            The grid is showing a stale pass. Beacon's scheduler has stopped
            running this journey; its last result is not evidence of anything.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md

      - alert: MoneyMetricContractMissing
        # The rule that stops a missing metric reading as a healthy system.
        #
        # Every money alert above evaluates to nothing if its metric is never
        # published — no series, no alert, a green dashboard and a silent page.
        # That is the exact shape of the estate's current problem, where "no
        # metrics scraped anywhere" presents as no alerts firing. `absent()`
        # inverts it: not publishing the metric is itself the alert.
        expr: absent(ledger_trial_balance_delta) or absent(withdrawal_stuck) or absent(indexer_lag_blocks)
        for: 30m
        labels:
          severity: ticket
          team: platform
          sev: "4"
        annotations:
          summary: "A money-integrity metric is not being published by anything"
          description: >-
            ledger_trial_balance_delta, withdrawal_stuck or
            indexer_lag_blocks has no series. The alerts that depend on it are
            deployed and cannot fire. Expected until ledger, settlement and
            indexer ship (P4/P5) — after that it means instrumentation regressed.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-metric-contract-missing.md

  # =================================================== TICKET — conformance =
  - name: cf.ticket.conformance
    rules:
      - alert: HearthConformanceVectorsFailing
        # Beacon reports a suite it could not run under result="skipped" and
        # never under "passed", so this counts real failures only.
        expr: beacon_conformance_vectors{result="failed"} > 0
        for: 30m
        labels:
          severity: ticket
          team: chain
          service: hearth
          sev: "4"
        annotations:
          summary: "{{ $value }} EVM conformance vector(s) failing in suite {{ $labels.suite }}"
          description: >-
            A non-zero failed count blocks the next Hearth release. No component
            is done until its vectors pass.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-hearth-node-down.md

      - alert: ConformanceCorpusNeverReplayed
        # THE RULE ABOVE CANNOT TELL "NOTHING IS BROKEN" FROM "NOBODY LOOKED".
        #
        # `beacon_conformance_vectors{result="failed"} > 0` is silent in both
        # cases, and on 2026-08-09 the estate was in the second one: the metric
        # was absent from the scrape entirely, because beacon only publishes
        # vector counts for suites that have actually run. Zero suites had. The
        # conformance gate that blocks a Hearth release was therefore green by
        # virtue of never having been asked a question.
        #
        # `beacon_conformance_suites{status}` exists precisely to answer this and
        # is published UNCONDITIONALLY — beacon seeds pass/fail/skip at 0 on
        # every scrape whether or not a suite has run, which is what makes a sum
        # of exactly zero mean "no suite has ever completed" rather than "no
        # scrape happened". `absent()` covers the third case, beacon not
        # publishing at all, which `sum()` over an empty vector cannot: an empty
        # vector summed is no series, and no series never crosses `== 0`.
        #
        # `for: 1h` and not minutes. A replay is a scheduled batch, not a
        # continuous signal, and the corpus is legitimately un-replayed across a
        # restart, a redeploy or a quiet morning. An hour is short enough to
        # notice a runner that has silently stopped and long enough not to page
        # anyone for a deploy — and this is a ticket at sev4 in any case, because
        # an unreplayed corpus is a gate that is not being enforced, not an
        # estate that is down.
        expr: absent(beacon_conformance_suites) or sum(beacon_conformance_suites) == 0
        for: 1h
        labels:
          severity: ticket
          team: chain
          service: beacon
          sev: "4"
        annotations:
          summary: "No conformance suite has ever completed — the release gate is unenforced"
          description: >-
            Beacon reports zero conformance suites in every status. The
            HearthConformanceVectorsFailing rule beside this one is therefore
            green because nothing has been compared, not because nothing has
            diverged. Find the runner, not the divergence.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-conformance-corpus-never-replayed.md

      - alert: ConformanceCorpusStale
        # THE RULE ABOVE STOPPED BEING ABLE TO CATCH ANYTHING ON 2026-08-12.
        #
        # It asks whether a suite has EVER completed, and on that day one did:
        # micro-org#439 was closed by a `conformance-runner` container that
        # replays the corpus on start and daily after that, and eight suites went
        # to `pass`. `sum(beacon_conformance_suites) == 0` can never be true again
        # short of a database restore — and beacon's suite gauge is
        # `distinct on (suite) ... order by suite, ts desc`, THE NEWEST ROW PER
        # SUITE AND NOTHING ABOUT ITS AGE. So a runner that dies, loses its
        # account, or wedges mid-replay leaves eight `pass` suites standing for
        # ever, and every conformance rule in this group stays green off a
        # measurement that stopped happening. That is the same failure the ticket
        # was about, reached by a second route, and the never-ran rule cannot see
        # it.
        #
        # `beacon_conformance_last_run_timestamp_seconds{suite}` is the series
        # that can: ONLY A REAL PUBLISHED RUN MOVES IT. It is also why the runner
        # has no healthcheck of its own — a container that reports itself healthy
        # while publishing nothing is precisely the bug, and a timestamp it cannot
        # advance without having compared something is not.
        #
        # 36h, against a 24h schedule. One whole missed replay plus half a day of
        # slack, so a slow install, a restart, or a deploy that happens to land at
        # the wrong moment does not raise a ticket, while a runner that has truly
        # stopped is noticed within a day and a half. `for: 1h` on top of that,
        # for the same reason the rule above carries it: a replay is a scheduled
        # batch, not a continuous signal.
        #
        # PER SUITE, deliberately. A suite dropped or renamed in the corpus keeps
        # its last row in `conformance_runs` for ever and will go stale on its own
        # while the rest stay fresh — which is a true and useful thing to be told,
        # because a suite that silently stopped being covered is a gate that
        # quietly narrowed. The fix is to delete the row, not to widen this.
        expr: time() - beacon_conformance_last_run_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: ticket
          team: chain
          service: beacon
          sev: "4"
        annotations:
          summary: "Conformance suite {{ $labels.suite }} has not been replayed in over 36h"
          description: >-
            The scheduled runner replays every suite daily. This one's last
            published run is older than a missed cycle, so its status — and the
            HearthConformanceVectorsFailing rule beside it — is reporting a
            measurement that stopped happening rather than a comparison that
            passed. Find the runner, not the divergence.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-conformance-corpus-never-replayed.md

      - alert: BeaconTargetDown
        # Beacon's own hysteresis has already been applied here — this is the
        # reported state, the same value the status grid shows, so a `for:` of
        # 5m is the second filter and not a duplicate of the first.
        expr: beacon_target_up == 0
        for: 5m
        labels:
          severity: ticket
          team: platform
          sev: "3"
        annotations:
          summary: "Beacon reports {{ $labels.target }} ({{ $labels.group }}) down"
          description: >-
            A single target degrading is a ticket. It becomes a page only when a
            journey fails, because a journey is what says a user is blocked.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md
