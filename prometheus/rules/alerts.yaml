# Alerting rules.
#
# THE RUNBOOK RULE (13-operational-model.md §9). Every rule below carries a
# `runbook_url`. An alert without one is deleted, not silenced, because an
# unactionable page teaches the on-call to ignore pages — and the pages that
# matter here are about somebody's money. CI enforces it:
#
#   yq '.groups[].rules[] | select(.alert) | select(.annotations.runbook_url == null)' \
#     prometheus/rules/alerts.yaml
#
# must return nothing, and every URL must resolve.
#
# PAGE VS TICKET. `severity: page` wakes a human, and only for user-visible
# failure or irreversible money risk. `severity: ticket` is everything else.
# A metric says "p99 is high"; a journey says "a user cannot withdraw". Page on
# the second. Alertmanager routes on this label and on `team`, both mandatory.
#
# METRICS THAT DO NOT EXIST YET. The money and chain rules reference metrics
# that ledger, wallet, settlement, custody and indexer must emit — those
# services are P4/P5 and are not written. Those rules are the CONTRACT: a
# service that does not emit `ledger_trial_balance_delta` fails an alert that is
# already deployed and already has a runbook, rather than shipping and then
# being instrumented. The `MoneyMetricContractMissing` rule at the bottom is
# what stops a missing metric reading as a healthy system, which is the failure
# mode this whole design exists to prevent.

groups:
  # ======================================================== PAGE — money ====
  - name: cf.page.money
    rules:
      - alert: LedgerTrialBalanceNonZero
        # Sum of debits minus sum of credits. Double-entry has exactly one
        # invariant and this is it. Non-zero does not mean a number is off — it
        # means the accounting is not accounting, and every balance derived from
        # it is unproven, including the ones users are looking at.
        expr: ledger_trial_balance_delta != 0
        for: 2m
        labels:
          severity: page
          team: ledger
          service: ledger
          sev: "1"
        annotations:
          summary: "Trial balance is {{ $value }} for {{ $labels.currency }} — it must be exactly 0"
          description: >-
            Σ debits − Σ credits is non-zero on the {{ $labels.currency }} journal.
            No balance in the platform is trustworthy until this is 0. Do not
            correct it with an UPDATE; an adjustment is a new balanced entry
            under dual approval.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-trial-balance-nonzero.md

      - alert: WithdrawalStuck
        # Pages on >= 1, not on a rate. One user unable to get their money out
        # is the failure this platform is least allowed to have, and it is
        # invisible to every latency and error-rate metric — the request
        # succeeded, the money did not move.
        #
        # `withdrawal_stuck`, NOT `withdrawal_stuck_total`, RENAMED 2026-08-10.
        # This expression is a LEVEL — it asks whether any withdrawal is stuck
        # right now, and runbook-stuck-withdrawal expects the page to clear once
        # an operator adjudicates. `_total` promises a monotonic counter to
        # `rate()`, to `increase()` and to Grafana's unit picker, and a counter
        # under `>= 1` is a page that fires on the estate's first stuck
        # withdrawal and can never be resolved without editing this file.
        #
        # Renamed here and in micro-settlement in the same release because this
        # rule had been evaluating against NO SERIES since the alerting plane was
        # written: settlement exports the metric for the first time in this
        # release, so there is no history to break and no migration to run. Every
        # later moment costs one. Do not repoint this at
        # `settlement_stuck_total{chain,purpose}`, which IS a real monotonic
        # transition counter and is exactly what must not be read with `>= 1`.
        expr: withdrawal_stuck >= 1
        for: 5m
        labels:
          severity: page
          team: settlement
          service: settlement
          sev: "1"
        annotations:
          summary: "{{ $value }} withdrawal(s) stuck on {{ $labels.chain }}"
          description: >-
            A withdrawal has been in pending, signed or broadcast longer than the
            chain's policy allows. Freeze before diagnosing: freezing is
            reversible, a duplicated payout is not.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-stuck-withdrawal.md

      - alert: AssetWithdrawalsFrozen
        # Reconciliation freezes an asset when it cannot PROVE the chain backs
        # the liability, and a frozen asset is a user who cannot withdraw. That
        # is the same user-visible money failure WithdrawalStuck names, arriving
        # by the opposite route: nothing is stuck, because nothing was accepted.
        #
        # THIS IS THE RULE THAT WOULD HAVE CAUGHT micro-org#307. On 2026-08-09
        # litecoind stopped answering its own RPC — "work queue depth exceeded",
        # with idle workers and no connections — reconciliation could not observe
        # LTC, and LTC withdrawals were frozen for about thirty minutes. Every
        # deployed rule stayed green for all of it: the indexer was up, the
        # ledger was up, and `indexer_lag_blocks` was zero because a chain nobody
        # can read produces no lag. The money consequence was the only honest
        # signal in the estate and nothing was watching it.
        #
        # `for: 20m` is deliberate and not a round number. The reconciliation
        # sweep runs every 15 minutes and ONLY an exactly-clean observed run
        # lifts a freeze, so 20m rides out one full self-healing cycle and fires
        # on the second — while still firing inside a thirty-minute outage.
        #
        # No `by (asset)`: the gauge carries no labels, because it is the length
        # of `listFreezes(...)`. The runbook opens with the query that names
        # them, which is where that belongs — the answer is a row in
        # `asset_freezes`, not a label Prometheus would carry for every asset
        # the platform will ever list.
        expr: ledger_assets_frozen > 0
        for: 20m
        labels:
          severity: page
          team: ledger
          service: ledger
          sev: "2"
        annotations:
          summary: "{{ $value }} asset(s) have withdrawals frozen by reconciliation"
          description: >-
            Withdrawals are stopped on at least one asset because reconciliation
            could not prove the chain backs it. Read the reason before touching
            anything: an unobservable chain and a real drift are different
            mornings, and only one of them is about the money.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-reconciliation-drift.md

  # ====================================================== PAGE — custody ====
  - name: cf.page.custody
    rules:
      - alert: CustodyUnreachable
        # Custody is permanently single-replica (AD-18) and that is accepted, so
        # its availability objective is deliberately the lowest in the estate at
        # 99.5%. Accepted does not mean unwatched: while it is down, deposits
        # still land and withdrawals and sweeps queue, and that degradation is
        # supposed to be visible on the public status page rather than
        # discovered by a user whose withdrawal is silent.
        expr: up{job=~"cf-services|custody", service="custody"} == 0
        for: 2m
        labels:
          severity: page
          team: security
          service: custody
          sev: "1"
        annotations:
          summary: "Custody has not answered for 2 minutes"
          description: >-
            Signing is unavailable. Withdrawals and sweeps queue; deposits are
            unaffected. Confirm the queue is queuing and not failing, and put the
            degradation on the status page before users find it.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-custody-unreachable.md

  # ======================================================== PAGE — chain ====
  - name: cf.page.chain
    rules:
      - alert: IndexerLagPastConfirmationDepth
        # Compared against the chain's OWN confirmation depth, published as a
        # metric by the indexer, rather than against a constant. Hearth's depth
        # is 60 and Bitcoin's is not; one threshold for both is one threshold
        # that is wrong for one of them.
        #
        # Past this point deposits are provably not being credited — it is a
        # user-visible money failure wearing an infrastructure metric's clothes.
        expr: indexer_lag_blocks > on (chain) group_left indexer_confirmation_depth
        for: 10m
        labels:
          severity: page
          team: indexer
          service: indexer
          sev: "2"
        annotations:
          summary: "Indexer is {{ $value }} blocks behind on {{ $labels.chain }}, past its confirmation depth"
          description: >-
            Deposits on {{ $labels.chain }} are not being credited. Check
            provider health before restarting anything — a failover loop looks
            identical to a stalled worker in this metric.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-indexer-lag.md

      # ── ChainHeightSpreadSustained WAS HERE AND IS RETIRED (2026-08-10) ──────
      #
      #   expr: beacon_chain_height_spread > 3   for: 15m   page · sev2
      #
      # It could not fire, and it could not have fired on any day of its life.
      # `beacon_chain_height_spread` is registered by nothing: `grep -rn
      # chain_height_spread beacon/src` returns zero hits, so no scrape has ever
      # produced the series and the expression has always evaluated over an empty
      # vector. A rule in that state is worse than no rule — it is a green row on
      # the alert list that reads as "Hearth forks are covered".
      #
      # AND THE METRIC COULD NOT BE MADE HONEST BY WRITING IT. A spread is
      # max(height) − min(height) across nodes, and exactly ONE Hearth full node
      # runs in this estate (`cf-hearth-seed`). One node's spread is 0 by
      # construction, forever, whatever the chain is doing. Publishing that zero
      # would convert an alert that cannot fire into an alert that reports
      # agreement it never checked, which is the same failure with a worse tell.
      #
      # RESTORE IT WHEN, AND ONLY WHEN, there are at least two Hearth full nodes
      # per network AND beacon registers the gauge over them. Both halves are
      # required: two nodes with no metric is this rule again, and one node with a
      # metric is a lie. `runbook-hearth-fork.md` is deliberately KEPT — a fork is
      # still a real incident with a real procedure, it is simply not something
      # this estate can currently detect automatically, and that runbook now says
      # so at the top and names how a fork is actually noticed today.

      - alert: ChainNodeTemplateStale
        # A CHAIN NODE THAT HAS STOPPED ANSWERING, MEASURED WHERE IT COSTS
        # SOMETHING (micro-org#307).
        #
        # The pool asks its node for a block template every ten seconds. When the
        # node stops answering, this age climbs and every miner pointed at the
        # estate is burning electricity on work that can no longer win — which is
        # the first place an unreachable node becomes visible to a person.
        #
        # 120 IS NOT A THRESHOLD CHOSEN HERE. It is the pool's own
        # `TEMPLATE_STALE_AFTER_MS` (pool/src/template.ts), documented there as
        # the staleness at which /readyz stops claiming the chain works. Copying
        # the constant into this file would be a second answer to one question;
        # comparing against the pool's own line is the same number by
        # construction, and if the pool changes its mind this rule follows.
        #
        # `for: 5m` comes from the 5.7h of mainnet history Prometheus held on
        # 2026-08-10: 2.87% of samples above 120s, p99 206s, mean 38s, max 359s,
        # and the longest single unbroken run above 120s about 240s. Five minutes
        # clears every benign excursion measured, and the 2026-08-09 wedge
        # produced no template at all for roughly twenty minutes.
        expr: pool_template_age_seconds > 120
        for: 5m
        labels:
          severity: page
          team: pool
          service: pool
          sev: "2"
        annotations:
          summary: "No fresh {{ $labels.chain }} block template for {{ $value | humanizeDuration }}"
          description: >-
            The pool's {{ $labels.chain }} node has stopped serving templates.
            Miners are hashing on work that cannot win. Ask the node directly
            before restarting the pool — a wedged RPC answers the CLI instantly
            and refuses HTTP, which looks identical to a pool bug from here.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-chain-node-unreachable.md

      - alert: IndexerChainHalted
        # A HALT IS NOT UNREACHABILITY, and the distinction is the whole reason
        # this rule is not the one above. `indexer_chain_halted` is set when a
        # reorg deeper than the chain's policy allows stopped the follower on
        # purpose; it is cleared by an operator and never by waiting. A node that
        # is merely unreachable leaves this at 0 forever.
        #
        # It pages because crediting has stopped on that chain and the ledger
        # will freeze the asset behind it within two sweeps, so the alternative
        # is discovering it from AssetWithdrawalsFrozen forty minutes later with
        # the cause already scrolled off.
        #
        # `for: 5m` and not shorter: the gauge is set by the follower loop, and a
        # halt that clears inside one loop was a read the follower retried.
        expr: indexer_chain_halted > 0
        for: 5m
        labels:
          severity: page
          team: indexer
          service: indexer
          sev: "2"
        annotations:
          summary: "Indexer has halted {{ $labels.chain }} on {{ $labels.network }}"
          description: >-
            A reorg past the policy depth stopped the follower deliberately.
            Deposits on {{ $labels.chain }} are not being credited and only an
            operator clears this. Do not restart the indexer to make it go away —
            establish the common ancestor first.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-reorg-recovery.md

      # ── AND DELIBERATELY NO RULE ON indexer_provider_failures_total ──────────
      #
      # The obvious alert for "a chain node is unreachable" is a rate of RPC
      # failures, and on this estate it cannot be written honestly. Measured on
      # mainnet on 2026-08-10 over the 5.7h Prometheus held:
      #
      #   increase(indexer_provider_failures_total[5m])   p99 56, max 76
      #   the same window on 2026-08-09, mid-wedge        about 78
      #
      # Routine and outage are the same number. 285 failures accrued in 24h
      # against a node that answers `litecoin-cli` instantly, so the counter is
      # measuring the indexer's own retry behaviour rather than the node's
      # reachability, and every threshold above the noise is also above the
      # signal. A rule written on it today would page hourly and be silenced by
      # Friday, which is worse than the absence it appears to fix. Making the
      # counter mean something is a change in micro-indexer, not a threshold
      # here; the three rules that carry #307 are the ones above, which measure
      # the consequence instead of the plumbing.

  # ===================================================== PAGE — journeys ====
  - name: cf.page.journeys
    rules:
      - alert: BeaconCriticalJourneyFailing
        # `!= 1`, never `== 0`. Beacon emits 0.5 for a skip, and a skip is
        # not-run, which is never green — alerting on `== 0` would treat a
        # journey whose credentials went missing as passing.
        #
        # "Twice consecutively" is expressed as `for:`, not counted: the gauge
        # holds its last value between runs, so remaining non-1 across a window
        # longer than the journey interval means the most recent run failed and
        # the one before it did too. Beacon applies hysteresis at the source for
        # target state (failThreshold=3); it deliberately does not for journeys,
        # so this is where it belongs. Do not double-apply it.
        expr: beacon_journey_status{journey=~"critical.*|register|signin|deposit|convert|withdraw|mint.*|market.*"} != 1
        for: 10m
        labels:
          severity: page
          team: on-call
          service: "{{ $labels.group }}"
          sev: "2"
        annotations:
          summary: "Journey {{ $labels.journey }} has been failing for two consecutive runs"
          description: >-
            A synthetic user cannot complete {{ $labels.journey }}. This is a
            user-visible failure, not a metric being ugly. Beacon's journey grid
            before Grafana — the journey names what broke.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-incident-comms.md

  # ========================================================== PAGE — SLO ====
  - name: cf.page.slo
    rules:
      - alert: SLOErrorBudgetBurnFast
        # 14.4x over 1h is 2% of a 28-day budget in an hour. Paired with the 6h
        # ticket rule below because one window cannot serve both cases: short
        # alone pages on every blip, long alone fires after the budget is gone.
        expr: cf:slo_burn_rate_tier1:1h > 14.4
        for: 5m
        labels:
          severity: page
          team: "{{ $labels.service }}"
          sev: "2"
        annotations:
          summary: "{{ $labels.service }} is burning its error budget at {{ $value | printf \"%.1f\" }}x"
          description: >-
            At this rate a Tier-1 28-day budget is gone inside two days. Tier 1
            is 99.95% — twenty-one minutes for the month.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-rollback-release.md

      - alert: GatewayErrorRatioHigh
        expr: cf:http_errors:ratio5m{service="gateway"} > 0.05
        for: 5m
        labels:
          severity: page
          team: platform
          service: gateway
          sev: "1"
        annotations:
          summary: "Gateway is returning {{ $value | humanizePercentage }} 5xx"
          description: >-
            Every product is behind this. Check the deploy annotation first; if a
            release landed in the window, roll back to the previous manifest
            before diagnosing.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-rollback-release.md

  # ======================================================= PAGE — backup ====
  - name: cf.page.backup
    rules:
      - alert: BackupAgeExceeded
        # Alerting on AGE rather than on failure is the whole point. A backup job
        # that silently stops firing produces no failure to alert on, so the
        # first thing to watch is that it ran at all.
        #
        # ── `backup_last_success_unixtime`, AND IT READ A NAME NOTHING EXPORTS ─
        #
        # This was `time() - backup_last_success_timestamp_seconds > 129600`.
        # Measured against the mainnet Prometheus on 2026-08-10: of 1,329 metric
        # names in the estate, ZERO contain the substring `backup`. So this sev2
        # page had never evaluated against a series and could not fire, for two
        # separate reasons that each had to be fixed (micro-org#310):
        #
        #   1. The runner has never been started. `deploy/backup` is complete —
        #      four job handlers, a per-artefact manifest, `age` encryption of
        #      the miner coinbase key, a cross-environment restore refusal — and
        #      `compose/docker-compose.backup.yml` is a complete overlay, but
        #      `docker ps -a` on the host shows no backup-runner container and
        #      the destination directory holds nothing. The estate has zero
        #      backups against a stated RPO of zero.
        #   2. Even once it runs, the OLD NAME would still have been absent. The
        #      runner registers `backup_last_success_bytes` — how big — and had
        #      no gauge at all for WHEN. It now exports
        #      `backup_last_success_unixtime`, spelled to match the
        #      `backup_last_verified_unixtime` beside it in the same exporter
        #      rather than to match Prometheus's `_timestamp_seconds`.
        #
        # THE GAUGE IS SEEDED AT BOOT from `backup_runs.finished_at`, and that is
        # what makes this expression trustworthy rather than merely correct. A
        # gauge set only when a run completes is erased by a restart, and
        # `time() - <absent> > 129600` evaluates over an EMPTY VECTOR — no
        # series, no alert, a page that reads as satisfied because there is
        # nothing to compare. That is the same silent green this rule spent its
        # whole life in.
        #
        # No `{{ $labels.target }}` in the summary any more: the gauge carries no
        # labels, because it is one estate's one backup destination. The old
        # summary interpolated a label nothing publishes and would have rendered
        # "No successful backup of  for 4d".
        #
        # 129600s is 36h — one missed daily sweep plus half a day, so a run that
        # started late or a redeploy that skipped a night does not page.
        expr: time() - backup_last_success_unixtime > 129600
        labels:
          severity: page
          team: platform
          service: backup-runner
          sev: "2"
        annotations:
          summary: "The estate's last successful backup finished {{ $value | humanizeDuration }} ago"
          description: >-
            The ledger's RPO is zero. A backup nobody has restored is a
            hypothesis; a backup that has not run is not even that.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-restore-from-backup.md

  # ==================================================== TICKET — money ======
  - name: cf.ticket.money
    rules:
      - alert: LedgerReconciliationDrift
        # Ledger's custody account versus the indexer's observed on-chain
        # balance. Ticket at any non-zero; the per-chain dust threshold that
        # escalates it to a page is a property of the chain and belongs in the
        # metric's own labels, not in a second copy of the number here.
        #
        # ── PER ASSET, NOT `_native`, AND THE VALUE HAS NO COMMON UNIT ────────
        #
        # This read `ledger_reconciliation_drift_native != 0` and interpolated
        # `{{ $labels.chain }}`. Neither existed. `ledger_reconciliation_drift`
        # is what ledger publishes, it is labelled by ASSET and not by chain, and
        # a single "native" number was asked for and refused on 2026-08-10 for
        # four reasons, each sufficient on its own:
        #
        #   · the assets have different decimals — SHARD 0, LTC 8, EMBER 18 — so
        #     one integer over all three adds three different units together;
        #   · SHARD has no chain at all (`chainNameFor('SHARD')` is `platform`),
        #     so "native" is undefined for a third of the series;
        #   · collapsing it needs a price oracle ledger does not have, and one
        #     behind a solvency alert makes the threshold move with the market;
        #   · the drifts are SIGNED, so +1 LTC and −1 EMBER cancel to zero and
        #     the rule goes green on two simultaneous discrepancies.
        #
        # THE `and on (asset)` GUARD IS LOAD-BEARING. Ledger writes the drift
        # gauge only when a drift was actually computed, and the telemetry
        # package has no way to remove a labelled series — so an asset that stops
        # reconciling keeps publishing its LAST drift value for the life of the
        # process. Without the guard this rule cannot tell a live discrepancy
        # from a stale one, and would hold a ticket open against a number nobody
        # is still measuring. `ledger_reconciliation_observed{asset}` is set to
        # 0/1 on every run and is the estate's existing "did we look" companion.
        #
        # A firing series is already past that asset's declared tolerance
        # (`LEDGER_ASSET_TOLERANCE`; LTC deliberately 0, EMBER 1e15), so it is a
        # discrepancy an owner has already called intolerable. It stays a ticket
        # because the page on the CONSEQUENCE exists above:
        # `AssetWithdrawalsFrozen` on `ledger_assets_frozen > 0`.
        expr: ledger_reconciliation_drift != 0 and on (asset) ledger_reconciliation_observed == 1
        for: 15m
        labels:
          severity: ticket
          team: ledger
          service: ledger
          sev: "3"
        annotations:
          summary: "Reconciliation drift of {{ $value }} on {{ $labels.asset }}, in that asset's smallest unit"
          description: >-
            What the ledger says custody holds and what the chain says custody
            holds have diverged. Two truths is the thing the single-journal
            design exists to prevent, so this is a real finding even when small.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-reconciliation-drift.md

      - alert: DepositAddressUnwatched
        # WAS `DepositAddressFrozen - wallet_deposit_address_frozen > 0`, AND
        # THAT STATE CANNOT EXIST IN THIS ESTATE (2026-08-10).
        #
        # micro-wallet's `deposit_address_assignments_status_ck` admits exactly
        # `active`, `rotated`, `retired`. `frozen` does exist in that repository
        # as a WALLET status meaning "cannot send, can still receive" — the
        # opposite of a crediting stop — and `ledger_assets_frozen` is an
        # asset-wide WITHDRAWAL freeze. Neither is the thing, and repointing at
        # either would have been a rule that fires on the wrong incident.
        #
        # The condition the old rule and `runbook-frozen-deposit-address.md`
        # describe is FORGE-PAY'S, and micro-wallet exists to close it: the
        # address row carried its own high-water mark, a rotation left the old
        # mark behind, every probe read a regression and crediting stopped for
        # ever. That runbook's step 2 is literally "compare against the address's
        # high-water mark". micro-wallet has no high-water mark — a rotation is a
        # new row and credits key on (chain, network, txHash, logIndex) — so the
        # state cannot arise by construction. The rule was an artefact of the
        # data model this service replaced.
        #
        # WHAT IS REAL is the backlog of assigned deposit addresses the indexer
        # has not been told to watch: until it is registered, a deposit to it is
        # never seen and the user's money is on the chain and not in the ledger.
        #
        # SUBTRACTING `unobservable` IS WHAT MAKES IT A FAULT RATHER THAN A
        # PREFERENCE. A chain the indexer follows no source for is an owner's
        # decision, not a defect, and today that is seven of eight chains
        # (`INDEXER_CHAINS=ember:mainnet`) — alerting on it would fire for ever
        # and be silenced, which is how a rule stops being read.
        #
        # `for: 30m` is measured, not chosen: `deposit.watch` runs every 30s, so
        # a backlog that survives thirty minutes has failed about sixty times and
        # is not a queue. And `{{ $labels.chain }}` now resolves — both gauges
        # are written per chain by `sampleDepositAddressMetrics` in
        # `beforeScrape`, on every replica, which is also what stopped the two
        # writers of the old unlabelled gauge from alternating between a cap of
        # 50 and a cap of 500.
        expr: wallet_deposit_addresses_unwatched - wallet_deposit_addresses_unobservable > 0
        for: 30m
        labels:
          severity: ticket
          team: wallet
          service: wallet
          sev: "3"
        annotations:
          summary: "{{ $value }} deposit address(es) unregistered with the indexer on {{ $labels.chain }}"
          description: >-
            These addresses are assigned to users and the indexer is not
            watching them, on a chain it does follow a source for. A deposit to
            one of them is not seen and is not credited. This is the registration
            path failing, not a crediting freeze — no such state exists.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-deposit-address-unwatched.md

      - alert: DepositCreditsUnposted
        # THE MIRROR IMAGE OF THE RULE ABOVE, AND THE ONE HALF OF THE DEPOSIT
        # PATH NOTHING WAS WATCHING (micro-org#326).
        #
        # `wallet_deposit_credits_pending` counts deposit credits whose
        # `ledger_entry_id` is still null: money that arrived on chain, was
        # claimed by wallet, and was never posted to the ledger. Until it is
        # posted the owner cannot see it — their balance is the ledger's answer,
        # and the ledger has not been told. micro-wallet's own `index.ts` says
        # "a credit claimed but never posted is money the user cannot see"
        # beside the line that publishes the gauge, and until this rule nothing
        # in the estate read it. `grep -rn wallet_deposit_credits_pending
        # deploy/` returned nothing on 2026-08-10.
        #
        # The estate pages for a withdrawal that is stuck and for an asset that
        # is frozen. Both are money the user cannot move. This is money the user
        # cannot SEE, arriving by the deposit side, and it was the only one of
        # the three with no rule at all.
        #
        # ── IN cf.ticket.money, NOT A NEW cf.ticket.wallet ──────────────────
        #
        # micro-org#326 proposed a `cf.ticket.wallet` group. It is here instead:
        # the groups in this file are cut by DOMAIN — money, jobs, backup, slo,
        # telemetry, conformance — and never by owning team, which is why
        # `DepositAddressUnwatched` directly above already carries `team: wallet`
        # from inside `cf.ticket.money`. Alertmanager routes on the `severity`
        # and `team` LABELS and never on the group name, so a new group would
        # change no routing and would separate the two halves of one failure
        # path in the file an operator reads at 3am. Group membership only
        # controls evaluation order and interval, and these two want neither.
        #
        # ── TICKET AND NOT A PAGE, DELIBERATELY ──────────────────────────────
        #
        # `deposit.post` retries the whole backlog on a schedule and the retry
        # is safe to repeat: `postCredit` sends the credit key as the ledger's
        # idempotency key, so a posting that did in fact land is replayed rather
        # than doubled. A non-zero reading that clears on its own is therefore
        # the system working, not an incident. A reading that PERSISTS is a
        # posting that keeps being refused — the ledger down, or a credit the
        # ledger will not accept — and that never clears without a human.
        #
        # ── `for: 20m` IS MEASURED AGAINST THE JOB, NOT CHOSEN FOR ROUNDNESS ──
        #
        # `RECURRING` in micro-wallet's `jobs.ts` schedules `deposit.post` at
        # `everyMs: 5_000`, so twenty minutes is roughly 240 passes over the
        # same backlog. Anything still unposted after that is not a queue
        # draining; it is the same posting failing 240 times. The same reasoning
        # as `for: 30m` on `DepositAddressUnwatched` above, which is sixty
        # passes of a 30s job — and a shorter window here because the user is
        # already waiting on a balance they cannot see.
        #
        # ── NO `by`, AND NO `absent()` COMPANION ─────────────────────────────
        #
        # The gauge is unlabelled by decision, argued at its registration in
        # micro-wallet's `registerServiceMetrics`: every unposted credit has the
        # same repair, and the per-row answer — `creditId` and `err` on the
        # `deposit credit posting failed` log line — belongs in the logs rather
        # than in a label Prometheus would carry for ever. The runbook opens
        # with the query that names them, which is the other half of that
        # bargain and is the half micro-org#327 found missing on
        # `ledger_assets_frozen`.
        #
        # No `absent()` guard either, unlike `BackupNeverRun` below: `beforeScrape`
        # writes this series unconditionally on every scrape on every replica, so
        # it cannot go missing while wallet is being scraped at all — and wallet
        # not being scraped is `BeaconTargetDown`'s question, not this rule's.
        #
        # ── THE VALUE IN `summary` ONLY BECAME TRUE WITH micro-org#326 ───────
        #
        # The gauge was `(await pendingCredits(db, 500)).length`, i.e.
        # `min(backlog, 500)`, so `{{ $value }}` saturated at 500 and a runaway
        # backlog and a nearly-drained one printed the same number. It is a
        # `count(*)` now. Deploy this rule against a wallet older than that fix
        # and the condition is still detected — it is `> 0` — but the number in
        # front of the operator stops being the backlog at 500.
        expr: wallet_deposit_credits_pending > 0
        for: 20m
        labels:
          severity: ticket
          team: wallet
          service: wallet
          sev: "3"
        annotations:
          summary: "{{ $value }} deposit credit(s) claimed and never posted to the ledger"
          description: >-
            Money is on the chain, wallet has claimed it, and the ledger has not
            been told — so the owner's balance does not include it. The retry
            job has been failing to post these for twenty minutes, which means
            the posting is being refused rather than queued. Find out why before
            touching any row: the credits are intact and re-posting is
            idempotent.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-deposit-credits-unposted.md

  # ===================================================== TICKET — jobs ======
  - name: cf.ticket.jobs
    rules:
      - alert: JobDeadLetterGrowth
        # `jobs_dead_total` is what @cloudsforge/telemetry registers;
        # 13-operational-model.md §5.2 calls it `jobs_dead_lettered_total`.
        # The library wins — see README §Divergences.
        expr: increase(jobs_dead_total[15m]) > 0
        labels:
          severity: ticket
          team: "{{ $labels.service }}"
          sev: "4"
        annotations:
          summary: "{{ $value }} job(s) of kind {{ $labels.kind }} dead-lettered in {{ $labels.service }}"
          description: >-
            A dead letter is work that will never happen unless somebody makes it
            happen. Drain deliberately; replaying blindly is how a double
            withdrawal is created.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-dead-letter-drain.md

      - alert: JobQueueOverdue
        # `jobs_overdue` counts work due more than five minutes ago. It rises for
        # two very different reasons — nothing is claiming, or a worker died
        # holding a lease — and the second is the class of bug that produced the
        # estate's double-billing.
        expr: jobs_overdue > 0
        for: 10m
        labels:
          severity: ticket
          team: "{{ $labels.service }}"
          sev: "4"
        annotations:
          summary: "{{ $labels.service }} has {{ $value }} overdue job(s)"
          description: >-
            Either nothing is claiming, or a worker died holding a lease. Check
            jobs_claimed_total before assuming the queue is idle.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-lease-expiry-storm.md

  # =================================================== TICKET — backup ======
  - name: cf.ticket.backup
    rules:
      - alert: BackupNeverRun
        # THE PAGE ABOVE CANNOT TELL "THE BACKUP IS OLD" FROM "THERE IS NO
        # BACKUP", AND ON THIS ESTATE IT IS THE SECOND ONE.
        #
        # `time() - backup_last_success_unixtime > 129600` needs a series to
        # subtract. With none it produces an empty vector, which never crosses a
        # threshold, so the worst possible state — nothing has ever been backed
        # up — is the one state that page is guaranteed to stay green through.
        # Measured on the mainnet Prometheus on 2026-08-10: zero of 1,329 metric
        # names contain `backup`, `docker ps -a` on the host lists no
        # backup-runner container, and the backup destination holds nothing.
        #
        # `absent()` and NOT `== 0`, which is where this differs from
        # `ConformanceCorpusNeverReplayed` further down. Beacon seeds its suite
        # counters at zero on every scrape, so a `sum() == 0` there means "no
        # suite has run". The backup runner deliberately publishes NO SAMPLE for
        # this gauge until a run has actually succeeded — a zero would be a
        # series claiming the estate was last backed up in 1970, and "very old"
        # is a claim that a backup once happened. Absent is the honest encoding,
        # so `absent()` is the only expression that can read it.
        #
        # THE THREE CAUSES THIS COVERS ARE ALL REAL AND THE RUNBOOK SEPARATES
        # THEM: the runner has never been deployed (today's state); it is
        # deployed and Prometheus is not scraping it — which was itself the case
        # until this release, because `backup-runner` lives in the overlay
        # `compose/docker-compose.backup.yml`, is named by no release manifest,
        # and therefore cannot appear in the file_sd list
        # `render-prometheus-targets.py` generates from the release; or it is
        # running and no run has ever succeeded.
        #
        # A TICKET AND NOT A PAGE, at sev3. It is a standing data-loss exposure
        # rather than an outage, and every fix for it — deploying a container,
        # correcting a scrape, reading a failed run — is a daylight change. A
        # page nobody can act on at three in the morning is how an on-call learns
        # to silence the group, and the group this would be silenced with
        # contains the money pages.
        #
        # `for: 30m` matches `MoneyMetricContractMissing`, which is the same
        # shape: absence, meaning the alert beside it cannot fire. It is long
        # enough to ride out a redeploy of the runner and short enough that a
        # container which failed to come back is noticed the same morning. The
        # boot-time seed is what makes 30m safe — the gauge is repopulated from
        # `backup_runs` as the process starts, not on the next successful run.
        expr: absent(backup_last_success_unixtime)
        for: 30m
        labels:
          severity: ticket
          team: platform
          service: backup-runner
          sev: "3"
        annotations:
          summary: "Nothing has ever backed this estate up, and the backup page cannot say so"
          description: >-
            No series exists for backup_last_success_unixtime, so
            BackupAgeExceeded is green because there is nothing to compare rather
            than because a backup is recent. Establish which of the three states
            this is — no runner, no scrape, or no successful run — before
            touching anything.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-backup-never-run.md

  # ====================================================== TICKET — SLO ======
  - name: cf.ticket.slo
    rules:
      - alert: SLOErrorBudgetBurnSlow
        # BOTH TIERS, EXPLICITLY. `cf:slo_burn_rate:6h` used to cover every
        # service because it was unfiltered, and it is now `{tier="2"}` — the
        # Tier-2 objective applied to Tier-2 services, which is what it always
        # claimed to be (micro-org#308). Without the second half of this
        # expression, that change would have silently removed the slow-burn
        # ticket from ledger, wallet, settlement, custody, indexer, pricing and
        # policy: a monitoring change that reduces coverage of the money path
        # and reports nothing is the failure this whole issue is about.
        #
        # `or` and not a single series, because the two are divided by different
        # budgets. 6x of a 99.95% budget and 6x of a 99.5% one are different
        # absolute error rates, and that is the point of having two tiers.
        expr: cf:slo_burn_rate:6h > 6 or cf:slo_burn_rate_tier1:6h > 6
        for: 30m
        labels:
          severity: ticket
          team: "{{ $labels.service }}"
          sev: "3"
        annotations:
          summary: "{{ $labels.service }} is burning budget at {{ $value | printf \"%.1f\" }}x over 6h"
          description: >-
            Not a page. At 50% consumed this becomes a ticket named in the weekly
            review; at 75% reliability work outranks features; at 100% the
            service is frozen to fixes only.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-rollback-release.md

  # ================================================== TICKET — telemetry ====
  - name: cf.ticket.telemetry
    rules:
      - alert: BeaconScrapeFailing
        # Beacon gates /metrics behind auth. The most likely cause of this alert
        # is not that Beacon is down — it is that BEACON_TOKEN is unset or the
        # token file is stale, which is a silent condition that would otherwise
        # present as "the journey panels are empty" three weeks later.
        expr: up{job="beacon"} == 0
        for: 10m
        labels:
          severity: ticket
          team: platform
          service: beacon
          sev: "3"
        annotations:
          summary: "Prometheus cannot scrape Beacon"
          description: >-
            Beacon's /metrics needs an x-beacon-token. Check
            prometheus/secrets/beacon_token and BEACON_TOKEN on the Beacon
            container before assuming Beacon itself is down — Beacon holds live
            state in memory and stays up through a Postgres outage.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md

      - alert: TelemetryComponentDown
        expr: up{job=~"otel-collector|tempo|loki|alertmanager|grafana"} == 0
        for: 5m
        labels:
          severity: ticket
          team: platform
          sev: "3"
        annotations:
          summary: "{{ $labels.job }} is down"
          description: >-
            Part of the observability plane has stopped. Everything downstream of
            it is now reporting silence, which is not the same as health.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md

      - alert: BeaconJourneyStale
        # A journey that stopped running reports its last status forever. A green
        # grid can mean the scheduler died, and no status metric says so.
        expr: cf:journey_staleness_seconds > 3600
        for: 15m
        labels:
          severity: ticket
          team: platform
          service: beacon
          sev: "3"
        annotations:
          summary: "Journey {{ $labels.journey }} has not run for {{ $value | humanizeDuration }}"
          description: >-
            The grid is showing a stale pass. Beacon's scheduler has stopped
            running this journey; its last result is not evidence of anything.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md

      - alert: MoneyMetricContractMissing
        # The rule that stops a missing metric reading as a healthy system.
        #
        # Every money alert above evaluates to nothing if its metric is never
        # published — no series, no alert, a green dashboard and a silent page.
        # That is the exact shape of the estate's current problem, where "no
        # metrics scraped anywhere" presents as no alerts firing. `absent()`
        # inverts it: not publishing the metric is itself the alert.
        expr: absent(ledger_trial_balance_delta) or absent(withdrawal_stuck) or absent(indexer_lag_blocks)
        for: 30m
        labels:
          severity: ticket
          team: platform
          sev: "4"
        annotations:
          summary: "A money-integrity metric is not being published by anything"
          description: >-
            ledger_trial_balance_delta, withdrawal_stuck or
            indexer_lag_blocks has no series. The alerts that depend on it are
            deployed and cannot fire. Expected until ledger, settlement and
            indexer ship (P4/P5) — after that it means instrumentation regressed.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-metric-contract-missing.md

  # =================================================== TICKET — conformance =
  - name: cf.ticket.conformance
    rules:
      - alert: HearthConformanceVectorsFailing
        # Beacon reports a suite it could not run under result="skipped" and
        # never under "passed", so this counts real failures only.
        expr: beacon_conformance_vectors{result="failed"} > 0
        for: 30m
        labels:
          severity: ticket
          team: chain
          service: hearth
          sev: "4"
        annotations:
          summary: "{{ $value }} EVM conformance vector(s) failing in suite {{ $labels.suite }}"
          description: >-
            A non-zero failed count blocks the next Hearth release. No component
            is done until its vectors pass.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-hearth-node-down.md

      - alert: ConformanceCorpusNeverReplayed
        # THE RULE ABOVE CANNOT TELL "NOTHING IS BROKEN" FROM "NOBODY LOOKED".
        #
        # `beacon_conformance_vectors{result="failed"} > 0` is silent in both
        # cases, and on 2026-08-09 the estate was in the second one: the metric
        # was absent from the scrape entirely, because beacon only publishes
        # vector counts for suites that have actually run. Zero suites had. The
        # conformance gate that blocks a Hearth release was therefore green by
        # virtue of never having been asked a question.
        #
        # `beacon_conformance_suites{status}` exists precisely to answer this and
        # is published UNCONDITIONALLY — beacon seeds pass/fail/skip at 0 on
        # every scrape whether or not a suite has run, which is what makes a sum
        # of exactly zero mean "no suite has ever completed" rather than "no
        # scrape happened". `absent()` covers the third case, beacon not
        # publishing at all, which `sum()` over an empty vector cannot: an empty
        # vector summed is no series, and no series never crosses `== 0`.
        #
        # `for: 1h` and not minutes. A replay is a scheduled batch, not a
        # continuous signal, and the corpus is legitimately un-replayed across a
        # restart, a redeploy or a quiet morning. An hour is short enough to
        # notice a runner that has silently stopped and long enough not to page
        # anyone for a deploy — and this is a ticket at sev4 in any case, because
        # an unreplayed corpus is a gate that is not being enforced, not an
        # estate that is down.
        expr: absent(beacon_conformance_suites) or sum(beacon_conformance_suites) == 0
        for: 1h
        labels:
          severity: ticket
          team: chain
          service: beacon
          sev: "4"
        annotations:
          summary: "No conformance suite has ever completed — the release gate is unenforced"
          description: >-
            Beacon reports zero conformance suites in every status. The
            HearthConformanceVectorsFailing rule beside this one is therefore
            green because nothing has been compared, not because nothing has
            diverged. Find the runner, not the divergence.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-conformance-corpus-never-replayed.md

      - alert: BeaconTargetDown
        # Beacon's own hysteresis has already been applied here — this is the
        # reported state, the same value the status grid shows, so a `for:` of
        # 5m is the second filter and not a duplicate of the first.
        expr: beacon_target_up == 0
        for: 5m
        labels:
          severity: ticket
          team: platform
          sev: "3"
        annotations:
          summary: "Beacon reports {{ $labels.target }} ({{ $labels.group }}) down"
          description: >-
            A single target degrading is a ticket. It becomes a page only when a
            journey fails, because a journey is what says a user is blocked.
          runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-telemetry-plane-down.md
