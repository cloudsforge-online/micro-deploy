# promtool UNIT TESTS for prometheus/rules/alerts.yaml.
#
# `make check-rules` proves the rules PARSE. It cannot tell a rule that fires
# from a rule that never will, and this repository has shipped the second kind
# more than once: `BackupAgeExceeded` read `backup_last_success_timestamp_seconds`
# and `LedgerReconciliationDrift` read `ledger_reconciliation_drift_native` and
# interpolated `{{ $labels.chain }}` — three names nothing exported, all of them
# valid YAML, all of them deployed, none of them able to page. A green syntax
# check on an unfireable rule is worse than no check, because it reads as cover.
#
# This file is the other half: promtool feeds the rules a synthetic series and
# asserts what comes out. `make check-rule-tests` runs it, and so does CI.
#
# It covers a handful of the 34 alerts today, and grows by whichever rule was
# most recently written or most recently found unfireable. That is not the
# intended end state — every rule in alerts.yaml belongs here eventually — but a
# file of honest cases is worth more than a plan for all of them.
#
# The rules that end up here first are the ones NOTHING IN THE ESTATE CAN
# OBSERVE: a disk that never logs an ext4 error, a coinbase key that is backed up
# now, a corpus that has not been replayed for a day and a half. A rule whose
# firing condition a healthy estate cannot produce is a rule that has never been
# executed, and this file is the only place it ever will be.
#
# The `rule_files` path is relative to THIS file, which is why the test lives
# beside the rules rather than under a tests/ directory. `prometheus.yml` names
# its two rule files explicitly, so a third YAML in this directory is never
# loaded by the running Prometheus — checked before choosing this layout.

rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  # ══════════════════════════════════════════════════════════════════════════
  # BackupDestinationFilesystemErrors — micro-org#207.
  #
  # The backup disk is a Marvell firmware RAID virtual disk that answers
  # `smartctl -H` with "device lacks SMART capability", so ext4's own superblock
  # error counter is the ONLY health signal the medium holding every estate
  # backup has. The counter reads 0 on the estate host and always has, and a
  # host healthy enough to run CI is by definition one whose disk is not logging
  # ext4 errors — so NOTHING ANYWHERE CAN OBSERVE THIS RULE FIRING except a
  # synthetic series. That is what this is.
  #
  # micro-deploy#46 made the same argument one level down, about the exporter:
  # a `count` pinned to `BigInt(0)` passed all 88 tests that existed, which is a
  # gauge that cannot rise sitting under an alert whose expression is `> 0`.
  # This is the corresponding assertion for the alert.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # The label set is the one measured on the mainnet Prometheus on
      # 2026-08-10, not an invented one: `device` comes from the exporter
      # (src/disk.ts resolves it from `st_dev`, so it names the FILESYSTEM,
      # `sdb1`, and not the whole disk), and `instance`/`job`/`service`/`team`
      # come from the scrape config. `device` in particular has to be real here
      # — the summary interpolates `{{ $labels.device }}`, and a template
      # referencing a label the series does not carry renders empty rather than
      # failing, which is exactly how the `{{ $labels.chain }}` defect survived.
      #
      # 0 for ten minutes and then 3, because that is the only shape this
      # counter has: it lives in the superblock, it survives a remount, and it
      # never decreases. There is no recovery case to assert.
      - series: 'backup_destination_fs_errors{device="sdb1",instance="backup-runner:4130",job="backup-runner",service="backup-runner",team="platform"}'
        values: "0+0x9 3+0x20"

    alert_rule_test:
      # A healthy disk is silent. Asserted rather than assumed: an expression
      # mistyped as `>= 0` pages every five minutes for ever, and the operator
      # response to that is to silence the alert, which costs the estate the one
      # signal this disk has.
      - eval_time: 5m
        alertname: BackupDestinationFilesystemErrors
        exp_alerts: []

      # The counter goes to 3 at 10m. `for: 5m` means PENDING here, not firing —
      # a single anomalous scrape must not page.
      - eval_time: 10m
        alertname: BackupDestinationFilesystemErrors
        exp_alerts: []

      # Still pending one minute short of the threshold. This case is what makes
      # the one above load-bearing: without it, a rule with no `for:` at all
      # would still pass, because it would have fired at 10m and the assertion
      # there would have caught it — but a `for: 30m` would pass too.
      - eval_time: 14m
        alertname: BackupDestinationFilesystemErrors
        exp_alerts: []

      # 15m: active since 10m, so `for: 5m` is satisfied and it fires. Every
      # label and every annotation is spelled out, because the routing depends
      # on `severity` and `team` (alertmanager.yml matches on both), the paging
      # tier depends on `sev`, and the runbook rule depends on `runbook_url`
      # resolving to a file that exists — scripts/check-runbooks.py checks the
      # file exists, and this checks the annotation survives to the alert.
      - eval_time: 15m
        alertname: BackupDestinationFilesystemErrors
        exp_alerts:
          - exp_labels:
              alertname: BackupDestinationFilesystemErrors
              device: sdb1
              instance: backup-runner:4130
              job: backup-runner
              severity: page
              team: platform
              service: backup-runner
              sev: "2"
            exp_annotations:
              summary: "ext4 has recorded 3 error(s) on sdb1, which holds every backup"
              description: >-
                The backup disk exposes no SMART, so this counter is the only
                health signal it has. Establish whether the existing sets are
                still readable before writing another one to the same volume.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-backup-destination-fs-errors.md

      # It stays firing. A counter that only rises has no resolution, and an
      # alert that flapped off here would be reporting the disk as recovered.
      - eval_time: 25m
        alertname: BackupDestinationFilesystemErrors
        exp_alerts:
          - exp_labels:
              alertname: BackupDestinationFilesystemErrors
              device: sdb1
              instance: backup-runner:4130
              job: backup-runner
              severity: page
              team: platform
              service: backup-runner
              sev: "2"
            exp_annotations:
              summary: "ext4 has recorded 3 error(s) on sdb1, which holds every backup"
              description: >-
                The backup disk exposes no SMART, so this counter is the only
                health signal it has. Establish whether the existing sets are
                still readable before writing another one to the same volume.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-backup-destination-fs-errors.md

  # ══════════════════════════════════════════════════════════════════════════
  # EmberTipNotAdvancing — micro-org#363.
  #
  # The rule's whole content is a pair of numbers: the `[10m]` range and the
  # `for: 5m`, which together mean "fires on a 15-minute gap and on nothing
  # shorter". `check rules` cannot see either. The tip stops at 19m, so the
  # expression turns true around 28m and the alert fires around 33m, and the
  # silent-then-firing cases below straddle that.
  #
  # ── WHY THE ASSERTIONS SIT THREE MINUTES OFF THE BOUNDARIES ──────────────
  #
  # Not squeamishness — measured harness behaviour. On promtool 3.5.0,
  # 2026-08-10, an `alert_rule_test` result in ONE test group moves by one
  # evaluation interval depending on what OTHER groups are in the same file:
  # written with four groups this rule reported no alert at 33m, with three it
  # fired at 33m, and adding a single `promql_expr_test` entry to this group
  # flipped it back again. The storage is not the cause — `count(indexer_tip
  # _height)` inside this group returns 1, so the groups are isolated, and the
  # expression itself evaluates true at 28m either way. It is how the harness
  # loads samples around each evaluation.
  #
  # An assertion pinned to the exact turnover minute would therefore be a test
  # that goes red when somebody adds an unrelated case to this file, and the fix
  # for that would be to loosen it in a hurry. Three minutes of margin is enough
  # to absorb one interval and still discriminate every mutation that matters.
  # Each was applied to alerts.yaml and the target re-run, and the failing case
  # recorded: `[5m]` and a deleted `for:` each redden the 31m silence, `[15m]`
  # and `for: 30m` each redden the 36m firing, and `== 0` inverted to `> 0`
  # reddens all five.
  #
  # The label set is the one measured on the mainnet Prometheus on 2026-08-10
  # (`instance="indexer:4000"`, `job="cf-services"`, `tier="1"`), not an invented
  # one — the summary interpolates `{{ $labels.network }}`, and a template
  # referencing a label the series does not carry renders EMPTY rather than
  # failing, which is exactly how the `{{ $labels.chain }}` defect survived. Note
  # the scrape target already carries `team="indexer"`; the rule's own
  # `team: chain` must win, and the expected labels below assert that it does,
  # because Alertmanager routes on it.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # One block a minute for twenty minutes, then a half-hour flat stretch,
      # then blocks again. Slower than EMBER's 15 s target on purpose: at the difficulty
      # floor the chain's honest steady state IS slower than target (median 24 s,
      # mean 39.2 s over blocks 8249-11249 on 2026-08-10), and a rule that fired
      # on the healthy stretches of this series would be the rule that fires all
      # day. The first assertion below is that it does not.
      - series: 'indexer_tip_height{chain="ember",network="mainnet",instance="indexer:4000",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "100+1x19 119+0x30 120+1x20"

    alert_rule_test:
      # Blocks arriving. Silent.
      - eval_time: 15m
        alertname: EmberTipNotAdvancing
        exp_alerts: []

      # The tip froze at 19m. At 26m the `[10m]` window still reaches back to
      # the last change, so the expression is FALSE — not pending, false.
      - eval_time: 26m
        alertname: EmberTipNotAdvancing
        exp_alerts: []

      # The expression goes true around 28m and `for: 5m` has not elapsed. This
      # is the case that pins the range AND the `for:`: written `[5m]`, or with
      # no `for:` at all, the alert is already firing here.
      - eval_time: 31m
        alertname: EmberTipNotAdvancing
        exp_alerts: []

      # Firing: 10m of range plus 5m of `for:` after the last block at 19m, so
      # on a 15-minute gap, which is the number alerts.yaml derives from the
      # measured distribution. This is the case that pins the OTHER side —
      # `[15m]` would not have fired yet and `for: 30m` never fires here at all.
      # Every label and annotation is spelled out: Alertmanager routes on
      # `severity` and `team`, the paging tier reads `sev`, and the runbook rule
      # needs `runbook_url` to survive as far as the alert.
      - eval_time: 36m
        alertname: EmberTipNotAdvancing
        exp_alerts:
          - exp_labels:
              alertname: EmberTipNotAdvancing
              chain: ember
              network: mainnet
              instance: indexer:4000
              job: cf-services
              tier: "1"
              severity: ticket
              team: chain
              service: indexer
              sev: "3"
            exp_annotations:
              summary: "EMBER mainnet tip has not advanced in at least 15 minutes"
              description: >-
                No new EMBER block has been indexed for fifteen minutes against a
                fifteen second target. This series freezes for a stalled chain and
                for a stalled indexer alike — ask the node for its own height before
                concluding anything, the runbook has the call. If the node agrees
                the tip is stuck, the usual cause is difficulty left high by
                hashrate that has since gone away, and it resolves itself as the
                retarget walks down; the runbook says how long that has taken
                before, and when to stop waiting.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-tip-not-advancing.md

      # Still stuck at 45m, still firing.
      - eval_time: 45m
        alertname: EmberTipNotAdvancing
        exp_alerts:
          - exp_labels:
              alertname: EmberTipNotAdvancing
              chain: ember
              network: mainnet
              instance: indexer:4000
              job: cf-services
              tier: "1"
              severity: ticket
              team: chain
              service: indexer
              sev: "3"
            exp_annotations:
              summary: "EMBER mainnet tip has not advanced in at least 15 minutes"
              description: >-
                No new EMBER block has been indexed for fifteen minutes against a
                fifteen second target. This series freezes for a stalled chain and
                for a stalled indexer alike — ask the node for its own height before
                concluding anything, the runbook has the call. If the node agrees
                the tip is stuck, the usual cause is difficulty left high by
                hashrate that has since gone away, and it resolves itself as the
                retarget walks down; the runbook says how long that has taken
                before, and when to stop waiting.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-tip-not-advancing.md

      # Blocks resume at 51m and the alert RESOLVES. Every EMBER stall measured
      # on 2026-08-10 ended without anybody doing anything, so a rule that could
      # not clear itself would leave a permanent open ticket for a chain that had
      # already recovered — and the on-call response to that is to stop reading
      # the ticket queue.
      - eval_time: 56m
        alertname: EmberTipNotAdvancing
        exp_alerts: []


  # ══════════════════════════════════════════════════════════════════════════
  # EmberDifficultyAtFloor — micro-org#363.
  #
  # This rule is a CONJUNCTION and both halves are load-bearing, for opposite
  # reasons: at the floor with hashrate to spare is HEALTHY, and slow with
  # difficulty above the floor is a transient the chain heals from by itself.
  # A test that only exercised the defect would pass for either single-clause
  # version of the rule, which is the "check that cannot fail" this repository
  # keeps re-inventing.
  #
  # So the defect and its two controls run TOGETHER, in one group, as three
  # scrape targets. `exp_alerts` below is an exact set: if either control ever
  # fired, the expected list would have two entries instead of one and the
  # assertion would go red. Deleting either clause from alerts.yaml turns this
  # block red, which was checked rather than assumed.
  #
  # ── WHY ONE GROUP AND NOT THREE, WHICH IS NOT COSMETIC ───────────────────
  #
  # Measured on promtool 3.5.0, 2026-08-10: `alert_rule_test` results in one
  # test group CHANGE when unrelated test groups are added to the same file.
  # Written as four groups, with distinct label sets and verified-isolated
  # storage (`count(indexer_tip_height)` inside the EmberTipNotAdvancing group
  # returns 1, and its expression evaluates true at 33m), the EmberTipNotAdvancing
  # firing assertion above nonetheless reported no alerts — and adding a single
  # `promql_expr_test` entry to that group made the whole file pass again. Three
  # groups behave; four did not. That is a property of the harness, not of the
  # rules, and the way not to depend on it is to not write a group per scenario.
  #
  # Everything below runs over three simulated hours, which is forced: the
  # right-hand clause reads `offset 1h` and the rule carries `for: 1h`, so
  # nothing at all can be observed before the 120-minute mark.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # ── THE DEFECT: at the floor, and still slower than target. ──────────
      # 256 is `MAX_TARGET`, pinned to `GENESIS_TARGET`, in
      # hearth/node/src/params.js. Held flat because that is the shape the real
      # series has — 2,830 of the 3,001 blocks measured on mainnet on 2026-08-10
      # sat at exactly this value, one run of them for 28.99 hours.
      - series: 'indexer_chain_difficulty{chain="ember",network="mainnet",instance="indexer:4001",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "256+0x200"
      # One block a minute — 60 an hour against a target of 240. The real chain
      # managed a median of 94 an hour over the same window, so this is the
      # defect, drawn slightly worse than life.
      - series: 'indexer_tip_height{chain="ember",network="mainnet",instance="indexer:4001",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "1000+1x200"

      # ── CONTROL 1: at the floor, but FAST ENOUGH. Must stay silent. ──────
      # The floor is the easiest the chain is allowed to be, not a fault. Five
      # blocks a minute is 300 an hour against a target of 240 — the state
      # micro-deploy#53's second miner is meant to produce. The obvious way to
      # write "at the floor", `indexer_chain_difficulty{chain="ember"} <= 256`
      # alone, fires here for ever on a chain that is working perfectly.
      - series: 'indexer_chain_difficulty{chain="ember",network="mainnet",instance="indexer:4002",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "256+0x200"
      - series: 'indexer_tip_height{chain="ember",network="mainnet",instance="indexer:4002",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "1000+5x200"

      # ── CONTROL 2: slow, but NOT at the floor. Must stay silent. ─────────
      # 8417 is the real peak difficulty measured on mainnet at block 11243 on
      # 2026-08-10 19:20:51Z — 33x the floor, reached after a few minutes of
      # browser hashrate and then abandoned. The chain crawls there, and that is
      # `EmberTipNotAdvancing`'s business; the retarget is not saturated, it is
      # working. If this rule fired here the two alerts would arrive together
      # saying opposite things about the same minute.
      - series: 'indexer_chain_difficulty{chain="ember",network="mainnet",instance="indexer:4003",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "8417+0x200"
      - series: 'indexer_tip_height{chain="ember",network="mainnet",instance="indexer:4003",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "1000+1x200"

    alert_rule_test:
      # THE FIRST HOUR IS BLIND, AND THAT IS ASSERTED RATHER THAN DISCOVERED.
      # `offset 1h` has no samples to read yet, so the whole expression is empty
      # and this rule is silent no matter what the chain is doing. alerts.yaml
      # says so and the runbook says so; this is the third place, and the one
      # that cannot quietly go stale.
      - eval_time: 30m
        alertname: EmberDifficultyAtFloor
        exp_alerts: []

      # The expression goes true at 60m. `for: 1h` means still pending at 119m.
      # Without this case a rule with no `for:` at all would pass.
      - eval_time: 115m
        alertname: EmberDifficultyAtFloor
        exp_alerts: []

      # 120m: one alert, and one only. `and on (...)` keeps the LEFT
      # side's labels, so these are the difficulty series' — asserted explicitly,
      # because a rule whose output lost `network` would render its summary with
      # a hole in it and would collide with the testnet series if one appeared.
      - eval_time: 125m
        alertname: EmberDifficultyAtFloor
        exp_alerts:
          - exp_labels:
              alertname: EmberDifficultyAtFloor
              chain: ember
              network: mainnet
              instance: indexer:4001
              job: cf-services
              tier: "1"
              severity: ticket
              team: chain
              service: indexer
              sev: "4"
            exp_annotations:
              summary: "EMBER mainnet is at its difficulty floor and still below target block rate"
              description: >-
                EMBER difficulty is at 256, the lowest value the chain's parameters
                permit, and it has still produced fewer than 240 blocks in the last
                hour against a 15 s target. The retarget is saturated: it cannot make
                the chain any easier, so blocks stay slow until hashrate arrives.
                This is a capacity decision, not an incident — nothing is broken and
                nothing needs restarting. The runbook has the two levers and what each
                one costs.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-difficulty-at-floor.md

      # An hour later, still exactly one. A standing condition stays open — the
      # real one stood for 28.99 hours — and the two controls are still quiet.
      - eval_time: 170m
        alertname: EmberDifficultyAtFloor
        exp_alerts:
          - exp_labels:
              alertname: EmberDifficultyAtFloor
              chain: ember
              network: mainnet
              instance: indexer:4001
              job: cf-services
              tier: "1"
              severity: ticket
              team: chain
              service: indexer
              sev: "4"
            exp_annotations:
              summary: "EMBER mainnet is at its difficulty floor and still below target block rate"
              description: >-
                EMBER difficulty is at 256, the lowest value the chain's parameters
                permit, and it has still produced fewer than 240 blocks in the last
                hour against a 15 s target. The retarget is saturated: it cannot make
                the chain any easier, so blocks stay slow until hashrate arrives.
                This is a capacity decision, not an incident — nothing is broken and
                nothing needs restarting. The runbook has the two levers and what each
                one costs.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-difficulty-at-floor.md

  # ══════════════════════════════════════════════════════════════════════════
  # MailSentToReservedDomain — micro-org#390.
  #
  # The rule this file exists for. `notify` declines to route email to a domain
  # the standards reserve before a delivery row is written, so the adapter's
  # backstop firing means the routing rule did not run — and the cause that has
  # actually occurred is a DEPLOYED BUILD THAT LOST THE RULE. Mainnet sent 1,535
  # of 1,552 deliveries to `beacon.test` over seven days to 2026-08-11 with the
  # fix merged the whole time, and the estate found out from a provider
  # dashboard rather than from anything it runs.
  #
  # An alert against a counter that is correctly ZERO FOREVER can never be
  # observed firing in production by definition, which is precisely the class
  # this file was written for. A synthetic series is the only way to know it
  # works before the day it matters.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # The label set `notify` really exports: `channel` and `reason` are the two
      # declared on `notify_failed_total` in `metrics.ts`, and the rest come from
      # the scrape config. `reason` has to be exactly `reserved_domain` — the
      # value added in notify 2.5.20 — because the expression selects on it, and
      # a rule selecting a label value nothing writes is the unfireable shape
      # this file's header lists three examples of.
      #
      # Flat at 0 for twenty minutes, then one increment. One is the whole point:
      # there is no "acceptable level" of mail to an address that cannot exist.
      - series: 'notify_failed_total{channel="email",reason="reserved_domain",instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "0+0x20 1+0x20"

      # A second series that must NOT trigger it, and the reason the expression
      # names `reason` at all. Before notify 2.5.20 this refusal shared the label
      # `rejected` with a push gateway 4xx, a webhook 410 and an SMTP 5xx — all
      # of them ordinary and all of them non-zero on a healthy estate. If the
      # expression ever loses its `reason` selector, this series pages
      # constantly, the operator silences the alert, and the estate loses the
      # signal exactly as it did before.
      - series: 'notify_failed_total{channel="email",reason="rejected",instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "0+3x40"

    alert_rule_test:
      # Silent while the counter is flat, with a steadily rising `rejected`
      # series beside it. Asserted rather than assumed.
      - eval_time: 15m
        alertname: MailSentToReservedDomain
        exp_alerts: []

      # 21m: the counter moved by one. `for: 0m`, so it fires on the first
      # evaluation that sees it — there is no benefit to waiting, because the
      # condition does not resolve itself and every minute of delay is more of a
      # shared allowance spent.
      - eval_time: 22m
        alertname: MailSentToReservedDomain
        exp_alerts:
          - exp_labels:
              alertname: MailSentToReservedDomain
              channel: email
              reason: reserved_domain
              instance: activity:4000
              job: cf-services
              tier: "2"
              severity: ticket
              team: platform
              service: notify
              sev: "2"
            exp_annotations:
              summary: "notify attempted mail to a reserved domain — the routing rule is not running"
              description: >-
                The adapter backstop in notify refused an address under a reserved
                domain. On the live path nothing should ever reach it, because
                pipeline.ts declines to route email there first. Check that the
                RUNNING notify container carries reserved.ts — read the container,
                not the repo; the last time this happened the fix was merged and the
                process was older. Then check the provider's remaining daily
                allowance before assuming mail is otherwise healthy.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

  # ══════════════════════════════════════════════════════════════════════════
  # MailRoutedToReservedDomain — micro-org#390, the second pass.
  #
  # The alert above it watches a counter that measured ZERO on mainnet over the
  # seven days the leak was at its worst, because notify's routing rule drops
  # the channel before the backstop it counts is ever reached. This one watches
  # the delivery rows, which exist whether or not any guard in the process
  # believes they should.
  #
  # The negative series here is `notify_deliveries_pending`, non-zero and rising
  # on a perfectly healthy estate. If the expression is ever loosened to a
  # substring or the metric renamed to something that also matches pending
  # deliveries, this pages constantly and gets silenced — the failure mode the
  # file's header names.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # Zero for twenty minutes — the correct value, forever — then one row.
      # One is the whole threshold: there is no acceptable rate of writing a
      # delivery to an address the DNS root guarantees cannot resolve.
      - series: 'notify_deliveries_reserved_domain{instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "0+0x20 1+0x20"

      # Ordinary queue depth, non-zero throughout. Must never trigger it.
      - series: 'notify_deliveries_pending{instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "4+2x40"

    alert_rule_test:
      - eval_time: 15m
        alertname: MailRoutedToReservedDomain
        exp_alerts: []

      # `for: 0m`, so the first evaluation that sees the row fires. Waiting buys
      # nothing: the condition does not resolve itself, and every minute is more
      # of an allowance real recipients share.
      - eval_time: 22m
        alertname: MailRoutedToReservedDomain
        exp_alerts:
          - exp_labels:
              alertname: MailRoutedToReservedDomain
              instance: activity:4000
              job: cf-services
              tier: "2"
              severity: ticket
              team: platform
              service: notify
              sev: "2"
            exp_annotations:
              summary: "notify ROUTED mail to a reserved domain — the rule is not running in the deployed build"
              description: >-
                notify wrote at least one email delivery in the last hour whose
                recipient is under a domain the standards reserve. This is measured
                from the delivery table, so it is what happened and not what the
                code claims. Read the RUNNING container's build, not the repository
                — the last time this occurred the fix had been merged for six days
                and the process was older. Then check the provider's remaining daily
                allowance before assuming mail is otherwise healthy.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

  # ══════════════════════════════════════════════════════════════════════════
  # NotifyReservedDomainGuardLost, case 1 — the guard reports 0.
  #
  # A build whose routing rule was removed but which still exports the metric.
  # It says so at the first scrape, before any notification is created, which is
  # the "in minutes rather than in messages" the ticket asked for.
  #
  # THE LABEL SET BELOW IS THE ONE MAINNET ACTUALLY PRODUCES. Read off
  # `up{instance="notify:4000"}` on 2026-08-11:
  #
  #     job="cf-services"  service="notify"  team="notify"  tier="2"
  #
  # AND MOVED AGAIN ON 2026-08-27, which is the point of this comment rather than
  # a footnote to it. Wave M2 put notify's code inside micro-activity's process,
  # so `notify` stopped being a scrape target and the metric now arrives on
  # activity's:
  #
  #     instance="activity:4000"  job="cf-services"  service="activity"
  #     team="activity"  tier="2"
  #
  # Leaving the old set here would have been the SAME defect a third time: the
  # fixture would keep passing while the rule it tests selected nothing, because
  # a fixture is free to fabricate a label set the estate no longer produces.
  # The metric NAME still identifies the emitter — `notify_reserved_domain_guard`
  # is the notify module's and nothing else's — which is why the alert survives
  # the move at all.
  #
  # These three cases originally invented `job="notify"`, and passed, while the
  # rule they were testing selected nothing on the real estate — see the comment
  # on the alert. A fixture is the one place a label set can be whatever the
  # author expected rather than whatever exists, so it is the one place this
  # cannot be allowed to drift. `scripts/check-alert-job-labels.py` reads this
  # file too.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # Healthy for twenty minutes, then a deploy that lost the rule.
      - series: 'notify_reserved_domain_guard{instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "1+0x20 0+0x30"
      - series: 'up{instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "1+0x50"

    alert_rule_test:
      # Silent while the guard reports 1. Asserted, not assumed: an expression
      # comparing against the wrong value would fire here.
      - eval_time: 15m
        alertname: NotifyReservedDomainGuardLost
        exp_alerts: []

      # Still silent at 25m — the guard went to 0 at 21m and `for: 10m` has not
      # elapsed. This case is what stops a rolling deploy paging on every
      # release, and it is asserted so that shortening `for` cannot pass.
      - eval_time: 25m
        alertname: NotifyReservedDomainGuardLost
        exp_alerts: []

      - eval_time: 35m
        alertname: NotifyReservedDomainGuardLost
        exp_alerts:
          - exp_labels:
              alertname: NotifyReservedDomainGuardLost
              instance: activity:4000
              job: cf-services
              tier: "2"
              severity: ticket
              team: platform
              service: notify
              sev: "2"
            exp_annotations:
              summary: "the running notify build does not refuse mail to reserved domains"
              description: >-
                notify reports that its routing path would accept an address under a
                reserved TLD, or is not reporting the guard at all — which for this
                metric means a build predating it. Either way the deployed process
                is one that can empty the mail allowance on synthetic addresses in
                an afternoon. Compare the container's image digest against the
                release manifest; do not read the repository, which was right the
                last time this happened and had been for six days.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

  # ══════════════════════════════════════════════════════════════════════════
  # NotifyReservedDomainGuardLost, case 2 — THE METRIC IS ABSENT AND THE
  # SERVICE IS UP. This is the case micro-org#390 actually happened in.
  #
  # The deployed process was an image older than the rule. It exported no
  # reserved-domain series of any kind, so every `== 0` comparison matched
  # nothing and every counter stayed flat. An alert that only knows how to
  # compare a value is blind to a build that never reports one — which is the
  # unfireable shape this whole file exists to catch, arrived at from a new
  # direction.
  #
  # `up` is 1 throughout: notify is serving, healthy, and wrong.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      - series: 'up{instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "1+0x40"
      # No notify_reserved_domain_guard series at all. Its absence is the input.

    alert_rule_test:
      # `for: 10m` has not elapsed at 5m. Absence from the first scrape is a
      # service that has only just started, not necessarily a bad build.
      - eval_time: 5m
        alertname: NotifyReservedDomainGuardLost
        exp_alerts: []

      - eval_time: 20m
        alertname: NotifyReservedDomainGuardLost
        exp_alerts:
          - exp_labels:
              alertname: NotifyReservedDomainGuardLost
              instance: activity:4000
              job: cf-services
              tier: "2"
              severity: ticket
              team: platform
              service: notify
              sev: "2"
            exp_annotations:
              summary: "the running notify build does not refuse mail to reserved domains"
              description: >-
                notify reports that its routing path would accept an address under a
                reserved TLD, or is not reporting the guard at all — which for this
                metric means a build predating it. Either way the deployed process
                is one that can empty the mail allowance on synthetic addresses in
                an afternoon. Compare the container's image digest against the
                release manifest; do not read the repository, which was right the
                last time this happened and had been for six days.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-mail-allowance.md

  # ══════════════════════════════════════════════════════════════════════════
  # NotifyReservedDomainGuardLost, case 3 — NOTIFY IS DOWN.
  #
  # The `absent` half is qualified on `up == 1` for a reason worth a case of its
  # own: without it, every notify outage would page twice, once as NotifyDown
  # and once as a lost guard, and the second page would be a lie. A service that
  # is not running is not sending mail to anybody.
  #
  # Deleting `up{job="cf-services", service="activity"} == 1 unless` from the
  # expression turns this case red, which is the point of it. (That selector read
  # `service="notify"` until wave M2 moved notify's code into activity's process —
  # see the label-set note above.)
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      - series: 'up{instance="activity:4000",job="cf-services",service="activity",team="activity",tier="2"}'
        values: "0+0x40"

    alert_rule_test:
      - eval_time: 30m
        alertname: NotifyReservedDomainGuardLost
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════════
  # EmberTipNotAdvancing ON TESTNET — the case that could not exist until
  # 2026-08-12 (micro-org#398).
  #
  # The rule was written for both networks from the start: no network selector,
  # and a summary that interpolates `{{ $labels.network }}`. It had nonetheless
  # never once been able to match testnet, because this Prometheus was attached
  # to no network the testnet estate is on — `/api/v1/label/network/values`
  # answered `["mainnet"]` on 2026-08-11 while the testnet indexer was serving
  # `indexer_tip_height{chain="ember",network="testnet"} 8958` to nobody.
  #
  # THE LABEL SET IS THE ONE THE CONSOLIDATED POD ACTUALLY PRODUCES, read off
  # its own /metrics on 2026-08-25: `job="cf-services"`, `instance="indexer:4000"`,
  # and `network="testnet"` from the series itself rather than from the target.
  #
  # It used to be `job="cf-indexer-testnet"` with `estate="testnet"` and no
  # `tier`, from a second scrape of a second pod. That pod is gone: one process
  # serves both estates and labels each series with the network it belongs to.
  # `tier="1"` now rides along because it is a target label on `cf-services` —
  # harmless here, because the SLO rules carry `tier` through a
  # `by (network, service, tier)` grouping rather than selecting on it, so the
  # two estates stay separate series and testnet does not join mainnet's budget.
  #
  # Same timing as the mainnet case above, because it is the same rule: a rule
  # that fired on a different schedule for testnet would be a second rule.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      - series: 'indexer_tip_height{chain="ember",network="testnet",instance="indexer:4000",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "8958+1x19 8977+0x30 8978+1x20"

    alert_rule_test:
      # Blocks arriving on testnet. Silent, for the same reason as mainnet.
      - eval_time: 15m
        alertname: EmberTipNotAdvancing
        exp_alerts: []

      # Frozen at 19m; fires at 36m, on the 15-minute gap. The `network` label
      # reaches the summary — which is the whole point, and is the assertion
      # that would have caught the gap this ticket is about if a series had ever
      # existed to write it against.
      - eval_time: 36m
        alertname: EmberTipNotAdvancing
        exp_alerts:
          - exp_labels:
              alertname: EmberTipNotAdvancing
              chain: ember
              network: testnet
              instance: indexer:4000
              job: cf-services
              # From the series, because `cf-services` is a tiered target. The
              # rule sets no `tier`, so it survives; `team` and `service` do not,
              # because the rule's own labels win over the series'.
              tier: "1"
              # NO `estate`. The old `cf-indexer-testnet` target attached one;
              # `cf-services` does not, and this rule sets none of its own — the
              # estate is `network="testnet"` on the series, which is the whole
              # point of the consolidation labelling.
              severity: ticket
              team: chain
              service: indexer
              sev: "3"
            exp_annotations:
              summary: "EMBER testnet tip has not advanced in at least 15 minutes"
              description: >-
                No new EMBER block has been indexed for fifteen minutes against a
                fifteen second target. This series freezes for a stalled chain and
                for a stalled indexer alike — ask the node for its own height before
                concluding anything, the runbook has the call. If the node agrees
                the tip is stuck, the usual cause is difficulty left high by
                hashrate that has since gone away, and it resolves itself as the
                retarget walks down; the runbook says how long that has taken
                before, and when to stop waiting.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-tip-not-advancing.md

  # ══════════════════════════════════════════════════════════════════════════
  # TestnetChainSeriesMissing — the guard on the guard.
  #
  # If the indexer stops holding a testnet chain scope, the case above goes
  # silent, and silence is what it looks like when testnet is healthy.
  #
  # THIS USED TO WATCH `up{job="cf-indexer-testnet"}` AND COULD NOT HAVE CAUGHT
  # THE FAILURE IT WAS WRITTEN FOR. When the consolidation replaced the testnet
  # indexer with an ExternalName CNAME to the mainnet pod, that target stayed UP
  # and answered — with mainnet's numbers wearing `estate="testnet"`. Liveness
  # was never the question; presence of a testnet series was (micro-org#516).
  #
  # `indexer_chain_halted` and not `indexer_tip_height`: one is emitted per
  # CONFIGURED chain scope at startup, the other only after a successful tip
  # read. EMBER testnet sits at its difficulty floor and is often legitimately
  # idle, so keying on the tip series would fire on a healthy quiet chain.
  #
  # `for: 15m` rather than 10m: the pod is redeployed with the whole estate now,
  # not by hand, and a rollout plus a boot is longer than a `compose up` was.
  # The 8m case below is what pins it.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # Present for ten minutes, then the scope disappears — which is what
      # `INDEXER_CHAINS` losing its testnet entries looks like from here.
      - series: 'indexer_chain_halted{chain="ember",network="testnet",instance="indexer:4000",job="cf-services",service="indexer",team="indexer",tier="1"}'
        values: "0+0x10 _x30"

    alert_rule_test:
      # The scope exists. Silent.
      - eval_time: 5m
        alertname: TestnetChainSeriesMissing
        exp_alerts: []

      # Gone for 8m and pending, not firing — a rollout lands here.
      - eval_time: 19m
        alertname: TestnetChainSeriesMissing
        exp_alerts: []

      # ── WHY 35m AND NOT 30m ────────────────────────────────────────────
      # The last sample is at 10m, and Prometheus does not call a series absent
      # until it goes stale five minutes later — so `absent()` first becomes
      # true at 15m, and `for: 15m` puts the earliest firing at 30m exactly.
      # Asserting on that boundary tests the evaluation scheduler rather than
      # the rule. 35m is clear of it.
      - eval_time: 35m
        alertname: TestnetChainSeriesMissing
        exp_alerts:
          - exp_labels:
              alertname: TestnetChainSeriesMissing
              # `absent()` carries only what its matcher named. There is no
              # instance or job, and that is the point: the alert is about a
              # series that does not exist, so it cannot name where it isn't.
              network: testnet
              estate: testnet
              severity: ticket
              team: chain
              service: indexer
              sev: "4"
            exp_annotations:
              summary: "The indexer exports no testnet chain series — both EMBER chain rules are blind to testnet"
              description: >-
                No `indexer_chain_halted{network="testnet"}` exists, which means the
                consolidated indexer has no testnet chain scope configured at all.
                While this is true EmberTipNotAdvancing and EmberDifficultyAtFloor
                evaluate against no testnet series, so a frozen testnet chain
                produces silence rather than a ticket. The usual cause is
                INDEXER_CHAINS in compose/env/chain.mainnet.env having lost its
                testnet entries, or env-chain-testnet not being mounted on the pod —
                check `INDEXER_CHAINS` in the running container first.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-testnet-chain-scrape-down.md

  # ══════════════════════════════════════════════════════════════════════════
  # MinerCoinbaseKeyUnbacked — micro-org#206.
  #
  # This rule exists because the condition it watches went undetected for weeks
  # while the two alerts beside it stayed green, so a synthetic test is the only
  # way to see it fire before it matters. The estate cannot produce the firing
  # state on demand: doing so means deleting the miner's key or unsetting the
  # age recipient on a live host, which is the failure itself.
  #
  # THE ASSERTION THAT CARRIES THE WEIGHT IS THE 1-VALUED ONE. `== 0` against a
  # gauge is trivially easy to write as `!= 1`, or as `< 1`, or to leave as the
  # `absent()` that the rule directly above it uses — and every one of those
  # variants passes a syntax check and two of them fire permanently on a healthy
  # estate. The transition at 20m below is what separates them.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # No `device`, and no label the annotations interpolate: the summary and
      # description on this rule are deliberately static, because the gauge is
      # one estate's one answer and has nothing to name. The labels here are the
      # scrape config's, matching the `backup_destination_fs_errors` case above.
      #
      # 0 for twenty minutes, then 1 — a runner that has been finding no key,
      # and then an operator who set BACKUP_AGE_RECIPIENT or fixed the mount.
      # The recovery half is asserted because this is a gauge and not a
      # superblock counter: unlike the ext4 case it CAN go back, and a rule that
      # stayed firing after the key was backed up would be telling the estate
      # its fix did not work.
      - series: 'backup_secrets_included{instance="backup-runner:4130",job="backup-runner",service="backup-runner",team="platform"}'
        values: "0+0x19 1+0x20"

    alert_rule_test:
      # 0 since the first scrape, pending — `for: 30m` has to ride out a
      # redeploy of the runner, and 10m into a nightly gap is not a ticket.
      - eval_time: 10m
        alertname: MinerCoinbaseKeyUnbacked
        exp_alerts: []

      # Still pending one minute short. Same role as the 14m case in the ext4
      # test: without it a rule carrying no `for:` at all would still pass.
      - eval_time: 29m
        alertname: MinerCoinbaseKeyUnbacked
        exp_alerts: []

      # 30m. The gauge went to 1 at 20m, so the pending period was BROKEN and
      # this is still silent — which is the point. An expression written `!= 1`
      # or `< 1` would agree with the two cases above and disagree here only if
      # the series had stayed at 0; it is the recovery that distinguishes them.
      - eval_time: 30m
        alertname: MinerCoinbaseKeyUnbacked
        exp_alerts: []

      # And it stays silent for the rest of the series. A backed-up key is not
      # an alerting condition, and a rule that fired here would fire on every
      # healthy estate for ever.
      - eval_time: 39m
        alertname: MinerCoinbaseKeyUnbacked
        exp_alerts: []

  # The firing half, as a second series that never recovers — the state the
  # mainnet estate was actually in from the seal until this release: backups
  # running, 264 artefacts, and zero of them the coinbase key.
  - interval: 1m
    input_series:
      - series: 'backup_secrets_included{instance="backup-runner:4130",job="backup-runner",service="backup-runner",team="platform"}'
        values: "0+0x45"

    alert_rule_test:
      - eval_time: 29m
        alertname: MinerCoinbaseKeyUnbacked
        exp_alerts: []

      # Thirty minutes at zero. Every label and annotation is spelled out for
      # the reason the ext4 case gives: routing matches on `severity` and
      # `team`, the paging tier is `sev`, and check-runbooks.py only proves the
      # runbook FILE exists — this is what proves the annotation reaches the
      # alert.
      - eval_time: 30m
        alertname: MinerCoinbaseKeyUnbacked
        exp_alerts:
          - exp_labels:
              alertname: MinerCoinbaseKeyUnbacked
              instance: backup-runner:4130
              job: backup-runner
              severity: ticket
              team: platform
              service: backup-runner
              sev: "3"
            exp_annotations:
              summary: "The last backup contained no miner coinbase key — the one artefact that cannot be rebuilt"
              description: >-
                Backups are running and green, and the encrypted coinbase key is not
                in them. Either BACKUP_AGE_RECIPIENT is unset — in which case there
                is no path that writes a key at all, by design — or neither
                coinbase-keystore.json nor coinbase-key.json was found where the
                runner looked. Losing that key abandons the balance at the address;
                no other artefact in the set has that property.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-miner-coinbase-key-backup.md

  # ══════════════════════════════════════════════════════════════════════════
  # ConformanceCorpusStale — micro-org#439, the half that outlives the ticket.
  #
  # `ConformanceCorpusNeverReplayed` was the rule that caught the original bug:
  # both ends of the conformance gate were built on 2026-08-04 and nothing
  # anywhere called either of them, so `conformance_runs` was empty and
  # `HearthConformanceVectorsFailing` was green for its entire life by never
  # having been asked a question. A scheduled runner closed that on 2026-08-12 —
  # and in closing it made the never-ran rule permanently unfireable, because
  # `sum(beacon_conformance_suites) == 0` cannot come back once eight suites have
  # passed once.
  #
  # THAT IS THE UNFIREABLE SHAPE THIS FILE EXISTS FOR, arriving by success rather
  # than by a typo. Beacon's suite gauge is `distinct on (suite) ... order by
  # suite, ts desc` — the newest row per suite and nothing about its age — so a
  # runner that dies leaves eight `pass` suites standing for ever and every
  # conformance rule stays green off a measurement that stopped. This rule is
  # what notices, and NOTHING IN THE ESTATE CAN OBSERVE IT FIRING except a
  # synthetic series: it needs a day and a half of a runner not running.
  #
  # The values are unix timestamps in SECONDS, which is what makes `time() - x`
  # an age. promtool starts its clock at 0, so "the last run was at t=0" and the
  # age at any eval_time is the eval_time itself — which is precisely the arithmetic
  # the rule does, and a rule written in milliseconds would fail here.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    input_series:
      # One run at the epoch and never again — the runner published once and
      # stopped. The label set is beacon's scrape job: `instance` is pinned in
      # prometheus.yml, `suite` comes from the metric itself.
      - series: 'beacon_conformance_last_run_timestamp_seconds{suite="chain",instance="beacon:4000",job="beacon",service="beacon",team="platform",tier="2"}'
        values: "0+0x2300"

    alert_rule_test:
      # 30h old. Silent, and asserted so: a threshold accidentally written in
      # minutes, or against `24 * 3600`, would fire here and page on an estate
      # whose daily replay merely landed late.
      - eval_time: 30h
        alertname: ConformanceCorpusStale
        exp_alerts: []

      # 36h30m. The expression is true — it crossed at 36h — and `for: 1h` has
      # not elapsed. This case is what stops a slow install or a restart at the
      # wrong moment raising a ticket, and it is asserted so that dropping `for`
      # cannot pass.
      - eval_time: 36h30m
        alertname: ConformanceCorpusStale
        exp_alerts: []

      # 37h30m: over the threshold for a full hour. Every label and annotation
      # spelled out for the reason the ext4 case gives — routing matches on
      # `severity` and `team`, the paging tier is `sev`, and check-runbooks.py
      # only proves the runbook FILE exists. `{{ $labels.suite }}` in particular
      # has to render: a template naming a label the series does not carry comes
      # out empty rather than failing, which is how the `{{ $labels.chain }}`
      # defect this file was written for survived.
      - eval_time: 37h30m
        alertname: ConformanceCorpusStale
        exp_alerts:
          - exp_labels:
              alertname: ConformanceCorpusStale
              suite: chain
              instance: beacon:4000
              job: beacon
              tier: "2"
              severity: ticket
              team: chain
              service: beacon
              sev: "4"
            exp_annotations:
              summary: "Conformance suite chain has not been replayed in over 36h"
              description: >-
                The scheduled runner replays every suite daily. This one's last
                published run is older than a missed cycle, so its status — and the
                HearthConformanceVectorsFailing rule beside it — is reporting a
                measurement that stopped happening rather than a comparison that
                passed. Find the runner, not the divergence.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-conformance-corpus-never-replayed.md

  # The healthy half: a runner doing exactly what it is configured to do. Daily
  # replays mean the age sawtooths between 0 and 24h and never reaches 36 — so a
  # rule that fired here would fire on every correctly-running estate every day,
  # which is how a ticket queue teaches people to close things unread.
  - interval: 1m
    input_series:
      - series: 'beacon_conformance_last_run_timestamp_seconds{suite="chain",instance="beacon:4000",job="beacon",service="beacon",team="platform",tier="2"}'
        values: "0+0x1440 86400+0x900"

    alert_rule_test:
      # 23h: nearly a full cycle old, and correct.
      - eval_time: 23h
        alertname: ConformanceCorpusStale
        exp_alerts: []

      # 30h — six hours after the second replay landed. The age fell back to
      # zero, which is the one thing `beacon_conformance_suites` could never say.
      - eval_time: 30h
        alertname: ConformanceCorpusStale
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════════
  # EmberDifficultySustainedFarAboveFloor — micro-org#451 Phase 0.
  #
  # A single browser tab held mainnet difficulty at ~14,000 (55x the floor) on
  # 2026-08-12 — below this rule's 100x line, deliberately: a lone laptop tab
  # is the case the rule must NOT ticket. The firing case below is 128x, the
  # signature of GPU-class hashrate that does not go home in the evening.
  #
  # Three moments assert the shape of `for: 6h`: quiet at 3h however high the
  # value, quiet at 6h when the level is high-but-human (55x), firing at 6h30m
  # when 128x has stood the whole window. The 55x series is the measured tab
  # from the audit, used as the negative control on the VALUE axis exactly as
  # 3h is the negative control on the TIME axis.
  - interval: 5m
    input_series:
      # 128x the floor (difficulty 32,768), flat for the whole window.
      - series: 'indexer_chain_difficulty{chain="ember", network="mainnet", instance="indexer:4000", job="cf-services"}'
        values: "32768+0x100"
      # The measured 2026-08-12 tab: 55x (difficulty 14080), flat — never fires.
      - series: 'indexer_chain_difficulty{chain="ember", network="testnet", instance="indexer:4000", job="cf-services"}'
        values: "14080+0x100"
    alert_rule_test:
      - eval_time: 3h
        alertname: EmberDifficultySustainedFarAboveFloor
        exp_alerts: []
      - eval_time: 6h30m
        alertname: EmberDifficultySustainedFarAboveFloor
        exp_alerts:
          - exp_labels:
              chain: ember
              network: mainnet
              instance: indexer:4000
              job: cf-services
              severity: ticket
              team: chain
              service: indexer
              sev: "4"
            exp_annotations:
              summary: "EMBER mainnet difficulty has been over 100x the floor for six hours"
              description: >-
                A miner far larger than the browsers has been setting EMBER's
                difficulty for six hours. The chain is healthy — the emergency rule
                bounds the worst block at about two minutes — but browser miners
                cannot win blocks at this level, which is the condition the
                micro-org#451 plan gates its later phases on. Nothing is broken and
                nothing needs restarting; the runbook says what decision is due and
                where the plan lives.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-ember-difficulty-sustained.md

  # ══════════════════════════════════════════════════════════════════════════
  # ExchangeDeskInventoryLow — the desk drains — micro-org#501.
  #
  # Forge Exchange fills a conversion out of the platform's own stock, and that
  # stock is funded by hand. ZERO CONVERSIONS HAVE EVER BEEN POSTED on this
  # estate, so the desk has never moved: `wallet_desk_inventory` has been two
  # flat lines since the day it was seeded, and the only place this rule's
  # firing condition can be produced is here.
  #
  # THIS BLOCK ALREADY EARNED ITS KEEP. The expression was first written as
  # `inventory / max_over_time(...) < 0.1`, which parsed, passed `check-rules`,
  # and was wrong twice: `$value` on a comparison is the LEFT side, so the
  # summary rendered the RATIO ("down to 0.0703 EMBER") instead of a balance,
  # and `0 / 0` is NaN so a desk empty for the whole window never fired at all.
  # Both were found by running these cases, not by reading the rule.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 5m
    input_series:
      # EMBER: holds the seeded 28,432.78 for an hour, then falls to 2,000 —
      # 7% of its own peak. The real desk balance, not a round invention.
      - series: 'wallet_desk_inventory{asset="EMBER", instance="wallet:4000", job="cf-services", service="wallet", team="wallet"}'
        values: "28432.78+0x11 2000+0x30"
      # SHARD: falls by HALF over the same hour and must stay quiet. The
      # negative control on the VALUE axis — the rule is a low-stock alert, not
      # a change detector, and a desk half spent is a desk working as intended.
      - series: 'wallet_desk_inventory{asset="SHARD", instance="wallet:4000", job="cf-services", service="wallet", team="wallet"}'
        values: "1000+0x11 500+0x30"
    alert_rule_test:
      # 55m — the last sample before the drop. Full desk, nothing to say.
      - eval_time: 55m
        alertname: ExchangeDeskInventoryLow
        exp_alerts: []

      # 1h20m — twenty minutes below the line, ten short of `for: 30m`. The
      # negative control on the TIME axis: the half hour exists so that a dip
      # somebody is already fixing does not open a ticket.
      - eval_time: 1h20m
        alertname: ExchangeDeskInventoryLow
        exp_alerts: []

      # 1h35m — thirty-five minutes below. EMBER tickets; SHARD does not.
      #
      # `Exchange desk is down to 2000 EMBER` is the assertion that matters
      # most in this file: it is a BALANCE IN WHOLE UNITS. Under the original
      # division it read `0.0703`, which is not a quantity of anything, and no
      # amount of reading the YAML made that visible.
      - eval_time: 1h35m
        alertname: ExchangeDeskInventoryLow
        exp_alerts:
          - exp_labels:
              asset: EMBER
              instance: wallet:4000
              job: cf-services
              service: wallet
              team: wallet
              severity: ticket
              sev: "3"
            exp_annotations:
              summary: "Exchange desk is down to 2000 EMBER"
              description: >-
                The conversion desk is nearly out of this asset, and it cannot refill
                itself — funding it is an admin action against a real balance. Every
                conversion INTO this asset starts being refused when it reaches zero,
                with a 409 that deliberately does not tell the user why. Decide how
                much the desk should hold before funding it: the figure this fell
                from is the last decision somebody made, not a target.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-exchange-desk-inventory.md

  # ══════════════════════════════════════════════════════════════════════════
  # ExchangeDeskInventoryLow — the desk that was never funded — micro-org#501.
  #
  # Its own block because it is a DIFFERENT FAILURE, not a smaller one. The
  # case above has a peak to fall away from. This one has an account, a balance
  # row of zero, and no history: never funded, or drained longer ago than the
  # 30d window remembers. Every conversion into the asset has been refused for
  # as long as the series has existed and the estate said nothing.
  #
  # `0 <= 0.1 * 0` is true. `0 / 0 < 0.1` is NaN < 0.1, which is FALSE — the
  # division did not merely mis-render this case, it never fired on it. That is
  # the whole reason this block is separate: a reader who changes the operator
  # back has to delete an assertion that says out loud what breaks.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 5m
    input_series:
      - series: 'wallet_desk_inventory{asset="LTC", instance="wallet:4000", job="cf-services", service="wallet", team="wallet"}'
        values: "0+0x24"
    alert_rule_test:
      # 20m — empty from the first sample, but `for: 30m` has not elapsed. The
      # rule is not exempted from its own patience just because the value is 0.
      - eval_time: 20m
        alertname: ExchangeDeskInventoryLow
        exp_alerts: []

      # 40m — fires, with `0` as the value and the asset named.
      - eval_time: 40m
        alertname: ExchangeDeskInventoryLow
        exp_alerts:
          - exp_labels:
              asset: LTC
              instance: wallet:4000
              job: cf-services
              service: wallet
              team: wallet
              severity: ticket
              sev: "3"
            exp_annotations:
              summary: "Exchange desk is down to 0 LTC"
              description: >-
                The conversion desk is nearly out of this asset, and it cannot refill
                itself — funding it is an admin action against a real balance. Every
                conversion INTO this asset starts being refused when it reaches zero,
                with a 409 that deliberately does not tell the user why. Decide how
                much the desk should hold before funding it: the figure this fell
                from is the last decision somebody made, not a target.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-exchange-desk-inventory.md

  # ══════════════════════════════════════════════════════════════════════════
  # ExchangeDeskInventoryShort — somebody was turned away — micro-org#501.
  #
  # The gauge above cannot see an asset the desk holds NO ACCOUNT in: no
  # account, no balance row, no series, and silence that looks exactly like
  # health. This counter is incremented on the refusal itself, so it fires in
  # that case and in every other. It is the reason the pair is a pair.
  #
  # `increase(...[1h]) > 0` rather than `rate(...)`: no conversion has ever been
  # posted, so a 5m rate on this route is a number that rounds to nothing.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 5m
    input_series:
      # Flat at zero for an hour, then one refusal at 65m and no more.
      - series: 'wallet_money_operations_total{route="conversion", outcome="desk_short", instance="wallet:4000", job="cf-services", service="wallet", team="wallet"}'
        values: "0+0x12 1+0x24"
      # The negative control on the LABEL axis, and it is not decoration: this
      # counter carries every conversion outcome on the same name, and a
      # selector that lost `outcome="desk_short"` would page on the healthy
      # ones. Conversions succeeding steadily throughout must change nothing.
      - series: 'wallet_money_operations_total{route="conversion", outcome="ok", instance="wallet:4000", job="cf-services", service="wallet", team="wallet"}'
        values: "0+3x36"
    alert_rule_test:
      # 1h — successes only. Nobody has been refused.
      - eval_time: 1h
        alertname: ExchangeDeskInventoryShort
        exp_alerts: []

      # 1h10m — one refusal in the window. `for: 0m`, so it tickets at once:
      # unlike the gauge, waiting cannot improve this — it has already happened
      # to a person and no retry of theirs fixes it.
      #
      # NO `asset` LABEL, asserted rather than assumed. Which asset the
      # platform's book is short in is a trading signal, withheld from the
      # anonymous 409 for the same reason; if somebody adds it to the counter,
      # this exp_labels block is what refuses.
      - eval_time: 1h10m
        alertname: ExchangeDeskInventoryShort
        exp_alerts:
          - exp_labels:
              route: conversion
              outcome: desk_short
              instance: wallet:4000
              job: cf-services
              service: wallet
              team: wallet
              severity: ticket
              sev: "2"
            exp_annotations:
              summary: "1 conversion(s) refused in the last hour — the desk is out"
              description: >-
                Forge Exchange turned a user away because the desk had nothing to
                fill their conversion with. Nothing is broken and nothing is lost —
                the refusal is checked inside the ledger transaction, so no partial
                posting exists — but the product is not working and only an admin
                funding the desk fixes it. Read `wallet_desk_inventory` to see which
                asset; this series deliberately does not say.
              runbook_url: https://github.com/cloudsforge-online/stack/blob/main/micro/deploy/runbooks/runbook-exchange-desk-inventory.md
