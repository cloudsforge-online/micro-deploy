# Which service is in which SLO tier. Read by scripts/render-prometheus-targets.py,
# attached to every scrape target as the `tier` label, and consumed by exactly one
# thing: the burn-rate rules in rules/slo.yaml.
#
# ── WHY THIS FILE EXISTS AT ALL ───────────────────────────────────────────────
#
# 13-operational-model.md §8 is the authority for what a tier MEANS and what it
# costs: Tier 1 is money and is held to 99.95% — twenty-one minutes of budget in
# twenty-eight days — Tier 2 is product at 99.5%, Tier 3 is the edge. Those
# numbers stay in that document and in rules/slo.yaml. What is here is only the
# MEMBERSHIP, and it is here for three reasons:
#
#   1. It has to be readable on the deploy host, and it is the only such copy.
#      `docs/` is not checked out there — measured 2026-08-09, `/home/malf/dev/
#      cloudsforge` has `org` and `deploy` and no `docs` — so §8 cannot be the
#      runtime source however much it is the authority.
#   2. A tier is a property of a SERVICE, not of a RELEASE. Putting it in the
#      release manifest would make `ledger`'s objective a thing that changes when
#      an image changes, and would need every already-cut manifest hand-edited —
#      files whose own header says "generated by `cfctl release` — do not
#      hand-edit", and which are the rollback path.
#   3. It sits beside its only consumer. rules/slo.yaml, prometheus.yml and the
#      renderer are all in this repository; splitting the map into micro-org
#      would put half of one decision in each of two repositories.
#
# ── AND WHY IT IS NOT A SECOND COPY ───────────────────────────────────────────
#
# It used to be. rules/slo.yaml selected Tier 1 with
# `service=~"ledger|wallet|settlement|custody|indexer|pricing|billing"`, which is
# a list of service names in a file that also has to be right about maths. It had
# already drifted from §8 by the time anyone looked: §8 puts `billing` under
# Tier 2 in as many words — "identity, mint, market, trade, worlds, nda,
# community, studio, billing, notify, activity, hub-api, devplatform" — and that
# regex was holding it to a Tier-1 budget. Nobody noticed because no series ever
# matched the regex; the estate scraped nothing (micro-org#308).
#
# That regex is gone. slo.yaml now selects on `{tier="1"}`, so this file is the
# only place in the estate that says which service is Tier 1, and the renderer
# REFUSES THE DEPLOY rather than defaulting a service it cannot find here — a
# silent default to Tier 2 is how a money service quietly gets a ten-times-looser
# objective, which is the drift the label exists to prevent.
#
# ── THE ELEVEN §8 DOES NOT NAME ───────────────────────────────────────────────
#
# §8 was written before eleven of these services existed and enumerates eighteen.
# Every entry below that §8 does not name carries its reason on the line, drawn
# from 34-service-catalogue.md's own description of what the service does. Two of
# them are judgement calls worth arguing with rather than inheriting silently,
# and both are marked DECISION.

# ── Tier 1 — money. 99.95%, 21 minutes of budget per 28 days ─────────────────
# The five §8 names, and nothing is promoted into this list casually: a Tier-1
# entry is a service somebody can be woken up for.
ledger: "1"       # §8. The single journal. Trial balance has no budget at all.
wallet: "1"       # §8. Deposits credited, withdrawals reserved.
settlement: "1"   # §8. Broadcasts withdrawals. A stuck one is money not moving.
custody: "1"      # §8. Signing. Single replica permanently (AD-18) — hence 99.5% availability there, not here.
indexer: "1"      # §8. Lag past confirmation depth means deposits are provably not being credited.

# DECISION — pricing was already Tier 1 in slo.yaml's regex and §8 does not name
# it. Kept at Tier 1: 34-service-catalogue.md calls it "the USD price oracle;
# four-source median, fails closed on staleness", and every conversion and every
# quoted balance is denominated by it. A wrong or absent price is a money error
# with no 5xx anywhere.
pricing: "1"

# DECISION — policy is new since §8 and is promoted to Tier 1 here.
# 34-service-catalogue.md: "the single risk-decision authority; freezes, limits,
# velocity, holds". Every money-touching operation asks it, and it failing open
# or failing silently is a money outcome rather than a product one. This is the
# one entry in the file that is neither in §8 nor inherited from the old regex;
# if it is wrong, it is wrong loudly and in one place.
policy: "1"

# ── Tier 2 — product. 99.5%, 3h 22m of budget per 28 days ────────────────────
identity: "2"      # §8
mint: "2"          # §8
market: "2"        # §8
trade: "2"         # §8
worlds: "2"        # §8
nda: "2"           # §8
community: "2"     # §8
studio: "2"        # §8
notify: "2"        # §8. §8 adds a delivery SLO for priority=critical; that is a journey, not this label.
activity: "2"      # §8
hub-api: "2"       # §8
devplatform: "2"   # §8

# CORRECTED AGAINST THE OLD REGEX. §8 lists billing under Tier 2 explicitly.
# slo.yaml's hardcoded Tier-1 regex named it anyway, and this is the drift that
# argument predicted. §8 wins.
billing: "2"

# Not in §8 — every one of these postdates it.
admin-api: "2"     # Operator BFF. Two-eyes approvals gate money; the surface itself is not in the money path.
analytics: "2"     # Pseudonymised product analytics (AD-21). Loopback only, no gateway route.
agora: "1"         # Promoted from Tier 2 at wave M5a. The square itself custodies no value, but the process now ALSO runs pricing and policy, both Tier 1 here — pricing feeds every quote in the estate and policy is the moderation authority. A tier is the STRICTEST property of everything in the process, so the absorber inherits its most-critical constituent's tier. devplatform and studio (both Tier 2) do not lower it back.
emberkin: "2"      # Game title.
foresight: "2"     # Parimutuel markets — "never custodies stake" (34-service-catalogue.md), so not Tier 1.
aetherholm: "2"    # Game title.
tessera: "2"       # Game title.
pool: "2"          # Mining pool. Records a PPLNS debt and "credits nobody" — the ledger side of that is ledger's.
faucet: "2"        # Testnet EMBER on-ramp, testnet-only in its own type system. Absent on mainnet.

# The telemetry plane. Listed so this file is complete rather than because the
# label is read today: all three gate /metrics behind a token, so they are
# scraped by their own jobs in prometheus.yml and never appear in the generated
# file_sd list. If one of them ever loses its gate and joins `cf-services`, the
# tier is already here rather than failing a deploy at 3am.
lantern: "2"
beacon: "2"

# NOT LISTED, ON PURPOSE: every `*-web`, `site` and `network-site`. They are
# nginx serving static bundles, they have no /metrics, and the renderer never
# asks this file about them. §8 covers them under Tier 3 as edge, measured from
# Lantern RUM rather than from a scrape.
