# Scrape configuration for the new estate.
#
# Cardinality budget: 500k active series (13-operational-model.md §13).
# `user_id`, `address`, `request_id` and `trace_id` are NEVER labels. They are
# span attributes and log line content, joined on trace_id — which is the whole
# point of running three signals instead of one.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: cf-micro
    env: local

rule_files:
  - /etc/prometheus/rules/slo.yaml
  - /etc/prometheus/rules/alerts.yaml
  - /etc/prometheus/rules/mining.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ------------------------------------------------------- telemetry plane ---
  # The monitor monitors itself. `up == 0` on any of these is the signal that
  # the rest of this file is lying.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          team: platform

  - job_name: otel-collector
    # The collector's own health (spans refused, queue size, exporter failures)
    # AND everything services pushed to it over OTLP, re-exposed for pull.
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          team: platform

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          team: platform

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          team: platform

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          team: platform

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          team: platform

  # -------------------------------------------------------------- beacon ---
  # The gap AD-20 names by name: "Beacon emits Prometheus format explicitly so
  # that adopting a scraper costs a scrape config rather than a rewrite, and
  # nothing has ever scraped it." This is the scrape config.
  #
  # It costs one thing more than AD-20 predicted: a credential. Beacon gates
  # /metrics behind the same auth as every other route (infra/beacon/src/
  # server.js) — deliberately, because an open /metrics publishes the shape
  # of the estate to anyone who can reach the port. Beacon accepts a static
  # break-glass token in an `x-beacon-token` header, so the cost is a scrape
  # config plus BEACON_TOKEN being set.
  #
  # The token is read from a file, never written into this config: a token in a
  # config file is a token in a backup, in a diff and in a screenshot.
  #
  # ── THE PORT, WHICH WAS 4011 AND IS NOT (micro-org#308) ────────────────────
  #
  # This target was `beacon:4011` from the day it was written and had never once
  # succeeded. Measured on the mainnet Prometheus on 2026-08-09:
  #
  #   http://beacon:4011/metrics  down  dial tcp 172.20.0.51:4011: connect:
  #                                     connection refused
  #
  # 4011 is Beacon's own default bind port in its source, and nothing in this
  # estate uses it. `x-common-env` in docker-compose.estate.yml sets `PORT: 4000`
  # on every service so that ONE health-check anchor covers them all, and the
  # compose file publishes Beacon as `4142:4000`. `printenv PORT` inside the
  # running container reads 4000. The scrape was aimed at the port Beacon binds
  # when nobody configures it, on an estate that configures it.
  #
  # This is the target four alert rules stand on — BeaconCriticalJourneyFailing,
  # BeaconJourneyStale, BeaconTargetDown and HearthConformanceVectorsFailing.
  # BeaconScrapeFailing, the rule that says so, WAS working the whole time: a
  # refused connection still produces `up{job="beacon"} == 0`, and on 2026-08-09
  # `/api/v1/alerts` showed it firing continuously since 2026-08-05T21:07:58Z.
  # It went to an Alertmanager whose only receiver is a fire-and-forget webhook
  # with no acknowledgement and no escalation (13-operational-model.md §9), so
  # four days of a correct alert changed nothing. It is worth being precise about
  # which half failed: the rule was right, and the estate had no path from a
  # right rule to a person.
  #
  # ── AND THE TOKEN, WHICH IS THE SECOND HALF ────────────────────────────────
  #
  # Fixing the port alone moves this target from `connection refused` to `401`.
  # `secrets/beacon_token` was 0 bytes on the mainnet host while the running
  # Beacon container had a real BEACON_TOKEN set throughout (measured 2026-08-09:
  # set, 44 characters). Filling it is an operator step, in README §Beacon, not a
  # thing this file can do.
  #
  # The file is no longer tracked. It was committed empty so Prometheus could
  # start — which is a real constraint, this scrape config will not load without
  # the path existing — but "gitignored by emptiness" is a rule enforced by
  # nobody having staged it yet, and on 2026-08-10 the host's checkout had it
  # modified with a real token in the working tree. `../up.sh` creates it
  # unconditionally now, so the path always exists and `.gitignore` can refuse
  # it outright (micro-org#321).
  - job_name: beacon
    scheme: http
    # Beacon holds live state in memory and its /metrics never touches Postgres
    # (metrics.js), so a 30s scrape is free. It is slower than the global
    # 15s because every value behind it changes on Beacon's own probe schedule,
    # not on ours — scraping faster samples the same number twice.
    scrape_interval: 30s
    http_headers:
      x-beacon-token:
        files:
          - /etc/prometheus/secrets/beacon_token
    static_configs:
      # Reached over the estate's own network, which Prometheus joins as an
      # external network. The estate's compose file is not modified and does not
      # know this exists.
      #
      # BY CONTAINER NAME, NOT SERVICE NAME (micro-org#437). `beacon:4000` had
      # two answers from here between 2026-08-11T23:59Z and this change, and the
      # one Docker picked was the TESTNET Beacon — which is why this target read
      # `401 Unauthorized` and why `BeaconScrapeFailing` fired. It was never a
      # token problem: the mainnet token was being presented to a service that
      # was right to refuse it. `instance` is pinned so the series survives the
      # address changing. See the `cf-services` job for the full argument.
      - targets: ["cloudsforge-estate-beacon-1:4000"]
        labels:
          instance: beacon:4000
          team: platform
          service: beacon
          tier: "2"

  # ------------------------------------------- the other two gated /metrics ---
  # `analytics` and `lantern` gate /metrics behind a static header token for the
  # same reason Beacon does, and each argues it in its own source rather than
  # inheriting it:
  #
  #   lantern/src/server.ts — "an open /metrics here publishes which services are
  #   failing and how fast — the shape of where the estate is weakest"
  #   analytics/src/server.ts — "this surface publishes which producers are being
  #   refused and at what rate, which is a map of where the estate's privacy
  #   discipline is weakest. A static token rather than a JWT, because Prometheus
  #   cannot mint one and identity being down is exactly when somebody wants this."
  #
  # Both were written FOR a scraper — they name Prometheus and they chose a
  # static token so that Prometheus could present it — and neither had ever been
  # scraped. Measured from inside the Prometheus container on 2026-08-09:
  # `analytics:4000/metrics` and `lantern:4000/metrics` both 401.
  #
  # THEY CANNOT RIDE IN THE GENERATED file_sd LIST BELOW. Prometheus attaches
  # credentials per scrape JOB, not per target, so a target that needs a header
  # needs a job. That is the whole reason these three are static blocks beside a
  # generated list rather than an inconsistency in it — and
  # `render-prometheus-targets.py` reads THIS FILE to decide what to leave out,
  # so the fact is stated once here and nowhere else.
  #
  # Each token file is 0 bytes in a fresh checkout, which means these targets 401
  # until an operator writes the service's own token into them. See README §Beacon.
  #
  # A FILLED TOKEN FILE ALSO 401s IF THE TARGET IS THE WRONG ESTATE, and these
  # three did exactly that from 2026-08-11T23:59Z (micro-org#437). "401" here has
  # meant both "no token yet" and "right token, wrong container", and the second
  # reading is the one that cost four hours of alerting. Both are addressed by
  # naming the container: a `401` from now on is a token, not an address.
  - job_name: analytics
    scheme: http
    http_headers:
      x-analytics-token:
        files:
          - /etc/prometheus/secrets/analytics_token
    static_configs:
      - targets: ["cloudsforge-estate-analytics-1:4000"]
        labels:
          instance: analytics:4000
          team: platform
          service: analytics
          tier: "2"

  - job_name: lantern
    scheme: http
    http_headers:
      x-lantern-token:
        files:
          - /etc/prometheus/secrets/lantern_token
    static_configs:
      - targets: ["cloudsforge-estate-lantern-1:4000"]
        labels:
          instance: lantern:4000
          team: platform
          service: lantern
          tier: "2"

  # -------------------------------------------------- new estate services ---
  # The estate's backend deployables. Each exposes the RED and job metrics that
  # @cloudsforge/telemetry registers (registerHttpMetrics, registerJobMetrics)
  # on /metrics.
  #
  # Static targets, not Docker service discovery. Docker SD reads the host's
  # Docker socket, which is precisely the collection method AD-20 demotes
  # Lantern away from because it survives neither a second host nor Kubernetes.
  # Building the new stack's scraper on the mechanism we are retiring would be
  # a decision to redo this work.
  #
  # ── THE FILE IS NOW ACTUALLY GENERATED (micro-org#308) ─────────────────────
  #
  # `targets/services.yaml` was the literal `[]` from this file's first deploy
  # until 2026-08-09 — 8 active targets on mainnet, 7 of them this stack watching
  # itself — and its header said it would eventually be rendered from the release
  # manifest. It is: `scripts/render-prometheus-targets.py`, run by
  # `release-deploy.sh` from the same manifest that renders the pinned compose
  # overlay, on every deploy and every rollback. One generated file, one reload,
  # no socket, and one answer to "what is running".
  #
  # The count is deliberately not written down here. It is whatever the release
  # names that answers /readyz, and a number in this comment would be the second
  # answer all over again.
  - job_name: cf-services
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yaml
        refresh_interval: 30s
    relabel_configs:
      # `instance` defaults to host:port, which changes every time a replica is
      # rescheduled and takes every series with it. AD-17 makes deploy.replicas
      # legal; a dashboard that breaks when it is used is not a dashboard.
      - source_labels: [__meta_cf_service]
        target_label: service
      - source_labels: [__meta_cf_team]
        target_label: team

  # ------------------------------------------------------- backup runner ---
  # THE ONE ESTATE CONTAINER THE GENERATED LIST BELOW CANNOT SEE, AND THEREFORE
  # THE ONE THAT NEEDS A JOB HERE (micro-org#310).
  #
  # `render-prometheus-targets.py` renders `targets/services.yaml` by walking the
  # RELEASE MANIFEST and looking each entry up in the compose model that
  # `release-deploy.sh` computes from `docker-compose.estate.yml` plus the pinned
  # release overlay. `backup-runner` is in neither: it is defined only in
  # `compose/docker-compose.backup.yml`, it is `build:`-ed rather than pinned to
  # a digest, and it is brought up by hand per that file's own header. Grepped
  # across every manifest in `org/releases` on 2026-08-10 — no entry names it.
  #
  # That is not a bug in the renderer and it must not be forced into it. The
  # renderer's contract is "what this release deploys", and the honest answer is
  # that the release does not deploy this. Its docstring refuses a second
  # hand-maintained answer to "what is running"; this is not one, for the same
  # reason the three credentialed jobs above are not — a target the generator
  # cannot derive gets a job, and the generator READS this file and skips
  # anything already named here, so if `backup-runner` ever enters a manifest it
  # will not be emitted twice.
  #
  # WITHOUT THIS BLOCK, `BackupAgeExceeded` IS SILENT-GREEN EVEN WHEN THE RUNNER
  # IS WORKING PERFECTLY: an unscraped exporter and a nonexistent metric are the
  # same empty vector to `time() - backup_last_success_unixtime`.
  #
  # It reads `down` until the runner is started, and today it will: measured on
  # mainnet 2026-08-10, `docker ps -a` lists no backup-runner container. That is
  # the same trade the `traefik` block below makes, and it is the right one here
  # — a target that is honestly red about an estate with no backups is not the
  # false red that trains an operator to skim the target page. `BackupNeverRun`
  # is what says it in the alert plane; nothing pages on `up` for this job.
  #
  # 4130 is the port the overlay's own health check probes `/readyz` on, which is
  # the same rule the generator applies to everything else. No credential: this
  # exporter publishes byte counts and timestamps, never a path, a DSN or an
  # address. No `tier` label either — it serves no user traffic and registers no
  # request metrics, so an SLO objective on it would be a burn rate computed over
  # an empty vector.
  - job_name: backup-runner
    static_configs:
      # The one estate target that was NOT ambiguous while micro-org#437 was
      # open, and by luck rather than design: testnet runs no backup runner, so
      # `backup-runner` had one answer when every other bare name had two. It is
      # named by container anyway. "Unique today" is not a property of an
      # address, it is a property of what happens to be deployed, and the day
      # testnet grows a backup runner this target would move estates in silence.
      - targets: ["cloudsforge-estate-backup-runner-1:4130"]
        labels:
          instance: backup-runner:4130
          team: platform
          service: backup-runner

  # ----------------------------------------------- the testnet chain, ONLY ---
  # THE TESTNET ESTATE IS NOT SCRAPED AND THIS JOB IS NOT THE START OF SCRAPING
  # IT. It exists so that two alert rules about a CHAIN have testnet series to
  # match, and it is deliberately narrower than an estate (micro-org#398).
  #
  # ── WHAT WAS WRONG ─────────────────────────────────────────────────────────
  #
  # `EmberTipNotAdvancing` reads `indexer_tip_height{chain="ember"}` with no
  # network selector and its summary says "EMBER {{ $labels.network }} tip" —
  # it was written to cover both networks and it never could. Measured on the
  # mainnet Prometheus 2026-08-11: `/api/v1/label/network/values` answered
  # `["mainnet"]`, full stop. Not because the rule was scoped, but because this
  # Prometheus was attached to `cf-micro-app` and `cloudsforge-estate_default`
  # and to nothing testnet is on, so no testnet series has ever existed here.
  # A rule that cannot match is not a quieter rule; it is an absent one, and the
  # testnet EMBER chain has frozen at least twice with nothing to say so.
  #
  # ── WHY A CONTAINER NAME AND NOT A SERVICE NAME ────────────────────────────
  #
  # Both estates define a service called `indexer`. Prometheus now joins
  # `cf-testnet_default` as well, and on a container attached to two networks
  # `indexer` is ambiguous — Docker's resolver would answer with whichever, and
  # the wrong answer here is indistinguishable from the right one because both
  # serve the same metric names. `cf-testnet-indexer-1` is unambiguous on any
  # network it shares, which is why this target is a container name while every
  # other target in this file is a service name.
  #
  # ── WHY metric_relabel_configs, AND WHY THIS IS NOT OPTIONAL ───────────────
  #
  # `slo.yaml` aggregates `sum by (service) (rate(http_requests_total[5m]))`
  # with NO job selector. Scraping this target whole would fold the testnet
  # indexer's request rate and its 5xx into the MAINNET indexer's error budget,
  # and a burn-rate page would then be a statement about a network nobody is
  # paged for. `indexer_lag_blocks` and `indexer_chain_halted` are dropped for
  # the same class of reason and a sharper one: both carry `severity: page`,
  # `sev: "2"`, and neither is a thing to wake somebody for on testnet.
  #
  # So the keep-list is exactly the two series the two EMBER chain rules read,
  # both of which are `severity: ticket`. Widening it is a decision about what
  # testnet is allowed to page for, and it should be taken as one.
  #
  # `estate: testnet` is on the target rather than derived, and mainnet targets
  # carry no such label: adding one to them would change the identity of every
  # mainnet series and orphan every recording rule and dashboard built on them.
  # Absence means mainnet. That asymmetry is the price of not rewriting history.
  - job_name: cf-indexer-testnet
    # The chain rules read this over 10m and 1h windows; 30s samples them far
    # more finely than either needs, and the testnet indexer is a real service
    # doing real work for a network nobody has an SLO on.
    scrape_interval: 30s
    static_configs:
      - targets: ["cf-testnet-indexer-1:4000"]
        labels:
          team: chain
          service: indexer
          estate: testnet
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: indexer_tip_height|indexer_chain_difficulty
        action: keep

  # ------------------------------------------------------------- gateway ---
  # Traefik, from the gateway overlay. Absent until that stack is up, and a
  # target that is absent rather than down is exactly what `absent()` alerts on.
  - job_name: traefik
    static_configs:
      # `gateway` is ambiguous too — the testnet stack has one, in project
      # `cf-testnet` (micro-org#257), and it answered this scrape while
      # micro-org#437 was open. Traefik's config-reload and entrypoint counters
      # were the testnet gateway's, which is a particularly quiet way to be
      # wrong: both gateways are healthy, so nothing looked like a failure.
      - targets: ["cloudsforge-estate-gateway-1:8082"]
        labels:
          instance: gateway:8082
          team: platform
          service: gateway
