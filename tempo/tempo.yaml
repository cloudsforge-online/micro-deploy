# Tempo — traces, 7 days, tail-sampled upstream.
#
# Chosen in AD-20 because it is object-storage-backed with no index to operate.
# The sampling decision is NOT made here: it is made in the collector, so that
# swapping Tempo for something else does not change what is kept.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short, because a trace already survived a 10s tail-sampling decision before
  # it arrived. Holding it longer only widens the window in which a restart
  # loses spans.
  max_block_duration: 5m

compactor:
  compaction:
    # 7 days, per AD-20. Enough to debug last week; a trace older than that is
    # answered by metrics and the audit plane, not by re-reading a span.
    block_retention: 168h

metrics_generator:
  # Service graphs and span metrics, written into the same Prometheus everything
  # else lands in via remote-write. This is what gives an upstream-call latency
  # panel for a service pair nobody instrumented by hand.
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    # Local filesystem here. The production posture is S3-compatible object
    # storage — the block format is identical, so it is a `backend:` change and
    # not a migration. Stated now so nobody discovers it during a capacity
    # incident.
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
