apiVersion: batch/v1
kind: Job
metadata:
  name: tessera-assets-check-2026-8-82
  namespace: cloudsforge-estate
  labels:
    app.kubernetes.io/name: tessera-assets-check
    app.kubernetes.io/part-of: cloudsforge-estate
    online.cloudsforge.network: mainnet
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessera-assets-check
        app.kubernetes.io/part-of: cloudsforge-estate
        online.cloudsforge.network: mainnet
    spec:
      containers:
      - name: tessera-assets-check
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "set -e\npngs=$$(find /world-assets -name '*.png' | wc -l)\nif [ -f /world-assets/SET.json ]; then\n  want=$$(grep -o '\"materialisedCount\"[^0-9]*[0-9]*' /world-assets/SET.json | grep -o '[0-9]*$$')\n  if [ -z \"$$want\" ]; then\n    echo \"FATAL: /world-assets/SET.json has no materialisedCount.\" >&2\n    echo \"       It was not written by materialise.py, so nothing can say what a\" >&2\n    echo \"       complete mount is. Re-run: python3 materialise.py --provider <id> --into <dir>\" >&2\n    exit 1\n  fi\n  if [ \"$$pngs\" != \"$$want\" ]; then\n    echo \"FATAL: the world-art mount is HALF POPULATED.\" >&2\n    echo \"       SET.json says $$want file(s) were materialised; the mount holds $$pngs.\" >&2\n    echo \"       tessera-web has no fallback sprite, so serving this renders a world with\" >&2\n    echo \"       holes while every healthcheck stays green. Refusing to start.\" >&2\n    exit 1\n  fi\n  set_id=$$(grep -o '\"provider\"[^,]*' /world-assets/SET.json | head -1)\n  echo \"world art: $$pngs file(s), $$set_id \u2014 complete against its own receipt\"\n  exit 0\nfi\nif [ \"$$pngs\" != 0 ]; then\n  echo \"FATAL: /world-assets holds $$pngs PNG(s) and NO SET.json.\" >&2\n  echo \"       Nothing records which asset set this is, and nothing can check it is\" >&2\n  echo \"       whole. The sets are deliberately the same shapes in the same colours,\" >&2\n  echo \"       so 'which model is this?' is not answerable by eye. Materialise it:\" >&2\n  echo \"         python3 materialise.py --provider <id> --into <dir>   # micro-tessera-assets\" >&2\n  exit 1\nfi\necho \"world art: none mounted. /world-assets/ will 404, which is the supported default.\"\necho \"           To serve a set:  CF_WORLD_ASSETS=<dir> ./scripts/estate-up.sh\"\nexit 0\n"
        env:
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/estate/trust.crt
        volumeMounts:
        - name: world-assets
          mountPath: /world-assets
          readOnly: true
        - name: gateway-trust
          mountPath: /etc/ssl/estate/trust.crt
          readOnly: true
          subPath: trust.crt
      volumes:
      - name: world-assets
        persistentVolumeClaim:
          claimName: world-assets
      - name: gateway-trust
        configMap:
          name: gateway-trust
      restartPolicy: Never
---
