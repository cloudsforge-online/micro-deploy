  namespace: cloudsforge-estate
  labels:
    app.kubernetes.io/name: market
    app.kubernetes.io/part-of: cloudsforge-estate
    online.cloudsforge.network: mainnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market
        app.kubernetes.io/part-of: cloudsforge-estate
        online.cloudsforge.network: mainnet
    spec:
      containers:
      - name: market
        image: ghcr.io/cloudsforge-online/micro-market@sha256:cdfe2a6d4b550f77bc3cd99e371925b99a30d61e45d13d934b8d9c79f33f2ecf
        imagePullPolicy: IfNotPresent
        env:
        - name: CF_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: CF_POSTGRES_PASSWORD
              optional: false
        - name: MARKET_IDENTITY_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: MARKET_IDENTITY_CREDENTIAL
              optional: false
        - name: AUTH_EXPECTED_NETWORK
          value: mainnet
        - name: CLOUDSFORGE_TAG
          value: estate
        - name: IDENTITY_ISSUER
          value: http://identity:4000
        - name: IDENTITY_JWKS_URL
          value: http://identity:4000/.well-known/jwks.json
        - name: IDENTITY_URL
          value: http://identity:4000
        - name: INDEXER_URL
          value: http://indexer:4000
        - name: INSTANCE_ID
          value: market-estate
        - name: LEDGER_URL
          value: http://ledger:4000
        - name: LOG_LEVEL
          value: info
        - name: MARKET_DATABASE_URL
          value: postgres://cloudsforge:$(CF_POSTGRES_PASSWORD)@postgres:5432/market?sslmode=require
        - name: NODE_ENV
          value: production
        - name: POLICY_URL
          value: http://policy:4000
        - name: PORT
          value: '4000'
        - name: STUDIO_PUBLIC_URL
          value: https://studio.cloudsforge.online
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/estate/trust.crt
        - name: CF_NETWORK_SINGLE
          value: mainnet
        envFrom:
        - secretRef:
            name: secret-outbox
            optional: false
        volumeMounts:
        - name: gateway-trust
          mountPath: /etc/ssl/estate/trust.crt
          readOnly: true
          subPath: trust.crt
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 45
        ports:
        - containerPort: 4000
      volumes:
      - name: gateway-trust
        configMap:
          name: gateway-trust
---
