  name: identity
  namespace: cloudsforge-estate
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: cloudsforge-estate
    online.cloudsforge.network: mainnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: cloudsforge-estate
        online.cloudsforge.network: mainnet
    spec:
      containers:
      - name: identity
        image: ghcr.io/cloudsforge-online/micro-identity@sha256:da11fd3c93521772093bef9a3d53758f64da73402ad4795d906034ad5fef4e23
        imagePullPolicy: IfNotPresent
        env:
        - name: CF_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: CF_POSTGRES_PASSWORD
              optional: false
        - name: TURNSTILE_HOSTNAMES
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: TURNSTILE_HOSTNAMES
              optional: false
        - name: TURNSTILE_SECRET
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: TURNSTILE_SECRET
              optional: false
        - name: TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: TURNSTILE_SITE_KEY
              optional: false
        - name: AUTH_EXPECTED_NETWORK
          value: mainnet
        - name: CLOUDSFORGE_TAG
          value: estate
        - name: IDENTITY_ACCOUNT_URL
          value: https://hub.cloudsforge.online
        - name: IDENTITY_DATABASE_URL
          value: postgres://cloudsforge:$(CF_POSTGRES_PASSWORD)@postgres:5432/identity?sslmode=require
        - name: IDENTITY_DELETION_GRACE_DAYS
          value: '0'
        - name: IDENTITY_HANDOFF_ORIGINS
          value: https://cloudsforge.online, https://hub.cloudsforge.online, https://network.cloudsforge.online, https://admin.cloudsforge.online, https://status.cloudsforge.online, https://lantern.cloudsforge.online, https://beacon.cloudsforge.online, http://localhost:5172
        - name: IDENTITY_ISSUER
          value: http://identity:4000
        - name: IDENTITY_NETWORK
          value: mainnet
        - name: IDENTITY_PUBLIC_URL
          value: http://identity:4000
        - name: IDENTITY_SERVICE_TOKEN_GRANTS
          value: |-
            {"admin-api":["identity:admin","ledger:post","ledger:read"],
             "agora":["policy:decide"],
             "beacon":["ledger:read"],
             "billing":["admin:read","ledger:post"],
             "community":["indexer:read","ledger:post","policy:decide"],
             "custody":["policy:decide"],
             "emberkin":["billing:read","ledger:post","worlds:title"],
             "faucet":["custody:sign:treasury"],
             "foresight":["admin:read","custody:address:create","custody:sign:deployer","indexer:read","indexer:write","ledger:post","ledger:read","policy:decide"],
             "hub-api":["billing:read","ledger:read","notify:read","policy:decide","pricing:read","wallet:read"],
             "ledger":["indexer:read"],
             "market":["indexer:read","ledger:post","policy:decide"],
             "mint":["custody:address:create","custody:sign:deployer","indexer:read","ledger:post"],
             "nda":["billing:read","worlds:title"],
             "pool":["ledger:post"],
             "settlement":["custody:sign:deposit","custody:sign:treasury","custody:treasury:read","indexer:read","indexer:write","ledger:post"],
             "tessera":["ledger:post","ledger:reserve","studio:read","studio:write"],
             "trade":["ledger:post","ledger:read","ledger:reserve","pricing:read"],
             "wallet":["custody:address:create","indexer:read","indexer:write","ledger:post","ledger:read","ledger:reserve","pricing:read","settlement:read"],
             "worlds":["aetherholm:provision","billing:read","ledger:post","tessera:provision"]}
        - name: INSTANCE_ID
          value: identity-estate
        - name: LOG_LEVEL
          value: info
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '4000'
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/estate/trust.crt
        - name: CF_NETWORK_SINGLE
          value: mainnet
        envFrom:
        - secretRef:
            name: secret-outbox
            optional: false
        - secretRef:
            name: secret-identity-key
            optional: false
        volumeMounts:
        - name: gateway-trust
          mountPath: /etc/ssl/estate/trust.crt
          readOnly: true
          subPath: trust.crt
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 45
        ports:
        - containerPort: 4000
      volumes:
      - name: gateway-trust
        configMap:
          name: gateway-trust
---
apiVersion: apps/v1
