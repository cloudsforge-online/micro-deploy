        envFrom:
        - secretRef:
            name: env-chain
            optional: false
        - secretRef:
            name: env-chain-testnet
            optional: true
        - secretRef:
            name: secret-chainrpc
            optional: true
        - secretRef:
            name: secret-outbox
            optional: false
        volumeMounts:
        - name: gateway-trust
          mountPath: /etc/ssl/estate/trust.crt
          readOnly: true
          subPath: trust.crt
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 45
        ports:
        - containerPort: 4000
      volumes:
      - name: gateway-trust
        configMap:
          name: gateway-trust
