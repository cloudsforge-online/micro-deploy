  name: pricing
  namespace: cf-testnet
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: cloudsforge-estate
    online.cloudsforge.network: testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/part-of: cloudsforge-estate
        online.cloudsforge.network: testnet
    spec:
      containers:
      - name: pricing
        image: ghcr.io/cloudsforge-online/micro-pricing@sha256:905ac285d254d2b49524ade7c69e46a1d18a8640ab5b2c481456ea90b6619f15
        imagePullPolicy: IfNotPresent
        env:
        - name: CF_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: CF_POSTGRES_PASSWORD
              optional: false
        - name: AUTH_EXPECTED_NETWORK
          value: testnet
        - name: CLOUDSFORGE_TAG
          value: estate
        - name: IDENTITY_ISSUER
          value: http://identity:4000
        - name: IDENTITY_JWKS_URL
          value: https://nimbus.cloudsforge.online/.well-known/jwks.json
        - name: IDENTITY_URL
          value: https://nimbus.cloudsforge.online
        - name: INSTANCE_ID
          value: pricing-estate
        - name: LOG_LEVEL
          value: info
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '4000'
        - name: PRICING_DATABASE_URL
          value: postgres://cloudsforge:$(CF_POSTGRES_PASSWORD)@postgres:5432/pricing
        - name: PRICING_MIN_SOURCES
          value: '1'
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/estate/trust.crt
        envFrom:
        - secretRef:
            name: secret-outbox
            optional: false
        volumeMounts:
        - name: gateway-trust
          mountPath: /etc/ssl/estate/trust.crt
          readOnly: true
          subPath: trust.crt
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 45
        ports:
        - containerPort: 4000
      volumes:
      - name: gateway-trust
        configMap:
          name: gateway-trust
---
