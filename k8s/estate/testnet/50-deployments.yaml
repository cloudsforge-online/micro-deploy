  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worlds
        app.kubernetes.io/part-of: cloudsforge-estate
        online.cloudsforge.network: testnet
    spec:
      containers:
      - name: worlds
        image: ghcr.io/cloudsforge-online/micro-worlds@sha256:a6a2a0a264c3adf8a50661321a9a19549e603a4af7c7d0961ec45e0873e601ae
        imagePullPolicy: IfNotPresent
        env:
        - name: CF_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: CF_POSTGRES_PASSWORD
              optional: false
        - name: WORLDS_IDENTITY_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: estate-tokens
              key: WORLDS_IDENTITY_CREDENTIAL
              optional: false
        - name: AUTH_EXPECTED_NETWORK
          value: testnet
        - name: BILLING_URL
          value: http://billing:4000
        - name: CLOUDSFORGE_TAG
          value: estate
        - name: IDENTITY_ISSUER
          value: http://identity:4000
        - name: IDENTITY_JWKS_URL
          value: https://nimbus.cloudsforge.online/.well-known/jwks.json
        - name: IDENTITY_URL
          value: https://nimbus.cloudsforge.online
        - name: INSTANCE_ID
          value: worlds-estate
        - name: LEDGER_URL
          value: http://ledger:4000
        - name: LOG_LEVEL
          value: info
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '4000'
        - name: WORLDS_DATABASE_URL
          value: postgres://cloudsforge:$(CF_POSTGRES_PASSWORD)@postgres:5432/worlds
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/estate/trust.crt
        envFrom:
        - secretRef:
            name: secret-outbox
            optional: false
        volumeMounts:
        - name: gateway-trust
          mountPath: /etc/ssl/estate/trust.crt
          readOnly: true
          subPath: trust.crt
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 45
        ports:
        - containerPort: 4000
      volumes:
      - name: gateway-trust
        configMap:
          name: gateway-trust
