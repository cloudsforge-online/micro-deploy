    GRANT ALL PRIVILEGES ON DATABASE "pricing" TO "cloudsforge";
    ALTER DATABASE "wallet" OWNER TO "cloudsforge";
    GRANT ALL PRIVILEGES ON DATABASE "wallet" TO "cloudsforge";
