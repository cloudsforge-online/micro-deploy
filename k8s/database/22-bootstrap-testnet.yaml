---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-bootstrap
  namespace: cf-testnet
  labels:
    online.cloudsforge.network: testnet
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: database-bootstrap
        online.cloudsforge.network: testnet
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:17-alpine
          command: ['psql']
          args: ['-v', 'ON_ERROR_STOP=1', '-f', '/sql/bootstrap.sql']
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: postgres
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-cloudsforge
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-cloudsforge
                  key: password
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: database-bootstrap
