name: CI

# Mostly a content repository. What CI owes it first is the one check that guards the failure that
# cannot be undone — a committed secret is compromised the moment it lands, whatever kind of
# repository it lands in.
#
# THIS FILE USED TO OPEN "no service, no suite, no image", and that description outlived its truth.
# `deploy/backup` is a deployable with 97 tests of its own, and the `backup` job below is what
# actually runs them; the `rules` job runs the promtool targets that had likewise only ever been
# typed by hand. Both are recorded at the jobs themselves.
#
# ── AND THE DRIFT CHECK, WHICH USED TO RUN NOWHERE ──────────────────────────────────────────────
#
# `scripts/surface-routes.py` asserts that every surface in the registry has a gateway route and
# every route has a surface. It existed and CI never ran it, so it only ever ran when somebody
# remembered — which is how the thing it guards went wrong in the first place. The gateway carried
# a COMMENT describing a `cf-api-explorer` router that was never defined, so the indexer was
# unroutable on every web host, and the network site's chain panel rendered "no figures" for days.
#
# The reason it was not wired is that it needs micro-ui checked out: it reads `SURFACES` by
# EXECUTING micro-ui's own module rather than re-parsing it, so there is one registry and never
# two. A sibling checkout is ordinary here — `micro-aetherholm-web` does it so its route citations
# are verified rather than asserted. It would have needed a token when micro-ui was private; it is
# public now, so it does not.
#
# The `path:` values are explicit because GitHub checks a repository out to `work/<repo>/<repo>` by
# default, while the script resolves `MICRO = ROOT.parent` and `UI = MICRO/ui/packages/ui`. The
# default layout puts them at different depths. That would be LOUD rather than silent — the script
# treats a missing micro-ui as a failure and not a skip, deliberately, "because every surface below
# would go unchecked" — but it would still be wrong.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    with:
      require-dockerignore: false
    permissions:
      contents: read

  # ── THE ONE DEPLOYABLE IN THIS REPOSITORY HAD NO SUITE RUNNING ─────────────
  #
  # This workflow described the repository as having "no service, no suite, no
  # image" until 2026-08-10, and `deploy/backup` had been contradicting it for a
  # while. It is a real Node service — 9 test files, 97 tests — and NOTHING RAN
  # THEM: not this
  # workflow, not `make check`. They were enforced by whoever remembered to type
  # `pnpm test`, which for the one process in the estate holding a superuser DSN
  # for all 29 databases and read access to the custody vault is not enforcement.
  #
  # micro-deploy#46 is why this is a job and not a note. It added the tests that
  # tell the ext4 error detector apart from a stub, after finding that a `count`
  # pinned to zero — a gauge that cannot rise, under an alert whose expression is
  # `> 0` — passed all 88 tests that existed. Tests that catch that class of
  # defect are worth nothing if the only thing that runs them is a habit.
  #
  # ── WHY micro-runtime IS CHECKED OUT ──────────────────────────────────────
  #
  # backup/package.json takes `link:../../runtime/packages/{jobs,lifecycle,
  # telemetry}`. A `link:` is a directory, not a fetch, so the sibling checkout
  # is mandatory — and it needs its OWN install, because `link:` does not install
  # the linked package's dependencies. Measured 2026-08-10 against a clean clone:
  # with runtime present but uninstalled, `disk.test.ts` alone fails with
  # `Cannot find package '@opentelemetry/api'` and the other eight files pass, so
  # the omission would read as one broken test rather than as a missing install.
  #
  # The `path:` values are explicit for the same reason the drift job's are:
  # GitHub checks a repository out to `work/<repo>/<repo>` by default, and the
  # `link:` targets resolve two levels up from `deploy/backup`. A sibling
  # checkout is already ordinary here — the drift job does it with micro-ui.
  backup:
    name: The backup runner's own suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: deploy

      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install micro-runtime
        working-directory: runtime
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Install the backup runner
        working-directory: deploy/backup
        run: corepack enable && pnpm install --frozen-lockfile

      # Typecheck before test, because it is the cheaper failure: a type error is
      # a one-line diff, and finding it under a stack trace from a test that only
      # failed because a signature moved buries it.
      - name: The backup runner typechecks
        working-directory: deploy/backup
        run: pnpm typecheck

      - name: The backup runner's tests pass
        working-directory: deploy/backup
        run: pnpm test

  # ── THE ALERT RULES FIRE, RATHER THAN MERELY PARSING ───────────────────────
  #
  # `make check-rules` — promtool `check rules` — has been in the Makefile the
  # whole time and has never been in CI. It also cannot, by construction, catch
  # the defect this repository keeps shipping: a rule that is valid YAML and can
  # never fire. Three have been deployed. `BackupAgeExceeded` read
  # `backup_last_success_timestamp_seconds` and `LedgerReconciliationDrift` read
  # `ledger_reconciliation_drift_native` and interpolated `{{ $labels.chain }}`;
  # of 1,329 metric names on the mainnet Prometheus, none of the three existed.
  # Every one passed `check rules`, had a runbook, and could not page.
  #
  # `promtool test rules` is the only thing that tells those apart, because it
  # supplies the series itself. `prometheus/rules/alerts.test.yaml` is the first
  # such test and it covers `BackupDestinationFilesystemErrors` — the rule that
  # NOTHING ELSE CAN OBSERVE FIRING, because the ext4 superblock counter it
  # watches reads 0 on the estate host and always has, and a CI runner healthy
  # enough to trust is one whose disk is not logging ext4 errors either.
  #
  # Mutation-proved on 2026-08-10 rather than asserted: `> 0` widened to `> 5`,
  # `for: 5m` deleted, and `{{ $labels.device }}` misspelt as `{{ $labels.disk }}`
  # each take promtool from exit 0 to exit 1. The third is the interesting one —
  # it renders the page as "ext4 has recorded 3 error(s) on , which holds every
  # backup", which is the silent half of the `{{ $labels.chain }}` defect.
  #
  # Docker rather than a promtool binary because the Makefile targets already run
  # it that way, pinned to the same image tag the estate runs. A check that
  # validates a config against a different build from the one that serves it is a
  # check that can pass wrongly.
  rules:
    name: The alert rules fire
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: The rules and the scrape config parse
        run: make check-rules

      - name: BackupDestinationFilesystemErrors actually fires
        run: make check-rule-tests

      # The runbook rule, which has also only ever run by hand. An alert without
      # a runbook is deleted, not silenced: an unactionable page teaches the
      # on-call to ignore pages, and the pages here are about somebody's money.
      - name: Every alert carries a runbook, and every runbook exists
        run: make check-runbooks

  # ── THE TWO NAME-ONLY CREDENTIAL CHECKS, WHICH CI HAS NEVER RUN ────────────
  #
  # Both of these were written for an incident, cited by a runbook, and wired
  # into `make check` — and `make check` IS NOT A CI JOB. This workflow runs
  # `check-rules`, `check-rule-tests`, `check-runbooks` and `check-restart` by
  # name and nothing else, so "it is in `check`" has meant "a person runs it when
  # they already remember the problem", which is the exact failure that let
  # fifteen credential-bearing backups pile up on the chain host (micro-org#429)
  # and a whole second copy of the credential set sit in /home/malf/gwvalidate
  # for a week (micro-org#430). Putting a guard in an aggregate nobody invokes is
  # putting it nowhere; I did that in micro-deploy#90 and this is the correction.
  #
  # These two are the ONLY credential checks that belong in a public log. They
  # read nothing — names in, paths out. `check-secrets` and `check-residue` open
  # files and print variable names and modes, so they stay host-only and stay out
  # of here.
  #
  # A runner has none of the roots, so both report ABSENT BY NAME rather than a
  # bare `ok`. That is deliberate and it is most of the value of the job: if the
  # scan ever becomes vacuous, the log says which roots it did not look at
  # instead of going quietly green.
  secret-file-placement:
    name: No credential file is in the wrong place
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: No backup copy beside a live secrets file
        run: make check-secret-backups

      - name: No secrets file outside the tree that owns it
        run: make check-stray-secrets

  drift:
    name: The registry and the gateway agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: deploy

      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The registry is executed, not parsed, so micro-ui's dependencies must be present.
      - name: Install micro-ui
        working-directory: ui
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Every registry surface has a route, and every route has a surface
        working-directory: deploy
        run: python3 scripts/surface-routes.py

      # ── The tunnel ingress is GENERATED, so the check is a diff ──────────────
      #
      # `cloudflared/gen.py` derives every hostname and its tunnel from the same
      # registry the step above reads — `adminOnly` and `servesUi` are what split
      # the 26 host surfaces into 14 public / 4 operator / 8 API, so a new
      # surface is a registry row and nothing else. `--check` regenerates in
      # memory and fails if the committed files differ.
      #
      # It was 24 into 14 / 4 / 6 until `rpc` and `p2p` were declared. They are
      # the chain's two hostnames, and declaring them is what let the generator
      # DELETE its one hand-written rule: `rpc.<apex>` used to be appended after
      # the derived list, pointed straight at the node's port, past the gateway
      # every other hostname goes through.
      #
      # Wired in the same job rather than a new one because it needs the same
      # micro-ui checkout and the same pnpm install, which is the expensive part.
      - name: The tunnel ingress matches the registry
        working-directory: deploy
        # `--strict` makes a missing PyYAML a failure rather than a skip, so the
        # generated ingress is actually PARSED here. It is not parsed on the
        # machine it was written on: that laptop has neither PyYAML nor a
        # `cloudflared` binary, so the one property cloudflared enforces at
        # startup — a catch-all as the final rule, absent which the tunnel does
        # not come up at all — could not be checked there.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 cloudflared/gen.py --check --strict

      # ── No surface may collide with how an environment names itself ─────────
      #
      # The environment is a SUFFIX ON THE SUBDOMAIN since 2026-08-05
      # (`hub-testnet.cloudsforge.online`, not `hub.testnet.cloudsforge.online`),
      # because Cloudflare's Universal SSL wildcard matches one label and the
      # two-label form failed the handshake at the edge before reaching us.
      #
      # That gives a hostname's first label two halves, and this guards the one
      # assumption that makes it splittable: no registry subdomain may BE an
      # environment label, and none may END IN `-<label>`. Either would make a
      # page on one environment resolve every link, sign-in redirect and API base
      # into the other. Nothing would error; every address would be real and wrong.
      - name: No registry surface collides with an environment label
        working-directory: deploy
        run: python3 scripts/check-apex-prefix.py

      # ── THE PROBER MUST STILL BE ABLE TO FIND THE ESTATE ───────────────────
      #
      # `uptime.yml` probes every public hostname on a schedule, and it derives
      # that list by parsing these same router rules. A parser that quietly
      # stopped matching would leave a GREEN scheduled run probing nothing —
      # which is precisely the failure mode the prober exists to end: silence
      # read as health.
      #
      # `--list` resolves the hostnames and touches no network, so it belongs
      # here, on every push, rather than only on the schedule. It exits non-zero
      # if fewer than twenty hostnames come out of a directory that has never
      # had fewer than twenty-five.
      - name: The uptime prober can still derive the public hostnames
        working-directory: deploy
        run: python3 scripts/probe-public-estate.py --list

      # ── EVERY EMBER MINER RUNS ONE CONSENSUS BUILD ─────────────────────────
      #
      # The miner pins live in two files, one per machine, with nothing linking
      # them — not a project, not an anchor, not an include. micro-deploy#71
      # shipped a HARD FORK by bumping `docker-compose.miners.yml`, wrote in that
      # file's own header that `cf-miner-mainnet-apphost` had to move too, and
      # did not move it, because that line is in `docker-compose.miners-apphost.yml`.
      #
      # The resulting failure is invisible: a miner on the old build past the
      # activation height rejects the first forked block as `wrong difficulty
      # target`, mines a fork of one, and goes on printing `hashing #N` and
      # passing its health check while the estate's EMBER income stops.
      - name: Every hearth-node pin agrees, and is a commit not a tag
        working-directory: deploy
        run: python3 scripts/check-hearth-pins-agree.py

      # ── AN ALERT CAN SELECT A LABEL SET THE ESTATE NEVER EMITS ─────────────
      #
      # `NotifyReservedDomainGuardLost` shipped with `up{job="notify"}`, and
      # there is no job called `notify`: every application service is scraped by
      # one file_sd job, `cf-services`, which relabels `__meta_cf_service` into
      # `service`. Measured on mainnet the day it shipped, `up{job="notify"}`
      # returned NO SERIES while notify was up and healthy.
      #
      # That selector was the half of the alert written for "the metric is
      # absent" — so the alert covering a build too old to export the guard could
      # not fire when the guard was missing. A ticket about an unfireable alert,
      # fixed with another one.
      #
      # `promtool test rules` passed the whole time, because the fixtures INVENTED
      # `job="notify"` in their `input_series`. promtool answers what the rules do
      # to the series you hand it; hand it a label set no scrape config produces
      # and it confirms the rule works on a world that does not exist. This step
      # reads the fixtures too, which is the only reason it would have caught it.
      - name: Every job= in an alert rule names a job Prometheus scrapes
        working-directory: deploy
        run: python3 scripts/check-alert-job-labels.py

      # ── A ROTATION LEAVES A SECOND COPY OF THE CREDENTIAL SET BEHIND ────────
      #
      # Every rotation this estate has run made a copy of the file it was about
      # to edit, and every one of them left it there — four `.bak-*` files beside
      # live secrets files across four rotations, the latest found during the
      # bitcoind `rpcauth` rotation of 2026-08-11.
      #
      # They are not stale. `compose/estate/tokens.env.bak-1785933479` held 39
      # values of which 37 were BYTE-IDENTICAL to the live `tokens.env` — only
      # `SMTP_PASS` had moved — so it was a second complete copy of every service
      # token, the operator password and the beacon token.
      #
      # Nothing catches it, because every other guard here is aimed at the
      # commit and this failure never reaches one: `compose/secrets/` is ignored
      # as a directory and `compose/estate/tokens*` globs the whole tail. The
      # risk is on-disk longevity — a retired credential with no expiry, no owner
      # and an older mode, on a network-reachable host — and the estate is
      # perfectly healthy the entire time. It surfaces months later as a
      # permanent red in `make check-residue`, which is where a check stops being
      # read.
      #
      # It prints FILENAMES. It never reads, greps or prints the contents of a
      # scanned file — that is the rule whose violation caused the rotation this
      # check came out of, and a CI log here is public.
      - name: No backup of a secrets file is lingering beside the live one
        working-directory: deploy
        run: ./scripts/check-no-secret-backups.sh

      # ── THE GATEWAY CANNOT LOG A CLIENT IP, AND NOW SOMETHING SAYS SO ───────
      #
      # micro-org#163 found that Traefik logs no client address here, and then
      # named the real defect: it is true "by accident of topology, not by an
      # explicit rule, and nothing tests it". Both accidents are one line from
      # ending. Headers are absent from the access log because Traefik DEFAULTS
      # `accesslog.fields.headers.defaultMode` to drop — nothing in
      # `docker-compose.gateway.yml` asks for that. And `ClientHost`, a core
      # field kept by default and present in every line today, is loopback only
      # because cloudflared is the peer and every gateway port is bound to
      # 127.0.0.1.
      #
      # So one `--accesslog.fields.headers.names.Cf-Connecting-Ip=keep` added
      # while debugging a rate limit, one entrypoint given
      # `forwardedHeaders.trustedIPs`, or one port published on 0.0.0.0 puts the
      # true client address of every request in this estate into a JSON log that
      # ships to Loki — with no flag in the diff named "log client IPs", no
      # error, and nothing to notice it. An IP address is personal data.
      #
      # This is the rule. It scans every compose file rather than the gateway's
      # alone, because an overlay that turns header logging on is the same defect
      # in a different file. It prints no address, only field names and counts.
      - name: The gateway cannot log a client IP address
        working-directory: deploy
        run: python3 scripts/check-client-ip-logging.py

      # ── SOMETHING IS ACTUALLY SCRAPED (micro-org#308) ───────────────────────
      #
      # `prometheus/targets/services.yaml` held the literal `[]` from the day the
      # telemetry plane was deployed until 2026-08-09. Prometheus reported 8
      # active targets on mainnet, 7 of which were the monitoring stack watching
      # itself, while 48 services ran — so every alert rule that reads an estate
      # metric evaluated against no data, including every money alert. Two real
      # incidents this month (#247/#248, #307) were found by a person while a
      # rule for exactly that condition sat deployed and unfireable.
      #
      # The file is generated from the release manifest now. This is the check on
      # the generator, and it needs neither Docker nor the estate's gitignored
      # env files: it feeds the real renderer a fixture compose model, so it can
      # only go red for the thing it is about.
      - name: The scrape list is rendered from the release
        working-directory: deploy
        run: python3 scripts/check-prometheus-targets-render.py

      # ── and every address in it means one container ──────────────────────────
      #
      # The check above asks whether the right SERVICES are listed. This asks
      # whether the addresses resolve to the estate being monitored. On
      # 2026-08-11 they stopped: Prometheus was attached to `cf-testnet_default`
      # to reach one container for the testnet chain job (micro-org#398), that
      # network sorts before `cloudsforge-estate_default`, and Docker's DNS
      # answered every bare service name with the TESTNET container — while the
      # samples kept the mainnet job's labels. Every target stayed `up`, every
      # number stayed plausible, and the whole alert plane was evaluating the
      # wrong network for four hours (micro-org#437).
      - name: No scrape target is a bare service name
        working-directory: deploy
        run: python3 scripts/check-prometheus-target-ambiguity.py

      # ── The two projects stay renderable, and mainnet stays unchanged ────────
      #
      # `compose/testnet.env` is six variables that turn these files into a second
      # isolated project. The value of the defaults is that an unset environment
      # renders IDENTICALLY to before — so that is asserted here rather than
      # trusted, by rendering both and requiring the mainnet ports to be the 41xx
      # set and the testnet ports to be disjoint from them.
      # ── The custody keyring is not in this repository, and this proves it ────
      #
      # `CUSTODY_MASTER_SECRET_V1` was a HARDCODED LITERAL on two blocks of
      # `compose/docker-compose.estate.yml` — the key-encryption key for every
      # custodied private key and every HD seed on the estate, in a repository
      # `gh repo view` reports PUBLIC. It cleared every check that existed: it was
      # 40 characters against a 32-character floor, and the comment above it said
      # so approvingly.
      #
      # The grep is the half a person cannot forget to run. It fails on any
      # `CUSTODY_MASTER_SECRET_V<n>` given a value in a tracked file, which is the
      # exact shape of the defect and is not a shape any correct commit has.
      #
      # THE THROWAWAY FILES ARE NOT A CONVENIENCE EITHER. `env_file: required:
      # true` means a missing keyring stops `docker compose config` — so the two
      # render steps below would fail on a clean checkout, and minting values here
      # is what keeps them honest rather than making the requirement optional.
      # They are generated, never written down: a literal here would be a string
      # somebody copies into a deployment, which is how this started.
      - name: No master-secret literal is committed, and CI mints throwaway keyrings
        working-directory: deploy
        run: |
          set -uo pipefail
          # `|| true` is load-bearing: `git grep` exits 1 on no match and the step
          # runs under `bash -e`, so a clean repository would abort here instead of
          # reaching the verdict. Same rule as micro-org/secret-hygiene.yml.
          # `$` excuses an interpolation, `%` a printf placeholder (the mint below
          # is itself a match otherwise), quotes and `#` an empty or commented one.
          # Everything else is a literal value and is the defect.
          hits=$(git grep -nIE 'CUSTODY_MASTER_SECRET_V[0-9]+ *[:=] *[^ $%"'"'"'#]' || true)
          if [ -n "$hits" ]; then
            echo "::error::a custody master secret is given a value in a tracked file"
            echo "$hits" | sed -E 's/(SECRET_V[0-9]+ *[:=] *).*/\1<redacted>/'
            echo "The keyring belongs in compose/secrets/, which is gitignored."
            echo "If this value was ever pushed, rotate it: runbooks/runbook-custody-master-secret.md"
            exit 1
          fi
          echo "ok: no master secret is given a value anywhere in the tree"

          # THE SAME DEFECT, THE SAME SHAPE, A SECOND KEY. `OUTBOX_SIGNING_SECRET`
          # was a hardcoded placeholder on 54 lines of the same PUBLIC file, across
          # 24 services and 7 variable names — one shared HMAC key signing every
          # outbox->inbox hop in the estate. It cleared every check that existed
          # for the same reason the custody one did: 40 characters against a
          # 24-character floor, and a comment saying to change it in production.
          #
          # The alternation is the alias list, not a guess: the services read ONE
          # key under seven names, so a guard naming only `OUTBOX_SIGNING_SECRET`
          # would pass while the same value sat in `INBOUND_SIGNING_SECRET`.
          hits=$(git grep -nIE '(OUTBOX_SIGNING_SECRET|OUTBOX_ACCEPT_SECRETS|INBOUND_SIGNING_SECRET|NOTIFY_INGEST_SIGNING_SECRET|ACTIVITY_INGEST_SECRETS|ANALYTICS_DELIVERY_SECRETS|COMMUNITY_INGEST_SECRETS|DEVPLATFORM_INGEST_SECRETS) *[:=] *[^ $%"'"'"'#<]' || true)
          if [ -n "$hits" ]; then
            echo "::error::an outbox signing secret is given a value in a tracked file"
            echo "$hits" | sed -E 's/(SECRETS? *[:=] *).*/\1<redacted>/'
            echo "The key belongs in compose/secrets/, which is gitignored."
            echo "If this value was ever pushed, rotate it: runbooks/runbook-outbox-signing-secret.md"
            exit 1
          fi
          echo "ok: no outbox signing secret is given a value anywhere in the tree"

          # THE SAME DEFECT AGAIN, AND THESE TWO ARE THE WORST OF THE SET TO LOSE.
          # `IDENTITY_KEY_SECRET` (#188) and `ANALYTICS_PSEUDONYM_KEY` (#189) were
          # literals in this PUBLIC file, the SAME value on both networks, and both
          # cleared every gate that existed: over the length floor, not one of the
          # known placeholder strings.
          #
          # What makes them worse than a transport credential is that neither is
          # merely re-issuable. The first WRAPS every RS256 signing key and every
          # TOTP seed, so a naive replacement does not invalidate MFA, it destroys
          # it — the seed exists in that blob and in the user's authenticator and
          # nowhere else. The second DERIVES stored pseudonyms, so a naive
          # replacement orphans pre-rotation rows from their subject and breaks
          # erasure for exactly those rows, which is a GDPR failure rather than a
          # data-quality one.
          #
          # The suffixed forms are in the alternation because the fix for both was
          # a VERSIONED ring: a guard naming only the bare variable would pass while
          # `IDENTITY_KEY_SECRET_V2` sat in a tracked file, which is the same blind
          # spot the outbox alias list above exists to close.
          hits=$(git grep -nIE '(IDENTITY_KEY_SECRET(_V[0-9]+)?|ANALYTICS_PSEUDONYM_KEY(_V[0-9]+)?) *[:=] *[^ $%"'"'"'#<]' || true)
          if [ -n "$hits" ]; then
            echo "::error::an identity KEK or an analytics pepper is given a value in a tracked file"
            echo "$hits" | sed -E 's/(SECRET(_V[0-9]+)?|KEY(_V[0-9]+)?)( *[:=] *).*/\1\4<redacted>/'
            echo "Both belong in compose/secrets/, which is gitignored, one file per network."
            echo "If either was ever pushed, rotating it is NOT a restart: identity must drain"
            echo "with 'pnpm rewrap' before the old key is removed, and an analytics pepper"
            echo "cannot be drained at all — see runbooks/runbook-identity-key-secret.md and"
            echo "runbooks/runbook-analytics-pseudonym-key.md."
            exit 1
          fi
          echo "ok: no identity KEK or analytics pepper is given a value anywhere in the tree"

          # THE SAME DEFECT, A THIRD TIME, AND THE WIDEST OF THE THREE.
          # `POSTGRES_PASSWORD` was a literal on the `postgres` service AND spelled
          # out inside 56 `postgres://cloudsforge:...@postgres` connection strings
          # in the same PUBLIC file — 57 copies of one value, byte-identical on
          # mainnet and testnet, so testnet access was mainnet access at the
          # database layer. micro-org#157.
          #
          # TWO PATTERNS, because the two spellings fail differently. A guard that
          # only knew `POSTGRES_PASSWORD` would have passed this file on the day it
          # was worst: the variable was one line and the URLs were fifty-six, and
          # it is the URLs that a careless edit reintroduces one at a time.
          #
          # ── AND BOTH ARE NARROWER THAN THE OBVIOUS VERSION, FOR A MEASURED
          # REASON. Written the obvious way this guard failed on SEVEN lines the
          # day it was added, every one of them a false positive and one of them
          # its own error message: `${CF_POSTGRES_PASSWORD:?...}` reads as
          # `PASSWORD:` followed by `?`, a sed replacement reads as `PASSWORD=`
          # followed by `/`, and a comment citing `postgres://user:...@host` reads
          # as a URL with a password of `...`. A guard that cries wolf on the
          # commit that introduces it is a guard somebody switches off.
          #
          # So the variable form is ANCHORED to the start of a line — it is a YAML
          # key or an env-file assignment, never a fragment inside `${...}` — and
          # the URL form skips comment lines and elided examples. The defect's own
          # shape is matched by both; that is checked below rather than asserted,
          # by keeping the pre-rotation spelling in the test above this step.
          hits=$(git grep -nIE -e '^ *POSTGRES_PASSWORD *[:=] *[^ $%"'"'"'#<]' \
                               -e 'postgres(ql)?://[^:@/ ]+:[^$@ .]+@' \
                 | grep -vE ':[0-9]+: *#' || true)
          if [ -n "$hits" ]; then
            echo "::error::a Postgres password is given a literal value in a tracked file"
            echo "$hits" | sed -E 's#(PASSWORD *[:=] *).*#\1<redacted>#; s#(://[^:]*:)[^@]*@#\1<redacted>@#'
            echo "It belongs in compose/estate/tokens.env (mainnet) or tokens.testnet.env"
            echo "(testnet), both gitignored, interpolated as \${CF_POSTGRES_PASSWORD}."
            echo "If this value was ever pushed, rotate it: runbooks/runbook-postgres-password.md"
            exit 1
          fi
          echo "ok: no Postgres password is spelled out in any tracked file, variable or URL"

          mkdir -p compose/secrets
          umask 077
          for network in mainnet testnet; do
            printf 'CUSTODY_KEY_VERSION=2\nCUSTODY_MASTER_SECRET_V2=%s\n' \
              "$(openssl rand -base64 48)" > "compose/secrets/custody.${network}.env"
            # Same argument as the keyring above: `required: true` means a missing
            # file stops `docker compose config`, so the render steps below would
            # fail on a clean checkout. Minted, never written down.
            outbox="$(openssl rand -base64 48)"
            {
              printf 'OUTBOX_SIGNING_SECRET=%s\n' "$outbox"
              printf 'OUTBOX_ACCEPT_SECRETS=%s\n' "$outbox"
              for alias in ACTIVITY_INGEST_SECRETS ANALYTICS_DELIVERY_SECRETS \
                           COMMUNITY_INGEST_SECRETS DEVPLATFORM_INGEST_SECRETS \
                           NOTIFY_INGEST_SIGNING_SECRET INBOUND_SIGNING_SECRET; do
                printf '%s=%s\n' "$alias" "$outbox"
              done
            } > "compose/secrets/outbox.${network}.env"
            # AND STUDIO'S, for the same `required: true` reason. This one was
            # missing and nothing noticed, because the two guards above this loop
            # were failing first and the render steps never ran — a check hidden
            # behind another check's failure is a check nobody knows is broken.
            # The endpoint is a URL rather than a secret; the key is minted.
            {
              printf 'AZURE_FOUNDRY_ENDPOINT=%s\n' 'https://example.invalid/'
              printf 'AZURE_FOUNDRY_API_KEY=%s\n' "$(openssl rand -hex 32)"
            } > "compose/secrets/studio.${network}.env"
            # IDENTITY'S KEY-ENCRYPTION KEYRING AND ANALYTICS'S PEPPER (#188, #189),
            # for the same `required: true` reason as every file above.
            #
            # Minted per network and never written down, which also matches what the
            # live estate now holds: the whole point of both rotations was that the
            # two networks stopped sharing one value. A single shared literal here
            # would let a render pass that production would not.
            #
            # ONE VERSION EACH is correct for a render check. The multi-version form
            # is what a ROTATION needs, and it is exercised where it belongs —
            # identity/src/rewrap.test.ts and analytics/src/rotation.test.ts, both of
            # which assert that dropping the old value without draining BREAKS.
            printf 'IDENTITY_KEY_VERSION=1\nIDENTITY_KEY_SECRET_V1=%s\n' \
              "$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-48)" \
              > "compose/secrets/identity-key.${network}.env"
            printf 'ANALYTICS_PSEUDONYM_VERSION=1\nANALYTICS_PSEUDONYM_KEY_V1=%s\n' \
              "$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-48)" \
              > "compose/secrets/analytics-pepper.${network}.env"
          done
          echo "ok: throwaway keyrings, bus keys, KEKs and peppers minted for the render steps"

          # AND THE TOKENS FILES, which is where `CF_POSTGRES_PASSWORD` lives now
          # that it is not a literal. `:?` in the compose file means a missing one
          # stops `docker compose config` outright, so the render steps below
          # cannot run on a clean checkout without these — the same argument as
          # the keyring above, and the reason that `:?` is safe to rely on.
          #
          # TWO DIFFERENT VALUES, ON PURPOSE. The point of the rotation was that
          # the networks stopped sharing one password, and the assertion in the
          # render step below can only detect a regression to a shared value if
          # what CI hands the two renders is itself different.
          mkdir -p compose/estate
          # EVERY `:?` VARIABLE, NOT JUST THE POSTGRES PASSWORD. `fix(estate): the
          # three tokens no deploy could reach, and two that outlived their use`
          # promoted five more to `${VAR:?...}` — ANALYTICS_TOKEN, BEACON_TOKEN,
          # LANTERN_TOKEN, FAUCET_TOKEN and FAUCET_REQUESTER_SALT — which is the
          # right call for the estate and made `docker compose config` stop at the
          # first one on a clean checkout. Every run since has been red at
          # `check-restart`, on FAUCET_TOKEN, for a reason that had nothing to do
          # with restart policies.
          #
          # So this list is derived rather than typed, and that is the point: it
          # reads the `:?` requirements straight out of the compose file, so the
          # NEXT variable promoted to required is minted here on the day it is
          # promoted and nobody has to remember this step exists. A hand-written
          # list is what just cost four commits their CI.
          #
          # Throwaway, per network, and deliberately different between the two —
          # a shared literal would let a render pass that production would not.
          required_vars=$(grep -oE '\$\{[A-Z0-9_]+:\?' compose/docker-compose.estate.yml \
            | sed 's/\${//; s/:?//' | sort -u)
          echo "required by the compose file: $(echo "$required_vars" | tr '\n' ' ')"
          for f in compose/estate/tokens.env compose/estate/tokens.testnet.env; do
            : > "$f"
            for v in $required_vars; do
              printf '%s=%s\n' "$v" "$(openssl rand -hex 24)" >> "$f"
            done
          done
          echo "ok: $(echo "$required_vars" | wc -l) throwaway secrets minted per network, all different"

      # ── EVERY LONG-RUNNING SERVICE COMES BACK BY ITSELF ──────────────────────
      #
      # The estate is one HP ProLiant. Compose has no default restart policy, so a
      # service with no `restart:` key gets Docker's default of `no` — it stays
      # down after a power cut, a `systemctl restart docker` or an OOM kill, and
      # nothing starts it again. That was true of all 29 APIs and of `postgres`.
      #
      # The fix put `restart: unless-stopped` on a shared anchor. An anchor is
      # OPT-IN, so a service that forgets `<<: *service-defaults` silently
      # inherits `no`, and until this step NOTHING CHECKED — the regression would
      # have been discovered by an outage. Filed as a `vacuous-check` for exactly
      # that reason: there was no check at all, not a weak one.
      #
      # Run before the render step below because it is the cheaper failure: a
      # missing restart policy is a one-line diff, and finding it after a
      # port-collision assertion has already failed buries it.
      - name: Every long-running service will come back after a reboot
        working-directory: deploy
        run: make check-restart

      - name: The two compose projects do not collide
        working-directory: deploy
        run: |
          set -euo pipefail
          # BOTH env files, both times. `--env-file` REPLACES the default `.env`
          # rather than adding to it, so naming only the network file drops every
          # credential in the tokens file — the defect that cost testnet its whole
          # keyring in #158, reproduced here in miniature the moment the Postgres
          # password stopped being a literal.
          docker compose --env-file compose/mainnet.env \
            --env-file compose/estate/tokens.env \
            -f compose/docker-compose.estate.yml config --format json \
            > /tmp/mainnet.json
          docker compose --env-file compose/testnet.env \
            --env-file compose/estate/tokens.testnet.env \
            -f compose/docker-compose.estate.yml config --format json > /tmp/testnet.json
          python3 - <<'PY'
          import json
          mn = json.load(open('/tmp/mainnet.json'))
          tn = json.load(open('/tmp/testnet.json'))
          def ports(d):
              return {p['published'] for s in d['services'].values() for p in s.get('ports', [])}
          mp, tp = ports(mn), ports(tn)
          assert mn['name'] == 'cloudsforge-estate', f"mainnet project name changed: {mn['name']}"
          assert tn['name'] == 'cf-testnet', f"testnet project name wrong: {tn['name']}"
          overlap = sorted(mp & tp)
          assert not overlap, f"the two projects would both bind: {overlap}"

          # THE TWO ENVIRONMENTS MUST NOT SHARE A KEYRING. The env_file path is
          # interpolated on CF_EMBER_NETWORK, and if that interpolation ever broke
          # both estates would silently fall back to one file — one compromise
          # taking both. Compared, never printed: an assertion that echoes the
          # value it is protecting has published it into the build log.
          def keyring(d, service):
              env = d['services'][service]['environment']
              got = {k: v for k, v in env.items() if k.startswith('CUSTODY_MASTER_SECRET_V')}
              assert got, f"{service} has no master secret at all — env_file did not resolve"
              return got
          for service in ('custody', 'custody-migrate'):
              m, t = keyring(mn, service), keyring(tn, service)
              assert m != t, f"{service}: both environments resolved the SAME keyring file"
              for name, value in m.items():
                  assert len(value) >= 43, f"{service}: {name} is too short to be a generated secret"
          print("ok — mainnet and testnet custody hold separate keyrings, service and migrator alike")

          # THE TWO ESTATES MUST NOT SHARE A POSTGRES PASSWORD. One value stood in
          # 57 places across BOTH networks (micro-org#157), so testnet access was
          # mainnet access at the database layer. Compared, never printed — an
          # assertion that echoes the value it protects has published it.
          def pg(d):
              return d['services']['postgres']['environment']['POSTGRES_PASSWORD']
          mpw, tpw = pg(mn), pg(tn)
          assert mpw and tpw, "a POSTGRES_PASSWORD rendered EMPTY — the tokens file never reached the render"
          assert mpw != tpw, "mainnet and testnet rendered the SAME Postgres password"
          assert min(len(mpw), len(tpw)) >= 24, "a Postgres password is under the 24-character floor"

          # AND EVERY CONNECTION STRING MUST CARRY ITS OWN NETWORK'S VALUE. The
          # variable was never the hard part: 56 of the 57 copies were spelled out
          # inside `postgres://cloudsforge:...@postgres` URLs, and that is the form
          # a careless edit reintroduces one line at a time.
          def urls(d):
              return [(s, k, v) for s, spec in d['services'].items()
                      for k, v in (spec.get('environment') or {}).items()
                      if isinstance(v, str) and v.startswith('postgres://')]
          for own, other, d, label in ((mpw, tpw, mn, 'mainnet'), (tpw, mpw, tn, 'testnet')):
              got = urls(d)
              assert got, f"{label}: not one connection string rendered"
              for s, k, v in got:
                  assert f':{own}@' in v, f"{label}: {s}.{k} does not carry this network's password"
                  assert f':{other}@' not in v, f"{label}: {s}.{k} carries the OTHER network's password"
          print(f"ok — the estates hold different Postgres passwords, across "
                f"{len(urls(mn))} mainnet and {len(urls(tn))} testnet connection strings")

          print(f"ok — {len(mp)} mainnet ports, {len(tp)} testnet ports, no overlap; "
                f"projects {mn['name']} / {tn['name']}")
          PY

      # ── A RELEASE PINS WHAT IT NAMES, INCLUDING WHAT SITS BEHIND A PROFILE ──
      #
      # `release-render.py` asks `docker compose config --services` which services
      # this environment defines. That command reports only ACTIVE profiles, so
      # with no `--profile` flag it reports only the unprofiled ones — and a
      # profiled service was read as "not in this environment", lost its pin, and
      # kept the base file's `build:`. A release deploy then builds it from
      # whatever is checked out on the host while the manifest records a tag.
      #
      # Measured on the mainnet host on 2026-08-09 while cutting 2.5.7: 46 of 48
      # manifest entries rendered, the two missing being `faucet` and `pool` —
      # every profiled deployable in the file. The overlay reported it, in a
      # comment on its own last line, and nothing failed.
      #
      # `pool` is why this is a check and not a note. It ships behind a profile
      # and is started by hand, so it is the one service whose pin nobody would
      # see drop until it was already running the wrong code.
      #
      # The fixture is two services, one profiled, because the estate file needs
      # the gitignored keyring to interpolate. Real renderer, real compose, small
      # input.
      - name: A release overlay pins profile-gated services too
        working-directory: deploy
        run: python3 scripts/check-release-render-pins-profiles.py

      # ── AND THE PROVENANCE CHECK SURVIVES THE MECHANISM IT VERIFIES ──────────
      #
      # The step above proves a release is pinned to a digest. This one proves the
      # check that answers "what is running, and which git ref built it?" can still
      # read the estate afterwards. It could not: it split the `docker ps` image
      # reference on `:`, and a digest reference has no tag to find.
      #
      # 2.5.8 is the first release deployed by digest, so this is not hypothetical
      # and the failure is not quiet. Measured 2026-08-09 against the docker CLI
      # with `/containers/json` served by a stub, `{{.Image}}` on the estate's
      # image store renders a digest-pinned container as
      # `ghcr.io/cloudsforge-online/micro-identity` — the digest deleted, nothing
      # left that parses as a version — so all 46 services would have reported
      # MISMATCH at once, during a release, reading as a provenance emergency
      # rather than as the check's own defect.
      #
      # The rows fed to it are built from the REAL renderer's output resolved by
      # REAL `docker compose config`, so the label that carries the tag onto a
      # digest-pinned container is exercised across the seam rather than typed
      # twice. `node` is needed because the check reads each package.json version
      # with `node -p`; it is already installed for micro-ui above.
      - name: The provenance check can still read a digest-pinned estate
        working-directory: deploy
        run: python3 scripts/check-provenance-reads-digest-pins.py

      # ── SETTLEMENT'S CHAIN MAP IS JSON IN EVERY COMBINATION, OR IT IS A LOOP ──
      #
      # `x-settlement-rpc-urls` builds a JSON object by string concatenation out of
      # `${VAR:+,"key":"$VAR"}` fragments — one per optional chain, now `ltc`,
      # `doge` and `etc` (micro-settlement#8). A comma one character outside an
      # expansion, or a `:-` where a `:+` was meant, and the value stops being JSON
      # or gains an empty entry.
      #
      # Either is FATAL rather than degraded: settlement's `env.ts` is eager and
      # `src/migrator.ts` imports it, so a malformed map throws at import on the
      # migrator as well as the service, under `restart: unless-stopped`. The whole
      # point of micro-settlement#8 making an absent endpoint a `no_endpoint`
      # STATUS was to keep one unconfigured chain off the six that are configured,
      # and a bad render here hands that property straight back.
      #
      # All sixteen combinations of the four optional variables — `btc` joined
      # `ltc`, `doge` and `etc` on 2026-08-11 — rendered by real compose from the
      # anchor READ OUT of the estate file rather than copied into the check.
      # PyYAML installed in this step rather than relied upon from an earlier one,
      # for the reason the step below gives: a check whose correctness depends on
      # the order of the steps around it breaks silently when somebody reorders
      # them.
      - name: Settlement's RPC map is valid JSON with any set of chains configured
        working-directory: deploy
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-settlement-rpc-urls.py

      # ── AND NO CHAIN IS OPEN TO DEPOSITS THAT SETTLEMENT CANNOT PAY OUT OF ──
      #
      # The step above proves settlement's endpoint map renders. This one proves
      # the estate never opens a chain that map cannot name, which is the other
      # half of the same question and the half nothing asked.
      #
      # `WALLET_FEE_QUOTES` is not only the withdrawal price list: `wallet` gates
      # its deposit observability on it with the payability half OUTERMOST, so an
      # asset named there is one the estate will issue a real address for, watch
      # and credit. Quote a fee for a chain `SETTLEMENT_RPC_URLS` cannot carry an
      # endpoint for and you get coins in and nothing out, with no error anywhere
      # because the deposits work. micro-org#373 §6.3 derived that ordering
      # constraint by hand; this enforces it, and it is what made adding BTC on
      # 2026-08-11 a checkable decision rather than a remembered one.
      #
      # The reachable set is read out of the sibling anchor, so wiring a chain
      # into one file makes it quotable in the other on the same commit and there
      # is no list here to drift.
      - name: No chain is open to deposits that settlement could not pay back out of
        working-directory: deploy
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-wallet-fee-quotes.py

      # ── A DEPLOY THAT FAILS HALFWAY IS AN OUTAGE, SO IT MUST FAIL BEFOREHAND ──
      #
      # `release-deploy.sh` shipped the whole release with one `docker compose
      # up -d`, and compose interleaves the phases: for each service in turn it
      # pulls the image and then recreates the container. One `denied` from GHCR
      # on the 30th of 48 images therefore aborted the deploy PARTWAY — some
      # services on the new release and the rest on the old one, a combination no
      # manifest describes and that `--rollback` cannot name a previous version
      # for, because the two halves are on different releases.
      #
      # A registry that answers `denied` or `TOO MANY REQUESTS` under load is
      # ordinary, and turning that into an estate-wide inconsistency is not.
      #
      # The behaviour under test is a MISBEHAVING REGISTRY, and no real one can be
      # asked to fail twice and then succeed, so `docker` is a stub playing a
      # scripted sequence per reference while `docker compose config` passes
      # through to the real CLI — the overlay merge and the interpolation that
      # decide which images get pulled are genuine. `compose up` is recorded and
      # never run.
      #
      # The ordering is asserted by the ORDER of the recorded invocations rather
      # than by their presence, because "it pulls and it switches" was true of the
      # broken version too.
      # It also covers the OTHER way that script stalled a release. On 2026-08-10
      # a deploy from the Windows/WSL app host ran for eighteen minutes and pulled
      # nothing: `~/.docker/config.json` inside the distro is Docker Desktop's
      # WINDOWS config, its `credsStore` needs an interactive Windows logon
      # session, and over ssh there is not one — so docker failed the credential
      # lookup before opening a connection, on every pull, for packages that are
      # public and needed no credential at all.
      #
      # The retry loop could not tell that from a busy registry, so it re-asked
      # ~50 references five times each at 45s of backoff apiece. A loop that
      # cannot succeed is not resilience, and the fixture proves both halves: the
      # helper is routed around before the first pull, and a credential failure
      # that reaches the loop stops it on the first reference.
      - name: A release is pulled in full before any container is replaced
        working-directory: deploy
        run: python3 scripts/check-release-deploy-pulls-before-switching.py

      # ── A FRESH HOST CANNOT BE PROVISIONED FROM DOCUMENTATION (micro-org#350) ─
      #
      # This repository reads files out of SIBLING repositories, under directory
      # names that are not the repository names — `micro-contracts` has to be
      # checked out as `contracts`. Nothing cloned them and nothing listed them,
      # so standing up the second app host the only signal was a traceback from
      # the middle of a bootstrap that had already started changing things:
      # `FileNotFoundError: '../contracts/packages/events/src/audit.ts'`.
      #
      # The table that clones them is checked rather than trusted, in both
      # directions, because a hand-kept prerequisite list is accurate on the day
      # it is written and the failure only ever shows up on a machine nobody is
      # testing on.
      - name: Every sibling repository this repo reads is a declared prerequisite
        working-directory: deploy
        run: python3 scripts/check-sibling-prerequisites.py

      # ── A CREDENTIAL IS A SECRET, AND A MISSPELT ONE IS SILENTLY ABSENT ──────
      #
      # Eighteen service blocks are handed a long-lived `cfsc_…` credential they
      # exchange for short-lived tokens, and the compose block's only job is to
      # pass it through as `NAME: ${NAME:-}`. That line has two silent failures.
      #
      # Wire it to the wrong variable name and it interpolates to EMPTY on every
      # host forever; every `env.ts` in the estate reads empty as absent, so the
      # container boots, serves, and falls back to whatever it has left with no
      # error anywhere. `estate-bootstrap.sh` minted `MARKET_IDENTITY_CREDENTIAL`
      # for months and nothing read it, and `estate-verify.sh` found six testnet
      # services running on an empty one.
      #
      # Paste the value instead of the interpolation and a real credential is in
      # a public repository, which is the failure that cannot be undone — the
      # remedy is a rotation, not a `git rm --cached`. The check never echoes a
      # value it rejects, because a CI log is a second public place.
      #
      # It also holds the emberkin transition to its ORDER. micro-emberkin#3 made
      # the credential the way it authenticates and kept `EMBERKIN_SERVICE_TOKEN`
      # accepted for the length of a rolling deploy, so removing the token before
      # the credential is present leaves neither variable satisfiable and the
      # service refuses to boot — taking `emberkin-migrate` with it.
      - name: Every service credential is an interpolation, spelt like its own variable
        working-directory: deploy
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-service-credential-wiring.py

      # ── ONE ESTATE'S ENV FILE, THE OTHER ESTATE'S TOKENS, AND NO COMPLAINT ───
      #
      # Bringing an estate up takes TWO `--env-file` paths, and until micro-org#238
      # every entry point treated them as independent values. Pair testnet's env
      # file with the mainnet tokens file and compose merges them in order and says
      # nothing: the stack comes up under testnet's project name, every banner in
      # `release-deploy.sh` says testnet — it derives the environment from the
      # estate file ALONE — and the containers hold mainnet's service credentials,
      # operator password and custody keyring selection.
      #
      # Nothing fails loudly, which is the whole problem. The credentials are real;
      # they belong to the other estate. The visible symptom is testnet identity
      # answering 401 to callers that look entirely correct, and the invisible one
      # is a component that does not reject them.
      #
      # The pairing is enforced at RUNTIME by `check-env-files-agree.sh`, because
      # `ESTATE_ENV` and `TOKENS_FILE` are both overridable and no static check can
      # see what an operator types. This step exercises that refusal against both
      # crossed pairs and both correct ones rather than grepping it, then reads
      # every tracked file that invokes compose and fails any single command whose
      # `--env-file` arguments name both estates — the Makefile spells a pairing out
      # four times.
      #
      # It also asserts both entry points still CALL the refusal. A guard nothing
      # invokes is a guard nothing runs, and this repository has shipped exactly
      # that before: `surface-routes.py` sat here for weeks with no CI step, which
      # is how the thing it guards went wrong to begin with.
      - name: No command pairs one estate's env file with the other's tokens
        working-directory: deploy
        run: python3 scripts/check-env-file-pairing.py

      # ── THE POOL'S WEBSOCKET CONFIGURATION IS COHERENT, OR IT IS A CRASH LOOP ─
      #
      # micro-org#289 gave micro-pool a Stratum transport a browser can dial, and
      # with it two boot REFUSALS: `IDENTITY_JWKS_URL` and `IDENTITY_ISSUER` are
      # both-or-neither, and `POOL_WEBSOCKET_PUBLIC_ORIGIN` set while identity is
      # unset refuses outright — advertising an endpoint nobody can authenticate
      # to is micro-org#285's defect with the sign flipped.
      #
      # Both refusals are right in the service and both are a crash loop in a
      # deploy, and this is the worst service in the file to ship one on. `pool`
      # sits behind `profiles: ["pool"]` and is started BY HAND, so nothing in an
      # ordinary `up` would touch it: the container that restarts forever is found
      # days after the commit by whoever finally wants a miner. The same argument
      # as the step above, about the same service, for the same reason.
      #
      # It reads the compose files with merge keys RESOLVED, which is the whole
      # reason it is a script and not a grep: the identity pair reaches `pool`
      # through the `*identity-trust` anchor, four thousand lines from the block
      # that uses it, so a text search for the two names finds nothing on the
      # service and would pass a compose that had genuinely dropped them.
      #
      # PyYAML for that reason, installed here rather than relied upon from the
      # tunnel step above — a check whose correctness depends on the ORDER of the
      # steps around it is one that breaks silently when somebody reorders them.
      # The script treats a missing PyYAML as a failure, never a skip, the same
      # call `cloudflared/gen.py --strict` makes.
      - name: The pool advertises a WebSocket it can actually authenticate
        working-directory: deploy
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-pool-websocket-config.py

      # ── TWO CONTAINERS, ONE HOST PORT, AND NO FILE COULD SEE THE OTHER ───────
      #
      # The backup overlay published `${CF_PORT_BASE:-4}130` and `trade-web` in
      # the estate file had owned it since trade-web shipped. The first attempt to
      # start the runner on mainnet built the image, created the container, and
      # died at the last step on `Bind for 127.0.0.1:4130 failed: port is already
      # allocated` (micro-org#328).
      #
      # It survived because the backup overlay is the ONE compose file here that
      # no deploy path renders: no release manifest names it, `release-deploy.sh`
      # never composes it, and its own header says to bring it up by hand. The two
      # files had never been in one model. `make config` already does this for the
      # telemetry and gateway overlays; the estate set had no equivalent.
      #
      # NOT `docker compose config`, which is the obvious answer and cannot run
      # here: the estate file needs `compose/estate/tokens.env` — untracked, mode
      # 0600, present on two hosts — and `CF_BACKUP_ENVIRONMENT` is a `:?`
      # variable, so the render fails outright without it. A check that only runs
      # where the mistake has already been made is not a check.
      - name: No two estate containers claim the same host port
        working-directory: deploy
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-compose-host-ports.py

      # ── A DOCUMENT THAT PRESCRIBES AN OVERLAY NOTHING DEPLOYS ────────────────
      #
      # `compose/docker-compose.design.yml` pinned all seventy-four services at
      # `2.5.4` and `docs/releasing.md` step 3 told an operator to pass it on
      # every testnet deploy. Testnet had not run 2.5.4 since 2026-08-08, because
      # every deploy since went through `release-deploy.sh`, which reads a release
      # manifest and never heard of that overlay. The file stopped being bumped
      # the moment the deploy path moved; the document went on prescribing it.
      #
      # Following it on 2026-08-11 rolled `mint` from `2026.08.21` back to
      # `2.5.4` — seventeen releases — in twelve seconds, with a green `up -d` and
      # a healthy container, and the old migrator then ran against the live
      # testnet schema (micro-org#414).
      #
      # A stale pin cannot be seen from inside the file that carries it: `2.5.4`
      # is a well-formed tag naming an image that really exists. What IS visible
      # is the disconnect — a file pinning the estate's own images that no deploy
      # path applies — and that is what this reads, in the document, in the
      # compose headers that quote the command, and in the file itself.
      #
      # No sibling checkout and no secrets: it reads tracked text and asks `git`
      # which files are tracked, so a rendered `docker-compose.release.yml` on a
      # deploy host is never mistaken for a committed pin.
      - name: No document prescribes an overlay no deploy path passes
        working-directory: deploy
        run: python3 scripts/check-docs-prescribe-deployed-overlays.py
